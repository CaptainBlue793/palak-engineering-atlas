# Engineering Atlas accounts API — Cloudflare Worker + D1.
# See ../ACCOUNTS.md for the one-time setup (login, create the database, secrets, deploy).
name = "atlas-accounts-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "atlas-accounts"
# Paste the id printed by `npx wrangler d1 create atlas-accounts` (local dev works without it).
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Sites allowed to call this API (comma-separated, exact origins).
ALLOWED_ORIGINS = "https://captainblue793.github.io,http://127.0.0.1:8080,http://localhost:8080"
# Sender for the sign-in email. onboarding@resend.dev works without a domain, but Resend then
# only delivers to your own Resend account address. Verify a domain in Resend to email anyone.
EMAIL_FROM = "Engineering Atlas <onboarding@resend.dev>"

# Daily clean-up of expired codes, sessions and old rate-limit rows.
[triggers]
crons = ["30 3 * * *"]

# Secrets (never in this file):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SERVER_SECRET     (a long random string)
# Local development reads them from api/.dev.vars (git-ignored; see .dev.vars.example).
