window.LLD_CARDS = [{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"After Session a = new Session(\"u1\"); Session b = a; b.extend(30); what does a.ttlMinutes() return? (A new session starts at 30.)","o":["30, because only b was extended","60","It doesn't compile","It depends on when the garbage collector runs"],"a":1,"w":"b = a copies the reference, so a and b point at the same object. Extending it through b changes the one object both variables see, so it is now 60."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"static void swap(Session x, Session y) { Session t = x; x = y; y = t; } is called as swap(a, b) , where a is user u1's session and b is u2's. What does a.userId() print afterwards?","o":["u2, because the sessions were swapped","It throws NullPointerException","u1, because only the method's copies of the references were swapped","u1, because swap made copies of both Session objects"],"a":2,"w":"Java copies each reference into x and y . The method swaps those two local copies, then its frame is discarded. The caller's a and b never changed. No object was copied either: only references are passed."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"Inside a method, Session s = new Session(\"u1\"); runs. Where do the variable s and the Session object live?","o":["s (a reference) is in the method's stack frame; the object is on the heap","Both are on the stack, because s is a local variable","Both are on the heap","s is on the heap; the object is in the stack frame"],"a":0,"w":"Local variables, including references, live in the frame of the call that declares them. Every object created with new lives on the heap. That is why the object can outlive the method, for example if it is returned or stored in a field."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"When does a Session object become eligible for garbage collection?","o":["As soon as the method that created it returns","When its reference count drops to zero, so two objects pointing at each other are never collected","When you call System.gc()","When no chain of references from a GC root (a live frame, a static field) reaches it any more"],"a":3,"w":"Java's collectors use reachability from GC roots. An object returned or stored in a field survives its creating method. Cycles are collected once nothing outside reaches them. System.gc() is only a hint and never frees a reachable object."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"Why is private static int activeSessions , incremented and decremented from constructors and a close() method, a risky design?","o":["Static fields are stored on the stack, so the value is lost between calls","It is one global value shared by every test and every thread: tests leak state into each other, and concurrent updates can be lost","Static fields can't be changed after the class loads","Each Session object gets its own copy, so the count is always 1"],"a":1,"w":"A static field has exactly one copy for the whole program. That makes it global mutable state: hidden from constructors, shared across tests, and racy under concurrency unless guarded. A counter object passed to whoever needs it avoids all three problems."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A field is declared as int tokens; with no modifier. Which code can read and write it?","o":["Only the class itself: no modifier means private","Any code anywhere: no modifier means public","The class itself and every class in the same package","The class itself and its subclasses only"],"a":2,"w":"Leaving out the modifier gives package-private access: the declaring class plus every class in the same package. To restrict it to the class, you must write private ."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A TokenBucket has private fields but a public setTokens(int) with no validation, and callers write if (b.getTokens() > 0) b.setTokens(b.getTokens() - 1) . What is the core design problem?","o":["The class can't guarantee 0 ≤ tokens ≤ capacity: any caller can set any value, and the spending rule is copied into every caller","Getters are slower than reading a field directly","The fields should be public so callers don't need getters","Nothing: the fields are private, so it is encapsulated"],"a":0,"w":"Private fields with an unchecked setter give callers full control of the state, so the class can promise nothing. The fix is an operation like tryAcquire() that does the check and the change inside the class."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"An ApiKey constructor does this.scopes = scopes; . The code that created the key later runs scopes.add(\"admin:write\") on its own variable. What happens, and what is the fix?","o":["Nothing happens: the key has a private field, so the caller's change goes to a different set","It throws, because the key's field is final","The key gains the scope; fix it by making the field final","The key gains the scope; fix it by copying in the constructor, e.g. Set.copyOf(scopes)"],"a":3,"w":"The key stored a reference to the caller's set, so both share one object. final only stops the field being re-pointed; the set itself can still change. Copying in the constructor gives the key its own set that no one else can reach."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A class returns Collections.unmodifiableList(orders) from a getter, and later adds a new order to orders internally. What does a caller holding the returned list see?","o":["The old contents: unmodifiableList made a copy","The new order too, because it is a read-only view; but the caller can't add or remove","An exception the next time it reads the list","The new order, and the caller can also add orders through it"],"a":1,"w":"unmodifiableList wraps the original list without copying. Reads go through to the live list, and writes throw UnsupportedOperationException . Use List.copyOf when you want a snapshot."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"Why is if (bucket.tryAcquire(now)) handle(req); a better design than if (bucket.available() > 0) { bucket.take(); handle(req); } ?","o":["Method calls with fewer characters run faster","It avoids needing a return value","The check and the change happen together inside the class, so the rule lives in one place and there's one method to make thread-safe","It lets callers skip the refill step when they are in a hurry"],"a":2,"w":"“Tell, don't ask.” Splitting the check ( available ) from the action ( take ) puts the rule in every caller and leaves a gap between check and act where another thread can take the last token. One method closes both problems."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"With the chapter's classes, Appender a = new JsonFileAppender(w); a.flush(); runs which method?","o":["Appender.flush , because a is declared as an Appender","FileAppender.flush , the nearest override in the object's class chain","JsonFileAppender.flush","It doesn't compile"],"a":1,"w":"The object is a JsonFileAppender , which doesn't override flush , so its method-table entry points at the nearest override up the chain: FileAppender.flush . The declared type only matters for the compile-time check that flush exists."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"Appender a = new FileAppender(w); a.rotate(); What happens?","o":["The file is rotated, because the object is a FileAppender","It throws ClassCastException at run time","It silently does nothing","A compile error: Appender has no rotate method"],"a":3,"w":"The compiler checks the call against the declared type, Appender , which has no rotate . The runtime class is never consulted for this check. You'd need a variable of type FileAppender (or a cast) to call it."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"A class has record(Object o) and record(String s) . Which runs for Object p = \"ok\"; audit.record(p); ?","o":["record(Object) : overloads are chosen at compile time from the argument's declared type","record(String) : the argument is really a String","Both run, in declaration order","It's ambiguous and doesn't compile"],"a":0,"w":"Overload resolution uses the declared type of the argument expression, Object . Dynamic dispatch applies only to the object the method is called on, not to argument types."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"InstrumentedHashSet overrides add (count++) and addAll (count += size) and calls super in both. After addAll of three new elements, what is the count?","o":["3","0, because super.addAll bypasses the overrides","6, because the inherited addAll calls add , which is dispatched to the override","9"],"a":2,"w":"addAll adds 3, then the inherited implementation calls add once per element, each dispatched to the override, adding 3 more. The subclass silently depends on how its parent is implemented: the fragile base class problem."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"A base-class constructor calls format(\"started\") . A subclass overrides format to use its private final String prefix , assigned in its own constructor after super() . What does the override see?","o":["The prefix, because final fields are set before any constructor runs","null , because the parent constructor runs before the subclass assigns prefix","A compile error: constructors can't call instance methods","The parent's format runs instead, because dispatch is disabled in constructors"],"a":1,"w":"Dispatch works inside constructors, so the override runs, but the subclass's constructor body hasn't run yet, and prefix still holds its default, null . Constructors should only call private or final methods."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"Several request handlers share a JSON codec field and the same error-mapping code, and differ in one step. What's the best structure?","o":["One interface with default methods holding the codec","Copy the shared code into each handler class","An interface callers depend on, plus an abstract class that implements it, holds the codec, and leaves the one step abstract","One concrete handler with a big switch on the endpoint name"],"a":2,"w":"Shared state needs a class, because interfaces have no fields. Keeping the interface means callers aren't tied to the skeleton, and handlers that don't fit it can implement the interface directly."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"A method is declared double total(List<Number> xs) . What happens when you call it with a List<Integer> ?","o":["It works: an Integer is a Number","Compile error: generic types are invariant, so change the parameter to List<? extends Number>","It compiles but throws ClassCastException","Compile error: change the parameter to List<? super Number>"],"a":1,"w":"List<Integer> is not a subtype of List<Number> . Since total only reads, the list is a producer: ? extends Number accepts lists of any Number subtype."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"You want a parameter you can add(Integer) to, which accepts a List<Integer> , a List<Number> or a List<Object> . Which type?","o":["List<Integer>","List<? extends Integer>","List<Object>","List<? super Integer>"],"a":3,"w":"The list consumes Integers, so it's ? super Integer : any list whose element type is Integer or a supertype. Any such list can safely hold an Integer."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"A class implements interfaces Sink and Audited , unrelated to each other, and both have a default describe() . The class doesn't declare describe() . What happens?","o":["Compile error: the class must override describe() , and may call Sink.super.describe() inside it","The first interface in the implements list wins","Both defaults run, one after the other","A runtime error the first time describe() is called"],"a":0,"w":"With no class method and no more-specific interface, Java refuses to guess. The class must override the method, and can delegate to either default explicitly with Interface.super.method() ."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"Why doesn't if (payload instanceof List<String>) compile?","o":["instanceof doesn't work with interfaces","Lists can't hold Strings","Type arguments are erased at run time, so the JVM can't tell a List<String> from a List<Integer>","It does compile, but always returns false"],"a":2,"w":"Erasure removes type arguments after compilation. At run time there is only List , so Java only allows instanceof List<?> (or plain List ) and makes you check elements yourself."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"A payment client supports 4 gateways and 3 optional features (retries, circuit breaker, metrics) that can be combined freely. How many classes does one-subclass-per-combination need, compared with composition?","o":["12 vs 7","7 vs 7","32 vs 7","64 vs 12"],"a":2,"w":"Each feature is on or off independently: 2³ = 8 combinations per gateway, times 4 gateways = 32 subclasses. Composition needs one class per gateway and one wrapper per feature: 4 + 3 = 7."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"CountingSet extends ForwardingSet and wraps a HashSet . Why does addAll of 3 elements now count 3 instead of 6?","o":["The inner HashSet's addAll calls its own add , which never reaches CountingSet's override","ForwardingSet disables dynamic dispatch","HashSet no longer calls add from addAll when wrapped","CountingSet only overrides add"],"a":0,"w":"The inner set is a separate object that doesn't know it's wrapped, so its self-calls go to its own methods. CountingSet counts only in its own add and addAll , which callers invoke directly."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"What is wrong with java.util.Stack extends Vector ?","o":["Vector is too slow to back a stack","A stack can't be generic","Stack should extend LinkedList instead","Every Stack inherits index-based insert and remove, so callers can break last-in-first-out: a stack is not a kind of Vector"],"a":3,"w":"It fails the substitution test in reverse: Vector's operations don't all make sense for a stack, but Stack exposes them anyway. Holding a list internally, as ArrayDeque does for the Deque interface, would have kept the operations to push, pop and peek."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"Which is a good use of inheritance?","o":["Extending HashMap to log every put","A sealed interface Command permits Get, Set, Delete for a key-value store protocol you own","class RetryingAuditedSmsNotifier extends AuditedSmsNotifier","Extending a class to reuse one of its helper methods"],"a":1,"w":"A sealed hierarchy is closed, owned by you, and each variant truly is a Command. The others extend a class not designed for it, encode feature combinations as classes, or inherit a whole API to reuse one method."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"What is a genuine downside of composition?","o":["Wrapped objects can't be swapped at run time","It couples you to the wrapped class's internal self-calls","Forwarding a large interface is boilerplate, and calls the inner object makes to itself skip the wrappers","A class can only hold one other object"],"a":2,"w":"Forwarding every method takes code (write a forwarding class once to contain it), and the inner object's calls to this bypass any wrapper. The other options describe inheritance's problems, or aren't true."},{"n":0.6,"ti":"Value Objects, Enums & Immutability","f":"p6-value-objects.html","lv":"Prerequisites","q":"A class overrides equals to compare host and port but doesn't override hashCode . You add two equal instances to a HashSet . What is the set's size, most likely?","o":["1, because equals says they're the same","2, because their identity hash codes differ, so they land in different buckets and equals is never called","0, because the set rejects keys without hashCode","It throws an exception on the second add"],"a":1,"w":"The set picks a bucket from hashCode . The default identity hash differs between the two objects, so the second one goes to a different bucket where there's nothing to compare with. The contract was broken, so the set can't do its job."},{"n":0.6,"ti":"Value Objects, Enums & Immutability","f":"p6-value-objects.html","lv":"Prerequisites","q":"A mutable key is put in a HashMap , then one of its fields used in hashCode is changed. What does map.get(sameKeyObject) return?","o":["The value, because it is literally the same object","A ConcurrentModificationException","The value, because HashMap rehashes keys when they change","Usually null : the new hash points at a different bucket, and the entry is stranded in the old one"],"a":3,"w":"HashMap computes the hash once at insertion and never looks again. After the change, lookups go to the bucket for the new hash, while the entry sits in the old one. Keys should be immutable."},{"n":0.6,"ti":"Value Objects, Enums & Immutability","f":"p6-value-objects.html","lv":"Prerequisites","q":"record Route(String path, List<HostAndPort> backends) {} is created with an ArrayList the caller keeps. Is the record immutable?","o":["Only shallowly: the caller can still change the list; copy it with List.copyOf in a compact constructor","Yes: record fields are final","Yes: records copy their components automatically","No: record fields can be reassigned through setters"],"a":0,"w":"Final fields stop reassignment, not changes to the object a field points at. Records generate no setters, but they don't copy components either. A compact constructor with backends = List.copyOf(backends); makes it truly immutable."},{"n":0.6,"ti":"Value Objects, Enums & Immutability","f":"p6-value-objects.html","lv":"Prerequisites","q":"Why store an amount like $19.99 as long 1999 (cents) rather than double 19.99 ?","o":["A long uses less memory than a double","Doubles can't be negative","Binary floating point can't represent most decimal fractions exactly, so sums drift, while integer cents are exact","Payment gateways reject decimals"],"a":2,"w":"0.1 has no exact binary representation, so 0.1 + 0.2 != 0.3 in a double, and errors accumulate over many operations. Integer minor units (or BigDecimal) are exact. Both a long and a double are 8 bytes."},{"n":0.6,"ti":"Value Objects, Enums & Immutability","f":"p6-value-objects.html","lv":"Prerequisites","q":"Jobs are stored with state.ordinal() . Someone adds PAUSED between RUNNING and SUCCEEDED . What happens to existing rows?","o":["Nothing: ordinals are fixed when the enum is first compiled","Stored numbers for SUCCEEDED and later now decode as a different state: succeeded jobs read back as PAUSED","The application fails to start","Only new rows are affected"],"a":1,"w":"The ordinal is just the declaration position. Inserting a constant shifts every later one, and old rows are silently misread. Persist name() or an explicit code."},{"n":0.7,"ti":"Exceptions & Error Contracts","f":"p7-exceptions.html","lv":"Prerequisites","q":"Which exception is unchecked, so the compiler doesn't force callers to handle it?","o":["IOException","SQLException","IllegalArgumentException","InterruptedException"],"a":2,"w":"IllegalArgumentException extends RuntimeException , so it's unchecked. The other three extend Exception but not RuntimeException , so they're checked."},{"n":0.7,"ti":"Exceptions & Error Contracts","f":"p7-exceptions.html","lv":"Prerequisites","q":"In a try-with-resources, the body throws SQLException A , then a resource's close() throws SQLException B . What propagates?","o":["A, with B attached as a suppressed exception","B, because it happened last","Both, as two separate exceptions","Neither: try-with-resources catches them"],"a":0,"w":"The body's exception is the primary one. Exceptions thrown while closing are added to it with addSuppressed , so the original cause is never masked."},{"n":0.7,"ti":"Exceptions & Error Contracts","f":"p7-exceptions.html","lv":"Prerequisites","q":"try (Connection c = ...; PreparedStatement ps = c.prepareStatement(sql); ResultSet rs = ps.executeQuery()) { ... } . In what order are they closed?","o":["Connection, PreparedStatement, ResultSet","Whatever order the garbage collector finds them","All at once, in parallel","ResultSet, PreparedStatement, Connection"],"a":3,"w":"Resources close in the reverse of the order they were opened. Each one depends on the one before it, so the most dependent is closed first."},{"n":0.7,"ti":"Exceptions & Error Contracts","f":"p7-exceptions.html","lv":"Prerequisites","q":"A user lookup can fail in two ways: no user has that email, or the database is unreachable. How should findByEmail express them?","o":["Return null for both","Return Optional.empty() for no such user; throw for the unreachable database","Throw a checked exception for both","Return Optional.empty() for both"],"a":1,"w":"A missing user is a normal outcome, and Optional puts it in the return type. An unreachable database means the method couldn't do its job, so it throws. Returning empty for that would make an outage look like “no such user”."},{"n":0.7,"ti":"Exceptions & Error Contracts","f":"p7-exceptions.html","lv":"Prerequisites","q":"Why write throw new GatewayUnavailableException(\"stripe timed out\", e) instead of leaving out e ?","o":["The constructor requires two arguments","It makes the exception checked","It keeps the original exception as the cause, so the stack trace still shows the real low-level failure","It retries the request automatically"],"a":2,"w":"Passing e sets getCause() . Logs print the whole chain (“Caused by: HttpTimeoutException…”), so translating the exception hides the low-level type from callers without hiding it from whoever debugs the failure."},{"n":0.8,"ti":"Reading UML: Class & Sequence Diagrams","f":"p8-reading-uml.html","lv":"Prerequisites","q":"A dashed line from MapCache to Cache with a hollow triangle at Cache . What's the Java?","o":["class MapCache extends Cache","MapCache has a field of type Cache","MapCache takes a Cache as a parameter","class MapCache implements Cache"],"a":3,"w":"Dashed plus hollow triangle is realization: implementing an interface. A solid line with a hollow triangle would be extends ."},{"n":0.8,"ti":"Reading UML: Class & Sequence Diagrams","f":"p8-reading-uml.html","lv":"Prerequisites","q":"A line joins Order and LineItem , with a filled diamond at the Order end and 1..* at the LineItem end. What does it say?","o":["Each line item owns one or more orders","An order owns at least one line item, and the line items don't outlive the order","An order may or may not have line items, which are shared with other orders","LineItem extends Order"],"a":1,"w":"The filled diamond on Order means composition: Order is the whole and owns the parts' lifecycle. 1..* at the LineItem end means each order has one or more of them."},{"n":0.8,"ti":"Reading UML: Class & Sequence Diagrams","f":"p8-reading-uml.html","lv":"Prerequisites","q":"In a class box, what does - tokens: int mean?","o":["A private field named tokens of type int","A method that decrements tokens","A public int constant","A field that has been removed"],"a":0,"w":"The minus sign is private visibility, and UML writes the type after a colon: private int tokens; ."},{"n":0.8,"ti":"Reading UML: Class & Sequence Diagrams","f":"p8-reading-uml.html","lv":"Prerequisites","q":"class Router { Response dispatch(Request req) { ... } } . Router has no field of type Request. Which line do you draw from Router to Request?","o":["Association: a solid line","Composition: a filled diamond at Router","Dependency: a dashed line with an open arrow to Request","None: parameters are never shown"],"a":2,"w":"Using a type only as a parameter, local variable or return type is a dependency. Association needs a field that keeps a reference to it."},{"n":0.8,"ti":"Reading UML: Class & Sequence Diagrams","f":"p8-reading-uml.html","lv":"Prerequisites","q":"In a sequence diagram, what does a dashed arrow from ApiHandler back to Client usually mean?","o":["An asynchronous call from ApiHandler to Client","A return: the response going back to the caller","That ApiHandler implements Client","A failed call"],"a":1,"w":"Dashed arrows are returns. Calls are solid; an open arrowhead on a solid line marks an asynchronous message."},{"n":1,"ti":"What an LLD Interview Tests","f":"01-lld-interview.html","lv":"Principles","q":"“Design a rate limiter” comes up in an LLD round. Which answer fits the round?","o":["Redis cluster, a gateway fleet and a replication strategy across regions","The fastest possible sliding-window algorithm, analysed for time complexity","A RateLimiter interface, algorithms as swappable strategies, per-client state, and thread-safe Java for the core","A list of every rate-limiting algorithm and its history"],"a":2,"w":"LLD is about classes and code inside one program: interfaces at the variation points and correct, extensible Java. The first answer is the HLD version of the question, and the second the DSA version."},{"n":1,"ti":"What an LLD Interview Tests","f":"01-lld-interview.html","lv":"Principles","q":"Why spend the first few minutes on requirements instead of starting on classes?","o":["The use cases and constraints decide which classes and interfaces you need; skipping them means redesigning mid-code","Interviewers reward long discussions more than code","To avoid having to write code at all","Because the rubric requires exactly five minutes on requirements"],"a":0,"w":"Questions like “concurrent or not?” and “which features are in scope?” change the design. Settling them first, and writing them down, is cheaper than discovering them at minute 30."},{"n":1,"ti":"What an LLD Interview Tests","f":"01-lld-interview.html","lv":"Principles","q":"The interviewer asks for weekend pricing at minute 35. Which answer shows the strongest design?","o":["“That wasn't in the requirements.”","Add if (isWeekend) branches inside the fee calculation method","Rewrite the Ticket class to store the day of the week","“Pricing is behind the PricingStrategy interface, so it's one new implementation, picked by date in the factory. Nothing else changes.”"],"a":3,"w":"A good follow-up answer names the variation point from the diagram, adds one class, and says what stays untouched. That's the evidence of extensibility the round is looking for."},{"n":1,"ti":"What an LLD Interview Tests","f":"01-lld-interview.html","lv":"Principles","q":"Which of these is not something an LLD rubric typically scores?","o":["Whether interfaces sit at the real variation points","Whether your design matches the one “correct” answer for the problem","Whether the code is compiling-quality Java","Whether you handle concurrency on shared state"],"a":1,"w":"There is no single correct design. Rubrics score the quality and justification of your decisions: scope, abstractions, principles, code, extensibility, concurrency and communication."},{"n":1,"ti":"What an LLD Interview Tests","f":"01-lld-interview.html","lv":"Principles","q":"You have 14 minutes to code a parking-lot design with eight classes. What's the best plan?","o":["Write all eight classes quickly in pseudo-code","Write getters and setters for every class first","Write the two or three classes that carry the design in real Java, and stub the rest with one-line comments saying what they do","Skip code and keep refining the diagram"],"a":2,"w":"Depth on the interesting parts, such as allocation and fee calculation, shows more than breadth on trivial classes. Saying what you're skipping keeps the design complete without spending the minutes."},{"n":2,"ti":"From Requirements to Classes","f":"02-requirements-to-classes.html","lv":"Principles","q":"The interviewer confirms that short links can expire. What should that add to the design?","o":["A background thread that deletes each link at its exact expiry time","An expiresAt on the link, an isExpired(now) check, and an injected Clock","A new Expiry entity class with its own repository","Nothing: expiry is an HLD concern"],"a":1,"w":"Expiry is a rule about one link, so it lives on the link, checked when the link is resolved. Injecting a Clock makes “one second after expiry” testable. Cleanup of old links can come later, as a separate concern."},{"n":2,"ti":"From Requirements to Classes","f":"02-requirements-to-classes.html","lv":"Principles","q":"In “each car in the parking lot has a colour”, what should colour become?","o":["A Colour class with getters","An interface, in case colours change","A field (or an enum-typed field) on the vehicle, since it has no behaviour or rules of its own","An actor"],"a":2,"w":"A candidate that just holds a value, with no rules, behaviour or variation, is a field. An enum type is reasonable if the set of colours is fixed and matters to the design."},{"n":2,"ti":"From Requirements to Classes","f":"02-requirements-to-classes.html","lv":"Principles","q":"Why make Alias a value object instead of passing String alias around?","o":["It's validated once in its constructor, so every method that takes an Alias can trust it, and it can't be mixed up with other strings","Records are faster than strings","So it can be changed after creation","Because every noun must become a class"],"a":0,"w":"A value object turns a rule (“4–32 characters from this set”) into a type. Invalid aliases can't exist, and a method signature like resolve(Alias) can't be called with a target URL by mistake."},{"n":2,"ti":"From Requirements to Classes","f":"02-requirements-to-classes.html","lv":"Principles","q":"Two users request the custom alias launch at the same moment. Which repository design prevents both from succeeding?","o":["if (repo.find(alias).isEmpty()) repo.save(link); in the service","Retrying the save three times","Checking twice before saving","An atomic insertIfAbsent(link) in the repository contract, which returns false for the second one"],"a":3,"w":"Check-then-save has a gap between the check and the save where both threads can pass. The check and the insert must be one atomic operation: putIfAbsent in memory, or a unique index in a database."},{"n":2,"ti":"From Requirements to Classes","f":"02-requirements-to-classes.html","lv":"Principles","q":"Which requirement is the most reasonable to cut out loud in a 45-minute shortener round?","o":["Redirecting visitors to the target URL","An admin dashboard with per-country click charts","Validating custom aliases","Making alias creation safe for concurrent requests"],"a":1,"w":"The dashboard is a separate feature built on top of the core. The other three are the core: the main use case, a data rule, and the concurrency problem the interviewer is most likely to probe."},{"n":3,"ti":"SOLID I: Single Responsibility & Open/Closed","f":"03-solid-srp-ocp.html","lv":"Principles","q":"In “a class should have one reason to change”, what is a “reason to change”?","o":["A single public method","A bug report","A group of people, such as finance or operations, whose requests would change the class","A line of code that might be edited"],"a":2,"w":"SRP is about who drives change. If requests from different groups land in the same class, their changes collide. One method per class is not the goal."},{"n":3,"ti":"SOLID I: Single Responsibility & Open/Closed","f":"03-solid-srp-ocp.html","lv":"Principles","q":"Which sign most strongly suggests a class has several responsibilities?","o":["Its fields split into groups that are used by separate, non-overlapping groups of methods","It has more than ten lines","It implements an interface","It has a constructor with two parameters"],"a":0,"w":"Separate field-and-method groups mean low cohesion: the class is really several classes sharing a name. Size alone isn't the test."},{"n":3,"ti":"SOLID I: Single Responsibility & Open/Closed","f":"03-solid-srp-ocp.html","lv":"Principles","q":"The exporter chooses output with switch (format) , copied in three methods. What does adding XLSX require?","o":["A new class only","Nothing, if the default case handles it","A config change","Editing three tested methods, and hoping none is missed"],"a":3,"w":"A switch spread over several places means each new variant modifies existing code in each of them. That's exactly what open/closed is designed to avoid."},{"n":3,"ti":"SOLID I: Single Responsibility & Open/Closed","f":"03-solid-srp-ocp.html","lv":"Principles","q":"With formats behind ReportFormatter and chosen from a map, what does adding XLSX involve?","o":["Editing every existing formatter","A new XlsxFormatter class plus one registration line where formatters are wired","Editing SalesCalculator","Changing the ReportFormatter interface"],"a":1,"w":"The extension is a new class; the only edit is at the wiring point, which is designed to change. Tested formatters and the calculator are untouched."},{"n":3,"ti":"SOLID I: Single Responsibility & Open/Closed","f":"03-solid-srp-ocp.html","lv":"Principles","q":"When is a plain switch the better design?","o":["Never: a switch always violates open/closed","Whenever there are more than five cases","When the cases are a closed set you own, like an enum of job states, and new cases are rare","When the cases are plugins written by other teams"],"a":2,"w":"A closed set gains nothing from extension points, and an exhaustive switch over an enum or sealed type is short, clear and compiler-checked. Plugins from other teams are the opposite case, where OCP pays off."},{"n":4,"ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","f":"04-solid-lsp-isp-dip.html","lv":"Principles","q":"BlobStore.put is documented to accept blobs up to 5 GB. One implementation throws for anything over 1 MB. Which Liskov rule does it break?","o":["It weakens a postcondition","It breaks an invariant","It strengthens a precondition: it rejects input the type promised to accept","None: implementations may choose their own limits"],"a":2,"w":"A caller that correctly relies on the 5 GB contract fails with this implementation. Accepting less than the type accepts is a stronger precondition, which subtypes may not have."},{"n":4,"ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","f":"04-solid-lsp-isp-dip.html","lv":"Principles","q":"An ArchiveStore can only read, so it implements BlobStore.put by throwing UnsupportedOperationException . What's the better design?","o":["Split out a read-only interface ( BlobReader ) that ArchiveStore implements, and have clients that only read depend on that","Make put silently do nothing","Catch the exception in every caller","Add isWritable() and make every caller check it"],"a":0,"w":"Doing nothing silently breaks the postcondition, and checks in every caller spread the problem. The honest fix is an interface the archive can fully honour, which is interface segregation serving Liskov."},{"n":4,"ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","f":"04-solid-lsp-isp-dip.html","lv":"Principles","q":"LoginService takes a 13-method UserRepository but only calls findByEmail . What does interface segregation suggest?","o":["Delete the other twelve methods","Make LoginService extend the repository","Pass the database connection directly","A small UserLookup role interface for LoginService, implemented by the same repository class alongside other role interfaces"],"a":3,"w":"Other clients still need the other methods, so they stay, grouped into role interfaces. LoginService depends only on what it uses, and its test fake shrinks to a couple of methods."},{"n":4,"ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","f":"04-solid-lsp-isp-dip.html","lv":"Principles","q":"Under dependency inversion, where should the PaymentGateway interface live?","o":["In the Stripe adapter package, next to its implementation","In the billing package, expressed in billing's own types, with adapters depending on it","In a shared utils package","Inside the Stripe SDK"],"a":1,"w":"The high-level module owns the abstraction, so the source dependency points from infrastructure to billing. An interface in the adapter's package, or shaped like the SDK, leaves billing depending on the detail."},{"n":4,"ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","f":"04-solid-lsp-isp-dip.html","lv":"Principles","q":"What is a contract test?","o":["A legal agreement with a vendor","A test that only checks method signatures compile","One set of tests describing an interface's promises, run against every implementation","A load test"],"a":2,"w":"An abstract test class with a factory method per implementation. Each implementation must pass the same behavioural tests, which is a practical check that it can be substituted for the interface."},{"n":5,"ti":"Coupling, Cohesion & the Law of Demeter","f":"05-coupling-cohesion.html","lv":"Principles","q":"What kind of coupling is exporter.export(report, true, false) ?","o":["Data coupling","Control coupling: the flags tell the callee which internal branch to take","Temporal coupling","No coupling"],"a":1,"w":"Boolean flags that select behaviour make the caller know about the callee's internal branches. Split the method ( exportCsv , exportPdf ) or pass a strategy."},{"n":5,"ti":"Coupling, Cohesion & the Law of Demeter","f":"05-coupling-cohesion.html","lv":"Principles","q":"Which line breaks the Law of Demeter?","o":["orders.stream().filter(Order::isOpen).map(Order::total).toList()","this.bucket.tryAcquire(now)","request.headers().get(\"Host\") on a request record","order.getCustomer().getAddress().getCountry().getTaxRate() in a service"],"a":3,"w":"The train wreck navigates the internals of three behavioural objects the service doesn't own. Streams are designed to chain, a field call is allowed, and reading a data record is fine."},{"n":5,"ti":"Coupling, Cohesion & the Law of Demeter","f":"05-coupling-cohesion.html","lv":"Principles","q":"A class's methods split into three groups, and each group uses its own two fields and none of the others. What does that say?","o":["Low cohesion: it's really three classes sharing one name","High cohesion: every field is used","Low coupling","It follows the Law of Demeter"],"a":0,"w":"Cohesion is about methods and fields working together. Disjoint groups are separate responsibilities, and each group is a candidate class."},{"n":5,"ti":"Coupling, Cohesion & the Law of Demeter","f":"05-coupling-cohesion.html","lv":"Principles","q":"Username and coupon-code validation use identical regexes today, owned by different teams. Should you merge them into one shared pattern?","o":["Yes: DRY forbids identical code","Yes, and add a flag for when they differ","No: they're different knowledge that changes for different reasons, and merging them creates the wrong abstraction","No: regexes can't be shared in Java"],"a":2,"w":"DRY is about one representation per piece of knowledge. These look alike by coincidence; merging them couples two teams' rules, and a flag would add control coupling."},{"n":5,"ti":"Coupling, Cohesion & the Law of Demeter","f":"05-coupling-cohesion.html","lv":"Principles","q":"Eleven classes call PaymentGateway directly. What does that high fan-in suggest?","o":["It should be split into eleven classes","Its API should be stable, ideally an interface, because any change to it breaks eleven callers","It has too many dependencies of its own","Nothing: fan-in doesn't matter"],"a":1,"w":"Fan-in counts who depends on you. The more callers, the more a change costs, so high fan-in classes should have narrow, stable, interface-shaped APIs."},{"n":6,"ti":"Modeling Relationships","f":"06-relationships.html","lv":"Principles","q":"A channel creates its messages, messages belong to exactly one channel, and deleting the channel deletes them. Which relationship is it?","o":["Association","Composition","Aggregation","Dependency"],"a":1,"w":"The whole creates the parts, doesn't share them, and they share its lifecycle. That's composition."},{"n":6,"ti":"Modeling Relationships","f":"06-relationships.html","lv":"Principles","q":"Each user-channel membership has a role and a join date. Where do those fields go?","o":["On User , as a map from channel to role","On Channel , as two parallel lists","On both, to make lookups fast","On a Membership class representing the pair, like a join table"],"a":3,"w":"The data describes the relationship, not either end. Making the relationship a class gives it one home and avoids two copies drifting apart."},{"n":6,"ti":"Modeling Relationships","f":"06-relationships.html","lv":"Principles","q":"A workspace has many channels, and callers usually fetch one by its id. What's the best field type?","o":["List<Channel> , searched each time","Channel[]","Map<ChannelId, Channel>","Optional<Channel>"],"a":2,"w":"A * multiplicity looked up by key is a map: one channel per id and O(1) lookup. A list would need a linear search on every request."},{"n":6,"ti":"Modeling Relationships","f":"06-relationships.html","lv":"Principles","q":"Channel has a public Set<User> members and User a public Set<Channel> channels . What goes wrong?","o":["Updates can change one side but not the other, and generated toString/JSON can recurse between them","Nothing: two sets make lookups faster both ways","Java doesn't allow two classes to refer to each other","Sets can't hold objects with ids"],"a":0,"w":"Two public copies of one fact drift apart, and mutual references create cycles for toString , hashCode and serialization. Keep one source of truth, or one method that updates private copies together."},{"n":6,"ti":"Modeling Relationships","f":"06-relationships.html","lv":"Principles","q":"Why does the Message record store UserId author rather than a User object?","o":["Records can't hold objects","Ids are faster to compare than objects","It refers to another entity without owning it: no cycles, no keeping a user graph alive, and no stale copy of the user's data","So the message can change its author later"],"a":2,"w":"Referencing entities across boundaries by id keeps object graphs small, avoids reference cycles, and matches how the data is stored. Current user details are fetched when needed."},{"n":7,"ti":"Class APIs & Contracts","f":"07-class-contracts.html","lv":"Principles","q":"Where should a class validate its arguments?","o":["In every private helper, to be safe","Nowhere: callers are responsible","At public constructors and methods, where data enters; then trust it inside","Only in tests"],"a":2,"w":"The boundary is where untrusted data arrives. Checking there once, and failing fast, gives clear errors near the bad call without cluttering every internal method."},{"n":7,"ti":"Class APIs & Contracts","f":"07-class-contracts.html","lv":"Principles","q":"What's the best replacement for void setTimeout(int timeout) ?","o":["void setTimeout(Duration timeout)","void setTimeout(long timeout)","void setTimeoutMillisOrSeconds(int t, boolean seconds)","void setTimeout(String timeout)"],"a":0,"w":"Duration carries its unit, so Duration.ofSeconds(30) and Duration.ofMillis(30) can't be confused. The other options keep the unit in the caller's head or add a flag."},{"n":7,"ti":"Class APIs & Contracts","f":"07-class-contracts.html","lv":"Principles","q":"Which method breaks command-query separation in a harmful way?","o":["boolean tryAcquire(long now) on a shared rate limiter","void archive()","boolean isExpired(Instant now)","Money getBalance() that also deducts an inquiry fee"],"a":3,"w":"A query that changes state makes innocent reads, like a log line or a debugger, charge the customer. tryAcquire merges check and act on purpose, for atomicity on shared state."},{"n":7,"ti":"Class APIs & Contracts","f":"07-class-contracts.html","lv":"Principles","q":"charge(long amount, String currency, String customerId) is called as charge(1999, \"cus_42\", \"USD\") . What's the best fix?","o":["A comment explaining the parameter order","charge(Money amount, CustomerId customer) , so currency travels with the amount and the id has its own type","Validate that currency is three letters","Rename the parameters"],"a":1,"w":"With distinct types the swapped call doesn't compile. Validation would catch this one swap at run time, but not a swap between two valid-looking strings. Comments and names don't reach the call site."},{"n":7,"ti":"Class APIs & Contracts","f":"07-class-contracts.html","lv":"Principles","q":"hold(seats, holder, ttl) documents “all or nothing”. What may a caller assume if it throws SeatUnavailableException ?","o":["Some seats may be held and must be released","The show has been cancelled","No seat changed state; there's nothing to clean up","The caller passed invalid arguments"],"a":2,"w":"The postcondition on failure is part of the contract. “All or nothing” means a failed call left everything as it was, so the caller can simply offer other seats."},{"n":8,"ti":"Dependency Injection & Testability","f":"08-dependency-injection.html","lv":"Principles","q":"What's the main problem with private final StripeClient stripe = new StripeClient(key); inside OrderService ?","o":["It makes the class slower","Fields can't be initialised inline","The class is glued to Stripe: tests hit the real network, and no other gateway or fake can be substituted","It violates encapsulation because the field is final"],"a":2,"w":"Creating a collaborator inside the class fixes the choice forever. Receiving a PaymentGateway through the constructor lets production pass Stripe and tests pass a fake."},{"n":8,"ti":"Dependency Injection & Testability","f":"08-dependency-injection.html","lv":"Principles","q":"Why prefer constructor injection over setter injection for required dependencies?","o":["The object can't exist without them, fields can be final, and every dependency is visible where the object is built","Setters are slower","Constructors can't throw exceptions","Setter injection is not allowed in Java"],"a":0,"w":"Setters allow half-built objects and require callers to remember to call them, which is temporal coupling. A constructor makes completeness a compile-time fact."},{"n":8,"ti":"Dependency Injection & Testability","f":"08-dependency-injection.html","lv":"Principles","q":"Where should concrete classes like StripeGateway and SmtpMailer be instantiated?","o":["Inside each service that uses them","In a static utility class that any code can call","Lazily, the first time a method needs them","In one composition root near main , which wires the whole object graph"],"a":3,"w":"Keeping all wiring in one place means only one piece of code knows the concrete choices, and swapping an implementation is a one-line change."},{"n":8,"ti":"Dependency Injection & Testability","f":"08-dependency-injection.html","lv":"Principles","q":"What's wrong with ServiceLocator.get(PaymentGateway.class) inside a service?","o":["It can't return interfaces","It hides the dependency from the constructor, turns missing wiring into a run-time error, and makes tests configure global state","It creates a new gateway on every call","Nothing: it's equivalent to constructor injection"],"a":1,"w":"A locator is swappable, but the class's needs are invisible from outside, and the registry is shared global state that every test must set up and reset."},{"n":8,"ti":"Dependency Injection & Testability","f":"08-dependency-injection.html","lv":"Principles","q":"After refactoring to constructor injection, a class needs nine collaborators. What does that suggest?","o":["Switch to field injection to shorten the constructor","Use a service locator instead","The class probably has too many responsibilities and should be split","Nothing: nine is normal"],"a":2,"w":"Injection made the dependencies visible; the count is a single-responsibility smell. Hiding it with fields or a locator keeps the problem and loses the warning."},{"n":9,"ti":"Singleton (and Why It’s Usually Wrong)","f":"09-singleton.html","lv":"Design Patterns","q":"Two threads call an unsynchronised lazy get() ( if (instance == null) instance = new X(); ) at the same moment. What can happen?","o":["Nothing: assignment to a static field is atomic, so only one instance is made","Both see null and both construct: two instances exist, and one caller keeps a different object","The JVM throws an exception","One thread blocks until the other finishes"],"a":1,"w":"The check and the assignment are separate steps, so both threads can pass the check. Each atomic step is safe on its own; the sequence isn't."},{"n":9,"ti":"Singleton (and Why It’s Usually Wrong)","f":"09-singleton.html","lv":"Design Patterns","q":"Why does double-checked locking need the instance field to be volatile ?","o":["To make the lock faster","So the field can be reassigned","Because static fields can't be read without it","Without it, the reference can be published before the constructor finishes, so another thread may use a half-initialised object"],"a":3,"w":"The unsynchronised first check can see a non-null reference that was written before the object's fields. A volatile write can't be reordered before the constructor's writes, and a volatile read sees everything written before it."},{"n":9,"ti":"Singleton (and Why It’s Usually Wrong)","f":"09-singleton.html","lv":"Design Patterns","q":"Why is the holder-class idiom thread-safe without any synchronized keyword?","o":["The JVM initialises the nested class once, under its own lock, the first time get() touches it, and publishes the result to every thread","Nested classes are always thread-safe","Static methods can't run concurrently","It isn't thread-safe"],"a":0,"w":"Class initialisation is specified to happen exactly once with proper visibility. The holder idiom borrows that guarantee and delays it until first use."},{"n":9,"ti":"Singleton (and Why It’s Usually Wrong)","f":"09-singleton.html","lv":"Design Patterns","q":"What is the main testing problem with calling FeatureFlags.getInstance() inside business classes?","o":["Singletons are slow to construct","Tests can't call static methods","Tests can't substitute a fake, and flag changes made in one test leak into the tests that run after it","The flags are always false in tests"],"a":2,"w":"A global instance is shared by every test in the JVM and hidden from constructors. Passing a FeatureFlags object in lets each test build its own."},{"n":9,"ti":"Singleton (and Why It’s Usually Wrong)","f":"09-singleton.html","lv":"Design Patterns","q":"What's the usual better alternative to a Singleton for a metrics registry?","o":["A static utility class with static methods","Create one instance in the composition root and inject it into each class that records metrics","A new instance in every class that needs one","A service locator"],"a":1,"w":"One shared instance, created once and passed explicitly, gives the “only one” you wanted, with visible dependencies and a fresh instance per test."},{"n":10,"ti":"Factory Method & Abstract Factory","f":"10-factories.html","lv":"Design Patterns","q":"Which of these can a static factory method do that a constructor can't?","o":["Take parameters","Throw an exception for invalid input","Return a previously created, shared instance instead of a new one","Initialise final fields"],"a":2,"w":"A constructor always creates a new object. A static factory like Integer.valueOf or Collections.emptyList() can return a cached one. Both can take parameters and throw."},{"n":10,"ti":"Factory Method & Abstract Factory","f":"10-factories.html","lv":"Design Patterns","q":"What problem does Abstract Factory solve?","o":["Creating families of related objects that must be used together, without mixing families","Making sure only one instance of a class exists","Building an object with many optional parameters","Choosing one algorithm at run time"],"a":0,"w":"One factory per family (AWS, GCP, local) creates every product in that family, so an S3 store never ends up paired with a Pub/Sub queue. The other options are Singleton, Builder and Strategy."},{"n":10,"ti":"Factory Method & Abstract Factory","f":"10-factories.html","lv":"Design Patterns","q":"With a Platform abstract factory, what does adding Azure support involve?","o":["Editing every service that uses a blob store","Adding an Azure method to the Platform interface","Nothing: it works automatically","One new AzurePlatform class implementing every creation method, plus one case where the platform is chosen"],"a":3,"w":"New families are the cheap direction: one new implementation, selected in the composition root. Adding a new product would be the expensive direction."},{"n":10,"ti":"Factory Method & Abstract Factory","f":"10-factories.html","lv":"Design Patterns","q":"A registry is asked to create a gateway for an unknown key. What should it do?","o":["Return null","Throw with a message that names the key and lists the known keys","Return a default card gateway","Register a new empty gateway"],"a":1,"w":"Failing fast with context turns a typo or missing registration into an obvious error. Null or a silent default pushes the failure somewhere harder to debug, or charges the wrong way."},{"n":10,"ti":"Factory Method & Abstract Factory","f":"10-factories.html","lv":"Design Patterns","q":"DriverManager.getConnection(\"jdbc:mysql://…\") throws “No suitable driver found”. What's the most likely cause?","o":["The database server is down","The password is wrong","No registered driver accepted the URL: usually the MySQL driver JAR isn't on the classpath, or the URL prefix has a typo","JDBC doesn't support MySQL"],"a":2,"w":"DriverManager asks every registered driver whether it accepts the URL before any network connection. If none does, it fails immediately. A down server or bad password would fail later, inside the chosen driver's connect ."},{"n":11,"ti":"Builder & Prototype","f":"11-builder-prototype.html","lv":"Design Patterns","q":"What's the main problem with new PoolConfig(url, 20, 5, 600_000, 30_000, 1_800_000) ?","o":["Constructors can't take more than five arguments","Several same-type values in a row: callers can swap them and it still compiles, and optional values force passing all earlier ones","Numbers with underscores don't compile","It creates a mutable object"],"a":1,"w":"Positional long timeouts carry no names at the call site, so a swap is invisible. A builder labels every value and lets callers set only what they need."},{"n":11,"ti":"Builder & Prototype","f":"11-builder-prototype.html","lv":"Design Patterns","q":"Where should a builder check “ minIdle must not exceed maxSize ”?","o":["In minIdle()","In maxSize()","In the product's getters","In build() , where both final values are known"],"a":3,"w":"A rule spanning two fields can only be checked once both are set, and callers may set them in either order. build() sees the final configuration."},{"n":11,"ti":"Builder & Prototype","f":"11-builder-prototype.html","lv":"Design Patterns","q":"Why does PoolConfig have a private constructor that takes the builder?","o":["So every PoolConfig must come through build() and its validation","Private constructors are faster","So it can't be garbage collected","Java requires it for nested classes"],"a":0,"w":"If the constructor were public, callers could bypass build() and create invalid objects. With it private, a PoolConfig is valid by construction."},{"n":11,"ti":"Builder & Prototype","f":"11-builder-prototype.html","lv":"Design Patterns","q":"What does HttpRequest.newBuilder().GET().build() do, with no URI set?","o":["Builds a request to http://localhost/","Returns null","Throws IllegalStateException , because a request needs a URI","Throws a checked IOException"],"a":2,"w":"The JDK builder validates in build() and refuses to produce a request without a URI, so a HttpRequest object is always complete."},{"n":11,"ti":"Builder & Prototype","f":"11-builder-prototype.html","lv":"Design Patterns","q":"Why prefer a copy constructor or with method over implementing Cloneable ?","o":["clone() is slower","clone() skips constructors, copies shallowly by default so mutable fields end up shared, and has an awkward checked-exception API","Cloneable was removed from Java","Records can't be copied any other way"],"a":1,"w":"A shallow clone shares lists and other mutable objects with the original, which is aliasing by accident. Explicit copies run normal construction and validation, and make deep copies where needed."}];
</script>

  const LEVELS = [

  // Prerequisites are stored as 0.1…0.8 (so they sort before Chapter 1) and shown as P1…P8.

  /* ---------------- helpers ---------------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const LLD = {

    $: (s, r = document) => r.querySelector(s),
    $$: (s, r = document) => [...r.querySelectorAll(s)],
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    fmt(n, d = 1) {
      if (!isFinite(n)) return '∞';
      const a = Math.abs(n);
      if (a >= 1e12) return (n / 1e12).toFixed(d).replace(/\.0+$/, '') + 'T';
      if (a >= 1e9) return (n / 1e9).toFixed(d).replace(/\.0+$/, '') + 'B';
      if (a >= 1e6) return (n / 1e6).toFixed(d).replace(/\.0+$/, '') + 'M';
      if (a >= 1e3) return (n / 1e3).toFixed(d).replace(/\.0+$/, '') + 'K';
      return (Math.round(n * 10 ** d) / 10 ** d).toString();
    },
    bytes(b) {
      const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB'];
      let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
      return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)).replace(/\.0+$/, '') + ' ' + u[i];
    },
    svg(tag, attrs = {}, parent) {
      const e = document.createElementNS(SVGNS, tag);
      for (const k in attrs) {
        if (k === 'text') e.textContent = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      if (parent) parent.appendChild(e);

    },
    /** centre of any element in the coordinate space of its owner <svg> */
    center(svg, el) {
      if (typeof el === 'string') el = svg.querySelector('#' + CSS.escape(el));
      const r = el.getBoundingClientRect();
      const pt = svg.createSVGPoint();
      pt.x = r.left + r.width / 2; pt.y = r.top + r.height / 2;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { x: p.x, y: p.y };
    },
    /** animate a glowing dot from (x1,y1) to (x2,y2). resolves when done */
    packet(svg, x1, y1, x2, y2, o = {}) {
      const color = o.color || 'var(--accent)';
      const dur = o.dur || 700;
      const g = LLD.svg('g', { class: 'packet', style: `color:${color}` }, svg);
      const c = LLD.svg('circle', { r: o.r || 6, fill: color }, g);
      let t2;
      if (o.label) t2 = LLD.svg('text', { 'font-size': 10, 'text-anchor': 'middle', fill: color, 'font-weight': 700, text: o.label, style: 'font-family:var(--mono)' }, g);
      const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const e = ease(t);
          const x = x1 + (x2 - x1) * e, y = y1 + (y2 - y1) * e;
          c.setAttribute('cx', x); c.setAttribute('cy', y);
          if (t2) { t2.setAttribute('x', x); t2.setAttribute('y', y - 11); }
          if (t < 1) requestAnimationFrame(tick);
          else { if (!o.keep) g.remove(); res(g); }
        };
        requestAnimationFrame(tick);
      });
    },
    packetBetween(svg, a, b, o) {
      const p = LLD.center(svg, a), q = LLD.center(svg, b);
      return LLD.packet(svg, p.x, p.y, q.x, q.y, o);
    },
    /** animate along an existing <path> */
    packetAlong(svg, path, o = {}) {
      const len = path.getTotalLength();
      const dur = o.dur || 900;
      const g = LLD.svg('g', { class: 'packet', style: `color:${o.color || 'var(--accent)'}` }, svg);
      const c = LLD.svg('circle', { r: o.r || 6, fill: o.color || 'var(--accent)' }, g);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const p = path.getPointAtLength(o.reverse ? len * (1 - t) : len * t);
          c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);

        requestAnimationFrame(tick);
      });
    },
    log(el, html, cls = '') {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.innerHTML = html;
      el.appendChild(d);

      el.scrollTop = el.scrollHeight;

    toast(msg) {
      let t = document.getElementById('lld-toast');

        t = document.createElement('div'); t.id = 'lld-toast';

  /* ---------------- theme ---------------- */
  function currentTheme() {

  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';

  function buildFooter(chap, main) {

      box.querySelector('button').onclick = () => {
        const s = doneSet();

  /* ---------------- components ---------------- */
  function initTabs(root = document) {
    LLD.$$('.tabs', root).forEach((tabs) => {

  function initSteppers(root = document) {
    LLD.$$('.stepper', root).forEach((st) => {
      if (st._init) return; st._init = true;
      const diagram = document.getElementById(st.dataset.diagram);
      const steps = LLD.$$('ol.steps > li', st);
      const intro = st.dataset.intro || 'Press <b>Next</b> or <b>Play</b> to walk through this flow step by step.';
      st.insertAdjacentHTML('beforeend', `
        <div class="step-text"><div class="st-title"></div><div class="st-desc"></div></div>
        <div class="stepper-bar">
          <div class="stepper-dots">${steps.map(() => '<i></i>').join('')}</div>
          <span class="count"></span>
          <button class="btn sm" data-a="reset" title="Reset">↺</button>
          <button class="btn sm" data-a="prev">← Prev</button>
          <button class="btn sm" data-a="play">▶ Play</button>
          <button class="btn sm primary" data-a="next">Next →</button>
        </div>`);
      const title = LLD.$('.st-title', st), desc = LLD.$('.st-desc', st), count = LLD.$('.count', st);
      const dots = LLD.$$('.stepper-dots i', st);
      const playBtn = LLD.$('[data-a=play]', st);
      let idx = -1, playing = false, token = 0;

      const clear = () => { if (diagram) LLD.$$('.on', diagram).forEach((e) => e.classList.remove('on')); };
      async function go(i) {
        idx = LLD.clamp(i, -1, steps.length - 1);
        const my = ++token;
        clear();
        dots.forEach((d, j) => { d.classList.toggle('active', j === idx); d.classList.toggle('past', j < idx); });
        count.textContent = idx < 0 ? `${steps.length} steps` : `Step ${idx + 1} / ${steps.length}`;
        LLD.$('[data-a=prev]', st).disabled = idx < 0;
        LLD.$('[data-a=next]', st).disabled = idx >= steps.length - 1;
        if (idx < 0) {
          diagram && diagram.classList.remove('stepping');
          title.innerHTML = '👋 Interactive walkthrough'; desc.innerHTML = intro;
          st.dispatchEvent(new CustomEvent('step', { detail: { index: -1 } }));
          return;
        }
        const li = steps[idx];
        diagram && diagram.classList.add('stepping');
        (li.dataset.on || '').split(/\s+/).filter(Boolean).forEach((id) => {
          const e = diagram && diagram.querySelector('#' + CSS.escape(id));
          if (e) e.classList.add('on');
        });
        title.innerHTML = `<span class="n">${idx + 1}</span>${li.dataset.title || ''}`;
        desc.innerHTML = li.innerHTML;
        desc.style.animation = 'none'; void desc.offsetWidth; desc.style.animation = '';
        st.dispatchEvent(new CustomEvent('step', { detail: { index: idx, li } }));
        if (li.dataset.packet && diagram) {
          for (const seg of li.dataset.packet.split(',')) {
            if (my !== token) return;
            const [a, b] = seg.split('>').map((s) => s.trim());
            const ea = diagram.querySelector('#' + CSS.escape(a)), eb = diagram.querySelector('#' + CSS.escape(b));
            if (ea && eb) await LLD.packetBetween(diagram, ea, eb, { color: li.dataset.color, dur: 650 });
          }
        }
      }
      async function play() {
        if (playing) { playing = false; playBtn.textContent = '▶ Play'; return; }
        playing = true; playBtn.textContent = '⏸ Pause';
        if (idx >= steps.length - 1) idx = -1;
        while (playing && idx < steps.length - 1) {
          await go(idx + 1);
          await LLD.sleep(+st.dataset.delay || 2300);
        }
        playing = false; playBtn.textContent = '▶ Play';
      }
      st.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (!a) return;
        if (a !== 'play' && playing) { playing = false; playBtn.textContent = '▶ Play'; }
        if (a === 'next') go(idx + 1);
        if (a === 'prev') go(idx - 1);
        if (a === 'reset') go(-1);
        if (a === 'play') play();
      });
      dots.forEach((d, j) => (d.onclick = () => go(j)));
      st._go = go;
      go(-1);
    });
  }

  function initQuizzes(chap) {
    const quizzes = LLD.$$('.quiz');
    if (!quizzes.length) return;
    let answered = 0, correct = 0;
    const scoreEl = LLD.$('.quiz-score');
    const update = () => {
      if (!scoreEl) return;
      scoreEl.innerHTML = `<span class="big">${correct}/${quizzes.length}</span><span>${answered < quizzes.length ? `Answered ${answered} of ${quizzes.length} — keep going!` : correct === quizzes.length ? 'Perfect score! You nailed this chapter. 🏆' : correct >= quizzes.length * .6 ? 'Solid! Review the ones you missed. 💪' : 'Worth a re-read of the sections above. 📚'}</span>`;
      if (answered === quizzes.length && chap) {
        const best = LS.get('lld-quiz', {});
        best[chap.n] = Math.max(best[chap.n] || 0, correct / quizzes.length);
        LS.set('lld-quiz', best);
      }
    };
    quizzes.forEach((q, qi) => {
      const qp = LLD.$('.q', q);
      if (qp && !qp.querySelector('.qn')) qp.insertAdjacentHTML('afterbegin', `<span class="qn">Q${qi + 1}</span>`);
      const opts = LLD.$$('.opt', q);
      const ans = +q.dataset.answer;
      opts.forEach((o, i) => {
        o.dataset.letter = 'ABCDEFG'[i];
        o.onclick = () => {
