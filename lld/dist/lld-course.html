oft); border-color:var(--accent); color:var(--accent); }\n  .ml-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:860px) { .ml-grid { grid-template-columns:1fr; } }\n  .ml-card { border:1.5px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface-2); }\n  .ml-card h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }\n  .ml-card pre { margin:0; font-size:12.5px; }\n  .ml-out { margin-top:8px; padding:8px 10px; border-radius:9px; font-size:13.5px; }\n  .ml-out.bad { background:var(--red-soft); }\n  .ml-out.ok { background:var(--green-soft); }\n  .ml-out code { font-size:12px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 7\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Class APIs &amp; <span class=\"grad\">Contracts\u003C/span>\u003C/h1>\n    <p class=\"lead\">A class's public methods are a promise to every caller, now and in the future. Good ones say exactly what they need, what they guarantee and how they fail, and they make wrong calls fail to compile. Bad ones accept anything and leave callers to guess: whether 30 means seconds or milliseconds, which string is the currency, what <code>true, false\u003C/code> switches on. This chapter is about writing the first kind.\u003C/p>\n    <ul class=\"objectives\">\n      <li>State a method's contract: preconditions, postconditions and failure modes\u003C/li>\n      <li>Validate at public boundaries, then trust the data inside\u003C/li>\n      <li>Design signatures that are hard to misuse, using types instead of raw strings, ints and booleans\u003C/li>\n      <li>Apply command-query separation, and know when an atomic “command that answers” is the right call\u003C/li>\n      <li>Choose parameter and return types: accept general, return specific, never return null collections\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Invariants and fail-fast constructors.\u003C/b> See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b>Value objects and enums.\u003C/b> See <a href=\"p6-value-objects.html\">P6\u003C/a>.\u003C/li>\n        <li><b>Optional, exceptions and result types.\u003C/b> See <a href=\"p7-exceptions.html\">P7: Exceptions &amp; Error Contracts\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>A method is a contract\u003C/h2>\n  <p>Bertrand Meyer's <b>design by contract\u003C/b> describes every method with three parts. <b>Preconditions\u003C/b> are what the caller must guarantee before calling. <b>Postconditions\u003C/b> are what the method guarantees afterwards, if the preconditions held. <b>Invariants\u003C/b> are what's true of the object before and after every call (<a href=\"p2-encapsulation.html\">P2\u003C/a>). Add the ways it can fail, and you have the whole contract. Write it where callers read it, in the Javadoc:\u003C/p>\n<pre class=\"code\"><span class=\"c\">/**\n * Holds seats for a customer while they pay.\n *\n * Pre:  seats is non-empty and every seat belongs to this show; ttl is between 1 and 15 minutes.\n * Post: on success, every seat is held by holder until now + ttl, and no one else can hold or book them.\n *       On failure, no seat has changed state (all or nothing).\n * @return the hold, whose id is needed to confirm or release it\n * @throws SeatUnavailableException if any seat is already held or booked (nothing is held)\n * @throws IllegalArgumentException if a precondition is broken\n */\u003C/span>\n<span class=\"k\">public\u003C/span> <span class=\"t\">SeatHold\u003C/span> <span class=\"f\">hold\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">SeatId\u003C/span>&gt; seats, <span class=\"t\">CustomerId\u003C/span> holder, <span class=\"t\">Duration\u003C/span> ttl)\u003C/pre>\n  <p>Look at what that contract lets a caller rely on. It says “all or nothing”, so the caller never has to clean up half a hold. It says which failure is expected (<code>SeatUnavailableException\u003C/code>, show the user other seats) and which is a bug (<code>IllegalArgumentException\u003C/code>, fix the caller). And the signature itself already encodes most of the preconditions: a <code>Set\u003C/code> can't contain a seat twice, and <code>SeatId\u003C/code>, <code>CustomerId\u003C/code> and <code>Duration\u003C/code> can't be confused with one another.\u003C/p>\n\n  <h2>Validate at the boundary, trust inside\u003C/h2>\n  <p>Where should arguments be checked? At the <b>boundary\u003C/b>: every public constructor and public method, where data enters from code you don't control. Check once there, fail fast with a message naming the bad value, and then trust it everywhere inside. Private helpers don't re-check what their public caller already verified; re-validating everywhere clutters the code and makes it unclear which check is the real one.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public\u003C/span> <span class=\"t\">SeatHold\u003C/span> <span class=\"f\">hold\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">SeatId\u003C/span>&gt; seats, <span class=\"t\">CustomerId\u003C/span> holder, <span class=\"t\">Duration\u003C/span> ttl) {\n\t<span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(holder, <span class=\"s\">\"holder\"\u003C/span>);\n\t<span class=\"k\">if\u003C/span> (seats.<span class=\"f\">isEmpty\u003C/span>()) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"no seats\"\u003C/span>);\n\t<span class=\"k\">if\u003C/span> (ttl.<span class=\"f\">compareTo\u003C/span>(MIN_HOLD) &lt; <span class=\"m\">0\u003C/span> || ttl.<span class=\"f\">compareTo\u003C/span>(MAX_HOLD) &gt; <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"ttl out of range: \"\u003C/span> + ttl);\n\t<span class=\"k\">if\u003C/span> (!layout.<span class=\"f\">containsAll\u003C/span>(seats)) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"unknown seats: \"\u003C/span> + <span class=\"f\">unknown\u003C/span>(seats));\n\t<span class=\"k\">return\u003C/span> <span class=\"f\">holdValidated\u003C/span>(<span class=\"t\">Set\u003C/span>.<span class=\"f\">copyOf\u003C/span>(seats), holder, ttl);          <span class=\"c\">// private: no re-checks inside\u003C/span>\n}\u003C/pre>\n  <p>Value objects move validation even earlier. If <code>EmailAddress\u003C/code>'s constructor rejects malformed addresses, then every method that takes an <code>EmailAddress\u003C/code> has that precondition for free. That's why the course keeps turning validated strings into small types: the check happens once, at construction, instead of in every method that might receive one.\u003C/p>\n\n  <h2>Signatures that are hard to misuse\u003C/h2>\n  <p>The best check is one that happens at compile time. A signature built from raw <code>int\u003C/code>s, <code>String\u003C/code>s and <code>boolean\u003C/code>s lets callers swap, mis-scale and mistype arguments, and the compiler can't help. Each case below is a real category of production bug. Toggle each one to the fixed signature and watch the same mistake stop compiling.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Misuse lab: does the wrong call still compile?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"ml-tabs\" id=\"mlTabs\">\u003C/div>\n      <div class=\"controls\" style=\"margin-top:12px\"><div class=\"seg\" id=\"mlMode\"><button class=\"active\" data-v=\"bad\">Original signature\u003C/button><button data-v=\"good\">Fixed signature\u003C/button>\u003C/div>\u003C/div>\n      <div class=\"ml-grid\">\n        <div class=\"ml-card\"><h4>Signature\u003C/h4><pre class=\"code\" id=\"mlSig\">\u003C/pre>\u003C/div>\n        <div class=\"ml-card\"><h4>A caller's mistake\u003C/h4><pre class=\"code\" id=\"mlCall\">\u003C/pre><div class=\"ml-out\" id=\"mlOut\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <p class=\"small\" id=\"mlWhy\" style=\"margin:12px 0 0\">\u003C/p>\n    \u003C/div>\n    <div class=\"panel-foot\">The pattern in every fix: replace a raw type whose meaning lives in the caller's head with a type whose meaning lives in the code: <code>Duration\u003C/code>, <code>Money\u003C/code>, an id type, an enum, or a builder with named steps.\u003C/div>\n  \u003C/div>\n\n  <h2>Command-query separation\u003C/h2>\n  <p>Bertrand Meyer's other rule: a method should either be a <b>command\u003C/b>, which changes state and returns nothing, or a <b>query\u003C/b>, which returns something and changes nothing. Never both. The payoff is that queries are safe to call anywhere: in a log line, in a debugger, in an assertion, twice in a row. A query that secretly changes state turns every one of those into a bug.\u003C/p>\n<pre class=\"code\"><span class=\"c\">// A query with a side effect: every call to \"look\" at the balance charges a fee\u003C/span>\n<span class=\"k\">public\u003C/span> <span class=\"t\">Money\u003C/span> <span class=\"f\">getBalance\u003C/span>() { balance = balance.<span class=\"f\">minus\u003C/span>(INQUIRY_FEE); <span class=\"k\">return\u003C/span> balance; }\n\n<span class=\"c\">// Separated: reading is free and repeatable; charging is an explicit command\u003C/span>\n<span class=\"k\">public\u003C/span> <span class=\"t\">Money\u003C/span> <span class=\"f\">balance\u003C/span>() { <span class=\"k\">return\u003C/span> balance; }\n<span class=\"k\">public void\u003C/span> <span class=\"f\">chargeInquiryFee\u003C/span>() { balance = balance.<span class=\"f\">minus\u003C/span>(INQUIRY_FEE); }\u003C/pre>\n  <p>There's one important exception, and it shows up constantly in LLD. When several threads share an object, splitting “check” from “act” creates a race: two threads both see the last seat as free, then both hold it. Operations that must be <b>atomic\u003C/b> therefore combine the command with its answer: <code>tryAcquire()\u003C/code> returns whether it got a token, <code>Map.putIfAbsent\u003C/code> returns what was there, <code>Queue.poll\u003C/code> removes and returns. That breaks the letter of CQS on purpose. The rule of thumb: separate commands and queries by default; merge them when the check and the change must happen as one step.\u003C/p>\n  <figure class=\"seq\" data-actors=\"Request A|Request B|SeatMap\">\n    <ol>\n      <li data-m=\"0>2\">isFree(A7)?\u003C/li>\n      <li data-m=\"1>2\">isFree(A7)?\u003C/li>\n      <li data-m=\"2>0\" data-k=\"reply\">true\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">true\u003C/li>\n      <li data-m=\"0>2\">hold(A7)\u003C/li>\n      <li data-m=\"1>2\" data-k=\"bad\">hold(A7): both requests now think they hold A7\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Why atomic operations return answers.\u003C/b> A query followed by a command leaves a gap another thread can use. <code>tryHold(A7)\u003C/code>, which checks and holds in one synchronized step and returns whether it worked, closes it (<a href=\"22-thread-safe-classes.html\">Chapter 22\u003C/a>).\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Parameter and return types\u003C/h2>\n  <p>A few more rules keep APIs easy to call and hard to break:\u003C/p>\n  <ul>\n    <li><b>Accept the most general type you need; return the most specific useful one.\u003C/b> Take <code>Collection&lt;SeatId&gt;\u003C/code> or <code>Set&lt;SeatId&gt;\u003C/code>, not <code>HashSet&lt;SeatId&gt;\u003C/code>; return <code>List&lt;Booking&gt;\u003C/code>, not <code>Collection\u003C/code>, if order matters to callers.\u003C/li>\n    <li><b>Never return <code>null\u003C/code> for a collection.\u003C/b> Return an empty one, so callers can always loop.\u003C/li>\n    <li><b>Return <code>Optional\u003C/code> for “may not exist”,\u003C/b> and throw for “couldn't do its job” (<a href=\"p7-exceptions.html\">P7\u003C/a>).\u003C/li>\n    <li><b>Keep parameter lists short.\u003C/b> Past three or four parameters, especially of the same type, group them into a record (a “parameter object”) or use a builder (<a href=\"11-builder-prototype.html\">Chapter 11\u003C/a>).\u003C/li>\n    <li><b>Don't return mutable internals.\u003C/b> Copies or unmodifiable views only (<a href=\"p2-encapsulation.html\">P2\u003C/a>).\u003C/li>\n  \u003C/ul>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Name the operation\u003C/b> A verb for commands (<code>hold\u003C/code>), a noun or question for queries (<code>balance\u003C/code>, <code>isExpired\u003C/code>).\u003C/li>\n      <li><b>Type every parameter\u003C/b> Units as <code>Duration\u003C/code>/<code>Money\u003C/code>; ids as id types; options as enums.\u003C/li>\n      <li><b>Write the contract\u003C/b> Pre, post, and which exceptions mean “expected” vs “your bug”.\u003C/li>\n      <li><b>Validate at the top\u003C/b> Fail fast with a message naming the bad value.\u003C/li>\n      <li data-k=\"end\"><b>Pick the return type\u003C/b> Optional for absence, empty collections for none, a result type if callers always branch.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Designing a public method, in order.\u003C/b> Most misuse is prevented at step two.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The date API everyone got wrong\u003C/div><p>The old <code>java.util.Date(int year, int month, int day)\u003C/code> constructor counts years from 1900 and months from zero. So <code>new Date(2026, 9, 30)\u003C/code> is 30 October in the year 3926. It compiled, it ran, and it produced wrong dates in real systems for years, because three <code>int\u003C/code>s in a row carry no meaning of their own. Its replacement, <code>java.time\u003C/code>, fixed it with types: <code>LocalDate.of(2026, Month.OCTOBER, 30)\u003C/code>. Month is an enum, so a zero-based slip can't compile. When your own API takes several plain numbers in a row, you're building the same trap.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Units in the caller's head:\u003C/b> <code>int timeout\u003C/code>, <code>long amount\u003C/code>. Use <code>Duration\u003C/code> and <code>Money\u003C/code>.\u003C/li>\n      <li><b>Several <code>String\u003C/code> or <code>long\u003C/code> parameters in a row.\u003C/b> Callers will swap them. Use id types or a parameter object.\u003C/li>\n      <li><b>Boolean flags.\u003C/b> <code>true, false\u003C/code> means nothing at the call site. Use enums or separate methods.\u003C/li>\n      <li><b>Validating deep inside instead of at the boundary,\u003C/b> so the error surfaces far from the bad call.\u003C/li>\n      <li><b>Queries with side effects.\u003C/b> A getter that increments, charges or caches wrongly breaks every log line that calls it.\u003C/li>\n      <li><b>Separate check and act on shared state.\u003C/b> Offer one atomic method that returns whether it worked.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What makes a method signature “hard to misuse”?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>The types carry the meaning, so a wrong call doesn't compile. Durations are <code>Duration\u003C/code>, amounts are <code>Money\u003C/code>, ids have their own types so they can't be swapped, options are enums instead of booleans, and long parameter lists become a record or a builder with named steps. Then I validate at the boundary, fail fast with a clear message, and document the contract: what the method needs, what it guarantees, and which exceptions mean an expected failure versus a caller bug.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Command-query separation says don't return values from commands. Why do <code>tryAcquire\u003C/code> and <code>putIfAbsent\u003C/code> break that rule, and is that OK?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>They exist for shared, concurrent state. If a caller first asks “is it free?” and then says “take it”, another thread can act in between, so both callers succeed. Combining the check and the change into one atomic operation that reports whether it worked closes that gap. So I separate commands and queries by default, because it makes queries safe to call anywhere, and deliberately merge them where the check and the action must happen as one step.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>A method's contract: preconditions, postconditions, invariants and failure modes. Write it in the Javadoc.\u003C/li>\n      <li>Validate at public boundaries once, fail fast with a clear message, and trust the data inside.\u003C/li>\n      <li>Hard-to-misuse signatures use types for meaning: Duration, Money, id types, enums, parameter objects and builders.\u003C/li>\n      <li>Command-query separation: commands change state, queries return data; neither does both.\u003C/li>\n      <li>Exception: atomic check-and-act on shared state returns whether it worked (<code>tryAcquire\u003C/code>, <code>putIfAbsent\u003C/code>).\u003C/li>\n      <li>Accept general types, return specific ones; empty collections, never null; Optional for absence.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Where should a class validate its arguments?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">In every private helper, to be safe\u003C/button>\n        <button class=\"opt\">Nowhere: callers are responsible\u003C/button>\n        <button class=\"opt\">At public constructors and methods, where data enters; then trust it inside\u003C/button>\n        <button class=\"opt\">Only in tests\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The boundary is where untrusted data arrives. Checking there once, and failing fast, gives clear errors near the bad call without cluttering every internal method.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">What's the best replacement for <code>void setTimeout(int timeout)\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>void setTimeout(Duration timeout)\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>void setTimeout(long timeout)\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>void setTimeoutMillisOrSeconds(int t, boolean seconds)\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>void setTimeout(String timeout)\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>Duration\u003C/code> carries its unit, so <code>Duration.ofSeconds(30)\u003C/code> and <code>Duration.ofMillis(30)\u003C/code> can't be confused. The other options keep the unit in the caller's head or add a flag.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Which method breaks command-query separation in a harmful way?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>boolean tryAcquire(long now)\u003C/code> on a shared rate limiter\u003C/button>\n        <button class=\"opt\"><code>void archive()\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>boolean isExpired(Instant now)\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>Money getBalance()\u003C/code> that also deducts an inquiry fee\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A query that changes state makes innocent reads, like a log line or a debugger, charge the customer. <code>tryAcquire\u003C/code> merges check and act on purpose, for atomicity on shared state.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\"><code>charge(long amount, String currency, String customerId)\u003C/code> is called as <code>charge(1999, \"cus_42\", \"USD\")\u003C/code>. What's the best fix?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A comment explaining the parameter order\u003C/button>\n        <button class=\"opt\"><code>charge(Money amount, CustomerId customer)\u003C/code>, so currency travels with the amount and the id has its own type\u003C/button>\n        <button class=\"opt\">Validate that currency is three letters\u003C/button>\n        <button class=\"opt\">Rename the parameters\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">With distinct types the swapped call doesn't compile. Validation would catch this one swap at run time, but not a swap between two valid-looking strings. Comments and names don't reach the call site.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>hold(seats, holder, ttl)\u003C/code> documents “all or nothing”. What may a caller assume if it throws <code>SeatUnavailableException\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Some seats may be held and must be released\u003C/button>\n        <button class=\"opt\">The show has been cancelled\u003C/button>\n        <button class=\"opt\">No seat changed state; there's nothing to clean up\u003C/button>\n        <button class=\"opt\">The caller passed invalid arguments\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The postcondition on failure is part of the contract. “All or nothing” means a failed call left everything as it was, so the caller can simply offer other seats.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  // [tab, bad sig, bad call, runtime result, good sig, good call, compile error, why]\n  const C = [\n    ['Units', 'void setTimeout(int timeout)   // milliseconds', 'client.setTimeout(30);   // meant 30 seconds',\n      'Runs. Every request times out after 30 ms, and the service looks down.',\n      'void setTimeout(Duration timeout)', 'client.setTimeout(30);',\n      'error: incompatible types: int cannot be converted to Duration',\n      'The caller must now write Duration.ofSeconds(30) or Duration.ofMillis(30). The unit is in the code, not in someone\\'s memory.'],\n    ['Swapped strings', 'void charge(long amount, String currency, String customerId)', 'gateway.charge(1999, \"cus_42\", \"USD\");',\n      'Runs. The gateway rejects currency \"cus_42\", or worse, a lenient mock accepts it in tests.',\n      'void charge(Money amount, CustomerId customer)', 'gateway.charge(1999, \"cus_42\", \"USD\");',\n      'error: method charge cannot be applied to given types; required: Money, CustomerId',\n      'Money carries its currency, and CustomerId can\\'t be confused with any other string. Swaps between two ids of different types stop compiling too.'],\n    ['Boolean flags', 'void export(Report r, boolean compress, boolean encrypt)', 'exporter.export(report, true, false);   // meant: encrypt only',\n      'Runs. The report is compressed but not encrypted, and goes out in the clear.',\n      'void export(Report r, Set<ExportOption> options)   // enum: COMPRESS, ENCRYPT', 'exporter.export(report, true, false);',\n      'error: method export cannot be applied to given types; required: Report, Set<ExportOption>',\n      'The right call reads as what it does: export(report, EnumSet.of(ENCRYPT)). New options don\\'t add another boolean parameter to every call site.'],\n    ['Typos in values', 'List<Order> find(String status)   // \"NEW\", \"PAID\", \"SHIPPED\"', 'orders.find(\"SHIPED\");',\n      'Runs. Returns an empty list, and the dashboard shows no shipped orders.',\n      'List<Order> find(OrderStatus status)   // enum', 'orders.find(\"SHIPED\");',\n      'error: incompatible types: String cannot be converted to OrderStatus',\n      'OrderStatus.SHIPED doesn\\'t exist, so the typo fails to compile, and the IDE completes the right constant.'],\n    ['Same-type numbers', 'new RateLimiter(int capacity, int refillPerSecond)', 'new RateLimiter(10, 100);   // meant: burst of 100, 10 per second',\n      'Runs. Clients get a burst of only 10 but refill at 100 per second: the limit is ten times too loose.',\n      'RateLimiter.withCapacity(int n).refillingPerSecond(int r)   // named steps', 'RateLimiter.withCapacity(10).refillingPerSecond(100);',\n      'Compiles, but reads as exactly what it does, so the mistake is visible in review.',\n      'When two parameters share a type, types can\\'t save you. Named steps (a small builder, Chapter 11) or a record with named components move the meaning into the call site.'],\n  ];\n  let i = 0, mode = 'bad';\n  $('#mlTabs').innerHTML = C.map(([t], k) => `<button class=\"btn sm${k === 0 ? ' active' : ''}\" data-k=\"${k}\">${t}\u003C/button>`).join('');\n  $$('#mlTabs button').forEach((b) => b.onclick = () => { i = +b.dataset.k; $$('#mlTabs button').forEach((x) => x.classList.toggle('active', x === b)); draw(); });\n  $$('#mlMode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; draw(); }));\n  const esc = (s) => s.replace(/&/g, '&amp;').replace(/\u003C/g, '&lt;');\n  function draw() {\n    const [, bs, bc, br, gs, gc, ge, why] = C[i];\n    const good = mode === 'good';\n    $('#mlSig').textContent = good ? gs : bs;\n    $('#mlCall').textContent = good ? gc : bc;\n    const o = $('#mlOut');\n    const compiles = !good || ge.startsWith('Compiles');\n    o.className = 'ml-out ' + (good ? 'ok' : 'bad');\n    o.innerHTML = good ? (compiles ? '✓ ' + esc(ge) : '✓ Rejected by the compiler: <code>' + esc(ge) + '\u003C/code>') : '✗ Compiles. ' + esc(br);\n    $('#mlWhy').innerHTML = good ? esc(why) : 'Switch to the fixed signature to see the same mistake caught.';\n  }\n  draw();\n})();\n"]},"08-dependency-injection.html":{"title":"Dependency Injection &amp; Testability","chapter":"8","styles":"\n  .tr-cols { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:12px; }\n  @media (max-width:860px) { .tr-cols { grid-template-columns:1fr; } }\n  .tr-col h4 { margin:0 0 8px; font-size:14px; }\n  .tr-t { display:grid; grid-template-columns:22px minmax(0,1fr) 70px; gap:8px; align-items:start; padding:8px 10px; border-radius:10px; margin-bottom:6px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; }\n  .tr-t .s { font-weight:800; font-family:var(--mono); }\n  .tr-t .ms { font-family:var(--mono); font-size:12px; text-align:right; color:var(--muted); }\n  .tr-t .why { grid-column:2 / 4; font-size:12.5px; color:var(--text-2); }\n  .tr-t.run { border-color:var(--accent); }\n  .tr-t.pass { background:var(--green-soft); border-color:transparent; }\n  .tr-t.pass .s { color:var(--green); }\n  .tr-t.fail { background:var(--red-soft); border-color:transparent; }\n  .tr-t.fail .s { color:var(--red); }\n  .tr-t.slow { background:var(--amber-soft); border-color:transparent; }\n  .tr-t.slow .s { color:var(--amber); }\n  .tr-sum { font-family:var(--mono); font-size:12.5px; margin-top:6px; color:var(--muted); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 8\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Dependency Injection &amp; <span class=\"grad\">Testability\u003C/span>\u003C/h1>\n    <p class=\"lead\">An order service that creates its own Stripe client, its own mailer and reads the system clock works fine in production and is almost impossible to test: every test charges a card, sends an email, and waits in real time. <b>Dependency injection\u003C/b> is the simple fix: a class receives the objects it needs instead of creating them. This chapter shows how to do it with plain constructors, where the wiring goes, and how it turns a two-minute flaky test suite into a two-second reliable one.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Spot hidden dependencies: <code>new\u003C/code> on collaborators, static calls, the clock and randomness\u003C/li>\n      <li>Refactor to constructor injection with <code>final\u003C/code> fields\u003C/li>\n      <li>Wire the application in one composition root\u003C/li>\n      <li>Replace real collaborators with fakes in tests, including a fixed clock\u003C/li>\n      <li>Recognise the service locator and setter injection as weaker alternatives\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Dependency inversion:\u003C/b> business code depends on interfaces it owns. See <a href=\"04-solid-lsp-isp-dip.html\">Chapter 4: SOLID II\u003C/a>.\u003C/li>\n        <li><b>Mutable static state is global state.\u003C/b> See <a href=\"p1-classes-objects.html\">P1\u003C/a>.\u003C/li>\n        <li><b>Interfaces and functional interfaces.\u003C/b> See <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2><code>new\u003C/code> is glue\u003C/h2>\n  <p>Writing <code>new StripeClient(apiKey)\u003C/code> inside a class glues that class to Stripe forever. Nobody can hand it a different gateway, a test fake, or a client configured differently. The same is true of other ways to reach out and grab something: a static call like <code>Config.get(\"stripe.key\")\u003C/code>, a singleton like <code>Metrics.getInstance()\u003C/code>, and two that are easy to miss, <b>the clock\u003C/b> (<code>Instant.now()\u003C/code>) and <b>randomness\u003C/b> (<code>UUID.randomUUID()\u003C/code>). Each is a hidden dependency: it isn't in the constructor, so reading the class's signature tells you nothing about it.\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">OrderService.java, hard-wired\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">OrderService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">StripeClient\u003C/span> stripe = <span class=\"k\">new\u003C/span> <span class=\"t\">StripeClient\u003C/span>(<span class=\"t\">System\u003C/span>.<span class=\"f\">getenv\u003C/span>(<span class=\"s\">\"STRIPE_KEY\"\u003C/span>));   <span class=\"c\">// glue\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">SmtpMailer\u003C/span> mailer = <span class=\"k\">new\u003C/span> <span class=\"t\">SmtpMailer\u003C/span>(<span class=\"s\">\"smtp.internal:25\"\u003C/span>);             <span class=\"c\">// glue\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Order\u003C/span> <span class=\"f\">place\u003C/span>(<span class=\"t\">Cart\u003C/span> cart, <span class=\"t\">Customer\u003C/span> c) {\n\t\t<span class=\"t\">Order\u003C/span> order = <span class=\"k\">new\u003C/span> <span class=\"t\">Order\u003C/span>(<span class=\"t\">UUID\u003C/span>.<span class=\"f\">randomUUID\u003C/span>(), cart, <span class=\"t\">Instant\u003C/span>.<span class=\"f\">now\u003C/span>());               <span class=\"c\">// hidden: randomness, clock\u003C/span>\n\t\tstripe.<span class=\"f\">charge\u003C/span>(cart.<span class=\"f\">total\u003C/span>(), c.<span class=\"f\">paymentToken\u003C/span>());\n\t\tmailer.<span class=\"f\">send\u003C/span>(c.<span class=\"f\">email\u003C/span>(), <span class=\"s\">\"Order confirmed\"\u003C/span>, order.<span class=\"f\">summary\u003C/span>());\n\t\t<span class=\"k\">return\u003C/span> order;\n\t}\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isPaymentWindowOpen\u003C/span>(<span class=\"t\">Order\u003C/span> o) {\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Duration\u003C/span>.<span class=\"f\">between\u003C/span>(o.<span class=\"f\">placedAt\u003C/span>(), <span class=\"t\">Instant\u003C/span>.<span class=\"f\">now\u003C/span>()).<span class=\"f\">toMinutes\u003C/span>() &lt; <span class=\"m\">30\u003C/span>;     <span class=\"c\">// testable only by waiting\u003C/span>\n\t}\n}\u003C/pre>\n  \u003C/div>\n\n  <h2>Constructor injection\u003C/h2>\n  <p>The fix is to ask for dependencies instead of creating them. Every collaborator becomes a constructor parameter, typed as an interface the business code owns, stored in a <code>final\u003C/code> field:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">OrderService.java, injected\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">OrderService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">PaymentGateway\u003C/span> payments;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Mailer\u003C/span> mailer;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Clock\u003C/span> clock;                                  <span class=\"c\">// java.time.Clock\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">OrderId\u003C/span>&gt; ids;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">OrderService\u003C/span>(<span class=\"t\">PaymentGateway\u003C/span> payments, <span class=\"t\">Mailer\u003C/span> mailer, <span class=\"t\">Clock\u003C/span> clock, <span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">OrderId\u003C/span>&gt; ids) {\n\t\t<span class=\"k\">this\u003C/span>.payments = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(payments);\n\t\t<span class=\"k\">this\u003C/span>.mailer = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(mailer);\n\t\t<span class=\"k\">this\u003C/span>.clock = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(clock);\n\t\t<span class=\"k\">this\u003C/span>.ids = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(ids);\n\t}\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Order\u003C/span> <span class=\"f\">place\u003C/span>(<span class=\"t\">Cart\u003C/span> cart, <span class=\"t\">Customer\u003C/span> c) {\n\t\t<span class=\"t\">Order\u003C/span> order = <span class=\"k\">new\u003C/span> <span class=\"t\">Order\u003C/span>(ids.<span class=\"f\">get\u003C/span>(), cart, clock.<span class=\"f\">instant\u003C/span>());\n\t\tpayments.<span class=\"f\">charge\u003C/span>(cart.<span class=\"f\">total\u003C/span>(), c.<span class=\"f\">paymentToken\u003C/span>(), order.<span class=\"f\">idempotencyKey\u003C/span>());\n\t\tmailer.<span class=\"f\">send\u003C/span>(c.<span class=\"f\">email\u003C/span>(), <span class=\"s\">\"Order confirmed\"\u003C/span>, order.<span class=\"f\">summary\u003C/span>());\n\t\t<span class=\"k\">return\u003C/span> order;\n\t}\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isPaymentWindowOpen\u003C/span>(<span class=\"t\">Order\u003C/span> o) {\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Duration\u003C/span>.<span class=\"f\">between\u003C/span>(o.<span class=\"f\">placedAt\u003C/span>(), clock.<span class=\"f\">instant\u003C/span>()).<span class=\"f\">toMinutes\u003C/span>() &lt; <span class=\"m\">30\u003C/span>;\n\t}\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Same behaviour, different shape:\u003C/b> the constructor is now an honest list of everything the class touches. Notice that <code>new Order(...)\u003C/code> stayed. Creating value objects and entities the class owns is fine; injection is for <b>collaborators\u003C/b>: things with behaviour you might want to swap, and things that reach the outside world.\u003C/div>\n  \u003C/div>\n  <p>Why the constructor, rather than setters? A constructor produces a <b>complete\u003C/b> object: it can't exist with its mailer missing, the fields can be <code>final\u003C/code>, and the compiler lists every dependency at every construction site. Setter injection allows half-built objects and needs a “call all setters first” rule, which is the temporal coupling from <a href=\"05-coupling-cohesion.html\">Chapter 5\u003C/a>. Keep setters for genuinely optional settings, if at all.\u003C/p>\n\n  <h2>The composition root\u003C/h2>\n  <p>If nobody creates their own collaborators, somebody has to. That's the <b>composition root\u003C/b>: one place, as close to <code>main\u003C/code> as possible, that builds the whole object graph and starts the application. It's the only code that knows which concrete classes are used, and the natural place to read configuration.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public static void\u003C/span> <span class=\"f\">main\u003C/span>(<span class=\"t\">String\u003C/span>[] args) {\n\t<span class=\"t\">Config\u003C/span> config = <span class=\"t\">Config\u003C/span>.<span class=\"f\">fromEnvironment\u003C/span>();\n\t<span class=\"t\">Clock\u003C/span> clock = <span class=\"t\">Clock\u003C/span>.<span class=\"f\">systemUTC\u003C/span>();\n\t<span class=\"t\">PaymentGateway\u003C/span> payments = <span class=\"k\">new\u003C/span> <span class=\"t\">StripeGateway\u003C/span>(<span class=\"k\">new\u003C/span> <span class=\"t\">StripeClient\u003C/span>(config.<span class=\"f\">stripeKey\u003C/span>()));\n\t<span class=\"t\">Mailer\u003C/span> mailer = <span class=\"k\">new\u003C/span> <span class=\"t\">SmtpMailer\u003C/span>(config.<span class=\"f\">smtpHost\u003C/span>());\n\t<span class=\"t\">OrderService\u003C/span> orders = <span class=\"k\">new\u003C/span> <span class=\"t\">OrderService\u003C/span>(payments, mailer, clock, <span class=\"t\">OrderId\u003C/span>::<span class=\"f\">random\u003C/span>);\n\t<span class=\"k\">new\u003C/span> <span class=\"t\">HttpServer\u003C/span>(config.<span class=\"f\">port\u003C/span>(), <span class=\"k\">new\u003C/span> <span class=\"t\">OrderController\u003C/span>(orders)).<span class=\"f\">start\u003C/span>();\n}\u003C/pre>\n  <figure class=\"seq\" data-actors=\"main()|Config|StripeGateway|OrderService|HttpServer\">\n    <ol>\n      <li data-m=\"0>1\">fromEnvironment(): keys, hosts, port\u003C/li>\n      <li data-m=\"0>2\">new StripeGateway(new StripeClient(key))\u003C/li>\n      <li data-m=\"0>3\">new OrderService(payments, mailer, clock, ids)\u003C/li>\n      <li data-m=\"0>4\">new HttpServer(port, new OrderController(orders))\u003C/li>\n      <li data-m=\"0>4\">start(): from here on, nothing creates collaborators\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Wiring happens once, at startup.\u003C/b> Every other class just receives what it needs. Swapping Stripe for another provider, or SMTP for an email API, is a one-line change here.\u003C/figcaption>\n  \u003C/figure>\n  <p>Frameworks like Spring, Guice and Dagger automate this wiring, and in a large application they save a lot of typing. They don't change the design: classes still declare dependencies in their constructors, and the framework is just a generated composition root. In an interview, write the constructors and one short wiring snippet; don't reach for annotations.\u003C/p>\n\n  <h2>Fakes: what injection buys in tests\u003C/h2>\n  <p>Once dependencies come in through the constructor, a test can pass in replacements. The most useful kind is a <b>fake\u003C/b>: a small, working implementation that keeps everything in memory. A fake payment gateway records charges in a list; a fake mailer records sent emails; <code>Clock.fixed(...)\u003C/code> freezes time at a moment the test chooses, and <code>Clock.offset(...)\u003C/code> moves it forward.\u003C/p>\n<pre class=\"code\"><span class=\"k\">@Test\u003C/span> <span class=\"k\">void\u003C/span> <span class=\"f\">payment_window_closes_after_30_minutes\u003C/span>() {\n\t<span class=\"t\">MutableClock\u003C/span> clock = <span class=\"k\">new\u003C/span> <span class=\"t\">MutableClock\u003C/span>(<span class=\"t\">Instant\u003C/span>.<span class=\"f\">parse\u003C/span>(<span class=\"s\">\"2026-09-30T10:00:00Z\"\u003C/span>));   <span class=\"c\">// a tiny Clock subclass for tests\u003C/span>\n\t<span class=\"t\">RecordingGateway\u003C/span> payments = <span class=\"k\">new\u003C/span> <span class=\"t\">RecordingGateway\u003C/span>();\n\t<span class=\"t\">OrderService\u003C/span> service = <span class=\"k\">new\u003C/span> <span class=\"t\">OrderService\u003C/span>(payments, <span class=\"k\">new\u003C/span> <span class=\"t\">RecordingMailer\u003C/span>(), clock, () -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">OrderId\u003C/span>(<span class=\"s\">\"o-1\"\u003C/span>));\n\n\t<span class=\"t\">Order\u003C/span> order = service.<span class=\"f\">place\u003C/span>(cartWorth(<span class=\"s\">\"19.99\"\u003C/span>), alice);\n\t<span class=\"f\">assertEquals\u003C/span>(<span class=\"t\">List\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"t\">Money\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"s\">\"19.99\"\u003C/span>, USD)), payments.<span class=\"f\">charged\u003C/span>());\n\n\tclock.<span class=\"f\">advance\u003C/span>(<span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofMinutes\u003C/span>(<span class=\"m\">29\u003C/span>));\n\t<span class=\"f\">assertTrue\u003C/span>(service.<span class=\"f\">isPaymentWindowOpen\u003C/span>(order));\n\tclock.<span class=\"f\">advance\u003C/span>(<span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofMinutes\u003C/span>(<span class=\"m\">1\u003C/span>));\n\t<span class=\"f\">assertFalse\u003C/span>(service.<span class=\"f\">isPaymentWindowOpen\u003C/span>(order));                     <span class=\"c\">// 30 minutes, tested in microseconds\u003C/span>\n}\u003C/pre>\n  <p>Run the same four tests against both versions of the service:\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Test runner: hard-wired vs injected OrderService\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\"><button class=\"btn sm primary\" id=\"trRun\">▶ run both suites\u003C/button><label class=\"small\" style=\"display:flex;gap:6px;align-items:center\"><input type=\"checkbox\" id=\"trDown\"> Stripe's sandbox is down today\u003C/label>\u003C/div>\n      <div class=\"tr-cols\">\n        <div class=\"tr-col\"><h4>Hard-wired (new, Instant.now, UUID)\u003C/h4><div id=\"trA\">\u003C/div><div class=\"tr-sum\" id=\"trAS\">\u003C/div>\u003C/div>\n        <div class=\"tr-col\"><h4>Injected (constructor + fakes)\u003C/h4><div id=\"trB\">\u003C/div><div class=\"tr-sum\" id=\"trBS\">\u003C/div>\u003C/div>\n      \u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Times are illustrative but realistic: a sandbox payment call takes hundreds of milliseconds, and a test of a 30-minute rule that uses the real clock takes 30 minutes. Fakes run in microseconds and never depend on another company's uptime.\u003C/div>\n  \u003C/div>\n\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Test double\u003C/th><th>What it is\u003C/th><th>Use it for\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Fake\u003C/td><td>A working lightweight implementation (in-memory repository, recording gateway)\u003C/td><td>Most collaborators; tests read like real use\u003C/td>\u003C/tr>\n        <tr><td>Stub\u003C/td><td>Returns canned answers (“the gateway always declines”)\u003C/td><td>Forcing a particular branch\u003C/td>\u003C/tr>\n        <tr><td>Mock\u003C/td><td>Checks which calls were made (usually with a library like Mockito)\u003C/td><td>When the call itself is the behaviour, like “exactly one email sent”\u003C/td>\u003C/tr>\n        <tr><td>Fixed or mutable clock\u003C/td><td><code>Clock.fixed\u003C/code>, <code>Clock.offset\u003C/code>, or a small settable subclass\u003C/td><td>Anything involving time: expiry, rate limits, daily resets\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p><a href=\"28-testing-designs.html\">Chapter 28\u003C/a> covers when to prefer each. The design point here is simpler: none of them is possible unless the class accepts its dependencies from outside.\u003C/p>\n\n  <h2>Two weaker alternatives\u003C/h2>\n  <p><b>Service locator.\u003C/b> Instead of receiving dependencies, the class asks a global registry: <code>ServiceLocator.get(PaymentGateway.class)\u003C/code>. It's swappable, in theory, but the dependencies are hidden again. You can't tell from the constructor what the class needs, a missing registration fails at run time instead of compile time, and every test must configure the global registry and remember to reset it. Prefer parameters.\u003C/p>\n  <p><b>Too many constructor parameters.\u003C/b> When injection makes a constructor take eight collaborators, the constructor is doing you a favour: it's showing you a class with too many responsibilities (<a href=\"03-solid-srp-ocp.html\">Chapter 3\u003C/a>). Split the class; don't switch to a locator or setters to hide the count.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The bug that only happens at midnight\u003C/div><p>A service enforces “at most 5 password resets per user per day”, counting from midnight UTC. With <code>Instant.now()\u003C/code> inside the class, the only test anyone writes runs at whatever time CI happens to run, and the day-boundary logic is never exercised. It ships with an off-by-one that resets the counter at 23:00, and it's found in production. With an injected clock, a test sets the time to <code>23:59:59\u003C/code>, makes five requests, advances one second, and checks the sixth is allowed. Time is the dependency people most often forget to inject, and the one that most often hides bugs. <a href=\"32-case-rate-limiter.html\">Case Study 32\u003C/a> injects a clock for exactly this reason.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b><code>new\u003C/code> on collaborators inside business classes.\u003C/b> Create values and owned parts; receive collaborators.\u003C/li>\n      <li><b>Forgetting the clock and randomness.\u003C/b> <code>Instant.now()\u003C/code> and <code>UUID.randomUUID()\u003C/code> in domain code make tests slow or nondeterministic.\u003C/li>\n      <li><b>Setter or field injection for required dependencies.\u003C/b> Objects can exist half-built, and fields can't be <code>final\u003C/code>.\u003C/li>\n      <li><b>Wiring scattered through the codebase.\u003C/b> One composition root; everything else just receives.\u003C/li>\n      <li><b>A service locator to “simplify” constructors.\u003C/b> It hides dependencies and moves errors to run time.\u003C/li>\n      <li><b>Mocking everything.\u003C/b> Tests that assert every internal call break on every refactor. Prefer fakes and check outcomes.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What is dependency injection, and why do you use it?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>A class receives the collaborators it needs, usually through its constructor, instead of creating or looking them up itself. Then the constructor honestly lists what the class depends on, the fields can be final, and the application wires real implementations in one composition root at startup. The main payoff is substitution: tests pass in fakes, like an in-memory gateway and a fixed clock, so they're fast and deterministic, and production can swap providers by changing the wiring.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> How would you unit-test “an unpaid order is cancelled after 30 minutes” without waiting 30 minutes?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Inject a <code>java.time.Clock\u003C/code> into the service instead of calling <code>Instant.now()\u003C/code>. In the test I'd use a clock I can move, either <code>Clock.fixed\u003C/code> recreated at a new instant or a small settable test clock. Place the order at 10:00, advance to 10:29 and assert it's still open, advance to 10:30 and assert it's cancelled. The payment gateway and mailer would be fakes, so the test runs in milliseconds and tests the exact boundary, which a real-time test never would.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li><code>new\u003C/code> on a collaborator, static lookups, <code>Instant.now()\u003C/code> and <code>UUID.randomUUID()\u003C/code> are hidden dependencies.\u003C/li>\n      <li>Constructor injection: collaborators as interface-typed constructor parameters in final fields, validated non-null.\u003C/li>\n      <li>Keep creating values and owned parts with <code>new\u003C/code>; inject collaborators and anything that reaches the outside world.\u003C/li>\n      <li>One composition root near <code>main\u003C/code> builds the object graph; frameworks only automate it.\u003C/li>\n      <li>Injection enables fakes and controllable clocks, which make tests fast, deterministic and able to hit exact boundaries.\u003C/li>\n      <li>Service locators and setter injection hide dependencies; a long constructor is an SRP warning, not a reason to hide it.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">What's the main problem with <code>private final StripeClient stripe = new StripeClient(key);\u003C/code> inside <code>OrderService\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It makes the class slower\u003C/button>\n        <button class=\"opt\">Fields can't be initialised inline\u003C/button>\n        <button class=\"opt\">The class is glued to Stripe: tests hit the real network, and no other gateway or fake can be substituted\u003C/button>\n        <button class=\"opt\">It violates encapsulation because the field is final\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Creating a collaborator inside the class fixes the choice forever. Receiving a <code>PaymentGateway\u003C/code> through the constructor lets production pass Stripe and tests pass a fake.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Why prefer constructor injection over setter injection for required dependencies?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The object can't exist without them, fields can be final, and every dependency is visible where the object is built\u003C/button>\n        <button class=\"opt\">Setters are slower\u003C/button>\n        <button class=\"opt\">Constructors can't throw exceptions\u003C/button>\n        <button class=\"opt\">Setter injection is not allowed in Java\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Setters allow half-built objects and require callers to remember to call them, which is temporal coupling. A constructor makes completeness a compile-time fact.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Where should concrete classes like <code>StripeGateway\u003C/code> and <code>SmtpMailer\u003C/code> be instantiated?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Inside each service that uses them\u003C/button>\n        <button class=\"opt\">In a static utility class that any code can call\u003C/button>\n        <button class=\"opt\">Lazily, the first time a method needs them\u003C/button>\n        <button class=\"opt\">In one composition root near <code>main\u003C/code>, which wires the whole object graph\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Keeping all wiring in one place means only one piece of code knows the concrete choices, and swapping an implementation is a one-line change.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">What's wrong with <code>ServiceLocator.get(PaymentGateway.class)\u003C/code> inside a service?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It can't return interfaces\u003C/button>\n        <button class=\"opt\">It hides the dependency from the constructor, turns missing wiring into a run-time error, and makes tests configure global state\u003C/button>\n        <button class=\"opt\">It creates a new gateway on every call\u003C/button>\n        <button class=\"opt\">Nothing: it's equivalent to constructor injection\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A locator is swappable, but the class's needs are invisible from outside, and the registry is shared global state that every test must set up and reset.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">After refactoring to constructor injection, a class needs nine collaborators. What does that suggest?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Switch to field injection to shorten the constructor\u003C/button>\n        <button class=\"opt\">Use a service locator instead\u003C/button>\n        <button class=\"opt\">The class probably has too many responsibilities and should be split\u003C/button>\n        <button class=\"opt\">Nothing: nine is normal\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Injection made the dependencies visible; the count is a single-responsibility smell. Hiding it with fields or a locator keeps the problem and loses the warning.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, sleep } = LLD;\n  // [name, hard-wired result fn(down) → [status, ms, why], injected → [status, ms, why]]\n  const T = [\n    ['charges the cart total once',\n      (down) => down ? ['fail', 30000, 'Timed out calling api.stripe.com: the test fails because another company is having a bad day.'] : ['slow', 840, 'Passes, via a real sandbox charge over the network. Needs an API key on every CI machine.'],\n      () => ['pass', 2, 'RecordingGateway.charged() == [19.99 USD]. No network.']],\n    ['sends one confirmation email',\n      () => ['fail', 1200, 'Connection refused: smtp.internal:25 isn\\'t reachable from CI. On a laptop it would email a real address.'],\n      () => ['pass', 1, 'RecordingMailer.sent() has exactly one message to alice@example.com.']],\n    ['payment window closes at 30 minutes',\n      () => ['slow', 1800000, 'Uses Instant.now(), so the only way to test the boundary is Thread.sleep for 30 minutes. In practice nobody writes this test.'],\n      () => ['pass', 1, 'Advance the test clock 29 minutes (open), then 1 more (closed). The exact boundary, instantly.']],\n    ['order id appears in the email subject',\n      () => ['fail', 3, 'UUID.randomUUID() is different every run, so the test can\\'t know which id to expect. It ends up asserting \"contains a dash\".'],\n      () => ['pass', 1, 'The id supplier returns \"o-1\", so the assertion is exact.']],\n  ];\n  const fmt = (ms) => ms >= 60000 ? (ms / 60000).toFixed(0) + ' min' : ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms';\n  const row = (name, st, ms, why) => `<div class=\"tr-t ${st || ''}\"><span class=\"s\">${st === 'pass' ? '✓' : st === 'fail' ? '✗' : st === 'slow' ? '⏱' : st === 'run' ? '…' : '·'}\u003C/span><span>${name}\u003C/span><span class=\"ms\">${ms != null ? fmt(ms) : ''}\u003C/span>${why ? `<span class=\"why\">${why}\u003C/span>` : ''}\u003C/div>`;\n  function idle() {\n    $('#trA').innerHTML = T.map(([n]) => row(n)).join(''); $('#trB').innerHTML = T.map(([n]) => row(n)).join('');\n    $('#trAS').textContent = ''; $('#trBS').textContent = '';\n  }\n  let running = false;\n  $('#trRun').onclick = async () => {\n    if (running) return; running = true;\n    const down = $('#trDown').checked;\n    const a = [], b = [];\n    for (let k = 0; k < T.length; k++) {\n      const [n, fa, fb] = T[k];\n      $('#trA').innerHTML = T.map(([nn], j) => j < k ? row(nn, ...a[j]) : j === k ? row(nn, 'run') : row(nn)).join('');\n      $('#trB').innerHTML = T.map(([nn], j) => j < k ? row(nn, ...b[j]) : j === k ? row(nn, 'run') : row(nn)).join('');\n      await sleep(450);\n      a.push(fa(down)); b.push(fb());\n    }\n    $('#trA').innerHTML = T.map(([n], j) => row(n, ...a[j])).join('');\n    $('#trB').innerHTML = T.map(([n], j) => row(n, ...b[j])).join('');\n    const sum = (r) => r.reduce((s, x) => s + x[1], 0), pass = (r) => r.filter((x) => x[0] === 'pass').length;\n    $('#trAS').textContent = `${pass(a)} / ${T.length} passing reliably · ${fmt(sum(a))} total`;\n    $('#trBS').textContent = `${pass(b)} / ${T.length} passing · ${fmt(sum(b))} total`;\n    running = false;\n  };\n  $('#trDown').addEventListener('change', idle);\n  idle();\n})();\n"]},"09-singleton.html":{"title":"Singleton (and Why It’s Usually Wrong)","chapter":"9","styles":"\n  .rc-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr); gap:12px; margin-top:12px; }\n  @media (max-width:900px) { .rc-grid { grid-template-columns:1fr; } }\n  .rc-th h4, .rc-heap h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }\n  .rc-code { margin:0; font-size:12px; }\n  .rc-code .ln { display:block; padding:0 6px; margin:0 -6px; border-radius:4px; }\n  .rc-code .ln.a { background:rgba(129,140,248,.25); box-shadow:inset 3px 0 0 #818cf8; }\n  .rc-code .ln.b { background:rgba(251,191,36,.2); box-shadow:inset 3px 0 0 #f59e0b; }\n  .rc-code .ln.ab { background:linear-gradient(90deg,rgba(129,140,248,.25),rgba(251,191,36,.2)); }\n  .rc-state { font-family:var(--mono); font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); }\n  .rc-state b.a { color:#818cf8; } .rc-state b.b { color:#f59e0b; }\n  .rc-obj { font-family:var(--mono); font-size:12.5px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--accent); background:var(--surface); margin-bottom:8px; }\n  .rc-obj.half { border-style:dashed; border-color:var(--red); background:var(--red-soft); }\n  .rc-obj.dup { border-color:var(--amber); }\n  .rc-verdict { margin-top:10px; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .rc-verdict.ok { background:var(--green-soft); } .rc-verdict.bad { background:var(--red-soft); } .rc-verdict.idle { background:var(--surface-2); border:1px solid var(--border); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 9\u003C/span><span class=\"pill\">Design Patterns\u003C/span><span class=\"pill\">⏱ 35 min\u003C/span>\u003C/div>\n    <h1>Singleton (and Why It’s Usually <span class=\"grad\">Wrong\u003C/span>)\u003C/h1>\n    <p class=\"lead\">Singleton is the pattern everyone learns first and the one interviewers most like to poke at. It guarantees a class has exactly one instance, reachable from anywhere. The “exactly one” part is sometimes useful. The “reachable from anywhere” part is global state, with all the problems that brings. This chapter shows how to write a singleton correctly under concurrency, which is harder than it looks, and why most designs are better off without one.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Write eager, lazy-synchronized, double-checked, holder-class and enum singletons\u003C/li>\n      <li>Explain the lazy-initialisation race, and why double-checked locking needs <code>volatile\u003C/code>\u003C/li>\n      <li>Explain why the holder idiom and enums are thread-safe without explicit locks\u003C/li>\n      <li>Name the design costs of a singleton: hidden dependencies, shared test state, fixed lifecycle\u003C/li>\n      <li>Replace a singleton with one instance created in the composition root and injected\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Static members and global state.\u003C/b> See <a href=\"p1-classes-objects.html\">P1: Classes, Objects &amp; References\u003C/a>.\u003C/li>\n        <li><b>Dependency injection and the composition root.\u003C/b> See <a href=\"08-dependency-injection.html\">Chapter 8\u003C/a>.\u003C/li>\n        <li><b>That two threads can interleave:\u003C/b> check-then-act races. See <a href=\"p2-encapsulation.html\">P2\u003C/a> and <a href=\"07-class-contracts.html\">Chapter 7\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>The pattern, and where it's tempting\u003C/h2>\n  <p>A <b>Singleton\u003C/b> has a private constructor, so nobody else can create one, and a static method or field that hands out the single instance. It's tempting whenever something “should only exist once” in a process: a configuration registry, a metrics registry, a connection pool, a cache. The JDK has a few, like <code>Runtime.getRuntime()\u003C/code>, and many immutable “singletons” like <code>Collections.emptyList()\u003C/code> and <code>Comparator.naturalOrder()\u003C/code>.\u003C/p>\n  <p>The simplest correct version is <b>eager\u003C/b>: create it when the class is initialised.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> {\n\t<span class=\"k\">private static final\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> INSTANCE = <span class=\"k\">new\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span>();   <span class=\"c\">// created once, at class init\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">String\u003C/span>&gt; values;\n\n\t<span class=\"k\">private\u003C/span> <span class=\"f\">ConfigRegistry\u003C/span>() { values = <span class=\"f\">loadFromFileAndEnvironment\u003C/span>(); }          <span class=\"c\">// private: no one else can new it\u003C/span>\n\t<span class=\"k\">public static\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> <span class=\"f\">get\u003C/span>() { <span class=\"k\">return\u003C/span> INSTANCE; }\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; <span class=\"f\">value\u003C/span>(<span class=\"t\">String\u003C/span> key) { <span class=\"k\">return\u003C/span> <span class=\"t\">Optional\u003C/span>.<span class=\"f\">ofNullable\u003C/span>(values.<span class=\"f\">get\u003C/span>(key)); }\n}\u003C/pre>\n  <p>This is thread-safe with no locks at all. The JVM initialises a class exactly once, under an internal lock, the first time it is actually used (not simply when the program starts), and guarantees every thread sees the fully initialised static fields afterwards. For most singletons, “eager” is already lazy enough.\u003C/p>\n\n  <h2>Lazy initialisation, and its race\u003C/h2>\n  <p>When construction is expensive and might never be needed, people write it lazily. The obvious version is broken:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public static\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> <span class=\"f\">get\u003C/span>() {\n\t<span class=\"k\">if\u003C/span> (instance == <span class=\"k\">null\u003C/span>) {                  <span class=\"c\">// check…\u003C/span>\n\t\tinstance = <span class=\"k\">new\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span>();       <span class=\"c\">// …then act: two threads can both get here\u003C/span>\n\t}\n\t<span class=\"k\">return\u003C/span> instance;\n}\u003C/pre>\n  <p>It's the check-then-act race again. Two request threads arrive at startup, both see <code>null\u003C/code>, both construct, and the process briefly has two registries, possibly with different contents if the loaded files changed in between. Making the whole method <code>synchronized\u003C/code> fixes it, at the cost of taking a lock on every call forever, even though it's needed only once. <b>Double-checked locking\u003C/b> tries to take the lock only on the first call, and it has a famous trap: without <code>volatile\u003C/code>, another thread can see the reference before the constructor has finished, because the JIT compiler and CPU may reorder “publish the reference” ahead of “initialise the fields”. Step through all five versions below; you control which thread moves.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Two threads, one lazy singleton: step through the race\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"rcMode\"><button class=\"active\" data-v=\"naive\">Naive lazy\u003C/button><button data-v=\"sync\">synchronized\u003C/button><button data-v=\"dcl\">DCL, no volatile\u003C/button><button data-v=\"dclv\">DCL + volatile\u003C/button><button data-v=\"holder\">Holder class\u003C/button>\u003C/div>\n      \u003C/div>\n      <div class=\"controls\" style=\"margin-top:10px\">\n        <button class=\"btn sm primary\" id=\"rcA\" style=\"background:#818cf8;border-color:#818cf8\">step thread A\u003C/button>\n        <button class=\"btn sm primary\" id=\"rcB\" style=\"background:#f59e0b;border-color:#f59e0b;color:#111\">step thread B\u003C/button>\n        <button class=\"btn sm\" id=\"rcWorst\">▶ play the worst interleaving\u003C/button>\n        <button class=\"btn sm\" id=\"rcReset\">↺ reset\u003C/button>\n      \u003C/div>\n      <div class=\"rc-grid\">\n        <div class=\"rc-th\"><h4>Code (A = purple, B = amber)\u003C/h4><pre class=\"code rc-code\" id=\"rcCode\">\u003C/pre>\u003C/div>\n        <div class=\"rc-th\"><h4>Threads\u003C/h4><div class=\"rc-state\" id=\"rcThreads\">\u003C/div><div class=\"rc-state\" id=\"rcShared\">\u003C/div>\u003C/div>\n        <div class=\"rc-heap\"><h4>Heap\u003C/h4><div id=\"rcHeap\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <div class=\"rc-verdict idle\" id=\"rcVerdict\">Step the two threads in any order, or play the interleaving that breaks each version.\u003C/div>\n      <div class=\"log\" id=\"rcLog\" style=\"height:78px;margin-top:10px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">The “DCL, no volatile” mode shows the reordering the Java memory model allows: allocate, publish the reference, then run the constructor. Real hardware and JITs do this; the bug is rare, timing-dependent, and nearly impossible to reproduce on demand, which is exactly why it's dangerous.\u003C/div>\n  \u003C/div>\n\n  <h2>Five correct versions, and the one to use\u003C/h2>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Version\u003C/th><th>Thread-safe?\u003C/th><th>Lazy?\u003C/th><th>Cost per call\u003C/th><th>Notes\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Eager <code>static final\u003C/code>\u003C/td><td>Yes (class init)\u003C/td><td>At first use of the class\u003C/td><td>None\u003C/td><td>The default. Simple and correct.\u003C/td>\u003C/tr>\n        <tr><td><code>synchronized\u003C/code> getter\u003C/td><td>Yes\u003C/td><td>Yes\u003C/td><td>A lock, every call\u003C/td><td>Correct; the lock is rarely a real bottleneck, but it's wasted\u003C/td>\u003C/tr>\n        <tr><td>Double-checked + <code>volatile\u003C/code>\u003C/td><td>Yes (Java 5+)\u003C/td><td>Yes\u003C/td><td>A volatile read\u003C/td><td>Easy to get wrong; only worth it for instance fields, not static singletons\u003C/td>\u003C/tr>\n        <tr><td>Holder class idiom\u003C/td><td>Yes (class init)\u003C/td><td>Yes, on first <code>get()\u003C/code>\u003C/td><td>None\u003C/td><td>Best lazy static singleton\u003C/td>\u003C/tr>\n        <tr><td><code>enum\u003C/code> with one constant\u003C/td><td>Yes (class init)\u003C/td><td>At first use\u003C/td><td>None\u003C/td><td>Also safe against reflection and serialization creating a second instance\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n<pre class=\"code\"><span class=\"c\">// Holder idiom: the nested class isn't initialised until get() touches it\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> {\n\t<span class=\"k\">private\u003C/span> <span class=\"f\">ConfigRegistry\u003C/span>() { … }\n\t<span class=\"k\">private static final class\u003C/span> <span class=\"t\">Holder\u003C/span> { <span class=\"k\">static final\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> INSTANCE = <span class=\"k\">new\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span>(); }\n\t<span class=\"k\">public static\u003C/span> <span class=\"t\">ConfigRegistry\u003C/span> <span class=\"f\">get\u003C/span>() { <span class=\"k\">return\u003C/span> <span class=\"t\">Holder\u003C/span>.INSTANCE; }\n}\n\n<span class=\"c\">// Enum singleton (Effective Java's recommendation)\u003C/span>\n<span class=\"k\">public enum\u003C/span> <span class=\"t\">MetricsRegistry\u003C/span> {\n\tINSTANCE;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">ConcurrentHashMap\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">LongAdder\u003C/span>&gt; counters = <span class=\"k\">new\u003C/span> <span class=\"t\">ConcurrentHashMap\u003C/span>&lt;&gt;();\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">increment\u003C/span>(<span class=\"t\">String\u003C/span> name) { counters.<span class=\"f\">computeIfAbsent\u003C/span>(name, k -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">LongAdder\u003C/span>()).<span class=\"f\">increment\u003C/span>(); }\n}\u003C/pre>\n  <p>Both rely on the same JVM guarantee as the eager version: class initialisation happens once, under a lock, and its results are visible to every thread. The holder just delays it until <code>get()\u003C/code> is first called.\u003C/p>\n\n  <h2>Why it's usually wrong\u003C/h2>\n  <p>Getting one instance safely is solved. The trouble is what the pattern does to the rest of the design:\u003C/p>\n  <ul>\n    <li><b>It's a hidden dependency.\u003C/b> Any method can call <code>ConfigRegistry.get()\u003C/code>, so a class's constructor no longer tells you what it depends on (<a href=\"08-dependency-injection.html\">Chapter 8\u003C/a>).\u003C/li>\n    <li><b>It can't be substituted.\u003C/b> Code that calls <code>MetricsRegistry.INSTANCE\u003C/code> can't be given a fake, so tests either touch the real thing or can't run.\u003C/li>\n    <li><b>State leaks between tests.\u003C/b> One test increments a counter; the next test sees it. Test order starts to matter, and a suite that passes alone fails in CI.\u003C/li>\n    <li><b>It fixes lifecycle and count forever.\u003C/b> “Exactly one per JVM” was true until the day you need one registry per tenant, or two connection pools for two databases.\u003C/li>\n    <li><b>It's often mutable global state\u003C/b>, so it needs thread safety everywhere it's used.\u003C/li>\n  \u003C/ul>\n  <p>The fix keeps the useful half. “Only one instance” is a <b>wiring decision\u003C/b>, not a property the class must enforce: create one instance in the composition root and pass it to everyone who needs it.\u003C/p>\n<pre class=\"code\"><span class=\"c\">// Composition root: one instance by construction, not by a private constructor\u003C/span>\n<span class=\"t\">Metrics\u003C/span> metrics = <span class=\"k\">new\u003C/span> <span class=\"t\">InMemoryMetrics\u003C/span>();\n<span class=\"t\">OrderService\u003C/span> orders = <span class=\"k\">new\u003C/span> <span class=\"t\">OrderService\u003C/span>(payments, mailer, clock, ids, metrics);\n<span class=\"t\">SearchService\u003C/span> search = <span class=\"k\">new\u003C/span> <span class=\"t\">SearchService\u003C/span>(index, metrics);      <span class=\"c\">// same object, visibly shared\u003C/span>\n\n<span class=\"c\">// In a test: a fresh, isolated instance per test\u003C/span>\n<span class=\"t\">RecordingMetrics\u003C/span> metrics = <span class=\"k\">new\u003C/span> <span class=\"t\">RecordingMetrics\u003C/span>();\u003C/pre>\n  <p>DI frameworks call this “singleton scope”, and it's what they mean by a singleton: one instance per container, created and injected by the wiring. The Gang of Four pattern, with its private constructor and static accessor, is a different and much more rigid thing.\u003C/p>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>“There should be only one”\u003C/b> Say why: shared cache, one pool per database, one registry.\u003C/li>\n      <li data-k=\"decision\"><b>Is it immutable and stateless?\u003C/b> A constant like an empty list or a comparator: a static singleton is fine.\u003C/li>\n      <li data-k=\"decision\"><b>Does anything need a different one?\u003C/b> Tests, a second tenant, a second database. If so, don't enforce one.\u003C/li>\n      <li><b>Create one in the composition root\u003C/b> Pass it through constructors like any other dependency.\u003C/li>\n      <li data-k=\"end\"><b>Only if you truly can't inject\u003C/b> (legacy code, a static framework hook): use an enum or holder-class singleton.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Deciding about a singleton.\u003C/b> In a modern design, the answer is almost always “one instance, injected”.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The tests that only fail together\u003C/div><p>A payments team keeps a <code>FeatureFlags.getInstance()\u003C/code> singleton. One test turns on <code>new_checkout\u003C/code> to test the new flow, and forgets to turn it off. Every test that runs after it in the same JVM now takes the new path. Locally, running one test at a time, everything passes. In CI, where the test runner happens to order that test first, eleven unrelated tests fail, and nobody can reproduce it. The fix that sticks isn't adding a reset method; it's passing a <code>FeatureFlags\u003C/code> object into the classes that read flags, so each test builds its own.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Unsynchronised lazy init.\u003C/b> Two threads can both create an instance.\u003C/li>\n      <li><b>Double-checked locking without <code>volatile\u003C/code>.\u003C/b> Another thread can see a half-constructed object.\u003C/li>\n      <li><b>Hand-rolling laziness nobody needs.\u003C/b> Eager <code>static final\u003C/code> is already initialised on first use of the class.\u003C/li>\n      <li><b>Mutable singletons with plain fields.\u003C/b> Every thread shares them: use concurrent types or locks.\u003C/li>\n      <li><b>Calling <code>X.getInstance()\u003C/code> deep inside business code.\u003C/b> Take it as a constructor parameter instead.\u003C/li>\n      <li><b>Adding <code>reset()\u003C/code> for tests.\u003C/b> A sign the object should be created per test, not global.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Write a thread-safe lazy singleton in Java and say why it's safe.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I'd use the holder idiom: a private constructor, a private static nested <code>Holder\u003C/code> class with a <code>static final INSTANCE\u003C/code>, and <code>get()\u003C/code> returning <code>Holder.INSTANCE\u003C/code>. It's lazy because the nested class isn't initialised until <code>get()\u003C/code> first touches it, and thread-safe because the JVM runs class initialisation exactly once under a lock and publishes the result to all threads. An enum with one constant is equally safe and also resists reflection and serialization. Double-checked locking works too, but only with a <code>volatile\u003C/code> field.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Your design has a <code>RateLimiterRegistry.getInstance()\u003C/code> used in twenty places. What problems do you expect, and how would you refactor?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Hidden dependencies, tests sharing limiter state and depending on execution order, no way to use a fake or a fixed clock, and trouble the day we need per-tenant registries. I'd create one registry in the composition root and pass it through the constructors of the twenty classes, starting with the ones we test most. During the migration the static accessor can delegate to the injected instance so nothing breaks, and I'd delete it once the last caller is converted. “Only one” becomes a wiring decision the tests can override.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Singleton: private constructor plus a static accessor to the one instance.\u003C/li>\n      <li>Eager <code>static final\u003C/code> is thread-safe and already lazy to first class use; it's the default.\u003C/li>\n      <li>Naive lazy init races; double-checked locking needs <code>volatile\u003C/code> to stop half-built objects being seen.\u003C/li>\n      <li>Holder-class and enum singletons are lazy (or near enough) and thread-safe through the JVM's class-initialisation lock.\u003C/li>\n      <li>The design cost is global state: hidden dependencies, no substitution, state leaking between tests, a fixed count.\u003C/li>\n      <li>Prefer one instance created in the composition root and injected: “singleton scope” without the pattern.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class
