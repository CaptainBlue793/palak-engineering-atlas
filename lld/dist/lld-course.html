* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);

}
a { color: var(--accent); text-decoration: none; }

:not(pre) > code {
  background: var(--surface-2); border: 1px solid var(--border);
  padding: .08em .38em; border-radius: 6px; font-size: .86em; color: var(--pink);
}
::selection { background: var(--accent-soft); }
button { font-family: inherit; }

/* ---------- Reading progress ---------- */
.read-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 100; transition: width .1s linear;
}

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);

  transition: transform .3s ease;
}
.sidebar .brand {

}
.sidebar .brand:hover { text-decoration: none; }
.brand-logo {

  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 17px;
  box-shadow: 0 6px 18px var(--accent-soft); flex: none;
}
.atlas-wordmark { display: block; width: 102px; height: 32px; flex: none; color: var(--text); }
.atlas-wordmark .gold { fill: var(--amber); }
.topbar .crumb .atlas-home { display: inline-flex; align-items: center; vertical-align: middle; }
.topbar .crumb .atlas-wordmark { width: 64px; height: 20px; }
.brand-author { display: block; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand-course { display: block; font-size: 16px; line-height: 1.2; }
.side-progress { margin: 0 10px 18px; }
.side-progress .bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.side-progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s; }
.side-progress small { color: var(--muted); font-size: 12px; }
.nav-level {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  font-weight: 700; padding: 14px 10px 6px;
}
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px;
  color: var(--text-2); font-size: 14px; line-height: 1.35; margin-bottom: 1px;
}
.nav-link:hover { background: var(--surface-2); text-decoration: none; }
.nav-link .num {
  flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; font-weight: 700; color: var(--muted);
  font-family: var(--mono);
}
.nav-link.done .num { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

.nav-link.current .num { background: var(--accent); color: #fff; border-color: transparent; }
.toc { margin: 4px 0 8px 44px; border-left: 1px solid var(--border); }
.toc a { display: block; padding: 3px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-left: -1px; border-left: 2px solid transparent; }
.toc a:hover { color: var(--text); text-decoration: none; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 40; height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 28px; background: color-mix(in srgb, var(--bg) 82%, transparent);

}

.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 17px;
  transition: .2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.content { max-width: 1120px; margin: 0 auto; padding: 28px 36px 80px; }

@media (max-width: 1180px) {

/* ---------- Chapter hero ---------- */
.hero {
  position: relative; padding: 28px 30px 26px; border-radius: 20px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 32px;
}
.hero::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
.hero > * { position: relative; }
.hero .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  font-family: var(--mono); letter-spacing: .02em;
  padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.pill.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.pill.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pill.cyan { background: var(--accent-2-soft); color: var(--accent-2); border-color: transparent; }
.pill.pink { background: var(--pink-soft); color: var(--pink); border-color: transparent; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 12px; font-weight: 800; }
.hero h1 .grad, .grad {
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p.lead { font-size: 17px; color: var(--text-2); margin: 0 0 18px; max-width: 900px; }
.objectives { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; margin: 0; padding: 0; list-style: none; }
.objectives li { display: flex; gap: 9px; font-size: 14.5px; color: var(--text-2); line-height: 1.45; }
.objectives li::before { content: "✓"; color: var(--accent); font-weight: 800; flex: none; }

/* ---------- Typography ---------- */
.content h2 {
  font-size: 26px; letter-spacing: -.025em; line-height: 1.2; margin: 48px 0 12px; font-weight: 800;
  display: flex; align-items: center; gap: 12px;
}
.content h2 .sec-num {
  font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  padding: 3px 9px; border-radius: 8px; letter-spacing: 0;
}
.content h3 { font-size: 19px; letter-spacing: -.015em; margin: 28px 0 8px; font-weight: 700; }
.content h4 { font-size: 16px; margin: 18px 0 6px; font-weight: 700; }
.content p { margin: 0 0 14px; color: var(--text-2); }
.content ul, .content ol { color: var(--text-2); padding-left: 22px; margin: 0 0 14px; }
.content li { margin-bottom: 4px; }
.content strong { color: var(--text); }
.muted { color: var(--muted) !important; }
.small { font-size: 14px; }
.center { text-align: center; }
hr.sep { border: 0; border-top: 1px dashed var(--border); margin: 32px 0; }

/* ---------- Callouts ---------- */
.callout {
  display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); margin: 18px 0;
  background: var(--accent-soft); border: 1px solid transparent;
}
.callout .ico { font-size: 20px; line-height: 1.4; flex: none; }
.callout .body { flex: 1; min-width: 0; }
.callout .body > :last-child { margin-bottom: 0; }
.callout .title { font-weight: 700; color: var(--text); margin-bottom: 3px; font-size: 15px; }
.callout p { font-size: 15px; }
.callout.tip { background: var(--green-soft); }
.callout.warn { background: var(--amber-soft); }
.callout.danger { background: var(--red-soft); }
.callout.analogy { background: var(--accent-2-soft); }
.callout.interview { background: var(--pink-soft); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; margin: 20px 0; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.feature { position: relative; }
.feature .f-ico {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px;
  background: var(--accent-soft); margin-bottom: 12px;
}
.feature h4 { margin: 0 0 6px !important; font-size: 16px; }
.feature p { font-size: 14.5px; margin: 0 !important; line-height: 1.55; }

/* ---------- Flip cards ---------- */
.flip { perspective: 1000px; cursor: pointer; min-height: 170px; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 170px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 18px;
  display: flex; flex-direction: column; justify-content: center; box-shadow: var(--shadow);
}
.flip .front { align-items: center; text-align: center; gap: 8px; }
.flip .front .big { font-size: 34px; }
.flip .front h4 { margin: 0 !important; }
.flip .front small { color: var(--muted); font-size: 12px; }
.flip .back { transform: rotateY(180deg); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)), var(--surface); font-size: 14.5px; color: var(--text-2); line-height: 1.55; }

/* ---------- Diagram / interactive panels ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); margin: 20px 0; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); flex-wrap: wrap;
}
.panel-head .dots { display: flex; gap: 6px; }
.panel-head .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.panel-head .dots i:nth-child(1) { background: #ff5f57; } .panel-head .dots i:nth-child(2) { background: #febc2e; } .panel-head .dots i:nth-child(3) { background: #28c840; }
.panel-head .p-title { font-weight: 700; font-size: 14px; }
.panel-head .p-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.panel-body { padding: 18px; }
.panel-foot { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 14px; color: var(--muted); }

.diagram { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--font); }
.diagram text { fill: var(--text); font-size: 14px; }
.diagram .lbl { fill: var(--muted); font-size: 12px; }
.diagram .mono { font-family: var(--mono); }
.diagram .node rect, .diagram .node circle, .diagram .node ellipse, .diagram .node path.shape {
  fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; transition: all .35s;
}
.diagram .node text { font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.diagram .node .ico { font-size: 20px; }
.diagram .node.on rect, .diagram .node.on circle, .diagram .node.on ellipse, .diagram .node.on path.shape {
  stroke: var(--accent); fill: var(--accent-soft); stroke-width: 2.2; filter: drop-shadow(0 0 10px var(--accent-soft));
}
.diagram .node.ok rect, .diagram .node.ok circle { stroke: var(--green); fill: var(--green-soft); }
.diagram .node.bad rect, .diagram .node.bad circle { stroke: var(--red); fill: var(--red-soft); }
.diagram .node.warn rect, .diagram .node.warn circle { stroke: var(--amber); fill: var(--amber-soft); }
.diagram .edge { stroke: var(--border-strong); stroke-width: 1.8; fill: none; transition: all .35s; }
.diagram .edge.on { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 6; animation: flow .7s linear infinite; }
.diagram .edge.dash { stroke-dasharray: 5 5; }
.diagram .edge.bad { stroke: var(--red); }
.diagram .edge.ok { stroke: var(--green); }
.diagram .dimmable { transition: opacity .35s; }
.diagram.stepping .dimmable:not(.on) { opacity: .35; }
.diagram .arrow-head { fill: var(--border-strong); }
@keyframes flow { to { stroke-dashoffset: -13; } }
.packet { filter: drop-shadow(0 0 6px currentColor); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: all .18s; line-height: 1.3; white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--text-2); font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input[type=number], .field input[type=text], .field select, input.inp, select.inp {
  font-family: var(--mono); font-size: 14px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); outline: none; min-width: 0;
}
.field input:focus, .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.range-row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-2); flex-wrap: wrap; }
.range-row label { min-width: 150px; font-weight: 600; }
.range-row output { font-family: var(--mono); color: var(--accent); font-weight: 600; min-width: 70px; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 140px; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 0; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -.02em; margin-top: 2px; line-height: 1.2; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat.good .v { color: var(--green); } .stat.bad .v { color: var(--red); } .stat.acc .v { color: var(--accent); } .stat.warn .v { color: var(--amber); }

/* ---------- Tabs ---------- */
.tabs { margin: 24px 0; }
.tab-list { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab-list button {
  background: none; border: 0; padding: 10px 16px; font-weight: 600; font-size: 14px; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab-list button:hover { color: var(--text); }
.tab-list button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; padding: 20px 0 0; animation: fadeUp .35s ease; }
.tab-panel.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Stepper ---------- */
.stepper { margin-top: 0; }
.stepper-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
.stepper-bar .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-right: auto; }
.stepper-dots { display: flex; gap: 5px; margin-right: 8px; }
.stepper-dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--border-strong); cursor: pointer; transition: .3s; }
.stepper-dots i.active { width: 22px; background: var(--accent); }
.stepper-dots i.past { background: var(--accent); opacity: .45; }
.step-text { padding: 16px 20px; min-height: 92px; border-top: 1px solid var(--border); }
.step-text .st-title { font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.step-text .st-title .n { font-family: var(--mono); font-size: 12px; background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 7px; }
.step-text .st-desc { color: var(--text-2); font-size: 15px; line-height: 1.6; animation: fadeUp .35s ease; }
.stepper ol.steps { display: none; }

/* ---------- Quiz ---------- */
.quiz-wrap { margin: 44px 0 16px; }
.quiz {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 12px 0; box-shadow: var(--shadow);
}
.quiz .q { font-weight: 700; color: var(--text); margin: 0 0 12px; font-size: 16px; display: flex; gap: 10px; }
.quiz .q .qn { flex: none; font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; height: fit-content; margin-top: 2px; }
.quiz .opts { display: grid; gap: 8px; }
.quiz .opt {
  text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); font-size: 15px; cursor: pointer; transition: all .18s; display: flex; gap: 10px; align-items: center;
}
.quiz .opt::before { content: attr(data-letter); font-family: var(--mono); font-weight: 700; font-size: 12px; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); flex: none; }
.quiz .opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.quiz .opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--text); }
.quiz .opt.correct::before { content: "✓"; background: var(--green); color: #fff; border-color: transparent; }
.quiz .opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--text); animation: shake .4s; }
.quiz .opt.wrong::before { content: "✕"; background: var(--red); color: #fff; border-color: transparent; }
.quiz .opt:disabled { cursor: default; }
.quiz .explain { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; color: var(--text-2); border-left: 3px solid var(--accent); }
.quiz.answered .explain { display: block; animation: fadeUp .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.quiz-score { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)); font-weight: 600; }
.quiz-score .big { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--accent); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; padding: 11px 14px; background: var(--surface-2); color: var(--text); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr:hover td { background: var(--surface-2); }
.yes { color: var(--green); font-weight: 700; } .no { color: var(--red); font-weight: 700; } .meh { color: var(--amber); font-weight: 700; }

/* ---------- Code ---------- */
pre.code {
  background: #0d1117; color: #e6edf3; border-radius: 12px; padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.6;
  border: 1px solid var(--border); margin: 16px 0;
}
pre.code .c { color: #8b949e; } pre.code .k { color: #ff7b72; } pre.code .s { color: #a5d6ff; } pre.code .f { color: #d2a8ff; } pre.code .n { color: #79c0ff; } pre.code .g { color: #7ee787; }

/* ---------- Key takeaways ---------- */
.takeaways { border-radius: 18px; padding: 22px 24px; margin: 40px 0 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.takeaways::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(var(--accent), var(--accent-2)); }
.takeaways h3 { margin: 0 0 12px !important; }
.takeaways ul { list-style: none; padding: 0; margin: 0; }
.takeaways li { padding-left: 28px; position: relative; margin-bottom: 9px; }
.takeaways li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }

/* ---------- Chapter footer nav ---------- */
.chapter-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.chapter-nav a { display: block; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: .2s; }
.chapter-nav a:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow); }
.chapter-nav small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chapter-nav .nx { text-align: right; grid-column: 2; }
.complete-box { margin-top: 32px; text-align: center; padding: 24px; border-radius: 18px; border: 1px dashed var(--border-strong); }
.complete-box.done { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.complete-box p { margin: 0 0 12px !important; }

/* ---------- Misc visual bits ---------- */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
.kbd { font-family: var(--mono); font-size: 12px; padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.log {
  font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; height: 150px; overflow-y: auto; color: var(--text-2); line-height: 1.6;
}
.log div { animation: fadeUp .25s; }
.log .ok { color: var(--green); } .log .bad { color: var(--red); } .log .acc { color: var(--accent); } .log .warn { color: var(--amber); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-family: var(--mono); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; } }
.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
@media (max-width: 600px) { .pros-cons { grid-template-columns: 1fr; } }
.pros-cons > div { border-radius: 12px; padding: 14px 16px; font-size: 14.5px; }
.pros-cons ul { margin: 6px 0 0; padding-left: 18px; }
.pros-cons .pros { background: var(--green-soft); } .pros-cons .cons { background: var(--red-soft); }
.pros-cons h5 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.pros-cons .pros h5 { color: var(--green); } .pros-cons .cons h5 { color: var(--red); }
.timeline { position: relative; margin: 24px 0; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--accent-2)); border-radius: 2px; }
.timeline .ti { position: relative; margin-bottom: 20px; }
.timeline .ti::before { content: attr(data-n); position: absolute; left: -34px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; font-family: var(--mono); }
.timeline .ti h4 { margin: 0 0 4px !important; }
.timeline .ti p { margin: 0 !important; font-size: 15px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; transition: .2s; font-family: var(--mono); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }
.mt0 { margin-top: 0 !important; } .mb0 { margin-bottom: 0 !important; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.svg-scroll { overflow-x: auto; }
.svg-scroll svg { min-width: 560px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ---------- Search palette & study tools ---------- */
.search-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .2s;
}
.search-btn:hover { border-color: var(--accent); color: var(--text); }
.search-btn .kbd { margin-left: 4px; }
@media (max-width: 700px) { .search-btn span { display: none; } .search-btn .kbd { display: none; } }
.nav-link.study .num { background: transparent; font-size: 14px; }
.palette { position: fixed; inset: 0; background: rgba(6,8,14,.55); backdrop-filter: blur(3px); z-index: 300; display: none; padding: 10vh 16px 16px; }
.palette.show { display: block; animation: fadeUp .18s; }
.pal-inner { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; }
.pal-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 17px; }
.pal-top input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--text); }
.pal-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.pal-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--text); }
.pal-item:hover, .pal-item.sel { background: var(--accent-soft); text-decoration: none; }
.pal-item.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pal-ico { text-align: center; color: var(--muted); font-size: 14px; }
.pal-text { min-width: 0; }
.pal-text b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-text small { color: var(--muted); font-size: 12px; }
.pal-lv { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.pal-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 14px; }
.pal-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }

/* ---------- Interview drill ---------- */
details.ans { margin: 6px 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
details.ans > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--accent); list-style: none; }
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸ "; }
details.ans[open] > summary::before { content: "▾ "; }
details.ans > div { padding: 0 12px 12px; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
details.ans > div b { color: var(--text); }
.callout .body ul.mb0 { margin: 6px 0 0; padding-left: 18px; }
.callout .body ul.mb0 li { margin: 3px 0; font-size: 14px; }

/* =========================================================
   LLD-specific components
   ========================================================= */

/* ---------- Code blocks: Java in the house style ---------- */
pre.code { tab-size: 4; -moz-tab-size: 4; }
pre.code .t  { color: #ffa657; }   /* type / class name  */
pre.code .o  { color: #ff7b72; }   /* keyword / operator */
pre.code .m  { color: #79c0ff; }   /* number             */
pre.code .hl { display: block; margin: 0 -18px; padding: 0 18px; background: rgba(129,140,248,.16); box-shadow: inset 3px 0 0 var(--accent); }

/* a code block with a header strip: file/function name + complexity chips */
.codebox { margin: 18px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0d1117; }
.codebox > .cb-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.codebox > .cb-head .cb-name { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text); }
.codebox > .cb-head .cb-sp { flex: 1; }
.codebox > pre.code { margin: 0; border: 0; border-radius: 0; }
.codebox > .cb-foot { padding: 10px 14px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.codebox > .cb-foot b { color: var(--text); }

/* complexity chips */
.cx { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.cx.time  { background: var(--accent-soft); color: var(--accent); }
.cx.space { background: var(--accent-2-soft); color: var(--accent-2); }
.cx.good  { background: var(--green-soft); color: var(--green); }
.cx.bad   { background: var(--red-soft); color: var(--red); }
.cx.mid   { background: var(--amber-soft); color: var(--amber); }

/* ---------- Array / cell visualizer ---------- */
.cells { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
.cell {
  min-width: 40px; height: 40px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text);
  background: var(--surface-2); border: 1.6px solid var(--border); position: relative; transition: .25s;
}
.cell small { position: absolute; bottom: -17px; left: 0; right: 0; text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cell.on    { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); transform: translateY(-3px); }
.cell.ok    { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.cell.bad   { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.cell.warn  { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.cell.dim   { opacity: .32; }
.cell.win   { border-color: var(--accent-2); background: var(--accent-2-soft); }
.cell.ptr::after { content: attr(data-ptr); position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 11px; font-family: var(--mono); font-weight: 800; color: var(--accent); white-space: nowrap; }
.cells.idx { margin-bottom: 26px; }
.cells.ptr-row { margin-top: 24px; }

/* bars, for sorting + histogram visualizers */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 170px; margin: 16px 0; padding: 0 2px; }
.bars i { flex: 1; min-width: 3px; background: var(--accent); border-radius: 3px 3px 0 0; transition: height .12s, background .12s; display: block; }
.bars i.cmp  { background: var(--amber); }
.bars i.swap { background: var(--red); }
.bars i.done { background: var(--green); }
.bars i.piv  { background: var(--pink); }

/* ---------- Dry-run trace table ---------- */
.trace { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 12px; }
table.tr { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
table.tr th { background: var(--surface-2); padding: 8px 11px; text-align: left; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tr td { padding: 6px 11px; border-bottom: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
table.tr tr:last-child td { border-bottom: 0; }
table.tr tr.hi td { background: var(--accent-soft); color: var(--text); }
table.tr td.k { color: var(--accent); font-weight: 700; }

/* ---------- Pattern cards (the playbook) ---------- */
.pat { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 14px 16px; margin: 12px 0; }
.pat h5 { margin: 0 0 4px; font-size: 14.5px; color: var(--text); }
.pat p { margin: 0; font-size: 14px; color: var(--text-2); }
.pat .sig { font-family: var(--mono); font-size: 12.5px; color: var(--accent); margin-top: 6px; display: block; }

/* ---------- "My convention" callouts ---------- */
.callout.house { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.callout.house .title { color: var(--accent); }
.callout.proof { background: var(--accent-2-soft); border-left: 3px solid var(--accent-2); }
.callout.proof .title { color: var(--accent-2); }

/* ---------- Complexity ladder ---------- */
.ladder { display: grid; gap: 6px; margin: 18px 0; }
.ladder .rung { display: grid; grid-template-columns: 100px 1fr 96px; gap: 12px; align-items: center; font-size: 13.5px; }
.ladder .rung b { font-family: var(--mono); font-size: 13px; }
.ladder .rung .bar { height: 20px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.ladder .rung .bar i { display: block; height: 100%; border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.ladder .rung span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; }

/* ---------- Practice problem lists ---------- */
.plist { display: grid; gap: 6px; margin: 14px 0; }
.pitem { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.pitem .d { font-size: 10.5px; font-family: var(--mono); font-weight: 800; padding: 2px 7px; border-radius: 5px; }
.pitem .d.e { background: var(--green-soft); color: var(--green); }
.pitem .d.m { background: var(--amber-soft); color: var(--amber); }
.pitem .d.h { background: var(--red-soft); color: var(--red); }
.pitem .tag { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

/* ---------- Practice-item resource links (generated by tools/lc-links.js) ---------- */
.pitem .lcs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pitem .lc { font-family: var(--mono); font-size: 10.5px; font-weight: 800; line-height: 1; white-space: nowrap;
  padding: 4px 7px; border-radius: 6px; text-decoration: none; transition: all .15s;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
.pitem .lc:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.pitem .lc.paid { background: var(--amber-soft); color: var(--amber); }
.pitem .lc.paid:hover { background: var(--amber); color: #fff; border-color: var(--amber); }
.pitem .lc.paid::after { content: "★"; margin-left: 3px; font-size: 9px; }
.pitem .lc.ref { background: var(--surface-3); color: var(--muted); }
.pitem .lc.ref:hover { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
@media (max-width: 640px) {
  .pitem { grid-template-columns: auto 1fr; }
  .pitem .tag { grid-column: 1; }
  .pitem .lcs { grid-column: 2; }
}

/* ---------- Tree / graph nodes for inline SVG ---------- */
.diagram .tn circle, .diagram .tn rect { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.8; transition: all .3s; }
.diagram .tn text { font-family: var(--mono); font-weight: 700; font-size: 13px; text-anchor: middle; dominant-baseline: middle; fill: var(--text); }
.diagram .tn.on circle, .diagram .tn.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.6; }
.diagram .tn.visit circle, .diagram .tn.visit rect { fill: var(--accent-2-soft); stroke: var(--accent-2); }
.diagram .tn.done circle, .diagram .tn.done rect { fill: var(--green-soft); stroke: var(--green); }
.diagram .tn.stack circle, .diagram .tn.stack rect { fill: var(--amber-soft); stroke: var(--amber); }
.diagram .tn.bad circle, .diagram .tn.bad rect { fill: var(--red-soft); stroke: var(--red); }
.diagram .tn.nil circle { fill: none; stroke-dasharray: 3 3; opacity: .5; }

/* ---------- Side-by-side comparison ---------- */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }

/* ---------- Recursion tree (text art) ---------- */
.rtree { font-family: var(--mono); font-size: 12.5px; line-height: 1.75; color: var(--text-2); white-space: pre; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }

.dpg { display: inline-grid; gap: 3px; margin: 16px 0; }

.tricks { display: grid; gap: 10px; margin: 20px 0; }
.trick {

/* ---------- Small screens & touch ----------

   the screen, tightens spacing on phones, and gives touch devices finger-sized targets. */
:not(pre) > code { overflow-wrap: anywhere; }

/* ---------- Sequence diagrams, workflows, comparisons & use cases (shared visuals) ---------- */
figure.seq, figure.flow { margin: 24px 0; padding: 16px 16px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }

.seq-msg.cur .seq-arrow { stroke: var(--accent); stroke-width: 2.4; }
.seq-msg.cur .seq-label { fill: var(--accent); font-weight: 700; }
.seq-msg.k-fail.cur .seq-label, .seq-msg.k-bad.cur .seq-label, .seq-msg.k-bad .seq-label { fill: var(--red); }
.seq-note { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1; }

figure.flow.fl-row > ol { flex-wrap: nowrap; }

@media (max-width: 640px) {

"M530,380 L585,380\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-dom-ref\" class=\"edge\" d=\"M715,380 L770,380\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-ref-pb\" class=\"edge\" d=\"M900,380 L955,380\" marker-end=\"url(#ah)\"/>\r\n        <g class=\"node\" data-ch=\"22\" data-t=\"Thread-safe class design\" data-d=\"Races, locks, immutability and confinement.\" transform=\"translate(30,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🔐 Thread safety\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 22 · locks\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"23\" data-t=\"Producer-consumer &amp; thread pools\" data-d=\"BlockingQueue, ExecutorService and backpressure.\" transform=\"translate(215,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🧵 Pools\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 23 · queues\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"26\" data-t=\"Persistence\" data-d=\"Keeping SQL out of the domain model.\" transform=\"translate(400,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🗄️ Persistence\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 26 · repository\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"27\" data-t=\"Domain modeling\" data-d=\"Entities, value objects, aggregates and domain events.\" transform=\"translate(585,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🏛️ Domain model\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 27 · aggregates\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"29\" data-t=\"Code smells &amp; refactoring\" data-d=\"Each smell refactored into the pattern that fixes it.\" transform=\"translate(770,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🧹 Refactoring\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 29 · smells\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"30\" data-t=\"Interview playbook\" data-d=\"The rubric, time boxing and “now add X” follow-ups.\" transform=\"translate(955,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🎤 Playbook\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 30 · 45 min\u003C/text>\u003C/g>\r\n\r\n        <text x=\"24\" y=\"476\" class=\"plane\">LAYER 4 — CASE STUDIES\u003C/text>\r\n        <line x1=\"20\" y1=\"484\" x2=\"1100\" y2=\"484\" stroke=\"var(--border)\" stroke-dasharray=\"2 6\"/>\r\n\r\n        <g class=\"node\" data-ch=\"31\" data-t=\"LRU &amp; LFU cache\" data-d=\"O(1) get/put, pluggable eviction, thread safety.\" transform=\"translate(30,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">⚡ LRU cache\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 31 · O(1)\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"34\" data-t=\"In-memory pub-sub broker\" data-d=\"Kafka’s core ideas in one JVM.\" transform=\"translate(215,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">📬 Pub-sub\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 34 · topics\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"32\" data-t=\"Rate limiter\" data-d=\"Algorithms as strategies, per-client state.\" transform=\"translate(400,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🚥 Rate limiter\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 32 · buckets\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"42\" data-t=\"Movie ticket booking\" data-d=\"Seat holds with expiry and no double booking.\" transform=\"translate(585,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🎟️ Ticketing\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 42 · seat holds\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"38\" data-t=\"Text editor\" data-d=\"A gap buffer and edits as commands.\" transform=\"translate(770,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">📝 Editor\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 38 · undo\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"41\" data-t=\"Elevator system\" data-d=\"Car state machines and dispatch strategies.\" transform=\"translate(955,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🛗 Elevator\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 41 · dispatch\u003C/text>\u003C/g>\r\n\r\n        <path id=\"e-solid-str\" class=\"edge dash\" d=\"M465,105 L465,205\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-obs-dom\"   class=\"edge dash\" d=\"M650,255 L650,355\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-ts-lru\"    class=\"edge dash\" d=\"M95,405 L95,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-pc-pub\"    class=\"edge dash\" d=\"M280,405 L280,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-dom-tix\"   class=\"edge dash\" d=\"M650,405 L650,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-st-elev\"   class=\"edge dash\" d=\"M1085,230 L1105,230 L1105,489 L1020,489 L1020,505\" marker-end=\"url(#ah)\"/>\r\n      \u003C/svg>\r\n      \u003C/div>\r\n      <div class=\"map-info\" id=\"mapInfo\"><span class=\"mi-ico\">👆\u003C/span><div><b>Hover or click a box\u003C/b><span>Dependencies are flowing upward through the layers live.\u003C/span>\u003C/div>\u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\">One code style, all the way through\u003C/h2>\r\n    <p class=\"section-sub reveal\">Every listing in this course is Java written the same way, so the shape of the code becomes a memory aid instead of noise. This is the style, stated once in Chapter 1 and never broken.\u003C/p>\r\n    <div class=\"style-strip reveal\">\r\n      <div>\r\n        <ul>\r\n          <li><b>Interface first.\u003C/b> Name the role — <code>EvictionPolicy\u003C/code>, <code>SpotAllocator\u003C/code> — before writing any class that plays it.\u003C/li>\r\n          <li><b>Constructor injection, final fields.\u003C/b> Every collaborator arrives through the constructor and never changes. No <code>new\u003C/code> buried in a method, no statics.\u003C/li>\r\n          <li><b>Fail fast at the boundary.\u003C/b> Validate arguments in the constructor or public method, then trust them everywhere inside.\u003C/li>\r\n          <li><b>Small classes, no reflex getters.\u003C/b> Behaviour lives next to the data it changes: tell, don’t ask.\u003C/li>\r\n          <li><b>Every design names its pattern and its extension point\u003C/b> — the change it survives without editing old code.\u003C/li>\r\n        \u003C/ul>\r\n      \u003C/div>\r\n      <div>\r\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; {\r\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">keyAccessed\u003C/span>(<span class=\"t\">K\u003C/span> key);\r\n\t<span class=\"t\">K\u003C/span> <span class=\"f\">evict\u003C/span>();\r\n}\r\n\r\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">K\u003C/span>, <span class=\"t\">V\u003C/span>&gt; {\r\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy;\r\n\t<span class=\"k\">private final int\u003C/span> capacity;\r\n\r\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">Cache\u003C/span>(<span class=\"k\">int\u003C/span> capacity, <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy) {\r\n\t\t<span class=\"k\">if\u003C/span> (capacity &lt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"capacity must be positive\"\u003C/span>);\r\n\t\t<span class=\"k\">this\u003C/span>.capacity = capacity;\r\n\t\t<span class=\"k\">this\u003C/span>.policy = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(policy);\r\n\t}\r\n}\u003C/pre>\r\n        <p class=\"small muted\" style=\"margin:10px 0 0\">LRU, LFU and FIFO are three small classes behind one interface. Adding a fourth never touches <code>Cache\u003C/code>. That is the whole idea.\u003C/p>\r\n      \u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\" id=\"roadmap\">Course roadmap\u003C/h2>\r\n    <p class=\"section-sub reveal\">Go in order — later chapters build on earlier ones. Your progress is saved in this browser.\u003C/p>\r\n    <div id=\"levels\">\u003C/div>\r\n\r\n    <footer class=\"home-foot\">\r\n      <b>Palak Deb Patra's Low-Level Design Playlist\u003C/b> ◆ built for learning, one class at a time.<br>\r\n      <span class=\"small\">© 2026 Palak Deb Patra\u003C/span><br>\r\n      <button class=\"reset-link\" id=\"resetBtn\">Reset my progress\u003C/button>\r\n    \u003C/footer>\r\n  \u003C/div>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { CHAPTERS, LEVELS, LS, $, $$, chNum, chName } = LLD;\r\n  // theme button\r\n  const tb = $('#themeBtn');\r\n  const cur = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\r\n  tb.textContent = cur() === 'dark' ? '☀️' : '🌙';\r\n  tb.onclick = () => { const n = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); LS.set('lld-theme', n); tb.textContent = n === 'dark' ? '☀️' : '🌙'; };\r\n\r\n  const done = new Set(LS.get('lld-done', []));\r\n  const quiz = LS.get('lld-quiz', {});\r\n\r\n  // progress ring\r\n  const pct = done.size / CHAPTERS.length;\r\n  setTimeout(() => { $('#ringFg').style.strokeDashoffset = 314.16 * (1 - pct); }, 200);\r\n  $('#ringTxt').textContent = Math.round(pct * 100) + '%';\r\n  $('#progTxt').textContent = `${done.size} of ${CHAPTERS.length} chapters complete`;\r\n  const next = CHAPTERS.find(c => !done.has(c.n));\r\n  if (next) {\r\n    $('#nextUp').innerHTML = `Up next: <a href=\"${next.file}\"><b>${next.icon} ${next.title}\u003C/b>\u003C/a>`;\r\n    if (done.size) { $('#ctaStart').href = next.file; $('#ctaStart').textContent = `Continue: ${chName(next)} →`; }\r\n  } else { $('#nextUp').innerHTML = '🏆 <b>Course complete!\u003C/b> Outstanding work.'; }\r\n\r\n  const levels = LEVELS;\r\n  const nextN = (CHAPTERS.find(x => !done.has(x.n)) || {}).n;\r\n  // the longest level defines the tick size, so that row ends flush right\r\n  const maxLvl = Math.max(...levels.map(([l]) => CHAPTERS.filter(x => x.level === l).length));\r\n  $('#lvlBars').style.setProperty('--n', maxLvl);\r\n  $('#lvlBars').innerHTML = levels.map(([l,c]) => {\r\n    const all = CHAPTERS.filter(x => x.level === l); const d = all.filter(x => done.has(x.n)).length;\r\n    const ticks = all.map(x => `<a class=\"tick${done.has(x.n) ? ' done' : (x.n === nextN ? ' next' : '')}\" href=\"${x.file}\" title=\"${chNum(x)} · ${x.title.replace(/\"/g, '')}${done.has(x.n) ? ' ✓' : ''}\">\u003C/a>`).join('');\r\n    return `<div class=\"row\"><span>${l}\u003C/span><div class=\"ticks\" style=\"--c:${c}\">${ticks}\u003C/div><span>${d}/${all.length}\u003C/span>\u003C/div>`;\r\n  }).join('');\r\n\r\n  // roadmap cards\r\n  const desc = Object.fromEntries(LEVELS.map(([l, , d]) => [l, d]));\r\n  $('#levels').innerHTML = levels.map(([l,c]) => `\r\n    <div class=\"level-block reveal\">\r\n      <div class=\"level-head\"><span class=\"pill\" style=\"background:color-mix(in srgb, ${c} 14%, transparent);color:${c};border-color:transparent\">${l}\u003C/span><h3>${desc[l]}\u003C/h3><div class=\"line\">\u003C/div>\u003C/div>\r\n      <div class=\"chap-grid\">${CHAPTERS.filter(x=>x.level===l).map(ch => `\r\n        <a class=\"chap-card ${done.has(ch.n)?'done':''}\" href=\"${ch.file}\">\r\n          <div class=\"top\"><span class=\"emo\">${ch.icon}\u003C/span><span class=\"no\">${ch.n < 1 ? chName(ch).toUpperCase() : 'CHAPTER ' + String(ch.n).padStart(2,'0')}\u003C/span>\u003C/div>\r\n          <h4>${ch.title}\u003C/h4>\r\n          <p>${ch.blurb}\u003C/p>\r\n          <div class=\"meta\"><span>⏱ ${ch.mins} min\u003C/span>${done.has(ch.n)?'<span class=\"pill done\">✓ Done\u003C/span>':''}${quiz[ch.n]!=null?`<span class=\"pill cyan\">Quiz ${Math.round(quiz[ch.n]*100)}%\u003C/span>`:''}\u003C/div>\r\n        \u003C/a>`).join('')}\u003C/div>\r\n    \u003C/div>`).join('');\r\n  $$('#levels .reveal').forEach(e => setTimeout(() => e.classList.add('in'), 100));\r\n\r\n  // big map interactions\r\n  const map = $('#bigmap'), info = $('#mapInfo');\r\n  $$('.node', map).forEach(n => {\r\n    const ch = CHAPTERS.find(c => c.n === +n.dataset.ch);\r\n    n.addEventListener('mouseenter', () => {\r\n      info.innerHTML = `<span class=\"mi-ico\">${ch.icon}\u003C/span><div><b>${n.dataset.t} → Chapter ${ch.n}: ${ch.title}\u003C/b><span>${n.dataset.d}\u003C/span>\u003C/div>`;\r\n    });\r\n    n.addEventListener('click', () => LLD.go(ch.file));\r\n  });\r\n  const routes = [\r\n    ['e-uml-req','e-req-solid','e-solid-str','e-str-obs','e-obs-dom','e-dom-tix'],\r\n    ['e-solid-cpl','e-cpl-rel','e-rel-di'],\r\n    ['e-fac-dec','e-dec-str','e-str-obs','e-obs-cmd','e-cmd-st','e-st-elev'],\r\n    ['e-ts-pc','e-pc-pub'],\r\n    ['e-ts-lru'],\r\n    ['e-pc-per','e-per-dom','e-dom-ref','e-ref-pb'],\r\n    ['e-per-dom','e-dom-tix'],\r\n  ];\r\n  const colors = ['var(--accent)','color-mix(in srgb, var(--accent-2) 25%, var(--accent))','color-mix(in srgb, var(--accent-2) 50%, var(--accent))','color-mix(in srgb, var(--accent-2) 75%, var(--accent))','var(--accent-2)'];\r\n  let running = false;\r\n  async function fire() {\r\n    const r = routes[Math.floor(Math.random()*routes.length)], col = colors[Math.floor(Math.random()*colors.length)];\r\n    for (const id of r) await LLD.packetAlong(map, $('#'+id, map), { dur: 420, color: col, r: 5 });\r\n  }\r\n  let timer;\r\n  LLD.whenVisible(map, () => { if (!running) { running = true; timer = setInterval(fire, 650); } }, () => { running = false; clearInterval(timer); });\r\n\r\n  $('#resetBtn').onclick = () => { if (confirm('Reset all course progress and quiz scores?')) { LS.set('lld-done', []); LS.set('lld-quiz', {}); location.reload(); } };\r\n})();\r\n"]},"01-lld-interview.html":{"title":"What an LLD Interview Tests","chapter":"1","styles":"\n  .pc-rows { display:grid; gap:10px; margin-top:12px; }\n  .pc-row { display:grid; grid-template-columns:150px minmax(0,1fr) 56px; gap:12px; align-items:center; font-size:14px; }\n  @media (max-width:600px) { .pc-row { grid-template-columns:110px minmax(0,1fr) 48px; } }\n  .pc-row input { width:100%; accent-color:var(--accent); }\n  .pc-row .v { font-family:var(--mono); font-weight:700; text-align:right; }\n  .pc-bar { display:flex; height:30px; border-radius:10px; overflow:hidden; margin-top:14px; border:1px solid var(--border); background:var(--surface-2); }\n  .pc-bar span { display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; transition:width .25s; }\n  .pc-bar .over { background:repeating-linear-gradient(45deg,var(--red),var(--red) 6px,transparent 6px,transparent 12px); }\n  .pc-scale { display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:4px; }\n  main.content ul.pc-flags { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:6px; }\n  .pc-flags li { padding:8px 12px; border-radius:10px; font-size:14px; }\n  .pc-flags li.bad { background:var(--red-soft); }\n  .pc-flags li.warn { background:var(--amber-soft); }\n  .pc-flags li.ok { background:var(--green-soft); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 1\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 30 min\u003C/span>\u003C/div>\n    <h1>What an LLD Interview <span class=\"grad\">Tests\u003C/span>\u003C/h1>\n    <p class=\"lead\">“Design a parking lot” sounds like a question about parking lots. It isn't. A low-level design round measures how you turn a vague request into a small set of well-shaped classes, and then how well that design survives a change nobody mentioned at the start. This chapter sets out what the round is, how the 45 minutes should go, what gets scored, and the Java house style every listing in this course follows.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Tell an LLD round apart from a DSA round and a system design (HLD) round\u003C/li>\n      <li>Plan the 45 minutes: requirements, entities, class design, APIs, code, extension\u003C/li>\n      <li>Know the eight things interviewers score, and what a strong signal looks like for each\u003C/li>\n      <li>Handle the “now add X” follow-up that decides most rounds\u003C/li>\n      <li>Write Java in the course's house style\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>The Java object model:\u003C/b> classes, interfaces, composition and immutability. See the Prerequisites, especially <a href=\"p4-interfaces-generics.html\">P4: Interfaces, Abstract Classes &amp; Generics\u003C/a> and <a href=\"p5-composition.html\">P5: Composition over Inheritance\u003C/a>.\u003C/li>\n        <li><b>Reading class and sequence diagrams.\u003C/b> See <a href=\"p8-reading-uml.html\">P8: Reading UML\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Three rounds, three different questions\u003C/h2>\n  <p>Most software engineering loops include up to three technical round types, and they test different skills. Mixing them up is a common way to fail an LLD round: candidates either start optimising an algorithm (the DSA reflex) or start drawing load balancers and databases (the HLD reflex).\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>DSA / coding\u003C/th><th>Low-level design (LLD)\u003C/th><th>System design (HLD)\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Question\u003C/td><td>“Return the k most frequent words.”\u003C/td><td>“Design a rate limiter library.”\u003C/td><td>“Design a rate limiter for 50 API gateways.”\u003C/td>\u003C/tr>\n        <tr><td>Unit of design\u003C/td><td>A function\u003C/td><td>Classes and interfaces inside one program\u003C/td><td>Services, stores, queues across machines\u003C/td>\u003C/tr>\n        <tr><td>What “good” means\u003C/td><td>Correct, optimal complexity\u003C/td><td>Clear responsibilities, extensible, testable, correct under concurrency\u003C/td><td>Scales, stays available, meets latency and cost targets\u003C/td>\u003C/tr>\n        <tr><td>Main artefact\u003C/td><td>Working code\u003C/td><td>Class diagram + core Java code\u003C/td><td>Architecture diagram + numbers\u003C/td>\u003C/tr>\n        <tr><td>Typical follow-up\u003C/td><td>“Can you do it in O(n)?”\u003C/td><td>“Now support a sliding window too.”\u003C/td><td>“What if a region goes down?”\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>The same problem can appear in both design rounds at different zoom levels. This course's case studies link to their System Design course counterparts wherever that happens: the LLD version designs the classes inside <i>one\u003C/i> of the services the HLD version draws.\u003C/p>\n\n  <h2>The 45-minute timeline\u003C/h2>\n  <p>Rounds run 35 to 60 minutes, and 45 is the most common. Strong candidates follow roughly the same shape every time. The shape matters because each phase feeds the next: code written before the entities are settled gets rewritten, and a design with no time left for the follow-up never shows that it is extensible.\u003C/p>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Requirements · ~5 min\u003C/b> Use cases, actors, scale of one process, what's out of scope. Write them down.\u003C/li>\n      <li><b>Entities · ~5 min\u003C/b> Nouns become candidate classes; decide which are entities and which are values.\u003C/li>\n      <li><b>Class design · ~10 min\u003C/b> Interfaces at the variation points, relationships, the class diagram.\u003C/li>\n      <li><b>APIs and flows · ~6 min\u003C/b> Public method signatures; walk the main use case as a sequence.\u003C/li>\n      <li><b>Code · ~14 min\u003C/b> The core classes in real Java. Not every class: the interesting ones.\u003C/li>\n      <li data-k=\"end\"><b>Extend · ~5 min\u003C/b> The follow-up: a new feature, concurrency, or a test. Small changes, in named places.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>The shape of a strong round.\u003C/b> The minutes are a guide, not a script; the order is what matters. The mock-interview room in this course uses exactly these phases.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Pacing simulator: where did your 45 minutes go?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"pcPreset\"><button class=\"active\" data-v=\"strong\">Strong\u003C/button><button data-v=\"coder\">Jumps to code\u003C/button><button data-v=\"drawer\">Diagram forever\u003C/button><button data-v=\"vague\">Never clarifies\u003C/button>\u003C/div>\n      \u003C/div>\n      <div class=\"pc-rows\" id=\"pcRows\">\u003C/div>\n      <div class=\"pc-bar\" id=\"pcBar\">\u003C/div>\n      <div class=\"pc-scale\"><span>0\u003C/span><span>15\u003C/span><span>30\u003C/span><span>45 min\u003C/span>\u003C/div>\n      <ul class=\"pc-flags\" id=\"pcFlags\">\u003C/ul>\n    \u003C/div>\n    <div class=\"panel-foot\">The presets are four patterns interviewers see every week. Drag the sliders to build your own plan, and see which parts of the rubric it puts at risk.\u003C/div>\n  \u003C/div>\n\n  <h2>What gets scored\u003C/h2>\n  <p>Companies word their rubrics differently, but they measure the same eight things. The mock-interview room in this course scores you on exactly these, from 0 to 3 each:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Dimension\u003C/th><th>Weak signal\u003C/th><th>Strong signal\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Requirements &amp; scope\u003C/td><td>Starts designing immediately; discovers requirements mid-code\u003C/td><td>Lists use cases and actors, asks the two questions that change the design, states what's out of scope\u003C/td>\u003C/tr>\n        <tr><td>Entities &amp; relationships\u003C/td><td>A class per noun, including ones that are just fields\u003C/td><td>Right-sized classes; clear ownership; values vs entities\u003C/td>\u003C/tr>\n        <tr><td>Abstractions\u003C/td><td>No interfaces, or an interface for everything\u003C/td><td>Interfaces exactly where things vary: pricing, allocation, notification\u003C/td>\u003C/tr>\n        <tr><td>Principles\u003C/td><td>God class; logic in callers; getters and setters everywhere\u003C/td><td>Small cohesive classes; behaviour next to data; SOLID applied where it pays\u003C/td>\u003C/tr>\n        <tr><td>Patterns\u003C/td><td>Pattern names recited, then forced in\u003C/td><td>A pattern used because it solves a stated problem, and named in one sentence\u003C/td>\u003C/tr>\n        <tr><td>Code quality\u003C/td><td>Pseudo-code, or code that wouldn't compile\u003C/td><td>Compiling-quality Java: names, validation, immutability, clear signatures\u003C/td>\u003C/tr>\n        <tr><td>Extensibility &amp; concurrency\u003C/td><td>Follow-up needs a rewrite; shared state unguarded\u003C/td><td>Follow-up is one new class or one changed method; knows what is shared and how it's protected\u003C/td>\u003C/tr>\n        <tr><td>Communication\u003C/td><td>Long silences; defends every choice; ignores hints\u003C/td><td>Thinks aloud, states trade-offs, takes a hint and adapts\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Notice what isn't on the list: remembering the “correct” parking-lot design. There isn't one. Two very different designs can both score well if their decisions are stated, justified and consistent.\u003C/p>\n\n  <h2>The follow-up is the real question\u003C/h2>\n  <p>Around minute 35 the interviewer adds something: “Now add a monthly pass.” “Two gates can issue tickets at the same time.” “How would you test the fee calculation?” This is where the round is usually decided, because it tests the one thing the first 35 minutes can only claim: that the design is easy to change.\u003C/p>\n  <figure class=\"seq\" data-actors=\"Interviewer|Candidate|Class diagram\">\n    <ol>\n      <li data-m=\"0>1\">“Now weekend rates should be different.”\u003C/li>\n      <li data-m=\"1>1\">Where does pricing vary? (think aloud)\u003C/li>\n      <li data-m=\"1>2\">point at PricingStrategy (interface)\u003C/li>\n      <li data-m=\"1>2\">add WeekendPricing implements PricingStrategy\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">“One new class; the factory picks it by date. Nothing else changes.”\u003C/li>\n      <li data-m=\"0>1\">“And if two gates price the same ticket at once?”\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">“Pricing is stateless; the ticket store is the shared part, so that's where the lock goes.”\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A good follow-up answer points at the diagram.\u003C/b> Name where the change goes, what stays the same, and what's shared. The diagram from minutes 10 to 20 is what makes this take one minute instead of ten.\u003C/figcaption>\n  \u003C/figure>\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Cutting scope out loud\u003C/div><p>A candidate asked to design a movie-booking system has 45 minutes and could spend all of them on payments, seat maps, loyalty points and refunds. The strong move in minute 3 is a sentence like: <i>“I'll cover browsing shows, holding seats and confirming a booking. Payment I'll treat as an interface we call, and I'll leave refunds and loyalty out unless you want them.”\u003C/i> The interviewer either agrees, or tells you what they actually wanted to see. Either way you've shown judgment, and you've protected the time you need for the seat-hold logic, the part that is actually hard (<a href=\"42-case-movie-ticketing.html\">Case Study 42\u003C/a>).\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <h2>The house style\u003C/h2>\n  <p>Every Java listing in this course follows the same rules, so the shape of the code becomes a memory aid instead of noise. They're also a good default for an interview, because each rule prevents a specific bug or a specific follow-up you can't answer.\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">The rules, in one listing\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"c\">// 1. Interface first: name the role before any class plays it. No \"I\" prefix, no \"Impl\" suffix.\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">SpotAllocator\u003C/span> {\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">Spot\u003C/span>&gt; <span class=\"f\">allocate\u003C/span>(<span class=\"t\">Vehicle\u003C/span> vehicle);           <span class=\"c\">// 4. Optional for \"might not exist\"\u003C/span>\n}\n\n<span class=\"c\">// 2. Final by default; composition over inheritance.\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">NearestSpotAllocator\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">SpotAllocator\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Level\u003C/span>&gt; levels;                       <span class=\"c\">// 3. Collaborators injected, fields final\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">NearestSpotAllocator\u003C/span>(<span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Level\u003C/span>&gt; levels) {\n\t\t<span class=\"k\">if\u003C/span> (levels.<span class=\"f\">isEmpty\u003C/span>()) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"at least one level\"\u003C/span>);   <span class=\"c\">// 5. Fail fast\u003C/span>\n\t\t<span class=\"k\">this\u003C/span>.levels = <span class=\"t\">List\u003C/span>.<span class=\"f\">copyOf\u003C/span>(levels);                  <span class=\"c\">//    and copy what you store\u003C/span>\n\t}\n\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">Spot\u003C/span>&gt; <span class=\"f\">allocate\u003C/span>(<span class=\"t\">Vehicle\u003C/span> vehicle) {\n\t\t<span class=\"k\">for\u003C/span> (<span class=\"t\">Level\u003C/span> level : levels) {\n\t\t\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">Spot\u003C/span>&gt; spot = level.<span class=\"f\">claimFreeSpot\u003C/span>(vehicle.<span class=\"f\">size\u003C/span>());   <span class=\"c\">// tell, don't ask\u003C/span>\n\t\t\t<span class=\"k\">if\u003C/span> (spot.<span class=\"f\">isPresent\u003C/span>()) <span class=\"k\">return\u003C/span> spot;\n\t\t}\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Optional\u003C/span>.<span class=\"f\">empty\u003C/span>();\n\t}\n}\n\n<span class=\"k\">public record\u003C/span> <span class=\"t\">Vehicle\u003C/span>(<span class=\"t\">String\u003C/span> plate, <span class=\"t\">VehicleSize\u003C/span> size) {}     <span class=\"c\">// 6. Records for values; enums for fixed sets\u003C/span>\u003C/pre>\n    <div class=\"cb-foot\"><b>Also:\u003C/b> modern Java (records, sealed interfaces, switch expressions, pattern-matching <code>instanceof\u003C/code>); unchecked exceptions grouped by what the caller does (<a href=\"p7-exceptions.html\">P7\u003C/a>); no framework annotations or Lombok, so the design is visible in the code; tabs, braces on the same line. And every design names its pattern and the change it survives.\u003C/div>\n  \u003C/div>\n  <p>In an interview you won't write every class this carefully, and you shouldn't try. Write the two or three classes that carry the design properly, and stub the rest with one-line comments like <code>// Level: holds spots per size; claimFreeSpot is synchronized\u003C/code>. Saying what you are skipping is part of the signal.\u003C/p>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Coding in minute two.\u003C/b> The requirements you skipped arrive later as rewrites.\u003C/li>\n      <li><b>Drawing an architecture.\u003C/b> Load balancers and databases are the HLD round. Here, the database is an interface (<code>BookingRepository\u003C/code>).\u003C/li>\n      <li><b>A class for every noun.\u003C/b> “Colour” and “Name” are fields, not classes. Classes earn their place with behaviour or rules.\u003C/li>\n      <li><b>Pattern bingo.\u003C/b> Naming six patterns without a problem for each reads as memorisation. One well-justified Strategy beats that.\u003C/li>\n      <li><b>Pseudo-code.\u003C/b> Most rubrics ask for code that would compile. Keep it real Java, even if some methods are stubbed.\u003C/li>\n      <li><b>Arguing the follow-up.\u003C/b> “That wasn't in the requirements” loses the round. Show where the change goes.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What do you do in the first five minutes of an LLD round?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I restate the problem, then ask the questions that change the design: who the actors are, what the core use cases are, whether it's single-threaded or shared by many threads, and whether it needs to persist. I write the use cases down as a short list and say out loud what I'm leaving out of scope. Then I check with the interviewer before moving on to entities, so we agree on what I'm designing.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> At minute 38 the interviewer says, “Now make it thread-safe.” You have seven minutes. What do you do?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I don't add <code>synchronized\u003C/code> everywhere. First I name the shared mutable state, which is usually one or two objects, like the spot inventory or the booking store. Everything immutable or confined to one request is already safe, and I say so. Then I guard the shared state at the smallest scope that keeps the invariant: one synchronized method, or a concurrent map with an atomic <code>compute\u003C/code>, making sure check-then-act happens inside one operation. Then I point out what I'd test, such as two threads booking the last seat.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>LLD designs classes inside one program; DSA optimises a function; HLD arranges services across machines.\u003C/li>\n      <li>The round's shape: requirements, entities, class design, APIs and flows, code, extension. The order matters more than the minutes.\u003C/li>\n      <li>Eight scored dimensions: scope, entities, abstractions, principles, patterns, code quality, extensibility and concurrency, communication.\u003C/li>\n      <li>The follow-up decides most rounds: answer by pointing at where the change goes and what stays the same.\u003C/li>\n      <li>Cut scope out loud early; it shows judgment and protects time for the hard part.\u003C/li>\n      <li>House style: interface first, final classes, injected final fields, fail fast, records and enums for values, Optional for absence.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">“Design a rate limiter” comes up in an LLD round. Which answer fits the round?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Redis cluster, a gateway fleet and a replication strategy across regions\u003C/button>\n        <button class=\"opt\">The fastest possible sliding-window algorithm, analysed for time complexity\u003C/button>\n        <button class=\"opt\">A <code>RateLimiter\u003C/code> interface, algorithms as swappable strategies, per-client state, and thread-safe Java for the core\u003C/button>\n        <button class=\"opt\">A list of every rate-limiting algorithm and its history\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">LLD is about classes and code inside one program: interfaces at the variation points and correct, extensible Java. The first answer is the HLD version of the question, and the second the DSA version.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Why spend the first few minutes on requirements instead of starting on classes?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The use cases and constraints decide which classes and interfaces you need; skipping them means redesigning mid-code\u003C/button>\n        <button class=\"opt\">Interviewers reward long discussions more than code\u003C/button>\n        <button class=\"opt\">To avoid having to write code at all\u003C/button>\n        <button class=\"opt\">Because the rubric requires exactly five minutes on requirements\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Questions like “concurrent or not?” and “which features are in scope?” change the design. Settling them first, and writing them down, is cheaper than discovering them at minute 30.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">The interviewer asks for weekend pricing at minute 35. Which answer shows the strongest design?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">“That wasn't in the requirements.”\u003C/button>\n        <button class=\"opt\">Add <code>if (isWeekend)\u003C/code> branches inside the fee calculation method\u003C/button>\n        <button class=\"opt\">Rewrite the Ticket class to store the day of the week\u003C/button>\n        <button class=\"opt\">“Pricing is behind the PricingStrategy interface, so it's one new implementation, picked by date in the factory. Nothing else changes.”\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A good follow-up answer names the variation point from the diagram, adds one class, and says what stays untouched. That's the evidence of extensibility the round is looking for.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Which of these is <b>not\u003C/b> something an LLD rubric typically scores?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Whether interfaces sit at the real variation points\u003C/button>\n        <button class=\"opt\">Whether your design matches the one “correct” answer for the problem\u003C/button>\n        <button class=\"opt\">Whether the code is compiling-quality Java\u003C/button>\n        <button class=\"opt\">Whether you handle concurrency on shared state\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">There is no single correct design. Rubrics score the quality and justification of your decisions: scope, abstractions, principles, code, extensibility, concurrency and communication.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">You have 14 minutes to code a parking-lot design with eight classes. What's the best plan?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Write all eight classes quickly in pseudo-code\u003C/button>\n        <button class=\"opt\">Write getters and setters for every class first\u003C/button>\n        <button class=\"opt\">Write the two or three classes that carry the design in real Java, and stub the rest with one-line comments saying what they do\u003C/button>\n        <button class=\"opt\">Skip code and keep refining the diagram\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Depth on the interesting parts, such as allocation and fee calculation, shows more than breadth on trivial classes. Saying what you're skipping keeps the design complete without spending the minutes.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const PH = [\n    ['Requirements', 'var(--accent)'],\n    ['Entities', 'color-mix(in srgb, var(--accent-2) 30%, var(--accent))'],\n    ['Class design', 'color-mix(in srgb, var(--accent-2) 60%, var(--accent))'],\n    ['APIs & flows', 'var(--accent-2)'],\n    ['Code', 'var(--green)'],\n    ['Extend', 'var(--amber)'],\n  ];\n  const PRESETS = {\n    strong: [5, 5, 10, 6, 14, 5],\n    coder:  [1, 1, 3, 2, 38, 0],\n    drawer: [5, 8, 22, 8, 2, 0],\n    vague:  [0, 4, 12, 6, 18, 5],\n  };\n  let v = PRESETS.strong.slice();\n\n  function flags() {\n    const [rq, en, cd, ap, co, ex] = v, total = v.reduce((a, b) => a + b, 0), out = [];\n    if (total > 45) out.push(['bad', `You planned ${total} minutes for a 45-minute round. The last ${total - 45} are the follow-up, and they won't happen.`])
