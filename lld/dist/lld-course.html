span class=\"t\">LoginService\u003C/span> {\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">LoginService\u003C/span>(<span class=\"t\">UserLookup\u003C/span> users, <span class=\"t\">PasswordHasher\u003C/span> hasher) { … }    <span class=\"c\">// says exactly what it uses\u003C/span>\n}\u003C/pre>\n  <p>Nothing changed in the database code; there's still one repository class. What changed is what each client can see. The login test fake is now a two-method lambda-sized class, and the constructor documents that login only ever reads users.\u003C/p>\n\n  <h2>Dependency inversion: who owns the interface\u003C/h2>\n  <p>The last principle has two parts. <b>High-level modules\u003C/b> (business rules like billing) should not depend on <b>low-level modules\u003C/b> (details like the Stripe SDK); both should depend on an abstraction. And the part people miss: <b>the abstraction belongs to the high-level side\u003C/b>. The billing package defines <code>PaymentGateway\u003C/code> in its own terms, and the Stripe adapter, in an infrastructure package, implements it. The source-code dependency now points <i>from\u003C/i> the detail <i>to\u003C/i> the policy: it's been inverted.\u003C/p>\n  <svg class=\"diagram dip\" viewBox=\"0 0 900 215\" role=\"img\" aria-label=\"Before: billing depends on the Stripe SDK. After: billing owns PaymentGateway, and the Stripe adapter depends on billing.\">\n    <defs><marker id=\"dipA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--text-2)\"/>\u003C/marker>\n      <marker id=\"dipB\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--red)\"/>\u003C/marker>\u003C/defs>\n    <text x=\"20\" y=\"22\" class=\"pk\">BEFORE\u003C/text>\n    <rect class=\"pkg\" x=\"20\" y=\"34\" width=\"180\" height=\"90\" rx=\"10\"/><text x=\"30\" y=\"52\" class=\"pk\">billing\u003C/text>\n    <rect class=\"bx\" x=\"40\" y=\"64\" width=\"140\" height=\"40\" rx=\"8\"/><text x=\"110\" y=\"89\" text-anchor=\"middle\">BillingService\u003C/text>\n    <rect class=\"pkg\" x=\"260\" y=\"34\" width=\"180\" height=\"90\" rx=\"10\"/><text x=\"270\" y=\"52\" class=\"pk\">stripe-sdk\u003C/text>\n    <rect class=\"bx\" x=\"280\" y=\"64\" width=\"140\" height=\"40\" rx=\"8\"/><text x=\"350\" y=\"89\" text-anchor=\"middle\">StripeClient\u003C/text>\n    <path class=\"ar bad\" d=\"M180,84 L276,84\" marker-end=\"url(#dipB)\"/>\n    <text x=\"490\" y=\"22\" class=\"pk\">AFTER\u003C/text>\n    <rect class=\"pkg\" x=\"490\" y=\"34\" width=\"190\" height=\"170\" rx=\"10\"/><text x=\"500\" y=\"52\" class=\"pk\">billing\u003C/text>\n    <rect class=\"bx\" x=\"510\" y=\"64\" width=\"150\" height=\"40\" rx=\"8\"/><text x=\"585\" y=\"89\" text-anchor=\"middle\">BillingService\u003C/text>\n    <rect class=\"bx i\" x=\"510\" y=\"146\" width=\"150\" height=\"40\" rx=\"8\"/><text x=\"585\" y=\"163\" text-anchor=\"middle\" font-size=\"10\">«interface»\u003C/text><text x=\"585\" y=\"178\" text-anchor=\"middle\">PaymentGateway\u003C/text>\n    <path class=\"ar\" d=\"M585,104 L585,142\" marker-end=\"url(#dipA)\"/>\n    <rect class=\"pkg\" x=\"720\" y=\"130\" width=\"170\" height=\"74\" rx=\"10\"/><text x=\"730\" y=\"148\" class=\"pk\">infra.stripe\u003C/text>\n    <rect class=\"bx\" x=\"735\" y=\"156\" width=\"140\" height=\"36\" rx=\"8\"/><text x=\"805\" y=\"179\" text-anchor=\"middle\">StripeGateway\u003C/text>\n    <path class=\"ar dash\" d=\"M735,172 L664,168\" marker-end=\"url(#dipA)\"/>\n  \u003C/svg>\n  <p class=\"small muted\" style=\"margin-top:6px\"><b>Before:\u003C/b> business rules import the SDK, so changing provider, or testing without the network, means editing billing. <b>After:\u003C/b> billing owns <code>PaymentGateway\u003C/code>, and the dashed arrow from <code>StripeGateway\u003C/code> into billing is the inversion: infrastructure depends on business rules.\u003C/p>\n<pre class=\"code\"><span class=\"c\">// package com.shop.billing: the interface speaks billing's language, not Stripe's\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">PaymentGateway\u003C/span> {\n\t<span class=\"t\">ChargeResult\u003C/span> <span class=\"f\">charge\u003C/span>(<span class=\"t\">Money\u003C/span> amount, <span class=\"t\">PaymentToken\u003C/span> token, <span class=\"t\">IdempotencyKey\u003C/span> key);\n}\n\n<span class=\"c\">// package com.shop.infra.stripe: depends on billing, translates to and from the SDK\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">StripeGateway\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">PaymentGateway\u003C/span> { … }\u003C/pre>\n  <p>Notice the method signature: <code>Money\u003C/code>, <code>PaymentToken\u003C/code>, <code>ChargeResult\u003C/code>, all billing types. If the interface had been <code>charge(StripeChargeRequest req)\u003C/code>, billing would still depend on Stripe, just with an interface in between. An abstraction shaped by the detail is not an inversion. This is also how you choose which way dependencies should point in general: towards the code that changes <i>least\u003C/i> often and matters <i>most\u003C/i>. Tax rules and booking rules outlive any payment provider or database driver.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Switching payment providers in a week, not a quarter\u003C/div><p>A company processing card payments through one provider wants a second one for cheaper fees in Europe. If <code>BillingService\u003C/code> calls the first provider's SDK directly, its request and response types are threaded through refunds, receipts, retries and tests, and the switch is a multi-month rewrite. If billing owns <code>PaymentGateway\u003C/code> in its own terms, the work is one new adapter class, its contract tests, and a routing rule choosing a gateway by region (<a href=\"15-strategy.html\">Strategy\u003C/a>). This is the most common real-world payoff of dependency inversion, and it comes up in interviews as “how would you add a second payment provider?” (<a href=\"12-adapter-facade-bridge.html\">Chapter 12\u003C/a>).\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Checking substitutability by compiling.\u003C/b> Signatures match; behaviour may not. Run the same contract tests against every implementation.\u003C/li>\n      <li><b>Implementing an interface with <code>throw new UnsupportedOperationException()\u003C/code>.\u003C/b> Split the interface instead.\u003C/li>\n      <li><b>Subtypes that quietly reject valid input,\u003C/b> or weaken what the type promises (“it's a cache, so saves may be lost”).\u003C/li>\n      <li><b>One repository interface for every client.\u003C/b> Give each client a role interface; one class can implement them all.\u003C/li>\n      <li><b>Interfaces shaped like the vendor SDK,\u003C/b> placed in the vendor adapter's package. The abstraction must belong to, and speak the language of, the business code.\u003C/li>\n      <li><b>Interfaces for classes with one implementation and no test need,\u003C/b> “because DIP”. Invert where a detail sits behind the boundary, like I/O, vendors or time.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What does Liskov substitution mean beyond “subclasses must compile”?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Code written against a type must keep working with any subtype, so a subtype must keep the type's behavioural contract. It can't accept less input than the type (no stronger preconditions), can't promise less afterwards (no weaker postconditions), must keep the invariants, and can't throw new kinds of exceptions. A read-only store whose <code>put\u003C/code> throws, or a store that silently drops what you just saved, compiles but breaks callers. I check it with contract tests that run against every implementation.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Your checkout service calls the Stripe SDK directly. How would you restructure it so adding Adyen is easy and checkout is unit-testable?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Apply dependency inversion. The billing package defines a <code>PaymentGateway\u003C/code> interface in billing's own types, like <code>charge(Money, PaymentToken, IdempotencyKey)\u003C/code> returning a <code>ChargeResult\u003C/code>. Checkout depends only on that. A <code>StripeGateway\u003C/code> in an infrastructure package implements it and translates to and from the SDK, including error mapping. Adyen is then a second adapter plus a routing rule, both run against the same contract tests, and checkout's unit tests use a fake gateway with no network.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Liskov: a subtype must keep its type's behavioural contract: no stronger preconditions, no weaker postconditions, same invariants, no new failures.\u003C/li>\n      <li>Compiling proves nothing about substitutability; contract tests run against every implementation do.\u003C/li>\n      <li>An implementation that throws “unsupported” means the interface is too big for it: split it.\u003C/li>\n      <li>Interface segregation: give each client a role interface with only what it uses; one class can implement several.\u003C/li>\n      <li>Dependency inversion: business rules own the interfaces, in their own terms; infrastructure implements them.\u003C/li>\n      <li>Point dependencies towards what changes least and matters most.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>BlobStore.put\u003C/code> is documented to accept blobs up to 5 GB. One implementation throws for anything over 1 MB. Which Liskov rule does it break?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It weakens a postcondition\u003C/button>\n        <button class=\"opt\">It breaks an invariant\u003C/button>\n        <button class=\"opt\">It strengthens a precondition: it rejects input the type promised to accept\u003C/button>\n        <button class=\"opt\">None: implementations may choose their own limits\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A caller that correctly relies on the 5 GB contract fails with this implementation. Accepting less than the type accepts is a stronger precondition, which subtypes may not have.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">An <code>ArchiveStore\u003C/code> can only read, so it implements <code>BlobStore.put\u003C/code> by throwing <code>UnsupportedOperationException\u003C/code>. What's the better design?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Split out a read-only interface (<code>BlobReader\u003C/code>) that ArchiveStore implements, and have clients that only read depend on that\u003C/button>\n        <button class=\"opt\">Make <code>put\u003C/code> silently do nothing\u003C/button>\n        <button class=\"opt\">Catch the exception in every caller\u003C/button>\n        <button class=\"opt\">Add <code>isWritable()\u003C/code> and make every caller check it\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Doing nothing silently breaks the postcondition, and checks in every caller spread the problem. The honest fix is an interface the archive can fully honour, which is interface segregation serving Liskov.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\"><code>LoginService\u003C/code> takes a 13-method <code>UserRepository\u003C/code> but only calls <code>findByEmail\u003C/code>. What does interface segregation suggest?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Delete the other twelve methods\u003C/button>\n        <button class=\"opt\">Make LoginService extend the repository\u003C/button>\n        <button class=\"opt\">Pass the database connection directly\u003C/button>\n        <button class=\"opt\">A small <code>UserLookup\u003C/code> role interface for LoginService, implemented by the same repository class alongside other role interfaces\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Other clients still need the other methods, so they stay, grouped into role interfaces. LoginService depends only on what it uses, and its test fake shrinks to a couple of methods.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Under dependency inversion, where should the <code>PaymentGateway\u003C/code> interface live?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">In the Stripe adapter package, next to its implementation\u003C/button>\n        <button class=\"opt\">In the billing package, expressed in billing's own types, with adapters depending on it\u003C/button>\n        <button class=\"opt\">In a shared utils package\u003C/button>\n        <button class=\"opt\">Inside the Stripe SDK\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The high-level module owns the abstraction, so the source dependency points from infrastructure to billing. An interface in the adapter's package, or shaped like the SDK, leaves billing depending on the detail.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">What is a contract test?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A legal agreement with a vendor\u003C/button>\n        <button class=\"opt\">A test that only checks method signatures compile\u003C/button>\n        <button class=\"opt\">One set of tests describing an interface's promises, run against every implementation\u003C/button>\n        <button class=\"opt\">A load test\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">An abstract test class with a factory method per implementation. Each implementation must pass the same behavioural tests, which is a practical check that it can be substituted for the interface.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$, sleep } = LLD;\n  const TESTS = [\n    ['roundTrip', 'put then get returns the same bytes'],\n    ['large', 'put accepts a 200 MB blob'],\n    ['missing', 'get of a missing key returns empty'],\n    ['overwrite', 'a second put overwrites the first'],\n  ];\n  // implementation: { desc, fail: { test: reason } }\n  const IMPL = {\n    LocalDiskStore:   { desc: 'Writes each blob to a file under a root directory.', fail: {} },\n    S3BlobStore:      { desc: 'Stores blobs in an S3 bucket via the AWS SDK.', fail: {} },\n    SmallBlobStore:   { desc: 'Keeps blobs in a database column limited to 1 MB.', fail: { large: 'Throws IllegalArgumentException(\"blob too large\") for 200 MB. The interface allows 5 GB: a strengthened precondition. Callers uploading videos break only when given this store.' } },\n    ArchiveStore:     { desc: 'Read-only access to last year\\'s archive.', fail: { roundTrip: 'put throws UnsupportedOperationException: a new kind of failure the contract never mentioned.', large: 'put throws UnsupportedOperationException.', overwrite: 'put throws UnsupportedOperationException.' } },\n    LruMemoryStore:   { desc: 'An in-memory cache that evicts the oldest blob when over 64 MB.', fail: { roundTrip: 'Passes for small blobs, but get can return empty straight after put once memory fills: a weakened postcondition.', large: 'A 200 MB blob is evicted immediately on insert, so the following get returns empty.' } },\n  };\n  let ran = false, sel = null;\n\n  function draw() {\n    const head = '<tr><th>Implementation\u003C/th>' + TESTS.map(([, t]) => `<th>${t}\u003C/th>`).join('') + '\u003C/tr>';\n    const rows = Object.entries(IMPL).map(([name, im]) => `<tr><td class=\"impl${sel === name ? ' sel' : ''}\" data-i=\"${name}\">${name}\u003C/td>` +\n      TESTS.map(([k]) => !ran ? '<td class=\"pending\">·\u003C/td>' : im.fail[k] ? `<td class=\"fail\" data-i=\"${name}\" data-t=\"${k}\">✗\u003C/td>` : '<td class=\"pass\">✓\u003C/td>').join('') + '\u003C/tr>').join('');\n    $('#ctTable').innerHTML = head + rows;\n    $$('#ctTable [data-i]').forEach((c) => c.onclick = () => { sel = c.dataset.i; detail(c.dataset.t); draw(); });\n  }\n  function detail(t) {\n    const im = IMPL[sel], fails = Object.keys(im.fail).length;\n    if (t && im.fail[t]) { $('#ctDetail').innerHTML = `<b>${sel}\u003C/b> · ${TESTS.find((x) => x[0] === t)[1]}: ${im.fail[t]}`; return; }\n    $('#ctDetail').innerHTML = `<b>${sel}\u003C/b>: ${im.desc} ` + (!ran ? 'Run the tests to check it.' : fails ? `<b>Fails ${fails} of ${TESTS.length}\u003C/b>, so it is not a substitutable BlobStore. Click a red cell for the reason.` : '<b>Passes every contract test\u003C/b>: any caller written against BlobStore can use it.');\n  }\n  $('#ctRun').onclick = async () => {\n    if (ran) return;\n    ran = true; draw();\n    const bad = Object.entries(IMPL).filter(([, im]) => Object.keys(im.fail).length).map(([n]) => n);\n    $('#ctDetail').innerHTML = `<b>${Object.keys(IMPL).length - bad.length} of ${Object.keys(IMPL).length}\u003C/b> implementations are substitutable. ${bad.join(', ')} compile against BlobStore but break its contract. Click one to see how.`;\n  };\n  $('#ctReset').onclick = () => { ran = false; sel = null; $('#ctDetail').innerHTML = 'Every implementation compiles against <code>BlobStore\u003C/code>. Run the tests to see which ones keep its promises.'; draw(); };\n  draw();\n})();\n"]},"05-coupling-cohesion.html":{"title":"Coupling, Cohesion &amp; the Law of Demeter","chapter":"5","styles":"\n  .dg text { font-family:var(--mono); font-size:11.5px; fill:var(--text); pointer-events:none; }\n  .dg .n rect { fill:var(--surface); stroke:var(--border-strong); stroke-width:1.4; cursor:pointer; transition:all .2s; }\n  .dg .n.iface rect { stroke:var(--accent); stroke-dasharray:4 3; }\n  .dg .n.sel rect { stroke:var(--accent); stroke-width:2.4; fill:var(--accent-soft); }\n  .dg .n.dep rect { stroke:var(--red); stroke-width:2; fill:var(--red-soft); }\n  .dg .n.gone { opacity:.25; }\n  .dg .e { stroke:var(--text-2); stroke-width:1.3; fill:none; opacity:.6; }\n  .dg .e.hot { stroke:var(--red); opacity:1; stroke-width:2; }\n  .dg .e.new { stroke:var(--green); opacity:1; }\n  .rf { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }\n  .rf label { display:flex; gap:8px; align-items:center; padding:7px 11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); font-size:13.5px; cursor:pointer; }\n  .rf label.on { border-color:var(--green); background:var(--green-soft); }\n  .rf input { accent-color:var(--green); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 5\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Coupling, Cohesion &amp; the Law of <span class=\"grad\">Demeter\u003C/span>\u003C/h1>\n    <p class=\"lead\">Every design review eventually asks two questions. If I change this class, how many others break? And does everything inside this class belong together? The first is <b>coupling\u003C/b>, the second is <b>cohesion\u003C/b>, and nearly every principle in this course is a way to lower the first and raise the second. This chapter makes both measurable, and covers the slogans that come with them, DRY, KISS and YAGNI, including when to ignore them.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Name the kinds of coupling, from harmless to dangerous, and spot each in code\u003C/li>\n      <li>Judge a class's cohesion from how its methods use its fields\u003C/li>\n      <li>Apply the Law of Demeter to replace train-wreck call chains\u003C/li>\n      <li>Use fan-in and fan-out to see which classes are expensive to change\u003C/li>\n      <li>Tell real duplication of knowledge from code that only looks the same\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Tell, don't ask:\u003C/b> put decisions inside the object that owns the data. See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b>Single responsibility and dependency inversion.\u003C/b> See <a href=\"03-solid-srp-ocp.html\">Chapter 3\u003C/a> and <a href=\"04-solid-lsp-isp-dip.html\">Chapter 4\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Coupling: how much a class must know\u003C/h2>\n  <p><b>Coupling\u003C/b> is how much one class depends on the details of another. Some coupling is unavoidable; a checkout that knows nothing about carts can't check anything out. What matters is <b>how much\u003C/b> it knows and <b>what kind\u003C/b> of thing it knows. Each dependency is a path along which a change can travel. The kinds below run from loosest to tightest:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Kind\u003C/th><th>What it looks like\u003C/th><th>Why it hurts\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Data\u003C/td><td><code>fee(Duration parked)\u003C/code>: passes just the values needed\u003C/td><td>It barely does. This is the goal.\u003C/td>\u003C/tr>\n        <tr><td>Stamp\u003C/td><td><code>fee(Ticket ticket)\u003C/code>, then reads only <code>ticket.entryTime()\u003C/code>\u003C/td><td>Depends on a whole type to use one field; harder to test and reuse\u003C/td>\u003C/tr>\n        <tr><td>Control\u003C/td><td><code>export(report, true, false)\u003C/code>: flags choose the behaviour\u003C/td><td>The caller must know the callee's internal branches; unreadable at call sites\u003C/td>\u003C/tr>\n        <tr><td>Temporal\u003C/td><td>“Call <code>init()\u003C/code> before <code>query()\u003C/code>, and <code>close()\u003C/code> after”\u003C/td><td>Correctness depends on call order that the types don't enforce\u003C/td>\u003C/tr>\n        <tr><td>Global\u003C/td><td>Classes communicating through a mutable static field\u003C/td><td>Hidden, shared by every caller and every test (<a href=\"p1-classes-objects.html\">P1\u003C/a>)\u003C/td>\u003C/tr>\n        <tr><td>Content\u003C/td><td>Reaching through other objects' internals: <code>a.getB().getC().setD(x)\u003C/code>\u003C/td><td>Any internal change in B or C breaks A\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Each has a standard fix. Stamp coupling: pass the value, not the object. Control coupling: split the method in two (<code>exportCsv\u003C/code>, <code>exportPdf\u003C/code>) or pass a strategy. Temporal coupling: do the setup in the constructor or a factory, so an object can't exist half-initialised. Global coupling: pass the shared object in. Content coupling: the Law of Demeter, below.\u003C/p>\n\n  <h2>Cohesion: what belongs together\u003C/h2>\n  <p><b>Cohesion\u003C/b> is how closely the parts of one class belong together. A quick test: look at which fields each method uses. In a highly cohesive class, most methods use most fields; they're all working on the same thing. When the methods split into groups that use separate groups of fields, you have two or three classes sharing a name.\u003C/p>\n  <div class=\"split\">\n    <div class=\"card\"><h4 class=\"mt0\">Low cohesion\u003C/h4>\n<pre class=\"code\"><span class=\"k\">class\u003C/span> <span class=\"t\">UserManager\u003C/span> {\n\t<span class=\"t\">PasswordHasher\u003C/span> hasher;  <span class=\"t\">SessionStore\u003C/span> sessions;   <span class=\"c\">// used by login()\u003C/span>\n\t<span class=\"t\">SmtpClient\u003C/span> smtp;        <span class=\"t\">TemplateEngine\u003C/span> templates;<span class=\"c\">// used by sendWelcome()\u003C/span>\n\t<span class=\"t\">ImageResizer\u003C/span> resizer;   <span class=\"t\">BlobStore\u003C/span> avatars;      <span class=\"c\">// used by uploadAvatar()\u003C/span>\n}\u003C/pre>\n      <p class=\"small mb0\">Three pairs of fields, three unrelated jobs: login, email, avatars.\u003C/p>\u003C/div>\n    <div class=\"card\"><h4 class=\"mt0\">High cohesion\u003C/h4>\n<pre class=\"code\"><span class=\"k\">final class\u003C/span> <span class=\"t\">TokenBucket\u003C/span> {\n\t<span class=\"k\">int\u003C/span> capacity; <span class=\"k\">int\u003C/span> refillPerSecond;\n\t<span class=\"k\">int\u003C/span> tokens;   <span class=\"k\">long\u003C/span> lastRefillMillis;\n\t<span class=\"c\">// tryAcquire() and refill() use all four\u003C/span>\n}\u003C/pre>\n      <p class=\"small mb0\">Every method works with every field, towards one invariant.\u003C/p>\u003C/div>\n  \u003C/div>\n  <p>High cohesion and low coupling go together. When everything about one concern lives in one class, the other classes only need that class's small public surface, so they're coupled to less.\u003C/p>\n\n  <h2>The Law of Demeter: don't talk to strangers\u003C/h2>\n  <p>The Law of Demeter, from a 1987 research project of that name, says a method should only call methods on: <b>itself\u003C/b>, its <b>parameters\u003C/b>, objects it <b>creates\u003C/b>, and its own <b>fields\u003C/b>. Not on objects <i>returned by\u003C/i> those. Break it and you get a <b>train wreck\u003C/b>, a line that navigates the whole object graph:\u003C/p>\n<pre class=\"code\"><span class=\"c\">// CheckoutService, computing tax: knows the shape of four other classes\u003C/span>\n<span class=\"t\">BigDecimal\u003C/span> rate = order.<span class=\"f\">getCustomer\u003C/span>().<span class=\"f\">getAddress\u003C/span>().<span class=\"f\">getCountry\u003C/span>().<span class=\"f\">getTaxRate\u003C/span>();\n\n<span class=\"c\">// After: ask the object you have for what you actually need\u003C/span>\n<span class=\"t\">BigDecimal\u003C/span> rate = order.<span class=\"f\">taxRate\u003C/span>();\n<span class=\"c\">//   Order.taxRate()      → customer.taxRate()\u003C/span>\n<span class=\"c\">//   Customer.taxRate()   → billingAddress.taxRate()\u003C/span>\n<span class=\"c\">//   Address.taxRate()    → country.taxRate()\u003C/span>\u003C/pre>\n  <p>Before, <code>CheckoutService\u003C/code> depended on <code>Customer\u003C/code>, <code>Address\u003C/code> and <code>Country\u003C/code>, and would break if a customer gained several addresses. After, each class talks only to its neighbour, and the knowledge that “tax depends on the billing country” lives along the path where it belongs. The fix is tell-don't-ask again, applied across several objects.\u003C/p>\n  <p>Two things are <b>not\u003C/b> violations, even though they have dots in a row. <b>Fluent builders and streams\u003C/b> (<code>list.stream().filter(…).map(…).toList()\u003C/code>) keep calling methods on objects designed to be chained, not reaching into someone's internals. And <b>value objects and data records\u003C/b> are meant to be read: <code>request.headers().get(\"Host\")\u003C/code> is fine. The law is about not navigating the internals of objects that have behaviour.\u003C/p>\n\n  <h2>Seeing coupling: fan-in and fan-out\u003C/h2>\n  <p>Two numbers per class make coupling visible. <b>Fan-out\u003C/b> (efferent coupling) counts the classes it depends on: high fan-out means it breaks when many things change. <b>Fan-in\u003C/b> (afferent coupling) counts the classes that depend on it directly: high fan-in means changing its API breaks many callers, so it should be stable, ideally an interface. The graph below is a checkout module. Click a class to see who calls it directly, then apply the refactorings.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Checkout dependency graph: who breaks when this changes?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"rf\" id=\"dgRf\">\u003C/div>\n      <div class=\"svg-scroll\"><svg class=\"diagram dg\" id=\"dgSvg\" viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Dependency graph of a checkout module\">\u003C/svg>\u003C/div>\n      <div class=\"stats\" id=\"dgStats\">\u003C/div>\n      <p class=\"small\" id=\"dgNote\" style=\"margin:10px 0 0\">\u003C/p>\n    \u003C/div>\n    <div class=\"panel-foot\">Arrows point from a class to what it depends on. Red boxes are the direct callers of the selected class: the code that must change if its API changes. Green arrows are dependencies a refactoring added.\u003C/div>\n  \u003C/div>\n\n  <h2>DRY, and the wrong abstraction\u003C/h2>\n  <p><b>DRY\u003C/b> (“don't repeat yourself”) is usually quoted as “don't duplicate code”. Its authors, in <i>The Pragmatic Programmer\u003C/i>, meant something narrower: <b>every piece of knowledge should have one authoritative representation\u003C/b>. The tax rule should exist once. That's different from “no two blocks of code may look alike”.\u003C/p>\n<pre class=\"code\"><span class=\"k\">static final\u003C/span> <span class=\"t\">Pattern\u003C/span> USERNAME    = <span class=\"t\">Pattern\u003C/span>.<span class=\"f\">compile\u003C/span>(<span class=\"s\">\"[a-z0-9_]{3,20}\"\u003C/span>);\n<span class=\"k\">static final\u003C/span> <span class=\"t\">Pattern\u003C/span> COUPON_CODE = <span class=\"t\">Pattern\u003C/span>.<span class=\"f\">compile\u003C/span>(<span class=\"s\">\"[a-z0-9_]{3,20}\"\u003C/span>);   <span class=\"c\">// identical today…\u003C/span>\u003C/pre>\n  <p>Merging those two into one <code>SHORT_ID\u003C/code> pattern looks like good hygiene. But they encode two different pieces of knowledge, owned by two different teams. When marketing wants 24-character coupons, the merged pattern either changes usernames too, or sprouts a flag, which is control coupling. Sandi Metz's summary is the rule to remember: <b>duplication is far cheaper than the wrong abstraction\u003C/b>. Merge code when it represents the same knowledge and changes for the same reason, not because it happens to look the same today.\u003C/p>\n\n  <h2>KISS and YAGNI in an interview\u003C/h2>\n  <p><b>KISS\u003C/b> (keep it simple) and <b>YAGNI\u003C/b> (“you aren't gonna need it”) push the other way from open/closed: don't build extension points, configuration or generality nobody has asked for. In an LLD round the balance is explicit. Build extension points where the prompt or the interviewer says things will vary (“pricing changes by season”), keep everything else concrete, and say so: <i>“Vehicle sizes are a fixed enum; I won't add an interface there unless you expect new sizes.”\u003C/i> That one sentence shows you know the principle, its cost, and how to choose.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Temporal coupling in the JDK: SSLContext\u003C/div><p>To set up TLS by hand in Java you call <code>SSLContext.getInstance(\"TLS\")\u003C/code>, and then you must call <code>init(keyManagers, trustManagers, random)\u003C/code> before using it. Forget the second call and you get an <code>IllegalStateException\u003C/code> saying the context isn't initialised, at run time, possibly far from the setup code. The type system can't help, because the object exists in a half-ready state. Designs you control can avoid this: do all setup in a constructor or a static factory that returns a ready-to-use object (<a href=\"11-builder-prototype.html\">Chapter 11\u003C/a>'s Builder does this for objects with many options).\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Boolean flag parameters.\u003C/b> <code>send(msg, true, false)\u003C/code> is unreadable and couples callers to internal branches. Split the method or pass a small strategy.\u003C/li>\n      <li><b>Train wrecks through behavioural objects.\u003C/b> Ask the first object for what you need; let it delegate.\u003C/li>\n      <li><b>Fixing Demeter with getter forwarding.\u003C/b> <code>order.getCustomerAddressCountryTaxRate()\u003C/code> keeps the same coupling with a longer name. Move the <i>decision\u003C/i>, not just the dots.\u003C/li>\n      <li><b>Objects that need an <code>init()\u003C/code> call.\u003C/b> Finish setup in the constructor or a factory.\u003C/li>\n      <li><b>DRY-ing look-alike code with different owners.\u003C/b> Merge only the same knowledge.\u003C/li>\n      <li><b>Unstable classes with high fan-in.\u003C/b> If many classes call it, make its API an interface and keep it stable.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What are coupling and cohesion, and which way do you want each?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Coupling is how much one class depends on another's details; I want it low, so a change in one class doesn't ripple into others. Cohesion is how closely the parts inside a class belong together; I want it high, so each class has one job and its methods all work on the same fields. They go together: when each concern lives in one cohesive class, other classes only need its small public API.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> In review you see <code>order.getCustomer().getAddress().getCountry().getTaxRate()\u003C/code> inside <code>CheckoutService\u003C/code>. What's wrong, and how do you fix it?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>It breaks the Law of Demeter. <code>CheckoutService\u003C/code> now depends on the structure of four classes, so if a customer gets separate billing and shipping addresses, checkout breaks even though it has nothing to do with addresses. I'd add <code>order.taxRate()\u003C/code> and let each object delegate to its neighbour: order to customer, customer to its billing address, address to country. That puts the rule “tax comes from the billing country” in one place, and checkout depends only on <code>Order\u003C/code>. I wouldn't just add a long forwarding getter; the point is moving the decision.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Coupling is how much one class knows about another; aim for data coupling, and avoid control, temporal, global and content coupling.\u003C/li>\n      <li>Cohesion is how well a class's parts belong together: methods that use separate field groups mean separate classes.\u003C/li>\n      <li>Law of Demeter: call methods on yourself, your parameters, your fields and what you create; fix train wrecks by moving the decision.\u003C/li>\n      <li>Fan-out: how much a class depends on. Fan-in: how many depend on it. High fan-in classes need stable, interface-shaped APIs.\u003C/li>\n      <li>DRY is about one home for each piece of knowledge, not about merging code that merely looks alike.\u003C/li>\n      <li>KISS and YAGNI: extension points only where variation is stated or expected, and say so out loud.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">What kind of coupling is <code>exporter.export(report, true, false)\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Data coupling\u003C/button>\n        <button class=\"opt\">Control coupling: the flags tell the callee which internal branch to take\u003C/button>\n        <button class=\"opt\">Temporal coupling\u003C/button>\n        <button class=\"opt\">No coupling\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Boolean flags that select behaviour make the caller know about the callee's internal branches. Split the method (<code>exportCsv\u003C/code>, <code>exportPdf\u003C/code>) or pass a strategy.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Which line breaks the Law of Demeter?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>orders.stream().filter(Order::isOpen).map(Order::total).toList()\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>this.bucket.tryAcquire(now)\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>request.headers().get(\"Host\")\u003C/code> on a request record\u003C/button>\n        <button class=\"opt\"><code>order.getCustomer().getAddress().getCountry().getTaxRate()\u003C/code> in a service\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The train wreck navigates the internals of three behavioural objects the service doesn't own. Streams are designed to chain, a field call is allowed, and reading a data record is fine.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">A class's methods split into three groups, and each group uses its own two fields and none of the others. What does that say?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Low cohesion: it's really three classes sharing one name\u003C/button>\n        <button class=\"opt\">High cohesion: every field is used\u003C/button>\n        <button class=\"opt\">Low coupling\u003C/button>\n        <button class=\"opt\">It follows the Law of Demeter\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Cohesion is about methods and fields working together. Disjoint groups are separate responsibilities, and each group is a candidate class.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Username and coupon-code validation use identical regexes today, owned by different teams. Should you merge them into one shared pattern?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Yes: DRY forbids identical code\u003C/button>\n        <button class=\"opt\">Yes, and add a flag for when they differ\u003C/button>\n        <button class=\"opt\">No: they're different knowledge that changes for different reasons, and merging them creates the wrong abstraction\u003C/button>\n        <button class=\"opt\">No: regexes can't be shared in Java\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">DRY is about one representation per piece of knowledge. These look alike by coincidence; merging them couples two teams' rules, and a flag would add control coupling.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Eleven classes call <code>PaymentGateway\u003C/code> directly. What does that high fan-in suggest?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It should be split into eleven classes\u003C/button>\n        <button class=\"opt\">Its API should be stable, ideally an interface, because any change to it breaks eleven callers\u003C/button>\n        <button class=\"opt\">It has too many dependencies of its own\u003C/button>\n        <button class=\"opt\">Nothing: fan-in doesn't matter\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Fan-in counts who depends on you. The more callers, the more a change costs, so high fan-in classes should have narrow, stable, interface-shaped APIs.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const NS = 'http://www.w3.org/2000/svg';\n  const W = 130, H = 32;\n  const N = {\n    CheckoutController: [150, 30], CheckoutService: [150, 190], Order: [340, 60], Customer: [490, 60], Address: [640, 60], Country: [770, 60],\n    TaxTable: [770, 150], Cart: [340, 220], DiscountRules: [520, 220], PaymentGateway: [340, 320], StripeGateway: [520, 320], StripeClient: [720, 320], EmailSender: [150, 380],\n  };\n  const IFACE = new Set(['PaymentGateway']);\n  const BASE = [\n    ['CheckoutController', 'CheckoutService'],\n    ['CheckoutService', 'Order'], ['CheckoutService', 'Customer'], ['CheckoutService', 'Address'], ['CheckoutService', 'Country'], ['CheckoutService', 'TaxTable'],\n    ['CheckoutService', 'Cart'], ['CheckoutService', 'DiscountRules'], ['CheckoutService', 'StripeClient'], ['CheckoutService', 'EmailSender'],\n    ['Order', 'Customer'], ['Customer', 'Address'], ['Address', 'Country'], ['Country', 'TaxTable'], ['DiscountRules', 'Cart'],\n  ];\n  const RF = [\n    ['demeter', 'Tell, don\\'t ask: order.taxRate()', { remove: [['CheckoutService', 'Customer'], ['CheckoutService', 'Address'], ['CheckoutService', 'Country'], ['CheckoutService', 'TaxTable']], add: [] },\n      'Checkout no longer navigates Customer → Address → Country → TaxTable. Each class talks only to its neighbour, and Country\\'s API now has one direct caller instead of two.'],\n    ['cart', 'Move discount logic into Cart', { remove: [['CheckoutService', 'DiscountRules'], ['DiscountRules', 'Cart']], add: [['Cart', 'DiscountRules']] },\n      'Cart computes its own total with the rules it\\'s given. Checkout calls cart.total(): one dependency instead of two, and the rules no longer reach into cart internals.'],\n    ['dip', 'Depend on a PaymentGateway interface', { remove: [['CheckoutService', 'StripeClient']], add: [['CheckoutService', 'PaymentGateway'], ['StripeGateway', 'PaymentGateway'], ['StripeGateway', 'StripeClient']] },\n      'The Stripe SDK is now called only by StripeGateway. An SDK upgrade that changes its API touches one adapter, not checkout.'],\n  ];\n  const on = new Set();\n  let sel = 'Country';\n\n  function edges() {\n    let es = BASE.map((e) => e.slice());\n    const added = [];\n    RF.forEach(([k, , d]) => {\n      if (!on.has(k)) return;\n      es = es.filter(([a, b]) => !d.remove.some(([x, y]) => x === a && y === b));\n      d.add.forEach((e) => { es.push(e.slice()); added.push(e.join('>')); });\n    });\n    return { es, added: new Set(added) };\n  }\n  const visible = (n) => on.has('dip') || !['PaymentGateway', 'StripeGateway'].includes(n);\n  function center(n) { const [x, y] = N[n]; return [x + W / 2, y + H / 2]; }\n  function exit(n, tx, ty) {\n    const [cx, cy] = center(n), dx = tx - cx, dy = ty - cy;\n    const s = Math.min(dx ? (W / 2) / Math.abs(dx) : Infinity, dy ? (H / 2) / Math.abs(dy) : Infinity);\n    return [cx + dx * s, cy + dy * s];\n  }\n\n  function draw() {\n    const svg = $('#dgSvg'); svg.innerHTML = '';\n    const defs = document.createElementNS(NS, 'defs');\n    defs.innerHTML = '<marker id=\"dgA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--text-2)\"/>\u003C/marker>' +\n      '<marker id=\"dgR\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--red)\"/>\u003C/marker>' +\n      '<marker id=\"dgG\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--green)\"/>\u003C/marker>';\n    svg.appendChild(defs);\n    const { es, added } = edges();\n    const callers = new Set(es.filter(([, b]) => b === sel).map(([a]) => a));\n    es.forEach(([a, b]) => {\n      const [bx, by] = center(b), [ax, ay] = center(a);\n      const [x1, y1] = exit(a, bx, by), [x2, y2] = exit(b, ax, ay);\n      const p = document.createElementNS(NS, 'path');\n      const hot = b === sel, nw = added.has(a + '>' + b);\n      p.setAttribute('d', `M${x1},${y1} L${x2},${y2}`);\n      p.setAttribute('class', 'e' + (hot ? ' hot' : nw ? ' new' : ''));\n      p.setAttribute('marker-end', `url(#${hot ? 'dgR' : nw ? 'dgG' : 'dgA'})`);\n      svg.appendChild(p);\n    });\n    Object.keys(N).forEach((n) => {\n      const [x, y] = N[n], g = document.createElementNS(NS, 'g');\n      g.setAttribute('class', 'n' + (IFACE.has(n) ? ' iface' : '') + (n === sel ? ' sel' : '') + (callers.has(n) ? ' dep' : '') + (visible(n) ? '' : ' gone'));\n      g.innerHTML = `<rect x=\"${x}\" y=\"${y}\" width=\"${W}\" height=\"${H}\" rx=\"8\"/><text x=\"${x + W / 2}\" y=\"${y + 20}\" text-anchor=\"middle\">${IFACE.has(n) ? '«i» ' : ''}${n}\u003C/text>`;\n      g.addEventListener('click', () => { if (visible(n)) { sel = n; draw(); } });\n      svg.appendChild(g);\n    });\n    const fanOut = es.filter(([a]) => a === 'CheckoutService').length;\n    $('#dgStats').innerHTML = `\n      <div class=\"stat\"><div class=\"k\">Dependencies (arrows)\u003C/div><div class=\"v\">${es.length}\u003C/div>\u003C/div>\n      <div class=\"stat ${fanOut > 5 ? 'bad' : 'good'}\"><div class=\"k\">CheckoutService fan-out\u003C/div><div class=\"v\">${fanOut}\u003C/div>\u003C/div>\n      <div class=\"stat acc\"><div class=\"k\">Direct callers of ${sel}\u003C/div><div class=\"v\">${callers.size}\u003C/div>\u003C/div>`;\n  }\n  $('#dgRf').innerHTML = RF.map(([k, l]) => `<label data-k=\"${k}\"><input type=\"checkbox\"> ${l}\u003C/label>`).join('');\n  $$('#dgRf label').forEach((lb) => $('input', lb).addEventListener('change', (ev) => {\n    const k = lb.dataset.k, r = RF.find((x) => x[0] === k);\n    if (ev.target.checked) { on.add(k); $('#dgNote').innerHTML = `<b>${r[1]}:\u003C/b> ${r[3]}`; } else { on.delete(k); $('#dgNote').textContent = ''; }\n    lb.classList.toggle('on', ev.target.checked);\n    if (!visible(sel)) sel = 'CheckoutService';\n    draw();\n  }));\n  $('#dgNote').innerHTML = 'Country is selected: two classes call it directly today. Try <b>StripeClient\u003C/b> too, then apply the refactorings one at a time.';\n  draw();\n})();\n"]},"06-relationships.html":{"title":"Modeling Relationships","chapter":"6","styles":"\n  .bl-cols { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:860px) { .bl-cols { grid-template-columns:1fr; } }\n  .bl-col h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }\n  .bl-obj { border:1.5px solid var(--border); border-radius:10px; padding:8px 10px; margin-bottom:8px; background:var(--surface-2); font-family:var(--mono); font-size:12.5px; }\n  .bl-obj b { color:var(--accent); }\n  .bl-obj .set { color:var(--text-2); }\n  .bl-obj.bad { border-color:var(--red); background:var(--red-soft); }\n  .bl-na { color:var(--muted); font-size:13px; font-style:italic; }\n  .bl-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }\n  .bl-badge { font-family:var(--mono); font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:999px; }\n  .bl-badge.ok { background:var(--green-soft); color:var(--green); }\n  .bl-badge.bad { background:var(--red-soft); color:var(--red); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 6\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Modeling <span class=\"grad\">Relationships\u003C/span>\u003C/h1>\n    <p class=\"lead\">A class diagram's lines are decisions. Who creates this object? Who is allowed to keep a reference to it? When it's deleted, what goes with it? Can you get from A to B, and also from B to A? This chapter turns the UML relationships from <a href=\"p8-reading-uml.html\">P8\u003C/a> into concrete Java: the field types, the constructors, and the methods that keep both ends of a relationship consistent.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Implement composition in Java: the whole creates, owns and hides its parts\u003C/li>\n      <li>Choose the Java type for each multiplicity: a field, <code>Optional\u003C/code>, <code>List\u003C/code>, <code>Set\u003C/code> or <code>Map\u003C/code>\u003C/li>\n      <li>Model many-to-many relationships, and promote them to a class when they carry data\u003C/li>\n      <li>Decide whether a link should be navigable one way or both, and keep both ends in sync when it is\u003C/li>\n      <li>State who owns each object's lifecycle\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>The six UML relationships and multiplicities.\u003C/b> See <a href=\"p8-reading-uml.html\">P8: Reading UML\u003C/a>.\u003C/li>\n        <li><b>Defensive copies and unmodifiable views.\u003C/b> See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b>Entities and value objects,\u003C/b> and <code>equals\u003C/code>/<code>hashCode\u003C/code>. See <a href=\"p6-value-objects.html\">P6\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Relationships are decisions about ownership\u003C/h2>\n  <p>Take a team chat product: workspaces contain channels, channels contain messages, users join channels and write messages. Every one of those links answers three questions, and the answers decide the Java:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Link\u003C/th><th>Who creates the other?\u003C/th><th>Can it be shared?\u003C/th><th>Deleted together?\u003C/th><th>Relationship\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Channel → Message\u003C/td><td>The channel (<code>channel.post(…)\u003C/code>)\u003C/td><td>No, a message is in one channel\u003C/td><td>Yes\u003C/td><td>Composition\u003C/td>\u003C/tr>\n        <tr><td>Workspace → Channel\u003C/td><td>The workspace\u003C/td><td>No\u003C/td><td>Yes\u003C/td><td>Composition\u003C/td>\u003C/tr>\n        <tr><td>Channel → User (members)\u003C/td><td>Nobody: users exist first\u003C/td><td>Yes, a user is in many channels\u003C/td><td>No\u003C/td><td>Many-to-many association\u003C/td>\u003C/tr>\n        <tr><td>Message → User (author)\u003C/td><td>Nobody\u003C/td><td>Yes\u003C/td><td>No: deleting a user doesn't delete history\u003C/td><td>Association\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n\n  <h2>Composition in Java\u003C/h2>\n  <p>Composition means the whole <b>owns the lifecycle\u003C/b> of its parts. In Java, three habits make that true rather than just drawn:\u003C/p>\n  <ol>\n    <li><b>The whole creates the parts.\u003C/b> Callers ask the channel to post a message; they don't construct a <code>Message\u003C/code> and push it in. That way the channel can enforce its rules (not archived, author is a member) on every message.\u003C/li>\n    <li><b>The whole never hands out the mutable parts collection.\u003C/b> Return an unmodifiable view or a copy (<a href=\"p2-encapsulation.html\">P2\u003C/a>).\u003C/li>\n    <li><b>Deleting the whole deletes the parts.\u003C/b> In memory, dropping the channel makes its messages unreachable. In a database, that's a cascade delete, or the messages live inside the channel's record.\u003C/li>\n  \u003C/ol>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Channel.java: composition, done properly\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">Channel\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">ChannelId\u003C/span> id;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> name;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Message\u003C/span>&gt; messages = <span class=\"k\">new\u003C/span> <span class=\"t\">ArrayList\u003C/span>&lt;&gt;();       <span class=\"c\">// ◆ 0..*: ordered, owned\u003C/span>\n\t<span class=\"k\">private boolean\u003C/span> archived;\n\n\t<span class=\"c\">/** The only way a message comes into existence: the channel checks its rules first. */\u003C/span>\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Message\u003C/span> <span class=\"f\">post\u003C/span>(<span class=\"t\">UserId\u003C/span> author, <span class=\"t\">String\u003C/span> text, <span class=\"t\">Instant\u003C/span> at, <span class=\"t\">Predicate\u003C/span>&lt;<span class=\"t\">UserId\u003C/span>&gt; isMember) {\n\t\t<span class=\"k\">if\u003C/span> (archived) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"channel is archived\"\u003C/span>);\n\t\t<span class=\"k\">if\u003C/span> (!isMember.<span class=\"f\">test\u003C/span>(author)) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"not a member: \"\u003C/span> + author);\n\t\t<span class=\"t\">Message\u003C/span> m = <span class=\"k\">new\u003C/span> <span class=\"t\">Message\u003C/span>(<span class=\"t\">MessageId\u003C/span>.<span class=\"f\">random\u003C/span>(), author, text, at);    <span class=\"c\">// immutable record\u003C/span>\n\t\tmessages.<span class=\"f\">add\u003C/span>(m);\n\t\t<span class=\"k\">return\u003C/span> m;\n\t}\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Message\u003C/span>&gt; <span class=\"f\">recent\u003C/span>(<span class=\"k\">int\u003C/span> n) {                           <span class=\"c\">// a copy, never the list itself\u003C/span>\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">List\u003C/span>.<span class=\"f\">copyOf\u003C/span>(messages.<span class=\"f\">subList\u003C/span>(<span class=\"t\">Math\u003C/span>.<span class=\"f\">max\u003C/span>(<span class=\"m\">0\u003C/span>, messages.<span class=\"f\">size\u003C/span>() - n), messages.<span class=\"f\">size\u003C/span>()));\n\t}\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">archive\u003C/span>() { archived = <span class=\"k\">true\u003C/span>; }\n}\n\n<span class=\"k\">public record\u003C/span> <span class=\"t\">Message\u003C/span>(<span class=\"t\">MessageId\u003C/span> id, <span class=\"t\">UserId\u003C/span> author, <span class=\"t\">String\u003C/span> text, <span class=\"t\">Instant\u003C/span> sentAt) {}\n<span class=\"c\">//                                   ↑ association by id: the message refers to its author, doesn't own them\u003C/span>\u003C/pre>\n    <div class=\"cb-foot\"><b>Two details worth copying:\u003C/b> the message refers to its author by <code>UserId\u003C/code>, not by holding a <code>User\u003C/code> object, so a message never keeps a whole user graph alive and never goes stale when the user renames themselves. And membership arrives as a predicate, because who belongs to a channel is a separate relationship, next section.\u003C/div>\n  \u003C/div>\n\n  <h2>Multiplicity becomes a type\u003C/h2>\n  <p>Each multiplicity from the diagram maps to a Java type, and choosing the right collection states a rule for free:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Multiplicity and need\u003C/th><th>Java type\u003C/th><th>Rule it enforces\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td><code>1\u003C/code>\u003C/td><td>A <code>final\u003C/code> field, checked with <code>requireNonNull\u003C/code>\u003C/td><td>Always exactly one\u003C/td>\u003C/tr>\n        <tr><td><code>0..1\u003C/code>\u003C/td><td>A nullable field, exposed as <code>Optional&lt;T&gt;\u003C/code> from the getter\u003C/td><td>Callers must handle absence\u003C/td>\u003C/tr>\n        <tr><td><code>*\u003C/code>, order matters\u003C/td><td><code>List&lt;T&gt;\u003C/code>\u003C/td><td>Insertion order kept; duplicates allowed\u003C/td>\u003C/tr>\n        <tr><td><code>*\u003C/code>, no duplicates\u003C/td><td><code>Set&lt;T&gt;\u003C/code>\u003C/td><td>Each element at most once (needs good <code>equals\u003C/code>)\u003C/td>\u003C/tr>\n        <tr><td><code>*\u003C/code>, looked up by key\u003C/td><td><code>Map&lt;K, T&gt;\u003C/code>\u003C/td><td>One element per key; O(1) lookup\u003C/td>\u003C/tr>\n        <tr><td><code>1..*\u003C/code>\u003C/td><td>A collection, validated non-empty in the constructor\u003C/td><td>Never empty\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n\n  <h2>Many-to-many, and when a link becomes a class\u003C/h2>\n  <p>A user belongs to many channels; a channel has many users. There are three ways to store that, and the choice matters more than it looks:\u003C/p>\n  <ul>\n    <li><b>A set on each side:\u003C/b> <code>Channel.members\u003C/code> and <code>User.channels\u003C/code>. Navigation is easy both ways, but there are now two copies of one fact, and every change must update both.\u003C/li>\n    <li><b>A set on one side only:\u003C/b> <code>Channel.members\u003C/code>. One copy, one place to change. Finding a user's channels means searching, or asking an index.\u003C/li>\n    <li><b>A separate association object:\u003C/b> a <code>Membership(userId, channelId, role, joinedAt)\u003C/code> record held in one registry, like a join table in a database. The relationship itself is the thing stored.\u003C/li>\n  \u003C/ul>\n  <p>The third option becomes the only good one as soon as the relationship has <b>its own data\u003C/b>. “Alice is an admin of #incidents since March” is a fact about the <i>pair\u003C/i>, not about Alice or about the channel. UML calls this an <b>association class\u003C/b>:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public record\u003C/span> <span class=\"t\">Membership\u003C/span>(<span class=\"t\">UserId\u003C/span> user, <span class=\"t\">ChannelId\u003C/span> channel, <span class=\"t\">Role\u003C/span> role, <span class=\"t\">Instant\u003C/span> joinedAt) {}\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">Memberships\u003C/span> {                                        <span class=\"c\">// the single source of truth\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">ChannelId\u003C/span>, <span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">UserId\u003C/span>, <span class=\"t\">Membership\u003C/span>&gt;&gt; byChannel = <span class=\"k\">new\u003C/span> <span class=\"t\">HashMap\u003C/span>&lt;&gt;();\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">UserId\u003C/span>, <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">ChannelId\u003C/span>&gt;&gt; byUser = <span class=\"k\">new\u003C/span> <span class=\"t\">HashMap\u003C/span>&lt;&gt;();         <span class=\"c\">// an index, kept in step privately\u003C/span>\n\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">join\u003C/span>(<span class=\"t\">UserId\u003C/span> u, <span class=\"t\">ChannelId\u003C/span> c, <span class=\"t\">Role\u003C/span> role, <span class=\"t\">Instant\u003C/span> at) {\n\t\tbyChannel.<span class=\"f\">computeIfAbsent\u003C/span>(c, k -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">HashMap\u003C/span>&lt;&gt;()).<span class=\"f\">put\u003C/span>(u, <span class=\"k\">new\u003C/span> <span class=\"t\">Membership\u003C/span>(u, c, role, at));\n\t\tbyUser.<span class=\"f\">computeIfAbsent\u003C/span>(u, k -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">HashSet\u003C/span>&lt;&gt;()).<span class=\"f\">add\u003C/span>(c);\n\t}\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">leave\u003C/span>(<span class=\"t\">UserId\u003C/span> u, <span class=\"t\">ChannelId\u003C/span> c) { <span class=\"c\">/* remove from both maps */\u003C/span> }\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isMember\u003C/span>(<span class=\"t\">UserId\u003C/span> u, <span class=\"t\">ChannelId\u003C/span> c) { … }\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">ChannelId\u003C/span>&gt; <span class=\"f\">channelsOf\u003C/span>(<span class=\"t\">UserId\u003C/span> u) { <span class=\"k\">return\u003C/span> <span class=\"t\">Set\u003C/span>.<span class=\"f\">copyOf\u003C/span>(byUser.<span class=\"f\">getOrDefault\u003C/span>(u, <span class=\"t\">Set\u003C/span>.<span class=\"f\">of\u003C/span>())); }\n}\u003C/pre>\n  <p>There are still two maps, but they're private to one class and changed only by <code>join\u003C/code> and <code>leave\u003C/code>, so they can't drift apart. That's the general rule for bidirectional links: two copies are fine as long as <b>one method\u003C/b> changes both and <b>nobody else\u003C/b> can touch either. Try all three designs:\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Bidirectional links: can the two sides disagree?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"blMode\"><button class=\"active\" data-v=\"naive\">Two public sets\u003C/button><button data-v=\"synced\">Sets kept in step by one method\u003C/button><button data-v=\"registry\">Membership registry\u003C/button>\u003C/div>\n        <span style=\"flex:1\">\u003C/span><span class=\"bl-badge\" id=\"blBadge\">\u003C/span>\n      \u003C/div>\n      <div class=\"bl-actions\">\n        <button class=\"btn sm primary\" data-a=\"join\">Alice joins #general\u003C/button>\n        <button class=\"btn sm\" data-a=\"bob\">Bob joins #general\u003C/button>\n        <button class=\"btn sm\" data-a=\"leave\">Alice leaves #general\u003C/button>\n        <button class=\"btn sm\" data-a=\"direct\">alice.getChannels().add(#random)\u003C/button>\n        <button class=\"btn sm\" data-a=\"reset\">↺ reset\u003C/button>\n      \u003C/div>\n      <pre class=\"code\" id=\"blSrc\" style=\"margin:12px 0 0;font-size:12.5px\">\u003C/pre>\n      <div class=\"bl-cols\">\n        <div class=\"bl-col\"><h4>Channel side\u003C/h4><div id=\"blCh\">\u003C/div>\u003C/div>\n        <div class=\"bl-col\"><h4>User side\u003C/h4><div id=\"blUs\">\u003C/div>\u003C/div>\n        <div class=\"bl-col\"><h4>Registry\u003C/h4><div id=\"blReg\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <div class=\"log\" id=\"blLog\" style=\"height:78px;margin-top:10px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">The invariant: Alice is in <code>#general.members\u003C/code> exactly when <code>#general\u003C/code> is in <code>alice.channels\u003C/code>. Two public sets break it in two ways: an update that changes only one side, and a caller editing a side directly.\u003C/div>\n  \u003C/div>\n\n  <h2>Navigate one way unless you need both\u003C/h2>\n  <p>A link you can follow in both directions costs more than keeping two sets in step. Objects that point at each other make <code>equals\u003C/code>, <code>hashCode\u003C/code> and <code>toString\u003C/code> easy to get wrong: a generated <code>toString\u003C/code> on <code>Channel\u003C/code> prints its members, each member prints its channels, and the program dies with <code>StackOverflowError\u003C/code>. Serializing to JSON loops the same way. And it's harder to see who owns what.\u003C/p>\n  <p>So default to <b>one direction\u003C/b>, the one the use cases navigate most, and answer the reverse question with a query or an index held by one class, as <code>Memberships.channelsOf\u003C/code> does. Referring to other entities <b>by id\u003C/b> rather than by object reference, like <code>Message.author\u003C/code>, is a good default at entity boundaries: it breaks cycles, keeps object graphs small, and matches how the data is stored anyway. <a href=\"27-domain-modeling.html\">Chapter 27\u003C/a> turns this into the rule that aggregates reference each other by id.\u003C/p>\n\n  <figure class=\"seq\" data-actors=\"ChannelController|Memberships|Channel|Message (new)\">\n    <ol>\n      <li data-m=\"0>1\">isMember(alice, #general)?\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">true\u003C/li>\n      <li data-m=\"0>2\">post(alice, \"deploy is green\", now, memberships::isMember)\u003C/li>\n      <li data-m=\"2>2\">not archived; author is a member\u003C/li>\n      <li data-m=\"2>3\">new Message(id, alice, text, now)\u003C/li>\n      <li data-m=\"2>0\" data-k=\"reply\">the message (immutable)\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Two relationships in one use case.\u003C/b> Membership is asked of the registry that owns it; the message is created by the channel that owns it. Neither class reaches into the other's data.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The join table is the association class\u003C/div><p>In a relational database, a many-to-many relationship is always a third table: <code>channel_members(user_id, channel_id, role, joined_at)\u003C/code>, with a primary key on the two ids. Nobody stores a list of channel ids inside the user row. The in-memory design above mirrors that on purpose. When a repository later loads memberships from the database (<a href=\"26-persistence.html\">Chapter 26\u003C/a>), one table maps to one record type, and the question “are both sides in sync?” can't come up, because there is only one side.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Letting callers construct parts and add them.\u003C/b> <code>channel.getMessages().add(new Message(...))\u003C/code> skips every rule. The whole creates its parts.\u003C/li>\n      <li><b>Two public sets for one relationship.\u003C/b> They will drift apart. One method updates both, or keep one source of truth.\u003C/li>\n      <li><b>Putting relationship data on either end.\u003C/b> A role is about the user-in-a-channel pair: make a <code>Membership\u003C/code> class.\u003C/li>\n      <li><b>Bidirectional object references everywhere.\u003C/b> Generated <code>toString\u003C/code> and JSON serialization recurse forever. Navigate one way; use ids across entities.\u003C/li>\n      <li><b>A <code>List\u003C/code> where the rule is “no duplicates”\u003C/b>, or a <code>Set\u003C/code> where order matters. The collection type is part of the model.\u003C/li>\n      <li><b>Deleting a whole without its parts.\u003C/b> Orphaned messages with no channel are a data bug. Composition means cascade.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> How do you implement composition in Java, beyond drawing a filled diamond?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>The whole creates the parts through its own methods, so it can enforce its rules; for example <code>channel.post(author, text)\u003C/code> creates the message rather than letting callers construct one and add it. It keeps the collection private and returns copies or unmodifiable views. And the parts go when the whole goes: in memory they become unreachable, in a database it's a cascade delete. Parts usually refer to other entities by id, so they don't keep unrelated objects alive.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Users join channels, and each membership has a role and a join date. How do you model it?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>The role and join date belong to the pair, not to either side, so the relationship becomes a class: a <code>Membership(userId, channelId, role, joinedAt)\u003C/code> record. I'd keep memberships in one registry class that is the single source of truth, with a private index by user for “which channels is Alice in?”, both updated only by <code>join\u003C/code> and <code>leave\u003C/code>. I wouldn't give <code>User\u003C/code> and <code>Channel\u003C/code> public sets of each other, because they'd drift apart and create cycles in <code>toString\u003C/code> and serialization. It's the in-memory version of a join table.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Every relationship answers: who creates it, can it be shared, is it deleted with the whole.\u003C/li>\n      <li>Composition in Java: the whole creates its parts, hides the collection, and takes the parts with it when it goes.\u003C/li>\n      <li>Multiplicity is a type: final field, Optional, List (ordered), Set (unique), Map (by key), non-empty check for 1..*.\u003C/li>\n      <li>Many-to-many with data of its own is an association class, like <code>Membership\u003C/code>: the in-memory join table.\u003C/li>\n      <li>Two copies of one link are safe only if one method changes both and nothing else can touch them.\u003C/li>\n      <li>Default to one-way navigation, and refer to other entities by id to avoid cycles and stale graphs.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A channel creates its messages, messages belong to exactly one channel, and deleting the channel deletes them. Which relationship is it?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Association\u003C/button>\n        <button class=\"opt\">Composition\u003C/button>\n        <button class=\"opt\">Aggregation\u003C/button>\n        <button class=\"opt\">Dependency\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The whole creates the parts, doesn't share them, and they share its lifecycle. That's composition.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Each user-channel membership has a role and a join date. Where do those fields go?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">On <code>User\u003C/code>, as a map from channel to role\u003C/button>\n        <button class=\"opt\">On <code>Channel\u003C/code>, as two parallel lists\u003C/button>\n        <button class=\"opt\">On both, to make lookups fast\u003C/button>\n        <button class=\"opt\">On a <code>Membership\u003C/code> class representing the pair, like a join table\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The data describes the relationship, not either end. Making the relationship a class gives it one home and avoids two copies drifting apart.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">A workspace has many channels, and callers usually fetch one by its id. What's the best field type?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>List&lt;Channel&gt;\u003C/code>, searched each time\u003C/button>\n        <button class=\"opt\"><code>Channel[]\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>Map&lt;ChannelId, Channel&gt;\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>Optional&lt;Channel&gt;\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A <code>*\u003C/code> multiplicity looked up by key is a map: one channel per id and O(1) lookup. A list would need a linear search on every request.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\"><code>Channel\u003C/code> has a public <code>Set&lt;User&gt; members\u003C/code> and <code>User\u003C/code> a public <code>Set&lt;Channel&gt; channels\u003C/code>. What goes wrong?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Updates can change one side but not the other, and generated toString/JSON can recurse between them\u003C/button>\n        <button class=\"opt\">Nothing: two sets make lookups faster both ways\u003C/button>\n        <button class=\"opt\">Java doesn't allow two classes to refer to each other\u003C/button>\n        <button class=\"opt\">Sets can't hold objects with ids\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Two public copies of one fact drift apart, and mutual references create cycles for <code>toString\u003C/code>, <code>hashCode\u003C/code> and serialization. Keep one source of truth, or one method that updates private copies together.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Why does the <code>Message\u003C/code> record store <code>UserId author\u003C/code> rather than a <code>User\u003C/code> object?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Records can't hold objects\u003C/button>\n        <button class=\"opt\">Ids are faster to compare than objects\u003C/button>\n        <button class=\"opt\">It refers to another entity without owning it: no cycles, no keeping a user graph alive, and no stale copy of the user's data\u003C/button>\n        <button class=\"opt\">So the message can change its author later\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Referencing entities across boundaries by id keeps object graphs small, avoids reference cycles, and matches how the data is stored. Current user details are fetched when needed.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  let mode = 'naive', ch, us, reg;\n  const log = $('#blLog');\n  const SRC = {\n    naive:    '// Channel: public final Set<User> members = new HashSet<>();\\n// User:    public final Set<Channel> channels = new HashSet<>();\\ngeneral.members.add(alice);   // the \"join\" code someone wrote',\n    synced:   'public void addMember(User u) {       // in Channel; sets are private\\n    members.add(u);\\n    u.addChannelInternal(this);        // package-private, used only here\\n}\\n// but getChannels() still returns the live set…',\n    registry: 'memberships.join(alice, general, Role.MEMBER, now);   // one fact, one place\\n// User and Channel hold no sets of each other',\n  };\n  function reset() {\n    ch = { '#general': new Set(), '#random': new Set() };\n    us = { alice: new Set(), bob: new Set() };\n    reg = [];\n    log.innerHTML = '';\n    $('#blSrc').textContent = SRC[mode];\n    draw();\n  }\n  const has = (a, b) => mode === 'registry' ? reg.some((m) => m.u === a && m.c === b) : null;\n  function consistent() {\n    if (mode === 'registry') return true;\n    for (const [c, ms] of Object.entries(ch)) for (const u of ms) if (!us[u].has(c)) return false;\n    for (const [u, cs] of Object.entries(us)) for (const c of cs) if (!ch[c].has(u)) return false;\n    return true;\n  }\n  function draw() {\n    const ok = consistent();\n    const b = $('#blBadge'); b.className = 'bl-badge ' + (ok ? 'ok' : 'bad'); b.textContent = ok ? '✓ both sides agree' : '✗ the two sides disagree';\n    if (mode === 'registry') {\n      $('#blCh').innerHTML = Object.keys(ch).map((c) => `<div class=\"bl-obj\"><b>${c}\u003C/b> <span class=\"set\">members (derived): {${reg.filter((m) => m.c === c).map((m) => m.u).join(', ')}}\u003C/span>\u003C/div>`).join('');\n      $('#blUs').innerHTML = Object.keys(us).map((u) => `<div class=\"bl-obj\"><b>${u}\u003C/b> <span class=\"set\">channelsOf (derived): {${reg.filter((m) => m.u === u).map((m) => m.c).join(', ')}}\u003C/span>\u003C/div>`).join('');\n      $('#blReg').innerHTML = reg.length ? reg.map((m) => `<div class=\"bl-obj\">Membership(${m.u}, ${m.c}, MEMBER)\u003C/div>`).join('') : '<div class=\"bl-na\">No memberships yet.\u003C/div>';\n      return;\n    }\n    $('#blCh').innerHTML = Object.entries(ch).map(([c, ms]) => { const bad = [...ms].some((u) => !us[u].has(c)); return `<div class=\"bl-obj${bad ? ' bad' : ''}\"><b>${c}\u003C/b>.members <span class=\"set\">{${[...ms].join(', ')}}\u003C/span>\u003C/div>`; }).join('');\n    $('#blUs').innerHTML = Object.entries(us).map(([u, cs]) => { const bad = [...cs].some((c) => !ch[c].has(u)); return `<div class=\"bl-obj${bad ? ' bad' : ''}\"><b>${u}\u003C/b>.channels <span class=\"set\">{${[...cs].join(', ')}}\u003C/span>\u003C/div>`; }).join('');\n    $('#blReg').innerHTML = '<div class=\"bl-na\">Not used in this design.\u003C/div>';\n  }\n  function act(a) {\n    if (a === 'reset') return reset();\n    if (a === 'join' || a === 'bob') {\n      const u = a === 'join' ? 'alice' : 'bob';\n      if (mode === 'naive') {\n        ch['#general'].add(u);\n        if (u === 'bob') us.bob.add('#general');\n        LLD.log(log, u === 'alice' ? 'The join code updated #general.members and forgot alice.channels. Nothing stopped it.' : 'Bob\\'s join was written by someone else, who remembered both sets. Two call sites, two behaviours.', u === 'alice' ? 'bad' : 'warn');\n      } else if (mode === 'synced') { ch['#general'].add(u); us[u].add('#general'); LLD.log(log, `addMember(${u}) updated both private sets in one method.`, 'ok'); }\n      else { if (!has(u, '#general')) reg.push({ u, c: '#general' }); LLD.log(log, `join(${u}, #general): one Membership record. Both views are derived from it.`, 'ok'); }\n    } else if (a === 'leave') {\n      if (mode === 'naive') { us.alice.delete('#general'); LLD.log(log, 'Another developer removed #general from alice.channels only. The channel still lists her.', 'bad'); }\n      else if (mode === 'synced') { ch['#general'].delete('alice'); us.alice.delete('#general'); LLD.log(log, 'removeMember(alice) removed her from both sets.', 'ok'); }\n      else { reg = reg.filter((m) => !(m.u === 'alice' && m.c === '#general')); LLD.log(log, 'leave(alice, #general): the one record is gone, so both views agree.', 'ok'); }\n    } else if (a === 'direct') {\n      if (mode === 'registry') { LLD.log(log, 'Compile error: User has no getChannels(). The only way in is memberships.join(...).', 'ok'); }\n      else { us.alice.add('#random'); LLD.log(log, mode === 'naive' ? 'A caller edited the public set directly: Alice thinks she\\'s in #random; #random disagrees.' : 'The sets are private, but the getter returned the live set, so a caller still broke it. Return a copy or unmodifiable view.', 'bad'); }\n    }\n    draw();\n  }\n  $$('.bl-actions button').forEach((b) => b.addEventListener('click', () => act(b.dataset.a)));\n  $$('#blMode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; reset(); }));\n  reset();\n})();\n"]},"07-class-contracts.html":{"title":"Class APIs &amp; Contracts","chapter":"7","styles":"\n  .ml-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }\n  .ml-tabs button.active { background:var(--accent-s
