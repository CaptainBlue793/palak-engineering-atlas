=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Two threads call an unsynchronised lazy <code>get()\u003C/code> (<code>if (instance == null) instance = new X();\u003C/code>) at the same moment. What can happen?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Nothing: assignment to a static field is atomic, so only one instance is made\u003C/button>\n        <button class=\"opt\">Both see null and both construct: two instances exist, and one caller keeps a different object\u003C/button>\n        <button class=\"opt\">The JVM throws an exception\u003C/button>\n        <button class=\"opt\">One thread blocks until the other finishes\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The check and the assignment are separate steps, so both threads can pass the check. Each atomic step is safe on its own; the sequence isn't.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Why does double-checked locking need the instance field to be <code>volatile\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">To make the lock faster\u003C/button>\n        <button class=\"opt\">So the field can be reassigned\u003C/button>\n        <button class=\"opt\">Because static fields can't be read without it\u003C/button>\n        <button class=\"opt\">Without it, the reference can be published before the constructor finishes, so another thread may use a half-initialised object\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The unsynchronised first check can see a non-null reference that was written before the object's fields. A volatile write can't be reordered before the constructor's writes, and a volatile read sees everything written before it.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Why is the holder-class idiom thread-safe without any <code>synchronized\u003C/code> keyword?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The JVM initialises the nested class once, under its own lock, the first time <code>get()\u003C/code> touches it, and publishes the result to every thread\u003C/button>\n        <button class=\"opt\">Nested classes are always thread-safe\u003C/button>\n        <button class=\"opt\">Static methods can't run concurrently\u003C/button>\n        <button class=\"opt\">It isn't thread-safe\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Class initialisation is specified to happen exactly once with proper visibility. The holder idiom borrows that guarantee and delays it until first use.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">What is the main testing problem with calling <code>FeatureFlags.getInstance()\u003C/code> inside business classes?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Singletons are slow to construct\u003C/button>\n        <button class=\"opt\">Tests can't call static methods\u003C/button>\n        <button class=\"opt\">Tests can't substitute a fake, and flag changes made in one test leak into the tests that run after it\u003C/button>\n        <button class=\"opt\">The flags are always false in tests\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A global instance is shared by every test in the JVM and hidden from constructors. Passing a <code>FeatureFlags\u003C/code> object in lets each test build its own.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">What's the usual better alternative to a Singleton for a metrics registry?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A static utility class with static methods\u003C/button>\n        <button class=\"opt\">Create one instance in the composition root and inject it into each class that records metrics\u003C/button>\n        <button class=\"opt\">A new instance in every class that needs one\u003C/button>\n        <button class=\"opt\">A service locator\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">One shared instance, created once and passed explicitly, gives the “only one” you wanted, with visible dependencies and a fresh instance per test.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$, sleep } = LLD;\n  const log = $('#rcLog');\n  // Each program: lines, and step functions keyed by pc. A step returns { goto, done, blocked, msg, cls }.\n  let S, TH, mode = 'naive', nextId;\n  const newObj = (built) => { const id = nextId++; S.objs[id] = { built }; return id; };\n  const P = {\n    naive: {\n      lines: ['static ConfigRegistry get() {', '  if (instance == null)', '    instance = new ConfigRegistry();', '  return instance;', '}'],\n      start: 1,\n      step: {\n        1: (t) => ({ goto: S.instance == null ? 2 : 3, msg: `sees instance = ${S.instance == null ? 'null' : '@' + S.instance}` }),\n        2: (t) => { const id = newObj(true); const old = S.instance; S.instance = id; return { goto: 3, msg: `constructs @${id}${old ? ` and overwrites @${old}` : ''}`, cls: old ? 'bad' : '' }; },\n        3: (t) => { t.result = S.instance; return { done: true, msg: `returns @${S.instance}` }; },\n      },\n      worst: 'ABAABB',\n    },\n    sync: {\n      lines: ['static synchronized ConfigRegistry get() {', '  if (instance == null)', '    instance = new ConfigRegistry();', '  return instance;   // lock released', '}'],\n      start: 0,\n      step: {\n        0: (t) => S.lock && S.lock !== t.n ? { blocked: true, msg: 'blocked: the other thread holds the lock' } : (S.lock = t.n, { goto: 1, msg: 'acquires the class lock' }),\n        1: (t) => ({ goto: S.instance == null ? 2 : 3, msg: `sees instance = ${S.instance == null ? 'null' : '@' + S.instance}` }),\n        2: (t) => { const id = newObj(true); S.instance = id; return { goto: 3, msg: `constructs @${id}` }; },\n        3: (t) => { t.result = S.instance; S.lock = null; return { done: true, msg: `returns @${S.instance} and releases the lock` }; },\n      },\n      worst: 'ABABABAB',\n    },\n    dcl: {\n      lines: ['static ConfigRegistry get() {', '  if (instance == null) {            // 1st check, no lock', '    synchronized (LOCK) {', '      if (instance == null)           // 2nd check', '        instance = new ConfigRegistry();', '        // reorderable: allocate, publish, construct', '    }', '  }', '  return instance;', '}'],\n      start: 1,\n      step: {\n        1: (t) => ({ goto: S.instance == null ? 2 : 8, msg: `1st check sees ${S.instance == null ? 'null' : '@' + S.instance + (S.objs[S.instance].built ? '' : ' (fields not set yet!)')}` }),\n        2: (t) => S.lock && S.lock !== t.n ? { blocked: true, msg: 'blocked on LOCK' } : (S.lock = t.n, { goto: 3, msg: 'acquires LOCK' }),\n        3: (t) => ({ goto: S.instance == null ? 4 : 6, msg: `2nd check sees ${S.instance == null ? 'null' : '@' + S.instance}` }),\n        4: (t) => { const id = newObj(false); S.instance = id; t.pending = id; return { goto: 5, msg: `allocates @${id} and publishes the reference BEFORE the constructor runs`, cls: 'warn' }; },\n        5: (t) => { S.objs[t.pending].built = true; return { goto: 6, msg: `constructor for @${t.pending} finally runs` }; },\n        6: (t) => { S.lock = null; return { goto: 8, msg: 'releases LOCK' }; },\n        8: (t) => { t.result = S.instance; const half = !S.objs[S.instance].built; return { done: true, msg: `returns @${S.instance}${half ? ': HALF-CONSTRUCTED, its config map is still null' : ''}`, cls: half ? 'bad' : 'ok' }; },\n      },\n      worst: 'AAAABB',\n    },\n    dclv: {\n      lines: ['private static volatile ConfigRegistry instance;', 'static ConfigRegistry get() {', '  if (instance == null) {            // volatile read', '    synchronized (LOCK) {', '      if (instance == null)', '        instance = new ConfigRegistry(); // then publish', '    }', '  }', '  return instance;', '}'],\n      start: 2,\n      step: {\n        2: (t) => ({ goto: S.instance == null ? 3 : 8, msg: `1st check sees ${S.instance == null ? 'null' : '@' + S.instance}` }),\n        3: (t) => S.lock && S.lock !== t.n ? { blocked: true, msg: 'blocked on LOCK' } : (S.lock = t.n, { goto: 4, msg: 'acquires LOCK' }),\n        4: (t) => ({ goto: S.instance == null ? 5 : 6, msg: `2nd check sees ${S.instance == null ? 'null' : '@' + S.instance}` }),\n        5: (t) => { const id = newObj(true); S.instance = id; return { goto: 6, msg: `constructs @${id} fully, then the volatile write publishes it` }; },\n        6: (t) => { S.lock = null; return { goto: 8, msg: 'releases LOCK' }; },\n        8: (t) => { t.result = S.instance; return { done: true, msg: `returns @${S.instance}, fully built`, cls: 'ok' }; },\n      },\n      worst: 'AAAABB',\n    },\n    holder: {\n      lines: ['private static final class Holder {', '  static final ConfigRegistry INSTANCE = new ConfigRegistry();', '}', 'static ConfigRegistry get() {', '  return Holder.INSTANCE;   // triggers class init once', '}'],\n      start: 4,\n      step: {\n        4: (t) => {\n          if (S.init === 'done') { t.result = S.instance; return { done: true, msg: `returns @${S.instance}`, cls: 'ok' }; }\n          if (S.init && S.init !== t.n) return { blocked: true, msg: 'waits: another thread is initialising Holder (JVM class-init lock)' };\n          if (!S.init) { S.init = t.n; const id = newObj(true); S.instance = id; return { goto: 4, msg: `JVM initialises Holder: constructs @${id}` }; }\n          S.init = 'done'; return { goto: 4, msg: 'class initialisation completes and is visible to all threads' };\n        },\n      },\n      worst: 'ABABAB',\n    },\n  };\n\n  function reset() {\n    S = { instance: null, objs: {}, lock: null, init: null }; nextId = 1;\n    TH = { A: { n: 'A', pc: P[mode].start, done: false, result: null }, B: { n: 'B', pc: P[mode].start, done: false, result: null } };\n    log.innerHTML = ''; draw();\n  }\n  function step(n) {\n    const t = TH[n]; if (t.done) return;\n    const r = P[mode].step[t.pc](t);\n    LLD.log(log, `Thread ${n}: ${r.msg}`, r.cls || (r.blocked ? 'warn' : ''));\n    if (r.done) t.done = true; else if (!r.blocked) t.pc = r.goto;\n    draw();\n  }\n  function draw() {\n    const lines = P[mode].lines;\n    $('#rcCode').innerHTML = lines.map((l, k) => {\n      const a = !TH.A.done && TH.A.pc === k, b = !TH.B.done && TH.B.pc === k;\n      return `<span class=\"ln ${a && b ? 'ab' : a ? 'a' : b ? 'b' : ''}\">${l.replace(/\u003C/g, '&lt;') || ' '}\u003C/span>`;\n    }).join('');\n    const ts = (t) => t.done ? `returned <b>@${t.result}\u003C/b>` : 'running';\n    $('#rcThreads').innerHTML = `<b class=\"a\">Thread A\u003C/b>: ${ts(TH.A)}<br><b class=\"b\">Thread B\u003C/b>: ${ts(TH.B)}`;\n    $('#rcShared').innerHTML = `instance = ${S.instance ? '@' + S.instance : 'null'}${mode === 'sync' || mode.startsWith('dcl') ? `<br>lock held by: ${S.lock || 'nobody'}` : ''}`;\n    const ids = Object.keys(S.objs);\n    $('#rcHeap').innerHTML = ids.length ? ids.map((id) => `<div class=\"rc-obj${S.objs[id].built ? '' : ' half'}${ids.length > 1 ? ' dup' : ''}\">@${id} ConfigRegistry<br>values = ${S.objs[id].built ? '{db.url=…, …}' : 'null (constructor not run)'}\u003C/div>`).join('') : '<div class=\"small muted\">No instances yet.\u003C/div>';\n    const v = $('#rcVerdict');\n    if (!TH.A.done || !TH.B.done) { v.className = 'rc-verdict idle'; v.textContent = 'Step the two threads in any order, or play the interleaving that breaks each version.'; return; }\n    const two = ids.length > 1, diff = TH.A.result !== TH.B.result, half = [TH.A.result, TH.B.result].some((r) => r && !S.objs[r].built) || (mode === 'dcl' && log.textContent.includes('HALF'));\n    v.className = 'rc-verdict ' + (two || diff || half ? 'bad' : 'ok');\n    v.innerHTML = half ? '<b>Broken:\u003C/b> one thread used an object whose constructor hadn\\'t run. It will fail with a NullPointerException somewhere far away.'\n      : two ? `<b>Broken:\u003C/b> ${ids.length} instances were created${diff ? ', and the threads hold different ones' : ''}.`\n      : '<b>Correct:\u003C/b> exactly one instance, fully built, returned to both threads.';\n  }\n  $('#rcA').onclick = () => step('A');\n  $('#rcB').onclick = () => step('B');\n  $('#rcReset').onclick = reset;\n  $('#rcWorst').onclick = async () => {\n    reset();\n    for (const c of P[mode].worst.replace(/ /g, '')) { if (TH.A.done && TH.B.done) break; step(TH[c].done ? (c === 'A' ? 'B' : 'A') : c); await sleep(380); }\n    while (!TH.A.done || !TH.B.done) { step(!TH.A.done ? 'A' : 'B'); await sleep(380); }\n  };\n  $$('#rcMode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; reset(); }));\n  reset();\n})();\n"]},"10-factories.html":{"title":"Factory Method &amp; Abstract Factory","chapter":"10","styles":"\n  .dm-url { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }\n  .dm-url input { flex:1; min-width:260px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:13px; }\n  .dm-presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }\n  .dm-drivers { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }\n  @media (max-width:760px) { .dm-drivers { grid-template-columns:1fr; } }\n  .dm-d { display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); font-size:13px; transition:all .2s; }\n  .dm-d input { accent-color:var(--accent); margin-top:3px; }\n  .dm-d code { font-size:12px; }\n  .dm-d.off { opacity:.45; }\n  .dm-d.dm-ask { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }\n  .dm-d.dm-no { border-color:var(--border-strong); }\n  .dm-d.dm-yes { border-color:var(--green); background:var(--green-soft); }\n  .dm-res { margin-top:12px; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .dm-res.ok { background:var(--green-soft); } .dm-res.bad { background:var(--red-soft); } .dm-res.idle { background:var(--surface-2); border:1px solid var(--border); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 10\u003C/span><span class=\"pill\">Design Patterns\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>Factory Method &amp; Abstract <span class=\"grad\">Factory\u003C/span>\u003C/h1>\n    <p class=\"lead\">Every <code>new ConcreteClass()\u003C/code> is a decision about which class to use, made at that exact spot in the code. Factories move that decision somewhere better: to a named method that can validate and cache, to a subclass, to a family of related objects that must match, or to a registry looked up at run time. This chapter covers all four, using code you already call every day: <code>List.of\u003C/code>, <code>Duration.ofSeconds\u003C/code> and JDBC's <code>DriverManager\u003C/code>.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Use static factory methods, and say what they can do that constructors can't\u003C/li>\n      <li>Recognise the GoF Factory Method, and its modern replacement: an injected factory\u003C/li>\n      <li>Design an Abstract Factory that keeps a family of objects consistent\u003C/li>\n      <li>Replace a <code>switch\u003C/code> over types with a registry of factories\u003C/li>\n      <li>Explain how JDBC picks a driver from a connection URL\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Interfaces and functional interfaces\u003C/b> like <code>Supplier\u003C/code> and <code>Function\u003C/code>. See <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n        <li><b>Open/closed, and the switch that grows.\u003C/b> See <a href=\"03-solid-srp-ocp.html\">Chapter 3\u003C/a>.\u003C/li>\n        <li><b>The composition root.\u003C/b> See <a href=\"08-dependency-injection.html\">Chapter 8: Dependency Injection\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Static factory methods\u003C/h2>\n  <p>The smallest factory is a static method that returns an instance. You use dozens: <code>List.of(…)\u003C/code>, <code>Optional.empty()\u003C/code>, <code>Duration.ofSeconds(30)\u003C/code>, <code>Instant.parse(…)\u003C/code>, <code>Integer.valueOf(42)\u003C/code>. <i>Effective Java\u003C/i>'s very first item recommends considering them instead of constructors, for four reasons a constructor can't match:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>A static factory can…\u003C/th><th>Example\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Have a <b>name\u003C/b> that says what it builds\u003C/td><td><code>Duration.ofSeconds(30)\u003C/code> vs <code>Duration.ofMillis(30)\u003C/code>: two constructors with one <code>long\u003C/code> each couldn't coexist\u003C/td>\u003C/tr>\n        <tr><td><b>Return an existing instance\u003C/b> instead of a new one\u003C/td><td><code>Integer.valueOf(42)\u003C/code> returns a cached object for values −128 to 127; <code>Collections.emptyList()\u003C/code> always returns the same list\u003C/td>\u003C/tr>\n        <tr><td><b>Return any subtype\u003C/b>, hiding the real class\u003C/td><td><code>List.of(…)\u003C/code> returns internal immutable list classes you never name\u003C/td>\u003C/tr>\n        <tr><td><b>Parse and validate\u003C/b> before an object exists\u003C/td><td><code>HostAndPort.parse(\"db1:5432\")\u003C/code> can throw a clear error or return a normalised value\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n<pre class=\"code\"><span class=\"k\">public record\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(<span class=\"t\">String\u003C/span> host, <span class=\"k\">int\u003C/span> port) {\n\t<span class=\"k\">public static\u003C/span> <span class=\"t\">HostAndPort\u003C/span> <span class=\"f\">parse\u003C/span>(<span class=\"t\">String\u003C/span> text) {                    <span class=\"c\">// named, validating\u003C/span>\n\t\t<span class=\"k\">int\u003C/span> colon = text.<span class=\"f\">lastIndexOf\u003C/span>(<span class=\"s\">':'\u003C/span>);\n\t\t<span class=\"k\">if\u003C/span> (colon &lt; <span class=\"m\">1\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"expected host:port, got \"\u003C/span> + text);\n\t\t<span class=\"k\">return new\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(text.<span class=\"f\">substring\u003C/span>(<span class=\"m\">0\u003C/span>, colon), <span class=\"t\">Integer\u003C/span>.<span class=\"f\">parseInt\u003C/span>(text.<span class=\"f\">substring\u003C/span>(colon + <span class=\"m\">1\u003C/span>)));\n\t}\n\t<span class=\"k\">public static\u003C/span> <span class=\"t\">HostAndPort\u003C/span> <span class=\"f\">localhost\u003C/span>(<span class=\"k\">int\u003C/span> port) { <span class=\"k\">return new\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(<span class=\"s\">\"localhost\"\u003C/span>, port); }\n}\u003C/pre>\n  <p>The naming conventions are worth following, because readers recognise them: <code>of\u003C/code> and <code>valueOf\u003C/code> (convert the arguments), <code>from\u003C/code> (convert another type), <code>parse\u003C/code> (from text), <code>create\u003C/code> or <code>newX\u003C/code> (always a new instance), <code>getX\u003C/code> or <code>instance\u003C/code> (may return a shared one).\u003C/p>\n\n  <h2>Factory Method: let a subclass choose\u003C/h2>\n  <p>The Gang of Four <b>Factory Method\u003C/b> is narrower: a class runs an algorithm that needs an object, but leaves <i>which\u003C/i> object to a method that subclasses override. The classic shape:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public abstract class\u003C/span> <span class=\"t\">ExportJob\u003C/span> {\n\t<span class=\"k\">public final void\u003C/span> <span class=\"f\">run\u003C/span>(<span class=\"t\">Report\u003C/span> report) {                       <span class=\"c\">// the fixed algorithm\u003C/span>\n\t\t<span class=\"t\">ReportFormatter\u003C/span> f = <span class=\"f\">createFormatter\u003C/span>();                   <span class=\"c\">// the factory method\u003C/span>\n\t\t<span class=\"f\">upload\u003C/span>(report.<span class=\"f\">name\u003C/span>() + f.<span class=\"f\">extension\u003C/span>(), f.<span class=\"f\">format\u003C/span>(report));\n\t}\n\t<span class=\"k\">protected abstract\u003C/span> <span class=\"t\">ReportFormatter\u003C/span> <span class=\"f\">createFormatter\u003C/span>();\n}\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">CsvExportJob\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">ExportJob\u003C/span> {\n\t<span class=\"k\">@Override protected\u003C/span> <span class=\"t\">ReportFormatter\u003C/span> <span class=\"f\">createFormatter\u003C/span>() { <span class=\"k\">return new\u003C/span> <span class=\"t\">CsvFormatter\u003C/span>(); }\n}\u003C/pre>\n  <p>It works, and you'll see it in frameworks and older codebases. But it uses inheritance to make a choice that composition makes more flexibly (<a href=\"p5-composition.html\">P5\u003C/a>): one subclass per formatter, fixed at compile time. The modern version passes the choice in, either the formatter itself or a factory for it:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">ExportJob\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">ReportFormatter\u003C/span>&gt; formatters;              <span class=\"c\">// \"a factory\", as a functional interface\u003C/span>\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">ExportJob\u003C/span>(<span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">ReportFormatter\u003C/span>&gt; formatters) { <span class=\"k\">this\u003C/span>.formatters = formatters; }\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">run\u003C/span>(<span class=\"t\">Report\u003C/span> report) { <span class=\"t\">ReportFormatter\u003C/span> f = formatters.<span class=\"f\">get\u003C/span>(); <span class=\"c\">/* … */\u003C/span> }\n}\n<span class=\"k\">new\u003C/span> <span class=\"t\">ExportJob\u003C/span>(<span class=\"t\">CsvFormatter\u003C/span>::<span class=\"k\">new\u003C/span>);                                <span class=\"c\">// chosen at wiring time\u003C/span>\u003C/pre>\n  <p>Pass a <code>Supplier\u003C/code> (a factory) rather than an instance when the job needs a <b>fresh\u003C/b> object each time: a formatter with per-run state, a parser that isn't thread-safe, one connection per task.\u003C/p>\n\n  <h2>Abstract Factory: families that must match\u003C/h2>\n  <p>Sometimes objects come in <b>families\u003C/b> that only work together. A service that runs on AWS uses S3 for blobs, SQS for queues and Secrets Manager for credentials. On Google Cloud, it's Cloud Storage, Pub/Sub and Secret Manager. Locally, in tests, it's the filesystem, an in-memory queue and environment variables. Mixing them, say S3 with Pub/Sub, is at best a configuration bug and at worst a data leak across clouds. An <b>Abstract Factory\u003C/b> is an interface with one creation method per product, and one implementation per family:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">One factory per platform, one method per product\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">Platform\u003C/span> {                                    <span class=\"c\">// the abstract factory\u003C/span>\n\t<span class=\"t\">BlobStore\u003C/span> <span class=\"f\">blobStore\u003C/span>(<span class=\"t\">String\u003C/span> bucket);\n\t<span class=\"t\">MessageQueue\u003C/span> <span class=\"f\">queue\u003C/span>(<span class=\"t\">String\u003C/span> name);\n\t<span class=\"t\">SecretStore\u003C/span> <span class=\"f\">secrets\u003C/span>();\n}\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">AwsPlatform\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Platform\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Region\u003C/span> region;\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">AwsPlatform\u003C/span>(<span class=\"t\">Region\u003C/span> region) { <span class=\"k\">this\u003C/span>.region = region; }\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">BlobStore\u003C/span> <span class=\"f\">blobStore\u003C/span>(<span class=\"t\">String\u003C/span> b) { <span class=\"k\">return new\u003C/span> <span class=\"t\">S3BlobStore\u003C/span>(region, b); }\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">MessageQueue\u003C/span> <span class=\"f\">queue\u003C/span>(<span class=\"t\">String\u003C/span> n) { <span class=\"k\">return new\u003C/span> <span class=\"t\">SqsQueue\u003C/span>(region, n); }\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">SecretStore\u003C/span> <span class=\"f\">secrets\u003C/span>() { <span class=\"k\">return new\u003C/span> <span class=\"t\">AwsSecretsManager\u003C/span>(region); }\n}\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">LocalPlatform\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Platform\u003C/span> { <span class=\"c\">/* LocalDiskStore, InMemoryQueue, EnvSecrets */\u003C/span> }\n\n<span class=\"c\">// Composition root: one decision picks the whole family\u003C/span>\n<span class=\"t\">Platform\u003C/span> platform = <span class=\"k\">switch\u003C/span> (config.<span class=\"f\">cloud\u003C/span>()) {\n\t<span class=\"k\">case\u003C/span> AWS   -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">AwsPlatform\u003C/span>(config.<span class=\"f\">region\u003C/span>());\n\t<span class=\"k\">case\u003C/span> GCP   -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">GcpPlatform\u003C/span>(config.<span class=\"f\">project\u003C/span>());\n\t<span class=\"k\">case\u003C/span> LOCAL -&gt; <span class=\"k\">new\u003C/span> <span class=\"t\">LocalPlatform\u003C/span>(<span class=\"t\">Path\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"s\">\"/tmp/app\"\u003C/span>));\n};\n<span class=\"t\">UploadService\u003C/span> uploads = <span class=\"k\">new\u003C/span> <span class=\"t\">UploadService\u003C/span>(platform.<span class=\"f\">blobStore\u003C/span>(<span class=\"s\">\"uploads\"\u003C/span>), platform.<span class=\"f\">queue\u003C/span>(<span class=\"s\">\"thumbnails\"\u003C/span>));\u003C/pre>\n    <div class=\"cb-foot\"><b>What it guarantees:\u003C/b> products always come from one family, because there's no way to get an S3 store and a Pub/Sub queue from the same <code>Platform\u003C/code>. Adding a cloud is one new class implementing every method. The switch over a closed enum in the composition root is fine (<a href=\"03-solid-srp-ocp.html\">Chapter 3\u003C/a>): it's the one place that knows the concrete families.\u003C/div>\n  \u003C/div>\n  <p>The trade-off: adding a new <i>product\u003C/i> (say, a <code>Cache\u003C/code>) means adding a method to <code>Platform\u003C/code> and to every implementation. Abstract Factory makes new families cheap and new products expensive. Use it when the family set grows more often than the product set.\u003C/p>\n\n  <h2>Registries instead of switches\u003C/h2>\n  <p>When implementations are chosen by a key at run time (a payment method, a file format, a notification channel) and new ones keep arriving, a <b>registry\u003C/b> of factories keeps the choosing code closed to change. Each implementation is registered once, usually in the composition root, and lookups fail fast with a useful message:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">GatewayRegistry\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">PaymentGateway\u003C/span>&gt;&gt; factories = <span class=\"k\">new\u003C/span> <span class=\"t\">HashMap\u003C/span>&lt;&gt;();\n\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">register\u003C/span>(<span class=\"t\">String\u003C/span> method, <span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">PaymentGateway\u003C/span>&gt; factory) {\n\t\t<span class=\"k\">if\u003C/span> (factories.<span class=\"f\">putIfAbsent\u003C/span>(method, factory) != <span class=\"k\">null\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"duplicate: \"\u003C/span> + method);\n\t}\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">PaymentGateway\u003C/span> <span class=\"f\">create\u003C/span>(<span class=\"t\">String\u003C/span> method) {\n\t\t<span class=\"t\">Supplier\u003C/span>&lt;<span class=\"t\">PaymentGateway\u003C/span>&gt; f = factories.<span class=\"f\">get\u003C/span>(method);\n\t\t<span class=\"k\">if\u003C/span> (f == <span class=\"k\">null\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"unknown payment method '\"\u003C/span> + method + <span class=\"s\">\"'; known: \"\u003C/span> + <span class=\"k\">new\u003C/span> <span class=\"t\">TreeSet\u003C/span>&lt;&gt;(factories.<span class=\"f\">keySet\u003C/span>()));\n\t\t<span class=\"k\">return\u003C/span> f.<span class=\"f\">get\u003C/span>();\n\t}\n}\u003C/pre>\n  <p>JDBC takes the same idea one step further: drivers register <i>themselves\u003C/i>. Each driver JAR lists its driver class in a <code>META-INF/services/java.sql.Driver\u003C/code> file, and <code>java.util.ServiceLoader\u003C/code> finds and registers every one on the classpath. <code>DriverManager.getConnection(url)\u003C/code> then asks each registered driver whether it accepts the URL, and the first that does becomes the factory for your <code>Connection\u003C/code>. The <code>Connection\u003C/code> is itself a factory too: <code>prepareStatement\u003C/code> returns that driver's own <code>PreparedStatement\u003C/code> implementation, so the whole family always matches.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">DriverManager: which driver builds this connection?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"dm-url\"><input id=\"dmUrl\" value=\"jdbc:postgresql://db1.internal:5432/shop\" spellcheck=\"false\" aria-label=\"JDBC URL\"><button class=\"btn sm primary\" id=\"dmGo\">getConnection(url)\u003C/button>\u003C/div>\n      <div class=\"dm-presets\" id=\"dmPre\">\u003C/div>\n      <div class=\"small muted\" style=\"margin-top:12px\">Driver JARs on the classpath (registered through ServiceLoader):\u003C/div>\n      <div class=\"dm-drivers\" id=\"dmDrivers\">\u003C/div>\n      <div class=\"dm-res idle\" id=\"dmRes\">Pick a URL and call <code>getConnection\u003C/code>.\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Untick a JAR to simulate a missing dependency, then connect: you'll get the error that has puzzled every Java developer once. Your code never names a driver class; adding a database is a dependency change, not a code change.\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"OrderRepository|DriverManager|H2 driver|PostgreSQL driver|PgConnection\">\n    <ol>\n      <li data-m=\"0>1\">getConnection(\"jdbc:postgresql://db1/shop\")\u003C/li>\n      <li data-m=\"1>2\">acceptsURL(url)?\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">false\u003C/li>\n      <li data-m=\"1>3\">acceptsURL(url)?\u003C/li>\n      <li data-m=\"3>1\" data-k=\"reply\">true\u003C/li>\n      <li data-m=\"1>3\">connect(url, props)\u003C/li>\n      <li data-m=\"3>4\">new PgConnection(socket, …)\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">a Connection (really a PgConnection)\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A registry of factories, found at run time.\u003C/b> The repository asked for a <code>Connection\u003C/code> and got the PostgreSQL implementation, without its code ever mentioning PostgreSQL.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Test doubles for free with an Abstract Factory\u003C/div><p>A team building a video pipeline on AWS wanted integration tests that didn't touch AWS. Because every S3, SQS and Secrets Manager client was created through one <code>Platform\u003C/code> interface, the whole test setup was <code>new LocalPlatform(tempDir)\u003C/code>: files instead of S3, an in-memory queue instead of SQS, a map instead of Secrets Manager. The same test suite also ran nightly against <code>new AwsPlatform(testRegion)\u003C/code> to catch real integration issues. Without the factory, each client would have been constructed wherever it was used, and swapping them for tests would have meant editing dozens of classes.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>A switch over types copied to every place that creates things.\u003C/b> Centralise creation in one factory or registry.\u003C/li>\n      <li><b>Subclassing just to choose a collaborator\u003C/b> (Factory Method), when a <code>Supplier\u003C/code> or instance could be passed in.\u003C/li>\n      <li><b>Letting callers assemble families by hand\u003C/b>, so an S3 store can end up next to a Pub/Sub queue. One factory per family.\u003C/li>\n      <li><b>Factories that return <code>null\u003C/code> for unknown keys.\u003C/b> Throw, and list the known keys.\u003C/li>\n      <li><b>Factories that also configure, cache, retry and log.\u003C/b> A factory creates; other concerns belong elsewhere.\u003C/li>\n      <li><b>Abstract Factory when products change often.\u003C/b> Every new product touches every family; it suits a stable product set.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What's the difference between a static factory method, Factory Method and Abstract Factory?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>A static factory method is just a named static method that returns an instance, like <code>Duration.ofSeconds\u003C/code>; it can validate, cache, or return a hidden subtype. Factory Method is the GoF pattern where a base class's algorithm calls an overridable <code>create\u003C/code> method, so subclasses choose the object; today I'd usually pass a <code>Supplier\u003C/code> in instead. Abstract Factory is an interface with one creation method per product, implemented once per family, so related objects like an AWS blob store, queue and secret store are always created together and never mixed with GCP ones.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Your checkout supports cards and UPI, and product says wallets, bank transfers and BNPL are coming. How do you create the right gateway for a payment?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Each method gets a <code>PaymentGateway\u003C/code> implementation, and a <code>GatewayRegistry\u003C/code> maps a payment-method key to a factory. Implementations register in the composition root, so checkout calls <code>registry.create(order.paymentMethod())\u003C/code> and never changes when a method is added. Unknown keys fail fast with the list of known ones, and duplicate registration throws at startup. If gateways carry per-payment state I'd register <code>Supplier\u003C/code>s; if they're stateless and thread-safe, instances.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Static factory methods can be named, return cached instances or hidden subtypes, and validate before creating.\u003C/li>\n      <li>Factory Method lets a subclass choose the object an algorithm uses; passing a <code>Supplier\u003C/code> is the composition-based alternative.\u003C/li>\n      <li>Abstract Factory creates a whole family through one interface, so products are never mixed across families.\u003C/li>\n      <li>Abstract Factory makes new families cheap and new products expensive.\u003C/li>\n      <li>A registry of factories replaces a growing switch; fail fast on unknown keys and duplicates.\u003C/li>\n      <li>JDBC is all three: drivers self-register via ServiceLoader, DriverManager picks one by URL, and a Connection creates matching Statements.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Which of these can a static factory method do that a constructor can't?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Take parameters\u003C/button>\n        <button class=\"opt\">Throw an exception for invalid input\u003C/button>\n        <button class=\"opt\">Return a previously created, shared instance instead of a new one\u003C/button>\n        <button class=\"opt\">Initialise final fields\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A constructor always creates a new object. A static factory like <code>Integer.valueOf\u003C/code> or <code>Collections.emptyList()\u003C/code> can return a cached one. Both can take parameters and throw.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">What problem does Abstract Factory solve?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Creating families of related objects that must be used together, without mixing families\u003C/button>\n        <button class=\"opt\">Making sure only one instance of a class exists\u003C/button>\n        <button class=\"opt\">Building an object with many optional parameters\u003C/button>\n        <button class=\"opt\">Choosing one algorithm at run time\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">One factory per family (AWS, GCP, local) creates every product in that family, so an S3 store never ends up paired with a Pub/Sub queue. The other options are Singleton, Builder and Strategy.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">With a <code>Platform\u003C/code> abstract factory, what does adding Azure support involve?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Editing every service that uses a blob store\u003C/button>\n        <button class=\"opt\">Adding an Azure method to the Platform interface\u003C/button>\n        <button class=\"opt\">Nothing: it works automatically\u003C/button>\n        <button class=\"opt\">One new <code>AzurePlatform\u003C/code> class implementing every creation method, plus one case where the platform is chosen\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">New families are the cheap direction: one new implementation, selected in the composition root. Adding a new <i>product\u003C/i> would be the expensive direction.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A registry is asked to create a gateway for an unknown key. What should it do?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Return null\u003C/button>\n        <button class=\"opt\">Throw with a message that names the key and lists the known keys\u003C/button>\n        <button class=\"opt\">Return a default card gateway\u003C/button>\n        <button class=\"opt\">Register a new empty gateway\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Failing fast with context turns a typo or missing registration into an obvious error. Null or a silent default pushes the failure somewhere harder to debug, or charges the wrong way.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>DriverManager.getConnection(\"jdbc:mysql://…\")\u003C/code> throws “No suitable driver found”. What's the most likely cause?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The database server is down\u003C/button>\n        <button class=\"opt\">The password is wrong\u003C/button>\n        <button class=\"opt\">No registered driver accepted the URL: usually the MySQL driver JAR isn't on the classpath, or the URL prefix has a typo\u003C/button>\n        <button class=\"opt\">JDBC doesn't support MySQL\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">DriverManager asks every registered driver whether it accepts the URL before any network connection. If none does, it fails immediately. A down server or bad password would fail later, inside the chosen driver's <code>connect\u003C/code>.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$, sleep } = LLD;\n  const D = [\n    ['h2', 'H2 (org.h2.Driver)', 'jdbc:h2:', 'JdbcConnection', true],\n    ['pg', 'PostgreSQL (org.postgresql.Driver)', 'jdbc:postgresql:', 'PgConnection', true],\n    ['mysql', 'MySQL (com.mysql.cj.jdbc.Driver)', 'jdbc:mysql:', 'ConnectionImpl', false],\n    ['oracle', 'Oracle (oracle.jdbc.OracleDriver)', 'jdbc:oracle:', 'T4CConnection', false],\n  ];\n  const on = new Set(D.filter((d) => d[4]).map((d) => d[0]));\n  const PRE = ['jdbc:postgresql://db1.internal:5432/shop', 'jdbc:h2:mem:testdb', 'jdbc:mysql://reports.internal:3306/sales', 'jdbc:postgres://db1.internal/shop', 'jdbc:oracle:thin:@ledger.internal:1521/ORCL'];\n  $('#dmPre').innerHTML = PRE.map((u) => `<button class=\"btn sm\">${u.replace(/\u003C/g, '&lt;')}\u003C/button>`).join('');\n  $$('#dmPre button').forEach((b) => b.onclick = () => { $('#dmUrl').value = b.textContent; reset(); });\n  const state = {};\n  function drawDrivers() {\n    $('#dmDrivers').innerHTML = D.map(([k, n, p]) => `<label class=\"dm-d${on.has(k) ? '' : ' off'} ${state[k] || ''}\" data-k=\"${k}\"><input type=\"checkbox\" ${on.has(k) ? 'checked' : ''}><span><b>${n}\u003C/b><br><code>acceptsURL: starts with ${p}\u003C/code>\u003C/span>\u003C/label>`).join('');\n    $$('#dmDrivers input').forEach((cb) => cb.addEventListener('change', () => { const k = cb.closest('.dm-d').dataset.k; cb.checked ? on.add(k) : on.delete(k); reset(); }));\n  }\n  function reset() { Object.keys(state).forEach((k) => delete state[k]); const r = $('#dmRes'); r.className = 'dm-res idle'; r.innerHTML = 'Pick a URL and call <code>getConnection\u003C/code>.'; drawDrivers(); }\n  let busy = false;\n  $('#dmGo').onclick = async () => {\n    if (busy) return; busy = true; reset();\n    const url = $('#dmUrl').value.trim(), r = $('#dmRes');\n    let hit = null;\n    for (const [k, , p, conn] of D) {\n      if (!on.has(k)) continue;\n      state[k] = 'dm-ask'; drawDrivers(); await sleep(420);\n      if (url.startsWith(p)) { state[k] = 'dm-yes'; hit = [k, conn]; drawDrivers(); break; }\n      state[k] = 'dm-no'; drawDrivers();\n    }\n    if (hit) { r.className = 'dm-res ok'; r.innerHTML = `✓ <b>${D.find((d) => d[0] === hit[0])[1]}\u003C/b> accepted the URL and returned a <code>${hit[1]}\u003C/code>, typed as <code>java.sql.Connection\u003C/code>. Its <code>prepareStatement\u003C/code> will return the same driver's statements.`; }\n    else { r.className = 'dm-res bad'; r.innerHTML = `✗ <code>java.sql.SQLException: No suitable driver found for ${url.replace(/\u003C/g, '&lt;')}\u003C/code><br>No registered driver accepted this URL. ${url.startsWith('jdbc:postgres:') ? 'Look closely: the prefix is <code>jdbc:postgresql:\u003C/code>, not <code>jdbc:postgres:\u003C/code>.' : 'Is the driver JAR on the classpath?'}`; }\n    busy = false;\n  };\n  drawDrivers();\n})();\n"]},"11-builder-prototype.html":{"title":"Builder &amp; Prototype","chapter":"11","styles":"\n  .bp-grid { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:14px; margin-top:12px; }\n  @media (max-width:900px) { .bp-grid { grid-template-columns:1fr; } }\n  .bp-f { display:grid; gap:10px; }\n  .bp-f label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }\n  .bp-f input, .bp-f select, .bp-f textarea { width:100%; margin-top:5px; padding:7px 9px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:12.5px; box-sizing:border-box; }\n  .bp-f textarea { height:54px; resize:vertical; }\n  .bp-row { display:flex; gap:6px; }\n  .bp-hdrs { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }\n  .bp-h { font-family:var(--mono); font-size:11.5px; padding:3px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); cursor:pointer; }\n  .bp-code { margin:0; font-size:12.5px; }\n  .bp-res { margin-top:10px; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .bp-res.ok { background:var(--green-soft); } .bp-res.bad { background:var(--red-soft); }\n  .bp-res code { font-size:12px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 11\u003C/span><span class=\"pill\">Design Patterns\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Builder &amp; <span class=\"grad\">Prototype\u003C/span>\u003C/h1>\n    <p class=\"lead\">Some objects need a dozen settings, most of them optional: an HTTP request, a database connection pool, a retry policy, a search query. Constructors handle that badly. <b>Builder\u003C/b> assembles such an object step by step, with named methods, and checks the whole thing once before it exists. <b>Prototype\u003C/b> answers the neighbouring question: once you have a well-configured object, how do you get a slightly different copy without repeating all twelve settings?\u003C/p>\n    <ul class=\"objectives\">\n      <li>Recognise the telescoping-constructor problem and why setters don't fix it\u003C/li>\n      <li>Write a Builder that produces an immutable object and validates in <code>build()\u003C/code>\u003C/li>\n      <li>Design a fluent API that reads like the thing it configures\u003C/li>\n      <li>Copy configured objects with copy constructors, <code>with…\u003C/code> methods or <code>toBuilder()\u003C/code>\u003C/li>\n      <li>Explain why <code>clone()\u003C/code> and <code>Cloneable\u003C/code> are best avoided\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Immutability and records.\u003C/b> See <a href=\"p6-value-objects.html\">P6: Value Objects, Enums &amp; Immutability\u003C/a>.\u003C/li>\n        <li><b>Hard-to-misuse signatures,\u003C/b> especially same-type parameters. See <a href=\"07-class-contracts.html\">Chapter 7: Class APIs &amp; Contracts\u003C/a>.\u003C/li>\n        <li><b>Static factory methods.\u003C/b> See <a href=\"10-factories.html\">Chapter 10\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Too many constructor parameters\u003C/h2>\n  <p>A connection-pool configuration has a required JDBC URL and several optional settings: maximum size, minimum idle connections, connection timeout, idle timeout, maximum lifetime, a validation query. The first attempt is usually <b>telescoping constructors\u003C/b>, each one adding a parameter and passing defaults to the next:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public\u003C/span> <span class=\"f\">PoolConfig\u003C/span>(<span class=\"t\">String\u003C/span> url) { <span class=\"k\">this\u003C/span>(url, <span class=\"m\">10\u003C/span>); }\n<span class=\"k\">public\u003C/span> <span class=\"f\">PoolConfig\u003C/span>(<span class=\"t\">String\u003C/span> url, <span class=\"k\">int\u003C/span> maxSize) { <span class=\"k\">this\u003C/span>(url, maxSize, <span class=\"m\">2\u003C/span>); }\n<span class=\"k\">public\u003C/span> <span class=\"f\">PoolConfig\u003C/span>(<span class=\"t\">String\u003C/span> url, <span class=\"k\">int\u003C/span> maxSize, <span class=\"k\">int\u003C/span> minIdle) { <span class=\"k\">this\u003C/span>(url, maxSize, minIdle, <span class=\"m\">30_000\u003C/span>, <span class=\"m\">600_000\u003C/span>, <span class=\"m\">1_800_000\u003C/span>); }\n<span class=\"k\">public\u003C/span> <span class=\"f\">PoolConfig\u003C/span>(<span class=\"t\">String\u003C/span> url, <span class=\"k\">int\u003C/span> maxSize, <span class=\"k\">int\u003C/span> minIdle, <span class=\"k\">long\u003C/span> connTimeout, <span class=\"k\">long\u003C/span> idleTimeout, <span class=\"k\">long\u003C/span> maxLifetime) { … }\n\n<span class=\"k\">new\u003C/span> <span class=\"t\">PoolConfig\u003C/span>(url, <span class=\"m\">20\u003C/span>, <span class=\"m\">5\u003C/span>, <span class=\"m\">600_000\u003C/span>, <span class=\"m\">30_000\u003C/span>, <span class=\"m\">1_800_000\u003C/span>);   <span class=\"c\">// which long is which? (two are swapped)\u003C/span>\u003C/pre>\n  <p>Three long values in a row is exactly the same-type-parameter trap from <a href=\"07-class-contracts.html\">Chapter 7\u003C/a>: the call above swaps the connection and idle timeouts, and it compiles. Wanting just one optional setting means passing every setting before it. The other common attempt, a no-argument constructor followed by setters, reads better but gives up two things you care about: the object can't be immutable, and it exists in an unfinished, possibly invalid state between the constructor and the last setter call.\u003C/p>\n\n  <h2>The Builder\u003C/h2>\n  <p>A <b>Builder\u003C/b> is a separate, mutable helper that collects settings through named methods and then creates the real object in one step, <code>build()\u003C/code>, where all the rules are checked together:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">PoolConfig.java: an immutable product and its builder\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">PoolConfig\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> jdbcUrl;\n\t<span class=\"k\">private final int\u003C/span> maxSize, minIdle;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Duration\u003C/span> connectionTimeout, idleTimeout, maxLifetime;\n\n\t<span class=\"k\">private\u003C/span> <span class=\"f\">PoolConfig\u003C/span>(<span class=\"t\">Builder\u003C/span> b) {                           <span class=\"c\">// only the builder can call this\u003C/span>\n\t\t<span class=\"k\">this\u003C/span>.jdbcUrl = b.jdbcUrl; <span class=\"k\">this\u003C/span>.maxSize = b.maxSize; <span class=\"k\">this\u003C/span>.minIdle = b.minIdle;\n\t\t<span class=\"k\">this\u003C/span>.connectionTimeout = b.connectionTimeout; <span class=\"k\">this\u003C/span>.idleTimeout = b.idleTimeout; <span class=\"k\">this\u003C/span>.maxLifetime = b.maxLifetime;\n\t}\n\t<span class=\"k\">public static\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">forUrl\u003C/span>(<span class=\"t\">String\u003C/span> jdbcUrl) { <span class=\"k\">return new\u003C/span> <span class=\"t\">Builder\u003C/span>(jdbcUrl); }   <span class=\"c\">// required value up front\u003C/span>\n\n\t<span class=\"k\">public static final class\u003C/span> <span class=\"t\">Builder\u003C/span> {\n\t\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> jdbcUrl;\n\t\t<span class=\"k\">private int\u003C/span> maxSize = <span class=\"m\">10\u003C/span>, minIdle = <span class=\"m\">2\u003C/span>;                  <span class=\"c\">// defaults in one place\u003C/span>\n\t\t<span class=\"k\">private\u003C/span> <span class=\"t\">Duration\u003C/span> connectionTimeout = <span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofSeconds\u003C/span>(<span class=\"m\">30\u003C/span>), idleTimeout = <span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofMinutes\u003C/span>(<span class=\"m\">10\u003C/span>), maxLifetime = <span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofMinutes\u003C/span>(<span class=\"m\">30\u003C/span>);\n\n\t\t<span class=\"k\">private\u003C/span> <span class=\"f\">Builder\u003C/span>(<span class=\"t\">String\u003C/span> jdbcUrl) { <span class=\"k\">this\u003C/span>.jdbcUrl = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(jdbcUrl); }\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">maxSize\u003C/span>(<span class=\"k\">int\u003C/span> n) { <span class=\"k\">this\u003C/span>.maxSize = n; <span class=\"k\">return this\u003C/span>; }     <span class=\"c\">// return this: chainable\u003C/span>\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">minIdle\u003C/span>(<span class=\"k\">int\u003C/span> n) { <span class=\"k\">this\u003C/span>.minIdle = n; <span class=\"k\">return this\u003C/span>; }\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">connectionTimeout\u003C/span>(<span class=\"t\">Duration\u003C/span> d) { <span class=\"k\">this\u003C/span>.connectionTimeout = d; <span class=\"k\">return this\u003C/span>; }\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">idleTimeout\u003C/span>(<span class=\"t\">Duration\u003C/span> d) { <span class=\"k\">this\u003C/span>.idleTimeout = d; <span class=\"k\">return this\u003C/span>; }\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">Builder\u003C/span> <span class=\"f\">maxLifetime\u003C/span>(<span class=\"t\">Duration\u003C/span> d) { <span class=\"k\">this\u003C/span>.maxLifetime = d; <span class=\"k\">return this\u003C/span>; }\n\n\t\t<span class=\"k\">public\u003C/span> <span class=\"t\">PoolConfig\u003C/span> <span class=\"f\">build\u003C/span>() {                                 <span class=\"c\">// every cross-field rule, checked once\u003C/span>\n\t\t\t<span class=\"k\">if\u003C/span> (maxSize &lt; <span class=\"m\">1\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"maxSize must be ≥ 1\"\u003C/span>);\n\t\t\t<span class=\"k\">if\u003C/span> (minIdle &lt; <span class=\"m\">0\u003C/span> || minIdle &gt; maxSize) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"minIdle must be 0..\"\u003C/span> + maxSize);\n\t\t\t<span class=\"k\">if\u003C/span> (idleTimeout.<span class=\"f\">compareTo\u003C/span>(maxLifetime) &gt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"idleTimeout must be shorter than maxLifetime\"\u003C/span>);\n\t\t\t<span class=\"k\">return new\u003C/span> <span class=\"t\">PoolConfig\u003C/span>(<span class=\"k\">this\u003C/span>);\n\t\t}\n\t}\n}\n\n<span class=\"t\">PoolConfig\u003C/span> config = <span class=\"t\">PoolConfig\u003C/span>.<span class=\"f\">forUrl\u003C/span>(url)\n\t.<span class=\"f\">maxSize\u003C/span>(<span class=\"m\">20\u003C/span>)\n\t.<span class=\"f\">minIdle\u003C/span>(<span class=\"m\">5\u003C/span>)\n\t.<span class=\"f\">connectionTimeout\u003C/span>(<span class=\"t\">Duration\u003C/span>.<span class=\"f\">ofSeconds\u003C/span>(<span class=\"m\">30\u003C/span>))\n\t.<span class=\"f\">build\u003C/span>();                                                    <span class=\"c\">// every value is labelled\u003C/span>\u003C/pre>\n    <div class=\"cb-foot\"><b>What each part buys:\u003C/b> named methods make every value self-describing and let callers set only what they need; the private constructor means a <code>PoolConfig\u003C/code> can only come from <code>build()\u003C/code>, so it is always valid; <code>build()\u003C/code> checks rules that involve several fields at once (min idle ≤ max size, idle timeout &lt; max lifetime), which no single setter could; and the product is immutable, so it can be shared across threads.\u003C/div>\n  \u003C/div>\n  <p>Validation in <code>build()\u003C/code> matters most for the cross-field rules. A setter can check that <code>minIdle\u003C/code> isn't negative, but it can't know whether <code>maxSize\u003C/code> will be set smaller later. Only the final step sees everything. The builder itself is mutable and meant to be used by one thread and thrown away; the object it builds is what gets shared.\u003C/p>\n\n  <h2>Fluent APIs, and the JDK's own builder\u003C/h2>\n  <p>A builder whose methods return <code>this\u003C/code> gives you a <b>fluent API\u003C/b>: calls chain into something that reads like a description of the object. Java 11's HTTP client is a good model. <code>HttpRequest.newBuilder()\u003C/code> returns a builder, <code>build()\u003C/code> returns an immutable <code>HttpRequest\u003C/code>, and <code>build()\u003C/code> refuses to produce a request without a URI. It also rejects a handful of “restricted” headers like <code>Host\u003C/code> and <code>Content-Length\u003C/code>, which the client must control itself. Try it:\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Request builder: the fluent code writes itself\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"bp-grid\">\n        <div class=\"bp-f\">\n          <div><label>URI\u003C/label><input id=\"bpUri\" value=\"https://api.example.com/v1/orders\" spellcheck=\"false\">\u003C/div>\n          <div class=\"bp-row\"><div style=\"flex:1\"><label>Method\u003C/label><select id=\"bpMethod\"><option>GET\u003C/option><option selected>POST\u003C/option><option>PUT\u003C/option><option>DELETE\u003C/option>\u003C/select>\u003C/div><div style=\"flex:1\"><label>Timeout (seconds)\u003C/label><input id=\"bpTimeout\" type=\"number\" value=\"10\">\u003C/div>\u003C/div>\n          <div><label>Body (for POST / PUT)\u003C/label><textarea id=\"bpBody\" spellcheck=\"false\">{\"sku\": \"A-1\", \"qty\": 2}\u003C/textarea>\u003C/div>\n          <div><label>Add a header\u003C/label><div class=\"bp-row\"><input id=\"bpHn\" placeholder=\"Name\" value=\"Idempotency-Key\" spellcheck=\"false\"><input id=\"bpHv\" placeholder=\"value\" value=\"ord-8412\" spellcheck=\"false\"><button class=\"btn sm\" id=\"bpAdd\">add\u003C/button>\u003C/div>\n            <div class=\"bp-hdrs\" id=\"bpHdrs\">\u003C/div>\n            <div class=\"small muted\" style=\"margin-top:6px\">Try adding a <code>Host\u003C/code> header, clearing the URI, or a timeout of 0.\u003C/div>\u003C/div>\n        \u003C/div>\n        <div>\n          <pre class=\"code bp-code\" id=\"bpCode\">\u003C/pre>\n          <div class=\"bp-res\" id=\"bpRes\">\u003C/div>\n        \u003C/div>\n      \u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Click a header chip to remove it. The error messages follow what the real <code>java.net.http.HttpRequest.Builder\u003C/code> does: an <code>IllegalStateException\u003C/code> from <code>build()\u003C/code> without a URI, an <code>IllegalArgumentException\u003C/code> from <code>header()\u003C/code> for restricted names, and one from <code>timeout()\u003C/code> for a non-positive duration.\u003C/div>\n  \u003C/div>\n\n  <p>A few guidelines for builders you write yourself:\u003C/p>\n  <ul>\n    <li><b>Take required values up front\u003C/b> (<code>PoolConfig.forUrl(url)\u003C/code>), so a builder can't exist without them.\u003C/li>\n    <li><b>Keep defaults in the builder's field initialisers\u003C/b>, visible in one place.\u003C/li>\n    <li><b>Validate single values early\u003C/b> in each method when it helps (a negative size can fail at once), and <b>cross-field rules in <code>build()\u003C/code>\u003C/b>.\u003C/li>\n    <li><b>Don't add a builder to a record with three fields.\u003C/b> A constructor or static factory is clearer. Builders pay off around four or more parameters, several of them optional.\u003C/li>\n  \u003C/ul>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Start\u003C/b> <code>PoolConfig.forUrl(url)\u003C/code>: required values, defaults for the rest.\u003C/li>\n      <li><b>Configure\u003C/b> Chain only the settings that differ from the defaults.\u003C/li>\n      <li data-k=\"decision\"><b>build()\u003C/b> Check every rule, including the ones that span fields.\u003C/li>\n      <li><b>Invalid?\u003C/b> Throw with a message naming the rule. No half-built object escapes.\u003C/li>\n      <li data-k=\"end\"><b>Valid\u003C/b> An immutable object, safe to share across threads and cache.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A builder's life.\u003C/b> Mutable while collecting, discarded after <code>build()\u003C/code>; the product is immutable from birth.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Prototype: copying a configured object\u003C/h2>\n  <p>Once a service has a carefully configured <code>RetryPolicy\u003C/code> or <code>HttpRequest\u003C/code>, it often needs a variant: the same policy with more attempts, the same request with one extra header. The <b>Prototype\u003C/b> pattern means creating new objects by copying an existing one rather than configuring from scratch. In Java there are three good ways to do it, and one to avoid.\u003C/p>\n<pre class=\"code\"><span class=\"c\">// 1. \"with\" methods on an immutable object (the java.time style)\u003C/span>\n<span class=\"k\">public record\u003C/span> <span class=\"t\">RetryPolicy\u003C/span>(<span class=\"k\">int\u003C/span> maxAttempts, <span class=\"t\">Duration\u003C/span> baseDelay, <span class=\"k\">double\u003C/span> multiplier) {\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">RetryPolicy\u003C/span> <span class=\"f\">withMaxAttempts\u003C/span>(<span class=\"k\">int\u003C/span> n) { <span class=\"k\">return new\u003C/span> <span class=\"t\">RetryPolicy\u003C/span>(n, baseDelay, multiplier); }\n}\n<span class=\"t\">RetryPolicy\u003C/span> payments = STANDARD.<span class=\"f\">withMaxAttempts\u003C/span>(<span class=\"m\">5\u003C/span>);\n\n<span class=\"c\">// 2. toBuilder(): copy every setting into a new builder, change a few, build\u003C/span>\n<span class=\"t\">PoolConfig\u003C/span> reporting = config.<span class=\"f\">toBuilder\u003C/span>().<span class=\"f\">maxSize\u003C/span>(<span class=\"m\">4\u003C/span>).<span class=\"f\">build\u003C/span>();\n\n<span class=\"c\">// 3. The JDK's own: copy a request, keeping only the headers the filter allows (Java 16+)\u003C/span>\n<span class=\"t\">HttpRequest\u003C/span> retry = <span class=\"t\">HttpRequest\u003C/span>.<span class=\"f\">newBuilder\u003C/span>(original, (name, value) -&gt; !name.<span class=\"f\">equalsIgnoreCase\u003C/span>(<span class=\"s\">\"Authorization\"\u003C/span>))\n\t.<span class=\"f\">header\u003C/span>(<span class=\"s\">\"Authorization\"\u003C/span>, <span class=\"s\">\"Bearer \"\u003C/span> + freshToken)\n\t.<span class=\"f\">build\u003C/span>();\u003C/pre>\n  <p>With immutable objects, “copy” is cheap and safe: the new object can share every unchanged field with the original, because none of them can change. That's why <code>Instant.plusSeconds\u003C/code>, <code>LocalDate.withDayOfMonth\u003C/code> and <code>String.replace\u003C/code> all return new objects instead of modifying. For a mutable class, a <b>copy constructor\u003C/b> (<code>new Cart(existingCart)\u003C/code>) or a static <code>copyOf\u003C/code> is the explicit way to make an independent copy, deep where it needs to be.\u003C/p>\n  <p>The one to avoid is <code>Object.clone()\u003C/code> with <code>Cloneable\u003C/code>. <code>Cloneable\u003C/code> has no methods, yet changes how <code>Object.clone()\u003C/code> behaves; the copy is created without running any constructor, so invariants and <code>final\u003C/code> fields aren't handled normally; the default copy is shallow, so a cloned object shares its lists with the original (the aliasing bug from <a href=\"p1-classes-objects.html\">P1\u003C/a>); and <code>clone()\u003C/code> declares a checked exception most callers can't do anything about. <i>Effective Java\u003C/i> advises copy constructors or copy factories instead, and so does this course.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Why connection-pool libraries use builders or config objects\u003C/div><p>Production connection pools such as HikariCP expose a dozen or more settings: pool size, minimum idle, connection, idle and validation timeouts, maximum lifetime, leak detection threshold, and more. Most applications change two or three. A constructor with a dozen positional parameters would be unusable, and would guarantee swapped timeouts somewhere. So these libraries use a configuration object with named properties that is checked when the pool starts, and reject invalid combinations with a clear message instead of misbehaving under load at 3 a.m. It's the builder idea: collect named settings, validate the whole configuration once, then create the thing. <a href=\"39-case-connection-pool.html\">Case Study 39\u003C/a> builds a pool with exactly this configuration.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>A public constructor next to the builder.\u003C/b> Callers can bypass <code>build()\u003C/code>'s validation. Make the constructor private.\u003C/li>\n      <li><b>Validating cross-field rules in setters.\u003C/b> They can't see the final values. Check them in <code>build()\u003C/code>.\u003C/li>\n      <li><b>Sharing a builder between threads, or reusing it after <code>build()\u003C/code>.\u003C/b> Builders are throwaway, single-thread helpers.\u003C/li>\n      <li><b>A builder for three fields.\u003C/b> A record or static factory is clearer.\u003C/li>\n      <li><b>Setters on the product “for convenience”.\u003C/b> The whole point is an immutable, always-valid product.\u003C/li>\n      <li><b>Implementing <code>Cloneable\u003C/code>.\u003C/b> Use copy constructors, <code>with\u003C/code> methods or <code>toBuilder()\u003C/code>.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> When would you use a Builder, and what makes a good one?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>When an object has several parameters, especially optional ones or several of the same type, where a constructor would be unreadable and easy to call with swapped arguments. A good builder takes required values up front, holds defaults in one place, has named chainable methods, validates cross-field rules in <code>build()\u003C/code>, and produces an immutable object through a private constructor, so every instance is valid. The builder is mutable and throwaway; the product is what gets shared.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> You need an HTTP request identical to a previous one except for a refreshed auth token. How would you create it, and why not <code>clone()\u003C/code>?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Copy it through a builder: in the JDK, <code>HttpRequest.newBuilder(original, filter)\u003C/code> copies the request, dropping the old <code>Authorization\u003C/code> header via the filter, then I add the new header and call <code>build()\u003C/code>. Since <code>HttpRequest\u003C/code> is immutable, the copy safely shares everything else with the original. I'd avoid <code>clone()\u003C/code> because it bypasses constructors, makes shallow copies that share mutable state, and has an awkward checked-exception API; copy constructors, <code>with\u003C/code> methods and <code>toBuilder()\u003C/code> are explicit and go through the normal validation.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Telescoping constructors are unreadable and invite swapped arguments; setters give up immutability and allow half-built objects.\u003C/li>\n      <li>A Builder collects named settings, holds defaults, and creates the object once in <code>build()\u003C/code> through a private constructor.\u003C/li>\n      <li>Check single values early if useful, and cross-field rules in <code>build()\u003C/code>.\u003C/li>\n      <li>The builder is mutable and single-use; the product is immutable and shareable.\u003C/li>\n      <li>Prototype in Java: <code>with\u003C/code> methods, <code>toBuilder()\u003C/code>, copy constructors and copy factories.\u003C/li>\n      <li>Avoid <code>clone()\u003C/code>/<code>Cloneable\u003C/code>: no constructor, shallow by default, awkward API.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">What's the main problem with <code>new PoolConfig(url, 20, 5, 600_000, 30_000, 1_800_000)\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Constructors can't take more than five arguments\u003C/button>\n        <button class=\"opt\">Several same-type values in a row: callers can swap them and it still compiles, and optional values force passing all earlier ones\u003C/button>\n        <button class=\"opt\">Numbers with underscores don't compile\u003C/button>\n        <button class=\"opt\">It creates a mutable object\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Positional <code>long\u003C/code> timeouts carry no names at the call site, so a swap is invisible. A builder labels every value and lets callers set only what they need.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Where should a builder check “<code>minIdle\u003C/code> must not exceed <code>maxSize\u003C/code>”?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">In <code>minIdle()\u003C/code>\u003C/button>\n        <button class=\"opt\">In <code>maxSize()\u003C/code>\u003C/button>\n        <button class=\"opt\">In the product's getters\u003C/button>\n        <button class=\"opt\">In <code>build()\u003C/code>, where both final values are known\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A rule spanning two fields can only be checked once both are set, and callers may set them in either order. <code>build()\u003C/code> sees the final configuration.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Why does <code>PoolConfig\u003C/code> have a private constructor that takes the builder?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">So every PoolConfig must come through <code>build()\u003C/code> and its validation\u003C/button>\n        <button class=\"opt\">Private constructors are faster\u003C/button>\n        <button class=\"opt\">So it can't be garbage collected\u003C/button>\n        <button class=\"opt\">Java requires it for nested classes\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">If the constructor were public, callers could bypass <code>build()\u003C/code> and create invalid objects. With it private, a PoolConfig is valid by construction.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">What does <code>HttpRequest.newBuilder().GET().build()\u003C/code> do, with no URI set?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Builds a request to <code>http://localhost/\u003C/code>\u003C/button>\n        <button class=\"opt\">Returns null\u003C/button>\n        <button class=\"opt\">Throws <code>IllegalStateException\u003C/code>, because a request needs a URI\u003C/button>\n        <button class=\"opt\">Throws a checked <code>IOException\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The JDK builder validates in <code>build()\u003C/code> and refuses to produce a request without a URI, so a <code>HttpRequest\u003C/code> object is always complete.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Why prefer a copy constructor or <code>with\u003C/code> method over implementing <code>Cloneable\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>clone()\u003C/code> is slower\u003C/button>\n        <button class=\"opt\"><code>clone()\u003C/code> skips constructors, copies shallowly by default so mutable fields end up shared, and has an awkward checked-exception API\u003C/button>\n        <button class=\"opt\"><code>Cloneable\u003C/code> was removed from Java\u003C/button>\n        <button class=\"opt\">Records can't be copied any other way\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A shallow clone shares lists and other mutable objects with the original, which is aliasing by accident. Explicit copies run normal construction and validation, and make deep copies where needed.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const RESTRICTED = ['connection', 'content-length', 'expect', 'host', 'upgrade'];\n  let headers = [['Content-Type', 'application/json']];\n  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/\u003C/g, '&lt;');\n  function draw() {\n    $('#bpHdrs').innerHTML = headers.map(([n, v], i) => `<span class=\"bp-h\" data-i=\"${i}\" title=\"click to remove\">${esc(n)}: ${esc(v)} ✕\u003C/span>`).join('');\n    $$('.bp-h').forEach((h) => h.onclick = () => { headers.splice(+h.dataset.i, 1); draw(); });\n    const uri = $('#bpUri').value.trim(), m = $('#bpMethod').value, t = +$('#bpTimeout').value, body = $('#bpBody').value;\n    const hasBody = (m === 'POST' || m === 'PUT');\n    let code = 'HttpRequest req = HttpRequest.newBuilder()\\n';\n    if (uri) code += `    .uri(URI.create(\"${uri}\"))\\n`;\n    headers.forEach(([n, v]) => { code += `    .header(\"${n}\", \"${v}\")\\n`; });\n    code += `    .timeout(Duration.ofSeconds(${isNaN(t) ? '?' : t}))\\n`;\n    code += hasBody ? `    .${m}(BodyPublishers.ofString(${JSON.stringify(body)}))\\n` : `    .${m}()\\n`;\n    code += '    .build();';\n    $('#bpCode').textContent = code;\n    const r = $('#bpRes');\n    let err = null;\n    const bad = headers.find(([n]) => RESTRICTED.includes(n.trim().toLowerCase()));\n    if (bad) err = `<code>header()\u003C/code> throws <code>IllegalArgumentException: restricted header name: \"${esc(bad[0])}\"\u003C/code>. The client sets it itself.`;\n    else if (headers.some(([n]) => !/^[!#$%&'*+.^_`|~0-9A-Za-z-]+$/.test(n))) err = '<code>header()\u003C/code> throws <code>IllegalArgumentException\u003C/code>: invalid header name.';\n    else if (!(t > 0)) err = '<code>timeout()\u003C/code> throws <code>IllegalArgumentException\u003C/code>: the duration must be positive.';\n    else if (!uri) err = '<code>build()\u003C/code> throws <code>IllegalStateException: uri is null\u003C/code>. A request without a URI can never exist.';\n    else if (!/^https?:\\/\\/[^\\s/]+/.test(uri)) err = '<code>uri()\u003C/code> throws <code>IllegalArgumentException\u003C/code>: the scheme must be http or https, with a host.';\n    r.className = 'bp-res ' + (err ? 'bad' : 'ok');\n    r.innerHTML = err ? '✗ ' + err : `✓ An immutable <code>HttpRequest\u003C/code>: ${m} ${esc(uri)}, ${headers.length} header${headers.length === 1 ? '' : 's'}, ${t}s timeout. Safe to share and resend.`;\n  }\n  ['#bpUri', '#bpMethod', '#bpTimeout', '#bpBody'].forEach((s) => $(s).addEventListener('input', draw));\n  $('#bpAdd').onclick = () => { const n = $('#bpHn').value.trim(), v = $('#bpHv').value; if (n) { headers.push([n, v]); $('#bpHn').value = ''; $('#bpHv').value = ''; draw(); } };\n  draw();\n})();\n"]},"12-adapter-facade-bridge.html":{"title":"Adapter, Facade &amp; Bridge","chapter":"12","styles":"","html":"\r\n\u003C!-- lld:placeholder -->\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 12\u003C/span><span class=\"pill\">Design Patterns\u003 iv class=\"body\"><div class=\"title\">Same problem, different zoom\u003C/div>\r\n      The System Design course covers the architecture of this system — services, storage and scale. This chapter zooms into the classes inside one of those services. See <a href=\"../system-design/35-case-ride-hailing.html\">the high-level design\u003C/a>.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <h2>What this chapter will cover\u003C/h2>\r\n  <ol>\r\n    <li>Requirements and API\u003C/li>\r\n    <li>Entities and trip lifecycle\u003C/li>\r\n    <li>Driver matching strategy\u003C/li>\r\n    <li>Pricing and surge\u003C/li>\r\n    <li>Observers for trip updates\u003C/li>\r\n  \u003C/ol>\r\n\r\n\u003C/main>\r\n\r\n","scripts":[]},"flashcards.html":{"title":"Flashcards","chapter":"","styles":"\r\n  .card-stage { max-width: 720px; margin: 0 auto; }\r\n  .fc { border:1px solid var(--border); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-lg); padding:26px; min-height:300px; display:flex; flex-direction:column; gap:16px; animation:fadeUp .25s; }\r\n  .fc .meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-family:var(--mono); }\r\n  .fc .q { font-size:20px; font-weight:700; line-height:1.45; letter-spacing:-.01em; }\r\n  .fc .opts { display:grid; gap:8px; }\r\n  .fc .opt { text-align:left; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14.5px; cursor:pointer; transition:.18s; }\r\n  .fc .opt:hover:not(:disabled) { border-color:var(--accent); }\r\n  .fc .opt.correct { border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700; }\r\n  .fc .opt.wrong { border-color:var(--red); background:var(--red-soft); color:var(--red); }\r\n  .fc .why { font-size:14px; color:var(--text-2); background:var(--surface-2); border-radius:12px; padding:12px 14px; line-height:1.6; animation:fadeUp .25s; }\r\n  .ra
