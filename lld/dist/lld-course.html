've drawn <code>PaymentService → PaymentGateway\u003C/code> with <code>StripeGateway\u003C/code> and <code>AdyenGateway\u003C/code> under it. The interviewer asks how you'd add PayPal. Answer by pointing at the diagram.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div><code>PaymentGateway\u003C/code> is an interface, drawn with <code>«interface»\u003C/code>, and the two gateways realize it with dashed lines and hollow triangles. Adding PayPal is one new box, <code>PayPalGateway\u003C/code>, with the same dashed arrow to the interface. <code>PaymentService\u003C/code> has an association to the interface only, so it doesn't change. The only other edit is wherever gateways are created and chosen, ideally one factory, which I'd point to as well.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Class boxes: name, fields, methods; + − # ~ for visibility; types after a colon; underline for static, italic for abstract, «interface» for interfaces.\u003C/li>\n      <li>Dependency (dashed, open arrow) is a parameter or local; association (solid) is a field.\u003C/li>\n      <li>Aggregation (hollow diamond) and composition (filled diamond) sit on the whole; composition means the whole owns the parts' lifecycle.\u003C/li>\n      <li>Inheritance is a solid line, realization a dashed line, both with a hollow triangle pointing at the parent or interface.\u003C/li>\n      <li>Multiplicities (1, 0..1, *, 1..*) sit at the far end and map to a field, an Optional or a collection.\u003C/li>\n      <li>Sequence diagrams: lifelines, solid calls, dashed returns, self-calls and alt/opt/loop frames. Keep both diagrams small and precise.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">A dashed line from <code>MapCache\u003C/code> to <code>Cache\u003C/code> with a hollow triangle at <code>Cache\u003C/code>. What's the Java?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>class MapCache extends Cache\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>MapCache\u003C/code> has a field of type <code>Cache\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>MapCache\u003C/code> takes a <code>Cache\u003C/code> as a parameter\u003C/button>\n        <button class=\"opt\"><code>class MapCache implements Cache\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Dashed plus hollow triangle is realization: implementing an interface. A solid line with a hollow triangle would be <code>extends\u003C/code>.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A line joins <code>Order\u003C/code> and <code>LineItem\u003C/code>, with a filled diamond at the Order end and <code>1..*\u003C/code> at the LineItem end. What does it say?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Each line item owns one or more orders\u003C/button>\n        <button class=\"opt\">An order owns at least one line item, and the line items don't outlive the order\u003C/button>\n        <button class=\"opt\">An order may or may not have line items, which are shared with other orders\u003C/button>\n        <button class=\"opt\">LineItem extends Order\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The filled diamond on Order means composition: Order is the whole and owns the parts' lifecycle. <code>1..*\u003C/code> at the LineItem end means each order has one or more of them.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">In a class box, what does <code>- tokens: int\u003C/code> mean?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A private field named tokens of type int\u003C/button>\n        <button class=\"opt\">A method that decrements tokens\u003C/button>\n        <button class=\"opt\">A public int constant\u003C/button>\n        <button class=\"opt\">A field that has been removed\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The minus sign is private visibility, and UML writes the type after a colon: <code>private int tokens;\u003C/code>.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>class Router { Response dispatch(Request req) { ... } }\u003C/code>. Router has no field of type Request. Which line do you draw from Router to Request?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Association: a solid line\u003C/button>\n        <button class=\"opt\">Composition: a filled diamond at Router\u003C/button>\n        <button class=\"opt\">Dependency: a dashed line with an open arrow to Request\u003C/button>\n        <button class=\"opt\">None: parameters are never shown\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Using a type only as a parameter, local variable or return type is a dependency. Association needs a field that keeps a reference to it.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">In a sequence diagram, what does a dashed arrow from <code>ApiHandler\u003C/code> back to <code>Client\u003C/code> usually mean?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">An asynchronous call from ApiHandler to Client\u003C/button>\n        <button class=\"opt\">A return: the response going back to the caller\u003C/button>\n        <button class=\"opt\">That ApiHandler implements Client\u003C/button>\n        <button class=\"opt\">A failed call\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Dashed arrows are returns. Calls are solid; an open arrowhead on a solid line marks an asynchronous message.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const NS = 'http://www.w3.org/2000/svg';\n  const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };\n  let uid = 0;\n\n  // Markers, per SVG: filled/hollow diamond at the start (the whole), hollow triangle and open arrow at the end.\n  function defs(svg) {\n    const d = el('defs', {}, svg), p = 'm' + (++uid);\n    const mk = (id, w, h, refX, refY, cls, path) => { const m = el('marker', { id: p + id, viewBox: `0 0 ${w} ${h}`, refX, refY, markerWidth: w, markerHeight: h, markerUnits: 'userSpaceOnUse', orient: 'auto' }, d); el('path', { d: path, class: cls }, m); };\n    mk('df', 16, 10, 0, 5, 'mk-fill', 'M0,5 L8,0 L16,5 L8,10 z');\n    mk('dh', 16, 10, 0, 5, 'mk-hollow', 'M1,5 L8,1 L15,5 L8,9 z');\n    mk('tri', 14, 14, 13, 7, 'mk-hollow', 'M1,1 L13,7 L1,13 z');\n    mk('arr', 12, 12, 11, 6, 'mk-open', 'M1,1 L11,6 L1,11');\n    return (id) => `url(#${p + id})`;\n  }\n  const STYLE = {\n    dependency:  { dash: true,  start: null, end: 'arr' },\n    association: { dash: false, start: null, end: 'arr' },\n    aggregation: { dash: false, start: 'dh', end: null },\n    composition: { dash: false, start: 'df', end: null },\n    inheritance: { dash: false, start: null, end: 'tri' },\n    realization: { dash: true,  start: null, end: 'tri' },\n  };\n\n  // Draw a class box. spec: { x, y, w, name, stereo, italic, fields: [[text, underline?]], methods: [[text, italic?]] }\n  function box(svg, s) {\n    // Size the box to its longest line (12px monospace ≈ 7.3px per character).\n    const longest = Math.max(s.name.length, ...s.fields.map((r) => r[0].length), ...s.methods.map((r) => r[0].length));\n    s = { ...s, w: Math.max(s.w, Math.ceil(longest * 7.3 + 18)) };\n    const g = el('g', {}, svg), rowH = 17, top = s.stereo ? 36 : 26;\n    const fh = s.fields.length ? s.fields.length * rowH + 8 : 0, mh = s.methods.length ? s.methods.length * rowH + 8 : 0;\n    const h = top + fh + mh + (fh || mh ? 0 : 4);\n    el('rect', { x: s.x, y: s.y, width: s.w, height: h, rx: 6, class: 'box' + (s.stereo === 'interface' ? ' iface' : '') }, g);\n    if (s.stereo) el('text', { x: s.x + s.w / 2, y: s.y + 13, 'text-anchor': 'middle', class: 'stereo' }, g, `«${s.stereo}»`);\n    el('text', { x: s.x + s.w / 2, y: s.y + (s.stereo ? 29 : 18), 'text-anchor': 'middle', class: 'title' + (s.italic ? ' it' : '') }, g, s.name);\n    let y = s.y + top;\n    const rows = (list, italicAll) => {\n      el('line', { x1: s.x, y1: y, x2: s.x + s.w, y2: y, class: 'sep' }, g); y += 4;\n      list.forEach(([t, flag]) => { const tx = el('text', { x: s.x + 8, y: y + 12, class: italicAll && flag ? 'it' : '' }, g, t); if (!italicAll && flag) tx.setAttribute('text-decoration', 'underline'); y += rowH; });\n      y += 4;\n    };\n    if (s.fields.length) rows(s.fields, false);\n    if (s.methods.length) rows(s.methods, true);\n    return { x: s.x, y: s.y, w: s.w, h, cx: s.x + s.w / 2, cy: s.y + h / 2 };\n  }\n  // The point where the line from a box's centre towards (tx, ty) leaves the box.\n  function exit(b, tx, ty) {\n    const dx = tx - b.cx, dy = ty - b.cy;\n    const sx = dx ? (b.w / 2) / Math.abs(dx) : Infinity, sy = dy ? (b.h / 2) / Math.abs(dy) : Infinity, s = Math.min(sx, sy);\n    return [b.cx + dx * s, b.cy + dy * s];\n  }\n  function edge(svg, url, a, b, kind, o = {}) {\n    const st = STYLE[kind], [x1, y1] = exit(a, b.cx, b.cy), [x2, y2] = exit(b, a.cx, a.cy);\n    const attrs = { d: `M${x1},${y1} L${x2},${y2}`, class: 'ln' + (st.dash ? ' dash' : '') };\n    if (st.start) attrs['marker-start'] = url(st.start);\n    if (st.end) attrs['marker-end'] = url(st.end);\n    el('path', attrs, svg);\n    if (o.mult) { const t = 0.86; el('text', { x: x1 + (x2 - x1) * t + (o.mdx || 8), y: y1 + (y2 - y1) * t + (o.mdy || -6), class: 'mult' }, svg, o.mult); }\n    if (o.label) el('text', { x: (x1 + x2) / 2 + (o.ldx || 6), y: (y1 + y2) / 2 + (o.ldy || -6), class: 'elabel' }, svg, o.label);\n  }\n\n  /* ---- class boxes figure ---- */\n  (function () {\n    const svg = $('#umlBox'); defs(svg);\n    box(svg, { x: 10, y: 10, w: 200, name: 'Cache<K, V>', stereo: 'interface', fields: [], methods: [['+ get(key: K): Optional<V>', true], ['+ put(key: K, value: V): void', true], ['+ size(): int', true]] });\n    box(svg, { x: 262, y: 10, w: 220, name: 'TokenBucket', fields: [['- capacity: int'], ['- refillPerSecond: int'], ['- tokens: int'], ['- lastRefillMillis: long'], ['+ MAX_CAPACITY: int', true]], methods: [['+ tryAcquire(now: long): boolean'], ['+ available(): int'], ['- refill(now: long): void']] });\n    el('text', { x: 10, y: 130, class: 'elabel' }, svg, 'italic: abstract');\n    el('text', { x: 10, y: 146, class: 'elabel' }, svg, 'underlined: static');\n  })();\n\n  /* ---- legend ---- */\n  const LEG = [\n    ['dependency', 'Dependency', 'Router ⇢ Request', '<code>Response dispatch(Request req)\u003C/code>'],\n    ['association', 'Association', 'Route → RequestHandler', '<code>private final RequestHandler handler;\u003C/code>'],\n    ['aggregation', 'Aggregation', 'OnCallRotation ◇— Engineer', '<code>private final List&lt;Engineer&gt; engineers;\u003C/code> (passed in, shared)'],\n    ['composition', 'Composition', 'ConnectionPool ◆— PooledConnection', '<code>idle.add(new PooledConnection(...));\u003C/code> (created and owned)'],\n    ['inheritance', 'Inheritance', 'JsonFileAppender —▷ FileAppender', '<code>class JsonFileAppender extends FileAppender\u003C/code>'],\n    ['realization', 'Realization', 'MapCache ⇢▷ Cache', '<code>class MapCache&lt;K, V&gt; implements Cache&lt;K, V&gt;\u003C/code>'],\n  ];\n  $('#umlLegend').innerHTML = LEG.map(([k, n, ex, java]) => `<div class=\"lg\"><svg class=\"uml\" data-k=\"${k}\" viewBox=\"0 0 320 34\">\u003C/svg><b>${n}\u003C/b><span class=\"small muted\">${ex}\u003C/span><br><span class=\"small\">${java}\u003C/span>\u003C/div>`).join('');\n  $$('#umlLegend svg').forEach((svg) => {\n    const url = defs(svg), a = { cx: 30, cy: 17, w: 44, h: 22, x: 8, y: 6 }, b = { cx: 290, cy: 17, w: 44, h: 22, x: 268, y: 6 };\n    el('rect', { x: 8, y: 6, width: 44, height: 22, rx: 4, class: 'box' }, svg); el('text', { x: 30, y: 21, 'text-anchor': 'middle' }, svg, 'A');\n    el('rect', { x: 268, y: 6, width: 44, height: 22, rx: 4, class: 'box' }, svg); el('text', { x: 290, y: 21, 'text-anchor': 'middle' }, svg, 'B');\n    edge(svg, url, a, b, svg.dataset.k);\n  });\n\n  /* ---- the HTTP server diagram ---- */\n  (function () {\n    const svg = $('#umlServer'), url = defs(svg);\n    const B = {};\n    B.server = box(svg, { x: 30, y: 30, w: 230, name: 'HttpServer', fields: [['- port: int']], methods: [['+ start(): void'], ['+ use(m: Middleware): void']] });\n    B.router = box(svg, { x: 320, y: 30, w: 230, name: 'Router', fields: [], methods: [['+ add(route: Route): void'], ['+ dispatch(req: Request): Response']] });\n    B.route = box(svg, { x: 675, y: 30, w: 240, name: 'Route', fields: [['- method: String'], ['- pathPattern: String']], methods: [['+ matches(req: Request): boolean']] });\n    B.mw = box(svg, { x: 30, y: 230, w: 230, name: 'Middleware', stereo: 'interface', fields: [], methods: [['+ apply(req, next): Response', true]] });\n    B.req = box(svg, { x: 330, y: 230, w: 230, name: 'Request', stereo: 'record', fields: [['path: String'], ['headers: Map<String, String>']], methods: [] });\n    B.rh = box(svg, { x: 675, y: 190, w: 220, name: 'RequestHandler', stereo: 'interface', fields: [], methods: [['+ handle(req: Request): Response', true]] });\n    B.sfh = box(svg, { x: 600, y: 340, w: 170, name: 'StaticFileHandler', fields: [['- root: Path']], methods: [] });\n    B.api = box(svg, { x: 800, y: 340, w: 150, name: 'ApiHandler', fields: [['- users: UserRepo']], methods: [] });\n    edge(svg, url, B.server, B.router, 'composition', { mult: '1', mdx: -14, mdy: -8 });\n    edge(svg, url, B.router, B.route, 'composition', { mult: '*', mdx: -14, mdy: -8 });\n    edge(svg, url, B.server, B.mw, 'aggregation', { mult: '*', mdx: 8, mdy: 2 });\n    edge(svg, url, B.router, B.req, 'dependency', { label: 'dispatch(…)', ldx: 6, ldy: 4 });\n    edge(svg, url, B.route, B.rh, 'association', { mult: '1', mdx: 8, mdy: 0, label: 'handler', ldx: 6, ldy: 4 });\n    edge(svg, url, B.sfh, B.rh, 'realization');\n    edge(svg, url, B.api, B.rh, 'realization');\n  })();\n\n  /* ---- Java → UML drill ---- */\n  const KINDS = ['dependency', 'association', 'aggregation', 'composition', 'inheritance', 'realization'];\n  const Q = [\n    ['class JsonFileAppender extends FileAppender { ... }', 'inheritance', 'extends is inheritance: a solid line with a hollow triangle pointing at FileAppender.'],\n    ['final class MapCache<K, V> implements Cache<K, V> { ... }', 'realization', 'implements is realization: a dashed line with a hollow triangle pointing at the interface.'],\n    ['class Router {\\n    Response dispatch(Request req) { ... }   // no Request field\\n}', 'dependency', 'Request is only a parameter, used during one call. That is a dependency: dashed line, open arrow.'],\n    ['class Route {\\n    private final RequestHandler handler;  // passed in, shared by other routes\\n}', 'association', 'A field referencing an object the class neither creates nor owns: association.'],\n    ['class ConnectionPool {\\n    private final Deque<PooledConnection> idle = new ArrayDeque<>();\\n    // the pool opens every connection and closes them on shutdown\\n}', 'composition', 'The pool creates, manages and destroys its connections, and they belong to no one else: composition, filled diamond on ConnectionPool.'],\n    ['class OnCallRotation {\\n    private final List<Engineer> engineers;  // given in, and engineers are in several rotations\\n}', 'aggregation', 'The engineers exist independently and are shared between rotations: aggregation, hollow diamond on OnCallRotation. (A plain association is also acceptable.)'],\n    ['class UserService {\\n    User register(SignupForm form) { ... form.email() ... }\\n}', 'dependency', 'SignupForm is a parameter, not a field: dependency.'],\n    ['class Order {\\n    private final List<LineItem> items = new ArrayList<>();\\n    void addItem(Sku sku, int qty) { items.add(new LineItem(sku, qty)); }\\n    // items are never returned or shared\\n}', 'composition', 'Order creates its line items and never lets them out, so they live and die with the order: composition.'],\n  ];\n  let qi = 0, score = 0, answered = false;\n  function showQ() {\n    const [code] = Q[qi];\n    answered = false;\n    $('#mqCount').textContent = `${qi + 1} / ${Q.length} · score ${score}`;\n    $('#mqCode').textContent = code;\n    $('#mqWhy').textContent = '';\n    $('#mqOpts').innerHTML = KINDS.map((k) => `<button class=\"btn sm\" data-k=\"${k}\">${k}\u003C/button>`).join('');\n    $$('#mqOpts button').forEach((b) => b.onclick = () => {\n      if (answered) return; answered = true;\n      const [, ans, why] = Q[qi], ok = b.dataset.k === ans;\n      if (ok) score++;\n      b.classList.add(ok ? 'right' : 'wrong');\n      if (!ok) $(`#mqOpts button[data-k=\"${ans}\"]`).classList.add('right');\n      $('#mqWhy').innerHTML = (ok ? '✅ ' : '❌ ') + why.replace(/\u003C/g, '&lt;');\n      $('#mqCount').textContent = `${qi + 1} / ${Q.length} · score ${score}`;\n      if (qi === Q.length - 1) LLD.toast(`Drill done: ${score} / ${Q.length}`);\n    });\n    $('#mqNext').disabled = qi >= Q.length - 1;\n  }\n  $('#mqNext').onclick = () => { if (qi < Q.length - 1) { qi++; showQ(); } };\n  $('#mqReset').onclick = () => { qi = 0; score = 0; showQ(); };\n  showQ();\n})();\n"]}};</script>

ispatch","lv":"Prerequisites","e":[{"t":"extends, super and what a subclass inherits","a":"s1-extends-super-and-what-a-subclass-inheri","k":"section"},{"t":"Dynamic dispatch: the object decides","a":"s2-dynamic-dispatch-the-object-decides","k":"section"},{"t":"Overriding vs overloading","a":"s3-overriding-vs-overloading","k":"section"},{"t":"final, and the fragile base class problem","a":"s4-final-and-the-fragile-base-class-problem","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"Dispatch resolver: which method actually runs?","a":"s2-dynamic-dispatch-the-object-decides","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"The constructor trap: a base class calling an overridable method","a":"s4-final-and-the-fragile-base-class-problem","k":"topic"},{"t":"Common mistakes","a":"s4-final-and-the-fragile-base-class-problem","k":"topic"},{"t":"Interview drill","a":"s4-final-and-the-fragile-base-class-problem","k":"topic"},{"t":"The compiler checks calls against the declared type; the JVM runs the version in the object's own method table.","a":"s4-final-and-the-fragile-base-class-problem","k":"fact"},{"t":"Calls from inside inherited code to overridable methods ( this.format() ) are dispatched too.","a":"s4-final-and-the-fragile-base-class-problem","k":"fact"},{"t":"Constructors must not call methods a subclass can override.","a":"s4-final-and-the-fragile-base-class-problem","k":"fact"}]},{"n":0.4,"f":"p4-interfaces-generics.html","ti":"Interfaces, Abstract Classes & Generics","lv":"Prerequisites","e":[{"t":"Programming to an interface","a":"s1-programming-to-an-interface","k":"section"},{"t":"Interfaces vs abstract classes","a":"s2-interfaces-vs-abstract-classes","k":"section"},{"t":"Default methods and the diamond","a":"s3-default-methods-and-the-diamond","k":"section"},{"t":"Generics: one class, every type","a":"s4-generics-one-class-every-type","k":"section"},{"t":"Wildcards and PECS","a":"s5-wildcards-and-pecs","k":"section"},{"t":"Functional interfaces and lambdas","a":"s6-functional-interfaces-and-lambdas","k":"section"},{"t":"Check your understanding","a":"s7-check-your-understanding","k":"section"},{"t":"PECS checker: does it compile?","a":"s5-wildcards-and-pecs","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"JDBC: one interface, every database","a":"s6-functional-interfaces-and-lambdas","k":"topic"},{"t":"Common mistakes","a":"s6-functional-interfaces-and-lambdas","k":"topic"},{"t":"Interview drill","a":"s6-functional-interfaces-and-lambdas","k":"topic"},{"t":"Program to interfaces: callers depend on a role like Cache<K, V> , so implementations can change freely.","a":"s6-functional-interfaces-and-lambdas","k":"fact"},{"t":"Generics move type errors from run time to compile time. Erasure means no new T() and no instanceof List<String> .","a":"s6-functional-interfaces-and-lambdas","k":"fact"},{"t":"Generic types are invariant. PECS: read from ? extends T , write to ? super T .","a":"s6-functional-interfaces-and-lambdas","k":"fact"},{"t":"Functional interfaces turn small behaviours into values; name them after what they mean.","a":"s6-functional-interfaces-and-lambdas","k":"fact"}]},{"n":0.5,"f":"p5-composition.html","ti":"Composition over Inheritance","lv":"Prerequisites","e":[{"t":"The subclass explosion","a":"s1-the-subclass-explosion","k":"section"},{"t":"Delegation by hand: fixing the fragile subclass","a":"s2-delegation-by-hand-fixing-the-fragile-su","k":"section"},{"t":"Is-a vs has-a: the substitution test","a":"s3-is-a-vs-has-a-the-substitution-test","k":"section"},{"t":"When inheritance is still right","a":"s4-when-inheritance-is-still-right","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"Class count: one subclass per combination vs one class per feature","a":"s1-the-subclass-explosion","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"java.io: a whole library built by composition","a":"s3-is-a-vs-has-a-the-substitution-test","k":"topic"},{"t":"Common mistakes","a":"s4-when-inheritance-is-still-right","k":"topic"},{"t":"Interview drill","a":"s4-when-inheritance-is-still-right","k":"topic"},{"t":"Features as subclasses cost channels × 2 features classes; features as wrappers cost channels + features.","a":"s4-when-inheritance-is-still-right","k":"fact"},{"t":"Composition: implement the interface, hold the thing you wrap, add one behaviour, delegate the rest.","a":"s4-when-inheritance-is-still-right","k":"fact"},{"t":"A forwarding class fixes the fragile subclass: the inner object's self-calls never reach your overrides.","a":"s4-when-inheritance-is-still-right","k":"fact"},{"t":"The substitution test: B extends A only if every A operation is right for a B. Stack and Properties fail it.","a":"s4-when-inheritance-is-still-right","k":"fact"},{"t":"Composition's catch: calls the inner object makes to itself bypass the wrappers.","a":"s4-when-inheritance-is-still-right","k":"fact"},{"t":"Inheritance is right for true subtypes, sealed closed hierarchies and deliberate template skeletons.","a":"s4-when-inheritance-is-still-right","k":"fact"}]},{"n":0.6,"f":"p6-value-objects.html","ti":"Value Objects, Enums & Immutability","lv":"Prerequisites","e":[{"t":"Entities and value objects","a":"s1-entities-and-value-objects","k":"section"},{"t":"equals and hashCode: the contract","a":"s2-equals-and-hashcode-the-contract","k":"section"},{"t":"Records: value objects in one line","a":"s3-records-value-objects-in-one-line","k":"section"},{"t":"Making a class immutable","a":"s4-making-a-class-immutable","k":"section"},{"t":"Enums with fields and behaviour","a":"s5-enums-with-fields-and-behaviour","k":"section"},{"t":"Money is a value object, never a double","a":"s6-money-is-a-value-object-never-a-double","k":"section"},{"t":"Check your understanding","a":"s7-check-your-understanding","k":"section"},{"t":" s","a":"s3-try-with-resources","k":"topic"},{"t":"Common mistakes","a":"s5-fail-fast-and-never-swallow","k":"topic"},{"t":"Interview drill","a":"s5-fail-fast-and-never-swallow","k":"topic"},{"t":"Default to unchecked exceptions; group them by what the caller will do, and give them the data the caller needs.","a":"s5-fail-fast-and-never-swallow","k":"fact"},{"t":"Translate low-level exceptions at your design's boundary, always passing the original as the cause.","a":"s5-fail-fast-and-never-swallow","k":"fact"},{"t":"try-with-resources closes every opened resource in reverse order; later failures are suppressed, not lost.","a":"s5-fail-fast-and-never-swallow","k":"fact"},{"t":"Return Optional for “might not exist”, empty collections for “none”, and throw when the operation couldn't do its job.","a":"s5-fail-fast-and-never-swallow","k":"fact"},{"t":"Fail fast at boundaries. Handle, translate or propagate; never swallow, and log once at the top.","a":"s5-fail-fast-and-never-swallow","k":"fact"}]},{"n":0.8,"f":"p8-reading-uml.html","ti":"Reading UML: Class & Sequence Diagrams","lv":"Prerequisites","e":[{"t":"Why a diagram, and how much of UML you need","a":"s1-why-a-diagram-and-how-much-of-uml-you-ne","k":"section"},{"t":"Class boxes","a":"s2-class-boxes","k":"section"},{"t":"The six relationships","a":"s3-the-six-relationships","k":"section"},{"t":"Multiplicity","a":"s4-multiplicity","k":"section"},{"t":"From Java to a diagram, and back","a":"s5-from-java-to-a-diagram-and-back","k":"section"},{"t":"Sequence diagrams","a":"s6-sequence-diagrams","k":"section"},{"t":"Check your understanding","a":"s7-check-your-understanding","k":"section"},{"t":"A whole design on one page: a small HTTP server","a":"s4-multiplicity","k":"demo"},{"t":"Java → UML: which line would you draw?","a":"s5-from-java-to-a-diagram-and-back","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"How the diagram is used in a real LLD round","a":"s6-sequence-diagrams","k":"topic"},{"t":"Common mistakes","a":"s6-sequence-diagrams","k":"topic"},{"t":"Interview drill","a":"s6-sequence-diagrams","k":"topic"},{"t":"Dependency (dashed, open arrow) is a parameter or local; association (solid) is a field.","a":"s6-sequence-diagrams","k":"fact"},{"t":"Inheritance is a solid line, realization a dashed line, both with a hollow triangle pointing at the parent or interface.","a":"s6-sequence-diagrams","k":"fact"},{"t":"Multiplicities (1, 0..1, *, 1..*) sit at the far end and map to a field, an Optional or a collection.","a":"s6-sequence-diagrams","k":"fact"}]},{"n":1,"f":"01-lld-interview.html","ti":"What an LLD Interview Tests","lv":"Principles","e":[{"t":"Three rounds, three different questions","a":"s1-three-rounds-three-different-questions","k":"section"},{"t":"The 45-minute timeline","a":"s2-the-45-minute-timeline","k":"section"},{"t":"What gets scored","a":"s3-what-gets-scored","k":"section"},{"t":"The follow-up is the real question","a":"s4-the-follow-up-is-the-real-question","k":"section"},{"t":"The house style","a":"s5-the-house-style","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Pacing simulator: where did your 45 minutes go?","a":"s2-the-45-minute-timeline","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Cutting scope out loud","a":"s4-the-follow-up-is-the-real-question","k":"topic"},{"t":"Common mistakes","a":"s5-the-house-style","k":"topic"},{"t":"Interview drill","a":"s5-the-house-style","k":"topic"},{"t":"LLD designs classes inside one program; DSA optimises a function; HLD arranges services across machines.","a":"s5-the-house-style","k":"fact"},{"t":"The follow-up decides most rounds: answer by pointing at where the change goes and what stays the same.","a":"s5-the-house-style","k":"fact"},{"t":"Cut scope out loud early; it shows judgment and protects time for the hard part.","a":"s5-the-house-style","k":"fact"}]},{"n":2,"f":"02-requirements-to-classes.html","ti":"From Requirements to Classes","lv":"Principles","e":[{"t":"Questions that change the design","a":"s1-questions-that-change-the-design","k":"section"},{"t":"Use cases, actors and scope","a":"s2-use-cases-actors-and-scope","k":"section"},{"t":"Nouns become candidates, verbs become methods","a":"s3-nouns-become-candidates-verbs-become-met","k":"section"},{"t":"Filtering: which candidates earn a class?","a":"s4-filtering-which-candidates-earn-a-class","k":"section"},{"t":"A first class list","a":"s5-a-first-class-list","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Requirements tagger: what does each word become?","a":"s3-nouns-become-candidates-verbs-become-met","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Why “check, then save” fails for custom aliases","a":"s5-a-first-class-list","k":"topic"},{"t":"Common mistakes","a":"s5-a-first-class-list","k":"topic"},{"t":"Interview drill","a":"s5-a-first-class-list","k":"topic"},{"t":"Ask only questions whose answers change the design, and ask them as a batch of proposed defaults.","a":"s5-a-first-class-list","k":"fact"},{"t":"Write use cases as actor + verb phrase; state what's out of scope out loud.","a":"s5-a-first-class-list","k":"fact"},{"t":"Nouns are candidate classes, verbs candidate methods, and most candidates don't survive filtering.","a":"s5-a-first-class-list","k":"fact"},{"t":"A class earns its place with rules or behaviour, validation, variation (interface) or hiding a detail.","a":"s5-a-first-class-list","k":"fact"},{"t":"Actors call the system; they are rarely classes inside it.","a":"s5-a-first-class-list","k":"fact"},{"t":"Walk one use case through the class list before coding; it exposes missing methods and misplaced logic.","a":"s5-a-first-class-list","k":"fact"}]},{"n":3,"f":"03-solid-srp-ocp.html","ti":"SOLID I: Single Responsibility & Open/Closed","lv":"Principles","e":[{"t":"SOLID in one table","a":"s1-solid-in-one-table","k":"section"},{"t":"Single responsibility: one reason to change","a":"s2-single-responsibility-one-reason-to-chan","k":"section"},{"t":"Spotting a god class","a":"s3-spotting-a-god-class","k":"section"},{"t":"Open/closed: extend without editing","a":"s4-open-closed-extend-without-editing","k":"section"},{"t":"When OCP is over-engineering","a":"s5-when-ocp-is-over-engineering","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Change-impact simulator: what does each request touch?","a":"s4-open-closed-extend-without-editing","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Logging frameworks are open/closed in practice","a":"s5-when-ocp-is-over-engineering","k":"topic"},{"t":"Common mistakes","a":"s5-when-ocp-is-over-engineering","k":"topic"},{"t":"Interview drill","a":"s5-when-ocp-is-over-engineering","k":"topic"},{"t":"Single responsibility: one reason to change, meaning one group of people requesting changes.","a":"s5-when-ocp-is-over-engineering","k":"fact"},{"t":"Split by reason to change, and keep a thin coordinator that calls the pieces and owns no rules.","a":"s5-when-ocp-is-over-engineering","k":"fact"},{"t":"Open/closed: a new variant is a new class behind an interface, not an edit to tested code.","a":"s5-when-ocp-is-over-engineering","k":"fact"},{"t":"Choose which changes to be closed against, based on what the requirements say will vary.","a":"s5-when-ocp-is-over-engineering","k":"fact"},{"t":"Closed sets you own are fine as enum or sealed switches; abstract on the second or third variant, not the first.","a":"s5-when-ocp-is-over-engineering","k":"fact"}]},{"n":4,"f":"04-solid-lsp-isp-dip.html","ti":"SOLID II: Liskov, Interface Segregation & Dependency Inversion","lv":"Principles","e":[{"t":"Liskov substitution: honour the contract","a":"s1-liskov-substitution-honour-the-contract","k":"section"},{"t":"The UnsupportedOperationException smell","a":"s2-the-unsupportedoperationexception-smell","k":"section"},{"t":"Interface segregation: role interfaces","a":"s3-interface-segregation-role-interfaces","k":"section"},{"t":"Dependency inversion: who owns the interface","a":"s4-dependency-inversion-who-owns-the-interf","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"Contract tests: is every BlobStore substitutable?","a":"s1-liskov-substitution-honour-the-contract","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Switching payment providers in a week, not a quarter","a":"s4-dependency-inversion-who-owns-the-interf","k":"topic"},{"t":"Common mistakes","a":"s4-dependency-inversion-who-owns-the-interf","k":"topic"},{"t":"Interview drill","a":"s4-dependency-inversion-who-owns-the-interf","k":"topic"},{"t":"Compiling proves nothing about substitutability; contract tests run against every implementation do.","a":"s4-dependency-inversion-who-owns-the-interf","k":"fact"},{"t":"An implementation that throws “unsupported” means the interface is too big for it: split it.","a":"s4-dependency-inversion-who-owns-the-interf","k":"fact"},{"t":"Interface segregation: give each client a role interface with only what it uses; one class can implement several.","a":"s4-dependency-inversion-who-owns-the-interf","k":"fact"},{"t":"Dependency inversion: business rules own the interfaces, in their own terms; infrastructure implements them.","a":"s4-dependency-inversion-who-owns-the-interf","k":"fact"},{"t":"Point dependencies towards what changes least and matters most.","a":"s4-dependency-inversion-who-owns-the-interf","k":"fact"}]},{"n":5,"f":"05-coupling-cohesion.html","ti":"Coupling, Cohesion & the Law of Demeter","lv":"Principles","e":[{"t":"Coupling: how much a class must know","a":"s1-coupling-how-much-a-class-must-know","k":"section"},{"t":"Cohesion: what belongs together","a":"s2-cohesion-what-belongs-together","k":"section"},{"t":"The Law of Demeter: don't talk to strangers","a":"s3-the-law-of-demeter-don-t-talk-to-strange","k":"section"},{"t":"Seeing coupling: fan-in and fan-out","a":"s4-seeing-coupling-fan-in-and-fan-out","k":"section"},{"t":"DRY, and the wrong abstraction","a":"s5-dry-and-the-wrong-abstraction","k":"section"},{"t":"KISS and YAGNI in an interview","a":"s6-kiss-and-yagni-in-an-interview","k":"section"},{"t":"Check your understanding","a":"s7-check-your-understanding","k":"section"},{"t":"Checkout dependency graph: who breaks when this changes?","a":"s4-seeing-coupling-fan-in-and-fan-out","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Temporal coupling in the JDK: SSLContext","a":"s6-kiss-and-yagni-in-an-interview","k":"topic"},{"t":"Common mistakes","a":"s6-kiss-and-yagni-in-an-interview","k":"topic"},{"t":"Interview drill","a":"s6-kiss-and-yagni-in-an-interview","k":"topic"},{"t":"Cohesion is how well a class's parts belong together: methods that use separate field groups mean separate classes.","a":"s6-kiss-and-yagni-in-an-interview","k":"fact"},{"t":"DRY is about one home for each piece of knowledge, not about merging code that merely looks alike.","a":"s6-kiss-and-yagni-in-an-interview","k":"fact"},{"t":"KISS and YAGNI: extension points only where variation is stated or expected, and say so out loud.","a":"s6-kiss-and-yagni-in-an-interview","k":"fact"}]},{"n":6,"f":"06-relationships.html","ti":"Modeling Relationships","lv":"Principles","e":[{"t":"Relationships are decisions about ownership","a":"s1-relationships-are-decisions-about-owners","k":"section"},{"t":"Composition in Java","a":"s2-composition-in-java","k":"section"},{"t":"Multiplicity becomes a type","a":"s3-multiplicity-becomes-a-type","k":"section"},{"t":"Many-to-many, and when a link becomes a class","a":"s4-many-to-many-and-when-a-link-becomes-a-c","k":"section"},{"t":"Navigate one way unless you need both","a":"s5-navigate-one-way-unless-you-need-both","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Bidirectional links: can the two sides disagree?","a":"s4-many-to-many-and-when-a-link-becomes-a-c","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"The join table is the association class","a":"s5-navigate-one-way-unless-you-need-both","k":"topic"},{"t":"Common mistakes","a":"s5-navigate-one-way-unless-you-need-both","k":"topic"},{"t":"Interview drill","a":"s5-navigate-one-way-unless-you-need-both","k":"topic"},{"t":"Every relationship answers: who creates it, can it be shared, is it deleted with the whole.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"},{"t":"Composition in Java: the whole creates its parts, hides the collection, and takes the parts with it when it goes.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"},{"t":"Multiplicity is a type: final field, Optional, List (ordered), Set (unique), Map (by key), non-empty check for 1..*.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"},{"t":"Many-to-many with data of its own is an association class, like Membership : the in-memory join table.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"},{"t":"Two copies of one link are safe only if one method changes both and nothing else can touch them.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"},{"t":"Default to one-way navigation, and refer to other entities by id to avoid cycles and stale graphs.","a":"s5-navigate-one-way-unless-you-need-both","k":"fact"}]},{"n":7,"f":"07-class-contracts.html","ti":"Class APIs & Contracts","lv":"Principles","e":[{"t":"A method is a contract","a":"s1-a-method-is-a-contract","k":"section"},{"t":"Validate at the boundary, trust inside","a":"s2-validate-at-the-boundary-trust-inside","k":"section"},{"t":"Signatures that are hard to misuse","a":"s3-signatures-that-are-hard-to-misuse","k":"section"},{"t":"Command-query separation","a":"s4-command-query-separation","k":"section"},{"t":"Parameter and return types","a":"s5-parameter-and-return-types","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Misuse lab: does the wrong call still compile?","a":"s3-signatures-that-are-hard-to-misuse","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"The date API everyone got wrong","a":"s5-parameter-and-return-types","k":"topic"},{"t":"Common mistakes","a":"s5-parameter-and-return-types","k":"topic"},{"t":"Interview drill","a":"s5-parameter-and-return-types","k":"topic"},{"t":"A method's contract: preconditions, postconditions, invariants and failure modes. Write it in the Javadoc.","a":"s5-parameter-and-return-types","k":"fact"},{"t":"Validate at public boundaries once, fail fast with a clear message, and trust the data inside.","a":"s5-parameter-and-return-types","k":"fact"},{"t":"Hard-to-misuse signatures use types for meaning: Duration, Money, id types, enums, parameter objects and builders.","a":"s5-parameter-and-return-types","k":"fact"},{"t":"Command-query separation: commands change state, queries return data; neither does both.","a":"s5-parameter-and-return-types","k":"fact"},{"t":"Exception: atomic check-and-act on shared state returns whether it worked ( tryAcquire , putIfAbsent ).","a":"s5-parameter-and-return-types","k":"fact"},{"t":"Accept general types, return specific ones; empty collections, never null; Optional for absence.","a":"s5-parameter-and-return-types","k":"fact"}]},{"n":8,"f":"08-dependency-injection.html","ti":"Dependency Injection & Testability","lv":"Principles","e":[{"t":"new is glue","a":"s1-new-is-glue","k":"section"},{"t":"Constructor injection","a":"s2-constructor-injection","k":"section"},{"t":"The composition root","a":"s3-the-composition-root","k":"section"},{"t":"Fakes: what injection buys in tests","a":"s4-fakes-what-injection-buys-in-tests","k":"section"},{"t":"Two weaker alternatives","a":"s5-two-weaker-alternatives","k":"section"},{"t":"Check your understanding","a":"s6-check-your-understanding","k":"section"},{"t":"Test runner: hard-wired vs injected OrderService","a":"s4-fakes-what-injection-buys-in-tests","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"The bug that only happens at midnight","a":"s5-two-weaker-alternatives","k":"topic"},{"t":"Common mistakes","a":"s5-two-weaker-alternatives","k":"topic"},{"t":"Interview drill","a":"s5-two-weaker-alternatives","k":"topic"},{"t":"new on a collaborator, static lookups, Instant.now() and UUID.randomUUID() are hidden dependencies.","a":"s5-two-weaker-alternatives","k":"fact"},{"t":"Constructor injection: collaborators as interface-typed constructor parameters in final fields, validated non-null.","a":"s5-two-weaker-alternatives","k":"fact"},{"t":"Keep creating values and owned parts with new ; inject collaborators and anything that reaches the outside world.","a":"s5-two-weaker-alternatives","k":"fact"},{"t":"One composition root near main builds the object graph; frameworks only automate it.","a":"s5-two-weaker-alternatives","k":"fact"},{"t":"Injection enables fakes and controllable clocks, which make tests fast, deterministic and able to hit exact boundaries.","a":"s5-two-weaker-alternatives","k":"fact"},{"t":"Service locators and setter injection hide dependencies; a long constructor is an SRP warning, not a reason to hide it.","a":"s5-two-weaker-alternatives","k":"fact"}]},{"n":9,"f":"09-singleton.html","ti":"Singleton (and Why It’s Usually Wrong)","lv":"Design Patterns","e":[{"t":"The pattern, and where it's tempting","a":"s1-the-pattern-and-where-it-s-tempting","k":"section"},{"t":"Lazy initialisation, and its race","a":"s2-lazy-initialisation-and-its-race","k":"section"},{"t":"Five correct versions, and the one to use","a":"s3-five-correct-versions-and-the-one-to-use","k":"section"},{"t":"Why it's usually wrong","a":"s4-why-it-s-usually-wrong","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"Two threads, one lazy singleton: step through the race","a":"s2-lazy-initialisation-and-its-race","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"The tests that only fail together","a":"s4-why-it-s-usually-wrong","k":"topic"},{"t":"Common mistakes","a":"s4-why-it-s-usually-wrong","k":"topic"},{"t":"Interview drill","a":"s4-why-it-s-usually-wrong","k":"topic"},{"t":"Singleton: private constructor plus a static accessor to the one instance.","a":"s4-why-it-s-usually-wrong","k":"fact"},{"t":"Eager static final is thread-safe and already lazy to first class use; it's the default.","a":"s4-why-it-s-usually-wrong","k":"fact"},{"t":"Naive lazy init races; double-checked locking needs volatile to stop half-built objects being seen.","a":"s4-why-it-s-usually-wrong","k":"fact"},{"t":"Holder-class and enum singletons are lazy (or near enough) and thread-safe through the JVM's class-initialisation lock.","a":"s4-why-it-s-usually-wrong","k":"fact"},{"t":"The design cost is global state: hidden dependencies, no substitution, state leaking between tests, a fixed count.","a":"s4-why-it-s-usually-wrong","k":"fact"},{"t":"Prefer one instance created in the composition root and injected: “singleton scope” without the pattern.","a":"s4-why-it-s-usually-wrong","k":"fact"}]},{"n":10,"f":"10-factories.html","ti":"Factory Method & Abstract Factory","lv":"Design Patterns","e":[{"t":"Static factory methods","a":"s1-static-factory-methods","k":"section"},{"t":"Factory Method: let a subclass choose","a":"s2-factory-method-let-a-subclass-choose","k":"section"},{"t":"Abstract Factory: families that must match","a":"s3-abstract-factory-families-that-must-matc","k":"section"},{"t":"Registries instead of switches","a":"s4-registries-instead-of-switches","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"DriverManager: which driver builds this connection?","a":"s4-registries-instead-of-switches","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Test doubles for free with an Abstract Factory","a":"s4-registries-instead-of-switches","k":"topic"},{"t":"Common mistakes","a":"s4-registries-instead-of-switches","k":"topic"},{"t":"Interview drill","a":"s4-registries-instead-of-switches","k":"topic"},{"t":"Static factory methods can be named, return cached instances or hidden subtypes, and validate before creating.","a":"s4-registries-instead-of-switches","k":"fact"},{"t":"Abstract Factory creates a whole family through one interface, so products are never mixed across families.","a":"s4-registries-instead-of-switches","k":"fact"},{"t":"Abstract Factory makes new families cheap and new products expensive.","a":"s4-registries-instead-of-switches","k":"fact"},{"t":"A registry of factories replaces a growing switch; fail fast on unknown keys and duplicates.","a":"s4-registries-instead-of-switches","k":"fact"}]},{"n":11,"f":"11-builder-prototype.html","ti":"Builder & Prototype","lv":"Design Patterns","e":[{"t":"Too many constructor parameters","a":"s1-too-many-constructor-parameters","k":"section"},{"t":"The Builder","a":"s2-the-builder","k":"section"},{"t":"Fluent APIs, and the JDK's own builder","a":"s3-fluent-apis-and-the-jdk-s-own-builder","k":"section"},{"t":"Prototype: copying a configured object","a":"s4-prototype-copying-a-configured-object","k":"section"},{"t":"Check your understanding","a":"s5-check-your-understanding","k":"section"},{"t":"Request builder: the fluent code writes itself","a":"s3-fluent-apis-and-the-jdk-s-own-builder","k":"demo"},{"t":"What you need before this chapter","a":"","k":"topic"},{"t":"Why connection-pool libraries use builders or config objects","a":"s4-prototype-copying-a-configured-object","k":"topic"},{"t":"Common mistakes","a":"s4-prototype-copying-a-configured-object","k":"topic"},{"t":"Interview drill","a":"s4-prototype-copying-a-configured-object","k":"topic"},{"t":"A Builder collects named settings, holds defaults, and creates the object once in build() through a private constructor.","a":"s4-prototype-copying-a-configured-object","k":"fact"},{"t":"Check single values early if useful, and cross-field rules in build() .","a":"s4-prototype-copying-a-configured-object","k":"fact"},{"t":"The builder is mutable and single-use; the product is immutable and shareable.","a":"s4-prototype-copying-a-configured-object","k":"fact"},{"t":"Prototype in Java: with methods, toBuilder() , copy constructors and copy factories.","a":"s4-prototype-copying-a-configured-object","k":"fact"},{"t":"Avoid clone() / Cloneable : no constructor, shallow by default, awkward API.","a":"s4-prototype-copying-a-configured-object","k":"fact"}]},{"n":12,"f":"12-adapter-facade-bridge.html","ti":"Adapter, Facade & Bridge","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":13,"f":"13-decorator-proxy.html","ti":"Decorator & Proxy","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":14,"f":"14-composite-flyweight.html","ti":"Composite & Flyweight","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":15,"f":"15-strategy.html","ti":"Strategy","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":16,"f":"16-observer-mediator.html","ti":"Observer & Mediator","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":17,"f":"17-command-memento.html","ti":"Command & Memento","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":18,"f":"18-state.html","ti":"State","lv":"Design Patterns","e":[{"t":"What this chapter will cover","a":"s1-what-this-chapter-will-cover","k":"section"}]},{"n":19,"f":"19-chain-t
