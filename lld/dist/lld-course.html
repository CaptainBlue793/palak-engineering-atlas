ss=\"k\">this\u003C/span>.lastRefillMillis = nowMillis;\n\t}\n\n\t<span class=\"c\">/** Spends one token if there is one. The check and the change happen together, in here. */\u003C/span>\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">tryAcquire\u003C/span>(<span class=\"k\">long\u003C/span> nowMillis) {\n\t\t<span class=\"f\">refill\u003C/span>(nowMillis);\n\t\t<span class=\"k\">if\u003C/span> (tokens == <span class=\"m\">0\u003C/span>) <span class=\"k\">return false\u003C/span>;\n\t\ttokens--;\n\t\t<span class=\"k\">return true\u003C/span>;\n\t}\n\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">available\u003C/span>() { <span class=\"k\">return\u003C/span> tokens; }     <span class=\"c\">// a read-only view of one number\u003C/span>\n\n\t<span class=\"k\">private void\u003C/span> <span class=\"f\">refill\u003C/span>(<span class=\"k\">long\u003C/span> nowMillis) {\n\t\t<span class=\"k\">long\u003C/span> elapsed = nowMillis - lastRefillMillis;\n\t\t<span class=\"k\">long\u003C/span> earned = elapsed * refillPerSecond / <span class=\"m\">1000\u003C/span>;\n\t\t<span class=\"k\">if\u003C/span> (earned &lt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">return\u003C/span>;\n\t\ttokens = (<span class=\"k\">int\u003C/span>) <span class=\"t\">Math\u003C/span>.<span class=\"f\">min\u003C/span>(capacity, tokens + earned);   <span class=\"c\">// clamp: invariant holds\u003C/span>\n\t\tlastRefillMillis += earned * <span class=\"m\">1000\u003C/span> / refillPerSecond;     <span class=\"c\">// keep the unused fraction of a token\u003C/span>\n\t}\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>How the invariant is kept:\u003C/b> the constructor rejects bad arguments before the object exists, <code>tryAcquire\u003C/code> never decrements below zero, and <code>refill\u003C/code> clamps at <code>capacity\u003C/code>. <code>earned\u003C/code> is a <code>long\u003C/code> so a bucket idle for weeks can't overflow an <code>int\u003C/code>. There is no setter, so no other code can undo any of it. (It is not thread-safe yet; <a href=\"22-thread-safe-classes.html\">Chapter 22\u003C/a> fixes that in this one class.)\u003C/div>\n  \u003C/div>\n  <p>A quick check that the refill arithmetic is right: with a rate of 2 tokens per second and 1,700 ms elapsed, <code>earned\u003C/code> = 1,700 × 2 ÷ 1,000 = 3 (integer division drops the .4). The bucket gains 3 tokens, clamped to capacity. <code>lastRefillMillis\u003C/code> moves forward by 3 × 1,000 ÷ 2 = 1,500 ms, not 1,700, so the leftover 200 ms still counts toward the next token.\u003C/p>\n\n  <h2>Public fields vs a guarded class\u003C/h2>\n  <p>Now compare a version that “just exposes the data”: public fields, or private fields with a getter and a setter for each. Callers then write the rate-limiting logic themselves, as <code>if (b.getTokens() &gt; 0) b.setTokens(b.getTokens() - 1);\u003C/code>. Every caller becomes responsible for the invariant. Try to break each version.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Break the invariant: 0 ≤ tokens ≤ capacity\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"tbMode\"><button class=\"active\" data-v=\"leaky\">Leaky: getters + setters\u003C/button><button data-v=\"safe\">Encapsulated: tryAcquire()\u003C/button>\u003C/div>\n        <span style=\"flex:1\">\u003C/span>\n        <button class=\"btn sm\" id=\"tbReset\">↺ reset\u003C/button>\n      \u003C/div>\n      <div class=\"tb-top\">\n        <div class=\"tb-cells\" id=\"tbCells\">\u003C/div>\n        <span style=\"flex:1\">\u003C/span>\n        <span class=\"tb-badge\" id=\"tbBadge\">\u003C/span>\n      \u003C/div>\n      <div class=\"stats\" id=\"tbStats\">\u003C/div>\n      <div class=\"tb-actions\">\n        <button class=\"btn sm primary\" data-a=\"req\">Handle 1 request\u003C/button>\n        <button class=\"btn sm\" data-a=\"wait\">Wait 1 s (+2 tokens)\u003C/button>\n        <button class=\"btn sm\" data-a=\"neg\">Buggy client: tokens = -3\u003C/button>\n        <button class=\"btn sm\" data-a=\"big\">Admin “reset”: tokens = 1000\u003C/button>\n        <button class=\"btn sm\" data-a=\"race\">Two threads, last token\u003C/button>\n      \u003C/div>\n      <pre class=\"code tb-src\" id=\"tbSrc\">\u003C/pre>\n      <div class=\"log\" id=\"tbLog\" style=\"height:96px;margin-top:10px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">The encapsulated version doesn't need its callers to be careful. The two writes a buggy caller tries don't even compile, and the one place where check-then-act happens is inside the class, so it's the one place to add a lock.\u003C/div>\n  \u003C/div>\n\n  <p>Notice what “private fields with a getter and setter for every one” gives you: nothing. <code>setTokens(-3)\u003C/code> breaks the invariant exactly as <code>tokens = -3\u003C/code> does. You could put validation in the setter, but then you're protecting a single field while the real rule (spend one token only if one exists) still lives in every caller. The fix is not better setters. It's to stop asking callers to manage the state at all, and give them the operation they actually want.\u003C/p>\n\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Name the invariants\u003C/b> One line each: ranges, relationships between fields, things that never change.\u003C/li>\n      <li><b>Make every field private\u003C/b> And <code>final\u003C/code> wherever it never changes after construction.\u003C/li>\n      <li><b>Validate in the constructor\u003C/b> Throw before the object exists, so a broken object is never seen.\u003C/li>\n      <li><b>Expose operations, not fields\u003C/b> <code>tryAcquire()\u003C/code>, not <code>setTokens()\u003C/code>. Each one leaves the invariants true.\u003C/li>\n      <li data-k=\"end\"><b>Guard what leaks out\u003C/b> Never hand out a mutable internal collection or object (next section).\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Designing an encapsulated class,\u003C/b> in the order you'd do it in an interview.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Defensive copies\u003C/h2>\n  <p>Private fields are not enough when a field holds a <b>mutable object\u003C/b>, such as a <code>List\u003C/code>, a <code>Set\u003C/code>, a <code>Map\u003C/code> or a <code>java.util.Date\u003C/code>. From <a href=\"p1-classes-objects.html\">P1\u003C/a> you know that passing or returning an object passes a reference. So if your class stores a caller's list, or returns its own list, some other code now shares your internal state, and <code>private\u003C/code> protects the reference, not the object it points to.\u003C/p>\n  <p>An API key with a set of permission scopes shows the danger. This version looks encapsulated. It isn't:\u003C/p>\n  <div class=\"split\">\n    <div>\n<pre class=\"code\"><span class=\"c\">// Broken: shares its set both ways\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ApiKey\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; scopes;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">ApiKey\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; scopes) {\n\t\t<span class=\"k\">this\u003C/span>.scopes = scopes;       <span class=\"c\">// shared!\u003C/span>\n\t}\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; <span class=\"f\">getScopes\u003C/span>() {\n\t\t<span class=\"k\">return\u003C/span> scopes;              <span class=\"c\">// shared!\u003C/span>\n\t}\n}\n\n<span class=\"c\">// Somewhere in an admin screen:\u003C/span>\nkey.<span class=\"f\">getScopes\u003C/span>().<span class=\"f\">add\u003C/span>(<span class=\"s\">\"admin:write\"\u003C/span>);  <span class=\"c\">// escalated\u003C/span>\u003C/pre>\n    \u003C/div>\n    <div>\n<pre class=\"code\"><span class=\"c\">// Fixed: copy in, expose a question\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ApiKey\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; scopes;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">ApiKey\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; scopes) {\n\t\t<span class=\"k\">this\u003C/span>.scopes = <span class=\"t\">Set\u003C/span>.<span class=\"f\">copyOf\u003C/span>(scopes);\n\t}\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">allows\u003C/span>(<span class=\"t\">String\u003C/span> scope) {\n\t\t<span class=\"k\">return\u003C/span> scopes.<span class=\"f\">contains\u003C/span>(scope);\n\t}\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; <span class=\"f\">scopes\u003C/span>() {\n\t\t<span class=\"k\">return\u003C/span> scopes;             <span class=\"c\">// unmodifiable\u003C/span>\n\t}\n}\u003C/pre>\n    \u003C/div>\n  \u003C/div>\n  <p>The broken version leaks in <b>two\u003C/b> directions. <b>Copy-in:\u003C/b> the caller that built the set still holds a reference to it, so a later <code>set.add(...)\u003C/code> in that code changes the key's permissions. <b>Copy-out:\u003C/b> <code>getScopes()\u003C/code> hands every caller the live internal set. The fix handles both. <code>Set.copyOf\u003C/code> makes a new set that nobody else has a reference to, and that set is unmodifiable, so returning it can't leak either. Most callers don't even need the set: <code>allows(scope)\u003C/code> answers the question they actually have.\u003C/p>\n\n  <figure class=\"seq\" data-actors=\"AdminController|ApiKey (broken)|AuthFilter\">\n    <ol>\n      <li data-m=\"0>1\">key.getScopes()\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">the internal HashSet itself\u003C/li>\n      <li data-m=\"0>0\">set.add(\"admin:write\"), meant for a draft form\u003C/li>\n      <li data-m=\"2>1\">does the key allow \"admin:write\"?\u003C/li>\n      <li data-m=\"1>2\" data-k=\"bad\">yes: the internal set was changed from outside\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Privilege escalation through a getter.\u003C/b> No field was public, and the key's permissions still changed without the key knowing.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>What you return\u003C/th><th>Caller can modify it?\u003C/th><th>Caller sees your later changes?\u003C/th><th>Cost\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>The internal collection\u003C/td><td><b>Yes\u003C/b>: this is the bug\u003C/td><td>Yes\u003C/td><td>Free\u003C/td>\u003C/tr>\n        <tr><td><code>Collections.unmodifiableSet(internal)\u003C/code>\u003C/td><td>No (throws <code>UnsupportedOperationException\u003C/code>)\u003C/td><td>Yes: it is a read-only <i>view\u003C/i>\u003C/td><td>Free, O(1)\u003C/td>\u003C/tr>\n        <tr><td><code>Set.copyOf(internal)\u003C/code> or <code>new HashSet&lt;&gt;(internal)\u003C/code>\u003C/td><td>No for <code>copyOf\u003C/code>; yes for a new HashSet, but only their own copy\u003C/td><td>No: a snapshot\u003C/td><td>O(n) copy per call\u003C/td>\u003C/tr>\n        <tr><td>An internal set that is already unmodifiable (as in the fix)\u003C/td><td>No\u003C/td><td>Nothing to see: it never changes\u003C/td><td>Free\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>One trap in that table: <code>Collections.unmodifiableSet\u003C/code> wraps; it doesn't copy. If you wrap the caller's own set in the constructor, the caller can still change it underneath you. For input, copy. <code>Set.copyOf\u003C/code>, <code>List.copyOf\u003C/code> and <code>Map.copyOf\u003C/code> also reject <code>null\u003C/code> elements with a <code>NullPointerException\u003C/code>, which is usually what you want at a boundary.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Why java.time replaced java.util.Date\u003C/div><p><code>java.util.Date\u003C/code> is mutable: <code>setTime()\u003C/code> changes it in place. So every class that stored a start date, an expiry or a certificate's “not after” time had to copy the <code>Date\u003C/code> on the way in and again on the way out. Forgetting either copy let callers move a deadline from outside, and <i>Effective Java\u003C/i> uses exactly this <code>Period\u003C/code> class as its defensive-copy example. The <code>java.time\u003C/code> types added in Java 8 (<code>Instant\u003C/code>, <code>LocalDate\u003C/code>, <code>Duration\u003C/code>) are immutable, so they can be stored and returned freely with no copies. When you design your own classes, prefer immutable field types for the same reason (<a href=\"p6-value-objects.html\">P6\u003C/a>).\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <h2>Tell, don't ask\u003C/h2>\n  <p>The token-bucket and API-key fixes follow one rule of thumb, usually called <b>tell, don't ask\u003C/b>. Don't ask an object for its data so you can make a decision and write the result back. Tell the object what you want, and let it decide using its own data.\u003C/p>\n  <div class=\"split\">\n    <div class=\"card\"><h4 class=\"mt0\">Asking (logic outside)\u003C/h4>\n<pre class=\"code\"><span class=\"k\">if\u003C/span> (bucket.<span class=\"f\">getTokens\u003C/span>() &gt; <span class=\"m\">0\u003C/span>) {\n\tbucket.<span class=\"f\">setTokens\u003C/span>(bucket.<span class=\"f\">getTokens\u003C/span>() - <span class=\"m\">1\u003C/span>);\n\t<span class=\"f\">handle\u003C/span>(request);\n}\n<span class=\"k\">if\u003C/span> (key.<span class=\"f\">getScopes\u003C/span>().<span class=\"f\">contains\u003C/span>(<span class=\"s\">\"read\"\u003C/span>)) { ... }\u003C/pre>\n      <p class=\"small mb0\">The rule is copied into every caller. Changing it, or making it thread-safe, means finding all of them.\u003C/p>\u003C/div>\n    <div class=\"card\"><h4 class=\"mt0\">Telling (logic inside)\u003C/h4>\n<pre class=\"code\"><span class=\"k\">if\u003C/span> (bucket.<span class=\"f\">tryAcquire\u003C/span>(now)) {\n\t<span class=\"f\">handle\u003C/span>(request);\n}\n\n<span class=\"k\">if\u003C/span> (key.<span class=\"f\">allows\u003C/span>(<span class=\"s\">\"read\"\u003C/span>)) { ... }\u003C/pre>\n      <p class=\"small mb0\">The rule lives in one method, next to the data it needs. Callers can't get it wrong.\u003C/p>\u003C/div>\n  \u003C/div>\n  <p>This isn't a ban on getters. <code>available()\u003C/code> for a dashboard, or <code>userId()\u003C/code> for a log line, are fine: reading a value to <i>display\u003C/i> or <i>pass along\u003C/i> is harmless. The smell is reading a value in order to <i>make a decision about the object and then change it\u003C/i>. That decision belongs inside the object. You'll see this again as “feature envy” in <a href=\"29-smells-refactoring.html\">Chapter 29\u003C/a>, and as the reason anemic data-only classes are an anti-pattern in <a href=\"21-patterns-together.html\">Chapter 21\u003C/a>.\u003C/p>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Generating a getter and setter for every field.\u003C/b> That is a struct with extra typing. Add operations callers need, and add getters only for values they need to read.\u003C/li>\n      <li><b>Leaving out the modifier and thinking it's private.\u003C/b> No modifier means package-private: every class in the package can reach it.\u003C/li>\n      <li><b>Storing a caller's collection directly.\u003C/b> Copy it in the constructor, or the caller can change your state later.\u003C/li>\n      <li><b>Returning an internal mutable collection or Date.\u003C/b> Return an unmodifiable view, a copy, or better, a method that answers the caller's real question.\u003C/li>\n      <li><b>Validating in a setter but not the constructor.\u003C/b> Objects built with bad arguments start life broken. Validate at every entry point.\u003C/li>\n      <li><b>Checking the invariant only in tests.\u003C/b> Tests find some violations; making the fields private and the operations complete prevents all of them from outside.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Isn't encapsulation just making fields private and adding getters and setters?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>No. Private fields are the mechanism; the goal is that the class alone keeps its invariants. A public setter for every field lets any caller put the object into any state, so it protects nothing. Encapsulation means exposing operations that each leave the object valid, like <code>tryAcquire()\u003C/code> instead of <code>setTokens()\u003C/code>, validating in the constructor, and not leaking mutable internals through getters.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> An <code>Account\u003C/code> class must never have more than 100 open orders. In review you see <code>public List&lt;Order&gt; getOrders() { return orders; }\u003C/code>. What can go wrong, and how would you fix it?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Any caller can do <code>account.getOrders().add(order)\u003C/code> and bypass the limit, or remove orders without the account knowing, because the getter returns the live internal list. I'd add an operation that enforces the rule, <code>placeOrder(Order)\u003C/code>, which throws or returns false at 100. Then I'd change the getter to return <code>Collections.unmodifiableList(orders)\u003C/code> if callers need a live read-only view, or <code>List.copyOf(orders)\u003C/code> for a snapshot. If callers only ever count or search, I'd offer <code>openOrderCount()\u003C/code> or <code>findOrder(id)\u003C/code> and drop the list getter entirely.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Encapsulation means a class alone controls its state, so the rules it promises can't be broken from outside.\u003C/li>\n      <li>Fields are private, always. No modifier means package-private, and protected is wider than package-private.\u003C/li>\n      <li>An invariant must hold after the constructor and after every public method; validate arguments before the object exists.\u003C/li>\n      <li>Getters and setters for every field protect nothing. Expose operations like <code>tryAcquire()\u003C/code> that keep the invariants true.\u003C/li>\n      <li>Copy mutable inputs in (<code>List.copyOf\u003C/code>) and never return mutable internals. An unmodifiable wrapper is a view, not a copy.\u003C/li>\n      <li>Tell, don't ask: put the decision inside the object that owns the data.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">A field is declared as <code>int tokens;\u003C/code> with no modifier. Which code can read and write it?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Only the class itself: no modifier means private\u003C/button>\n        <button class=\"opt\">Any code anywhere: no modifier means public\u003C/button>\n        <button class=\"opt\">The class itself and every class in the same package\u003C/button>\n        <button class=\"opt\">The class itself and its subclasses only\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Leaving out the modifier gives package-private access: the declaring class plus every class in the same package. To restrict it to the class, you must write <code>private\u003C/code>.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">A <code>TokenBucket\u003C/code> has private fields but a public <code>setTokens(int)\u003C/code> with no validation, and callers write <code>if (b.getTokens() &gt; 0) b.setTokens(b.getTokens() - 1)\u003C/code>. What is the core design problem?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The class can't guarantee 0 ≤ tokens ≤ capacity: any caller can set any value, and the spending rule is copied into every caller\u003C/button>\n        <button class=\"opt\">Getters are slower than reading a field directly\u003C/button>\n        <button class=\"opt\">The fields should be public so callers don't need getters\u003C/button>\n        <button class=\"opt\">Nothing: the fields are private, so it is encapsulated\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Private fields with an unchecked setter give callers full control of the state, so the class can promise nothing. The fix is an operation like <code>tryAcquire()\u003C/code> that does the check and the change inside the class.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">An <code>ApiKey\u003C/code> constructor does <code>this.scopes = scopes;\u003C/code>. The code that created the key later runs <code>scopes.add(\"admin:write\")\u003C/code> on its own variable. What happens, and what is the fix?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Nothing happens: the key has a private field, so the caller's change goes to a different set\u003C/button>\n        <button class=\"opt\">It throws, because the key's field is <code>final\u003C/code>\u003C/button>\n        <button class=\"opt\">The key gains the scope; fix it by making the field <code>final\u003C/code>\u003C/button>\n        <button class=\"opt\">The key gains the scope; fix it by copying in the constructor, e.g. <code>Set.copyOf(scopes)\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The key stored a reference to the caller's set, so both share one object. <code>final\u003C/code> only stops the field being re-pointed; the set itself can still change. Copying in the constructor gives the key its own set that no one else can reach.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A class returns <code>Collections.unmodifiableList(orders)\u003C/code> from a getter, and later adds a new order to <code>orders\u003C/code> internally. What does a caller holding the returned list see?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The old contents: unmodifiableList made a copy\u003C/button>\n        <button class=\"opt\">The new order too, because it is a read-only view; but the caller can't add or remove\u003C/button>\n        <button class=\"opt\">An exception the next time it reads the list\u003C/button>\n        <button class=\"opt\">The new order, and the caller can also add orders through it\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>unmodifiableList\u003C/code> wraps the original list without copying. Reads go through to the live list, and writes throw <code>UnsupportedOperationException\u003C/code>. Use <code>List.copyOf\u003C/code> when you want a snapshot.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Why is <code>if (bucket.tryAcquire(now)) handle(req);\u003C/code> a better design than <code>if (bucket.available() &gt; 0) { bucket.take(); handle(req); }\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Method calls with fewer characters run faster\u003C/button>\n        <button class=\"opt\">It avoids needing a return value\u003C/button>\n        <button class=\"opt\">The check and the change happen together inside the class, so the rule lives in one place and there's one method to make thread-safe\u003C/button>\n        <button class=\"opt\">It lets callers skip the refill step when they are in a hurry\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">“Tell, don't ask.” Splitting the check (<code>available\u003C/code>) from the action (<code>take\u003C/code>) puts the rule in every caller and leaves a gap between check and act where another thread can take the last token. One method closes both problems.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const CAP = 5, RATE = 2;\n  let mode = 'leaky', tokens = CAP, served = 0, rejected = 0;\n  const log = $('#tbLog');\n\n  const SRC = {\n    leaky: {\n      req:  'if (b.getTokens() > 0) {\\n    b.setTokens(b.getTokens() - 1);   // every caller repeats this\\n    handle(req);\\n}',\n      wait: 'b.refill(now);                          // +2 per second, capped by... whoever remembers',\n      neg:  'b.setTokens(-3);                        // compiles and runs',\n      big:  'b.setTokens(1000);                      // \"reset\" the limiter: compiles and runs',\n      race: '// thread A and thread B, same instant:\\nif (b.getTokens() > 0)                  // A sees 1, B sees 1\\n    b.setTokens(b.getTokens() - 1);     // both write 0: two requests, one token',\n    },\n    safe: {\n      req:  'if (bucket.tryAcquire(now)) handle(req);   // the rule lives inside',\n      wait: 'bucket.tryAcquire(later);                  // refill happens inside, clamped to capacity',\n      neg:  'bucket.tokens = -3;\\n// error: tokens has private access in TokenBucket',\n      big:  'bucket.setTokens(1000);\\n// error: cannot find symbol: method setTokens(int)',\n      race: '// thread A and thread B, same instant:\\nbucket.tryAcquire(now);   // with tryAcquire synchronized (Chapter 22),\\nbucket.tryAcquire(now);   // exactly one of them gets the last token',\n    },\n  };\n\n  function draw() {\n    const ok = tokens >= 0 && tokens <= CAP;\n    let cells = '';\n    if (tokens < 0) cells = `<span class=\"tb-neg\">tokens = ${tokens}\u003C/span>`;\n    else {\n      for (let k = 0; k < CAP; k++) cells += `<div class=\"tb-cell${k < tokens ? ' full' : ''}\">${k < tokens ? '●' : ''}\u003C/div>`;\n      if (tokens > CAP) cells += `<div class=\"tb-cell over\">+\u003C/div><span class=\"tb-neg\">${tokens - CAP} over capacity\u003C/span>`;\n    }\n    $('#tbCells').innerHTML = cells;\n    const b = $('#tbBadge');\n    b.className = 'tb-badge ' + (ok ? 'ok' : 'bad');\n    b.textContent = ok ? `✓ 0 ≤ ${tokens} ≤ ${CAP}` : `✗ invariant broken: tokens = ${tokens}`;\n    $('#tbStats').innerHTML = `\n      <div class=\"stat\"><div class=\"k\">Tokens\u003C/div><div class=\"v\">${tokens}<small> / ${CAP}\u003C/small>\u003C/div>\u003C/div>\n      <div class=\"stat good\"><div class=\"k\">Requests served\u003C/div><div class=\"v\">${served}\u003C/div>\u003C/div>\n      <div class=\"stat warn\"><div class=\"k\">Rejected (429)\u003C/div><div class=\"v\">${rejected}\u003C/div>\u003C/div>`;\n  }\n  function show(a) { $('#tbSrc').textContent = SRC[mode][a]; }\n\n  function act(a) {\n    show(a);\n    const leaky = mode === 'leaky';\n    if (a === 'req') {\n      if (tokens > 0) { tokens--; served++; LLD.log(log, `Request served. ${tokens} token(s) left.`, 'ok'); }\n      else { rejected++; LLD.log(log, 'No tokens: request rejected with 429 Too Many Requests.', 'warn'); }\n    } else if (a === 'wait') {\n      if (leaky && (tokens < 0 || tokens > CAP)) { tokens += RATE; LLD.log(log, `Refill added ${RATE}, starting from a broken value. The bug compounds: tokens = ${tokens}.`, 'bad'); }\n      else { const before = tokens; tokens = Math.min(CAP, tokens + RATE); LLD.log(log, `One second passes: +${tokens - before} token(s), clamped at ${CAP}.`, ''); }\n    } else if (a === 'neg' || a === 'big') {\n      if (leaky) {\n        tokens = a === 'neg' ? -3 : 1000;\n        LLD.log(log, a === 'neg' ? 'A caller wrote -3. The limiter is now in a state its own code never produces.' : 'An admin tool wrote 1000. The next 1000 requests sail through a limit of 5.', 'bad');\n      } else {\n        LLD.log(log, 'Compile error. The field is private and there is no setter, so this code can\\'t even be written.', 'ok');\n      }\n    } else if (a === 'race') {\n      tokens = 1;\n      if (leaky) { tokens = 0; served += 2; LLD.log(log, 'One token left. Both threads read 1, both write 0, both handle their request: 2 served for 1 token.', 'bad'); }\n      else { tokens = 0; served += 1; rejected += 1; LLD.log(log, 'One token left. The check and decrement happen inside one guarded method: 1 served, 1 rejected.', 'ok'); }\n    }\n    draw();\n  }\n\n  function reset() { tokens = CAP; served = 0; rejected = 0; log.innerHTML = ''; $('#tbSrc').textContent = mode === 'leaky' ? '// callers get getTokens() and setTokens(int)' : '// callers get tryAcquire(now) and available()'; draw(); }\n  $$('.tb-actions button').forEach((b) => b.addEventListener('click', () => act(b.dataset.a)));\n  $$('#tbMode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; reset(); }));\n  $('#tbReset').onclick = reset;\n  reset();\n})();\n"]},"p3-inheritance-dispatch.html":{"title":"Inheritance &amp; Dynamic Dispatch","chapter":"0.3","styles":"\n  .dr-pick { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:760px) { .dr-pick { grid-template-columns:1fr; } }\n  .dr-pick label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }\n  .dr-pick select { width:100%; margin-top:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:13px; }\n  .dr-stmt { font-family:var(--mono); font-size:14px; margin:14px 0 4px; padding:10px 14px; border-radius:10px; background:#0d1117; color:#e6edf3; border:1px solid var(--border); overflow-x:auto; }\n  .dr-tables { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:900px) { .dr-tables { grid-template-columns:1fr; } }\n  .vt { border:1.5px solid var(--border); border-radius:12px; overflow:hidden; font-family:var(--mono); font-size:12.5px; background:var(--surface-2); transition:border-color .25s, box-shadow .25s; }\n  .vt.run { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }\n  .vt .h { padding:7px 10px; font-weight:800; border-bottom:1px solid var(--border); background:var(--surface); }\n  .vt .h small { font-weight:500; color:var(--muted); }\n  .vt .r { display:flex; justify-content:space-between; gap:8px; padding:5px 10px; border-top:1px dashed var(--border); }\n  .vt .r:first-of-type { border-top:0; }\n  .vt .r .impl { color:var(--muted); }\n  .vt .r.own .impl { color:var(--accent); font-weight:700; }\n  .vt .r.hit { background:var(--green-soft); }\n  .vt .r.hit .impl { color:var(--green); font-weight:800; }\n  .vt .r.absent { opacity:.4; }\n  .dr-verdict { margin-top:12px; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .dr-verdict.ok { background:var(--green-soft); }\n  .dr-verdict.err { background:var(--red-soft); }\n  .dr-verdict b { font-family:var(--mono); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 3\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>Inheritance &amp; Dynamic <span class=\"grad\">Dispatch\u003C/span>\u003C/h1>\n    <p class=\"lead\">A logging framework calls <code>appender.append(event)\u003C/code> without knowing whether the appender writes to the console, a file or a JSON stream. The right code still runs every time. That is <b>dynamic dispatch\u003C/b>, and it is what makes most design patterns work. Inheritance is one way to get it, and also one of the easiest ways in Java to build something fragile. This chapter covers both sides.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Write a subclass with <code>extends\u003C/code>, call the parent constructor with <code>super(...)\u003C/code>, and reuse parent code with <code>super.method()\u003C/code>\u003C/li>\n      <li>Tell overriding (chosen at run time) from overloading (chosen at compile time)\u003C/li>\n      <li>Predict which method runs for any declared type and runtime class, using the method table\u003C/li>\n      <li>Use <code>@Override\u003C/code> and <code>final\u003C/code> to make intent explicit\u003C/li>\n      <li>Explain the fragile base class problem, and why calling overridable methods from a constructor is a bug\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Classes, objects and references:\u003C/b> a variable of a class type holds a reference to an object on the heap. See <a href=\"p1-classes-objects.html\">P1: Classes, Objects &amp; References\u003C/a>.\u003C/li>\n        <li><b>Access modifiers, especially <code>protected\u003C/code>,\u003C/b> and why fields stay private. See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>extends, super and what a subclass inherits\u003C/h2>\n  <p>A class can <b>extend\u003C/b> one other class. The subclass inherits every non-private method and field of its parent (the <b>superclass\u003C/b>), can add its own, and can <b>override\u003C/b> inherited methods by redefining them with the same signature. Every Java class extends exactly one class; if you don't say which, it extends <code>Object\u003C/code>, which is why every object has <code>toString()\u003C/code>, <code>equals()\u003C/code> and <code>hashCode()\u003C/code>.\u003C/p>\n  <p>A small logging framework shows all of it. An appender takes a message and writes it somewhere:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Appender.java, FileAppender.java, JsonFileAppender.java\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public class\u003C/span> <span class=\"t\">Appender\u003C/span> {\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">append\u003C/span>(<span class=\"t\">String\u003C/span> msg) { <span class=\"t\">System\u003C/span>.out.<span class=\"f\">println\u003C/span>(<span class=\"f\">format\u003C/span>(msg)); }\n\t<span class=\"k\">protected\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">format\u003C/span>(<span class=\"t\">String\u003C/span> msg) { <span class=\"k\">return\u003C/span> <span class=\"s\">\"[\"\u003C/span> + <span class=\"t\">Instant\u003C/span>.<span class=\"f\">now\u003C/span>() + <span class=\"s\">\"] \"\u003C/span> + msg; }\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">flush\u003C/span>() { <span class=\"t\">System\u003C/span>.out.<span class=\"f\">flush\u003C/span>(); }\n}\n\n<span class=\"k\">public class\u003C/span> <span class=\"t\">FileAppender\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">Appender\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">BufferedWriter\u003C/span> out;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">FileAppender\u003C/span>(<span class=\"t\">BufferedWriter\u003C/span> out) {\n\t\t<span class=\"k\">super\u003C/span>();                                   <span class=\"c\">// run Appender's constructor first\u003C/span>\n\t\t<span class=\"k\">this\u003C/span>.out = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(out);\n\t}\n\t<span class=\"k\">@Override public void\u003C/span> <span class=\"f\">append\u003C/span>(<span class=\"t\">String\u003C/span> msg) { <span class=\"f\">writeLine\u003C/span>(<span class=\"f\">format\u003C/span>(msg)); }  <span class=\"c\">// replaces the parent's\u003C/span>\n\t<span class=\"k\">@Override public void\u003C/span> <span class=\"f\">flush\u003C/span>() { <span class=\"c\">/* out.flush(), wrapped for IOException */\u003C/span> }\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">rotate\u003C/span>() { <span class=\"c\">/* start a new file: only FileAppender has this */\u003C/span> }\n\t<span class=\"k\">private void\u003C/span> <span class=\"f\">writeLine\u003C/span>(<span class=\"t\">String\u003C/span> line) { <span class=\"c\">/* out.write(line); out.newLine(); */\u003C/span> }\n}\n\n<span class=\"k\">public class\u003C/span> <span class=\"t\">JsonFileAppender\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">FileAppender\u003C/span> {\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">JsonFileAppender\u003C/span>(<span class=\"t\">BufferedWriter\u003C/span> out) { <span class=\"k\">super\u003C/span>(out); }\n\t<span class=\"k\">@Override protected\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">format\u003C/span>(<span class=\"t\">String\u003C/span> msg) {          <span class=\"c\">// only formatting changes\u003C/span>\n\t\t<span class=\"k\">return\u003C/span> <span class=\"s\">\"{\\\"ts\\\":\\\"\"\u003C/span> + <span class=\"t\">Instant\u003C/span>.<span class=\"f\">now\u003C/span>() + <span class=\"s\">\"\\\",\\\"msg\\\":\\\"\"\u003C/span> + msg + <span class=\"s\">\"\\\"}\"\u003C/span>;\n\t}\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Reading it:\u003C/b> <code>FileAppender\u003C/code> replaces <code>append\u003C/code> and <code>flush\u003C/code> and adds <code>rotate\u003C/code>. <code>JsonFileAppender\u003C/code> replaces only <code>format\u003C/code>, and inherits everything else from <code>FileAppender\u003C/code>. (Escaping quotes inside <code>msg\u003C/code> is left out to keep the listing short; a real JSON appender must do it.)\u003C/div>\n  \u003C/div>\n  <p>Three details in that listing matter:\u003C/p>\n  <ul>\n    <li><b><code>super(...)\u003C/code> runs the parent's constructor first.\u003C/b> Before a subclass constructor can use <code>this\u003C/code>, the parent part of the object is built. If you don't write <code>super(...)\u003C/code>, Java inserts <code>super()\u003C/code> for you, which fails to compile if the parent has no no-argument constructor.\u003C/li>\n    <li><b><code>super.method()\u003C/code> calls the parent's version\u003C/b> of an overridden method, so an override can extend behaviour instead of replacing it: <code>super.append(msg); metrics.increment();\u003C/code>.\u003C/li>\n    <li><b><code>@Override\u003C/code> asks the compiler to check\u003C/b> that you really are overriding something. Misspell the name, or get a parameter type wrong, and you get a compile error instead of a silent new method.\u003C/li>\n  \u003C/ul>\n\n  <h2>Dynamic dispatch: the object decides\u003C/h2>\n  <p>A variable has a <b>declared type\u003C/b> (also called the static type), fixed when you write the code. The object it refers to has a <b>runtime class\u003C/b>, fixed when the object is created. They can differ, because a variable of type <code>Appender\u003C/code> may hold a reference to any subclass object:\u003C/p>\n<pre class=\"code\"><span class=\"t\">Appender\u003C/span> a = <span class=\"k\">new\u003C/span> <span class=\"t\">JsonFileAppender\u003C/span>(writer);   <span class=\"c\">// declared type Appender, runtime class JsonFileAppender\u003C/span>\na.<span class=\"f\">append\u003C/span>(<span class=\"s\">\"server started\"\u003C/span>);               <span class=\"c\">// which append runs? which format?\u003C/span>\u003C/pre>\n  <p>Java answers in two stages, and the two stages use different types:\u003C/p>\n  <ol>\n    <li><b>Compile time, using the declared type.\u003C/b> The compiler checks that <code>Appender\u003C/code> has an <code>append(String)\u003C/code> method. If it didn't, the code wouldn't compile, whatever the object really is. That's why <code>a.rotate()\u003C/code> is an error here: <code>Appender\u003C/code> has no <code>rotate\u003C/code>.\u003C/li>\n    <li><b>Run time, using the object's class.\u003C/b> The JVM looks up <code>append\u003C/code> in the <b>method table\u003C/b> (often called a <i>vtable\u003C/i>) of the object's actual class. <code>JsonFileAppender\u003C/code> didn't override <code>append\u003C/code>, so its table entry points at <code>FileAppender.append\u003C/code>. That method calls <code>format(msg)\u003C/code>, which is dispatched again through the same table, and the entry for <code>format\u003C/code> points at <code>JsonFileAppender.format\u003C/code>.\u003C/li>\n  \u003C/ol>\n  <p>So the line writes a JSON line to the file. The calling code never mentioned files or JSON. This is what every later pattern leans on: Strategy, Decorator, State and Observer all mean “call a method through a general type and let the object decide”.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Dispatch resolver: which method actually runs?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"dr-pick\">\n        <label>Declared type<select id=\"drDecl\"><option>Appender\u003C/option><option>FileAppender\u003C/option><option>JsonFileAppender\u003C/option>\u003C/select>\u003C/label>\n        <label>Object created<select id=\"drRun\"><option>Appender\u003C/option><option>FileAppender\u003C/option><option selected>JsonFileAppender\u003C/option>\u003C/select>\u003C/label>\n        <label>Call<select id=\"drCall\"><option>append(\"hi\")\u003C/option><option>format(\"hi\")\u003C/option><option>flush()\u003C/option><option>rotate()\u003C/option>\u003C/select>\u003C/label>\n      \u003C/div>\n      <div class=\"dr-stmt\" id=\"drStmt\">\u003C/div>\n      <div class=\"dr-tables\" id=\"drTables\">\u003C/div>\n      <div class=\"dr-verdict\" id=\"drVerdict\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Each class's method table lists every method it can respond to and whose code runs. Purple entries are written in that class; grey ones are inherited. The compiler only checks the declared type; the JVM only looks at the created object's table. (<code>format\u003C/code> is protected, so the call is shown as it would be written from inside the same package.)\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"Logger|Appender a|JVM method table|JsonFileAppender object\">\n    <ol>\n      <li data-m=\"0>1\">a.append(\"server started\")\u003C/li>\n      <li data-m=\"1>2\">look up append in the table of the object's class\u003C/li>\n      <li data-m=\"2>3\">JsonFileAppender entry → FileAppender.append\u003C/li>\n      <li data-m=\"3>2\">append calls this.format(msg): look up again\u003C/li>\n      <li data-m=\"2>3\">entry → JsonFileAppender.format\u003C/li>\n      <li data-m=\"3>0\" data-k=\"reply\">a JSON line is written to the file\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Two dispatches for one call.\u003C/b> A call from inside an inherited method to another overridable method (<code>this.format\u003C/code>) is dispatched through the object's table too. That is powerful, and it is also the root of the fragile base class problem below.\u003C/figcaption>\n  \u003C/figure>\n  <p>Is all this lookup slow? No. The table lookup is one or two memory reads, and the JIT compiler removes it entirely when it sees that a call site only ever meets one class, which is the common case. Don't avoid polymorphism for speed.\u003C/p>\n\n  <h2>Overriding vs overloading\u003C/h2>\n  <p>The two words sound alike and behave completely differently. <b>Overriding\u003C/b> means a subclass redefines a method with the <i>same\u003C/i> signature, and the JVM picks the version at run time from the object's class. <b>Overloading\u003C/b> means one class has several methods with the same name but <i>different\u003C/i> parameter types, and the compiler picks one at compile time from the <i>declared types of the arguments\u003C/i>.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public class\u003C/span> <span class=\"t\">AuditLog\u003C/span> {\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">record\u003C/span>(<span class=\"t\">Object\u003C/span> o) { <span class=\"f\">write\u003C/span>(<span class=\"s\">\"object: \"\u003C/span> + o); }\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">record\u003C/span>(<span class=\"t\">String\u003C/span> s) { <span class=\"f\">write\u003C/span>(<span class=\"s\">\"text: \"\u003C/span> + s); }\n}\n\n<span class=\"t\">Object\u003C/span> payload = <span class=\"s\">\"login ok\"\u003C/span>;   <span class=\"c\">// declared Object, actually a String\u003C/span>\naudit.<span class=\"f\">record\u003C/span>(payload);           <span class=\"c\">// \"object: login ok\": chosen by the declared type, at compile time\u003C/span>\naudit.<span class=\"f\">record\u003C/span>(<span class=\"s\">\"login ok\"\u003C/span>);        <span class=\"c\">// \"text: login ok\"\u003C/span>\u003C/pre>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Overriding\u003C/th><th>Overloading\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Where\u003C/td><td>Subclass redefines a parent's method\u003C/td><td>Several methods in one class (or inherited)\u003C/td>\u003C/tr>\n        <tr><td>Signature\u003C/td><td>Same name, same parameter types\u003C/td><td>Same name, different parameter types\u003C/td>\u003C/tr>\n        <tr><td>Chosen\u003C/td><td>At run time, by the <b>receiver object's\u003C/b> class\u003C/td><td>At compile time, by the <b>arguments' declared\u003C/b> types\u003C/td>\u003C/tr>\n        <tr><td>Checked by\u003C/td><td><code>@Override\u003C/code>\u003C/td><td>Nothing: easy to create by accident\u003C/td>\u003C/tr>\n        <tr><td>Typical use\u003C/td><td>Polymorphism: <code>format\u003C/code>, <code>append\u003C/code>\u003C/td><td>Convenience: <code>println(int)\u003C/code>, <code>println(String)\u003C/code>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>The accidental kind is the classic bug. <code>public boolean equals(Session other)\u003C/code> looks like it overrides <code>Object.equals\u003C/code>, but <code>Object.equals\u003C/code> takes an <code>Object\u003C/code>, so this is an <i>overload\u003C/i>. A <code>HashSet\u003C/code> calls <code>equals(Object)\u003C/code>, never sees your method, and treats equal sessions as different. Put <code>@Override\u003C/code> on it and the compiler rejects it immediately (<a href=\"p6-value-objects.html\">P6\u003C/a> writes <code>equals\u003C/code> properly).\u003C/p>\n\n  <h2>final, and the fragile base class problem\u003C/h2>\n  <p>Overriding lets a subclass change behaviour the parent's own code depends on. That is the source of a whole category of bugs, and the reason Java has <code>final\u003C/code>. A <b>final method\u003C/b> can't be overridden. A <b>final class\u003C/b> can't be extended at all: <code>String\u003C/code> and <code>Integer\u003C/code> are final, which is why nobody can make a <code>String\u003C/code> subclass that mutates.\u003C/p>\n  <p>Here is the best-known example, from <i>Effective Java\u003C/i>. You want a <code>HashSet\u003C/code> that counts how many elements were ever added, so you extend it and override both ways of adding:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public class\u003C/span> <span class=\"t\">InstrumentedHashSet\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; <span class=\"k\">extends\u003C/span> <span class=\"t\">HashSet\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; {\n\t<span class=\"k\">private int\u003C/span> addCount = <span class=\"m\">0\u003C/span>;\n\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">add\u003C/span>(<span class=\"t\">E\u003C/span> e) { addCount++; <span class=\"k\">return super\u003C/span>.<span class=\"f\">add\u003C/span>(e); }\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">addAll\u003C/span>(<span class=\"t\">Collection\u003C/span>&lt;? <span class=\"k\">extends\u003C/span> <span class=\"t\">E\u003C/span>&gt; c) { addCount += c.<span class=\"f\">size\u003C/span>(); <span class=\"k\">return super\u003C/span>.<span class=\"f\">addAll\u003C/span>(c); }\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">addCount\u003C/span>() { <span class=\"k\">return\u003C/span> addCount; }\n}\n\ns.<span class=\"f\">addAll\u003C/span>(<span class=\"t\">List\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"s\">\"a\"\u003C/span>, <span class=\"s\">\"b\"\u003C/span>, <span class=\"s\">\"c\"\u003C/span>));\ns.<span class=\"f\">addCount\u003C/span>();   <span class=\"c\">// 6, not 3\u003C/span>\u003C/pre>\n  <figure class=\"seq\" data-actors=\"client|InstrumentedHashSet|HashSet code (super)\">\n    <ol>\n      <li data-m=\"0>1\">addAll([a, b, c]) → addCount += 3\u003C/li>\n      <li data-m=\"1>2\">super.addAll(c)\u003C/li>\n      <li data-m=\"2>1\">inherited addAll loops: this.add(\"a\") → dispatched to the override, addCount++\u003C/li>\n      <li data-m=\"2>1\">this.add(\"b\") → addCount++\u003C/li>\n      <li data-m=\"2>1\">this.add(\"c\") → addCount++\u003C/li>\n      <li data-m=\"1>0\" data-k=\"bad\">addCount = 6: every element counted twice\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Self-use through dispatch.\u003C/b> <code>HashSet\u003C/code>'s inherited <code>addAll\u003C/code> happens to call <code>add\u003C/code> for each element. That is an internal detail nobody promised, and your override now depends on it.\u003C/figcaption>\n  \u003C/figure>\n  <p>The subclass is correct only if it knows exactly which of the parent's methods call which others, an implementation detail the parent never documented and could change in the next JDK release. That is the <b>fragile base class problem\u003C/b>: changes inside a superclass can break subclasses that never changed. The rule that follows, from the same book, is <b>design for inheritance or prohibit it\u003C/b>. Either document which methods call which (and keep that stable forever), or make the class <code>final\u003C/code>. Every class in this course is <code>final\u003C/code> unless it is deliberately built to be extended. The fix for this particular class is composition, the subject of <a href=\"p5-composition.html\">P5\u003C/a>.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The constructor trap: a base class calling an overridable method\u003C/div><p>Suppose <code>Appender\u003C/code>'s constructor logs a startup line with <code>append(format(\"appender started\"))\u003C/code>, and a subclass overrides <code>format\u003C/code> to prepend a <code>private final String prefix\u003C/code> set in its own constructor. <code>new PrefixAppender(\"app: \")\u003C/code> prints <code>nullappender started\u003C/code>. The subclass constructor calls <code>super()\u003C/code> first, the parent constructor calls <code>format\u003C/code>, dispatch sends it to the subclass's override, and <code>prefix\u003C/code> hasn't been assigned yet, so it is still <code>null\u003C/code>. Even a <code>final\u003C/code> field can be seen before it is set this way. The rule: <b>constructors must not call methods that subclasses can override\u003C/b>. Make such methods <code>private\u003C/code> or <code>final\u003C/code>, or the class <code>final\u003C/code>.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Leaving out <code>@Override\u003C/code>.\u003C/b> A typo or a wrong parameter type silently creates an overload that never gets called.\u003C/li>\n      <li><b>Expecting overloads to be picked by the runtime type.\u003C/b> They are picked from the declared types of the arguments, at compile time.\u003C/li>\n      <li><b>Calling a method that isn't on the declared type.\u003C/b> <code>Appender a = ...; a.rotate()\u003C/code> doesn't compile, even if <code>a\u003C/code> really holds a <code>FileAppender\u003C/code>.\u003C/li>\n      <li><b>Extending a class you don't control\u003C/b> (a JDK collection, a library class) to change its behaviour. Its internal self-calls can double or skip your logic, and can change between versions.\u003C/li>\n      <li><b>Calling overridable methods from a constructor.\u003C/b> The override runs before the subclass's fields are set.\u003C/li>\n      <li><b>Using inheritance only to reuse code.\u003C/b> If the subclass isn't truly a kind of the parent, use composition (<a href=\"p5-composition.html\">P5\u003C/a>).\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What's the difference between overriding and overloading, and when is each one decided?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Overriding is a subclass redefining an inherited method with the same signature. The JVM picks which version runs at run time, from the actual class of the object. Overloading is several methods with the same name and different parameter types. The compiler picks one at compile time, from the declared types of the arguments. So <code>Object o = \"x\"; log(o)\u003C/code> calls <code>log(Object)\u003C/code> even though there's a <code>log(String)\u003C/code>. I always use <code>@Override\u003C/code> so an intended override can't silently become an overload.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Someone extends <code>HashSet\u003C/code> to count additions by overriding <code>add\u003C/code> and <code>addAll\u003C/code>, and the count comes out doubled for <code>addAll\u003C/code>. Explain why, and how you'd design it instead.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>The inherited <code>addAll\u003C/code> is implemented by calling <code>add\u003C/code> for each element, and that call is dynamically dispatched to the overridden <code>add\u003C/code>, so each element is counted once in <code>addAll\u003C/code> and again in <code>add\u003C/code>. The subclass depends on an undocumented implementation detail of its parent, which is the fragile base class problem. I'd use composition instead: a class that implements <code>Set\u003C/code> and holds a private <code>Set\u003C/code>, forwarding every call and counting in its own methods. Then its behaviour depends only on the public <code>Set\u003C/code> contract, not on how <code>HashSet\u003C/code> is written.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>A subclass inherits non-private members, can add its own, and overrides by redefining a method with the same signature. <code>super(...)\u003C/code> builds the parent part first.\u003C/li>\n      <li>The compiler checks calls against the declared type; the JVM runs the version in the object's own method table.\u003C/li>\n      <li>Calls from inside inherited code to overridable methods (<code>this.format()\u003C/code>) are dispatched too.\u003C/li>\n      <li>Overriding is chosen at run time by the receiver; overloading at compile time by the arguments' declared types. Always write <code>@Override\u003C/code>.\u003C/li>\n      <li>Subclasses depend on their parent's internal self-calls: the fragile base class problem. Design for inheritance or make the class <code>final\u003C/code>.\u003C/li>\n      <li>Constructors must not call methods a subclass can override.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">With the chapter's classes, <code>Appender a = new JsonFileAppender(w); a.flush();\u003C/code> runs which method?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>Appender.flush\u003C/code>, because <code>a\u003C/code> is declared as an Appender\u003C/button>\n        <button class=\"opt\"><code>FileAppender.flush\u003C/code>, the nearest override in the object's class chain\u003C/button>\n        <button class=\"opt\"><code>JsonFileAppender.flush\u003C/code>\u003C/button>\n        <button class=\"opt\">It doesn't compile\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The object is a <code>JsonFileAppender\u003C/code>, which doesn't override <code>flush\u003C/code>, so its method-table entry points at the nearest override up the chain: <code>FileAppender.flush\u003C/code>. The declared type only matters for the compile-time check that <code>flush\u003C/code> exists.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\"><code>Appender a = new FileAppender(w); a.rotate();\u003C/code> What happens?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The file is rotated, because the object is a FileAppender\u003C/button>\n        <button class=\"opt\">It throws <code>ClassCastException\u003C/code> at run time\u003C/button>\n        <button class=\"opt\">It silently does nothing\u003C/button>\n        <button class=\"opt\">A compile error: <code>Appender\u003C/code> has no <code>rotate\u003C/code> method\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The compiler checks the call against the declared type, <code>Appender\u003C/code>, which has no <code>rotate\u003C/code>. The runtime class is never consulted for this check. You'd need a variable of type <code>FileAppender\u003C/code> (or a cast) to call it.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">A class has <code>record(Object o)\u003C/code> and <code>record(String s)\u003C/code>. Which runs for <code>Object p = \"ok\"; audit.record(p);\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>record(Object)\u003C/code>: overloads are chosen at compile time from the argument's declared type\u003C/button>\n        <button class=\"opt\"><code>record(String)\u003C/code>: the argument is really a String\u003C/button>\n        <button class=\"opt\">Both run, in declaration order\u003C/button>\n        <button class=\"opt\">It's ambiguous and doesn't compile\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Overload resolution uses the declared type of the argument expression, <code>Object\u003C/code>. Dynamic dispatch applies only to the object the method is called on, not to argument types.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>InstrumentedHashSet\u003C/code> overrides <code>add\u003C/code> (count++) and <code>addAll\u003C/code> (count += size) and calls <code>super\u003C/code> in both. After <code>addAll\u003C/code> of three new elements, what is the count?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">3\u003C/button>\n        <button class=\"opt\">0, because <code>super.addAll\u003C/code> bypasses the overrides\u003C/button>\n        <button class=\"opt\">6, because the inherited <code>addAll\u003C/code> calls <code>add\u003C/code>, which is dispatched to the override\u003C/button>\n        <button class=\"opt\">9\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>addAll\u003C/code> adds 3, then the inherited implementation calls <code>add\u003C/code> once per element, each dispatched to the override, adding 3 more. The subclass silently depends on how its parent is implemented: the fragile base class problem.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A base-class constructor calls <code>format(\"started\")\u003C/code>. A subclass overrides <code>format\u003C/code> to use its <code>private final String prefix\u003C/code>, assigned in its own constructor after <code>super()\u003C/code>. What does the override see?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The prefix, because final fields are set before any constructor runs\u003C/button>\n        <button class=\"opt\"><code>null\u003C/code>, because the parent constructor runs before the subclass assigns <code>prefix\u003C/code>\u003C/button>\n        <button class=\"opt\">A compile error: constructors can't call instance methods\u003C/button>\n        <button class=\"opt\">The parent's <code>format\u003C/code> runs instead, because dispatch is disabled in constructors\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Dispatch works inside constructors, so the override runs, but the subclass's constructor body hasn't run yet, and <code>prefix\u003C/code> still holds its default, <code>null\u003C/code>. Constructors should only call private or final methods.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $ } = LLD;\n  // Each class: parent and the methods it declares itself.\n  const CLS = {\n    Appender:         { parent: null,           own: ['append', 'format', 'flush'] },\n    FileAppender:     { parent: 'Appender',     own: ['append', 'flush', 'rotate'] },\n    JsonFileAppender: { parent: 'FileAppender', own: ['format'] },\n  };\n  const ORDER = ['Appender', 'FileAppender', 'JsonFileAppender'];\n  const METHODS = ['append', 'format', 'flush', 'rotate'];\n  const chain = (c) => { const r = []; for (let k = c; k; k = CLS[k].parent) r.push(k); return r; };       // self, parent, grandparent…\n  const isSub = (c, of) => chain(c).includes(of);\n  const impl = (c, m) => chain(c).find((k) => CLS[k].own.includes(m)) || null;                            // nearest declaring class\n\n  function render() {\n    const decl = $('#drDecl').value, run = $('#drRun').value, call = $('#drCall').value, m = call.split('(')[0];\n    $('#drStmt').textContent = `${decl} a = new ${run}(${run === 'Appender' ? '' : 'w'});  a.${call};`;\n    let verdict, ok = false, hit = null;\n    if (!isSub(run, decl)) {\n      verdict = `<b>Compile error:\u003C/b> incompatible types. A <b>${run}\u003C/b> is not a <b>${decl}\u003C/b>, so it can't be stored in a variable of that type. (A subclass object can go in a parent-typed variable, not the other way round.)`;\n    } else if (!impl(decl, m)) {\n      verdict = `<b>Compile error:\u003C/b> cannot find symbol <b>${m}()\u003C/b> in <b>${decl}\u003C/b>. The compiler only looks at the declared type, even though the object is a ${run}.`;\n    } else {\n      ok = true; hit = impl(run, m);\n      verdict = `Compiles, because <b>${decl}\u003C/b> has <b>${m}\u003C/b>. At run time the JVM looks in <b>${run}\u003C/b>'s table and runs <b>${hit}.${m}\u003C/b>` +\n        (hit === run ? ' (overridden in that class).' : ` (inherited: ${run} doesn't override it).`);\n      if (m === 'append') {\n        const f = impl(run, 'format');\n        verdict += ` Inside it, <b>this.format(msg)\u003C/b> is dispatched again → <b>${f}.format\u003C/b>` + (hit === 'FileAppender' ? ', and the line goes to the file.' : ', and the line goes to the console.');\n      }\n    }\n    $('#drVerdict').className = 'dr-verdict ' + (ok ? 'ok' : 'err');\n    $('#drVerdict').innerHTML = verdict;\n    $('#drTables').innerHTML = ORDER.map((c) => `\n      <div class=\"vt${ok && c === run ? ' run' : ''}\"><div class=\"h\">${c} <small>${CLS[c].parent ? 'extends ' + CLS[c].parent : 'extends Object'}\u003C/small>\u003C/div>` +\n      METHODS.map((mm) => {\n        const w = impl(c, mm);\n        const cls = !w ? 'absent' : (w === c ? 'own' : '') + (ok && c === run && mm === m ? ' hit' : '');\n        return `<div class=\"r ${cls}\"><span>${mm}()\u003C/span><span class=\"impl\">${w ? w + '.' + mm : '—'}\u003C/span>\u003C/div>`;\n      }).join('') + '\u003C/div>').join('');\n  }\n  ['#drDecl', '#drRun', '#drCall'].forEach((s) => $(s).addEventListener('change', render));\n  render();\n})();\n"]},"p4-interfaces-generics.html":{"title":"Interfaces, Abstract Classes &amp; Generics","chapter":"0.4","styles":"\n  .pc-pick { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:760px) { .pc-pick { grid-template-columns:1fr; } }\n  .pc-pick label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }\n  .pc-pick select { width:100%; margin-top:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:13px; }\n  .pc-src { margin:14px 0 0; font-size:13px; }\n  .pc-rows { display:grid; gap:8px; margin-top:12px; }\n  .pc-row { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .pc-row.ok { background:var(--green-soft); }\n  .pc-row.err { background:var(--red-soft); }\n  .pc-row .ic { font-weight:800; font-family:var(--mono); flex:none; }\n  .pc-row.ok .ic { color:var(--green); }\n  .pc-row.err .ic { color:var(--red); }\n  .pc-score { font-family:var(--mono); font-size:12.5px; color:var(--muted); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 4\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>Interfaces, Abstract Classes &amp; <span class=\"grad\">Generics\u003C/span>\u003C/h1>\n    <p class=\"lead\">Nearly every class diagram you draw in this course starts with an interface: <code>Cache\u003C/code>, <code>EvictionPolicy\u003C/code>, <code>RateLimitPolicy\u003C/code>, <code>PaymentGateway\u003C/code>. Interfaces are how you say “any object that can do this” without choosing which one. Generics are how you say it once for every type. This chapter covers both, plus abstract classes, the in-between option, and the wildcard rules that confuse almost everyone the first time.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Program to an interface, and explain what that buys you in a design\u003C/li>\n      <li>Choose between an interface and an abstract class for a given job\u003C/li>\n      <li>Use default methods, and resolve a clash between two of them\u003C/li>\n      <li>Write generic classes and methods, with bounds, and know what type erasure prevents\u003C/li>\n      <li>Apply PECS (“producer extends, consumer super”) to wildcard parameters\u003C/li>\n      <li>Use functional interfaces and lambdas as small, swappable behaviours\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Dynamic dispatch:\u003C/b> the declared type is checked at compile time, and the object's class picks the method at run time. See <a href=\"p3-inheritance-dispatch.html\">P3: Inheritance &amp; Dynamic Dispatch\u003C/a>.\u003C/li>\n        <li><b>Encapsulation:\u003C/b> private fields, operations that keep invariants. See <a href=\"p2-encapsulation.html\">P2\u003C/a>.\u003C/li>\n        <li><b>Using <code>List\u003C/code>, <code>Map\u003C/code> and <code>Optional\u003C/code>\u003C/b> from the standard library, without needing to know how they work inside.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Programming to an interface\u003C/h2>\n  <p>An <b>interface\u003C/b> is a type that lists operations without saying how they're done. A class <b>implements\u003C/b> it by providing every operation. Code that only uses the interface works with any implementation, including ones written years later. That is the single most important move in low-level design, and you already use it: <code>List&lt;String&gt; names = new ArrayList&lt;&gt;();\u003C/code> declares the interface and chooses the implementation in one place.\u003C/p>\n  <p>Here is the cache every later chapter builds on. The service that uses it doesn't know, or need to know, how entries are stored or evicted:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Cache.java: a role, not an implementation\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">K\u003C/span>, <span class=\"t\">V\u003C/span>&gt; {\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">V\u003C/span>&gt; <span class=\"f\">get\u003C/span>(<span class=\"t\">K\u003C/span> key);\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">put\u003C/span>(<span class=\"t\">K\u003C/span> key, <span class=\"t\">V\u003C/span> value);\n\t<span class=\"k\">int\u003C/span> <span class=\"f\">size\u003C/span>();\n\n\t<span class=\"c\">/** Returns the cached value, or loads, stores and returns it. Every implementation gets this for free. */\u003C/span>\n\t<span class=\"k\">default\u003C/span> <span class=\"t\">V\u003C/span> <span class=\"f\">getOrLoad\u003C/span>(<span class=\"t\">K\u003C/span> key, <span class=\"t\">Function\u003C/span>&lt;? <span class=\"k\">super\u003C/span> <span class=\"t\">K\u003C/span>, ? <span class=\"k\">extends\u003C/span> <span class=\"t\">V\u003C/span>&gt; loader) {\n\t\t<span class=\"k\">return\u003C/span> <span class=\"f\">get\u003C/span>(key).<span class=\"f\">orElseGet\u003C/span>(() -&gt; {\n\t\t\t<span class=\"t\">V\u003C/span> v = loader.<span class=\"f\">apply\u003C/span>(key);\n\t\t\t<span class=\"f\">put\u003C/span>(key, v);\n\t\t\t<span class=\"k\">return\u003C/span> v;\n\t\t});\n\t}\n}\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">UserService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">User\u003C/span>&gt; users;             <span class=\"c\">// the interface, not a class\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">UserRepository\u003C/span> repo;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">UserService\u003C/span>(<span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">User\u003C/span>&gt; users, <span class=\"t\">UserRepository\u003C/span> repo) {\n\t\t<span class=\"k\">this\u003C/span>.users = users;\n\t\t<span class=\"k\">this\u003C/span>.repo = repo;\n\t}\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">User\u003C/span> <span class=\"f\">find\u003C/span>(<span class=\"t\">String\u003C/span> id) { <span class=\"k\">return\u003C/span> users.<span class=\"f\">getOrLoad\u003C/span>(id, repo::<span class=\"f\">load\u003C/span>); }\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>What this buys:\u003C/b> start with a simple <code>HashMap\u003C/code>-backed cache, switch to an LRU cache (<a href=\"31-case-lru-cache.html\">Case Study 31\u003C/a>) when memory matters, and give tests a fake that counts hits. <code>UserService\u003C/code> never changes. Each <code>Cache\u003C/code> implementation is a separate class that says <code>implements Cache&lt;K, V&gt;\u003C/code>.\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"UserService|Cache (default getOrLoad)|MapCache|UserRepository\">\n    <ol>\n      <li data-m=\"0>1\">users.getOrLoad(\"u42\", repo::load)\u003C/li>\n      <li data-m=\"1>2\">get(\"u42\"), dispatched to the implementation\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">Optional.empty(): a miss\u003C/li>\n      <li data-m=\"1>3\">loader.apply(\"u42\") → SELECT … WHERE id = 'u42'\u003C/li>\n      <li data-m=\"1>2\">put(\"u42\", user)\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">user (the next call is a hit)\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A default method calling abstract ones.\u003C/b> <code>getOrLoad\u003C/code> is written once in the interface, and its calls to <code>get\u003C/code> and <code>put\u003C/code> dispatch to whichever implementation the service was given.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Interfaces vs abstract classes\u003C/h2>\n  <p>An <b>abstract class\u003C/b> is a class marked <code>abstract\u003C/code>: it can't be instantiated, and it can declare <b>abstract methods\u003C/b> (no body) that subclasses must implement. Unlike an interface it can hold fields and have constructors, so it's the tool for sharing <i>state and code\u003C/i> among closely related classes. The cost is the one you saw in <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a>: a class can extend only one class, and subclasses are coupled to the parent's internals.\u003C/p>\n  <p>A typical good use is a skeleton that does the repetitive work and leaves one step open. Every JSON endpoint in a small web framework decodes errors and encodes responses the same way:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">RequestHandler\u003C/span> { <span class=\"t\">Response\u003C/span> <span class=\"f\">handle\u003C/span>(<span class=\"t\">Request\u003C/span> req); }\n\n<span class=\"k\">public abstract class\u003C/span> <span class=\"t\">JsonHandler\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">RequestHandler\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">JsonCodec\u003C/span> codec;                          <span class=\"c\">// shared state: needs a class\u003C/span>\n\n\t<span class=\"k\">protected\u003C/span> <span class=\"f\">JsonHandler\u003C/span>(<span class=\"t\">JsonCodec\u003C/span> codec) { <span class=\"k\">this\u003C/span>.codec = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(codec); }\n\n\t<span class=\"k\">@Override public final\u003C/span> <span class=\"t\">Response\u003C/span> <span class=\"f\">handle\u003C/span>(<span class=\"t\">Request\u003C/span> req) {    <span class=\"c\">// final: the skeleton can't be broken\u003C/span>\n\t\t<span class=\"k\">try\u003C/span> {\n\t\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Response\u003C/span>.<span class=\"f\">ok\u003C/span>(codec.<span class=\"f\">encode\u003C/span>(<span class=\"f\">process\u003C/span>(req)));\n\t\t} <span class=\"k\">catch\u003C/span> (<span class=\"t\">BadRequestException\u003C/span> e) {\n\t\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Response\u003C/span>.<span class=\"f\">status\u003C/span>(<span class=\"m\">400\u003C/span>, codec.<span class=\"f\">encode\u003C/span>(<span class=\"t\">Map\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"s\">\"error\"\u003C/span>, e.<span class=\"f\">getMessage\u003C/span>())));\n\t\t}\n\t}\n\t<span class=\"k\">protected abstract\u003C/span> <span class=\"t\">Object\u003C/span> <span class=\"f\">process\u003C/span>(<span class=\"t\">Request\u003C/span> req);           <span class=\"c\">// the one step each endpoint writes\u003C/span>\n}\u003C/pre>\n  <p>Notice that the abstract class still <i>implements an interface\u003C/i>. Callers depend on <code>RequestHandler\u003C/code>; <code>JsonHandler\u003C/code> is just one convenient way to implement it. The JDK does the same: <code>List\u003C/code> is the interface, <code>AbstractList\u003C/code> the optional skeleton. This “interface plus skeletal abstract class” pairing gives you the flexibility of the first and the code reuse of the second.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Interface\u003C/th><th>Abstract class\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Instance fields (state)\u003C/td><td>No, only <code>static final\u003C/code> constants\u003C/td><td>Yes\u003C/td>\u003C/tr>\n        <tr><td>Constructors\u003C/td><td>No\u003C/td><td>Yes, called by subclasses via <code>super(...)\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>How many a class can have\u003C/td><td>Any number\u003C/td><td>One\u003C/td>\u003C/tr>\n        <tr><td>Method bodies\u003C/td><td><code>default\u003C/code>, <code>static\u003C/code> and <code>private\u003C/code> methods\u003C/td><td>Any kind, any access level\u003C/td>\u003C/tr>\n        <tr><td>Models\u003C/td><td>A role or capability many unrelated classes can play\u003C/td><td>A shared skeleton for closely related classes\u003C/td>\u003C/tr>\n        <tr><td>Default choice in this course\u003C/td><td><b>Yes\u003C/b>: design to interfaces\u003C/td><td>Only when subclasses genuinely share state or a fixed algorithm\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n\n  <h2>Default methods and the diamond\u003C/h2>\n  <p>A <b>default method\u003C/b> is an interface method with a body. It exists so an interface can grow without breaking every class that already implements it. When Java 8 added <code>forEach\u003C/code> to <code>Iterable\u003C/code> and <code>removeIf\u003C/code> and <code>stream\u003C/code> to <code>Collection\u003C/code>, thousands of collection classes in other libraries kept compiling, because they inherited the default bodies.\u003C/p>\n  <p>Since a class can implement several interfaces, two of them might supply a default method with the same signature. Java resolves it with three rules, applied in order:\u003C/p>\n  <ol>\n    <li><b>Classes win.\u003C/b> A method declared in the class or any superclass beats any interface default.\u003C/li>\n    <li><b>The more specific interface wins.\u003C/b> If <code>JsonSink extends Sink\u003C/code> and both define <code>describe()\u003C/code>, <code>JsonSink\u003C/code>'s version is used.\u003C/li>\n    <li><b>Otherwise you must choose.\u003C/b> If two unrelated interfaces both provide <code>describe()\u003C/code>, the class doesn't compile until it overrides it. It can delegate to one explicitly with <code>Sink.super.describe()\u003C/code>.\u003C/li>\n  \u003C/ol>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">AuditedFileSink\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Sink\u003C/span>, <span class=\"t\">Audited\u003C/span> {\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">describe\u003C/span>() {                    <span class=\"c\">// required: both interfaces have a default describe()\u003C/span>\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Sink\u003C/span>.<span class=\"k\">super\u003C/span>.<span class=\"f\">describe\u003C/span>() + <span class=\"s\">\" (audited)\"\u003C/span>;\n\t}\n\t<span class=\"c\">// ...\u003C/span>\n}\u003C/pre>\n  <p>Default methods are for evolving an interface and for small conveniences built from its abstract methods, like <code>getOrLoad\u003C/code>. They can't touch fields, because interfaces have none. If you find yourself wanting state in a default method, you wanted an abstract class or a separate helper object.\u003C/p>\n
