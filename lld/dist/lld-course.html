tr>\n        <tr><td>Changes over time?\u003C/td><td>Yes: its state changes, its id doesn't\u003C/td><td>No: you replace it with a new value\u003C/td>\u003C/tr>\n        <tr><td><code>equals\u003C/code>/<code>hashCode\u003C/code>\u003C/td><td>By id, or the default identity versions\u003C/td><td>By every field. Must be overridden.\u003C/td>\u003C/tr>\n        <tr><td>Safe to share and cache?\u003C/td><td>Careful: others see its changes\u003C/td><td>Yes, freely, because it never changes\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Designs get much simpler when more of the model is values. <code>Money\u003C/code> with a currency catches “added euros to dollars” in one place. An <code>EmailAddress\u003C/code> type validates once, in its constructor, instead of every method re-checking a raw <code>String\u003C/code>. <a href=\"27-domain-modeling.html\">Chapter 27\u003C/a> builds on this split.\u003C/p>\n\n  <h2>equals and hashCode: the contract\u003C/h2>\n  <p><code>Object.equals\u003C/code> compares identity, the same as <code>==\u003C/code>. For a value object you override it to compare contents. The moment you do, you <b>must\u003C/b> also override <code>hashCode\u003C/code>, because hash-based collections rely on one rule: <b>equal objects must have equal hash codes\u003C/b>. (Unequal objects may share a hash code; that's just a collision.) <code>equals\u003C/code> must also be reflexive, symmetric, transitive, consistent over time, and return <code>false\u003C/code> for <code>null\u003C/code>.\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">HostAndPort.java: a value object written by hand\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">HostAndPort\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> host;\n\t<span class=\"k\">private final int\u003C/span> port;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">HostAndPort\u003C/span>(<span class=\"t\">String\u003C/span> host, <span class=\"k\">int\u003C/span> port) {\n\t\t<span class=\"k\">if\u003C/span> (port &lt; <span class=\"m\">1\u003C/span> || port &gt; <span class=\"m\">65_535\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"bad port: \"\u003C/span> + port);\n\t\t<span class=\"k\">this\u003C/span>.host = host.<span class=\"f\">toLowerCase\u003C/span>(<span class=\"t\">Locale\u003C/span>.ROOT);        <span class=\"c\">// normalise once: DB1 and db1 are the same host\u003C/span>\n\t\t<span class=\"k\">this\u003C/span>.port = port;\n\t}\n\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">equals\u003C/span>(<span class=\"t\">Object\u003C/span> o) {           <span class=\"c\">// Object, not HostAndPort: an override\u003C/span>\n\t\t<span class=\"k\">if\u003C/span> (<span class=\"k\">this\u003C/span> == o) <span class=\"k\">return true\u003C/span>;\n\t\t<span class=\"k\">if\u003C/span> (!(o <span class=\"k\">instanceof\u003C/span> <span class=\"t\">HostAndPort\u003C/span> other)) <span class=\"k\">return false\u003C/span>;   <span class=\"c\">// also handles null\u003C/span>\n\t\t<span class=\"k\">return\u003C/span> port == other.port &amp;&amp; host.<span class=\"f\">equals\u003C/span>(other.host);\n\t}\n\t<span class=\"k\">@Override public int\u003C/span> <span class=\"f\">hashCode\u003C/span>() { <span class=\"k\">return\u003C/span> <span class=\"t\">Objects\u003C/span>.<span class=\"f\">hash\u003C/span>(host, port); }  <span class=\"c\">// same fields as equals\u003C/span>\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">toString\u003C/span>() { <span class=\"k\">return\u003C/span> host + <span class=\"s\">\":\"\u003C/span> + port; }\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>The rule of thumb:\u003C/b> <code>hashCode\u003C/code> uses exactly the fields <code>equals\u003C/code> compares. Because the class is final and immutable, the hash never changes after construction, so the object is safe as a map key forever.\u003C/div>\n  \u003C/div>\n  <p>Why does the rule matter? A <code>HashMap\u003C/code> is an array of <b>buckets\u003C/b>. To store a key it computes <code>key.hashCode()\u003C/code>, uses it to pick one bucket, and puts the entry there. To look a key up it computes the hash again, goes straight to that one bucket, and only then calls <code>equals\u003C/code> on the few entries inside. If two equal keys have different hash codes, the lookup goes to the wrong bucket and never even calls <code>equals\u003C/code>. Break the rule, or change a key's fields after inserting it, and the map loses entries. Watch it happen:\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">HashMap bucket lab: where did my entry go?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"hbMode\"><button class=\"active\" data-v=\"good\">Correct value object\u003C/button><button data-v=\"noHash\">equals without hashCode\u003C/button><button data-v=\"mutable\">Mutable key\u003C/button>\u003C/div>\n        <span style=\"flex:1\">\u003C/span>\n        <button class=\"btn sm\" id=\"hbReset\">↺ reset\u003C/button>\n      \u003C/div>\n      <div class=\"hb-actions\">\n        <button class=\"btn sm primary\" data-a=\"put\">routes.put(new HostAndPort(\"db1\", 5432), \"primary\")\u003C/button>\n        <button class=\"btn sm\" data-a=\"get\">routes.get(new HostAndPort(\"db1\", 5432))\u003C/button>\n        <button class=\"btn sm\" data-a=\"mutate\" id=\"hbMut\">key.setPort(5433), then routes.get(key)\u003C/button>\n      \u003C/div>\n      <div class=\"hb-keys\" id=\"hbKeys\">\u003C/div>\n      <div class=\"hb-grid\" id=\"hbGrid\">\u003C/div>\n      <div class=\"log\" id=\"hbLog\" style=\"height:96px;margin-top:10px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">A real <code>HashMap\u003C/code> starts with 16 buckets and spreads the hash bits first; eight buckets and a simple hash keep the picture readable without changing the idea. In “equals without hashCode” mode, every <code>new\u003C/code> key gets a different identity hash, as <code>Object.hashCode()\u003C/code> does.\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"caller|HashMap|bucket 5\">\n    <ol>\n      <li data-m=\"0>1\">get(new HostAndPort(\"db1\", 5432))\u003C/li>\n      <li data-m=\"1>1\">hash = key.hashCode() → bucket 5\u003C/li>\n      <li data-m=\"1>2\">scan only bucket 5\u003C/li>\n      <li data-m=\"2>2\">for each entry: same hash? then equals(key)?\u003C/li>\n      <li data-m=\"2>0\" data-k=\"reply\">\"primary\"\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A lookup touches one bucket.\u003C/b> <code>equals\u003C/code> is only ever called on keys in the bucket the hash chose, which is why equal keys must hash the same.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Records: value objects in one line\u003C/h2>\n  <p>Writing <code>equals\u003C/code>, <code>hashCode\u003C/code>, <code>toString\u003C/code> and accessors by hand is error-prone. Since Java 16, a <b>record\u003C/b> generates all of them from a list of components, and makes the fields <code>private final\u003C/code>. A <b>compact constructor\u003C/b> is where you validate and normalise:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public record\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(<span class=\"t\">String\u003C/span> host, <span class=\"k\">int\u003C/span> port) {\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">HostAndPort\u003C/span> {                                        <span class=\"c\">// compact constructor: no parameter list\u003C/span>\n\t\t<span class=\"k\">if\u003C/span> (port &lt; <span class=\"m\">1\u003C/span> || port &gt; <span class=\"m\">65_535\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"bad port: \"\u003C/span> + port);\n\t\thost = host.<span class=\"f\">toLowerCase\u003C/span>(<span class=\"t\">Locale\u003C/span>.ROOT);                  <span class=\"c\">// reassign the parameter, then fields are set\u003C/span>\n\t}\n}\n\n<span class=\"k\">public record\u003C/span> <span class=\"t\">Route\u003C/span>(<span class=\"t\">String\u003C/span> path, <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">HostAndPort\u003C/span>&gt; backends) {\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Route\u003C/span> {\n\t\tbackends = <span class=\"t\">List\u003C/span>.<span class=\"f\">copyOf\u003C/span>(backends);                     <span class=\"c\">// a record is only shallowly immutable\u003C/span>\n\t}\n}\n\n<span class=\"k\">var\u003C/span> a = <span class=\"k\">new\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(<span class=\"s\">\"DB1\"\u003C/span>, <span class=\"m\">5432\u003C/span>);\na.<span class=\"f\">host\u003C/span>();                                                   <span class=\"c\">// \"db1\": accessors are named after the components\u003C/span>\na.<span class=\"f\">equals\u003C/span>(<span class=\"k\">new\u003C/span> <span class=\"t\">HostAndPort\u003C/span>(<span class=\"s\">\"db1\"\u003C/span>, <span class=\"m\">5432\u003C/span>));                   <span class=\"c\">// true\u003C/span>\u003C/pre>\n  <p>“Shallowly immutable” is the catch. A record's fields can't be reassigned, but if a component is a mutable object, like an <code>ArrayList\u003C/code>, the list itself can still change, and with it the record's <code>equals\u003C/code> and <code>hashCode\u003C/code>. Copy mutable components in the compact constructor, exactly as <a href=\"p2-encapsulation.html\">P2\u003C/a> copied the API key's scopes. Records can't extend other classes (they already extend <code>Record\u003C/code>), but they can implement interfaces.\u003C/p>\n\n  <h2>Making a class immutable\u003C/h2>\n  <p>An <b>immutable\u003C/b> object's state can't change after its constructor finishes. The recipe is short:\u003C/p>\n  <ol>\n    <li><b>Make the class <code>final\u003C/code>\u003C/b> (or use a record), so no subclass can add mutable state.\u003C/li>\n    <li><b>Make every field <code>private final\u003C/code>.\u003C/b>\u003C/li>\n    <li><b>Provide no setters.\u003C/b> Operations that “change” the value return a new object instead: <code>money.plus(tax)\u003C/code>, <code>instant.plusSeconds(30)\u003C/code>.\u003C/li>\n    <li><b>Copy mutable inputs in, and never hand mutable internals out.\u003C/b>\u003C/li>\n  \u003C/ol>\n  <p>What you get in return is a lot. An immutable object is <b>thread-safe with no locks\u003C/b>, because there is nothing to race on. It is <b>safe as a map key\u003C/b>, because its hash can't change. It can be <b>shared and cached freely\u003C/b>: one <code>HostAndPort\u003C/code> can sit in a thousand routes. And it's <b>easy to reason about\u003C/b>, because it is always exactly what its constructor made. The cost is a new object for every change, which the JVM's allocator and garbage collector handle cheaply for small objects.\u003C/p>\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Why String is immutable\u003C/div><p>Java's <code>String\u003C/code> is final and immutable, and the platform depends on it. The JVM can keep one copy of each string literal and share it everywhere (the string pool). <code>String\u003C/code> caches its own hash code, which is safe only because the contents can't change, and that makes strings fast map keys. And it closes a security hole: code that checks a file path or class name and then uses it can't have the string changed between the check and the use. If <code>String\u003C/code> were mutable, every one of those would need a defensive copy.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <h2>Enums with fields and behaviour\u003C/h2>\n  <p>A Java <code>enum\u003C/code> is a class with a fixed set of instances, created once when the class loads. Because there's exactly one instance of each constant, comparing with <code>==\u003C/code> is correct. Enums can have fields, constructors and methods, so the data and rules about each constant live with the constant instead of in <code>switch\u003C/code> statements scattered around the codebase:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public enum\u003C/span> <span class=\"t\">JobState\u003C/span> {\n\tQUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED;\n\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isTerminal\u003C/span>() { <span class=\"k\">return this\u003C/span> == SUCCEEDED || <span class=\"k\">this\u003C/span> == FAILED || <span class=\"k\">this\u003C/span> == CANCELLED; }\n\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">canMoveTo\u003C/span>(<span class=\"t\">JobState\u003C/span> next) {\n\t\t<span class=\"k\">return switch\u003C/span> (<span class=\"k\">this\u003C/span>) {                           <span class=\"c\">// the compiler checks every constant is handled\u003C/span>\n\t\t\t<span class=\"k\">case\u003C/span> QUEUED  -&gt; next == RUNNING || next == CANCELLED;\n\t\t\t<span class=\"k\">case\u003C/span> RUNNING -&gt; next == SUCCEEDED || next == FAILED || next == CANCELLED;\n\t\t\t<span class=\"k\">case\u003C/span> SUCCEEDED, FAILED, CANCELLED -&gt; <span class=\"k\">false\u003C/span>;\n\t\t};\n\t}\n}\n\n<span class=\"k\">public enum\u003C/span> <span class=\"t\">HttpStatus\u003C/span> {\n\tOK(<span class=\"m\">200\u003C/span>), CREATED(<span class=\"m\">201\u003C/span>), NOT_FOUND(<span class=\"m\">404\u003C/span>), TOO_MANY_REQUESTS(<span class=\"m\">429\u003C/span>), SERVICE_UNAVAILABLE(<span class=\"m\">503\u003C/span>);\n\n\t<span class=\"k\">private final int\u003C/span> code;\n\t<span class=\"t\">HttpStatus\u003C/span>(<span class=\"k\">int\u003C/span> code) { <span class=\"k\">this\u003C/span>.code = code; }\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">code\u003C/span>() { <span class=\"k\">return\u003C/span> code; }\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isRetryable\u003C/span>() { <span class=\"k\">return\u003C/span> code == <span class=\"m\">429\u003C/span> || code == <span class=\"m\">503\u003C/span>; }\n}\u003C/pre>\n  <p>Two tools pair with enums: <code>EnumSet\u003C/code> and <code>EnumMap\u003C/code>, a set and a map specialised for enum keys that are backed by a bit vector or an array, so they're faster and smaller than the hash versions. And one rule: <b>never persist <code>ordinal()\u003C/code>\u003C/b>, the constant's position in the declaration. Insert a new constant in the middle, like <code>PAUSED\u003C/code> after <code>RUNNING\u003C/code>, and every stored number after it now means a different state. Store <code>name()\u003C/code>, or an explicit code field like <code>HttpStatus.code()\u003C/code>. <a href=\"18-state.html\">Chapter 18\u003C/a> grows <code>JobState\u003C/code> into the State pattern.\u003C/p>\n\n  <h2>Money is a value object, never a double\u003C/h2>\n  <p><code>double\u003C/code> is binary floating point. It can't represent 0.1 exactly, so <code>0.1 + 0.2\u003C/code> is <code>0.30000000000000004\u003C/code>, and summing a million cents drifts. For money, use one of two representations, wrapped in a value object that also carries the currency:\u003C/p>\n  <ul>\n    <li><b>A <code>long\u003C/code> of minor units\u003C/b> (cents, paise): exact, fast, and what most payment APIs use. <code>$19.99\u003C/code> is <code>1999\u003C/code>.\u003C/li>\n    <li><b><code>BigDecimal\u003C/code>\u003C/b>, when you need arbitrary precision or rates with many decimal places. Beware one trap: <code>new BigDecimal(\"1.0\").equals(new BigDecimal(\"1.00\"))\u003C/code> is <b>false\u003C/b>, because <code>equals\u003C/code> also compares scale. Compare amounts with <code>compareTo(...) == 0\u003C/code>, or normalise the scale in your value object's constructor.\u003C/li>\n  \u003C/ul>\n<pre class=\"code\"><span class=\"k\">public record\u003C/span> <span class=\"t\">Money\u003C/span>(<span class=\"k\">long\u003C/span> minorUnits, <span class=\"t\">Currency\u003C/span> currency) {\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Money\u003C/span> { <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(currency); }\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Money\u003C/span> <span class=\"f\">plus\u003C/span>(<span class=\"t\">Money\u003C/span> other) {\n\t\t<span class=\"k\">if\u003C/span> (!currency.<span class=\"f\">equals\u003C/span>(other.currency)) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(currency + <span class=\"s\">\" + \"\u003C/span> + other.currency);\n\t\t<span class=\"k\">return new\u003C/span> <span class=\"t\">Money\u003C/span>(<span class=\"t\">Math\u003C/span>.<span class=\"f\">addExact\u003C/span>(minorUnits, other.minorUnits), currency);   <span class=\"c\">// throws on overflow\u003C/span>\n\t}\n}\u003C/pre>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Overriding <code>equals\u003C/code> but not <code>hashCode\u003C/code>.\u003C/b> Equal keys land in different buckets; sets hold duplicates and maps miss lookups.\u003C/li>\n      <li><b>Writing <code>equals(HostAndPort o)\u003C/code>\u003C/b> instead of <code>equals(Object o)\u003C/code>. That's an overload that collections never call. <code>@Override\u003C/code> catches it.\u003C/li>\n      <li><b>Using a mutable object as a map key\u003C/b> and changing it afterwards. Its entry is stranded in the old bucket.\u003C/li>\n      <li><b>Assuming records are deeply immutable.\u003C/b> Copy list, set and map components in the compact constructor.\u003C/li>\n      <li><b>Persisting <code>ordinal()\u003C/code>\u003C/b> of an enum. Reordering or inserting constants silently changes stored data.\u003C/li>\n      <li><b>Money as <code>double\u003C/code>,\u003C/b> or comparing <code>BigDecimal\u003C/code> amounts with <code>equals\u003C/code>.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Why must you override <code>hashCode\u003C/code> whenever you override <code>equals\u003C/code>?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Hash-based collections use <code>hashCode\u003C/code> to pick a bucket and only call <code>equals\u003C/code> on entries in that bucket. The contract says equal objects must have equal hash codes. If I override <code>equals\u003C/code> but keep the identity <code>hashCode\u003C/code>, two equal keys usually land in different buckets, so <code>get\u003C/code> misses and a <code>HashSet\u003C/code> holds duplicates. I compute <code>hashCode\u003C/code> from exactly the fields <code>equals\u003C/code> compares, or I use a record, which generates both consistently.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Design a <code>Money\u003C/code> type for a payments service.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>An immutable value object: a record with a <code>long\u003C/code> of minor units and a <code>Currency\u003C/code>, validated in the compact constructor. No <code>double\u003C/code>, because binary floating point can't represent most decimal amounts exactly. Arithmetic returns new instances, checks that currencies match, and uses <code>Math.addExact\u003C/code> so overflow throws instead of wrapping. Being immutable, it's safe to share across threads and use as a map key. For conversion or tax rates I'd use <code>BigDecimal\u003C/code> with an explicit rounding mode, and compare with <code>compareTo\u003C/code>, not <code>equals\u003C/code>, because <code>equals\u003C/code> also compares scale.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Entities are defined by identity; value objects only by their contents, and should be immutable.\u003C/li>\n      <li>Equal objects must have equal hash codes: override <code>equals(Object)\u003C/code> and <code>hashCode\u003C/code> together, over the same fields.\u003C/li>\n      <li>A HashMap looks in one bucket chosen by the hash. A broken hash, or a key mutated after insertion, loses entries.\u003C/li>\n      <li>Records generate equals, hashCode, toString and accessors, but are only shallowly immutable: copy mutable components.\u003C/li>\n      <li>Immutable objects are thread-safe, safe as keys and freely shareable. Recipe: final class, private final fields, no setters, copies in and out.\u003C/li>\n      <li>Enums hold data and rules per constant; compare with <code>==\u003C/code>, never persist <code>ordinal()\u003C/code>. Money is minor units or BigDecimal, never double.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A class overrides <code>equals\u003C/code> to compare host and port but doesn't override <code>hashCode\u003C/code>. You add two equal instances to a <code>HashSet\u003C/code>. What is the set's size, most likely?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">1, because equals says they're the same\u003C/button>\n        <button class=\"opt\">2, because their identity hash codes differ, so they land in different buckets and equals is never called\u003C/button>\n        <button class=\"opt\">0, because the set rejects keys without hashCode\u003C/button>\n        <button class=\"opt\">It throws an exception on the second add\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The set picks a bucket from <code>hashCode\u003C/code>. The default identity hash differs between the two objects, so the second one goes to a different bucket where there's nothing to compare with. The contract was broken, so the set can't do its job.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">A mutable key is put in a <code>HashMap\u003C/code>, then one of its fields used in <code>hashCode\u003C/code> is changed. What does <code>map.get(sameKeyObject)\u003C/code> return?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The value, because it is literally the same object\u003C/button>\n        <button class=\"opt\">A ConcurrentModificationException\u003C/button>\n        <button class=\"opt\">The value, because HashMap rehashes keys when they change\u003C/button>\n        <button class=\"opt\">Usually <code>null\u003C/code>: the new hash points at a different bucket, and the entry is stranded in the old one\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">HashMap computes the hash once at insertion and never looks again. After the change, lookups go to the bucket for the new hash, while the entry sits in the old one. Keys should be immutable.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\"><code>record Route(String path, List&lt;HostAndPort&gt; backends) {}\u003C/code> is created with an <code>ArrayList\u003C/code> the caller keeps. Is the record immutable?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Only shallowly: the caller can still change the list; copy it with <code>List.copyOf\u003C/code> in a compact constructor\u003C/button>\n        <button class=\"opt\">Yes: record fields are final\u003C/button>\n        <button class=\"opt\">Yes: records copy their components automatically\u003C/button>\n        <button class=\"opt\">No: record fields can be reassigned through setters\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Final fields stop reassignment, not changes to the object a field points at. Records generate no setters, but they don't copy components either. A compact constructor with <code>backends = List.copyOf(backends);\u003C/code> makes it truly immutable.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Why store an amount like $19.99 as <code>long 1999\u003C/code> (cents) rather than <code>double 19.99\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A long uses less memory than a double\u003C/button>\n        <button class=\"opt\">Doubles can't be negative\u003C/button>\n        <button class=\"opt\">Binary floating point can't represent most decimal fractions exactly, so sums drift, while integer cents are exact\u003C/button>\n        <button class=\"opt\">Payment gateways reject decimals\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">0.1 has no exact binary representation, so <code>0.1 + 0.2 != 0.3\u003C/code> in a double, and errors accumulate over many operations. Integer minor units (or BigDecimal) are exact. Both a long and a double are 8 bytes.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Jobs are stored with <code>state.ordinal()\u003C/code>. Someone adds <code>PAUSED\u003C/code> between <code>RUNNING\u003C/code> and <code>SUCCEEDED\u003C/code>. What happens to existing rows?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Nothing: ordinals are fixed when the enum is first compiled\u003C/button>\n        <button class=\"opt\">Stored numbers for SUCCEEDED and later now decode as a different state: succeeded jobs read back as PAUSED\u003C/button>\n        <button class=\"opt\">The application fails to start\u003C/button>\n        <button class=\"opt\">Only new rows are affected\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The ordinal is just the declaration position. Inserting a constant shifts every later one, and old rows are silently misread. Persist <code>name()\u003C/code> or an explicit code.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const N = 8, log = $('#hbLog');\n  let mode = 'good', buckets, keys, nextId, look = null, lookCls = '';\n\n  // A small, deterministic stand-in for Objects.hash(host, port).\n  const valueHash = (host, port) => { let h = 7; for (const c of host) h = (h * 31 + c.charCodeAt(0)) >>> 0; return ((h * 31 + port) >>> 0); };\n  const identityHash = () => (Math.random() * 2 ** 31) >>> 0;\n  function newKey(host, port) {\n    const k = { id: nextId++, host, port, ih: identityHash() };\n    keys.push(k); return k;\n  }\n  const hashOf = (k) => mode === 'noHash' ? k.ih : valueHash(k.host, k.port);\n  const idx = (h) => h % N;\n  const label = (k) => `#${k.id} ${k.host}:${k.port}`;\n\n  function draw() {\n    $('#hbKeys').innerHTML = keys.length ? keys.map((k) => `<span class=\"hb-key\"><b>key #${k.id}\u003C/b> ${k.host}:${k.port} · hash ${hashOf(k)} → bucket ${idx(hashOf(k))}\u003C/span>`).join('') : '<span class=\"muted\">No key objects yet.\u003C/span>';\n    $('#hbGrid').innerHTML = buckets.map((b, i) => `<div class=\"hb${look === i ? ' ' + lookCls : ''}\"><div class=\"i\">[${i}]\u003C/div>` +\n      b.map((e) => `<div class=\"e${idx(hashOf(e.key)) !== i ? ' orphan' : ''}\">${label(e.key)}<br>→ \"${e.val}\"${idx(hashOf(e.key)) !== i ? '<br>stranded' : ''}\u003C/div>`).join('') + '\u003C/div>').join('');\n    $('#hbMut').style.display = mode === 'mutable' ? '' : 'none';\n  }\n  function find(k) {\n    const i = idx(hashOf(k));\n    const e = buckets[i].find((x) => (mode === 'noHash' ? x.key === k || (x.key.host === k.host && x.key.port === k.port) : x.key.host === k.host && x.key.port === k.port) && (mode !== 'noHash' || x.hash === hashOf(k)));\n    return { i, e };\n  }\n  function act(a) {\n    if (a === 'put') {\n      const k = newKey('db1', 5432), h = hashOf(k), i = idx(h);\n      const ex = buckets[i].find((x) => x.hash === h && x.key.host === k.host && x.key.port === k.port);\n      if (ex) { ex.val = 'primary'; LLD.log(log, `put: hash ${h} → bucket ${i}; an equal key is already there, so its value is replaced.`, 'ok'); }\n      else { buckets[i].push({ key: k, hash: h, val: 'primary' }); LLD.log(log, `put: key #${k.id} hashes to ${h} → bucket ${i}. Entry stored.`, ''); }\n      look = i; lookCls = 'look';\n      if (mode === 'noHash' && buckets.flat().length > 1) LLD.log(log, 'Two equal keys, two entries: the map now holds a duplicate.', 'bad');\n    } else if (a === 'get') {\n      const k = newKey('db1', 5432), { i, e } = find(k);\n      look = i; lookCls = e ? 'hit' : 'miss';\n      if (e) LLD.log(log, `get: a new but equal key #${k.id} hashes to bucket ${i}, equals matches → \"${e.val}\".`, 'ok');\n      else {\n        const why = !buckets.flat().length ? 'Nothing stored yet → null.'\n          : buckets[i].length ? 'Same bucket by chance, but HashMap compares the stored hash first, and it differs, so equals is never called → null.'\n          : 'The entry is in another bucket, so equals is never called → null.';\n        LLD.log(log, `get: new key #${k.id} hashes to bucket ${i}. ${why}`, buckets.flat().length ? 'bad' : 'warn');\n      }\n    } else if (a === 'mutate') {\n      const stored = buckets.flat()[0];\n      if (!stored) { LLD.log(log, 'Put an entry first.', 'warn'); return; }\n      const k = stored.key; k.port = 5433;\n      const { i, e } = find(k);\n      look = i; lookCls = e ? 'hit' : 'miss';\n      LLD.log(log, `key #${k.id} changed to ${k.host}:${k.port}. get(key) with the very same object hashes to bucket ${i} → ${e ? '\"' + e.val + '\"' : 'null. The entry is stranded in its old bucket'}.`, e ? 'ok' : 'bad');\n    }\n    draw();\n  }\n  function reset() { buckets = Array.from({ length: N }, () => []); keys = []; nextId = 1; look = null; log.innerHTML = ''; draw(); }\n  $$('.hb-actions button').forEach((b) => b.addEventListener('click', () => act(b.dataset.a)));\n  $$('#hbMode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; reset(); }));\n  $('#hbReset').onclick = reset;\n  reset();\n})();\n"]},"p7-exceptions.html":{"title":"Exceptions &amp; Error Contracts","chapter":"0.7","styles":"\n  .tr-toggles { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }\n  .tr-t { font-family:var(--mono); font-size:12.5px; padding:6px 11px; border-radius:999px; border:1.5px solid var(--border-strong); background:var(--surface-2); color:var(--text-2); cursor:pointer; user-select:none; }\n  .tr-t.on { border-color:var(--red); background:var(--red-soft); color:var(--red); font-weight:700; }\n  .tr-cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-top:12px; }\n  @media (max-width:860px) { .tr-cols { grid-template-columns:1fr; } }\n  .tr-src { margin:0; font-size:12.5px; }\n  .tr-ev { list-style:none; margin:0; padding:0; font-family:var(--mono); font-size:12.5px; }\n  .tr-ev li { display:flex; gap:8px; padding:6px 10px; border-radius:8px; margin-bottom:5px; background:var(--surface-2); border:1px solid var(--border); }\n  .tr-ev li .k { flex:none; width:18px; font-weight:800; }\n  .tr-ev li.ok .k { color:var(--green); }\n  .tr-ev li.bad { background:var(--red-soft); border-color:transparent; }\n  .tr-ev li.bad .k { color:var(--red); }\n  .tr-ev li.close .k { color:var(--accent); }\n  .tr-res { margin-top:10px; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .tr-res.ok { background:var(--green-soft); }\n  .tr-res.bad { background:var(--red-soft); }\n  .tr-res code { font-size:12.5px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 7\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 35 min\u003C/span>\u003C/div>\n    <h1>Exceptions &amp; Error <span class=\"grad\">Contracts\u003C/span>\u003C/h1>\n    <p class=\"lead\">Every method has two contracts: what it returns when things go right, and what happens when they don't. The second one decides whether a gateway timeout gets retried, a declined card gets a friendly message, and a database connection gets returned to the pool. This chapter is about designing that second contract on purpose.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Explain the exception hierarchy, and choose between checked and unchecked exceptions\u003C/li>\n      <li>Design a small exception hierarchy that callers can act on, and wrap low-level errors with their cause\u003C/li>\n      <li>Use try-with-resources, and predict the close order and suppressed exceptions\u003C/li>\n      <li>Choose between returning <code>Optional\u003C/code>, throwing, and returning a result object\u003C/li>\n      <li>Fail fast at boundaries, and avoid swallowing or double-logging exceptions\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Constructor validation and invariants:\u003C/b> throwing <code>IllegalArgumentException\u003C/code> before a bad object exists. See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b>Inheritance,\u003C/b> since exceptions are a class hierarchy and <code>catch\u003C/code> matches subclasses. See <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a>.\u003C/li>\n        <li><b>Interfaces,\u003C/b> because try-with-resources works through the <code>AutoCloseable\u003C/code> interface. See <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>The hierarchy, and checked vs unchecked\u003C/h2>\n  <p>Everything you can <code>throw\u003C/code> extends <code>Throwable\u003C/code>, which splits into two branches. <b><code>Error\u003C/code>\u003C/b> means the JVM itself is in trouble, like <code>OutOfMemoryError\u003C/code> or <code>StackOverflowError\u003C/code>. You almost never catch these. <b><code>Exception\u003C/code>\u003C/b> is for problems a program can reasonably deal with, and it splits again:\u003C/p>\n  <ul>\n    <li><b>Checked exceptions\u003C/b> extend <code>Exception\u003C/code> but not <code>RuntimeException\u003C/code>, like <code>IOException\u003C/code> and <code>SQLException\u003C/code>. The compiler forces every caller to either catch them or declare them with <code>throws\u003C/code>.\u003C/li>\n    <li><b>Unchecked exceptions\u003C/b> extend <code>RuntimeException\u003C/code>, like <code>IllegalArgumentException\u003C/code>, <code>IllegalStateException\u003C/code> and <code>NullPointerException\u003C/code>. The compiler doesn't make anyone handle them.\u003C/li>\n  \u003C/ul>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Checked\u003C/th><th>Unchecked (<code>RuntimeException\u003C/code>)\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Compiler enforces handling?\u003C/td><td>Yes: catch or declare <code>throws\u003C/code>\u003C/td><td>No\u003C/td>\u003C/tr>\n        <tr><td>Meant for\u003C/td><td>Recoverable conditions the <b>immediate caller\u003C/b> can act on\u003C/td><td>Programming errors, broken preconditions, and most failures the immediate caller can't fix\u003C/td>\u003C/tr>\n        <tr><td>Examples\u003C/td><td><code>IOException\u003C/code>, <code>SQLException\u003C/code>, <code>InterruptedException\u003C/code>\u003C/td><td><code>IllegalArgumentException\u003C/code>, <code>IllegalStateException\u003C/code>, <code>UncheckedIOException\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>Cost\u003C/td><td>Every layer in between must mention it; doesn't work inside lambdas like <code>Function\u003C/code>\u003C/td><td>Easy to forget to handle; document with Javadoc <code>@throws\u003C/code>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>A practical rule used in most modern Java codebases: throw <b>unchecked\u003C/b> exceptions for invalid arguments, broken invariants and domain failures, and reserve <b>checked\u003C/b> exceptions for the rare case where every direct caller truly must decide what to do. When a checked exception from a library crosses into your design, translate it at that boundary instead of letting <code>throws SQLException\u003C/code> spread through every layer above.\u003C/p>\n\n  <h2>Designing exceptions callers can act on\u003C/h2>\n  <p>An exception type is an API. The question to design it around is: <b>what will the caller do differently?\u003C/b> A payment client has three kinds of failure, and each needs a different reaction:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Payment failures, grouped by what the caller should do\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public abstract class\u003C/span> <span class=\"t\">PaymentException\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">RuntimeException\u003C/span> {\n\t<span class=\"k\">protected\u003C/span> <span class=\"f\">PaymentException\u003C/span>(<span class=\"t\">String\u003C/span> message, <span class=\"t\">Throwable\u003C/span> cause) { <span class=\"k\">super\u003C/span>(message, cause); }\n\t<span class=\"k\">public abstract boolean\u003C/span> <span class=\"f\">isRetryable\u003C/span>();\n}\n\n<span class=\"c\">/** The bank said no. Show the customer; retrying won't help. */\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">CardDeclinedException\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">PaymentException\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> declineCode;\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">CardDeclinedException\u003C/span>(<span class=\"t\">String\u003C/span> declineCode) { <span class=\"k\">super\u003C/span>(<span class=\"s\">\"card declined: \"\u003C/span> + declineCode, <span class=\"k\">null\u003C/span>); <span class=\"k\">this\u003C/span>.declineCode = declineCode; }\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">declineCode\u003C/span>() { <span class=\"k\">return\u003C/span> declineCode; }\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">isRetryable\u003C/span>() { <span class=\"k\">return false\u003C/span>; }\n}\n\n<span class=\"c\">/** We never got an answer. Safe to retry with the same idempotency key. */\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">GatewayUnavailableException\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">PaymentException\u003C/span> {\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">GatewayUnavailableException\u003C/span>(<span class=\"t\">String\u003C/span> message, <span class=\"t\">Throwable\u003C/span> cause) { <span class=\"k\">super\u003C/span>(message, cause); }\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">isRetryable\u003C/span>() { <span class=\"k\">return true\u003C/span>; }\n}\n\n<span class=\"c\">// Inside the Stripe adapter: translate low-level errors at the boundary, keeping the cause.\u003C/span>\n<span class=\"k\">try\u003C/span> {\n\t<span class=\"k\">return\u003C/span> http.<span class=\"f\">send\u003C/span>(request, <span class=\"t\">BodyHandlers\u003C/span>.<span class=\"f\">ofString\u003C/span>());\n} <span class=\"k\">catch\u003C/span> (<span class=\"t\">HttpTimeoutException\u003C/span> e) {\n\t<span class=\"k\">throw new\u003C/span> <span class=\"t\">GatewayUnavailableException\u003C/span>(<span class=\"s\">\"stripe: no response in 5 s\"\u003C/span>, e);   <span class=\"c\">// e becomes getCause()\u003C/span>\n} <span class=\"k\">catch\u003C/span> (<span class=\"t\">IOException\u003C/span> e) {\n\t<span class=\"k\">throw new\u003C/span> <span class=\"t\">GatewayUnavailableException\u003C/span>(<span class=\"s\">\"stripe: connection failed\"\u003C/span>, e);\n} <span class=\"k\">catch\u003C/span> (<span class=\"t\">InterruptedException\u003C/span> e) {\n\t<span class=\"t\">Thread\u003C/span>.<span class=\"f\">currentThread\u003C/span>().<span class=\"f\">interrupt\u003C/span>();                                         <span class=\"c\">// restore the flag\u003C/span>\n\t<span class=\"k\">throw new\u003C/span> <span class=\"t\">GatewayUnavailableException\u003C/span>(<span class=\"s\">\"stripe: interrupted\"\u003C/span>, e);\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Three habits in one listing:\u003C/b> exception types grouped by the caller's reaction (show, retry), carrying the data the caller needs (<code>declineCode\u003C/code>, <code>isRetryable\u003C/code>); low-level exceptions translated where they enter your design, so <code>HttpTimeoutException\u003C/code> never leaks into the order service; and the original exception passed as the <b>cause\u003C/b>, so the stack trace still shows the socket timeout. (A real <code>HttpClient\u003C/code> call also needs its request and body handler set up; they're left out here.)\u003C/div>\n  \u003C/div>\n  <figure class=\"seq\" data-actors=\"CheckoutController|PaymentService|StripeAdapter|HTTP client\">\n    <ol>\n      <li data-m=\"0>1\">pay(order, card)\u003C/li>\n      <li data-m=\"1>2\">charge(amount, token, idempotencyKey)\u003C/li>\n      <li data-m=\"2>3\">POST /v1/charges\u003C/li>\n      <li data-m=\"3>2\" data-k=\"fail\">HttpTimeoutException\u003C/li>\n      <li data-m=\"2>1\" data-k=\"bad\">GatewayUnavailableException (cause: the timeout)\u003C/li>\n      <li data-m=\"1>1\">isRetryable() → retry once with the same key\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">still failing: 503 with Retry-After\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Each layer speaks its own language.\u003C/b> The adapter turns HTTP errors into payment errors; the service decides on retries using <code>isRetryable()\u003C/code>; the controller turns what's left into an HTTP status. No layer needs to know the layers two below it.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>try-with-resources\u003C/h2>\n  <p>Some objects hold something the garbage collector doesn't manage: a database connection borrowed from a pool, a file handle, a socket. They must be closed on <b>every\u003C/b> path, including when an exception is thrown halfway through. Any class that implements <code>AutoCloseable\u003C/code> can be declared in a <code>try (...)\u003C/code> header, and Java guarantees its <code>close()\u003C/code> runs when the block exits, however it exits:\u003C/p>\n<pre class=\"code\"><span class=\"k\">try\u003C/span> (<span class=\"t\">Connection\u003C/span> conn = dataSource.<span class=\"f\">getConnection\u003C/span>();                 <span class=\"c\">// opened first\u003C/span>\n     <span class=\"t\">PreparedStatement\u003C/span> ps = conn.<span class=\"f\">prepareStatement\u003C/span>(UPDATE_BALANCE)) {  <span class=\"c\">// opened second\u003C/span>\n\tps.<span class=\"f\">setLong\u003C/span>(<span class=\"m\">1\u003C/span>, amount);\n\tps.<span class=\"f\">setString\u003C/span>(<span class=\"m\">2\u003C/span>, accountId);\n\tps.<span class=\"f\">executeUpdate\u003C/span>();\n}                                                                       <span class=\"c\">// ps.close(), then conn.close(): reverse order\u003C/span>\u003C/pre>\n  <p>Resources are closed in <b>reverse order\u003C/b>, because later ones usually depend on earlier ones: the statement belongs to the connection. If the body throws, and then a <code>close()\u003C/code> throws too, Java doesn't let the second exception hide the first. The body's exception propagates, and the close exception is attached to it as a <b>suppressed\u003C/b> exception, visible in the stack trace and through <code>getSuppressed()\u003C/code>. Old-style <code>finally { conn.close(); }\u003C/code> code got this wrong: an exception from <code>close()\u003C/code> in <code>finally\u003C/code> replaced the original one, and the real cause of the failure vanished from the logs.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">try-with-resources tracer: what closes, what's thrown, what's suppressed\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"small muted\">Click a step to make it fail:\u003C/div>\n      <div class=\"tr-toggles\" id=\"trT\">\u003C/div>\n      <div class=\"tr-cols\">\n        <pre class=\"code tr-src\">try (Connection conn = ds.getConnection();\n     PreparedStatement ps =\n         conn.prepareStatement(SQL)) {\n    ps.executeUpdate();          // the body\n}\n// then: ps.close(), conn.close()\u003C/pre>\n        <div><ul class=\"tr-ev\" id=\"trEv\">\u003C/ul>\u003C/div>\n      \u003C/div>\n      <div class=\"tr-res\" id=\"trRes\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Whatever you toggle, <code>close()\u003C/code> is called exactly once on every resource that was opened, so the connection is always handed back to the pool. The first failure is the one that propagates; later failures ride along as suppressed.\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">The outage that one missing close() causes\u003C/div><p>A service has a pool of 10 database connections. One code path borrows a connection and closes it at the end of the method, but not when a query throws. Every failing request now leaks one connection. After ten failures the pool is empty, and every request, including the healthy ones, waits for a connection until it times out. The site is down, and the database is idle. The logs show pool timeouts, not the query error that started it. try-with-resources makes this bug impossible to write, which is why every resource in this course is acquired in a <code>try (...)\u003C/code> header. <a href=\"39-case-connection-pool.html\">Case Study 39\u003C/a> builds the pool, including leak detection.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <h2>Optional, null, exception or result?\u003C/h2>\n  <p>Not every “no” is an error. The contract should say which outcomes are normal and which are failures:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Situation\u003C/th><th>Return\u003C/th><th>Example\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>The thing might legitimately not exist\u003C/td><td><code>Optional&lt;T&gt;\u003C/code>\u003C/td><td><code>Optional&lt;User&gt; findByEmail(EmailAddress e)\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>No results for a query\u003C/td><td>An empty collection, never <code>null\u003C/code>\u003C/td><td><code>List&lt;Order&gt; openOrders(UserId id)\u003C/code> returns <code>List.of()\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>An expected outcome the caller always branches on\u003C/td><td><code>boolean\u003C/code>, or a small result type\u003C/td><td><code>boolean tryAcquire(now)\u003C/code>; <code>sealed interface ChargeResult permits Approved, Declined\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>The operation couldn't do its job\u003C/td><td>Throw\u003C/td><td>Database unreachable; gateway timed out\u003C/td>\u003C/tr>\n        <tr><td>The caller broke the contract\u003C/td><td>Throw, immediately\u003C/td><td><code>IllegalArgumentException(\"port must be 1–65535\")\u003C/code>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p><code>Optional\u003C/code> is for <b>return values\u003C/b>. Don't use it for fields or parameters: an optional parameter is better as an overload, and an optional field is just a nullable field with extra allocation. And never return <code>null\u003C/code> from a method declared to return <code>Optional\u003C/code>, which defeats the whole point.\u003C/p>\n\n  <h2>Fail fast, and never swallow\u003C/h2>\n  <p><b>Fail fast\u003C/b> means detecting a problem as close to its cause as possible and stopping there. A <code>null\u003C/code> accepted by a constructor might not blow up until an hour later, in a different thread, with a stack trace that says nothing about where it came from. Checking arguments at the boundary with <code>Objects.requireNonNull\u003C/code> and explicit range checks turns a mystery into a one-line error message that names the bad value.\u003C/p>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>An exception reaches your code\u003C/b> Decide deliberately; never by default.\u003C/li>\n      <li data-k=\"decision\"><b>Can I fix it here?\u003C/b> Retry, fall back, or use a default. If so, handle it and say so in a log line.\u003C/li>\n      <li data-k=\"decision\"><b>Is it a lower layer's language?\u003C/b> Translate it into your layer's exception type, passing it as the cause.\u003C/li>\n      <li><b>Otherwise, let it propagate\u003C/b> Don't catch it just to log and rethrow. The top level logs it once.\u003C/li>\n      <li data-k=\"end\"><b>At the top level\u003C/b> Log once with full context, and map it to a response: a 4xx, a 5xx, or a failed job.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>What to do with an exception.\u003C/b> Handle, translate or propagate: three options, and “ignore” isn't one of them.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Swallowing:\u003C/b> <code>catch (Exception e) {}\u003C/code>. The failure happened; now nobody will ever know why the data is wrong.\u003C/li>\n      <li><b>Log and rethrow at every layer.\u003C/b> One failure produces five copies of the same stack trace. Log once, at the top.\u003C/li>\n      <li><b>Dropping the cause:\u003C/b> <code>throw new PaymentException(\"failed\")\u003C/code> inside a <code>catch\u003C/code>, without passing <code>e\u003C/code>. The root cause disappears.\u003C/li>\n      <li><b>Catching <code>InterruptedException\u003C/code> and carrying on.\u003C/b> Restore the flag with <code>Thread.currentThread().interrupt()\u003C/code> so the thread can still be stopped.\u003C/li>\n      <li><b>Using exceptions for normal control flow,\u003C/b> like “user not found” in a lookup. Return <code>Optional\u003C/code>.\u003C/li>\n      <li><b>Closing resources by hand in <code>finally\u003C/code>.\u003C/b> It's easy to miss a path, and a close exception can hide the real one. Use try-with-resources.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Checked or unchecked: how do you decide?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I ask whether every direct caller can and must do something specific about the failure. If so, a checked exception makes the compiler enforce it, but that's rare. Programming errors and broken preconditions are unchecked: <code>IllegalArgumentException\u003C/code>, <code>IllegalStateException\u003C/code>. Most domain and infrastructure failures are unchecked too, organised by what the caller does about them, such as a retryable gateway error versus a declined card. Checked exceptions from libraries I translate at the boundary into my own types, keeping the original as the cause.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> In a try-with-resources with a connection and a statement, the query throws, and then closing the statement throws too. What does the caller see?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Resources close in reverse order, statement first, then connection, and both closes run even though the body failed. The query's exception is the one that propagates. The statement's close exception is attached to it as a suppressed exception, visible in the stack trace and through <code>getSuppressed()\u003C/code>. That's the improvement over a manual <code>finally\u003C/code>, where the close exception would replace the query error and hide the real cause.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li><code>Throwable\u003C/code> splits into <code>Error\u003C/code> (don't catch) and <code>Exception\u003C/code>; checked exceptions must be caught or declared, <code>RuntimeException\u003C/code>s needn't be.\u003C/li>\n      <li>Default to unchecked exceptions; group them by what the caller will do, and give them the data the caller needs.\u003C/li>\n      <li>Translate low-level exceptions at your design's boundary, always passing the original as the cause.\u003C/li>\n      <li>try-with-resources closes every opened resource in reverse order; later failures are suppressed, not lost.\u003C/li>\n      <li>Return <code>Optional\u003C/code> for “might not exist”, empty collections for “none”, and throw when the operation couldn't do its job.\u003C/li>\n      <li>Fail fast at boundaries. Handle, translate or propagate; never swallow, and log once at the top.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Which exception is unchecked, so the compiler doesn't force callers to handle it?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>IOException\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>SQLException\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>IllegalArgumentException\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>InterruptedException\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>IllegalArgumentException\u003C/code> extends <code>RuntimeException\u003C/code>, so it's unchecked. The other three extend <code>Exception\u003C/code> but not <code>RuntimeException\u003C/code>, so they're checked.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">In a try-with-resources, the body throws <code>SQLException A\u003C/code>, then a resource's <code>close()\u003C/code> throws <code>SQLException B\u003C/code>. What propagates?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A, with B attached as a suppressed exception\u003C/button>\n        <button class=\"opt\">B, because it happened last\u003C/button>\n        <button class=\"opt\">Both, as two separate exceptions\u003C/button>\n        <button class=\"opt\">Neither: try-with-resources catches them\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The body's exception is the primary one. Exceptions thrown while closing are added to it with <code>addSuppressed\u003C/code>, so the original cause is never masked.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\"><code>try (Connection c = ...; PreparedStatement ps = c.prepareStatement(sql); ResultSet rs = ps.executeQuery()) { ... }\u003C/code>. In what order are they closed?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Connection, PreparedStatement, ResultSet\u003C/button>\n        <button class=\"opt\">Whatever order the garbage collector finds them\u003C/button>\n        <button class=\"opt\">All at once, in parallel\u003C/button>\n        <button class=\"opt\">ResultSet, PreparedStatement, Connection\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Resources close in the reverse of the order they were opened. Each one depends on the one before it, so the most dependent is closed first.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A user lookup can fail in two ways: no user has that email, or the database is unreachable. How should <code>findByEmail\u003C/code> express them?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Return <code>null\u003C/code> for both\u003C/button>\n        <button class=\"opt\">Return <code>Optional.empty()\u003C/code> for no such user; throw for the unreachable database\u003C/button>\n        <button class=\"opt\">Throw a checked exception for both\u003C/button>\n        <button class=\"opt\">Return <code>Optional.empty()\u003C/code> for both\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A missing user is a normal outcome, and <code>Optional\u003C/code> puts it in the return type. An unreachable database means the method couldn't do its job, so it throws. Returning empty for that would make an outage look like “no such user”.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Why write <code>throw new GatewayUnavailableException(\"stripe timed out\", e)\u003C/code> instead of leaving out <code>e\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The constructor requires two arguments\u003C/button>\n        <button class=\"opt\">It makes the exception checked\u003C/button>\n        <button class=\"opt\">It keeps the original exception as the cause, so the stack trace still shows the real low-level failure\u003C/button>\n        <button class=\"opt\">It retries the request automatically\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Passing <code>e\u003C/code> sets <code>getCause()\u003C/code>. Logs print the whole chain (“Caused by: HttpTimeoutException…”), so translating the exception hides the low-level type from callers without hiding it from whoever debugs the failure.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const T = [\n    ['open', 'prepareStatement fails'],\n    ['body', 'executeUpdate throws'],\n    ['psClose', 'ps.close() throws'],\n    ['connClose', 'conn.close() throws'],\n  ];\n  const on = new Set(['body', 'psClose']);\n\n  function run() {\n    const ev = [], sup = [];\n    let primary = null;\n    const fail = (name) => { if (primary) { sup.push(name); return 'suppressed'; } primary = name; return 'primary'; };\n    ev.push(['ok', '✓', 'conn = ds.getConnection()  (borrowed from the pool)']);\n    let psOpen = false;\n    if (on.has('open')) { fail('SQLException: prepare failed'); ev.push(['bad', '✗', 'conn.prepareStatement(SQL) throws, so ps was never opened']); }\n    else { psOpen = true; ev.push(['ok', '✓', 'ps = conn.prepareStatement(SQL)']); }\n    if (psOpen) {\n      if (on.has('body')) { fail('SQLException: constraint violation'); ev.push(['bad', '✗', 'ps.executeUpdate() throws: the body stops here']); }\n      else ev.push(['ok', '✓', 'ps.executeUpdate() → 1 row updated']);\n      if (on.has('psClose')) { const r = fail('SQLException: ps.close failed'); ev.push(['bad', '✗', `ps.close() throws → ${r}`]); }\n      else ev.push(['close', '↩', 'ps.close()']);\n    } else ev.push(['close', '–', 'ps: never opened, so nothing to close']);\n    if (on.has('connClose')) { const r = fail('SQLException: conn.close failed'); ev.push(['bad', '✗', `conn.close() throws → ${r}`]); }\n    else ev.push(['close', '↩', 'conn.close()  (returned to the pool)']);\n\n    $('#trEv').innerHTML = ev.map(([c, k, t]) => `<li class=\"${c}\"><span class=\"k\">${k}\u003C/span><span>${t}\u003C/span>\u003C/li>`).join('');\n    const r = $('#trRes');\n    r.className = 'tr-res ' + (primary ? 'bad' : 'ok');\n    r.innerHTML = primary\n      ? `The caller receives <code>${primary}\u003C/code>` + (sup.length ? `, with ${sup.length} suppressed: ${sup.map((s) => `<code>${s}\u003C/code>`).join(', ')}.` : ', with nothing suppressed.')\n      : 'The block completes normally. Both resources were closed, statement first.';\n  }\n  function draw() {\n    $('#trT').innerHTML = T.map(([k, l]) => `<span class=\"tr-t${on.has(k) ? ' on' : ''}\" data-k=\"${k}\">${on.has(k) ? '✗ ' : ''}${l}\u003C/span>`).join('');\n    $$('.tr-t').forEach((x) => x.onclick = () => { const k = x.dataset.k; on.has(k) ? on.delete(k) : on.add(k); draw(); });\n    run();\n  }\n  draw();\n})();\n"]},"p8-reading-uml.html":{"title":"Reading UML: Class &amp; Sequence Diagrams","chapter":"0.8","styles":"\n  .uml text { font-family:var(--mono); font-size:12px; fill:var(--text); }\n  .uml .box { fill:var(--surface); stroke:var(--border-strong); stroke-width:1.4; }\n  .uml .box.iface { stroke:var(--accent); }\n  .uml .sep { stroke:var(--border-strong); stroke-width:1; }\n  .uml .title { font-weight:800; font-size:12.5px; }\n  .uml .stereo { font-size:10.5px; fill:var(--muted); }\n  .uml .it { font-style:italic; }\n  .uml .ln { stroke:var(--text-2); stroke-width:1.4; fill:none; }\n  .uml .ln.dash { stroke-dasharray:6 4; }\n  .uml .mult { font-size:11.5px; fill:var(--accent); font-weight:700; }\n  .uml .elabel { font-size:10.5px; fill:var(--muted); }\n  .uml .mk-fill { fill:var(--text-2); stroke:var(--text-2); }\n  .uml .mk-hollow { fill:var(--surface); stroke:var(--text-2); stroke-width:1.3; }\n  .uml .mk-open { fill:none; stroke:var(--text-2); stroke-width:1.4; }\n  .legend { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }\n  @media (max-width:760px) { .legend { grid-template-columns:1fr; } }\n  .lg { border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface-2); }\n  .lg svg { width:100%; height:34px; display:block; }\n  .lg b { display:block; margin:4px 0 2px; }\n  .lg code { font-size:12px; }\n  .mq-card { border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface-2); margin-top:12px; }\n  .mq-card pre { margin:0 0 10px; font-size:12.5px; }\n  .mq-opts { display:flex; flex-wrap:wrap; gap:8px; }\n  .mq-opts button.right { background:var(--green-soft); border-color:var(--green); color:var(--green); }\n  .mq-opts button.wrong { background:var(--red-soft); border-color:var(--red); color:var(--red); }\n  .mq-why { margin-top:10px; font-size:14px; min-height:20px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 8\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Reading UML: Class &amp; Sequence <span class=\"grad\">Diagrams\u003C/span>\u003C/h1>\n    <p class=\"lead\">In an LLD round you have a whiteboard and two minutes to show your design before anyone reads code. UML is the shared shorthand for that: boxes for classes, a handful of arrow styles for how they relate, and lifelines for how a request moves through them. You need a small, precise subset of it, and this chapter teaches exactly that subset, in both directions: diagram to Java, and Java to diagram.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Read and draw a class box: name, fields, methods, visibility, static and abstract\u003C/li>\n      <li>Recognise the six relationships (dependency, association, aggregation, composition, inheritance, realization) and write the Java for each\u003C/li>\n      <li>Read multiplicities like <code>1\u003C/code>, <code>0..1\u003C/code> and <code>*\u003C/code>\u003C/li>\n      <li>Read a sequence diagram: lifelines, calls, returns, self-calls and fragments\u003C/li>\n      <li>Keep an interview diagram small enough to be useful\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Access modifiers,\u003C/b> which map directly to UML's + − # ~ symbols. See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b><code>extends\u003C/code> vs <code>implements\u003C/code>,\u003C/b> and interfaces vs abstract classes. See <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a> and <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n        <li><b>Composition:\u003C/b> one object holding and delegating to another. See <a href=\"p5-composition.html\">P5: Composition over Inheritance\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Why a diagram, and how much of UML you need\u003C/h2>\n  <p>UML (the Unified Modeling Language) is huge: fourteen diagram types and a specification hundreds of pages long. An LLD interview uses two of them. A <b>class diagram\u003C/b> shows structure: which classes and interfaces exist and how they relate. A <b>sequence diagram\u003C/b> shows behaviour: which objects call which, in what order, for one use case. Drawn well, the first answers “what did you build?” and the second answers “does it actually work?”, before either of you reads a line of code.\u003C/p>\n  <p>Precision matters more than completeness. A diagram with six boxes and correct arrows beats one with twenty boxes and every getter listed. The interviewer is reading it for your <i>decisions\u003C/i>: what's an interface, who owns whom, where the variation points are.\u003C/p>\n\n  <h2>Class boxes\u003C/h2>\n  <p>A class is a box with up to three compartments: the <b>name\u003C/b>, the <b>fields\u003C/b> (UML calls them attributes) and the <b>methods\u003C/b> (operations). Each member starts with a visibility symbol, and types come <i>after\u003C/i> a colon, the opposite of Java:\u003C/p>\n  <div class=\"split\">\n    <div>\n      <svg class=\"diagram uml\" id=\"umlBox\" viewBox=\"0 0 530 250\" role=\"img\" aria-label=\"Class boxes for the Cache interface and the TokenBucket class\">\u003C/svg>\n    \u003C/div>\n    <div>\n      <div class=\"table-wrap\">\n        <table class=\"t\">\n          <thead><tr><th>UML\u003C/th><th>Java\u003C/th>\u003C/tr>\u003C/thead>\n          <tbody>\n            <tr><td><code>+\u003C/code>\u003C/td><td><code>public\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><code>−\u003C/code>\u003C/td><td><code>private\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><code>#\u003C/code>\u003C/td><td><code>protected\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><code>~\u003C/code>\u003C/td><td>package-private (no modifier)\u003C/td>\u003C/tr>\n            <tr><td><code>- tokens: int\u003C/code>\u003C/td><td><code>private int tokens;\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><code>+ tryAcquire(now: long): boolean\u003C/code>\u003C/td><td><code>public boolean tryAcquire(long now)\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><u>underlined\u003C/u>\u003C/td><td><code>static\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><i>italic\u003C/i> name or method\u003C/td><td><code>abstract\u003C/code>\u003C/td>\u003C/tr>\n            <tr><td><code>«interface»\u003C/code> above the name\u003C/td><td><code>interface\u003C/code>\u003C/td>\u003C/tr>\n          \u003C/tbody>\n        \u003C/table>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n  <p>You can leave out anything that isn't relevant to the point you're making: a compartment, types, even all the fields. In an interview, list the fields that carry the design (the <code>capacity\u003C/code> and <code>tokens\u003C/code> that the invariant is about) and the public methods. Skip getters, setters, <code>equals\u003C/code> and <code>toString\u003C/code>.\u003C/p>\n\n  <h2>The six relationships\u003C/h2>\n  <p>Almost everything interesting in a class diagram is in the lines between boxes. There are six line styles to learn, and each one has a direct Java meaning. Two things are drawn at the <b>target\u003C/b> end of the line (arrowheads and triangles), and one at the <b>source\u003C/b> end (diamonds, which sit on the whole, not the part):\u003C/p>\n  <div class=\"legend\" id=\"umlLegend\">\u003C/div>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Relationship\u003C/th><th>Means\u003C/th><th>In Java\u003C/th><th>Lifetime of the other object\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Dependency\u003C/td><td>“uses, briefly”\u003C/td><td>A parameter, local variable or return type\u003C/td><td>Unrelated\u003C/td>\u003C/tr>\n        <tr><td>Association\u003C/td><td>“knows about, keeps a reference to”\u003C/td><td>A field\u003C/td><td>Independent\u003C/td>\u003C/tr>\n        <tr><td>Aggregation\u003C/td><td>“has, as a loose part”\u003C/td><td>A field (often a collection) of objects that can exist without the whole, or belong to several wholes\u003C/td><td>Independent\u003C/td>\u003C/tr>\n        <tr><td>Composition\u003C/td><td>“owns, as a part”\u003C/td><td>A field of objects the whole creates, manages and doesn't share\u003C/td><td>Dies with the whole\u003C/td>\u003C/tr>\n        <tr><td>Inheritance\u003C/td><td>“is a kind of”\u003C/td><td><code>extends\u003C/code>\u003C/td><td>Same object\u003C/td>\u003C/tr>\n        <tr><td>Realization\u003C/td><td>“implements the role”\u003C/td><td><code>implements\u003C/code>\u003C/td><td>Same object\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Aggregation vs association is the one fuzzy line. In Java both are just a field, and many teams never draw aggregation at all, using a plain association plus a multiplicity instead. Composition is worth drawing, because it answers a real design question: <b>who creates this object, and who is allowed to hold on to it?\u003C/b> A <code>ConnectionPool\u003C/code> creates, hands out and closes its connections: composition. An <code>OnCallRotation\u003C/code> lists engineers who exist anyway and may be in several rotations: aggregation at most.\u003C/p>\n\n  <h2>Multiplicity\u003C/h2>\n  <p>A <b>multiplicity\u003C/b> written near the end of a line says how many objects can be at that end. The common ones are <code>1\u003C/code> (exactly one), <code>0..1\u003C/code> (optional), <code>*\u003C/code> (any number, including zero) and <code>1..*\u003C/code> (at least one). Read it from the far box: in <i>Router ◆— * Route\u003C/i>, the <code>*\u003C/code> sits next to Route and means “one router has any number of routes”. It maps straight to the Java type: <code>1\u003C/code> is a plain field validated non-null, <code>0..1\u003C/code> an <code>Optional\u003C/code> or nullable field, <code>*\u003C/code> a <code>List\u003C/code>, <code>Set\u003C/code> or <code>Map\u003C/code>.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">A whole design on one page: a small HTTP server\u003C/span><span class=\"p-tag\">Diagram\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"svg-scroll\"><svg class=\"diagram uml\" id=\"umlServer\" viewBox=\"0 0 960 430\" role=\"img\" aria-label=\"Class diagram of a small HTTP server\">\u003C/svg>\u003C/div>\n      <ul class=\"small mb0\" style=\"margin-top:10px\">\n        <li><b>HttpServer ◆— 1 Router\u003C/b> and <b>Router ◆— * Route\u003C/b>: the server creates its router and the router its routes; none of them is shared.\u003C/li>\n        <li><b>HttpServer ◇— * Middleware\u003C/b>: middleware objects are passed in and may be shared between servers.\u003C/li>\n        <li><b>Route → 1 RequestHandler\u003C/b>: each route keeps a reference to one handler, which it doesn't own.\u003C/li>\n        <li><b>StaticFileHandler and ApiHandler ⇢▷ RequestHandler\u003C/b>: two implementations of one interface, the variation point of the design.\u003C/li>\n        <li><b>Router ⇢ Request\u003C/b>: the router only receives requests as a parameter to <code>dispatch\u003C/code>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n    <div class=\"panel-foot\">Read it the way an interviewer will: interfaces first (they're the extension points), then diamonds (who owns what), then everything else. Adding a new kind of endpoint means one new class under <code>RequestHandler\u003C/code>, and nothing else changes.\u003C/div>\n  \u003C/div>\n\n  <h2>From Java to a diagram, and back\u003C/h2>\n  <p>The quickest way to get fluent is to translate code into arrows. For each snippet, pick the relationship you'd draw from the <b>first\u003C/b> class to the other one.\u003C/p>\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Java → UML: which line would you draw?\u003C/span><span class=\"p-tag\">Drill\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\"><span class=\"small muted\" id=\"mqCount\">\u003C/span><span style=\"flex:1\">\u003C/span><button class=\"btn sm\" id=\"mqNext\">next ▶\u003C/button><button class=\"btn sm\" id=\"mqReset\">↺ restart\u003C/button>\u003C/div>\n      <div class=\"mq-card\">\n        <pre class=\"code\" id=\"mqCode\">\u003C/pre>\n        <div class=\"mq-opts\" id=\"mqOpts\">\u003C/div>\n        <div class=\"mq-why\" id=\"mqWhy\">\u003C/div>\n      \u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Eight snippets. The tell-tale signs: a field means association or stronger; a parameter or local means dependency; creating the parts and never sharing them means composition.\u003C/div>\n  \u003C/div>\n\n  <h2>Sequence diagrams\u003C/h2>\n  <p>A sequence diagram shows one scenario over time. Each participant is a <b>lifeline\u003C/b>: a box at the top with a vertical dashed line under it. Time runs downwards. Arrows between lifelines are messages, usually method calls, numbered or simply read top to bottom.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Notation\u003C/th><th>Means\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Solid line, filled arrowhead\u003C/td><td>A synchronous call: the caller waits for it to return\u003C/td>\u003C/tr>\n        <tr><td>Dashed line, open arrowhead\u003C/td><td>A return value (often left out when it's obvious)\u003C/td>\u003C/tr>\n        <tr><td>Solid line, open arrowhead\u003C/td><td>An asynchronous message: the sender doesn't wait (a queue publish, an event)\u003C/td>\u003C/tr>\n        <tr><td>An arrow from a lifeline back to itself\u003C/td><td>A self-call: an object calling its own method\u003C/td>\u003C/tr>\n        <tr><td>A thin rectangle on a lifeline\u003C/td><td>An activation: the object is busy running a method\u003C/td>\u003C/tr>\n        <tr><td>A labelled frame: <code>alt [cond]\u003C/code>, <code>opt\u003C/code>, <code>loop\u003C/code>\u003C/td><td>If/else branches, an optional part, a repeated part\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>The sequence diagrams in this course use a simplified style: numbered messages, dashed returns, and red for failures, which is all an interview needs. Here is the request path through the server above, for a client that is over its rate limit on the second try:\u003C/p>\n  <figure class=\"seq\" data-actors=\"Client|HttpServer|RateLimitMiddleware|Router|ApiHandler\">\n    <ol>\n      <li data-m=\"0>1\">GET /api/users/42\u003C/li>\n      <li data-m=\"1>2\">apply(req, next)\u003C/li>\n      <li data-m=\"2>2\">bucket.tryAcquire(now) → true\u003C/li>\n      <li data-m=\"2>3\">next: router.dispatch(req)\u003C/li>\n      <li data-m=\"3>4\">handle(req)\u003C/li>\n      <li data-m=\"4>0\" data-k=\"reply\">200 OK {\"id\": 42, …}\u003C/li>\n      <li data-m=\"0>1\">GET /api/users/42 (again, too soon)\u003C/li>\n      <li data-m=\"1>2\">apply(req, next)\u003C/li>\n      <li data-m=\"2>0\" data-k=\"bad\">tryAcquire → false: 429 Too Many Requests\u003C/li>\n    \u003C/ol>\n    <figcaption><b>One scenario, two requests.\u003C/b> Reading down the lifelines checks the class diagram: every arrow here must match a relationship above. The middleware is the one place that decides on rate limiting, so the second request never reaches the router.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">How the diagram is used in a real LLD round\u003C/div><p>A typical 45-minute round spends minutes 5 to 15 on the class diagram, and the interviewer's follow-ups are almost always about it: “where would you add a new payment method?” (point at the interface), “who deletes a booking's seat holds?” (point at the composition diamond), “what happens when two requests hit this at once?” (walk a sequence diagram). A small, correct diagram turns each follow-up into pointing and a sentence. <a href=\"01-lld-interview.html\">Chapter 1\u003C/a> lays out the full timeline, and every case study from <a href=\"31-case-lru-cache.html\">Chapter 31\u003C/a> on starts from a class diagram like the one above.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Diamond on the wrong end.\u003C/b> It goes on the <i>whole\u003C/i> (Order), not the part (LineItem).\u003C/li>\n      <li><b>Triangle pointing the wrong way.\u003C/b> The hollow triangle points at the parent or interface: “this is a kind of that”.\u003C/li>\n      <li><b>Solid line with a triangle for an interface.\u003C/b> Implementing an interface is a <i>dashed\u003C/i> line with a hollow triangle.\u003C/li>\n      <li><b>Drawing a field as a dependency.\u003C/b> A field is association or stronger; dependency is for parameters and locals.\u003C/li>\n      <li><b>Listing every getter and setter.\u003C/b> They hide the methods that matter. Show the operations that carry the design.\u003C/li>\n      <li><b>Twenty boxes.\u003C/b> Draw the core six to eight, and add detail only where the interviewer asks.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What's the difference between aggregation and composition, and how would each look in Java?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Both are whole-part relationships held in a field. With composition the whole owns the parts' lifecycle: it creates them, doesn't share them, and they go away with it, like a connection pool and its pooled connections, or an order and its line items. With aggregation the parts exist independently and can belong to several wholes, like engineers in an on-call rotation. In Java the difference shows up in who calls <code>new\u003C/code> and whether references to the parts ever leave the class. Composition is a filled diamond on the whole; aggregation a hollow one.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> You
