ructor calls <code>format(\"started\")\u003C/code>. A subclass overrides <code>format\u003C/code> to use its <code>private final String prefix\u003C/code>, assigned in its own constructor after <code>super()\u003C/code>. What does the override see?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The prefix, because final fields are set before any constructor runs\u003C/button>\n        <button class=\"opt\"><code>null\u003C/code>, because the parent constructor runs before the subclass assigns <code>prefix\u003C/code>\u003C/button>\n        <button class=\"opt\">A compile error: constructors can't call instance methods\u003C/button>\n        <button class=\"opt\">The parent's <code>format\u003C/code> runs instead, because dispatch is disabled in constructors\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Dispatch works inside constructors, so the override runs, but the subclass's constructor body hasn't run yet, and <code>prefix\u003C/code> still holds its default, <code>null\u003C/code>. Constructors should only call private or final methods.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $ } = LLD;\n  // Each class: parent and the methods it declares itself.\n  const CLS = {\n    Appender:         { parent: null,           own: ['append', 'format', 'flush'] },\n    FileAppender:     { parent: 'Appender',     own: ['append', 'flush', 'rotate'] },\n    JsonFileAppender: { parent: 'FileAppender', own: ['format'] },\n  };\n  const ORDER = ['Appender', 'FileAppender', 'JsonFileAppender'];\n  const METHODS = ['append', 'format', 'flush', 'rotate'];\n  const chain = (c) => { const r = []; for (let k = c; k; k = CLS[k].parent) r.push(k); return r; };       // self, parent, grandparent…\n  const isSub = (c, of) => chain(c).includes(of);\n  const impl = (c, m) => chain(c).find((k) => CLS[k].own.includes(m)) || null;                            // nearest declaring class\n\n  function render() {\n    const decl = $('#drDecl').value, run = $('#drRun').value, call = $('#drCall').value, m = call.split('(')[0];\n    $('#drStmt').textContent = `${decl} a = new ${run}(${run === 'Appender' ? '' : 'w'});  a.${call};`;\n    let verdict, ok = false, hit = null;\n    if (!isSub(run, decl)) {\n      verdict = `<b>Compile error:\u003C/b> incompatible types. A <b>${run}\u003C/b> is not a <b>${decl}\u003C/b>, so it can't be stored in a variable of that type. (A subclass object can go in a parent-typed variable, not the other way round.)`;\n    } else if (!impl(decl, m)) {\n      verdict = `<b>Compile error:\u003C/b> cannot find symbol <b>${m}()\u003C/b> in <b>${decl}\u003C/b>. The compiler only looks at the declared type, even though the object is a ${run}.`;\n    } else {\n      ok = true; hit = impl(run, m);\n      verdict = `Compiles, because <b>${decl}\u003C/b> has <b>${m}\u003C/b>. At run time the JVM looks in <b>${run}\u003C/b>'s table and runs <b>${hit}.${m}\u003C/b>` +\n        (hit === run ? ' (overridden in that class).' : ` (inherited: ${run} doesn't override it).`);\n      if (m === 'append') {\n        const f = impl(run, 'format');\n        verdict += ` Inside it, <b>this.format(msg)\u003C/b> is dispatched again → <b>${f}.format\u003C/b>` + (hit === 'FileAppender' ? ', and the line goes to the file.' : ', and the line goes to the console.');\n      }\n    }\n    $('#drVerdict').className = 'dr-verdict ' + (ok ? 'ok' : 'err');\n    $('#drVerdict').innerHTML = verdict;\n    $('#drTables').innerHTML = ORDER.map((c) => `\n      <div class=\"vt${ok && c === run ? ' run' : ''}\"><div class=\"h\">${c} <small>${CLS[c].parent ? 'extends ' + CLS[c].parent : 'extends Object'}\u003C/small>\u003C/div>` +\n      METHODS.map((mm) => {\n        const w = impl(c, mm);\n        const cls = !w ? 'absent' : (w === c ? 'own' : '') + (ok && c === run && mm === m ? ' hit' : '');\n        return `<div class=\"r ${cls}\"><span>${mm}()\u003C/span><span class=\"impl\">${w ? w + '.' + mm : '—'}\u003C/span>\u003C/div>`;\n      }).join('') + '\u003C/div>').join('');\n  }\n  ['#drDecl', '#drRun', '#drCall'].forEach((s) => $(s).addEventListener('change', render));\n  render();\n})();\n"]},"p4-interfaces-generics.html":{"title":"Interfaces, Abstract Classes &amp; Generics","chapter":"0.4","styles":"\n  .pc-pick { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:760px) { .pc-pick { grid-template-columns:1fr; } }\n  .pc-pick label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }\n  .pc-pick select { width:100%; margin-top:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:var(--mono); font-size:13px; }\n  .pc-src { margin:14px 0 0; font-size:13px; }\n  .pc-rows { display:grid; gap:8px; margin-top:12px; }\n  .pc-row { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-radius:12px; font-size:14px; }\n  .pc-row.ok { background:var(--green-soft); }\n  .pc-row.err { background:var(--red-soft); }\n  .pc-row .ic { font-weight:800; font-family:var(--mono); flex:none; }\n  .pc-row.ok .ic { color:var(--green); }\n  .pc-row.err .ic { color:var(--red); }\n  .pc-score { font-family:var(--mono); font-size:12.5px; color:var(--muted); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 4\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>Interfaces, Abstract Classes &amp; <span class=\"grad\">Generics\u003C/span>\u003C/h1>\n    <p class=\"lead\">Nearly every class diagram you draw in this course starts with an interface: <code>Cache\u003C/code>, <code>EvictionPolicy\u003C/code>, <code>RateLimitPolicy\u003C/code>, <code>PaymentGateway\u003C/code>. Interfaces are how you say “any object that can do this” without choosing which one. Generics are how you say it once for every type. This chapter covers both, plus abstract classes, the in-between option, and the wildcard rules that confuse almost everyone the first time.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Program to an interface, and explain what that buys you in a design\u003C/li>\n      <li>Choose between an interface and an abstract class for a given job\u003C/li>\n      <li>Use default methods, and resolve a clash between two of them\u003C/li>\n      <li>Write generic classes and methods, with bounds, and know what type erasure prevents\u003C/li>\n      <li>Apply PECS (“producer extends, consumer super”) to wildcard parameters\u003C/li>\n      <li>Use functional interfaces and lambdas as small, swappable behaviours\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Dynamic dispatch:\u003C/b> the declared type is checked at compile time, and the object's class picks the method at run time. See <a href=\"p3-inheritance-dispatch.html\">P3: Inheritance &amp; Dynamic Dispatch\u003C/a>.\u003C/li>\n        <li><b>Encapsulation:\u003C/b> private fields, operations that keep invariants. See <a href=\"p2-encapsulation.html\">P2\u003C/a>.\u003C/li>\n        <li><b>Using <code>List\u003C/code>, <code>Map\u003C/code> and <code>Optional\u003C/code>\u003C/b> from the standard library, without needing to know how they work inside.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Programming to an interface\u003C/h2>\n  <p>An <b>interface\u003C/b> is a type that lists operations without saying how they're done. A class <b>implements\u003C/b> it by providing every operation. Code that only uses the interface works with any implementation, including ones written years later. That is the single most important move in low-level design, and you already use it: <code>List&lt;String&gt; names = new ArrayList&lt;&gt;();\u003C/code> declares the interface and chooses the implementation in one place.\u003C/p>\n  <p>Here is the cache every later chapter builds on. The service that uses it doesn't know, or need to know, how entries are stored or evicted:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Cache.java: a role, not an implementation\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">K\u003C/span>, <span class=\"t\">V\u003C/span>&gt; {\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">V\u003C/span>&gt; <span class=\"f\">get\u003C/span>(<span class=\"t\">K\u003C/span> key);\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">put\u003C/span>(<span class=\"t\">K\u003C/span> key, <span class=\"t\">V\u003C/span> value);\n\t<span class=\"k\">int\u003C/span> <span class=\"f\">size\u003C/span>();\n\n\t<span class=\"c\">/** Returns the cached value, or loads, stores and returns it. Every implementation gets this for free. */\u003C/span>\n\t<span class=\"k\">default\u003C/span> <span class=\"t\">V\u003C/span> <span class=\"f\">getOrLoad\u003C/span>(<span class=\"t\">K\u003C/span> key, <span class=\"t\">Function\u003C/span>&lt;? <span class=\"k\">super\u003C/span> <span class=\"t\">K\u003C/span>, ? <span class=\"k\">extends\u003C/span> <span class=\"t\">V\u003C/span>&gt; loader) {\n\t\t<span class=\"k\">return\u003C/span> <span class=\"f\">get\u003C/span>(key).<span class=\"f\">orElseGet\u003C/span>(() -&gt; {\n\t\t\t<span class=\"t\">V\u003C/span> v = loader.<span class=\"f\">apply\u003C/span>(key);\n\t\t\t<span class=\"f\">put\u003C/span>(key, v);\n\t\t\t<span class=\"k\">return\u003C/span> v;\n\t\t});\n\t}\n}\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">UserService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">User\u003C/span>&gt; users;             <span class=\"c\">// the interface, not a class\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">UserRepository\u003C/span> repo;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">UserService\u003C/span>(<span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">User\u003C/span>&gt; users, <span class=\"t\">UserRepository\u003C/span> repo) {\n\t\t<span class=\"k\">this\u003C/span>.users = users;\n\t\t<span class=\"k\">this\u003C/span>.repo = repo;\n\t}\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">User\u003C/span> <span class=\"f\">find\u003C/span>(<span class=\"t\">String\u003C/span> id) { <span class=\"k\">return\u003C/span> users.<span class=\"f\">getOrLoad\u003C/span>(id, repo::<span class=\"f\">load\u003C/span>); }\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>What this buys:\u003C/b> start with a simple <code>HashMap\u003C/code>-backed cache, switch to an LRU cache (<a href=\"31-case-lru-cache.html\">Case Study 31\u003C/a>) when memory matters, and give tests a fake that counts hits. <code>UserService\u003C/code> never changes. Each <code>Cache\u003C/code> implementation is a separate class that says <code>implements Cache&lt;K, V&gt;\u003C/code>.\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"UserService|Cache (default getOrLoad)|MapCache|UserRepository\">\n    <ol>\n      <li data-m=\"0>1\">users.getOrLoad(\"u42\", repo::load)\u003C/li>\n      <li data-m=\"1>2\">get(\"u42\"), dispatched to the implementation\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">Optional.empty(): a miss\u003C/li>\n      <li data-m=\"1>3\">loader.apply(\"u42\") → SELECT … WHERE id = 'u42'\u003C/li>\n      <li data-m=\"1>2\">put(\"u42\", user)\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">user (the next call is a hit)\u003C/li>\n    \u003C/ol>\n    <figcaption><b>A default method calling abstract ones.\u003C/b> <code>getOrLoad\u003C/code> is written once in the interface, and its calls to <code>get\u003C/code> and <code>put\u003C/code> dispatch to whichever implementation the service was given.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Interfaces vs abstract classes\u003C/h2>\n  <p>An <b>abstract class\u003C/b> is a class marked <code>abstract\u003C/code>: it can't be instantiated, and it can declare <b>abstract methods\u003C/b> (no body) that subclasses must implement. Unlike an interface it can hold fields and have constructors, so it's the tool for sharing <i>state and code\u003C/i> among closely related classes. The cost is the one you saw in <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a>: a class can extend only one class, and subclasses are coupled to the parent's internals.\u003C/p>\n  <p>A typical good use is a skeleton that does the repetitive work and leaves one step open. Every JSON endpoint in a small web framework decodes errors and encodes responses the same way:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">RequestHandler\u003C/span> { <span class=\"t\">Response\u003C/span> <span class=\"f\">handle\u003C/span>(<span class=\"t\">Request\u003C/span> req); }\n\n<span class=\"k\">public abstract class\u003C/span> <span class=\"t\">JsonHandler\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">RequestHandler\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">JsonCodec\u003C/span> codec;                          <span class=\"c\">// shared state: needs a class\u003C/span>\n\n\t<span class=\"k\">protected\u003C/span> <span class=\"f\">JsonHandler\u003C/span>(<span class=\"t\">JsonCodec\u003C/span> codec) { <span class=\"k\">this\u003C/span>.codec = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(codec); }\n\n\t<span class=\"k\">@Override public final\u003C/span> <span class=\"t\">Response\u003C/span> <span class=\"f\">handle\u003C/span>(<span class=\"t\">Request\u003C/span> req) {    <span class=\"c\">// final: the skeleton can't be broken\u003C/span>\n\t\t<span class=\"k\">try\u003C/span> {\n\t\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Response\u003C/span>.<span class=\"f\">ok\u003C/span>(codec.<span class=\"f\">encode\u003C/span>(<span class=\"f\">process\u003C/span>(req)));\n\t\t} <span class=\"k\">catch\u003C/span> (<span class=\"t\">BadRequestException\u003C/span> e) {\n\t\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Response\u003C/span>.<span class=\"f\">status\u003C/span>(<span class=\"m\">400\u003C/span>, codec.<span class=\"f\">encode\u003C/span>(<span class=\"t\">Map\u003C/span>.<span class=\"f\">of\u003C/span>(<span class=\"s\">\"error\"\u003C/span>, e.<span class=\"f\">getMessage\u003C/span>())));\n\t\t}\n\t}\n\t<span class=\"k\">protected abstract\u003C/span> <span class=\"t\">Object\u003C/span> <span class=\"f\">process\u003C/span>(<span class=\"t\">Request\u003C/span> req);           <span class=\"c\">// the one step each endpoint writes\u003C/span>\n}\u003C/pre>\n  <p>Notice that the abstract class still <i>implements an interface\u003C/i>. Callers depend on <code>RequestHandler\u003C/code>; <code>JsonHandler\u003C/code> is just one convenient way to implement it. The JDK does the same: <code>List\u003C/code> is the interface, <code>AbstractList\u003C/code> the optional skeleton. This “interface plus skeletal abstract class” pairing gives you the flexibility of the first and the code reuse of the second.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Interface\u003C/th><th>Abstract class\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Instance fields (state)\u003C/td><td>No, only <code>static final\u003C/code> constants\u003C/td><td>Yes\u003C/td>\u003C/tr>\n        <tr><td>Constructors\u003C/td><td>No\u003C/td><td>Yes, called by subclasses via <code>super(...)\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>How many a class can have\u003C/td><td>Any number\u003C/td><td>One\u003C/td>\u003C/tr>\n        <tr><td>Method bodies\u003C/td><td><code>default\u003C/code>, <code>static\u003C/code> and <code>private\u003C/code> methods\u003C/td><td>Any kind, any access level\u003C/td>\u003C/tr>\n        <tr><td>Models\u003C/td><td>A role or capability many unrelated classes can play\u003C/td><td>A shared skeleton for closely related classes\u003C/td>\u003C/tr>\n        <tr><td>Default choice in this course\u003C/td><td><b>Yes\u003C/b>: design to interfaces\u003C/td><td>Only when subclasses genuinely share state or a fixed algorithm\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n\n  <h2>Default methods and the diamond\u003C/h2>\n  <p>A <b>default method\u003C/b> is an interface method with a body. It exists so an interface can grow without breaking every class that already implements it. When Java 8 added <code>forEach\u003C/code> to <code>Iterable\u003C/code> and <code>removeIf\u003C/code> and <code>stream\u003C/code> to <code>Collection\u003C/code>, thousands of collection classes in other libraries kept compiling, because they inherited the default bodies.\u003C/p>\n  <p>Since a class can implement several interfaces, two of them might supply a default method with the same signature. Java resolves it with three rules, applied in order:\u003C/p>\n  <ol>\n    <li><b>Classes win.\u003C/b> A method declared in the class or any superclass beats any interface default.\u003C/li>\n    <li><b>The more specific interface wins.\u003C/b> If <code>JsonSink extends Sink\u003C/code> and both define <code>describe()\u003C/code>, <code>JsonSink\u003C/code>'s version is used.\u003C/li>\n    <li><b>Otherwise you must choose.\u003C/b> If two unrelated interfaces both provide <code>describe()\u003C/code>, the class doesn't compile until it overrides it. It can delegate to one explicitly with <code>Sink.super.describe()\u003C/code>.\u003C/li>\n  \u003C/ol>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">AuditedFileSink\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Sink\u003C/span>, <span class=\"t\">Audited\u003C/span> {\n\t<span class=\"k\">@Override public\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">describe\u003C/span>() {                    <span class=\"c\">// required: both interfaces have a default describe()\u003C/span>\n\t\t<span class=\"k\">return\u003C/span> <span class=\"t\">Sink\u003C/span>.<span class=\"k\">super\u003C/span>.<span class=\"f\">describe\u003C/span>() + <span class=\"s\">\" (audited)\"\u003C/span>;\n\t}\n\t<span class=\"c\">// ...\u003C/span>\n}\u003C/pre>\n  <p>Default methods are for evolving an interface and for small conveniences built from its abstract methods, like <code>getOrLoad\u003C/code>. They can't touch fields, because interfaces have none. If you find yourself wanting state in a default method, you wanted an abstract class or a separate helper object.\u003C/p>\n\n  <h2>Generics: one class, every type\u003C/h2>\n  <p>Before generics (Java 5), a cache stored <code>Object\u003C/code>, and every read needed a cast: <code>User u = (User) cache.get(\"u42\");\u003C/code>. Put a <code>String\u003C/code> in by mistake and the program compiled fine, then crashed with <code>ClassCastException\u003C/code> at the read, far from the bug. A <b>type parameter\u003C/b> like the <code>K\u003C/code> and <code>V\u003C/code> in <code>Cache&lt;K, V&gt;\u003C/code> lets the compiler check every <code>put\u003C/code> and <code>get\u003C/code>, and removes the casts.\u003C/p>\n<pre class=\"code\"><span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">User\u003C/span>&gt; users = <span class=\"k\">new\u003C/span> <span class=\"t\">MapCache\u003C/span>&lt;&gt;();   <span class=\"c\">// &lt;&gt; lets the compiler infer the types\u003C/span>\nusers.<span class=\"f\">put\u003C/span>(<span class=\"s\">\"u42\"\u003C/span>, alice);                                 <span class=\"c\">// checked: must be a User\u003C/span>\nusers.<span class=\"f\">put\u003C/span>(<span class=\"s\">\"u43\"\u003C/span>, <span class=\"s\">\"bob\"\u003C/span>);                                 <span class=\"c\">// compile error, not a crash later\u003C/span>\n\n<span class=\"c\">// A generic method: the type parameter goes before the return type.\u003C/span>\n<span class=\"k\">static\u003C/span> &lt;<span class=\"t\">T\u003C/span>&gt; <span class=\"t\">T\u003C/span> <span class=\"f\">firstOr\u003C/span>(<span class=\"t\">List\u003C/span>&lt;<span class=\"t\">T\u003C/span>&gt; xs, <span class=\"t\">T\u003C/span> fallback) { <span class=\"k\">return\u003C/span> xs.<span class=\"f\">isEmpty\u003C/span>() ? fallback : xs.<span class=\"f\">get\u003C/span>(<span class=\"m\">0\u003C/span>); }\n\n<span class=\"c\">// A bounded type parameter: T must be comparable to itself (or to a supertype).\u003C/span>\n<span class=\"k\">static\u003C/span> &lt;<span class=\"t\">T\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">Comparable\u003C/span>&lt;? <span class=\"k\">super\u003C/span> <span class=\"t\">T\u003C/span>&gt;&gt; <span class=\"t\">T\u003C/span> <span class=\"f\">latest\u003C/span>(<span class=\"t\">Collection\u003C/span>&lt;? <span class=\"k\">extends\u003C/span> <span class=\"t\">T\u003C/span>&gt; xs) { <span class=\"k\">return\u003C/span> <span class=\"t\">Collections\u003C/span>.<span class=\"f\">max\u003C/span>(xs); }\u003C/pre>\n  <p><b>Type erasure\u003C/b> is the one thing to know about how generics work. The type arguments exist only at compile time. At run time a <code>List&lt;String&gt;\u003C/code> and a <code>List&lt;Integer&gt;\u003C/code> are both just <code>List\u003C/code>. So a few things are impossible: <code>new T()\u003C/code> and <code>new T[10]\u003C/code> (the JVM doesn't know what <code>T\u003C/code> is), <code>x instanceof List&lt;String&gt;\u003C/code> (only <code>List&lt;?&gt;\u003C/code> is allowed), and two overloads that differ only in type arguments, like <code>f(List&lt;String&gt;)\u003C/code> and <code>f(List&lt;Integer&gt;)\u003C/code>. When a class really needs the type at run time, pass it in explicitly, as <code>Class&lt;T&gt;\u003C/code> or a factory function.\u003C/p>\n\n  <h2>Wildcards and PECS\u003C/h2>\n  <p>Here is the rule that surprises everyone: a <code>List&lt;Integer&gt;\u003C/code> is <b>not\u003C/b> a <code>List&lt;Number&gt;\u003C/code>, even though an <code>Integer\u003C/code> is a <code>Number\u003C/code>. If it were, this would compile and corrupt the list:\u003C/p>\n<pre class=\"code\"><span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Integer\u003C/span>&gt; ids = <span class=\"k\">new\u003C/span> <span class=\"t\">ArrayList\u003C/span>&lt;&gt;();\n<span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Number\u003C/span>&gt; nums = ids;      <span class=\"c\">// suppose this were allowed...\u003C/span>\nnums.<span class=\"f\">add\u003C/span>(<span class=\"m\">3.14\u003C/span>);                <span class=\"c\">// ...a Double goes into a list of Integers\u003C/span>\n<span class=\"t\">Integer\u003C/span> first = ids.<span class=\"f\">get\u003C/span>(<span class=\"m\">0\u003C/span>);    <span class=\"c\">// ClassCastException\u003C/span>\u003C/pre>\n  <p>Generic types are <b>invariant\u003C/b>, so that assignment is a compile error. But then how do you write a method that sums <i>any\u003C/i> list of numbers, or one that adds events to <i>any\u003C/i> collection that can hold them? With <b>wildcards\u003C/b>:\u003C/p>\n  <ul>\n    <li><b><code>List&lt;? extends Number&gt;\u003C/code>\u003C/b> means “a list of some subtype of Number”. You can <i>read\u003C/i> Numbers out of it, but you can't add anything (except <code>null\u003C/code>), because you don't know whether it's really a list of Integers or of Doubles. It's a <b>producer\u003C/b>.\u003C/li>\n    <li><b><code>List&lt;? super Integer&gt;\u003C/code>\u003C/b> means “a list of Integer or some supertype of it”. You can <i>add\u003C/i> Integers to it, but reading only gives you <code>Object\u003C/code>. It's a <b>consumer\u003C/b>.\u003C/li>\n  \u003C/ul>\n  <p>The mnemonic is <b>PECS: Producer Extends, Consumer Super\u003C/b>. A method that copies from a source to a sink takes <code>Collection&lt;? extends T&gt; src\u003C/code> and <code>Collection&lt;? super T&gt; dst\u003C/code>. The JDK's own <code>Collections.copy\u003C/code> is declared exactly that way, and so is the <code>loader\u003C/code> parameter of <code>getOrLoad\u003C/code> above. Try the combinations:\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">PECS checker: does it compile?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"pc-pick\">\n        <label>Parameter type<select id=\"pcParam\"><option value=\"exact\">List&lt;Number&gt;\u003C/option><option value=\"ext\">List&lt;? extends Number&gt;\u003C/option><option value=\"sup\">List&lt;? super Number&gt;\u003C/option>\u003C/select>\u003C/label>\n        <label>Argument passed<select id=\"pcArg\"><option value=\"Integer\">List&lt;Integer&gt;\u003C/option><option value=\"Number\" selected>List&lt;Number&gt;\u003C/option><option value=\"Object\">List&lt;Object&gt;\u003C/option>\u003C/select>\u003C/label>\n        <label>Predict first<select id=\"pcGuess\"><option value=\"\">(no guess)\u003C/option><option value=\"ok\">Call and both lines compile\u003C/option><option value=\"read\">Only the read compiles\u003C/option><option value=\"write\">Only the write compiles\u003C/option><option value=\"call\">The call itself fails\u003C/option>\u003C/select>\u003C/label>\n      \u003C/div>\n      <pre class=\"code pc-src\" id=\"pcSrc\">\u003C/pre>\n      <div class=\"pc-rows\" id=\"pcRows\">\u003C/div>\n      <div class=\"pc-score\" id=\"pcScore\" style=\"margin-top:8px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Nine combinations. The pattern to take away: <code>extends\u003C/code> accepts subtype lists and lets you read; <code>super\u003C/code> accepts supertype lists and lets you write; the exact type accepts only itself and allows both.\u003C/div>\n  \u003C/div>\n\n  <h2>Functional interfaces and lambdas\u003C/h2>\n  <p>An interface with exactly one abstract method is a <b>functional interface\u003C/b>, and any lambda or method reference with a matching shape can implement it. That makes small behaviours as easy to pass around as values. The standard library has the common shapes: <code>Function&lt;T, R&gt;\u003C/code> (T in, R out), <code>Predicate&lt;T&gt;\u003C/code> (T in, boolean out), <code>Supplier&lt;T&gt;\u003C/code> (nothing in, T out), <code>Consumer&lt;T&gt;\u003C/code> (T in, nothing out) and <code>Comparator&lt;T&gt;\u003C/code>.\u003C/p>\n<pre class=\"code\"><span class=\"k\">@FunctionalInterface\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">RetryPolicy\u003C/span> {\n\t<span class=\"k\">boolean\u003C/span> <span class=\"f\">shouldRetry\u003C/span>(<span class=\"k\">int\u003C/span> attempt, <span class=\"t\">Throwable\u003C/span> error);\n}\n\n<span class=\"t\">RetryPolicy\u003C/span> never = (attempt, e) -&gt; <span class=\"k\">false\u003C/span>;\n<span class=\"t\">RetryPolicy\u003C/span> ioThrice = (attempt, e) -&gt; attempt &lt; <span class=\"m\">3\u003C/span> &amp;&amp; e <span class=\"k\">instanceof\u003C/span> <span class=\"t\">IOException\u003C/span>;\n\n<span class=\"t\">Comparator\u003C/span>&lt;<span class=\"t\">Session\u003C/span>&gt; soonestExpiry = <span class=\"t\">Comparator\u003C/span>.<span class=\"f\">comparingInt\u003C/span>(<span class=\"t\">Session\u003C/span>::<span class=\"f\">ttlMinutes\u003C/span>);\u003C/pre>\n  <p><code>@FunctionalInterface\u003C/code> is optional, but it makes the compiler reject a second abstract method, so the interface can't stop working with lambdas by accident. A named interface like <code>RetryPolicy\u003C/code> is usually better than a raw <code>BiPredicate&lt;Integer, Throwable&gt;\u003C/code> in a design: the name says what the behaviour means, and it can grow a default method later. This is the Strategy pattern in miniature, and <a href=\"15-strategy.html\">Chapter 15\u003C/a> builds on it.\u003C/p>\n\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Name the role\u003C/b> What does the caller need done? That's an interface: <code>Cache\u003C/code>, <code>RetryPolicy\u003C/code>.\u003C/li>\n      <li data-k=\"decision\"><b>One method, no state?\u003C/b> Make it a functional interface and let callers pass lambdas.\u003C/li>\n      <li data-k=\"decision\"><b>Implementations share state or a fixed algorithm?\u003C/b> Add an abstract skeleton class that implements the interface.\u003C/li>\n      <li><b>Works for many types?\u003C/b> Add type parameters, with bounds only where the code needs them.\u003C/li>\n      <li data-k=\"end\"><b>Callers depend on the interface\u003C/b> Never on the skeleton or on a concrete class.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Choosing the shape of an abstraction.\u003C/b> Interface first, always; everything else is optional support for implementers.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">JDBC: one interface, every database\u003C/div><p><code>java.sql.Connection\u003C/code>, <code>Statement\u003C/code> and <code>ResultSet\u003C/code> are interfaces. Your code calls <code>connection.prepareStatement(sql)\u003C/code> and never names a database. PostgreSQL, MySQL and Oracle each ship a driver JAR with classes that implement those interfaces. Switching databases means changing a connection URL and a dependency, not your data-access code. The same design shows up whenever a system must support vendors it doesn't control: payment gateways, cloud storage SDKs, message brokers. <a href=\"12-adapter-facade-bridge.html\">Chapter 12\u003C/a> shows how to wrap vendors that <i>don't\u003C/i> share an interface.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Declaring fields and parameters with concrete types.\u003C/b> <code>HashMap&lt;…&gt;\u003C/code> and <code>ArrayList&lt;…&gt;\u003C/code> in a signature lock every caller to one implementation. Use <code>Map\u003C/code> and <code>List\u003C/code>.\u003C/li>\n      <li><b>Reaching for an abstract class first.\u003C/b> It uses up the one superclass slot and couples implementers to its internals. Start with an interface.\u003C/li>\n      <li><b>Using raw types\u003C/b> (<code>List\u003C/code> with no type argument). You lose all checking and get warnings; write <code>List&lt;?&gt;\u003C/code> if you truly don't care about the type.\u003C/li>\n      <li><b>Expecting <code>List&lt;Integer&gt;\u003C/code> to be a <code>List&lt;Number&gt;\u003C/code>.\u003C/b> It isn't. Use <code>List&lt;? extends Number&gt;\u003C/code> for a parameter you only read from.\u003C/li>\n      <li><b>Putting state-like logic in default methods.\u003C/b> Interfaces have no fields; if a default needs state, the design wants a class.\u003C/li>\n      <li><b>Returning wildcard types.\u003C/b> Wildcards belong in parameters. A return type of <code>List&lt;? extends T&gt;\u003C/code> forces every caller to deal with it.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> When would you use an abstract class instead of an interface?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I default to an interface, because a class can implement many of them and callers aren't tied to any implementation. I add an abstract class when several implementations genuinely share state or a fixed algorithm, like a JSON handler skeleton that does decoding and error mapping and leaves one <code>process\u003C/code> step abstract. Even then, the abstract class implements an interface, and callers depend on the interface, the way <code>AbstractList\u003C/code> sits behind <code>List\u003C/code>.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Write the signature of a method that moves every event from a source queue into a destination collection, working for a queue of <code>ClickEvent\u003C/code> into a <code>List&lt;Event&gt;\u003C/code> or a <code>List&lt;Object&gt;\u003C/code>.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div><code>static &lt;T&gt; int drainTo(Queue&lt;? extends T&gt; src, Collection&lt;? super T&gt; dst)\u003C/code>. The source only produces values I read, so it's <code>? extends T\u003C/code>. The destination only consumes values I add, so it's <code>? super T\u003C/code>. With <code>T\u003C/code> inferred as <code>ClickEvent\u003C/code>, a <code>Queue&lt;ClickEvent&gt;\u003C/code> can drain into a <code>List&lt;Event&gt;\u003C/code> or a <code>List&lt;Object&gt;\u003C/code>. That's PECS, and it's how <code>BlockingQueue.drainTo\u003C/code> is declared too.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Program to interfaces: callers depend on a role like <code>Cache&lt;K, V&gt;\u003C/code>, so implementations can change freely.\u003C/li>\n      <li>Abstract classes share state and a fixed skeleton among related classes; pair them with an interface and keep callers on the interface.\u003C/li>\n      <li>Default methods let interfaces evolve. Clashes resolve as: class wins, then the more specific interface, else you must override.\u003C/li>\n      <li>Generics move type errors from run time to compile time. Erasure means no <code>new T()\u003C/code> and no <code>instanceof List&lt;String&gt;\u003C/code>.\u003C/li>\n      <li>Generic types are invariant. PECS: read from <code>? extends T\u003C/code>, write to <code>? super T\u003C/code>.\u003C/li>\n      <li>Functional interfaces turn small behaviours into values; name them after what they mean.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Several request handlers share a JSON codec field and the same error-mapping code, and differ in one step. What's the best structure?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">One interface with default methods holding the codec\u003C/button>\n        <button class=\"opt\">Copy the shared code into each handler class\u003C/button>\n        <button class=\"opt\">An interface callers depend on, plus an abstract class that implements it, holds the codec, and leaves the one step abstract\u003C/button>\n        <button class=\"opt\">One concrete handler with a big switch on the endpoint name\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Shared state needs a class, because interfaces have no fields. Keeping the interface means callers aren't tied to the skeleton, and handlers that don't fit it can implement the interface directly.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">A method is declared <code>double total(List&lt;Number&gt; xs)\u003C/code>. What happens when you call it with a <code>List&lt;Integer&gt;\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It works: an Integer is a Number\u003C/button>\n        <button class=\"opt\">Compile error: generic types are invariant, so change the parameter to <code>List&lt;? extends Number&gt;\u003C/code>\u003C/button>\n        <button class=\"opt\">It compiles but throws ClassCastException\u003C/button>\n        <button class=\"opt\">Compile error: change the parameter to <code>List&lt;? super Number&gt;\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>List&lt;Integer&gt;\u003C/code> is not a subtype of <code>List&lt;Number&gt;\u003C/code>. Since <code>total\u003C/code> only reads, the list is a producer: <code>? extends Number\u003C/code> accepts lists of any Number subtype.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">You want a parameter you can <code>add(Integer)\u003C/code> to, which accepts a <code>List&lt;Integer&gt;\u003C/code>, a <code>List&lt;Number&gt;\u003C/code> or a <code>List&lt;Object&gt;\u003C/code>. Which type?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>List&lt;Integer&gt;\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>List&lt;? extends Integer&gt;\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>List&lt;Object&gt;\u003C/code>\u003C/button>\n        <button class=\"opt\"><code>List&lt;? super Integer&gt;\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The list consumes Integers, so it's <code>? super Integer\u003C/code>: any list whose element type is Integer or a supertype. Any such list can safely hold an Integer.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">A class implements interfaces <code>Sink\u003C/code> and <code>Audited\u003C/code>, unrelated to each other, and both have a default <code>describe()\u003C/code>. The class doesn't declare <code>describe()\u003C/code>. What happens?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Compile error: the class must override <code>describe()\u003C/code>, and may call <code>Sink.super.describe()\u003C/code> inside it\u003C/button>\n        <button class=\"opt\">The first interface in the <code>implements\u003C/code> list wins\u003C/button>\n        <button class=\"opt\">Both defaults run, one after the other\u003C/button>\n        <button class=\"opt\">A runtime error the first time <code>describe()\u003C/code> is called\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">With no class method and no more-specific interface, Java refuses to guess. The class must override the method, and can delegate to either default explicitly with <code>Interface.super.method()\u003C/code>.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">Why doesn't <code>if (payload instanceof List&lt;String&gt;)\u003C/code> compile?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>instanceof\u003C/code> doesn't work with interfaces\u003C/button>\n        <button class=\"opt\">Lists can't hold Strings\u003C/button>\n        <button class=\"opt\">Type arguments are erased at run time, so the JVM can't tell a List&lt;String&gt; from a List&lt;Integer&gt;\u003C/button>\n        <button class=\"opt\">It does compile, but always returns false\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Erasure removes type arguments after compilation. At run time there is only <code>List\u003C/code>, so Java only allows <code>instanceof List&lt;?&gt;\u003C/code> (or plain <code>List\u003C/code>) and makes you check elements yourself.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $ } = LLD;\n  const PARAM = { exact: 'List<Number>', ext: 'List<? extends Number>', sup: 'List<? super Number>' };\n  // [call compiles?, why]\n  const CALL = {\n    exact: { Integer: [false, 'List<Integer> is not a List<Number>: generic types are invariant, even though Integer is a Number.'],\n             Number:  [true,  'Exact match.'],\n             Object:  [false, 'List<Object> is not a List<Number> either. Invariance cuts both ways.'] },\n    ext:   { Integer: [true,  'Integer extends Number, so a List<Integer> is a list of “some subtype of Number”.'],\n             Number:  [true,  'Number itself counts: “? extends Number” includes Number.'],\n             Object:  [false, 'Object is not a subtype of Number, so a List<Object> might hold Strings.'] },\n    sup:   { Integer: [false, 'Integer is a subtype of Number, not a supertype. A List<Integer> could not safely hold a Double.'],\n             Number:  [true,  'Number itself counts: “? super Number” includes Number.'],\n             Object:  [true,  'Object is a supertype of Number, so a List<Object> can hold any Number.'] },\n  };\n  const READ = {\n    exact: [true,  'get returns Number.'],\n    ext:   [true,  'Whatever the real element type is, it is some Number, so get returns Number. Reading from a producer is safe.'],\n    sup:   [false, 'The list might be a List<Object>, so get can only promise Object. Assigning it to Number needs a cast.'],\n  };\n  const WRITE = {\n    exact: [true,  'An Integer is a Number, so the list accepts it.'],\n    ext:   [false, 'The list might really be a List<Double>, so the compiler lets you add nothing but null. Producers don\\'t consume.'],\n    sup:   [true,  'Whatever the real element type is, it is Number or a supertype, so it can hold an Integer. Writing to a consumer is safe.'],\n  };\n  let tries = 0, right = 0;\n\n  function render(fromGuess) {\n    const p = $('#pcParam').value, a = $('#pcArg').value, g = $('#pcGuess').value;\n    $('#pcSrc').textContent =\n      `static void use(${PARAM[p]} xs) {\\n    Number n = xs.get(0);   // read\\n    xs.add(42);             // write an Integer\\n}\\n\\nList<${a}> list = new ArrayList<>(List.of(1));\\nuse(list);`;\n    const [cOk, cWhy] = CALL[p][a], [rOk, rWhy] = READ[p], [wOk, wWhy] = WRITE[p];\n    const row = (ok, what, why) => `<div class=\"pc-row ${ok ? 'ok' : 'err'}\"><span class=\"ic\">${ok ? '✓' : '✗'}\u003C/span><div><b>${what}\u003C/b> ${why}\u003C/div>\u003C/div>`;\n    $('#pcRows').innerHTML = row(cOk, `use(List&lt;${a}&gt;)`, cWhy.replace(/\u003C/g, '&lt;')) + row(rOk, 'Number n = xs.get(0);', rWhy.replace(/\u003C/g, '&lt;')) + row(wOk, 'xs.add(42);', wWhy.replace(/\u003C/g, '&lt;'));\n    if (fromGuess && g) {\n      const truth = !cOk ? 'call' : rOk && wOk ? 'ok' : rOk ? 'read' : 'write';\n      tries++; if (g === truth) right++;\n      LLD.toast(g === truth ? 'Correct' : 'Not quite: read the three lines');\n      $('#pcGuess').value = '';\n    }\n    $('#pcScore').textContent = tries ? `Your predictions: ${right} / ${tries} correct` : 'Set a parameter type and an argument, then pick a prediction to have it scored.';\n  }\n  $('#pcParam').addEventListener('change', () => render(false));\n  $('#pcArg').addEventListener('change', () => render(false));\n  $('#pcGuess').addEventListener('change', () => render(true));\n  render(false);\n})();\n"]},"p5-composition.html":{"title":"Composition over Inheritance","chapter":"0.5","styles":"\n  .cx-opts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:12px; }\n  @media (max-width:760px) { .cx-opts { grid-template-columns:1fr; } }\n  .cx-opts h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }\n  .cx-chips { display:flex; flex-wrap:wrap; gap:8px; }\n  .cx-chip { font-family:var(--mono); font-size:12.5px; padding:6px 11px; border-radius:999px; border:1.5px solid var(--border-strong); background:var(--surface-2); color:var(--text-2); cursor:pointer; user-select:none; }\n  .cx-chip.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }\n  .cx-cols { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:14px; }\n  @media (max-width:760px) { .cx-cols { grid-template-columns:1fr; } }\n  .cx-box { border:1.5px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface-2); }\n  .cx-box h4 { margin:0 0 6px; font-size:14px; }\n  .cx-box .n { font-family:var(--mono); font-size:28px; font-weight:800; }\n  .cx-box.bad .n { color:var(--red); }\n  .cx-box.good .n { color:var(--green); }\n  .cx-list { font-family:var(--mono); font-size:11.5px; line-height:1.7; max-height:170px; overflow:auto; margin-top:6px; color:var(--text-2); }\n  .cx-wire { margin:12px 0 0; font-size:12.5px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 5\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 35 min\u003C/span>\u003C/div>\n    <h1>Composition over <span class=\"grad\">Inheritance\u003C/span>\u003C/h1>\n    <p class=\"lead\">“Favour composition over inheritance” is the most repeated line in object-oriented design, and one of the least explained. This chapter shows what goes wrong when inheritance is used to combine features, what composition looks like in real Java, and the specific cases where inheritance is still the right tool.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Recognise a subclass explosion, and count what it will cost\u003C/li>\n      <li>Build behaviour by wrapping and delegating to objects behind an interface\u003C/li>\n      <li>Fix a fragile subclass with a forwarding class\u003C/li>\n      <li>Apply the “is-a” substitution test, and spot the two famous JDK mistakes that fail it\u003C/li>\n      <li>Say when inheritance is still the right choice\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>The fragile base class problem\u003C/b> and the <code>InstrumentedHashSet\u003C/code> that counted twice. See <a href=\"p3-inheritance-dispatch.html\">P3: Inheritance &amp; Dynamic Dispatch\u003C/a>.\u003C/li>\n        <li><b>Programming to an interface,\u003C/b> and functional interfaces like <code>RetryPolicy\u003C/code>. See <a href=\"p4-interfaces-generics.html\">P4: Interfaces, Abstract Classes &amp; Generics\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>The subclass explosion\u003C/h2>\n  <p>A notification service sends messages over email and SMS. Then product asks for retries on flaky gateways, then rate limiting so a bug can't text a user 500 times, then an audit log for compliance. Each feature is optional per channel. If each variation is a subclass, you need a class for every combination: <code>RetryingSmsNotifier\u003C/code>, <code>RateLimitedRetryingSmsNotifier\u003C/code>, <code>AuditedRateLimitedRetryingEmailNotifier\u003C/code>…\u003C/p>\n  <p>The count is <b>channels × 2<sup>features\u003C/sup>\u003C/b>, because each feature is independently on or off. Two channels and three features is 2 × 8 = 16 classes. Add a Slack channel and a metrics feature and it's 3 × 16 = 48. Each new feature <i>doubles\u003C/i> the total. The classes also repeat the same retry loop and the same audit call in dozens of places, and Java allows only one superclass, so you can't mix “retrying” and “audited” in from two parents anyway.\u003C/p>\n  <p><b>Composition\u003C/b> builds the same behaviour from objects instead of classes. Each feature is one class that <i>wraps\u003C/i> another <code>Notifier\u003C/code> and adds one thing. You combine them when the program starts, in any order and any combination:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">One interface, one class per channel, one class per feature\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">Notifier\u003C/span> { <span class=\"k\">void\u003C/span> <span class=\"f\">send\u003C/span>(<span class=\"t\">Message\u003C/span> m); }\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">SmsNotifier\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Notifier\u003C/span> { <span class=\"c\">/* calls the SMS gateway's HTTP API */\u003C/span> }\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">RetryingNotifier\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">Notifier\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Notifier\u003C/span> inner;                 <span class=\"c\">// has-a Notifier\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">RetryPolicy\u003C/span> policy;\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">RetryingNotifier\u003C/span>(<span class=\"t\">Notifier\u003C/span> inner, <span class=\"t\">RetryPolicy\u003C/span> policy) {\n\t\t<span class=\"k\">this\u003C/span>.inner = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(inner);\n\t\t<span class=\"k\">this\u003C/span>.policy = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(policy);\n\t}\n\n\t<span class=\"k\">@Override public void\u003C/span> <span class=\"f\">send\u003C/span>(<span class=\"t\">Message\u003C/span> m) {\n\t\t<span class=\"k\">for\u003C/span> (<span class=\"k\">int\u003C/span> attempt = <span class=\"m\">1\u003C/span>; ; attempt++) {\n\t\t\t<span class=\"k\">try\u003C/span> { inner.<span class=\"f\">send\u003C/span>(m); <span class=\"k\">return\u003C/span>; }         <span class=\"c\">// delegate the real work\u003C/span>\n\t\t\t<span class=\"k\">catch\u003C/span> (<span class=\"t\">RuntimeException\u003C/span> e) {\n\t\t\t\t<span class=\"k\">if\u003C/span> (!policy.<span class=\"f\">shouldRetry\u003C/span>(attempt, e)) <span class=\"k\">throw\u003C/span> e;\n\t\t\t}\n\t\t}\n\t}\n}\n\n<span class=\"c\">// Wiring, once, at startup: audited → retrying → SMS\u003C/span>\n<span class=\"t\">Notifier\u003C/span> sms = <span class=\"k\">new\u003C/span> <span class=\"t\">AuditedNotifier\u003C/span>(<span class=\"k\">new\u003C/span> <span class=\"t\">RetryingNotifier\u003C/span>(<span class=\"k\">new\u003C/span> <span class=\"t\">SmsNotifier\u003C/span>(gateway), ioThrice), auditLog);\u003C/pre>\n    <div class=\"cb-foot\"><b>Reading it:\u003C/b> <code>RetryingNotifier\u003C/code> doesn't know or care what it wraps: an SMS sender, an email sender, or another wrapper. Retries are written once, for every channel. The count is now <b>channels + features\u003C/b>: 2 + 3 = 5 classes instead of 16. (A real retry loop also waits between attempts; <a href=\"25-resilience.html\">Chapter 25\u003C/a> adds backoff.)\u003C/div>\n  \u003C/div>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Class count: one subclass per combination vs one class per feature\u003C/span><span class=\"p-tag\">Calculator\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"cx-opts\">\n        <div><h4>Channels\u003C/h4><div class=\"cx-chips\" id=\"cxCh\">\u003C/div>\u003C/div>\n        <div><h4>Optional features\u003C/h4><div class=\"cx-chips\" id=\"cxFt\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <div class=\"cx-cols\">\n        <div class=\"cx-box bad\"><h4>Inheritance: a subclass per combination\u003C/h4><div class=\"n\" id=\"cxInhN\">\u003C/div><div class=\"small muted\" id=\"cxInhF\">\u003C/div><div class=\"cx-list\" id=\"cxInhL\">\u003C/div>\u003C/div>\n        <div class=\"cx-box good\"><h4>Composition: wrappers around an interface\u003C/h4><div class=\"n\" id=\"cxCmpN\">\u003C/div><div class=\"small muted\" id=\"cxCmpF\">\u003C/div><div class=\"cx-list\" id=\"cxCmpL\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <pre class=\"code cx-wire\" id=\"cxWire\">\u003C/pre>\n    \u003C/div>\n    <div class=\"panel-foot\">Toggle a feature and watch the left number double while the right one grows by one. The wiring line shows how one fully featured channel is assembled from the small classes.\u003C/div>\n  \u003C/div>\n\n  <h2>Delegation by hand: fixing the fragile subclass\u003C/h2>\n  <p>The <code>InstrumentedHashSet\u003C/code> from <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a> counted every element twice, because <code>HashSet.addAll\u003C/code> calls the overridden <code>add\u003C/code>. The composition fix is to stop <i>being\u003C/i> a <code>HashSet\u003C/code> and <i>hold\u003C/i> one instead. <i>Effective Java\u003C/i> splits it into two classes, and the first one is reusable for any wrapper you'll ever need around a <code>Set\u003C/code>:\u003C/p>\n<pre class=\"code\"><span class=\"c\">// 1. Implements Set by passing every call to a Set it holds. Written once.\u003C/span>\n<span class=\"k\">public class\u003C/span> <span class=\"t\">ForwardingSet\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; <span class=\"k\">implements\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; s;\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">ForwardingSet\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; s) { <span class=\"k\">this\u003C/span>.s = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(s); }\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">add\u003C/span>(<span class=\"t\">E\u003C/span> e) { <span class=\"k\">return\u003C/span> s.<span class=\"f\">add\u003C/span>(e); }\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">addAll\u003C/span>(<span class=\"t\">Collection\u003C/span>&lt;? <span class=\"k\">extends\u003C/span> <span class=\"t\">E\u003C/span>&gt; c) { <span class=\"k\">return\u003C/span> s.<span class=\"f\">addAll\u003C/span>(c); }\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">contains\u003C/span>(<span class=\"t\">Object\u003C/span> o) { <span class=\"k\">return\u003C/span> s.<span class=\"f\">contains\u003C/span>(o); }\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">size\u003C/span>() { <span class=\"k\">return\u003C/span> s.<span class=\"f\">size\u003C/span>(); }\n\t<span class=\"c\">// ... the other Set methods, each one line ...\u003C/span>\n}\n\n<span class=\"c\">// 2. The actual feature: small, and independent of how the inner set works.\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">CountingSet\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; <span class=\"k\">extends\u003C/span> <span class=\"t\">ForwardingSet\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; {\n\t<span class=\"k\">private int\u003C/span> addCount = <span class=\"m\">0\u003C/span>;\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">CountingSet\u003C/span>(<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">E\u003C/span>&gt; s) { <span class=\"k\">super\u003C/span>(s); }\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">add\u003C/span>(<span class=\"t\">E\u003C/span> e) { addCount++; <span class=\"k\">return super\u003C/span>.<span class=\"f\">add\u003C/span>(e); }\n\t<span class=\"k\">@Override public boolean\u003C/span> <span class=\"f\">addAll\u003C/span>(<span class=\"t\">Collection\u003C/span>&lt;? <span class=\"k\">extends\u003C/span> <span class=\"t\">E\u003C/span>&gt; c) { addCount += c.<span class=\"f\">size\u003C/span>(); <span class=\"k\">return super\u003C/span>.<span class=\"f\">addAll\u003C/span>(c); }\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">addCount\u003C/span>() { <span class=\"k\">return\u003C/span> addCount; }\n}\n\n<span class=\"t\">Set\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; tags = <span class=\"k\">new\u003C/span> <span class=\"t\">CountingSet\u003C/span>&lt;&gt;(<span class=\"k\">new\u003C/span> <span class=\"t\">HashSet\u003C/span>&lt;&gt;());   <span class=\"c\">// or a TreeSet, or a concurrent set\u003C/span>\u003C/pre>\n  <figure class=\"seq\" data-actors=\"client|CountingSet|inner HashSet\">\n    <ol>\n      <li data-m=\"0>1\">addAll([a, b, c]) → addCount += 3\u003C/li>\n      <li data-m=\"1>2\">s.addAll(c): forwarded to the held set\u003C/li>\n      <li data-m=\"2>2\">HashSet's addAll calls its own add three times\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">true\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">addCount = 3, correct\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Why it works now.\u003C/b> The inner set's self-calls stay inside the inner set. They never reach <code>CountingSet\u003C/code>'s override, because the inner set doesn't know it is wrapped.\u003C/figcaption>\n  \u003C/figure>\n  <p>Yes, <code>CountingSet\u003C/code> still uses <code>extends\u003C/code>, but on a class built for it: <code>ForwardingSet\u003C/code> has no hidden self-use, since every method is a plain one-line forward. The wrapper also works with <i>any\u003C/i> <code>Set\u003C/code> implementation, which the subclass of <code>HashSet\u003C/code> never could.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Inheritance (<code>extends\u003C/code>)\u003C/th><th>Composition (holds a reference)\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Relationship\u003C/td><td>is-a, fixed at compile time\u003C/td><td>has-a, chosen at run time, can be swapped\u003C/td>\u003C/tr>\n        <tr><td>Coupling\u003C/td><td>To the parent's internals, including its self-calls\u003C/td><td>Only to the wrapped object's public interface\u003C/td>\u003C/tr>\n        <tr><td>Combining features\u003C/td><td>One class per combination; one superclass only\u003C/td><td>Stack any wrappers in any order\u003C/td>\u003C/tr>\n        <tr><td>Code reuse\u003C/td><td>Automatic: everything is inherited\u003C/td><td>Explicit forwarding (boilerplate for big interfaces)\u003C/td>\u003C/tr>\n        <tr><td>Testing\u003C/td><td>Must construct the whole hierarchy\u003C/td><td>Wrap a fake: <code>new RetryingNotifier(failTwiceFake, policy)\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>Known weak spot\u003C/td><td>Fragile base class\u003C/td><td>The wrapped object's calls to <code>this\u003C/code> bypass the wrapper\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>That last row is composition's one real catch, sometimes called the <b>self problem\u003C/b>. If the inner object calls one of its own methods, or registers <code>this\u003C/code> as a callback somewhere, the call goes to the inner object directly and skips every wrapper. It's usually harmless, but it's why a wrapper can't reliably intercept everything.\u003C/p>\n\n  <h2>Is-a vs has-a: the substitution test\u003C/h2>\n  <p>Before writing <code>class B extends A\u003C/code>, ask one question: <b>can a B be used everywhere an A is expected, with every A operation still making sense?\u003C/b> If yes, B really is an A. If some inherited operations would be wrong for a B, B only <i>has\u003C/i> or <i>uses\u003C/i> an A, and should hold one. <a href=\"04-solid-lsp-isp-dip.html\">Chapter 4\u003C/a> turns this into the Liskov substitution principle; for now, two famous classes in the JDK itself show what failing it looks like.\u003C/p>\n  <ul>\n    <li><b><code>java.util.Stack extends Vector\u003C/code>.\u003C/b> A stack should allow push, pop and peek. Because it inherits from <code>Vector\u003C/code>, every <code>Stack\u003C/code> also has <code>add(index, e)\u003C/code>, <code>remove(index)\u003C/code> and <code>get(index)\u003C/code>, so any caller can insert into the middle and break last-in-first-out. The JDK's own documentation now recommends <code>Deque&lt;E&gt; stack = new ArrayDeque&lt;&gt;()\u003C/code> instead.\u003C/li>\n    <li><b><code>java.util.Properties extends Hashtable&lt;Object, Object&gt;\u003C/code>.\u003C/b> Properties are supposed to be string keys and string values. But the inherited <code>put\u003C/code> accepts any object, so <code>props.put(\"timeout\", 30)\u003C/code> compiles, and then <code>getProperty(\"timeout\")\u003C/code> returns <code>null\u003C/code>, because <code>getProperty\u003C/code> only returns values that are strings.\u003C/li>\n  \u003C/ul>\n  <p>Both classes date from Java 1.0, and both can't be fixed now without breaking existing code, which is the other lesson: a public inheritance relationship is permanent.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">java.io: a whole library built by composition\u003C/div><p>Reading a gzipped UTF-8 log file line by line is <code>new BufferedReader(new InputStreamReader(new GZIPInputStream(new FileInputStream(path)), UTF_8))\u003C/code>. Four small classes, each adding one thing: bytes from a file, decompression, bytes to characters, buffering and <code>readLine\u003C/code>. The library has no <code>BufferedGzipUtf8FileReader\u003C/code> class, and doesn't need one. Swap <code>FileInputStream\u003C/code> for a socket's input stream and the same three wrappers read a compressed network stream. <a href=\"13-decorator-proxy.html\">Chapter 13\u003C/a> names this the Decorator pattern.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <h2>When inheritance is still right\u003C/h2>\n  <p>“Favour” composition doesn't mean “never inherit”. Inheritance is the right tool in a few specific cases:\u003C/p>\n  <ul>\n    <li><b>A genuine subtype that passes the substitution test,\u003C/b> where the parent was designed and documented for extension. Framework base classes like <code>HttpServlet\u003C/code> or JUnit's extension points are built this way on purpose.\u003C/li>\n    <li><b>A fixed algorithm with a few open steps,\u003C/b> the skeleton from <a href=\"p4-interfaces-generics.html\">P4\u003C/a>'s <code>JsonHandler\u003C/code>, with the skeleton method made <code>final\u003C/code>. <a href=\"19-chain-template.html\">Chapter 19\u003C/a> calls this Template Method.\u003C/li>\n    <li><b>A closed set of variants you own.\u003C/b> A <code>sealed\u003C/code> interface lists exactly which classes may implement it, so the hierarchy can't grow behind your back: <code>sealed interface Command permits Get, Set, Delete {}\u003C/code> for a key-value store's protocol. The compiler can then check that a <code>switch\u003C/code> handles every case.\u003C/li>\n    <li><b>Inside one package or module you control,\u003C/b> where parent and subclasses change together and nobody outside can subclass.\u003C/li>\n  \u003C/ul>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>You want B to reuse or vary A\u003C/b> Before typing <code>extends\u003C/code>, check it.\u003C/li>\n      <li data-k=\"decision\"><b>Is every A operation right for a B?\u003C/b> If not, B has-a A: hold one and delegate.\u003C/li>\n      <li data-k=\"decision\"><b>Was A designed for extension?\u003C/b> If A is a JDK or library class not built for it, wrap it instead.\u003C/li>\n      <li data-k=\"decision\"><b>Will features combine?\u003C/b> If variations mix and match, one wrapper per feature.\u003C/li>\n      <li data-k=\"end\"><b>Then inherit\u003C/b> A sealed or final hierarchy, or a documented skeleton with final template methods.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Should this be <code>extends\u003C/code>?\u003C/b> Most answers end at the first or second question, and that's the point of the slogan.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Extending a class just to reuse a few of its methods.\u003C/b> You inherit all of them, including ones that break your class's rules. Hold an instance and call what you need.\u003C/li>\n      <li><b>Modelling optional features as subclasses.\u003C/b> Features that combine turn into 2<sup>n\u003C/sup> classes. Make each feature a wrapper.\u003C/li>\n      <li><b>Extending JDK collections\u003C/b> (<code>HashMap\u003C/code>, <code>ArrayList\u003C/code>) to add behaviour. Their internal self-calls aren't part of their contract. Wrap them.\u003C/li>\n      <li><b>Wrappers that don't implement the interface.\u003C/b> If <code>RetryingNotifier\u003C/code> isn't a <code>Notifier\u003C/code>, you can't stack it or pass it where a notifier is expected.\u003C/li>\n      <li><b>Forgetting to forward a method\u003C/b> in a hand-written wrapper, so it silently does nothing. Write the forwarding class once and extend that.\u003C/li>\n      <li><b>Treating “composition” as a ban on <code>extends\u003C/code>.\u003C/b> Sealed hierarchies and designed-for-extension skeletons are good inheritance.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Why do people say to favour composition over inheritance?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Inheritance couples a subclass to its parent's internals, including which methods call which, so the subclass can break when the parent changes. It's also fixed at compile time and you get one parent, so optional features that combine turn into a class per combination. Composition holds an object behind an interface and delegates to it: each feature is one small wrapper, you combine them at run time, and you only depend on the public interface. I still use inheritance for true subtypes, sealed hierarchies and deliberate template skeletons.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Notifications have 3 channels and 4 optional features that can combine freely. How many classes would each approach need, and what does the composed version look like?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Subclassing every combination needs 3 × 2⁴ = 48 classes, and each new feature doubles that. Composition needs 3 + 4 = 7: a <code>Notifier\u003C/code> interface, one class per channel, and one wrapper per feature that implements <code>Notifier\u003C/code> and holds the <code>Notifier\u003C/code> it wraps. At startup I'd wire each channel with the features it needs, like <code>new Audited(new RateLimited(new Retrying(new Sms(gateway), policy), limiter), log)\u003C/code>, ideally in one factory, so the order of wrappers is decided in one place.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Features as subclasses cost channels × 2<sup>features\u003C/sup> classes; features as wrappers cost channels + features.\u003C/li>\n      <li>Composition: implement the interface, hold the thing you wrap, add one behaviour, delegate the rest.\u003C/li>\n      <li>A forwarding class fixes the fragile subclass: the inner object's self-calls never reach your overrides.\u003C/li>\n      <li>The substitution test: B extends A only if every A operation is right for a B. <code>Stack\u003C/code> and <code>Properties\u003C/code> fail it.\u003C/li>\n      <li>Composition's catch: calls the inner object makes to itself bypass the wrappers.\u003C/li>\n      <li>Inheritance is right for true subtypes, sealed closed hierarchies and deliberate template skeletons.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">A payment client supports 4 gateways and 3 optional features (retries, circuit breaker, metrics) that can be combined freely. How many classes does one-subclass-per-combination need, compared with composition?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">12 vs 7\u003C/button>\n        <button class=\"opt\">7 vs 7\u003C/button>\n        <button class=\"opt\">32 vs 7\u003C/button>\n        <button class=\"opt\">64 vs 12\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Each feature is on or off independently: 2³ = 8 combinations per gateway, times 4 gateways = 32 subclasses. Composition needs one class per gateway and one wrapper per feature: 4 + 3 = 7.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\"><code>CountingSet extends ForwardingSet\u003C/code> and wraps a <code>HashSet\u003C/code>. Why does <code>addAll\u003C/code> of 3 elements now count 3 instead of 6?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">The inner HashSet's <code>addAll\u003C/code> calls its own <code>add\u003C/code>, which never reaches CountingSet's override\u003C/button>\n        <button class=\"opt\">ForwardingSet disables dynamic dispatch\u003C/button>\n        <button class=\"opt\">HashSet no longer calls <code>add\u003C/code> from <code>addAll\u003C/code> when wrapped\u003C/button>\n        <button class=\"opt\">CountingSet only overrides <code>add\u003C/code>\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The inner set is a separate object that doesn't know it's wrapped, so its self-calls go to its own methods. CountingSet counts only in its own <code>add\u003C/code> and <code>addAll\u003C/code>, which callers invoke directly.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">What is wrong with <code>java.util.Stack extends Vector\u003C/code>?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Vector is too slow to back a stack\u003C/button>\n        <button class=\"opt\">A stack can't be generic\u003C/button>\n        <button class=\"opt\">Stack should extend LinkedList instead\u003C/button>\n        <button class=\"opt\">Every Stack inherits index-based insert and remove, so callers can break last-in-first-out: a stack is not a kind of Vector\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">It fails the substitution test in reverse: Vector's operations don't all make sense for a stack, but Stack exposes them anyway. Holding a list internally, as <code>ArrayDeque\u003C/code> does for the <code>Deque\u003C/code> interface, would have kept the operations to push, pop and peek.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Which is a good use of inheritance?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Extending <code>HashMap\u003C/code> to log every <code>put\u003C/code>\u003C/button>\n        <button class=\"opt\">A <code>sealed interface Command permits Get, Set, Delete\u003C/code> for a key-value store protocol you own\u003C/button>\n        <button class=\"opt\"><code>class RetryingAuditedSmsNotifier extends AuditedSmsNotifier\u003C/code>\u003C/button>\n        <button class=\"opt\">Extending a class to reuse one of its helper methods\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A sealed hierarchy is closed, owned by you, and each variant truly is a Command. The others extend a class not designed for it, encode feature combinations as classes, or inherit a whole API to reuse one method.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">What is a genuine downside of composition?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Wrapped objects can't be swapped at run time\u003C/button>\n        <button class=\"opt\">It couples you to the wrapped class's internal self-calls\u003C/button>\n        <button class=\"opt\">Forwarding a large interface is boilerplate, and calls the inner object makes to itself skip the wrappers\u003C/button>\n        <button class=\"opt\">A class can only hold one other object\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Forwarding every method takes code (write a forwarding class once to contain it), and the inner object's calls to <code>this\u003C/code> bypass any wrapper. The other options describe inheritance's problems, or aren't true.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const CH = [['Email', true], ['Sms', true], ['Slack', false], ['Push', false]];\n  const FT = [['Retrying', true], ['RateLimited', true], ['Audited', true], ['Metered', false]];\n  const on = { ch: new Set(CH.filter((x) => x[1]).map((x) => x[0])), ft: new Set(FT.filter((x) => x[1]).map((x) => x[0])) };\n\n  function chips(el, list, set) {\n    el.innerHTML = list.map(([n]) => `<span class=\"cx-chip${set.has(n) ? ' on' : ''}\" data-n=\"${n}\">${n}\u003C/span>`).join('');\n    $$('.cx-chip', el).forEach((c) => c.onclick = () => {\n      const n = c.dataset.n;\n      if (set.has(n)) { if (set === on.ch && set.size === 1) return LLD.toast('Keep at least one channel'); set.delete(n); } else set.add(n);\n      draw();\n    });\n  }\n\n  function draw() {\n    chips($('#cxCh'), CH, on.ch); chips($('#cxFt'), FT, on.ft);\n    const ch = CH.map((x) => x[0]).filter((n) => on.ch.has(n)), ft = FT.map((x) => x[0]).filter((n) => on.ft.has(n));\n    const combos = [];\n    for (let mask = 0; mask < (1 << ft.length); mask++) combos.push(ft.filter((_, k) => mask & (1 << k)).join(''));\n    const inh = [];\n    ch.forEach((c) => combos.forEach((p) => inh.push(p + c + 'Notifier')));\n    $('#cxInhN').textContent = inh.length;\n    $('#cxInhF').textContent = `${ch.length} channel${ch.length > 1 ? 's' : ''} × 2^${ft.length} = ${ch.length} × ${1 << ft.length}`;\n    $('#cxInhL').innerHTML = inh.join('<br>');\n    const cmp = ['Notifier (interface)'].concat(ch.map((c) => c + 'Notifier'), ft.map((f) => f + 'Notifier'));\n    $('#cxCmpN').textContent = ch.length + ft.length;\n    $('#cxCmpF').textContent = `${ch.length} channel${ch.length > 1 ? 's' : ''} + ${ft.length} feature${ft.length === 1 ? '' : 's'} (plus the interface)`;\n    $('#cxCmpL').innerHTML = cmp.join('<br>');\n    const ARG = { Retrying: 'policy', RateLimited: 'limiter', Audited: 'auditLog', Metered: 'metrics' };\n    const outer = ft.slice().reverse(), pad = (k) => '    '.repeat(k + 1);\n    const lines = outer.map((f, k) => pad(k) + `new ${f}Notifier(`);\n    lines.push(pad(outer.length) + `new ${ch[0]}Notifier(gateway)` + (outer.length ? ',' : ';'));\n    ft.forEach((f, k) => lines.push(pad(ft.length - k) + ARG[f] + ')' + (k === ft.length - 1 ? ';' : ',')));\n    const v = ch[0].toLowerCase();\n    $('#cxWire').textContent = ['// one fully featured ' + v + ' channel, composed at startup:', 'Notifier ' + v + ' ='].concat(lines).join('\\n');\n  }\n  draw();\n})();\n"]},"p6-value-objects.html":{"title":"Value Objects, Enums &amp; Immutability","chapter":"0.6","styles":"\n  .hb-grid { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px; margin-top:12px; }\n  @media (max-width:760px) { .hb-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }\n  .hb { border:1.5px solid var(--border); border-radius:10px; min-height:92px; padding:6px; background:var(--surface-2); font-family:var(--mono); font-size:11px; transition:border-color .25s, box-shadow .25s; }\n  .hb .i { color:var(--muted); font-weight:700; margin-bottom:4px; }\n  .hb.look { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }\n  .hb.miss { border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft); }\n  .hb.hit { border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }\n  .hb .e { padding:4px 5px; border-radius:6px; background:var(--accent-soft); margin-bottom:4px; line-height:1.35; word-break:break-all; }\n  .hb .e.orphan { background:var(--red-soft); color:var(--red); }\n  .hb-keys { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; font-family:var(--mono); font-size:12.5px; }\n  .hb-key { padding:5px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); }\n  .hb-key b { color:var(--accent); }\n  .hb-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 6\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Value Objects, Enums &amp; <span class=\"grad\">Immutability\u003C/span>\u003C/h1>\n    <p class=\"lead\">Some objects matter because of <i>who\u003C/i> they are: a user, an order, a session. Others matter only because of <i>what\u003C/i> they hold: an email address, an amount of money, a host and port. The second kind are <b>value objects\u003C/b>. Getting them right means getting <code>equals\u003C/code>, <code>hashCode\u003C/code> and immutability right, and those three decide whether your caches, sets and maps actually work.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Tell an entity (identity) from a value object (contents)\u003C/li>\n      <li>Write <code>equals\u003C/code> and <code>hashCode\u003C/code> that honour their contract, and explain the HashMap bugs when they don't\u003C/li>\n      <li>Use records for value objects, and know where they are only shallowly immutable\u003C/li>\n      <li>Make a class immutable, and say what that buys for sharing, hashing and threads\u003C/li>\n      <li>Put fields and behaviour on enums, and avoid persisting <code>ordinal()\u003C/code>\u003C/li>\n      <li>Represent money without floating-point errors\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b><code>==\u003C/code> compares references;\u003C/b> two separate objects are never <code>==\u003C/code>. See <a href=\"p1-classes-objects.html\">P1: Classes, Objects &amp; References\u003C/a>.\u003C/li>\n        <li><b>Defensive copies and <code>List.copyOf\u003C/code>.\u003C/b> See <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n        <li><b><code>@Override\u003C/code>, and the <code>equals(Session)\u003C/code> overload trap.\u003C/b> See <a href=\"p3-inheritance-dispatch.html\">P3: Inheritance &amp; Dynamic Dispatch\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Entities and value objects\u003C/h2>\n  <p>An <b>entity\u003C/b> has an identity that stays the same while its data changes. User u42 who changes their email is still user u42. Two users who happen to share a name are still two users. A <b>value object\u003C/b> has no identity beyond its contents. The address <code>db1.internal:5432\u003C/code> is equal to any other <code>db1.internal:5432\u003C/code>; there's no sense in which one of them is “the real one”.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Entity\u003C/th><th>Value object\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Examples\u003C/td><td>User, Order, Session, Connection\u003C/td><td>EmailAddress, Money, HostAndPort, Instant, Duration\u003C/td>\u003C/tr>\n        <tr><td>Equal when…\u003C/td><td>Same id (often just the same object)\u003C/td><td>All fields are equal\u003C/td>\u003C/
