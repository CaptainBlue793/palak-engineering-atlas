te { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px; }\r\n  .rate button { padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:700; font-size:13px; color:var(--text); }\r\n  .rate button small { display:block; font-weight:500; font-size:11px; color:var(--muted); margin-top:2px; }\r\n  .rate button:hover { transform:translateY(-2px); }\r\n  .rate .again { border-color:var(--red); color:var(--red); }\r\n  .rate .hard { border-color:var(--amber); color:var(--amber); }\r\n  .rate .good { border-color:var(--accent-2); color:var(--accent-2); }\r\n  .rate .easy { border-color:var(--green); color:var(--green); }\r\n  .deck-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:16px; }\r\n  .empty { text-align:center; padding:60px 20px; }\r\n  .empty .big { font-size:54px; }\r\n  .heat { display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:3px; margin-top:10px; }\r\n  .heat i { aspect-ratio:1; border-radius:4px; background:var(--surface-3); display:grid; place-items:center; font-size:9px; font-family:var(--mono); color:var(--muted); font-style:normal; }\r\n  .heat i.l1 { background:var(--red-soft); color:var(--red); }\r\n  .heat i.l2 { background:var(--amber-soft); color:var(--amber); }\r\n  .heat i.l3 { background:var(--accent-2-soft); color:var(--accent-2); }\r\n  .heat i.l4 { background:var(--accent-soft); color:var(--accent); }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">🃏 Spaced repetition\u003C/span>\u003C/div>\r\n    <h1>Flashcards\u003C/h1>\r\n    <p class=\"lead\">Every quiz question in the course, turned into a deck that schedules itself. Cards you get right come back later; cards you miss come back soon. Five minutes a day beats an hour once.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"stats\" id=\"fcStats\">\u003C/div>\r\n\r\n  <div class=\"deck-bar\" style=\"margin-top:20px\">\r\n    <div class=\"seg\" id=\"fcScope\"><button data-v=\"due\" class=\"active\">⏰ Due today\u003C/button><button data-v=\"new\">✨ New cards\u003C/button><button data-v=\"all\">📚 Everything\u003C/button><button data-v=\"weak\">🎯 Weakest first\u003C/button>\u003C/div>\r\n    <select class=\"inp\" id=\"fcLevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n    <button class=\"btn sm\" id=\"fcShuffle\">🔀 Shuffle\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"card-stage\" id=\"stage\">\u003C/div>\r\n\r\n  <h2 style=\"margin-top:60px\">Your deck\u003C/h2>\r\n  <p class=\"small muted\">One square per card, coloured by how well you know it. Hover to see the chapter.\u003C/p>\r\n  <div class=\"heat\" id=\"heat\">\u003C/div>\r\n  <div class=\"legend\" style=\"margin-top:10px\"><span><i style=\"background:var(--surface-3)\">\u003C/i>unseen\u003C/span><span><i style=\"background:var(--red-soft)\">\u003C/i>learning\u003C/span><span><i style=\"background:var(--amber-soft)\">\u003C/i>shaky\u003C/span><span><i style=\"background:var(--accent-2-soft)\">\u003C/i>familiar\u003C/span><span><i style=\"background:var(--accent-soft)\">\u003C/i>known\u003C/span>\u003C/div>\r\n  <div class=\"controls\" style=\"justify-content:center;margin-top:20px\">\r\n    <button class=\"btn sm ghost\" id=\"fcReset\">Reset all flashcard progress\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🧠\u003C/div><div class=\"body\"><div class=\"title\">How the scheduling works\u003C/div><p>A simplified SM-2: each card has an <b>ease\u003C/b> and an <b>interval\u003C/b>. “Again” resets it to today, “Hard” nudges the interval up slightly, “Good” multiplies it by the ease, and “Easy” multiplies it more and raises the ease. Intervals grow 1 → 3 → 7 → 16 → 35 days, so a card you know well disappears for a month. Progress is stored in this browser only.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, LS, chNum, chName } = LLD;\r\n  const CARDS = (window.LLD_CARDS || []).map((c, i) => ({ ...c, id: i }));\r\n  const DAY = 86400000;\r\n  let state = LS.get('lld-cards', {});          // id -> {due, iv, ease, reps, lapses}\r\n  let queue = [], cur = null, answered = false, chosen = -1;\r\n\r\n  const today = () => Math.floor(Date.now() / DAY);\r\n  const st = (id) => state[id] || { due: 0, iv: 0, ease: 2.5, reps: 0, lapses: 0 };\r\n  const isNew = (id) => !state[id];\r\n  const isDue = (id) => !isNew(id) && st(id).due <= today();\r\n\r\n  // level filter\r\n  const levels = [...new Set(CARDS.map(c => c.lv))];\r\n  $('#fcLevel').innerHTML = '<option value=\"\">All levels\u003C/option>' + levels.map(l => `<option>${l}\u003C/option>`).join('');\r\n\r\n  function build() {\r\n    const scope = $('#fcScope').dataset.value, lv = $('#fcLevel').value;\r\n    let pool = CARDS.filter(c => !lv || c.lv === lv);\r\n    if (scope === 'due') pool = pool.filter(c => isDue(c.id));\r\n    else if (scope === 'new') pool = pool.filter(c => isNew(c.id));\r\n    else if (scope === 'weak') pool = pool.slice().sort((a, b) => (st(a.id).ease + st(a.id).reps * 0.2) - (st(b.id).ease + st(b.id).reps * 0.2));\r\n    if (scope === 'due' && !pool.length) pool = CARDS.filter(c => (!lv || c.lv === lv) && isNew(c.id)).slice(0, 20);\r\n    if (scope !== 'weak') pool = pool.sort(() => Math.random() - .5);\r\n    queue = pool;\r\n    next();\r\n    stats();\r\n  }\r\n  function next() {\r\n    cur = queue.shift() || null;\r\n    answered = false; chosen = -1;\r\n    render();\r\n  }\r\n  function render() {\r\n    const stage = $('#stage');\r\n    if (!CARDS.length) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🃏\u003C/div><h3>No cards yet\u003C/h3><p class=\"muted small\">The deck is built from each chapter’s quiz. Cards appear here as chapters are written.\u003C/p>\u003C/div>`;\r\n      return;\r\n    }\r\n    if (!cur) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🎉\u003C/div><h3>Nothing left in this pile\u003C/h3><p class=\"muted small\">Come back tomorrow for the next batch, or switch to “New cards” / “Everything” above.\u003C/p><div class=\"controls\" style=\"justify-content:center\"><button class=\"btn primary\" id=\"againBtn\">Study everything\u003C/button>\u003C/div>\u003C/div>`;\r\n      const b = $('#againBtn'); if (b) b.onclick = () => { $$('#fcScope button').forEach(x => x.classList.toggle('active', x.dataset.v === 'all')); $('#fcScope').dataset.value = 'all'; build(); };\r\n      return;\r\n    }\r\n    const s = st(cur.id);\r\n    const badge = isNew(cur.id) ? '✨ new' : `seen ${s.reps}× · next in ${Math.max(0, s.due - today())}d`;\r\n    stage.innerHTML = `<div class=\"fc\">\r\n      <div class=\"meta\"><span>${chName(cur.n)} · ${cur.ti}\u003C/span><span>${badge}\u003C/span>\u003C/div>\r\n      <div class=\"q\">${cur.q}\u003C/div>\r\n      <div class=\"opts\">${cur.o.map((o, i) => `<button class=\"opt\" data-i=\"${i}\">${o}\u003C/button>`).join('')}\u003C/div>\r\n      <div id=\"post\">\u003C/div>\r\n    \u003C/div>`;\r\n    $$('#stage .opt').forEach(b => b.onclick = () => answer(+b.dataset.i));\r\n  }\r\n  function answer(i) {\r\n    if (answered) return;\r\n    answered = true; chosen = i;\r\n    $$('#stage .opt').forEach((b, j) => {\r\n      b.disabled = true;\r\n      if (j === cur.a) b.classList.add('correct');\r\n      else if (j === i) b.classList.add('wrong');\r\n    });\r\n    $('#post').innerHTML = `<div class=\"why\">${i === cur.a ? '✅ ' : '❌ '}${cur.w}<br><a class=\"small\" href=\"${cur.f}\">Revisit ${chName(cur.n)} →\u003C/a>\u003C/div>\r\n      <div class=\"rate\">\r\n        <button class=\"again\" data-r=\"0\">Again<small>&lt; 10 min\u003C/small>\u003C/button>\r\n        <button class=\"hard\" data-r=\"1\">Hard<small id=\"r1\">\u003C/small>\u003C/button>\r\n        <button class=\"good\" data-r=\"2\">Good<small id=\"r2\">\u003C/small>\u003C/button>\r\n        <button class=\"easy\" data-r=\"3\">Easy<small id=\"r3\">\u003C/small>\u003C/button>\r\n      \u003C/div>`;\r\n    const s = st(cur.id);\r\n    const iv = (mult, min) => Math.max(min, Math.round((s.iv || 1) * mult));\r\n    $('#r1').textContent = iv(1.2, 1) + 'd'; $('#r2').textContent = iv(s.ease, 1) + 'd'; $('#r3').textContent = iv(s.ease * 1.4, 4) + 'd';\r\n    $$('#stage .rate button').forEach(b => b.onclick = () => grade(+b.dataset.r));\r\n    if (i !== cur.a) LLD.toast('Marked for another look soon');\r\n  }\r\n  function grade(r) {\r\n    const s = { ...st(cur.id) };\r\n    s.reps = (s.reps || 0) + 1;\r\n    if (r === 0 || chosen !== cur.a) { s.lapses = (s.lapses || 0) + 1; s.iv = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.due = today(); }\r\n    else if (r === 1) { s.iv = Math.max(1, Math.round((s.iv || 1) * 1.2)); s.ease = Math.max(1.3, s.ease - 0.05); s.due = today() + s.iv; }\r\n    else if (r === 2) { s.iv = Math.max(1, Math.round((s.iv || 1) * s.ease)); s.due = today() + s.iv; }\r\n    else { s.iv = Math.max(4, Math.round((s.iv || 1) * s.ease * 1.4)); s.ease = Math.min(3.2, s.ease + 0.1); s.due = today() + s.iv; }\r\n    state[cur.id] = s;\r\n    LS.set('lld-cards', state);\r\n    if (r === 0 || chosen !== cur.a) queue.push(cur);      // see it again this session\r\n    next();\r\n  }\r\n  function stats() {\r\n    const due = CARDS.filter(c => isDue(c.id)).length;\r\n    const fresh = CARDS.filter(c => isNew(c.id)).length;\r\n    const known = CARDS.filter(c => st(c.id).iv >= 7).length;\r\n    const reps = Object.values(state).reduce((a, s) => a + (s.reps || 0), 0);\r\n    $('#fcStats').innerHTML = `\r\n      <div class=\"stat acc\"><div class=\"k\">Due now\u003C/div><div class=\"v\">${due}\u003C/div>\u003C/div>\r\n      <div class=\"stat\"><div class=\"k\">Not started\u003C/div><div class=\"v\">${fresh}\u003C/div>\u003C/div>\r\n      <div class=\"stat good\"><div class=\"k\">Known (7d+ interval)\u003C/div><div class=\"v\">${known} <small>/ ${CARDS.length}\u003C/small>\u003C/div>\u003C/div>\r\n      <div class=\"stat warn\"><div class=\"k\">Total reviews\u003C/div><div class=\"v\">${reps}\u003C/div>\u003C/div>`;\r\n    $('#heat').innerHTML = CARDS.map(c => {\r\n      const s = st(c.id);\r\n      const lvl = isNew(c.id) ? 0 : s.iv >= 16 ? 4 : s.iv >= 7 ? 3 : s.iv >= 3 ? 2 : 1;\r\n      return `<i class=\"${lvl ? 'l' + lvl : ''}\" title=\"${chName(c.n)}: ${c.ti}${isNew(c.id) ? ' — not started' : ' — interval ' + s.iv + 'd'}\">${chNum(c.n)}\u003C/i>`;\r\n    }).join('');\r\n  }\r\n  $('#fcScope').addEventListener('segchange', build);\r\n  $('#fcLevel').addEventListener('change', build);\r\n  $('#fcShuffle').onclick = () => { queue.sort(() => Math.random() - .5); next(); };\r\n  $('#fcReset').onclick = () => { if (confirm('Reset all flashcard scheduling? Chapter progress is not affected.')) { state = {}; LS.set('lld-cards', state); build(); } };\r\n  addEventListener('keydown', e => {\r\n    if (!cur) return;\r\n    if (!answered && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < cur.o.length) answer(i); }\r\n    else if (answered && /^[1-4]$/.test(e.key)) grade(+e.key - 1);\r\n    else if (e.key === ' ' && answered) { e.preventDefault(); grade(2); }\r\n  });\r\n  build();\r\n})();\r\n"]},"glossary.html":{"title":"Glossary","chapter":"","styles":"\r\n  .alpha { display:flex; flex-wrap:wrap; gap:4px; margin:14px 0; }\r\n  .alpha button { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-2); font-weight:700; font-size:13px; cursor:pointer; }\r\n  .alpha button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }\r\n  .alpha button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\r\n  .alpha button:disabled { opacity:.25; cursor:default; }\r\n  .gl-group { margin-top:26px; }\r\n  .gl-letter { font-family:var(--mono); font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.1em; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:10px; }\r\n  .gl { display:grid; gap:8px; }\r\n  .gt { display:grid; grid-template-columns:250px 1fr auto; gap:14px; align-items:baseline; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); animation:fadeUp .2s; }\r\n  @media (max-width:760px){ .gt { grid-template-columns:1fr; gap:4px; } }\r\n  .gt b { font-size:14.5px; }\r\n  .gt .def { color:var(--text-2); font-size:14px; line-height:1.55; }\r\n  .gt .ch { font-size:11.5px; font-family:var(--mono); white-space:nowrap; }\r\n  .gt mark { background:var(--amber-soft); color:var(--text); border-radius:3px; padding:0 2px; }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">📖 <span id=\"count\">\u003C/span> terms\u003C/span>\u003C/div>\r\n    <h1>Glossary\u003C/h1>\r\n    <p class=\"lead\">Every term this course uses, in one sentence each, linked to the chapter that explains it properly. Useful the night before an interview — and for the moment someone says “that breaks Liskov” and you would rather not nod along.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"controls\" style=\"margin-top:8px\">\r\n    <input class=\"inp\" id=\"gq\" placeholder=\"Filter terms… (e.g. cohesion, decorator, invariant)\" style=\"flex:1;min-width:220px\" autocomplete=\"off\">\r\n    <select class=\"inp\" id=\"glevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n  \u003C/div>\r\n  <div class=\"alpha\" id=\"alpha\">\u003C/div>\r\n  <div id=\"glist\">\u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🔎\u003C/div><div class=\"body\"><div class=\"title\">Looking for something specific?\u003C/div><p>Press <kbd class=\"kbd\">Ctrl\u003C/kbd>+<kbd class=\"kbd\">K\u003C/kbd> anywhere in the course to search every chapter, section and visualizer by name.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, CHAPTERS, chNum } = LLD;\r\n  // [term, one-line definition, chapter number]\r\n  const T = [\r\n    ['Abstract class', 'A class that cannot be instantiated and may mix implemented methods with abstract ones; use it when subclasses share state or code, an interface when they only share a role.', 0.4],\r\n    ['Abstract Factory', 'An object that creates a whole family of related objects (a driver’s Connection, Statement and ResultSet) so they always match.', 10],\r\n    ['Adapter', 'A wrapper that makes an existing class fit the interface a client expects, e.g. two payment SDKs behind one PaymentGateway.', 12],\r\n    ['Aggregate', 'A cluster of domain objects changed together through one root entity, which is the only thing outside code may hold a reference to.', 27],\r\n    ['Aggregation', 'A has-a relationship where the part can outlive the whole: a Team has Players, but deleting the team does not delete them.', 6],\r\n    ['Anemic domain model', 'Classes that hold only data with getters and setters, while all behaviour lives in “service” classes — procedural code dressed as objects.', 21],\r\n    ['Association', 'Any structural link between two classes where one holds a reference to the other.', 6],\r\n    ['Backpressure', 'Slowing or blocking producers when a bounded queue is full, so a fast producer cannot exhaust memory.', 23],\r\n    ['BlockingQueue', 'A java.util.concurrent queue whose put blocks when full and take blocks when empty — the backbone of producer-consumer designs.', 23],\r\n    ['Bridge', 'Splitting an abstraction from its implementation so the two can vary independently, avoiding a subclass for every combination.', 12],\r\n    ['Builder', 'An object that assembles a complex, often immutable object step by step and validates it once in build().', 11],\r\n    ['Chain of Responsibility', 'A pipeline of handlers where each either handles a request or passes it to the next, like servlet filters or HTTP middleware.', 19],\r\n    ['Circuit breaker', 'A state machine (closed, open, half-open) that stops calling a failing dependency until it looks healthy again.', 25],\r\n    ['Class invariant', 'A condition that must hold for every object of a class between public method calls, such as balance ≥ 0.', 0.2],\r\n    ['Cohesion', 'How closely the members of a class belong together; high cohesion means every method uses most of the fields.', 5],\r\n    ['Command', 'A request packaged as an object, so it can be queued, logged, retried or undone.', 17],\r\n    ['Command-query separation', 'A method either changes state (a command) or returns information (a query), never both.', 7],\r\n    ['Composite', 'A tree where a single item and a group share one interface, so a Directory and a File can both be asked for size().', 14],\r\n    ['Composition', 'A has-a relationship where the whole owns the part’s lifecycle: a House’s Rooms are destroyed with it.', 6],\r\n    ['Composition root', 'The single place near main() where the whole object graph is constructed and wired together.', 8],\r\n    ['Constructor injection', 'Passing a class’s collaborators into its constructor rather than creating them inside, so they can be swapped and tested.', 8],\r\n    ['Coupling', 'How much one class depends on the details of another; lower coupling means a change stays local.', 5],\r\n    ['Decorator', 'A wrapper with the same interface as the object it wraps that adds behaviour, like BufferedInputStream around a FileInputStream.', 13],\r\n    ['Defensive copy', 'Copying a mutable argument or field on the way in or out, so callers cannot change an object’s state behind its back.', 0.2],\r\n    ['Dependency inversion', 'High-level policy and low-level detail both depend on an abstraction, rather than policy depending on detail.', 4],\r\n    ['Domain event', 'An object that records something that happened in the domain (OrderPlaced), published so other parts can react.', 27],\r\n    ['Double dispatch', 'Choosing a method by the runtime types of two objects; Visitor achieves it with accept() calling back visit(this).', 20],\r\n    ['Dynamic dispatch', 'Choosing which overridden method runs from the object’s runtime class, not the reference’s declared type.', 0.3],\r\n    ['Encapsulation', 'Hiding a class’s state behind methods that keep its invariants true.', 0.2],\r\n    ['Entity', 'A domain object defined by a stable identity rather than its attribute values; two Users with the same name are still different users.', 27],\r\n    ['Facade', 'A simple interface in front of a complicated subsystem.', 12],\r\n    ['Factory Method', 'A method that subclasses or callers use to decide which concrete class to instantiate.', 10],\r\n    ['Fail fast', 'Rejecting invalid input at the boundary with an exception, instead of letting a bad value travel and fail somewhere confusing.', 7],\r\n    ['Flyweight', 'Sharing immutable, intrinsic state across many objects to save memory, e.g. one Glyph object per character code.', 14],\r\n    ['God class', 'A class that knows and does too much, with many unrelated reasons to change.', 3],\r\n    ['Idempotency', 'An operation that has the same effect whether it runs once or many times, which makes retries safe.', 25],\r\n    ['Immutability', 'An object whose state cannot change after construction; immutable objects are thread-safe without locks.', 0.6],\r\n    ['Interface segregation', 'Clients should not be forced to depend on methods they do not use, so split fat interfaces into role interfaces.', 4],\r\n    ['Iterator', 'An object that walks a collection one element at a time without exposing how it is stored.', 20],\r\n    ['Law of Demeter', 'Talk only to your immediate collaborators: a.getB().getC().doIt() is a “train wreck” that couples you to B and C.', 5],\r\n    ['Liskov substitution', 'A subclass must be usable anywhere its parent is, without surprising the caller.', 4],\r\n    ['Mediator', 'An object that coordinates many components so they talk to it instead of to each other.', 16],\r\n    ['Memento', 'A snapshot of an object’s state that can restore it later without exposing its internals.', 17],\r\n    ['Multiplicity', 'The 1, 0..1, * or 1..* on a UML association, saying how many objects can be at each end.', 0.8],\r\n    ['Observer', 'A subject keeps a list of listeners and notifies them when its state changes.', 16],\r\n    ['Open/closed principle', 'Code should be open for extension but closed for modification: add a new class instead of editing a switch.', 3],\r\n    ['Optional', 'A container that may or may not hold a value, used as a return type instead of null.', 0.7],\r\n    ['Overloading', 'Several methods with the same name and different parameter lists, chosen at compile time.', 0.3],\r\n    ['Overriding', 'A subclass redefining an inherited method with the same signature, chosen at runtime.', 0.3],\r\n    ['Prototype', 'Creating new objects by copying an existing, configured instance.', 11],\r\n    ['Proxy', 'A stand-in with the same interface as the real object that controls access to it: caching, lazy loading or permission checks.', 13],\r\n    ['Race condition', 'A bug where the result depends on how threads interleave, e.g. two threads both passing a check-then-act test.', 22],\r\n    ['Record', 'A compact Java class for immutable data that generates the constructor, accessors, equals, hashCode and toString.', 0.6],\r\n    ['Repository', 'A collection-like interface for loading and saving aggregates that hides the database from the domain.', 26],\r\n    ['Sequence diagram', 'A UML diagram of objects as vertical lifelines and the calls between them in time order.', 0.8],\r\n    ['Single responsibility', 'A class should have one reason to change — one actor or concern it answers to.', 3],\r\n    ['Singleton', 'A class with exactly one instance and a global access point; usually better replaced by injecting one shared instance.', 9],\r\n    ['SOLID', 'Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion.', 3],\r\n    ['State', 'A pattern where an object delegates behaviour to a state object and changes behaviour by swapping it.', 18],\r\n    ['Strategy', 'A family of interchangeable algorithms behind one interface, chosen at runtime.', 15],\r\n    ['Template Method', 'A base-class method that fixes an algorithm’s steps and lets subclasses fill in some of them.', 19],\r\n    ['Test double', 'Any stand-in for a real collaborator in a test: a dummy, stub, fake, spy or mock.', 28],\r\n    ['Thread pool', 'A fixed set of worker threads that execute submitted tasks, reusing threads instead of creating one per task.', 23],\r\n    ['Unit of Work', 'An object that tracks every change made during a business operation and commits them in one transaction.', 26],\r\n    ['Value object', 'An immutable object defined only by its values, like Money or an EmailAddress; two with equal values are interchangeable.', 27],\r\n    ['Visitor', 'Adding an operation to a class hierarchy by putting it in a separate visitor class with one method per element type.', 20],\r\n  ];\r\n\r\n  const levels = [...new Set(CHAPTERS.map(c => c.level))];\r\n  $('#glevel').innerHTML = '<option value=\"\">All levels\u003C/option>' + levels.map(l => `<option>${l}\u003C/option>`).join('');\r\n  $('#count').textContent = T.length;\r\n\r\n  let letter = '';\r\n  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\r\n  function hl(text, q) {\r\n    if (!q) return esc(text);\r\n    const i = text.toLowerCase().indexOf(q);\r\n    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '\u003C/mark>' + esc(text.slice(i + q.length));\r\n  }\r\n  const firstChar = t => { const c = t[0].toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };\r\n  function render() {\r\n    const q = $('#gq').value.trim().toLowerCase(), lv = $('#glevel').value;\r\n    const rows = T.filter(([t, d, n]) => {\r\n      const ch = CHAPTERS.find(c => c.n === n);\r\n      if (lv && (!ch || ch.level !== lv)) return false;\r\n      if (letter && firstChar(t) !== letter) return false;\r\n      if (q && !(t.toLowerCase().includes(q) || d.toLowerCase().includes(q))) return false;\r\n      return true;\r\n    });\r\n    const groups = {};\r\n    rows.forEach(r => { const L = firstChar(r[0]); (groups[L] = groups[L] || []).push(r); });\r\n    $('#glist').innerHTML = Object.keys(groups).sort().map(L => `<div class=\"gl-group\"><div class=\"gl-letter\">${L}\u003C/div><div class=\"gl\">` +\r\n      groups[L].map(([t, d, n]) => {\r\n        const ch = CHAPTERS.find(c => c.n === n);\r\n        return `<div class=\"gt\"><b>${hl(t, q)}\u003C/b><span class=\"def\">${hl(d, q)}\u003C/span>${ch ? `<a class=\"ch\" href=\"${ch.file}\">${/^P/.test(chNum(n)) ? chNum(n) : 'Ch ' + n} →\u003C/a>` : ''}\u003C/div>`;\r\n      }).join('') + '\u003C/div>\u003C/div>').join('') || '<p class=\"muted\" style=\"margin-top:20px\">No terms match that filter.\u003C/p>';\r\n    const present = new Set(T.map(t => firstChar(t[0])));\r\n    $('#alpha').innerHTML = `<button class=\"${letter === '' ? 'on' : ''}\" data-l=\"\">All\u003C/button>` +\r\n      `<button class=\"${letter === '#' ? 'on' : ''}\" data-l=\"#\" ${present.has('#') ? '' : 'disabled'}>#\u003C/button>` +\r\n      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L => `<button class=\"${letter === L ? 'on' : ''}\" data-l=\"${L}\" ${present.has(L) ? '' : 'disabled'}>${L}\u003C/button>`).join('');\r\n    $$('#alpha button').forEach(b => b.onclick = () => { letter = b.dataset.l; render(); });\r\n  }\r\n  $('#gq').addEventListener('input', () => { letter = ''; render(); });\r\n  $('#glevel').addEventListener('change', render);\r\n  render();\r\n})();\r\n"]},"mock-interview.html":{"title":"Mock Interview","chapter":"","styles":"\r\n  .prompt-card { border:1px solid var(--border); border-radius:20px; background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface); box-shadow:var(--shadow-lg); padding:24px; }\r\n  .prompt-card h2 { margin:6px 0 10px !important; font-size:30px !important; letter-spacing:-.02em; }\r\n  .prompt-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }\r\n  .prompt-card .tags span { font-size:11.5px; font-family:var(--mono); padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }\r\n  .clock { font-family:var(--mono); font-size:52px; font-weight:800; letter-spacing:-.03em; line-height:1; }\r\n  .phases { display:flex; gap:4px; height:46px; border-radius:12px; overflow:hidden; margin-top:12px; }\r\n  .phase { display:grid; place-items:center; font-size:11.5px; font-weight:800; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:9px; position:relative; overflow:hidden; text-align:center; line-height:1.15; padding:0 4px; }\r\n  .phase i { position:absolute; left:0; top:0; bottom:0; background:var(--accent-soft); width:0; }\r\n  .phase span { position:relative; }\r\n  .phase.cur { border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent-soft); }\r\n  .phase.done { background:var(--accent-soft); color:var(--accent); border-color:transparent; }\r\n  .rubric { display:grid; gap:8px; }\r\n  .rub { display:grid; grid-template-columns:1fr 150px; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); }\r\n  .rub b { font-size:14px; } .rub small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }\r\n  .scoreset { display:flex; gap:4px; }\r\n  .scoreset button { flex:1; border:1.5px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 0; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text-2); }\r\n  .scoreset button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\r\n  .hist { display:grid; gap:8px; }\r\n  .hist div { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:9px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; }\r\n  .hist .sc { font-family:var(--mono); font-weight:800; }\r\n  textarea.notes { width:100%; min-height:170px; font-size:14px; line-height:1.6; resize:vertical; }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">🎤 45-minute drill\u003C/span>\u003C/div>\r\n    <h1>Mock Interview\u003C/h1>\r\n    <p class=\"lead\">Draw a problem, start the clock, and design out loud — sketch the class diagram on paper, then write the core classes in a plain editor with no autocomplete. The timer tells you what you should be doing; the rubric afterwards tells you what you skipped. Scoring yourself honestly is where the improvement comes from.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"prompt-card\" id=\"prompt\">\u003C/div>\r\n\r\n  <div class=\"controls\" style=\"margin-top:16px\">\r\n    <button class=\"btn primary\" id=\"draw\">🎲 Draw a problem\u003C/button>\r\n    <div class=\"seg\" id=\"diff\"><button data-v=\"\" class=\"active\">Any level\u003C/button><button data-v=\"e\">Starter\u003C/button><button data-v=\"m\">Medium\u003C/button><button data-v=\"h\">Hard\u003C/button>\u003C/div>\r\n    <select class=\"inp\" id=\"tagSel\" aria-label=\"Filter by concept\">\u003C/select>\r\n  \u003C/div>\r\n\r\n  <div class=\"split\" style=\"margin-top:24px;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)\">\r\n    <div class=\"card\" style=\"margin:0\">\r\n      <div class=\"clock\" id=\"clock\">00:00\u003C/div>\r\n      <div class=\"small muted\" id=\"phaseLeft\">Not started\u003C/div>\r\n      <div class=\"controls\" style=\"margin-top:12px\">\r\n        <button class=\"btn primary sm\" id=\"start\">▶ Start\u003C/button>\r\n        <button class=\"btn sm\" id=\"skip\">⏭ Next phase\u003C/button>\r\n        <button class=\"btn sm\" id=\"reset\">↺ Reset\u003C/button>\r\n      \u003C/div>\r\n      <div class=\"seg\" id=\"len\" style=\"margin-top:10px\"><button data-v=\"35\">35 min\u003C/button><button data-v=\"45\" class=\"active\">45 min\u003C/button><button data-v=\"60\">60 min\u003C/button>\u003C/div>\r\n    \u003C/div>\r\n    <div class=\"card\" style=\"margin:0\">\r\n      <div style=\"font-weight:800\" id=\"phaseTitle\">👋 Draw a problem and press start\u003C/div>\r\n      <ul class=\"small\" id=\"phasePrompts\" style=\"margin-top:8px\">\u003C/ul>\r\n    \u003C/div>\r\n  \u003C/div>\r\n  <div class=\"phases\" id=\"phases\">\u003C/div>\r\n\r\n  <h2>Notes\u003C/h2>\r\n  <p class=\"small muted\">Jot your use cases, classes and design decisions here — or use it as a checklist while you talk. Saved in this browser as you type.\u003C/p>\r\n  <textarea class=\"inp notes\" id=\"notes\" placeholder=\"Use cases and actors…&#10;Out of scope…&#10;Entities and relationships…&#10;Interfaces and patterns…&#10;Key method signatures…&#10;Follow-ups: extension, concurrency, tests…\">\u003C/textarea>\r\n\r\n  <h2>Score yourself\u003C/h2>\r\n  <p class=\"small muted\">0 = didn't do it · 1 = touched on it · 2 = solid · 3 = what a strong senior candidate does. Be strict; the point is to find gaps.\u003C/p>\r\n  <div class=\"rubric\" id=\"rubric\">\u003C/div>\r\n  <div class=\"stats\">\r\n    <div class=\"stat acc\"><div class=\"k\">Score\u003C/div><div class=\"v\" id=\"scoreV\">0 <small>/ 24\u003C/small>\u003C/div>\u003C/div>\r\n    <div class=\"stat\"><div class=\"k\">Reads as\u003C/div><div class=\"v\" id=\"scoreBand\" style=\"font-size:16px\">–\u003C/div>\u003C/div>\r\n    <div class=\"stat good\"><div class=\"k\">Strongest\u003C/div><div class=\"v\" id=\"scoreBest\" style=\"font-size:14px\">–\u003C/div>\u003C/div>\r\n    <div class=\"stat bad\"><div class=\"k\">Weakest\u003C/div><div class=\"v\" id=\"scoreWorst\" style=\"font-size:14px\">–\u003C/div>\u003C/div>\r\n  \u003C/div>\r\n  <div class=\"controls\">\r\n    <button class=\"btn primary\" id=\"save\">💾 Save this session\u003C/button>\r\n    <button class=\"btn\" id=\"copy\">📋 Copy write-up\u003C/button>\r\n    <button class=\"btn ghost\" id=\"clearAll\">Clear history\u003C/button>\r\n  \u003C/div>\r\n\r\n  <h2>Session history\u003C/h2>\r\n  <div class=\"hist\" id=\"hist\">\u003C/div>\r\n  <div id=\"weakSpots\">\u003C/div>\r\n\r\n  <div class=\"callout interview\" style=\"margin-top:40px\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">How to practise so it actually transfers\u003C/div><p>Speak <b>out loud\u003C/b> — silent thinking is the most common thing that separates people who know the material from people who pass interviews. Draw the diagram. When the timer moves to a new phase, move on even if you're not finished; running out of time in the deep-dive phase is the classic failure. Afterwards, look up the one thing you were least sure about and read that chapter section again.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, LS, CHAPTERS } = LLD;\r\n\r\n  /* ================= Problem bank ================= */\r\n  const P = [\r\n    ['LRU cache', 'e', ['data structures', 'strategy'], 31, 'O(1) get and put with a capacity; then add LFU without rewriting the cache.'],\r\n    ['Rate limiter', 'e', ['strategy', 'concurrency'], 32, 'Per-client limits; token bucket first, then swap in a sliding window.'],\r\n    ['Logging framework', 'e', ['chain', 'singleton'], 33, 'Levels, multiple appenders and formats; then make logging asynchronous.'],\r\n    ['Parking lot', 'e', ['modeling', 'strategy'], 40, 'Multiple levels and spot sizes, tickets and hourly fees.'],\r\n    ['Vending machine', 'e', ['state'], 45, 'Select, pay, dispense, refund — no flag soup.'],\r\n    ['Tic-tac-toe on an N×N board', 'e', ['modeling'], 44, 'Two players, win detection in O(1) per move.'],\r\n    ['In-memory pub-sub broker', 'm', ['observer', 'concurrency'], 34, 'Topics, many subscribers, replay from an offset.'],\r\n    ['Task scheduler', 'm', ['command', 'concurrency'], 35, 'One-off, delayed and recurring jobs on a worker pool.'],\r\n    ['In-memory file system', 'm', ['composite'], 36, 'mkdir -p, ls, write and read files by path.'],\r\n    ['Key-value store with transactions', 'm', ['memento', 'command'], 37, 'GET/SET/DELETE with nested BEGIN, ROLLBACK and COMMIT.'],\r\n    ['Text editor with undo', 'm', ['command', 'memento'], 38, 'Insert, delete, move the cursor, undo and redo.'],\r\n    ['Connection pool', 'm', ['concurrency'], 39, 'Bounded pool, acquire with timeout, validate idle connections.'],\r\n    ['Splitwise', 'm', ['strategy', 'modeling'], 43, 'Equal, exact and percentage splits; who owes whom.'],\r\n    ['ATM', 'm', ['state', 'chain'], 45, 'Card, PIN, withdraw — dispense notes of several denominations.'],\r\n    ['Elevator system', 'h', ['state', 'strategy'], 41, 'N cars, M floors, a pluggable dispatch policy.'],\r\n    ['Movie ticket booking', 'h', ['concurrency', 'state'], 42, 'Seat selection with temporary holds; never double-book.'],\r\n    ['Chess', 'h', ['modeling', 'command'], 44, 'Legal moves per piece, check, checkmate and undo.'],\r\n    ['Ride-hailing (LLD)', 'h', ['observer', 'strategy'], 46, 'Request, match, track and complete a trip; surge pricing.'],\r\n  ];\r\n  const LEVELS = { e: ['Starter', 'e'], m: ['Medium', 'm'], h: ['Hard', 'h'] };\r\n  const tags = [...new Set(P.flatMap(p => p[2]))].sort();\r\n  $('#tagSel').innerHTML = '<option value=\"\">Any concept\u003C/option>' + tags.map(t => `<option>${t}\u003C/option>`).join('');\r\n\r\n  let cur = null;\r\n  function draw() {\r\n    const d = $('#diff').dataset.value, tg = $('#tagSel').value;\r\n    const pool = P.filter(p => (!d || p[1] === d) && (!tg || p[2].includes(tg)));\r\n    if (!pool.length) { LLD.toast('No problems match those filters'); return; }\r\n    cur = pool[Math.floor(Math.random() * pool.length)];\r\n    const ch = cur[3] ? CHAPTERS.find(c => c.n === cur[3]) : null;\r\n    $('#prompt').innerHTML = `\r\n      <div class=\"eyebrow\"><span class=\"pill ${cur[1] === 'h' ? 'red' : cur[1] === 'm' ? 'amber' : 'green'}\">${LEVELS[cur[1]][0]}\u003C/span><span class=\"pill\">🎤 design it out loud\u003C/span>\u003C/div>\r\n      <h2>Design ${cur[0]}\u003C/h2>\r\n      <p class=\"small\" style=\"margin:0;color:var(--text-2)\">${cur[4]}\u003C/p>\r\n      <div class=\"tags\">${cur[2].map(t => `<span>${t}\u003C/span>`).join('')}\u003C/div>\r\n      ${ch ? `<p class=\"small\" style=\"margin:12px 0 0\">📘 Worked solution afterwards: <a href=\"${ch.file}\">Chapter ${ch.n} — ${ch.title}\u003C/a>\u003C/p>` : '<p class=\"small muted\" style=\"margin:12px 0 0\">No worked chapter for this one — compare with a friend or write your own notes.\u003C/p>'}`;\r\n    reset();\r\n  }\r\n  $('#draw').onclick = draw;\r\n  $('#diff').addEventListener('segchange', draw);\r\n  $('#tagSel').addEventListener('change', draw);\r\n\r\n  /* ================= Timer ================= */\r\n  const PLANS = {\r\n    35: [['Requirements', 4], ['Entities', 5], ['Class design', 8], ['APIs & flows', 5], ['Code', 10], ['Extend', 3]],\r\n    45: [['Requirements', 5], ['Entities', 5], ['Class design', 10], ['APIs & flows', 6], ['Code', 14], ['Extend', 5]],\r\n    60: [['Requirements', 6], ['Entities', 7], ['Class design', 12], ['APIs & flows', 8], ['Code', 20], ['Extend', 7]],\r\n  };\r\n  const PROMPTS = {\r\n    'Requirements': ['Restate the problem and list the core use cases', 'Who are the actors? What does each one do?', 'Cut scope out loud: what is explicitly not in version one?', 'Single process or concurrent access? In-memory or persisted?'],\r\n    'Entities': ['List the nouns: which become classes, which are just fields?', 'Mark which are entities (identity) and which are value objects', 'Name the relationships and their multiplicities', 'Spot what varies — that is where an interface goes'],\r\n    'Class design': ['Draw the class diagram: interfaces first, then implementations', 'Name the pattern for each variation point, and say why', 'Check each class against single responsibility', 'Who owns whom? Who creates whom?'],\r\n    'APIs & flows': ['Write the public method signatures for the main use case', 'Walk one request through as a sequence diagram', 'Decide error handling: exceptions, Optional or result objects', 'Where do state changes happen, and are they atomic?'],\r\n    'Code': ['Start with the interfaces and the core class, not the edges', 'Constructor injection, final fields, validate at the boundary', 'Narrate as you go — silence is what loses offers', 'Leave obvious TODOs for the non-core pieces instead of writing them'],\r\n    'Extend': ['Handle the follow-up: which classes change, and which do not?', 'Make it thread-safe: what is shared, and how is it guarded?', 'How would you unit-test the core class?', 'Name one trade-off you made and the alternative'],\r\n  };\r\n  let tm = { elapsed: 0, running: false };\r\n  const plan = () => PLANS[$('#len').dataset.value];\r\n  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;\r\n  function phaseAt(sec) { let acc = 0; const p = plan(); for (let i = 0; i < p.length; i++) { acc += p[i][1] * 60; if (sec < acc) return { i, left: acc - sec }; } return { i: p.length, left: 0 }; }\r\n  function tick() {\r\n    const p = plan(), total = p.reduce((s, x) => s + x[1], 0) * 60;\r\n    const { i, left } = phaseAt(tm.elapsed);\r\n    $('#phases').innerHTML = p.map(([n, m], j) => {\r\n      const start = p.slice(0, j).reduce((s, x) => s + x[1], 0) * 60, frac = LLD.clamp((tm.elapsed - start) / (m * 60), 0, 1);\r\n      return `<div class=\"phase ${j < i ? 'done' : j === i && (tm.elapsed > 0 || tm.running) ? 'cur' : ''}\" style=\"flex:${m}\"><i style=\"width:${j === i ? frac * 100 : 0}%\">\u003C/i><span>${n}<br><small>${m}m\u003C/small>\u003C/span>\u003C/div>`;\r\n    }).join('');\r\n    $('#clock').textContent = fmt(tm.elapsed);\r\n    $('#clock').style.color = tm.elapsed >= total ? 'var(--red)' : '';\r\n    if (!tm.elapsed && !tm.running) { $('#phaseLeft').textContent = 'Not started'; return; }\r\n    if (i >= p.length) { $('#phaseTitle').textContent = '⏰ Time — now score yourself below'; $('#phasePrompts').innerHTML = ''; $('#phaseLeft').textContent = 'Session complete'; return; }\r\n    $('#phaseTitle').textContent = `${i + 1}. ${p[i][0]}`;\r\n    $('#phaseLeft').textContent = `${fmt(left)} left in this phase · ${fmt(Math.max(0, total - tm.elapsed))} total`;\r\n    $('#phasePrompts').innerHTML = PROMPTS[p[i][0]].map(x => `<li>${x}\u003C/li>`).join('');\r\n  }\r\n  let last = Date.now();\r\n  setInterval(() => { const now = Date.now(), dt = (now - last) / 1000; last = now; if (tm.running) { tm.elapsed += dt; tick(); } }, 250);\r\n  function reset() { tm = { elapsed: 0, running: false }; $('#start').textContent = '▶ Start'; $('#phaseTitle').textContent = cur ? 'Ready — press start and talk through it' : '👋 Draw a problem and press start'; $('#phasePrompts').innerHTML = ''; tick(); }\r\n  $('#start').onclick = () => { if (!cur) { draw(); } tm.running = !tm.running; $('#start').textContent = tm.running ? '⏸ Pause' : '▶ Resume'; tick(); };\r\n  $('#skip').onclick = () => { const p = plan(), { i } = phaseAt(tm.elapsed); tm.elapsed = p.slice(0, Math.min(i + 1, p.length)).reduce((s, x) => s + x[1], 0) * 60; tick(); };\r\n  $('#reset').onclick = reset;\r\n  $('#len').addEventListener('segchange', reset);\r\n\r\n  /* ================= Rubric ================= */\r\n  const RUB = [\r\n    ['Requirements & scope', 'Clarified use cases and actors; stated what is out of scope'],\r\n    ['Entities & relationships', 'Right classes, sensible ownership and multiplicities'],\r\n    ['Abstractions', 'Interfaces at the real variation points, not everywhere'],\r\n    ['Principles', 'Small, cohesive classes; SOLID applied where it paid off'],\r\n    ['Patterns', 'Named and used where they fit, never forced'],\r\n    ['Code quality', 'Readable, compiling-quality Java with clear names and validation'],\r\n    ['Extensibility & concurrency', 'Follow-ups handled with small changes; shared state guarded'],\r\n    ['Communication', 'Drove the session, thought out loud, adapted when challenged'],\r\n  ];\r\n  let scores = new Array(RUB.length).fill(0);\r\n  function rubric() {\r\n    $('#rubric').innerHTML = RUB.map(([n, d], i) => `<div class=\"rub\"><span><b>${n}\u003C/b><small>${d}\u003C/small>\u003C/span>\r\n      <span class=\"scoreset\">${[0, 1, 2, 3].map(v => `<button class=\"${scores[i] === v ? 'on' : ''}\" data-i=\"${i}\" data-v=\"${v}\">${v}\u003C/button>`).join('')}\u003C/span>\u003C/div>`).join('');\r\n    $$('#rubric button').forEach(b => b.onclick = () => { scores[+b.dataset.i] = +b.dataset.v; rubric(); });\r\n    const total = scores.reduce((a, b) => a + b, 0);\r\n    $('#scoreV').innerHTML = `${total} <small>/ ${RUB.length * 3}\u003C/small>`;\r\n    const band = total >= 20 ? '🏆 strong senior+' : total >= 15 ? '✅ solid senior' : total >= 10 ? '🙂 mid-level' : total ? '📚 keep drilling' : '–';\r\n    $('#scoreBand').textContent = band;\r\n    const idx = scores.map((s, i) => [s, i]);\r\n    const best = idx.slice().sort((a, b) => b[0] - a[0])[0], worst = idx.slice().sort((a, b) => a[0] - b[0])[0];\r\n    $('#scoreBest').textContent = total ? RUB[best[1]][0] : '–';\r\n    $('#scoreWorst').textContent = total ? RUB[worst[1]][0] : '–';\r\n  }\r\n  rubric();\r\n\r\n  /* ================= Notes, history ================= */\r\n  const notes = $('#notes');\r\n  notes.value = LS.get('lld-mock-notes', '');\r\n  notes.addEventListener('input', () => LS.set('lld-mock-notes', notes.value));\r\n\r\n  function writeUp() {\r\n    const total = scores.reduce((a, b) => a + b, 0);\r\n    return `# Mock interview — ${cur ? cur[0] : '(no problem drawn)'}\\n` +\r\n      `Date: ${new Date().toISOString().slice(0, 10)}   Length: ${$('#len').dataset.value} min   Score: ${total}/${RUB.length * 3}\\n\\n` +\r\n      RUB.map((r, i) => `- ${r[0]}: ${scores[i]}/3`).join('\\n') +\r\n      `\\n\\n## Notes\\n${notes.value || '(none)'}\\n`;\r\n  }\r\n  function renderHist() {\r\n    const h = LS.get('lld-mock-hist', []);\r\n    $('#hist').innerHTML = h.length ? h.slice().reverse().map(x =>\r\n      `<div><span><b>${x.p}\u003C/b><br><span class=\"muted small\">${x.d} · ${x.len} min\u003C/span>\u003C/span><span class=\"sc\">${x.s}/24\u003C/span><span class=\"small muted\">${x.worst}\u003C/span>\u003C/div>`).join('')\r\n      : '<div class=\"small muted\">No sessions saved yet.\u003C/div>';\r\n    // aggregate weak spots\r\n    if (h.length >= 2) {\r\n      const sums = new Array(RUB.length).fill(0);\r\n      h.forEach(x => (x.all || []).forEach((v, i) => sums[i] += v));\r\n      const avg = sums.map((s, i) => [s / h.length, i]).sort((a, b) => a[0] - b[0]);\r\n      $('#weakSpots').innerHTML = `<div class=\"callout warn\" style=\"margin-top:14px\"><div class=\"ico\">🎯\u003C/div><div class=\"body\"><div class=\"title\">Your pattern across ${h.length} sessions\u003C/div><p>Weakest areas: <b>${avg.slice(0, 2).map(a => RUB[a[1]][0] + ' (' + a[0].toFixed(1) + '/3)').join(', ')}\u003C/b>. Strongest: ${avg[avg.length - 1] ? RUB[avg[avg.length - 1][1]][0] : '–'}. Target the weak ones deliberately in your next two sessions.\u003C/p>\u003C/div>\u003C/div>`;\r\n    } else $('#weakSpots').innerHTML = '';\r\n  }\r\n  $('#save').onclick = () => {\r\n    if (!cur) { LLD.toast('Draw a problem first'); return; }\r\n    const total = scores.reduce((a, b) => a + b, 0);\r\n    const idx = scores.map((s, i) => [s, i]).sort((a, b) => a[0] - b[0]);\r\n    const h = LS.get('lld-mock-hist', []);\r\n    h.push({ p: cur[0], d: new Date().toISOString().slice(0, 10), len: $('#len').dataset.value, s: total, all: scores.slice(), worst: 'weakest: ' + RUB[idx[0][1]][0] });\r\n    LS.set('lld-mock-hist', h.slice(-40));\r\n    scores = new Array(RUB.length).fill(0); rubric(); renderHist();\r\n    LLD.toast('Session saved — draw another problem when you are ready');\r\n  };\r\n  $('#copy').onclick = async () => {\r\n    const text = writeUp();\r\n    try { await navigator.clipboard.writeText(text); LLD.toast('Write-up copied to clipboard'); }\r\n    catch (e) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' })); a.download = 'mock-interview.md'; a.click(); LLD.toast('Downloaded as Markdown'); }\r\n  };\r\n  $('#clearAll').onclick = () => { if (confirm('Delete saved mock-interview history?')) { LS.set('lld-mock-hist', []); renderHist(); } };\r\n  renderHist();\r\n  draw();\r\n})();\r\n"]},"p1-classes-objects.html":{"title":"Classes, Objects &amp; References","chapter":"0.1","styles":"\n  .hx-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1fr); gap:14px; margin-top:12px; }\n  @media (max-width:900px) { .hx-grid { grid-template-columns:1fr; } }\n  .hx-col h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }\n  pre.code.hx-code { margin:0; font-size:12.5px; }\n  .hx-code .ln { display:block; padding:0 8px; margin:0 -8px; border-radius:4px; }\n  .hx-code .ln.cur { background:rgba(129,140,248,.22); box-shadow:inset 3px 0 0 var(--accent); }\n  .hx-frame { border:1.5px solid var(--border-strong); border-radius:12px; padding:8px 10px; margin-bottom:8px; background:var(--surface-2); font-family:var(--mono); font-size:12.5px; }\n  .hx-frame.top { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }\n  .hx-frame .fn { font-weight:700; margin-bottom:6px; color:var(--text); }\n  .hx-var { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px dashed var(--border); }\n  .hx-var:first-of-type { border-top:0; }\n  .hx-ref { padding:0 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-weight:700; }\n  .hx-null { color:var(--muted); }\n  .hx-obj { border:1.5px solid var(--accent); border-radius:12px; padding:8px 10px; margin-bottom:8px; background:var(--surface); font-family:var(--mono); font-size:12.5px; transition:opacity .3s, border-color .3s; }\n  .hx-obj .id { font-weight:800; color:var(--accent); }\n  .hx-obj .ty { color:var(--muted); }\n  .hx-obj.garbage { border-style:dashed; border-color:var(--border-strong); opacity:.55; }\n  .hx-obj.garbage .id { color:var(--muted); }\n  .hx-obj .tag { float:right; font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--red-soft); color:var(--red); font-weight:700; }\n  .hx-obj.changed { border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }\n  .hx-empty { color:var(--muted); font-size:13px; font-style:italic; }\n  .hx-out { font-family:var(--mono); font-size:12.5px; margin-top:8px; padding:6px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); min-height:20px; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Prerequisite 1\u003C/span><span class=\"pill green\">Prerequisites\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Classes, Objects <span class=\"grad\">&amp; References\u003C/span>\u003C/h1>\n    <p class=\"lead\">Every low-level design question ends in the same place: a handful of classes, the objects made from them, and the references that connect those objects. Before you can argue about patterns you need an exact picture of what <code>new\u003C/code> does, where an object lives, and what a variable of a class type really holds. This chapter builds that picture, one line of Java at a time.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Write a Java class with fields, a constructor and methods, and create objects from it\u003C/li>\n      <li>Explain what lives on the stack (frames, primitives, references) and what lives on the heap (objects)\u003C/li>\n      <li>Predict what happens when two variables refer to the same object\u003C/li>\n      <li>Explain why Java is always pass-by-value, and why a swap method can't swap its callers' variables\u003C/li>\n      <li>Decide when a member should be static, and why static state is global state\u003C/li>\n      <li>Describe when an object becomes garbage, and how a Java program can still leak memory\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Nothing from this course.\u003C/b> This is the first page of the Prerequisites level: eight short chapters (P1–P8) on the Java object model and the UML every later chapter uses.\u003C/li>\n        <li><b>Basic Java syntax:\u003C/b> variables, <code>if\u003C/code>, <code>for\u003C/code> loops and methods. If you have written a small program in Java, or in C#, C&plus;&plus; or Python, you are ready.\u003C/li>\n        <li><b>Already fluent in Java objects?\u003C/b> Run the three programs in the heap explorer, check the quiz, and move on to <a href=\"p2-encapsulation.html\">P2: Encapsulation &amp; Invariants\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Why an LLD course starts with objects\u003C/h2>\n  <p>In a low-level design round you are asked to design something like a rate limiter or a parking lot, and then write the core of it. What the interviewer is really checking is whether your <b>objects\u003C/b> are right: what each one knows, what each one does, and which ones point at which others. A wrong picture of objects shows up fast. Two parts of the code change \"different\" sessions that turn out to be the same object. A method is expected to replace a caller's object and silently doesn't. A cache holds on to memory forever.\u003C/p>\n  <p>All three bugs come from the same few rules, and all of them are in this chapter:\u003C/p>\n  <ul>\n    <li><b>A class is a type; an object is one value of that type,\u003C/b> created at run time with <code>new\u003C/code>.\u003C/li>\n    <li><b>Objects live on the heap.\u003C/b> Variables of a class type hold a <i>reference\u003C/i> to an object, never the object itself.\u003C/li>\n    <li><b>Assignment and method calls copy the reference,\u003C/b> so two variables can share one object.\u003C/li>\n    <li><b>An object lives as long as something can still reach it.\u003C/b> The garbage collector frees the rest.\u003C/li>\n  \u003C/ul>\n\n  <h2>A class is a blueprint, an object is an instance\u003C/h2>\n  <p>A <b>class\u003C/b> describes a kind of thing: the data each one holds (its <b>fields\u003C/b>) and the operations it supports (its <b>methods\u003C/b>). An <b>object\u003C/b> is one concrete instance of that class, with its own copy of every field. The class is written once; a running program may create millions of objects from it.\u003C/p>\n  <p>Take a web server. Every logged-in user has a session: which user it belongs to, and how many minutes it has left before it expires. That's a natural class:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">Session.java\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">Session\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> userId;       <span class=\"c\">// field: set once, never changes\u003C/span>\n\t<span class=\"k\">private int\u003C/span> ttlMinutes;            <span class=\"c\">// field: changes as the session is extended\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">Session\u003C/span>(<span class=\"t\">String\u003C/span> userId) {     <span class=\"c\">// constructor: runs once, inside new\u003C/span>\n\t\t<span class=\"k\">this\u003C/span>.userId = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(userId);\n\t\t<span class=\"k\">this\u003C/span>.ttlMinutes = <span class=\"m\">30\u003C/span>;\n\t}\n\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">extend\u003C/span>(<span class=\"k\">int\u003C/span> minutes) {   <span class=\"c\">// method: operates on this object's fields\u003C/span>\n\t\t<span class=\"k\">if\u003C/span> (minutes &lt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"minutes must be positive\"\u003C/span>);\n\t\tttlMinutes += minutes;\n\t}\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">String\u003C/span> <span class=\"f\">userId\u003C/span>() { <span class=\"k\">return\u003C/span> userId; }\n\t<span class=\"k\">public int\u003C/span> <span class=\"f\">ttlMinutes\u003C/span>() { <span class=\"k\">return\u003C/span> ttlMinutes; }\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Reading it:\u003C/b> two fields, one constructor, three methods. Inside the class, <code>this\u003C/code> means “the object this method was called on”. <code>private\u003C/code> and <code>final\u003C/code> are covered properly in <a href=\"p2-encapsulation.html\">P2\u003C/a> and <a href=\"p6-value-objects.html\">P6\u003C/a>; for now read them as “only this class can touch it” and “assigned once”.\u003C/div>\n  \u003C/div>\n  <p>Creating and using objects looks like this:\u003C/p>\n<pre class=\"code\"><span class=\"t\">Session\u003C/span> alice = <span class=\"k\">new\u003C/span> <span class=\"t\">Session\u003C/span>(<span class=\"s\">\"u1\"\u003C/span>);   <span class=\"c\">// allocate an object, run the constructor, return a reference\u003C/span>\n<span class=\"t\">Session\u003C/span> bob   = <span class=\"k\">new\u003C/span> <span class=\"t\">Session\u003C/span>(<span class=\"s\">\"u2\"\u003C/span>);   <span class=\"c\">// a second, independent object\u003C/span>\nalice.<span class=\"f\">extend\u003C/span>(<span class=\"m\">15\u003C/span>);                      <span class=\"c\">// changes alice's ttlMinutes only\u003C/span>\n<span class=\"t\">System\u003C/span>.out.<span class=\"f\">println\u003C/span>(alice.<span class=\"f\">ttlMinutes\u003C/span>()); <span class=\"c\">// 45\u003C/span>\n<span class=\"t\">System\u003C/span>.out.<span class=\"f\">println\u003C/span>(bob.<span class=\"f\">ttlMinutes\u003C/span>());   <span class=\"c\">// 30\u003C/span>\u003C/pre>\n  <p><code>new Session(\"u1\")\u003C/code> does three things in order. It asks the JVM for enough memory for one <code>Session\u003C/code> and sets every field to its default (<code>null\u003C/code>, <code>0\u003C/code>, <code>false\u003C/code>). It runs the constructor, which sets the real values. Then it returns a <b>reference\u003C/b> to the new object, which is what gets stored in <code>alice\u003C/code>. Each object has its own <code>ttlMinutes\u003C/code>, so extending Alice's session leaves Bob's at 30.\u003C/p>\n\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>new Session(\"u1\")\u003C/b> The JVM allocates memory for one object on the heap.\u003C/li>\n      <li><b>Defaults\u003C/b> Every field is zeroed: userId = null, ttlMinutes = 0.\u003C/li>\n      <li><b>Constructor runs\u003C/b> userId = \"u1\", ttlMinutes = 30. A bad argument throws here, before anyone sees the object.\u003C/li>\n      <li data-k=\"end\"><b>Reference returned\u003C/b> The caller stores it in a variable and uses the object through it.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>What <code>new\u003C/code> does.\u003C/b> Validation in the constructor means a half-built object never escapes to the rest of the program.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Where things live: the stack and the heap\u003C/h2>\n  <p>A running Java program keeps data in two very different places, and the difference explains almost every surprise in this chapter.\u003C/p>\n  <ul>\n    <li>The <b>stack\u003C/b> holds one <b>frame\u003C/b> per method call that hasn't returned yet. A frame holds that call's parameters and local variables. Each thread has its own stack, and it is small: 1 MB by default on 64-bit Linux. When a method returns, its frame is thrown away instantly.\u003C/li>\n    <li>The <b>heap\u003C/b> holds every object ever created with <code>new\u003C/code>. It is large (usually hundreds of megabytes to many gigabytes, set with <code>-Xmx\u003C/code>) and shared by all threads. Objects stay there until the garbage collector finds that nothing can reach them.\u003C/li>\n  \u003C/ul>\n  <p>A local variable of a <b>primitive\u003C/b> type (<code>int\u003C/code>, <code>long\u003C/code>, <code>double\u003C/code>, <code>boolean\u003C/code>, <code>char\u003C/code> and the rest) holds its value directly in the frame. A local variable of a <b>class\u003C/b> type holds only a <b>reference\u003C/b>: a small value, 4 or 8 bytes, that tells the JVM where the object is on the heap. You never see the address itself, and you can't do arithmetic on it. You can only copy it, compare it, set it to <code>null\u003C/code>, or follow it with a dot.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>\u003C/th><th>Primitive variable (<code>int ttl\u003C/code>)\u003C/th><th>Reference variable (<code>Session s\u003C/code>)\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>What the variable holds\u003C/td><td>The value itself, e.g. <code>30\u003C/code>\u003C/td><td>A reference to an object on the heap, or <code>null\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>Size in the frame\u003C/td><td>1–8 bytes, depending on the type\u003C/td><td>4 bytes (compressed references, heaps under 32 GB) or 8\u003C/td>\u003C/tr>\n        <tr><td>What <code>b = a\u003C/code> copies\u003C/td><td>The value; the two are independent afterwards\u003C/td><td>The reference; both now point at <b>one\u003C/b> object\u003C/td>\u003C/tr>\n        <tr><td>What <code>a == b\u003C/code> compares\u003C/td><td>The two values\u003C/td><td>Identity: is it the same object? (Value equality is <code>equals\u003C/code>, <a href=\"p6-value-objects.html\">P6\u003C/a>)\u003C/td>\u003C/tr>\n        <tr><td>Default value as a field\u003C/td><td><code>0\u003C/code>, <code>0.0\u003C/code> or <code>false\u003C/code>\u003C/td><td><code>null\u003C/code>\u003C/td>\u003C/tr>\n        <tr><td>Can it be <code>null\u003C/code>?\u003C/td><td>No\u003C/td><td>Yes, and calling a method on it throws <code>NullPointerException\u003C/code>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>How big is the object itself? On a typical 64-bit JVM every object starts with a 12-byte header (used for locking, hashing and garbage collection), then its fields, rounded up to a multiple of 8. A <code>Session\u003C/code> is 12 + 4 (the <code>userId\u003C/code> reference) + 4 (the <code>int\u003C/code>) = 20, rounded to <b>24 bytes\u003C/b>. The string <code>\"u1\"\u003C/code> is a separate object that the session points at. A million sessions is therefore at least 24 MB of heap before you count the strings, a quick estimate worth having when a design keeps objects in memory.\u003C/p>\n\n  <h2>Two variables, one object\u003C/h2>\n  <p>Because assignment copies the reference and not the object, two variables can end up pointing at the same object. This is called <b>aliasing\u003C/b>. Change the object through one variable and the other variable “sees” the change, because there was only ever one object. That is usually exactly what you want: a session store and a request handler should share the one live session, not two copies drifting apart. It becomes a bug when you <i>thought\u003C/i> you had made a copy.\u003C/p>\n  <p>Run the three programs below line by line. Watch the stack column (frames and their variables) and the heap column (objects). Every <span class=\"hx-ref\">@1\u003C/span> chip is a reference: it means “points at object @1”.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Heap explorer: references on the stack, objects on the heap\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\">\n        <div class=\"seg\" id=\"hxProg\"><button class=\"active\" data-v=\"alias\">Aliasing\u003C/button><button data-v=\"pass\">Pass to a method\u003C/button><button data-v=\"swap\">The swap that doesn't swap\u003C/button>\u003C/div>\n        <span style=\"flex:1\">\u003C/span>\n        <button class=\"btn sm\" id=\"hxPrev\">◀ back\u003C/button>\n        <button class=\"btn sm primary\" id=\"hxNext\">step ▶\u003C/button>\n        <button class=\"btn sm\" id=\"hxReset\">↺\u003C/button>\n      \u003C/div>\n      <div class=\"hx-grid\">\n        <div class=\"hx-col\"><h4>Code\u003C/h4><pre class=\"code hx-code\" id=\"hxCode\">\u003C/pre>\u003C/div>\n        <div class=\"hx-col\"><h4>Stack (frames)\u003C/h4><div id=\"hxStack\">\u003C/div>\u003C/div>\n        <div class=\"hx-col\"><h4>Heap (objects)\u003C/h4><div id=\"hxHeap\">\u003C/div><div class=\"hx-out\" id=\"hxOut\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <div class=\"log\" id=\"hxLog\" style=\"height:78px;margin-top:10px\">\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">Object ids like <b>@1\u003C/b> stand in for the real references, which Java never shows you. Dashed, faded objects are <b>unreachable\u003C/b>: no chain of references from a live frame leads to them, so the garbage collector may free them.\u003C/div>\n  \u003C/div>\n\n  <h2>Java is pass-by-value, even for objects\u003C/h2>\n  <p>When you call a method, Java <b>copies each argument\u003C/b> into a new variable in the new frame. That rule has no exceptions. For a primitive argument the copy is the number. For an object argument the copy is the <b>reference\u003C/b>, so the method gets its own variable pointing at the caller's object.\u003C/p>\n  <p>Two things follow, and the second program in the explorer shows both:\u003C/p>\n  <ul>\n    <li><b>The method can change the caller's object.\u003C/b> <code>s.extend(30)\u003C/code> follows the copied reference to the same object, so the caller sees the new TTL. That's how a method like <code>SessionStore.touch(session)\u003C/code> can work.\u003C/li>\n    <li><b>The method can't change the caller's variable.\u003C/b> <code>s = new Session(\"x\")\u003C/code> only re-points the method's own copy. The caller's variable still refers to the original object, and the new one becomes garbage when the method returns.\u003C/li>\n  \u003C/ul>\n  <p>That is why the third program's <code>swap(a, b)\u003C/code> changes nothing for its caller: it swaps its own two copies of the references, then its frame is thrown away. People sometimes describe this as “objects are passed by reference”. They aren't. The reference is passed <i>by value\u003C/i>, and the difference is exactly the swap. If a method needs to hand back a different object, it returns it: <code>session = sessionStore.renew(session);\u003C/code>.\u003C/p>\n\n  <figure class=\"seq\" data-actors=\"LoginHandler|SessionStore.touch()|heap\">\n    <ol>\n      <li data-m=\"0>2\">new Session(\"u1\") → object @1, handler keeps reference s\u003C/li>\n      <li data-m=\"0>1\">touch(s): copy of the reference into the new frame\u003C/li>\n      <li data-m=\"1>2\">s.extend(30) → @1.ttlMinutes = 60\u003C/li>\n      <li data-m=\"1>1\">s = null (only the copy changes)\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">return; the frame and its copy disappear\u003C/li>\n      <li data-m=\"0>2\">s.ttlMinutes() → 60, s still points at @1\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Pass-by-value of a reference.\u003C/b> The callee shares the object but owns its own variable. Changing the object is visible to the caller; re-pointing the variable is not.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>static: members of the class itself\u003C/h2>\n  <p>Most fields belong to an object: each <code>Session\u003C/code> has its own <code>ttlMinutes\u003C/code>. A field marked <b><code>static\u003C/code>\u003C/b> belongs to the <b>class\u003C/b> instead. There is exactly one copy, shared by every object and by code that has no object at all. A static method likewise runs without any object, so it has no <code>this\u003C/code> and can't read instance fields.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">Session\u003C/span> {\n\t<span class=\"k\">public static final int\u003C/span> DEFAULT_TTL_MINUTES = <span class=\"m\">30\u003C/span>; <span class=\"c\">// a constant: static + final, fine\u003C/span>\n\t<span class=\"k\">private static int\u003C/span> created = <span class=\"m\">0\u003C/span>;                    <span class=\"c\">// one counter for the whole program\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">Session\u003C/span>(<span class=\"t\">String\u003C/span> userId) {\n\t\t<span class=\"c\">// ... as before ...\u003C/span>\n\t\tcreated++;                                          <span class=\"c\">// every constructor call bumps the one shared counter\u003C/span>\n\t}\n\n\t<span class=\"k\">public static int\u003C/span> <span class=\"f\">createdSoFar\u003C/span>() { <span class=\"k\">return\u003C/span> created; } <span class=\"c\">// called as Session.createdSoFar()\u003C/span>\n}\u003C/pre>\n  <p>Good uses of <code>static\u003C/code> are narrow. <b>Constants\u003C/b> (<code>static final\u003C/code> values that never change) are always fine. <b>Pure helper methods\u003C/b> that only use their arguments, like <code>Math.max\u003C/code>, are fine. <b>Factory methods\u003C/b> such as <code>List.of(...)\u003C/code> are fine, and <a href=\"10-factories.html\">Chapter 10\u003C/a> covers them.\u003C/p>\n  <p><b>Mutable static fields are global state\u003C/b>, and they cause trouble in exactly the places LLD interviews probe. Every test in a test run shares the same counter, so tests start depending on each other. Two threads incrementing <code>created\u003C/code> at once can lose updates (<a href=\"22-thread-safe-classes.html\">Chapter 22\u003C/a>). And any class can reach the value without it ever appearing in a constructor, which hides a dependency. <a href=\"08-dependency-injection.html\">Chapter 8\u003C/a> shows the alternative: create one object and pass it to whoever needs it.\u003C/p>\n\n  <h2>Object lifetime and garbage collection\u003C/h2>\n  <p>Java has no <code>delete\u003C/code>. You create objects; the <b>garbage collector\u003C/b> (GC) frees them. It decides what to free by <b>reachability\u003C/b>. It starts from a set of <b>GC roots\u003C/b>: the local variables in every live stack frame, every static field, and a few JVM internals. It follows references from those roots, and then from those objects' fields, and so on. Anything it can reach is alive. Anything it can't reach is garbage, and its memory will be reused.\u003C/p>\n  <figure class=\"flow\">\n    <ol>\n      <li data-k=\"start\"><b>Allocated\u003C/b> <code>new\u003C/code> places the object on the heap and returns a reference.\u003C/li>\n      <li><b>Reachable\u003C/b> A chain of references leads to it from a live frame or a static field. It stays.\u003C/li>\n      <li data-k=\"decision\"><b>Last reference gone?\u003C/b> The frame returned, the variable was reassigned, or the collection removed it.\u003C/li>\n      <li><b>Unreachable\u003C/b> Nothing can ever use it again. It is now garbage, even if it still points at other objects.\u003C/li>\n      <li data-k=\"end\"><b>Collected\u003C/b> At a time the JVM chooses, the memory is reclaimed. You can't predict when.\u003C/li>\n    \u003C/ol>\n    <figcaption><b>An object's life.\u003C/b> Reachability, not reference counting: two objects that point only at each other are still garbage once nothing else reaches them.\u003C/figcaption>\n  \u003C/figure>\n  <p>Two consequences matter for design. First, <b>memory is not the only resource\u003C/b>. A socket, a file handle or a database connection must be closed explicitly, because the GC might not run for minutes, and you never want correctness to depend on it. That's what <code>try\u003C/code>-with-resources is for (<a href=\"p7-exceptions.html\">P7\u003C/a>). Second, <b>a garbage-collected program can still leak memory\u003C/b>, whenever something reachable keeps holding references it no longer needs.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">A real leak: the session map that only grows\u003C/div><p>A common first version of a session store is <code>private static final Map&lt;String, Session&gt; SESSIONS = new HashMap&lt;&gt;();\u003C/code>. Login does <code>SESSIONS.put(token, session)\u003C/code>. Nothing ever removes entries, because users rarely click “log out”. The static field is a GC root, the map is reachable from it, and every session is reachable from the map. So not one session is ever collected. At 24 bytes per session plus its strings and the map's entries, a busy service fills its heap in days and dies with <code>OutOfMemoryError\u003C/code>. The fix is design, not GC tuning: sessions need an owner that expires them. That means a TTL sweep, or a bounded cache that evicts old entries, which is exactly what <a href=\"31-case-lru-cache.html\">Case Study 31\u003C/a> builds.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Thinking <code>b = a\u003C/code> copies the object.\u003C/b> It copies the reference. To get an independent object you must construct one (<a href=\"11-builder-prototype.html\">Chapter 11\u003C/a> covers copying properly).\u003C/li>\n      <li><b>Reassigning a parameter and expecting the caller to see it.\u003C/b> Return the new object instead.\u003C/li>\n      <li><b>Comparing objects with <code>==\u003C/code>.\u003C/b> It asks “same object?”, not “equal contents?”. Two separate <code>Session(\"u1\")\u003C/code> objects are <code>!=\u003C/code>. Use <code>equals\u003C/code> (<a href=\"p6-value-objects.html\">P6\u003C/a>).\u003C/li>\n      <li><b>Calling a method through a <code>null\u003C/code> reference.\u003C/b> A field of class type starts as <code>null\u003C/code>; validate in the constructor so it never stays that way.\u003C/li>\n      <li><b>Mutable static fields for convenience.\u003C/b> They are global variables with a class name in front: shared by every test and every thread.\u003C/li>\n      <li><b>Assuming the GC prevents leaks.\u003C/b> It frees what is unreachable. A static collection that never shrinks keeps everything reachable forever.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> Is Java pass-by-value or pass-by-reference?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>Always pass-by-value. For objects, the value that gets copied is the reference. So a method can change the object the caller passed, because both copies point at it, but it can't make the caller's variable point at a different object. The swap test proves it: a method that swaps two parameters leaves the caller's variables unchanged. If a method needs to replace an object, it returns the new one.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> A Java service's heap grows steadily and it dies with OutOfMemoryError after about a day. Java has a garbage collector, so how is that possible, and how would you find and fix it?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>The GC only frees unreachable objects, so the service must be keeping references it no longer needs. Typical culprits: a static map or cache with no eviction, listeners registered and never removed, or objects parked in a long-lived queue. I'd take a heap dump (for example with <code>jcmd &lt;pid&gt; GC.heap_dump\u003C/code>) and look at what retains the most memory and the reference path from a GC root to it. The fix is ownership in the design: a bounded cache with a size limit or TTL, removing listeners when their owner closes, and not using mutable static collections for per-request data.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>A class declares fields and methods; <code>new\u003C/code> allocates an object, zeroes its fields, runs the constructor and returns a reference.\u003C/li>\n      <li>Frames with their primitives and references live on the small per-thread stack; every object lives on the shared heap.\u003C/li>\n      <li>Assigning or passing an object copies the reference, so several variables can share one object (aliasing).\u003C/li>\n      <li>Java is always pass-by-value: a method can change the caller's object but never re-point the caller's variable.\u003C/li>\n      <li><code>static\u003C/code> members belong to the class. Constants and pure helpers are fine; mutable static fields are global state.\u003C/li>\n      <li>An object lives while a chain of references from a GC root reaches it. Collections that never shrink leak memory even with a GC.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">After <code>Session a = new Session(\"u1\"); Session b = a; b.extend(30);\u003C/code> what does <code>a.ttlMinutes()\u003C/code> return? (A new session starts at 30.)\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">30, because only <code>b\u003C/code> was extended\u003C/button>\n        <button class=\"opt\">60\u003C/button>\n        <button class=\"opt\">It doesn't compile\u003C/button>\n        <button class=\"opt\">It depends on when the garbage collector runs\u003C/button>\n      \u003C/div>\n      <div class=\"explain\"><code>b = a\u003C/code> copies the reference, so <code>a\u003C/code> and <code>b\u003C/code> point at the same object. Extending it through <code>b\u003C/code> changes the one object both variables see, so it is now 60.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\"><code>static void swap(Session x, Session y) { Session t = x; x = y; y = t; }\u003C/code> is called as <code>swap(a, b)\u003C/code>, where <code>a\u003C/code> is user u1's session and <code>b\u003C/code> is u2's. What does <code>a.userId()\u003C/code> print afterwards?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">u2, because the sessions were swapped\u003C/button>\n        <button class=\"opt\">It throws NullPointerException\u003C/button>\n        <button class=\"opt\">u1, because only the method's copies of the references were swapped\u003C/button>\n        <button class=\"opt\">u1, because swap made copies of both Session objects\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Java copies each reference into <code>x\u003C/code> and <code>y\u003C/code>. The method swaps those two local copies, then its frame is discarded. The caller's <code>a\u003C/code> and <code>b\u003C/code> never changed. No object was copied either: only references are passed.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Inside a method, <code>Session s = new Session(\"u1\");\u003C/code> runs. Where do the variable <code>s\u003C/code> and the Session object live?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>s\u003C/code> (a reference) is in the method's stack frame; the object is on the heap\u003C/button>\n        <button class=\"opt\">Both are on the stack, because <code>s\u003C/code> is a local variable\u003C/button>\n        <button class=\"opt\">Both are on the heap\u003C/button>\n        <button class=\"opt\"><code>s\u003C/code> is on the heap; the object is in the stack frame\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Local variables, including references, live in the frame of the call that declares them. Every object created with <code>new\u003C/code> lives on the heap. That is why the object can outlive the method, for example if it is returned or stored in a field.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">When does a Session object become eligible for garbage collection?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">As soon as the method that created it returns\u003C/button>\n        <button class=\"opt\">When its reference count drops to zero, so two objects pointing at each other are never collected\u003C/button>\n        <button class=\"opt\">When you call <code>System.gc()\u003C/code>\u003C/button>\n        <button class=\"opt\">When no chain of references from a GC root (a live frame, a static field) reaches it any more\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Java's collectors use reachability from GC roots. An obj
