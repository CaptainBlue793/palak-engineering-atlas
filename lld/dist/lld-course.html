* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);

}
a { color: var(--accent); text-decoration: none; }

:not(pre) > code {
  background: var(--surface-2); border: 1px solid var(--border);
  padding: .08em .38em; border-radius: 6px; font-size: .86em; color: var(--pink);
}
::selection { background: var(--accent-soft); }
button { font-family: inherit; }

/* ---------- Reading progress ---------- */
.read-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 100; transition: width .1s linear;
}

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);

  transition: transform .3s ease;
}
.sidebar .brand {

}
.sidebar .brand:hover { text-decoration: none; }
.brand-logo {

  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 17px;
  box-shadow: 0 6px 18px var(--accent-soft); flex: none;
}
.atlas-wordmark { display: block; width: 102px; height: 32px; flex: none; color: var(--text); }
.atlas-wordmark .gold { fill: var(--amber); }
.topbar .crumb .atlas-home { display: inline-flex; align-items: center; vertical-align: middle; }
.topbar .crumb .atlas-wordmark { width: 64px; height: 20px; }
.brand-author { display: block; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand-course { display: block; font-size: 16px; line-height: 1.2; }
.side-progress { margin: 0 10px 18px; }
.side-progress .bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.side-progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s; }
.side-progress small { color: var(--muted); font-size: 12px; }
.nav-level {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  font-weight: 700; padding: 14px 10px 6px;
}
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px;
  color: var(--text-2); font-size: 14px; line-height: 1.35; margin-bottom: 1px;
}
.nav-link:hover { background: var(--surface-2); text-decoration: none; }
.nav-link .num {
  flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; font-weight: 700; color: var(--muted);
  font-family: var(--mono);
}
.nav-link.done .num { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

.nav-link.current .num { background: var(--accent); color: #fff; border-color: transparent; }
.toc { margin: 4px 0 8px 44px; border-left: 1px solid var(--border); }
.toc a { display: block; padding: 3px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-left: -1px; border-left: 2px solid transparent; }
.toc a:hover { color: var(--text); text-decoration: none; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 40; height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 28px; background: color-mix(in srgb, var(--bg) 82%, transparent);

}

.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 17px;
  transition: .2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.content { max-width: 1120px; margin: 0 auto; padding: 28px 36px 80px; }

@media (max-width: 1180px) {

/* ---------- Chapter hero ---------- */
.hero {
  position: relative; padding: 28px 30px 26px; border-radius: 20px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 32px;
}
.hero::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
.hero > * { position: relative; }
.hero .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  font-family: var(--mono); letter-spacing: .02em;
  padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.pill.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.pill.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pill.cyan { background: var(--accent-2-soft); color: var(--accent-2); border-color: transparent; }
.pill.pink { background: var(--pink-soft); color: var(--pink); border-color: transparent; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 12px; font-weight: 800; }
.hero h1 .grad, .grad {
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p.lead { font-size: 17px; color: var(--text-2); margin: 0 0 18px; max-width: 900px; }
.objectives { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; margin: 0; padding: 0; list-style: none; }
.objectives li { display: flex; gap: 9px; font-size: 14.5px; color: var(--text-2); line-height: 1.45; }
.objectives li::before { content: "✓"; color: var(--accent); font-weight: 800; flex: none; }

/* ---------- Typography ---------- */
.content h2 {
  font-size: 26px; letter-spacing: -.025em; line-height: 1.2; margin: 48px 0 12px; font-weight: 800;
  display: flex; align-items: center; gap: 12px;
}
.content h2 .sec-num {
  font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  padding: 3px 9px; border-radius: 8px; letter-spacing: 0;
}
.content h3 { font-size: 19px; letter-spacing: -.015em; margin: 28px 0 8px; font-weight: 700; }
.content h4 { font-size: 16px; margin: 18px 0 6px; font-weight: 700; }
.content p { margin: 0 0 14px; color: var(--text-2); }
.content ul, .content ol { color: var(--text-2); padding-left: 22px; margin: 0 0 14px; }
.content li { margin-bottom: 4px; }
.content strong { color: var(--text); }
.muted { color: var(--muted) !important; }
.small { font-size: 14px; }
.center { text-align: center; }
hr.sep { border: 0; border-top: 1px dashed var(--border); margin: 32px 0; }

/* ---------- Callouts ---------- */
.callout {
  display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); margin: 18px 0;
  background: var(--accent-soft); border: 1px solid transparent;
}
.callout .ico { font-size: 20px; line-height: 1.4; flex: none; }
.callout .body { flex: 1; min-width: 0; }
.callout .body > :last-child { margin-bottom: 0; }
.callout .title { font-weight: 700; color: var(--text); margin-bottom: 3px; font-size: 15px; }
.callout p { font-size: 15px; }
.callout.tip { background: var(--green-soft); }
.callout.warn { background: var(--amber-soft); }
.callout.danger { background: var(--red-soft); }
.callout.analogy { background: var(--accent-2-soft); }
.callout.interview { background: var(--pink-soft); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; margin: 20px 0; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.feature { position: relative; }
.feature .f-ico {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px;
  background: var(--accent-soft); margin-bottom: 12px;
}
.feature h4 { margin: 0 0 6px !important; font-size: 16px; }
.feature p { font-size: 14.5px; margin: 0 !important; line-height: 1.55; }

/* ---------- Flip cards ---------- */
.flip { perspective: 1000px; cursor: pointer; min-height: 170px; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 170px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 18px;
  display: flex; flex-direction: column; justify-content: center; box-shadow: var(--shadow);
}
.flip .front { align-items: center; text-align: center; gap: 8px; }
.flip .front .big { font-size: 34px; }
.flip .front h4 { margin: 0 !important; }
.flip .front small { color: var(--muted); font-size: 12px; }
.flip .back { transform: rotateY(180deg); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)), var(--surface); font-size: 14.5px; color: var(--text-2); line-height: 1.55; }

/* ---------- Diagram / interactive panels ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); margin: 20px 0; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); flex-wrap: wrap;
}
.panel-head .dots { display: flex; gap: 6px; }
.panel-head .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.panel-head .dots i:nth-child(1) { background: #ff5f57; } .panel-head .dots i:nth-child(2) { background: #febc2e; } .panel-head .dots i:nth-child(3) { background: #28c840; }
.panel-head .p-title { font-weight: 700; font-size: 14px; }
.panel-head .p-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.panel-body { padding: 18px; }
.panel-foot { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 14px; color: var(--muted); }

.diagram { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--font); }
.diagram text { fill: var(--text); font-size: 14px; }
.diagram .lbl { fill: var(--muted); font-size: 12px; }
.diagram .mono { font-family: var(--mono); }
.diagram .node rect, .diagram .node circle, .diagram .node ellipse, .diagram .node path.shape {
  fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; transition: all .35s;
}
.diagram .node text { font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.diagram .node .ico { font-size: 20px; }
.diagram .node.on rect, .diagram .node.on circle, .diagram .node.on ellipse, .diagram .node.on path.shape {
  stroke: var(--accent); fill: var(--accent-soft); stroke-width: 2.2; filter: drop-shadow(0 0 10px var(--accent-soft));
}
.diagram .node.ok rect, .diagram .node.ok circle { stroke: var(--green); fill: var(--green-soft); }
.diagram .node.bad rect, .diagram .node.bad circle { stroke: var(--red); fill: var(--red-soft); }
.diagram .node.warn rect, .diagram .node.warn circle { stroke: var(--amber); fill: var(--amber-soft); }
.diagram .edge { stroke: var(--border-strong); stroke-width: 1.8; fill: none; transition: all .35s; }
.diagram .edge.on { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 6; animation: flow .7s linear infinite; }
.diagram .edge.dash { stroke-dasharray: 5 5; }
.diagram .edge.bad { stroke: var(--red); }
.diagram .edge.ok { stroke: var(--green); }
.diagram .dimmable { transition: opacity .35s; }
.diagram.stepping .dimmable:not(.on) { opacity: .35; }
.diagram .arrow-head { fill: var(--border-strong); }
@keyframes flow { to { stroke-dashoffset: -13; } }
.packet { filter: drop-shadow(0 0 6px currentColor); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: all .18s; line-height: 1.3; white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--text-2); font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input[type=number], .field input[type=text], .field select, input.inp, select.inp {
  font-family: var(--mono); font-size: 14px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); outline: none; min-width: 0;
}
.field input:focus, .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.range-row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-2); flex-wrap: wrap; }
.range-row label { min-width: 150px; font-weight: 600; }
.range-row output { font-family: var(--mono); color: var(--accent); font-weight: 600; min-width: 70px; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 140px; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 0; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -.02em; margin-top: 2px; line-height: 1.2; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat.good .v { color: var(--green); } .stat.bad .v { color: var(--red); } .stat.acc .v { color: var(--accent); } .stat.warn .v { color: var(--amber); }

/* ---------- Tabs ---------- */
.tabs { margin: 24px 0; }
.tab-list { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab-list button {
  background: none; border: 0; padding: 10px 16px; font-weight: 600; font-size: 14px; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab-list button:hover { color: var(--text); }
.tab-list button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; padding: 20px 0 0; animation: fadeUp .35s ease; }
.tab-panel.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Stepper ---------- */
.stepper { margin-top: 0; }
.stepper-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
.stepper-bar .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-right: auto; }
.stepper-dots { display: flex; gap: 5px; margin-right: 8px; }
.stepper-dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--border-strong); cursor: pointer; transition: .3s; }
.stepper-dots i.active { width: 22px; background: var(--accent); }
.stepper-dots i.past { background: var(--accent); opacity: .45; }
.step-text { padding: 16px 20px; min-height: 92px; border-top: 1px solid var(--border); }
.step-text .st-title { font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.step-text .st-title .n { font-family: var(--mono); font-size: 12px; background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 7px; }
.step-text .st-desc { color: var(--text-2); font-size: 15px; line-height: 1.6; animation: fadeUp .35s ease; }
.stepper ol.steps { display: none; }

/* ---------- Quiz ---------- */
.quiz-wrap { margin: 44px 0 16px; }
.quiz {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 12px 0; box-shadow: var(--shadow);
}
.quiz .q { font-weight: 700; color: var(--text); margin: 0 0 12px; font-size: 16px; display: flex; gap: 10px; }
.quiz .q .qn { flex: none; font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; height: fit-content; margin-top: 2px; }
.quiz .opts { display: grid; gap: 8px; }
.quiz .opt {
  text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); font-size: 15px; cursor: pointer; transition: all .18s; display: flex; gap: 10px; align-items: center;
}
.quiz .opt::before { content: attr(data-letter); font-family: var(--mono); font-weight: 700; font-size: 12px; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); flex: none; }
.quiz .opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.quiz .opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--text); }
.quiz .opt.correct::before { content: "✓"; background: var(--green); color: #fff; border-color: transparent; }
.quiz .opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--text); animation: shake .4s; }
.quiz .opt.wrong::before { content: "✕"; background: var(--red); color: #fff; border-color: transparent; }
.quiz .opt:disabled { cursor: default; }
.quiz .explain { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; color: var(--text-2); border-left: 3px solid var(--accent); }
.quiz.answered .explain { display: block; animation: fadeUp .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.quiz-score { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)); font-weight: 600; }
.quiz-score .big { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--accent); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; padding: 11px 14px; background: var(--surface-2); color: var(--text); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr:hover td { background: var(--surface-2); }
.yes { color: var(--green); font-weight: 700; } .no { color: var(--red); font-weight: 700; } .meh { color: var(--amber); font-weight: 700; }

/* ---------- Code ---------- */
pre.code {
  background: #0d1117; color: #e6edf3; border-radius: 12px; padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.6;
  border: 1px solid var(--border); margin: 16px 0;
}
pre.code .c { color: #8b949e; } pre.code .k { color: #ff7b72; } pre.code .s { color: #a5d6ff; } pre.code .f { color: #d2a8ff; } pre.code .n { color: #79c0ff; } pre.code .g { color: #7ee787; }

/* ---------- Key takeaways ---------- */
.takeaways { border-radius: 18px; padding: 22px 24px; margin: 40px 0 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.takeaways::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(var(--accent), var(--accent-2)); }
.takeaways h3 { margin: 0 0 12px !important; }
.takeaways ul { list-style: none; padding: 0; margin: 0; }
.takeaways li { padding-left: 28px; position: relative; margin-bottom: 9px; }
.takeaways li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }

/* ---------- Chapter footer nav ---------- */
.chapter-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.chapter-nav a { display: block; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: .2s; }
.chapter-nav a:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow); }
.chapter-nav small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chapter-nav .nx { text-align: right; grid-column: 2; }
.complete-box { margin-top: 32px; text-align: center; padding: 24px; border-radius: 18px; border: 1px dashed var(--border-strong); }
.complete-box.done { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.complete-box p { margin: 0 0 12px !important; }

/* ---------- Misc visual bits ---------- */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
.kbd { font-family: var(--mono); font-size: 12px; padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.log {
  font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; height: 150px; overflow-y: auto; color: var(--text-2); line-height: 1.6;
}
.log div { animation: fadeUp .25s; }
.log .ok { color: var(--green); } .log .bad { color: var(--red); } .log .acc { color: var(--accent); } .log .warn { color: var(--amber); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-family: var(--mono); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; } }
.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
@media (max-width: 600px) { .pros-cons { grid-template-columns: 1fr; } }
.pros-cons > div { border-radius: 12px; padding: 14px 16px; font-size: 14.5px; }
.pros-cons ul { margin: 6px 0 0; padding-left: 18px; }
.pros-cons .pros { background: var(--green-soft); } .pros-cons .cons { background: var(--red-soft); }
.pros-cons h5 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.pros-cons .pros h5 { color: var(--green); } .pros-cons .cons h5 { color: var(--red); }
.timeline { position: relative; margin: 24px 0; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--accent-2)); border-radius: 2px; }
.timeline .ti { position: relative; margin-bottom: 20px; }
.timeline .ti::before { content: attr(data-n); position: absolute; left: -34px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; font-family: var(--mono); }
.timeline .ti h4 { margin: 0 0 4px !important; }
.timeline .ti p { margin: 0 !important; font-size: 15px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; transition: .2s; font-family: var(--mono); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }
.mt0 { margin-top: 0 !important; } .mb0 { margin-bottom: 0 !important; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.svg-scroll { overflow-x: auto; }
.svg-scroll svg { min-width: 560px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ---------- Search palette & study tools ---------- */
.search-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .2s;
}
.search-btn:hover { border-color: var(--accent); color: var(--text); }
.search-btn .kbd { margin-left: 4px; }
@media (max-width: 700px) { .search-btn span { display: none; } .search-btn .kbd { display: none; } }
.nav-link.study .num { background: transparent; font-size: 14px; }
.palette { position: fixed; inset: 0; background: rgba(6,8,14,.55); backdrop-filter: blur(3px); z-index: 300; display: none; padding: 10vh 16px 16px; }
.palette.show { display: block; animation: fadeUp .18s; }
.pal-inner { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; }
.pal-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 17px; }
.pal-top input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--text); }
.pal-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.pal-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--text); }
.pal-item:hover, .pal-item.sel { background: var(--accent-soft); text-decoration: none; }
.pal-item.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pal-ico { text-align: center; color: var(--muted); font-size: 14px; }
.pal-text { min-width: 0; }
.pal-text b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-text small { color: var(--muted); font-size: 12px; }
.pal-lv { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.pal-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 14px; }
.pal-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }

/* ---------- Interview drill ---------- */
details.ans { margin: 6px 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
details.ans > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--accent); list-style: none; }
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸ "; }
details.ans[open] > summary::before { content: "▾ "; }
details.ans > div { padding: 0 12px 12px; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
details.ans > div b { color: var(--text); }
.callout .body ul.mb0 { margin: 6px 0 0; padding-left: 18px; }
.callout .body ul.mb0 li { margin: 3px 0; font-size: 14px; }

/* =========================================================
   LLD-specific components
   ========================================================= */

/* ---------- Code blocks: Java in the house style ---------- */
pre.code { tab-size: 4; -moz-tab-size: 4; }
pre.code .t  { color: #ffa657; }   /* type / class name  */
pre.code .o  { color: #ff7b72; }   /* keyword / operator */
pre.code .m  { color: #79c0ff; }   /* number             */
pre.code .hl { display: block; margin: 0 -18px; padding: 0 18px; background: rgba(129,140,248,.16); box-shadow: inset 3px 0 0 var(--accent); }

/* a code block with a header strip: file/function name + complexity chips */
.codebox { margin: 18px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0d1117; }
.codebox > .cb-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.codebox > .cb-head .cb-name { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text); }
.codebox > .cb-head .cb-sp { flex: 1; }
.codebox > pre.code { margin: 0; border: 0; border-radius: 0; }
.codebox > .cb-foot { padding: 10px 14px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.codebox > .cb-foot b { color: var(--text); }

/* complexity chips */
.cx { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.cx.time  { background: var(--accent-soft); color: var(--accent); }
.cx.space { background: var(--accent-2-soft); color: var(--accent-2); }
.cx.good  { background: var(--green-soft); color: var(--green); }
.cx.bad   { background: var(--red-soft); color: var(--red); }
.cx.mid   { background: var(--amber-soft); color: var(--amber); }

/* ---------- Array / cell visualizer ---------- */
.cells { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
.cell {
  min-width: 40px; height: 40px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text);
  background: var(--surface-2); border: 1.6px solid var(--border); position: relative; transition: .25s;
}
.cell small { position: absolute; bottom: -17px; left: 0; right: 0; text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cell.on    { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); transform: translateY(-3px); }
.cell.ok    { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.cell.bad   { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.cell.warn  { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.cell.dim   { opacity: .32; }
.cell.win   { border-color: var(--accent-2); background: var(--accent-2-soft); }
.cell.ptr::after { content: attr(data-ptr); position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 11px; font-family: var(--mono); font-weight: 800; color: var(--accent); white-space: nowrap; }
.cells.idx { margin-bottom: 26px; }
.cells.ptr-row { margin-top: 24px; }

/* bars, for sorting + histogram visualizers */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 170px; margin: 16px 0; padding: 0 2px; }
.bars i { flex: 1; min-width: 3px; background: var(--accent); border-radius: 3px 3px 0 0; transition: height .12s, background .12s; display: block; }
.bars i.cmp  { background: var(--amber); }
.bars i.swap { background: var(--red); }
.bars i.done { background: var(--green); }
.bars i.piv  { background: var(--pink); }

/* ---------- Dry-run trace table ---------- */
.trace { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 12px; }
table.tr { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
table.tr th { background: var(--surface-2); padding: 8px 11px; text-align: left; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tr td { padding: 6px 11px; border-bottom: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
table.tr tr:last-child td { border-bottom: 0; }
table.tr tr.hi td { background: var(--accent-soft); color: var(--text); }
table.tr td.k { color: var(--accent); font-weight: 700; }

/* ---------- Pattern cards (the playbook) ---------- */
.pat { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 14px 16px; margin: 12px 0; }
.pat h5 { margin: 0 0 4px; font-size: 14.5px; color: var(--text); }
.pat p { margin: 0; font-size: 14px; color: var(--text-2); }
.pat .sig { font-family: var(--mono); font-size: 12.5px; color: var(--accent); margin-top: 6px; display: block; }

/* ---------- "My convention" callouts ---------- */
.callout.house { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.callout.house .title { color: var(--accent); }
.callout.proof { background: var(--accent-2-soft); border-left: 3px solid var(--accent-2); }
.callout.proof .title { color: var(--accent-2); }

/* ---------- Complexity ladder ---------- */
.ladder { display: grid; gap: 6px; margin: 18px 0; }
.ladder .rung { display: grid; grid-template-columns: 100px 1fr 96px; gap: 12px; align-items: center; font-size: 13.5px; }
.ladder .rung b { font-family: var(--mono); font-size: 13px; }
.ladder .rung .bar { height: 20px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.ladder .rung .bar i { display: block; height: 100%; border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.ladder .rung span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; }

/* ---------- Practice problem lists ---------- */
.plist { display: grid; gap: 6px; margin: 14px 0; }
.pitem { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.pitem .d { font-size: 10.5px; font-family: var(--mono); font-weight: 800; padding: 2px 7px; border-radius: 5px; }
.pitem .d.e { background: var(--green-soft); color: var(--green); }
.pitem .d.m { background: var(--amber-soft); color: var(--amber); }
.pitem .d.h { background: var(--red-soft); color: var(--red); }
.pitem .tag { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

/* ---------- Practice-item resource links (generated by tools/lc-links.js) ---------- */
.pitem .lcs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pitem .lc { font-family: var(--mono); font-size: 10.5px; font-weight: 800; line-height: 1; white-space: nowrap;
  padding: 4px 7px; border-radius: 6px; text-decoration: none; transition: all .15s;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
.pitem .lc:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.pitem .lc.paid { background: var(--amber-soft); color: var(--amber); }
.pitem .lc.paid:hover { background: var(--amber); color: #fff; border-color: var(--amber); }
.pitem .lc.paid::after { content: "★"; margin-left: 3px; font-size: 9px; }
.pitem .lc.ref { background: var(--surface-3); color: var(--muted); }
.pitem .lc.ref:hover { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
@media (max-width: 640px) {
  .pitem { grid-template-columns: auto 1fr; }
  .pitem .tag { grid-column: 1; }
  .pitem .lcs { grid-column: 2; }
}

/* ---------- Tree / graph nodes for inline SVG ---------- */
.diagram .tn circle, .diagram .tn rect { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.8; transition: all .3s; }
.diagram .tn text { font-family: var(--mono); font-weight: 700; font-size: 13px; text-anchor: middle; dominant-baseline: middle; fill: var(--text); }
.diagram .tn.on circle, .diagram .tn.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.6; }
.diagram .tn.visit circle, .diagram .tn.visit rect { fill: var(--accent-2-soft); stroke: var(--accent-2); }
.diagram .tn.done circle, .diagram .tn.done rect { fill: var(--green-soft); stroke: var(--green); }
.diagram .tn.stack circle, .diagram .tn.stack rect { fill: var(--amber-soft); stroke: var(--amber); }
.diagram .tn.bad circle, .diagram .tn.bad rect { fill: var(--red-soft); stroke: var(--red); }
.diagram .tn.nil circle { fill: none; stroke-dasharray: 3 3; opacity: .5; }

/* ---------- Side-by-side comparison ---------- */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }

/* ---------- Recursion tree (text art) ---------- */
.rtree { font-family: var(--mono); font-size: 12.5px; line-height: 1.75; color: var(--text-2); white-space: pre; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }

.dpg { display: inline-grid; gap: 3px; margin: 16px 0; }

.tricks { display: grid; gap: 10px; margin: 20px 0; }
.trick {

/* ---------- Small screens & touch ----------

   the screen, tightens spacing on phones, and gives touch devices finger-sized targets. */
:not(pre) > code { overflow-wrap: anywhere; }

/* ---------- Sequence diagrams, workflows, comparisons & use cases (shared visuals) ---------- */
figure.seq, figure.flow { margin: 24px 0; padding: 16px 16px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }

.seq-msg.cur .seq-arrow { stroke: var(--accent); stroke-width: 2.4; }
.seq-msg.cur .seq-label { fill: var(--accent); font-weight: 700; }
.seq-msg.k-fail.cur .seq-label, .seq-msg.k-bad.cur .seq-label, .seq-msg.k-bad .seq-label { fill: var(--red); }
.seq-note { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1; }

figure.flow.fl-row > ol { flex-wrap: nowrap; }

@media (max-width: 640px) {

"M530,380 L585,380\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-dom-ref\" class=\"edge\" d=\"M715,380 L770,380\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-ref-pb\" class=\"edge\" d=\"M900,380 L955,380\" marker-end=\"url(#ah)\"/>\r\n        <g class=\"node\" data-ch=\"22\" data-t=\"Thread-safe class design\" data-d=\"Races, locks, immutability and confinement.\" transform=\"translate(30,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🔐 Thread safety\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 22 · locks\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"23\" data-t=\"Producer-consumer &amp; thread pools\" data-d=\"BlockingQueue, ExecutorService and backpressure.\" transform=\"translate(215,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🧵 Pools\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 23 · queues\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"26\" data-t=\"Persistence\" data-d=\"Keeping SQL out of the domain model.\" transform=\"translate(400,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🗄️ Persistence\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 26 · repository\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"27\" data-t=\"Domain modeling\" data-d=\"Entities, value objects, aggregates and domain events.\" transform=\"translate(585,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🏛️ Domain model\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 27 · aggregates\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"29\" data-t=\"Code smells &amp; refactoring\" data-d=\"Each smell refactored into the pattern that fixes it.\" transform=\"translate(770,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🧹 Refactoring\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 29 · smells\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"30\" data-t=\"Interview playbook\" data-d=\"The rubric, time boxing and “now add X” follow-ups.\" transform=\"translate(955,355)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🎤 Playbook\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 30 · 45 min\u003C/text>\u003C/g>\r\n\r\n        <text x=\"24\" y=\"476\" class=\"plane\">LAYER 4 — CASE STUDIES\u003C/text>\r\n        <line x1=\"20\" y1=\"484\" x2=\"1100\" y2=\"484\" stroke=\"var(--border)\" stroke-dasharray=\"2 6\"/>\r\n\r\n        <g class=\"node\" data-ch=\"31\" data-t=\"LRU &amp; LFU cache\" data-d=\"O(1) get/put, pluggable eviction, thread safety.\" transform=\"translate(30,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">⚡ LRU cache\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 31 · O(1)\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"34\" data-t=\"In-memory pub-sub broker\" data-d=\"Kafka’s core ideas in one JVM.\" transform=\"translate(215,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">📬 Pub-sub\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 34 · topics\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"32\" data-t=\"Rate limiter\" data-d=\"Algorithms as strategies, per-client state.\" transform=\"translate(400,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🚥 Rate limiter\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 32 · buckets\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"42\" data-t=\"Movie ticket booking\" data-d=\"Seat holds with expiry and no double booking.\" transform=\"translate(585,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🎟️ Ticketing\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 42 · seat holds\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"38\" data-t=\"Text editor\" data-d=\"A gap buffer and edits as commands.\" transform=\"translate(770,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">📝 Editor\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 38 · undo\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"41\" data-t=\"Elevator system\" data-d=\"Car state machines and dispatch strategies.\" transform=\"translate(955,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🛗 Elevator\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 41 · dispatch\u003C/text>\u003C/g>\r\n\r\n        <path id=\"e-solid-str\" class=\"edge dash\" d=\"M465,105 L465,205\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-obs-dom\"   class=\"edge dash\" d=\"M650,255 L650,355\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-ts-lru\"    class=\"edge dash\" d=\"M95,405 L95,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-pc-pub\"    class=\"edge dash\" d=\"M280,405 L280,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-dom-tix\"   class=\"edge dash\" d=\"M650,405 L650,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-st-elev\"   class=\"edge dash\" d=\"M1085,230 L1105,230 L1105,489 L1020,489 L1020,505\" marker-end=\"url(#ah)\"/>\r\n      \u003C/svg>\r\n      \u003C/div>\r\n      <div class=\"map-info\" id=\"mapInfo\"><span class=\"mi-ico\">👆\u003C/span><div><b>Hover or click a box\u003C/b><span>Dependencies are flowing upward through the layers live.\u003C/span>\u003C/div>\u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\">One code style, all the way through\u003C/h2>\r\n    <p class=\"section-sub reveal\">Every listing in this course is Java written the same way, so the shape of the code becomes a memory aid instead of noise. This is the style, stated once in Chapter 1 and never broken.\u003C/p>\r\n    <div class=\"style-strip reveal\">\r\n      <div>\r\n        <ul>\r\n          <li><b>Interface first.\u003C/b> Name the role — <code>EvictionPolicy\u003C/code>, <code>SpotAllocator\u003C/code> — before writing any class that plays it.\u003C/li>\r\n          <li><b>Constructor injection, final fields.\u003C/b> Every collaborator arrives through the constructor and never changes. No <code>new\u003C/code> buried in a method, no statics.\u003C/li>\r\n          <li><b>Fail fast at the boundary.\u003C/b> Validate arguments in the constructor or public method, then trust them everywhere inside.\u003C/li>\r\n          <li><b>Small classes, no reflex getters.\u003C/b> Behaviour lives next to the data it changes: tell, don’t ask.\u003C/li>\r\n          <li><b>Every design names its pattern and its extension point\u003C/b> — the change it survives without editing old code.\u003C/li>\r\n        \u003C/ul>\r\n      \u003C/div>\r\n      <div>\r\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; {\r\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">keyAccessed\u003C/span>(<span class=\"t\">K\u003C/span> key);\r\n\t<span class=\"t\">K\u003C/span> <span class=\"f\">evict\u003C/span>();\r\n}\r\n\r\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">K\u003C/span>, <span class=\"t\">V\u003C/span>&gt; {\r\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy;\r\n\t<span class=\"k\">private final int\u003C/span> capacity;\r\n\r\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">Cache\u003C/span>(<span class=\"k\">int\u003C/span> capacity, <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy) {\r\n\t\t<span class=\"k\">if\u003C/span> (capacity &lt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"capacity must be positive\"\u003C/span>);\r\n\t\t<span class=\"k\">this\u003C/span>.capacity = capacity;\r\n\t\t<span class=\"k\">this\u003C/span>.policy = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(policy);\r\n\t}\r\n}\u003C/pre>\r\n        <p class=\"small muted\" style=\"margin:10px 0 0\">LRU, LFU and FIFO are three small classes behind one interface. Adding a fourth never touches <code>Cache\u003C/code>. That is the whole idea.\u003C/p>\r\n      \u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\" id=\"roadmap\">Course roadmap\u003C/h2>\r\n    <p class=\"section-sub reveal\">Go in order — later chapters build on earlier ones. Your progress is saved in this browser.\u003C/p>\r\n    <div id=\"levels\">\u003C/div>\r\n\r\n    <footer class=\"home-foot\">\r\n      <b>Palak Deb Patra's Low-Level Design Playlist\u003C/b> ◆ built for learning, one class at a time.<br>\r\n      <span class=\"small\">© 2026 Palak Deb Patra\u003C/span><br>\r\n      <button class=\"reset-link\" id=\"resetBtn\">Reset my progress\u003C/button>\r\n    \u003C/footer>\r\n  \u003C/div>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { CHAPTERS, LEVELS, LS, $, $$, chNum, chName } = LLD;\r\n  // theme button\r\n  const tb = $('#themeBtn');\r\n  const cur = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\r\n  tb.textContent = cur() === 'dark' ? '☀️' : '🌙';\r\n  tb.onclick = () => { const n = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); LS.set('lld-theme', n); tb.textContent = n === 'dark' ? '☀️' : '🌙'; };\r\n\r\n  const done = new Set(LS.get('lld-done', []));\r\n  const quiz = LS.get('lld-quiz', {});\r\n\r\n  // progress ring\r\n  const pct = done.size / CHAPTERS.length;\r\n  setTimeout(() => { $('#ringFg').style.strokeDashoffset = 314.16 * (1 - pct); }, 200);\r\n  $('#ringTxt').textContent = Math.round(pct * 100) + '%';\r\n  $('#progTxt').textContent = `${done.size} of ${CHAPTERS.length} chapters complete`;\r\n  const next = CHAPTERS.find(c => !done.has(c.n));\r\n  if (next) {\r\n    $('#nextUp').innerHTML = `Up next: <a href=\"${next.file}\"><b>${next.icon} ${next.title}\u003C/b>\u003C/a>`;\r\n    if (done.size) { $('#ctaStart').href = next.file; $('#ctaStart').textContent = `Continue: ${chName(next)} →`; }\r\n  } else { $('#nextUp').innerHTML = '🏆 <b>Course complete!\u003C/b> Outstanding work.'; }\r\n\r\n  const levels = LEVELS;\r\n  const nextN = (CHAPTERS.find(x => !done.has(x.n)) || {}).n;\r\n  // the longest level defines the tick size, so that row ends flush right\r\n  const maxLvl = Math.max(...levels.map(([l]) => CHAPTERS.filter(x => x.level === l).length));\r\n  $('#lvlBars').style.setProperty('--n', maxLvl);\r\n  $('#lvlBars').innerHTML = levels.map(([l,c]) => {\r\n    const all = CHAPTERS.filter(x => x.level === l); const d = all.filter(x => done.has(x.n)).length;\r\n    const ticks = all.map(x => `<a class=\"tick${done.has(x.n) ? ' done' : (x.n === nextN ? ' next' : '')}\" href=\"${x.file}\" title=\"${chNum(x)} · ${x.title.replace(/\"/g, '')}${done.has(x.n) ? ' ✓' : ''}\">\u003C/a>`).join('');\r\n    return `<div class=\"row\"><span>${l}\u003C/span><div class=\"ticks\" style=\"--c:${c}\">${ticks}\u003C/div><span>${d}/${all.length}\u003C/span>\u003C/div>`;\r\n  }).join('');\r\n\r\n  // roadmap cards\r\n  const desc = Object.fromEntries(LEVELS.map(([l, , d]) => [l, d]));\r\n  $('#levels').innerHTML = levels.map(([l,c]) => `\r\n    <div class=\"level-block reveal\">\r\n      <div class=\"level-head\"><span class=\"pill\" style=\"background:color-mix(in srgb, ${c} 14%, transparent);color:${c};border-color:transparent\">${l}\u003C/span><h3>${desc[l]}\u003C/h3><div class=\"line\">\u003C/div>\u003C/div>\r\n      <div class=\"chap-grid\">${CHAPTERS.filter(x=>x.level===l).map(ch => `\r\n        <a class=\"chap-card ${done.has(ch.n)?'done':''}\" href=\"${ch.file}\">\r\n          <div class=\"top\"><span class=\"emo\">${ch.icon}\u003C/span><span class=\"no\">${ch.n < 1 ? chName(ch).toUpperCase() : 'CHAPTER ' + String(ch.n).padStart(2,'0')}\u003C/span>\u003C/div>\r\n          <h4>${ch.title}\u003C/h4>\r\n          <p>${ch.blurb}\u003C/p>\r\n          <div class=\"meta\"><span>⏱ ${ch.mins} min\u003C/span>${done.has(ch.n)?'<span class=\"pill done\">✓ Done\u003C/span>':''}${quiz[ch.n]!=null?`<span class=\"pill cyan\">Quiz ${Math.round(quiz[ch.n]*100)}%\u003C/span>`:''}\u003C/div>\r\n        \u003C/a>`).join('')}\u003C/div>\r\n    \u003C/div>`).join('');\r\n  $$('#levels .reveal').forEach(e => setTimeout(() => e.classList.add('in'), 100));\r\n\r\n  // big map interactions\r\n  const map = $('#bigmap'), info = $('#mapInfo');\r\n  $$('.node', map).forEach(n => {\r\n    const ch = CHAPTERS.find(c => c.n === +n.dataset.ch);\r\n    n.addEventListener('mouseenter', () => {\r\n      info.innerHTML = `<span class=\"mi-ico\">${ch.icon}\u003C/span><div><b>${n.dataset.t} → Chapter ${ch.n}: ${ch.title}\u003C/b><span>${n.dataset.d}\u003C/span>\u003C/div>`;\r\n    });\r\n    n.addEventListener('click', () => LLD.go(ch.file));\r\n  });\r\n  const routes = [\r\n    ['e-uml-req','e-req-solid','e-solid-str','e-str-obs','e-obs-dom','e-dom-tix'],\r\n    ['e-solid-cpl','e-cpl-rel','e-rel-di'],\r\n    ['e-fac-dec','e-dec-str','e-str-obs','e-obs-cmd','e-cmd-st','e-st-elev'],\r\n    ['e-ts-pc','e-pc-pub'],\r\n    ['e-ts-lru'],\r\n    ['e-pc-per','e-per-dom','e-dom-ref','e-ref-pb'],\r\n    ['e-per-dom','e-dom-tix'],\r\n  ];\r\n  const colors = ['var(--accent)','color-mix(in srgb, var(--accent-2) 25%, var(--accent))','color-mix(in srgb, var(--accent-2) 50%, var(--accent))','color-mix(in srgb, var(--accent-2) 75%, var(--accent))','var(--accent-2)'];\r\n  let running = false;\r\n  async function fire() {\r\n    const r = routes[Math.floor(Math.random()*routes.length)], col = colors[Math.floor(Math.random()*colors.length)];\r\n    for (const id of r) await LLD.packetAlong(map, $('#'+id, map), { dur: 420, color: col, r: 5 });\r\n  }\r\n  let timer;\r\n  LLD.whenVisible(map, () => { if (!running) { running = true; timer = setInterval(fire, 650); } }, () => { running = false; clearInterval(timer); });\r\n\r\n  $('#resetBtn').onclick = () => { if (confirm('Reset all course progress and quiz scores?')) { LS.set('lld-done', []); LS.set('lld-quiz', {}); location.reload(); } };\r\n})();\r\n"]},"01-lld-interview.html":{"title":"What an LLD Interview Tests","chapter":"1","styles":"","html":"\r\n\u003C!-- lld:placeholder -->\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 1\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 30 min\u003C/span>\u003C/div>\r\n    <h1>What an LLD Interview <span class=\"grad\">Tests\u003C/span>\u003C/h1>\r\n    <p class=\"lead\">The 45-minute flow — requirements, entities, classes, APIs, code, extension — and the house style for every Java listing.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"callout warn\">\r\n    <div class=\"ico\">🚧\u003C/div>\r\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\r\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <h2>What this chapter will cover\u003C/h2>\r\n  <ol>\r\n    <li>LLD vs HLD vs DSA rounds\u003C/li>\r\n    <li>The 45-minute timeline\u003C/li>\r\n    <li>What the rubric actually scores\u003C/li>\r\n    <li>The course's Java house style\u003C/li>\r\n  \u003C/ol>\r\n\r\n\u003C/main>\r\n\r\n","scripts":[]},"02-requirements-to-classes.html":{"title":"From Requirements to Classes","chapter":"2","styles":"","html":"\r\n\u003C!-- lld:placeholder -->\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 2\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\r\n    <h1>From Requirements to <span class=\"grad\">Classes\u003C/span>\u003C/h1>\r\n pan class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\r\n    <h1>Case Study: <span class=\"grad\">Expense Sharing (Splitwise)\u003C/span>\u003C/h1>\r\n    <p class=\"lead\">Equal, exact and percentage splits as strategies, balance sheets, and simplifying debts.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"callout warn\">\r\n    <div class=\"ico\">🚧\u003C/div>\r\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\r\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <h2>What this chapter will cover\u003C/h2>\r\n  <ol>\r\n    <li>Requirements and API\u003C/li>\r\n    <li>Split types as strategies\u003C/li>\r\n    <li>Balance sheet\u003C/li>\r\n    <li>Debt simplification\u003C/li>\r\n    <li>Groups and history\u003C/li>\r\n  \u003C/ol>\r\n\r\n\u003C/main>\r\n\r\n","scripts":[]},"44-case-chess.html":{"title":"Case Study: Chess","chapter":"44","styles":"","html":"\r\n\u003C!-- lld:placeholder -->\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 44\u003C/span><span class=\"pill\" style=\"background:var(--pink-soft);color:var(--pink);border-color:transparent\">Case Study\u003C/span><span class=\"pill\">⏱ 50 min\u003C/span>\u003C/div>\r\n    <h1>Case Study: <span class=\"grad\">Chess\u003C/span>\u003C/h1>\r\n    <p class=\"lead\">Polymorphic pieces, move validation, check detection, and move history as commands.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"callout warn\">\r\n    <div class=\"ico\">🚧\u003C/div>\r\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\r\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <h2>What this chapter will cover\u003C/h2>\r\n  <ol>\r\n    <li>Requirements and API\ order-color:transparent\">Case Study\u003C/span><span class=\"pill\">⏱ 50 min\u003C/span>\u003C/div>\r\n    <h1>Case Study: <span class=\"grad\">Ride-Hailing (LLD)\u003C/span>\u003C/h1>\r\n    <p class=\"lead\">Riders, drivers and trips; matching as a strategy; trip state and observers for live updates.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"callout warn\">\r\n    <div class=\"ico\">🚧\u003C/div>\r\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\r\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <div class=\"callout analogy\">\r\n    <div class=\"ico\">🏗️\u003C/div>\r\n    <div class=\"body\"><div class=\"title\">Same problem, different zoom\u003C/div>\r\n      The System Design course covers the architecture of this system — services, storage and scale. This chapter zooms into the classes inside one of those services. See <a href=\"../system-design/35-case-ride-hailing.html\">the high-level design\u003C/a>.\r\n    \u003C/div>\r\n  \u003C/div>\r\n\r\n  <h2>What this chapter will cover\u003C/h2>\r\n  <ol>\r\n    <li>Requirements and API\u003C/li>\r\n    <li>Entities and trip lifecycle\u003C/li>\r\n    <li>Driver matching strategy\u003C/li>\r\n    <li>Pricing and surge\u003C/li>\r\n    <li>Observers for trip updates\u003C/li>\r\n  \u003C/ol>\r\n\r\n\u003C/main>\r\n\r\n","scripts":[]},"flashcards.html":{"title":"Flashcards","chapter":"","styles":"\r\n  .card-stage { max-width: 720px; margin: 0 auto; }\r\n  .fc { border:1px solid var(--border); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-lg); padding:26px; min-height:300px; display:flex; flex-direction:column; gap:16px; animation:fadeUp .25s; }\r\n  .fc .meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-family:var(--mono); }\r\n  .fc .q { font-size:20px; font-weight:700; line-height:1.45; letter-spacing:-.01em; }\r\n  .fc .opts { display:grid; gap:8px; }\r\n  .fc .opt { text-align:left; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14.5px; cursor:pointer; transition:.18s; }\r\n  .fc .opt:hover:not(:disabled) { border-color:var(--accent); }\r\n  .fc .opt.correct { border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700; }\r\n  .fc .opt.wrong { border-color:var(--red); background:var(--red-soft); color:var(--red); }\r\n  .fc .why { font-size:14px; color:var(--text-2); background:var(--surface-2); border-radius:12px; padding:12px 14px; line-height:1.6; animation:fadeUp .25s; }\r\n  .rate { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px; }\r\n  .rate button { padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:700; font-size:13px; color:var(--text); }\r\n  .rate button small { display:block; font-weight:500; font-size:11px; color:var(--muted); margin-top:2px; }\r\n  .rate button:hover { transform:translateY(-2px); }\r\n  .rate .again { border-color:var(--red); color:var(--red); }\r\n  .rate .hard { border-color:var(--amber); color:var(--amber); }\r\n  .rate .good { border-color:var(--accent-2); color:var(--accent-2); }\r\n  .rate .easy { border-color:var(--green); color:var(--green); }\r\n  .deck-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:16px; }\r\n  .empty { text-align:center; padding:60px 20px; }\r\n  .empty .big { font-size:54px; }\r\n  .heat { display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:3px; margin-top:10px; }\r\n  .heat i { aspect-ratio:1; border-radius:4px; background:var(--surface-3); display:grid; place-items:center; font-size:9px; font-family:var(--mono); color:var(--muted); font-style:normal; }\r\n  .heat i.l1 { background:var(--red-soft); color:var(--red); }\r\n  .heat i.l2 { background:var(--amber-soft); color:var(--amber); }\r\n  .heat i.l3 { background:var(--accent-2-soft); color:var(--accent-2); }\r\n  .heat i.l4 { background:var(--accent-soft); color:var(--accent); }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">🃏 Spaced repetition\u003C/span>\u003C/div>\r\n    <h1>Flashcards\u003C/h1>\r\n    <p class=\"lead\">Every quiz question in the course, turned into a deck that schedules itself. Cards you get right come back later; cards you miss come back soon. Five minutes a day beats an hour once.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"stats\" id=\"fcStats\">\u003C/div>\r\n\r\n  <div class=\"deck-bar\" style=\"margin-top:20px\">\r\n    <div class=\"seg\" id=\"fcScope\"><button data-v=\"due\" class=\"active\">⏰ Due today\u003C/button><button data-v=\"new\">✨ New cards\u003C/button><button data-v=\"all\">📚 Everything\u003C/button><button data-v=\"weak\">🎯 Weakest first\u003C/button>\u003C/div>\r\n    <select class=\"inp\" id=\"fcLevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n    <button class=\"btn sm\" id=\"fcShuffle\">🔀 Shuffle\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"card-stage\" id=\"stage\">\u003C/div>\r\n\r\n  <h2 style=\"margin-top:60px\">Your deck\u003C/h2>\r\n  <p class=\"small muted\">One square per card, coloured by how well you know it. Hover to see the chapter.\u003C/p>\r\n  <div class=\"heat\" id=\"heat\">\u003C/div>\r\n  <div class=\"legend\" style=\"margin-top:10px\"><span><i style=\"background:var(--surface-3)\">\u003C/i>unseen\u003C/span><span><i style=\"background:var(--red-soft)\">\u003C/i>learning\u003C/span><span><i style=\"background:var(--amber-soft)\">\u003C/i>shaky\u003C/span><span><i style=\"background:var(--accent-2-soft)\">\u003C/i>familiar\u003C/span><span><i style=\"background:var(--accent-soft)\">\u003C/i>known\u003C/span>\u003C/div>\r\n  <div class=\"controls\" style=\"justify-content:center;margin-top:20px\">\r\n    <button class=\"btn sm ghost\" id=\"fcReset\">Reset all flashcard progress\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🧠\u003C/div><div class=\"body\"><div class=\"title\">How the scheduling works\u003C/div><p>A simplified SM-2: each card has an <b>ease\u003C/b> and an <b>interval\u003C/b>. “Again” resets it to today, “Hard” nudges the interval up slightly, “Good” multiplies it by the ease, and “Easy” multiplies it more and raises the ease. Intervals grow 1 → 3 → 7 → 16 → 35 days, so a card you know well disappears for a month. Progress is stored in this browser only.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, LS, chNum, chName } = LLD;\r\n  const CARDS = (window.LLD_CARDS || []).map((c, i) => ({ ...c, id: i }));\r\n  const DAY = 86400000;\r\n  let state = LS.get('lld-cards', {});          // id -> {due, iv, ease, reps, lapses}\r\n  let queue = [], cur = null, answered = false, chosen = -1;\r\n\r\n  const today = () => Math.floor(Date.now() / DAY);\r\n  const st = (id) => state[id] || { due: 0, iv: 0, ease: 2.5, reps: 0, lapses: 0 };\r\n  const isNew = (id) => !state[id];\r\n  const isDue = (id) => !isNew(id) && st(id).due <= today();\r\n\r\n  // level filter\r\n  const levels = [...new Set(CARDS.map(c => c.lv))];\r\n  $('#fcLevel').innerHTML = '<option value=\"\">All levels\u003C/option>' + levels.map(l => `<option>${l}\u003C/option>`).join('');\r\n\r\n  function build() {\r\n    const scope = $('#fcScope').dataset.value, lv = $('#fcLevel').value;\r\n    let pool = CARDS.filter(c => !lv || c.lv === lv);\r\n    if (scope === 'due') pool = pool.filter(c => isDue(c.id));\r\n    else if (scope === 'new') pool = pool.filter(c => isNew(c.id));\r\n    else if (scope === 'weak') pool = pool.slice().sort((a, b) => (st(a.id).ease + st(a.id).reps * 0.2) - (st(b.id).ease + st(b.id).reps * 0.2));\r\n    if (scope === 'due' && !pool.length) pool = CARDS.filter(c => (!lv || c.lv === lv) && isNew(c.id)).slice(0, 20);\r\n    if (scope !== 'weak') pool = pool.sort(() => Math.random() - .5);\r\n    queue = pool;\r\n    next();\r\n    stats();\r\n  }\r\n  function next() {\r\n    cur = queue.shift() || null;\r\n    answered = false; chosen = -1;\r\n    render();\r\n  }\r\n  function render() {\r\n    const stage = $('#stage');\r\n    if (!CARDS.length) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🃏\u003C/div><h3>No cards yet\u003C/h3><p class=\"muted small\">The deck is built from each chapter’s quiz. Cards appear here as chapters are written.\u003C/p>\u003C/div>`;\r\n      return;\r\n    }\r\n    if (!cur) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🎉\u003C/div><h3>Nothing left in this pile\u003C/h3><p class=\"muted small\">Come back tomorrow for the next batch, or switch to “New cards” / “Everything” above.\u003C/p><div class=\"controls\" style=\"justify-content:center\"><button class=\"btn primary\" id=\"againBtn\">Study everything\u003C/button>\u003C/div>\u003C/div>`;\r\n      const b = $('#againBtn'); if (b) b.onclick = () => { $$('#fcScope button').forEach(x => x.classList.toggle('active', x.dataset.v === 'all')); $('#fcScope').dataset.value = 'all'; build(); };\r\n      return;\r\n    }\r\n    const s = st(cur.id);\r\n    const badge = isNew(cur.id) ? '✨ new' : `seen ${s.reps}× · next in ${Math.max(0, s.due - today())}d`;\r\n    stage.innerHTML = `<div class=\"fc\">\r\n      <div class=\"meta\"><span>${chName(cur.n)} · ${cur.ti}\u003C/span><span>${badge}\u003C/span>\u003C/div>\r\n      <div class=\"q\">${cur.q}\u003C/div>\r\n      <div class=\"opts\">${cur.o.map((o, i) => `<button class=\"opt\" data-i=\"${i}\">${o}\u003C/button>`).join('')}\u003C/div>\r\n      <div id=\"post\">\u003C/div>\r\n    \u003C/div>`;\r\n    $$('#stage .opt').forEach(b => b.onclick = () => answer(+b.dataset.i));\r\n  }\r\n  function answer(i) {\r\n    if (answered) return;\r\n    answered = true; chosen = i;\r\n    $$('#stage .opt').forEach((b, j) => {\r\n      b.disabled = true;\r\n      if (j === cur.a) b.classList.add('correct');\r\n      else if (j === i) b.classList.add('wrong');\r\n    });\r\n    $('#post').innerHTML = `<div class=\"why\">${i === cur.a ? '✅ ' : '❌ '}${cur.w}<br><a class=\"small\" href=\"${cur.f}\">Revisit ${chName(cur.n)} →\u003C/a>\u003C/div>\r\n      <div class=\"rate\">\r\n        <button class=\"again\" data-r=\"0\">Again<small>&lt; 10 min\u003C/small>\u003C/button>\r\n        <button class=\"hard\" data-r=\"1\">Hard<small id=\"r1\">\u003C/small>\u003C/button>\r\n        <button class=\"good\" data-r=\"2\">Good<small id=\"r2\">\u003C/small>\u003C/button>\r\n        <button class=\"easy\" data-r=\"3\">Easy<small id=\"r3\">\u003C/small>\u003C/button>\r\n      \u003C/div>`;\r\n    const s = st(cur.id);\r\n    const iv = (mult, min) => Math.max(min, Math.round((s.iv || 1) * mult));\r\n    $('#r1').textContent = iv(1.2, 1) + 'd'; $('#r2').textContent = iv(s.ease, 1) + 'd'; $('#r3').textContent = iv(s.ease * 1.4, 4) + 'd';\r\n    $$('#stage .rate button').forEach(b => b.onclick = () => grade(+b.dataset.r));\r\n    if (i !== cur.a) LLD.toast('Marked for another look soon');\r\n  }\r\n  function grade(r) {\r\n    const s = { ...st(cur.id) };\r\n    s.reps = (s.reps || 0) + 1;\r\n    if (r === 0 || chosen !== cur.a) { s.lapses = (s.lapses || 0) + 1; s.iv = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.due = today(); }\r\n    else if (r === 1) { s.iv = Math.max(1, Math.round((s.iv || 1) * 1.2)); s.ease = Math.max(1.3, s.ease - 0.05); s.due = today() + s.iv; }\r\n    else if (r === 2) { s.iv = Math.max(1, Math.round((s.iv || 1) * s.ease)); s.due = today() + s.iv; }\r\n    else { s.iv = Math.max(4, Math.round((s.iv || 1) * s.ease * 1.4)); s.ease = Math.min(3.2, s.ease + 0.1); s.due = today() + s.iv; }\r\n    state[cur.id] = s;\r\n    LS.set('lld-cards', state);\r\n    if (r === 0 || chosen !== cur.a) queue.push(cur);      // see it again this session\r\n    next();\r\n  }\r\n  function stats() {\r\n    const due = CARDS.filter(c => isDue(c.id)).length;\r\n    const fresh = CARDS.filter(c => isNew(c.id)).length;\r\n    const known = CARDS.filter(c => st(c.id).iv >= 7).length;\r\n    const reps = Object.values(state).reduce((a, s) => a + (s.reps || 0), 0);\r\n    $('#fcStats').innerHTML = `\r\n      <div class=\"stat acc\"><div class=\"k\">Due now\u003C/div><div class=\"v\">${due}\u003C/div>\u003C/div>\r\n      <div class=\"stat\"><div class=\"k\">Not started\u003C/div><div class=\"v\">${fresh}\u003C/div>\u003C/div>\r\n      <div class=\"stat good\"><div class=\"k\">Known (7d+ interval)\u003C/div><div class=\"v\">${known} <small>/ ${CARDS.length}\u003C/small>\u003C/div>\u003C/div>\r\n      <div class=\"stat warn\"><div class=\"k\">Total reviews\u003C/div><div class=\"v\">${reps}\u003C/div>\u003C/div>`;\r\n    $('#heat').innerHTML = CARDS.map(c => {\r\n      const s = st(c.id);\r\n      const lvl = isNew(c.id) ? 0 : s.iv >= 16 ? 4 : s.iv >= 7 ? 3 : s.iv >= 3 ? 2 : 1;\r\n      return `<i class=\"${lvl ? 'l' + lvl : ''}\" title=\"${chName(c.n)}: ${c.ti}${isNew(c.id) ? ' — not started' : ' — interval ' + s.iv + 'd'}\">${chNum(c.n)}\u003C/i>`;\r\n    }).join('');\r\n  }\r\n  $('#fcScope').addEventListener('segchange', build);\r\n  $('#fcLevel').addEventListener('change', build);\r\n  $('#fcShuffle').onclick = () => { queue.sort(() => Math.random() - .5); next(); };\r\n  $('#fcReset').onclick = () => { if (confirm('Reset all flashcard scheduling? Chapter progress is not affected.')) { state = {}; LS.set('lld-cards', state); build(); } };\r\n  addEventListener('keydown', e => {\r\n    if (!cur) return;\r\n    if (!answered && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < cur.o.length) answer(i); }\r\n    else if (answered && /^[1-4]$/.test(e.key)) grade(+e.key - 1);\r\n    else if (e.key === ' ' && answered) { e.preventDefault(); grade(2); }\r\n  });\r\n  build();\r\n})();\r\n"]},"glossary.html":{"title":"Glossary","chapter":"","styles":"\r\n  .alpha { display:flex; flex-wrap:wrap; gap:4px; margin:14px 0; }\r\n  .alpha button { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-2); font-weight:700; font-size:13px; cursor:pointer; }\r\n  .alpha button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }\r\n  .alpha button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\r\n  .alpha button:disabled { opacity:.25; cursor:default; }\r\n  .gl-group { margin-top:26px; }\r\n  .gl-letter { font-family:var(--mono); font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.1em; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:10px; }\r\n  .gl { display:grid; gap:8px; }\r\n  .gt { display:grid; grid-template-columns:250px 1fr auto; gap:14px; align-items:baseline; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); animation:fadeUp .2s; }\r\n  @media (max-width:760px){ .gt { grid-template-columns:1fr; gap:4px; } }\r\n  .gt b { font-size:14.5px; }\r\n  .gt .def { color:var(--text-2); font-size:14px; line-height:1.55; }\r\n  .gt .ch { font-size:11.5px; font-family:var(--mono); white-space:nowrap; }\r\n  .gt mark { background:var(--amber-soft); color:var(--text); border-radius:3px; padding:0 2px; }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">📖 <span id=\"count\">\u003C/span> terms\u003C/span>\u003C/div>\r\n    <h1>Glossary\u003C/h1>\r\n    <p class=\"lead\">Every term this course uses, in one sentence each, linked to the chapter that explains it properly. Useful the night before an interview — and for the moment someone says “that breaks Liskov” and you would rather not nod along.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"controls\" style=\"margin-top:8px\">\r\n    <input class=\"inp\" id=\"gq\" placeholder=\"Filter terms… (e.g. cohesion, decorator, invariant)\" style=\"flex:1;min-width:220px\" autocomplete=\"off\">\r\n    <select class=\"inp\" id=\"glevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n  \u003C/div>\r\n  <div class=\"alpha\" id=\"alpha\">\u003C/div>\r\n  <div id=\"glist\">\u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🔎\u003C/div><div class=\"body\"><div class=\"title\">Looking for something specific?\u003C/div><p>Press <kbd class=\"kbd\">Ctrl\u003C/kbd>+<kbd class=\"kbd\">K\u003C/kbd> anywhere in the course to search every chapter, section and visualizer by name.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, CHAPTERS, chNum } = LLD;\r\n  // [term, one-line definition, chapter number]\r\n  const T = [\r\n    ['Abstract class', 'A class that cannot be instantiated and may mix implemented methods with abstract ones; use it when subclasses share state or code, an interface when they only share a role.', 0.4],\r\n    ['Abstract Factory', 'An object that creates a whole family of related objects (a driver’s Connection, Statement and ResultSet) so they always match.', 10],\r\n    ['Adapter', 'A wrapper that makes an existing class fit the interface a client expects, e.g. two payment SDKs behind one PaymentGateway.', 12],\r\n    ['Aggregate', 'A cluster of domain objects changed together through one root entity, which is the only thing outside code may hold a reference to.', 27],\r\n    ['Aggregation', 'A has-a relationship where the part can outlive the whole: a Team has Players, but deleting the team does not delete them.', 6],\r\n    ['Anemic domain model', 'Classes that hold only data with getters and setters, while all behaviour lives in “service” classes — procedural code dressed as objects.', 21],\r\n    ['Association', 'Any structural link between two classes where one holds a reference to the other.', 6],\r\n    ['Backpressure', 'Slowing or blocking producers when a bounded queue is full, so a fast producer cannot exhaust memory.', 23],\r\n    ['BlockingQueue', 'A java.util.concurrent queue whose put blocks when full and take blocks when empty — the backbone of producer-consumer designs.', 23],\r\n    ['Bridge', 'Splitting an abstraction from its implementation so the two can vary independently, avoiding a subclass for every combination.', 12],\r\n    ['Builder', 'An object that assembles a complex, often immutable object step by step and validates it once in build().', 11],\r\n    ['Chain of Responsibility', 'A pipeline of handlers where each either handles a request or passes it to the next, like servlet filters or HTTP middleware.', 19],\r\n    ['Circuit breaker', 'A state machine (closed, open, half-open) that stops calling a failing dependency until it looks healthy again.', 25],\r\n    ['Class invariant', 'A condition that must hold for every object of a class between public method calls, such as balance ≥ 0.', 0.2],\r\n    ['Cohesion', 'How closely the members of a class belong together; high cohesion means every method uses most of the fields.', 5],\r\n    ['Command', 'A request packaged as an object, so it can be queued, logged, retried or undone.', 17],\r\n    ['Command-query separation', 'A method either changes state (a command) or returns information (a query), never both.', 7],\r\n    ['Composite', 'A tree where a single item and a group share one interface, so a Directory and a File can both be asked for size().', 14],\r\n    ['Composition', 'A has-a relationship where the whole owns the part’s lifecycle: a House’s Rooms are destroyed with it.', 6],\r\n    ['Composition root', 'The single place near main() where the whole object graph is constructed and wired together.', 8],\r\n    ['Constructor injection', 'Passing a class’s collaborators into its constructor rather than creating them inside, so they can be swapped and tested.', 8],\r\n    ['Coupling', 'How much one class depends on the details of another; lower coupling means a change stays local.', 5],\r\n    ['Decorator', 'A wrapper with the same interface as the object it wraps that adds behaviour, like BufferedInputStream around a FileInputStream.', 13],\r\n    ['Defensive copy', 'Copying a mutable argument or field on the way in or out, so callers cannot change an object’s state behind its back.', 0.2],\r\n    ['Dependency inversion', 'High-level policy and low-level detail both depend on an abstraction, rather than policy depending on detail.', 4],\r\n    ['Domain event', 'An object that records something that happened in the domain (OrderPlaced), published so other parts can react.', 27],\r\n    ['Double dispatch', 'Choosing a method by the runtime types of two objects; Visitor achieves it with accept() calling back visit(this).', 20],\r\n    ['Dynamic dispatch', 'Choosing which overridden method runs from the object’s runtime class, not the reference’s declared type.', 0.3],\r\n    ['Encapsulation', 'Hiding a class’s state behind methods that keep its invariants true.', 0.2],\r\n    ['Entity', 'A domain object defined by a stable identity rather than its attribute values; two Users with the same name are still different users.', 27],\r\n    ['Facade', 'A simple interface in front of a complicated subsystem.', 12],\r\n    ['Factory Method', 'A method that subclasses or callers use to decide which concrete class to instantiate.', 10],\r\n    ['Fail fast', 'Rejecting invalid input at the boundary with an exception, instead of letting a bad value travel and fail somewhere confusing.', 7],\r\n    ['Flyweight', 'Sharing immutable, intrinsic state across many objects to save memory, e.g.
