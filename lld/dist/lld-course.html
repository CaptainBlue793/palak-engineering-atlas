;\n    if (rq < 3) out.push(['bad', 'Almost no requirements time: scope and constraints will surface mid-code as rewrites. (Requirements & scope)']);\n    if (en + cd < 8) out.push(['bad', 'Under 8 minutes on entities and class design: the code has no design to follow. (Entities, Abstractions)']);\n    if (cd > 16) out.push(['warn', 'Over 16 minutes on the diagram: diminishing returns. Interviewers want to see it hold up in code.']);\n    if (co < 8) out.push(['bad', 'Under 8 minutes of code: most rubrics require compiling-quality Java for the core. (Code quality)']);\n    if (co > 25) out.push(['warn', 'Over 25 minutes coding: probably writing classes that don\\'t carry the design. Stub the trivial ones.']);\n    if (ex < 3 && total <= 45) out.push(['bad', 'No time for the follow-up, which is where extensibility and concurrency get scored.']);\n    if (!out.length) out.push(['ok', 'A balanced round: every phase gets enough time, and there is room for the follow-up.']);\n    return out;\n  }\n  // Rows are built once, so a slider isn't replaced while it's being dragged.\n  $('#pcRows').innerHTML = PH.map(([n], i) => `<div class=\"pc-row\"><span>${n}\u003C/span><input type=\"range\" min=\"0\" max=\"40\" data-i=\"${i}\" aria-label=\"${n} minutes\"><span class=\"v\">\u003C/span>\u003C/div>`).join('');\n  $$('#pcRows input').forEach((r) => r.addEventListener('input', () => { v[+r.dataset.i] = +r.value; $$('#pcPreset button').forEach((b) => b.classList.remove('active')); draw(); }));\n\n  function draw() {\n    const total = v.reduce((a, b) => a + b, 0), W = Math.max(45, total);\n    $$('#pcRows .pc-row').forEach((row, i) => { const r = $('input', row); if (+r.value !== v[i]) r.value = v[i]; $('.v', row).textContent = v[i] + 'm'; });\n    let bar = PH.map(([n, c], i) => v[i] ? `<span style=\"width:${v[i] / W * 100}%;background:${c}\" title=\"${n}: ${v[i]} min\">${v[i] >= 4 ? n : ''}\u003C/span>` : '').join('');\n    if (total < 45) bar += `<span style=\"width:${(45 - total) / W * 100}%;color:var(--muted)\">${45 - total >= 4 ? 'spare' : ''}\u003C/span>`;\n    $('#pcBar').innerHTML = bar;\n    $('#pcFlags').innerHTML = flags().map(([c, t]) => `<li class=\"${c}\">${t}\u003C/li>`).join('');\n  }\n  $$('#pcPreset button').forEach((b) => b.addEventListener('click', () => { v = PRESETS[b.dataset.v].slice(); draw(); }));\n  draw();\n})();\n"]},"02-requirements-to-classes.html":{"title":"From Requirements to Classes","chapter":"2","styles":"\n  .tg-legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:12.5px; }\n  .tg-legend span, .tg-w { border-radius:7px; padding:1px 7px; font-weight:700; }\n  .tg-text { font-size:16.5px; line-height:2.2; margin-top:12px; padding:14px 16px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); }\n  .tg-w { cursor:pointer; border:1.5px dashed var(--border-strong); user-select:none; white-space:nowrap; }\n  .tg-w[data-c=\"none\"] { color:var(--text-2); }\n  .c-entity { background:var(--accent-soft); color:var(--accent); border-color:var(--accent) !important; border-style:solid !important; }\n  .c-value { background:var(--accent-2-soft); color:var(--accent-2); border-color:var(--accent-2) !important; border-style:solid !important; }\n  .c-field { background:var(--green-soft); color:var(--green); border-color:var(--green) !important; border-style:solid !important; }\n  .c-method { background:var(--amber-soft); color:var(--amber); border-color:var(--amber) !important; border-style:solid !important; }\n  .c-actor { background:var(--pink-soft); color:var(--pink); border-color:var(--pink) !important; border-style:solid !important; }\n  .c-out { background:var(--surface-3); color:var(--muted); border-color:var(--border-strong) !important; border-style:solid !important; text-decoration:line-through; }\n  .tg-w.wrongmark { outline:2px solid var(--red); outline-offset:2px; }\n  main.content ul.tg-res { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:6px; font-size:14px; }\n  .tg-res li { padding:7px 11px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); }\n  .tg-res li.tg-ok { border-color:var(--green); }\n  .tg-res li.tg-no { border-color:var(--red); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 2\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>From Requirements to <span class=\"grad\">Classes\u003C/span>\u003C/h1>\n    <p class=\"lead\">Every LLD round opens with something vague: “design a URL shortener.” The first ten minutes decide the next thirty-five. This chapter is the method for those ten minutes: ask the questions that change the design, write down use cases and actors, pull candidate classes and methods out of the words, throw most of them away, and end with a short, defensible class list.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Ask clarifying questions that change the design, and know what each answer changes\u003C/li>\n      <li>Write use cases and actors, and cut scope out loud\u003C/li>\n      <li>Turn nouns into candidate classes and verbs into methods, then filter them\u003C/li>\n      <li>Decide whether a concept is an entity, a value object, a field, an interface or out of scope\u003C/li>\n      <li>Produce a first class list and skeleton for a URL shortener\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>The shape of the round,\u003C/b> and why requirements come first. See <a href=\"01-lld-interview.html\">Chapter 1: What an LLD Interview Tests\u003C/a>.\u003C/li>\n        <li><b>Entities vs value objects,\u003C/b> and records. See <a href=\"p6-value-objects.html\">P6: Value Objects, Enums &amp; Immutability\u003C/a>.\u003C/li>\n        <li><b>Programming to an interface.\u003C/b> See <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Questions that change the design\u003C/h2>\n  <p>A clarifying question is only worth asking if the answer changes what you'll build. “What colour is the button?” doesn't. “Can two users pick the same custom alias at the same moment?” does: it decides whether the repository needs an atomic insert. Before designing, run through the handful of questions below, which fit almost any LLD prompt. For a URL shortener, here is what each answer changes:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Question\u003C/th><th>If yes, the design gains…\u003C/th><th>If no\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Can users pick a custom alias?\u003C/td><td>An <code>Alias\u003C/code> value object with validation, and a uniqueness check that can fail\u003C/td><td>Only generated codes\u003C/td>\u003C/tr>\n        <tr><td>Do links expire?\u003C/td><td>An <code>expiresAt\u003C/code> field, and an injected <code>Clock\u003C/code> so expiry is testable\u003C/td><td>Links live forever\u003C/td>\u003C/tr>\n        <tr><td>Do we count clicks?\u003C/td><td>A counter on the link, updated on every redirect, which must be thread-safe\u003C/td><td>Redirect is read-only\u003C/td>\u003C/tr>\n        <tr><td>Many threads at once?\u003C/td><td>Atomic “insert if absent”, a concurrent map or locks (<a href=\"22-thread-safe-classes.html\">Chapter 22\u003C/a>)\u003C/td><td>A plain <code>HashMap\u003C/code> is fine\u003C/td>\u003C/tr>\n        <tr><td>Can owners delete or edit links?\u003C/td><td>An owner id on the link, and a permission check\u003C/td><td>Anonymous, immutable links\u003C/td>\u003C/tr>\n        <tr><td>Must links survive a restart?\u003C/td><td>A <code>LinkRepository\u003C/code> interface with a database implementation\u003C/td><td>An in-memory store behind the same interface\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Ask these in a batch, not one at a time over ten minutes. A good pattern is to propose defaults and let the interviewer correct them: <i>“I'll assume custom aliases are allowed, links can expire, we count clicks, and the store is shared by many request threads. Anything you'd change?”\u003C/i> That takes thirty seconds and gets the same information.\u003C/p>\n\n  <h2>Use cases, actors and scope\u003C/h2>\n  <p>A <b>use case\u003C/b> is one thing an actor wants to achieve, stated as a verb phrase. An <b>actor\u003C/b> is whoever, or whatever, starts it: a person, another service, a scheduled job. Writing use cases down, even as five short lines, gives you a checklist for the design and a clear way to say what you won't do.\u003C/p>\n  <div class=\"split\">\n    <div class=\"card\"><h4 class=\"mt0\">In scope\u003C/h4>\n      <ul class=\"small mb0\">\n        <li><b>Creator\u003C/b> shortens a URL, with an optional custom alias and expiry\u003C/li>\n        <li><b>Visitor\u003C/b> opens a short link and is redirected, and the click is counted\u003C/li>\n        <li><b>Owner\u003C/b> deletes one of their links\u003C/li>\n        <li><b>Owner\u003C/b> sees a link's click count\u003C/li>\n      \u003C/ul>\u003C/div>\n    <div class=\"card\"><h4 class=\"mt0\">Out of scope (said out loud)\u003C/h4>\n      <ul class=\"small mb0\">\n        <li>Sign-up and login: assume we're given an authenticated owner id\u003C/li>\n        <li>Analytics dashboards, per-country stats\u003C/li>\n        <li>Abuse detection and malicious-URL scanning\u003C/li>\n        <li>Distribution across servers: that's the <a href=\"../system-design/26-case-url-shortener.html\">system design\u003C/a> version\u003C/li>\n      \u003C/ul>\u003C/div>\n  \u003C/div>\n  <p>Notice the actors aren't classes. A visitor is someone making an HTTP request; nothing in the design needs a <code>Visitor\u003C/code> object. The owner shows up only as an <code>ownerId\u003C/code> on a link. Actors tell you who calls the design, not what's inside it.\u003C/p>\n\n  <h2>Nouns become candidates, verbs become methods\u003C/h2>\n  <p>The oldest trick in object-oriented design still works as a starting point: read the requirements, underline the nouns (candidate classes or fields) and the verbs (candidate methods). Then filter hard, because most nouns are not classes. Try it on the shortener's spec. Click a word to cycle through the categories, then check your answers.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Requirements tagger: what does each word become?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"tg-legend\"><span class=\"c-entity\">entity class\u003C/span><span class=\"c-value\">value object\u003C/span><span class=\"c-field\">field\u003C/span><span class=\"c-method\">method\u003C/span><span class=\"c-actor\">actor, not a class\u003C/span><span class=\"c-out\">out of scope\u003C/span>\u003C/div>\n      <div class=\"tg-text\" id=\"tgText\">\u003C/div>\n      <div class=\"controls\" style=\"margin-top:12px\"><button class=\"btn sm primary\" id=\"tgCheck\">Check my tags\u003C/button><button class=\"btn sm\" id=\"tgShow\">Show the answer\u003C/button><button class=\"btn sm\" id=\"tgReset\">↺ clear\u003C/button><span style=\"flex:1\">\u003C/span><span class=\"small muted\" id=\"tgScore\">\u003C/span>\u003C/div>\n      <ul class=\"tg-res\" id=\"tgRes\">\u003C/ul>\n    \u003C/div>\n    <div class=\"panel-foot\">There's room for judgment here: “visit” could be its own class if every visit stored a timestamp and a referrer. The explanations say what would tip each decision the other way.\u003C/div>\n  \u003C/div>\n\n  <h2>Filtering: which candidates earn a class?\u003C/h2>\n  <p>A candidate becomes a class only if it earns its place. Four tests cover almost every case:\u003C/p>\n  <ol>\n    <li><b>It has rules or behaviour.\u003C/b> A <code>ShortLink\u003C/code> knows when it has expired and counts its clicks: a class. A link's creation time just sits there: a field.\u003C/li>\n    <li><b>Several values always travel together, or one value needs validation.\u003C/b> An alias must be 4–32 characters from a fixed set; making it an <code>Alias\u003C/code> value object means it's checked once, in the constructor, and every method that takes an <code>Alias\u003C/code> can trust it.\u003C/li>\n    <li><b>It varies.\u003C/b> Codes might be random, or a counter in base 62, or come from a pre-generated pool. That variation point becomes an interface, <code>CodeGenerator\u003C/code>.\u003C/li>\n    <li><b>It hides a detail the rest shouldn't know.\u003C/b> Where links are stored is <code>LinkRepository\u003C/code>'s business, not the service's.\u003C/li>\n  \u003C/ol>\n  <p>Everything else is a field, a parameter, or nothing at all. Being strict here is what keeps the diagram at six boxes instead of fifteen.\u003C/p>\n\n  <h2>A first class list\u003C/h2>\n  <p>Here is where the ten minutes should land: six types, each with a one-line job. In an interview you'd draw these as a class diagram (<a href=\"p8-reading-uml.html\">P8\u003C/a>) and then write the two that carry the design, <code>ShortLink\u003C/code> and <code>LinkService\u003C/code>.\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">The URL shortener's core, first cut\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"c\">/** A validated short code. Value object: equal aliases are interchangeable. */\u003C/span>\n<span class=\"k\">public record\u003C/span> <span class=\"t\">Alias\u003C/span>(<span class=\"t\">String\u003C/span> value) {\n\t<span class=\"k\">private static final\u003C/span> <span class=\"t\">Pattern\u003C/span> VALID = <span class=\"t\">Pattern\u003C/span>.<span class=\"f\">compile\u003C/span>(<span class=\"s\">\"[A-Za-z0-9_-]{4,32}\"\u003C/span>);\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Alias\u003C/span> {\n\t\t<span class=\"k\">if\u003C/span> (!VALID.<span class=\"f\">matcher\u003C/span>(value).<span class=\"f\">matches\u003C/span>()) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"invalid alias: \"\u003C/span> + value);\n\t}\n}\n\n<span class=\"c\">/** Entity: identified by its alias, with state that changes (clicks). */\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ShortLink\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Alias\u003C/span> alias;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">URI\u003C/span> target;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">String\u003C/span> ownerId;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Instant\u003C/span> expiresAt;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">AtomicLong\u003C/span> clicks = <span class=\"k\">new\u003C/span> <span class=\"t\">AtomicLong\u003C/span>();          <span class=\"c\">// many redirect threads increment it\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">ShortLink\u003C/span>(<span class=\"t\">Alias\u003C/span> alias, <span class=\"t\">URI\u003C/span> target, <span class=\"t\">String\u003C/span> ownerId, <span class=\"t\">Instant\u003C/span> expiresAt) { <span class=\"c\">/* requireNonNull each */\u003C/span> }\n\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isExpired\u003C/span>(<span class=\"t\">Instant\u003C/span> now) { <span class=\"k\">return\u003C/span> !now.<span class=\"f\">isBefore\u003C/span>(expiresAt); }\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">URI\u003C/span> <span class=\"f\">visit\u003C/span>() { clicks.<span class=\"f\">incrementAndGet\u003C/span>(); <span class=\"k\">return\u003C/span> target; }     <span class=\"c\">// tell, don't ask\u003C/span>\n\t<span class=\"k\">public boolean\u003C/span> <span class=\"f\">isOwnedBy\u003C/span>(<span class=\"t\">String\u003C/span> userId) { <span class=\"k\">return\u003C/span> ownerId.<span class=\"f\">equals\u003C/span>(userId); }\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Alias\u003C/span> <span class=\"f\">alias\u003C/span>() { <span class=\"k\">return\u003C/span> alias; }\n\t<span class=\"k\">public long\u003C/span> <span class=\"f\">clicks\u003C/span>() { <span class=\"k\">return\u003C/span> clicks.<span class=\"f\">get\u003C/span>(); }\n}\n\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">CodeGenerator\u003C/span> { <span class=\"t\">Alias\u003C/span> <span class=\"f\">next\u003C/span>(); }           <span class=\"c\">// random, base-62 counter, pre-generated pool…\u003C/span>\n\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">LinkRepository\u003C/span> {\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">ShortLink\u003C/span>&gt; <span class=\"f\">find\u003C/span>(<span class=\"t\">Alias\u003C/span> alias);\n\t<span class=\"k\">boolean\u003C/span> <span class=\"f\">insertIfAbsent\u003C/span>(<span class=\"t\">ShortLink\u003C/span> link);                   <span class=\"c\">// atomic: false if the alias is taken\u003C/span>\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">delete\u003C/span>(<span class=\"t\">Alias\u003C/span> alias);\n}\n\n<span class=\"c\">/** The use cases. Holds no data of its own; coordinates the others. */\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">LinkService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">LinkRepository\u003C/span> links;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">CodeGenerator\u003C/span> codes;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">Clock\u003C/span> clock;                                    <span class=\"c\">// injected, so expiry is testable\u003C/span>\n\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">LinkService\u003C/span>(<span class=\"t\">LinkRepository\u003C/span> links, <span class=\"t\">CodeGenerator\u003C/span> codes, <span class=\"t\">Clock\u003C/span> clock) { <span class=\"c\">/* assign, requireNonNull */\u003C/span> }\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">ShortLink\u003C/span> <span class=\"f\">shorten\u003C/span>(<span class=\"t\">URI\u003C/span> target, <span class=\"t\">String\u003C/span> ownerId, <span class=\"t\">Duration\u003C/span> ttl) {\n\t\t<span class=\"k\">for\u003C/span> (<span class=\"k\">int\u003C/span> attempt = <span class=\"m\">0\u003C/span>; attempt &lt; <span class=\"m\">3\u003C/span>; attempt++) {                <span class=\"c\">// generated codes can collide, rarely\u003C/span>\n\t\t\t<span class=\"t\">ShortLink\u003C/span> link = <span class=\"k\">new\u003C/span> <span class=\"t\">ShortLink\u003C/span>(codes.<span class=\"f\">next\u003C/span>(), target, ownerId, clock.<span class=\"f\">instant\u003C/span>().<span class=\"f\">plus\u003C/span>(ttl));\n\t\t\t<span class=\"k\">if\u003C/span> (links.<span class=\"f\">insertIfAbsent\u003C/span>(link)) <span class=\"k\">return\u003C/span> link;\n\t\t}\n\t\t<span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalStateException\u003C/span>(<span class=\"s\">\"could not allocate a unique code\"\u003C/span>);\n\t}\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">ShortLink\u003C/span> <span class=\"f\">shortenAs\u003C/span>(<span class=\"t\">Alias\u003C/span> custom, <span class=\"t\">URI\u003C/span> target, <span class=\"t\">String\u003C/span> ownerId, <span class=\"t\">Duration\u003C/span> ttl) {\n\t\t<span class=\"t\">ShortLink\u003C/span> link = <span class=\"k\">new\u003C/span> <span class=\"t\">ShortLink\u003C/span>(custom, target, ownerId, clock.<span class=\"f\">instant\u003C/span>().<span class=\"f\">plus\u003C/span>(ttl));\n\t\t<span class=\"k\">if\u003C/span> (!links.<span class=\"f\">insertIfAbsent\u003C/span>(link)) <span class=\"k\">throw new\u003C/span> <span class=\"t\">AliasTakenException\u003C/span>(custom);\n\t\t<span class=\"k\">return\u003C/span> link;\n\t}\n\n\t<span class=\"k\">public\u003C/span> <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">URI\u003C/span>&gt; <span class=\"f\">resolve\u003C/span>(<span class=\"t\">Alias\u003C/span> alias) {\n\t\t<span class=\"k\">return\u003C/span> links.<span class=\"f\">find\u003C/span>(alias)\n\t\t\t.<span class=\"f\">filter\u003C/span>(link -&gt; !link.<span class=\"f\">isExpired\u003C/span>(clock.<span class=\"f\">instant\u003C/span>()))\n\t\t\t.<span class=\"f\">map\u003C/span>(<span class=\"t\">ShortLink\u003C/span>::<span class=\"f\">visit\u003C/span>);\n\t}\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Decisions to say out loud:\u003C/b> <code>Alias\u003C/code> validates once; <code>ShortLink\u003C/code> owns its expiry and click rules; generation and storage are interfaces because they vary; uniqueness is an atomic <code>insertIfAbsent\u003C/code>, never “check, then save”, which two threads could both pass; and the clock is injected so a test can move time forward. <code>AliasTakenException\u003C/code> is an unchecked exception the web layer maps to 409 Conflict.\u003C/div>\n  \u003C/div>\n\n  <figure class=\"seq\" data-actors=\"Visitor|RedirectController|LinkService|LinkRepository|ShortLink\">\n    <ol>\n      <li data-m=\"0>1\">GET /aB3xY9\u003C/li>\n      <li data-m=\"1>2\">resolve(new Alias(\"aB3xY9\"))\u003C/li>\n      <li data-m=\"2>3\">find(alias)\u003C/li>\n      <li data-m=\"3>2\" data-k=\"reply\">Optional[link]\u003C/li>\n      <li data-m=\"2>4\">isExpired(clock.instant()) → false\u003C/li>\n      <li data-m=\"2>4\">visit() → clicks++, returns target\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">Optional[https://example.com/…]\u003C/li>\n      <li data-m=\"1>0\" data-k=\"reply\">302 Found, Location: target\u003C/li>\n    \u003C/ol>\n    <figcaption><b>Checking the class list against a use case.\u003C/b> Walking one flow through the classes is the fastest way to find a missing method or a responsibility in the wrong place. An invalid alias fails at <code>new Alias(...)\u003C/code>, before the service is even called, and maps to 404.\u003C/figcaption>\n  \u003C/figure>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Why “check, then save” fails for custom aliases\u003C/div><p>The obvious code is <code>if (links.find(alias).isEmpty()) links.save(link);\u003C/code>. With two request threads choosing the alias <code>launch\u003C/code> at the same moment, both run <code>find\u003C/code>, both see nothing, and both save. One user's link silently overwrites the other's, and both got a success response. Real stores solve this with one atomic operation: <code>ConcurrentHashMap.putIfAbsent\u003C/code> in memory, or a unique index with <code>INSERT\u003C/code> in a database, which rejects the second insert. Designing the repository method as <code>insertIfAbsent\u003C/code> from the start puts the atomicity in the contract, where every implementation has to honour it.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>A class per noun.\u003C/b> <code>User\u003C/code>, <code>Visitor\u003C/code>, <code>Visit\u003C/code>, <code>Dashboard\u003C/code>, <code>Url\u003C/code>… Most are actors, fields or out of scope.\u003C/li>\n      <li><b>Asking questions that don't change anything,\u003C/b> or asking them one at a time for ten minutes. Propose defaults in one batch.\u003C/li>\n      <li><b>Raw strings for validated concepts.\u003C/b> Every method taking <code>String alias\u003C/code> must re-validate or trust blindly. Make it a value object.\u003C/li>\n      <li><b>“Check, then save” for uniqueness.\u003C/b> Put an atomic insert in the repository contract.\u003C/li>\n      <li><b>Calling <code>Instant.now()\u003C/code> inside domain classes.\u003C/b> Inject a <code>Clock\u003C/code>, or tests can't check expiry.\u003C/li>\n      <li><b>A <code>LinkManager\u003C/code> that does everything.\u003C/b> Logic about one link belongs on <code>ShortLink\u003C/code>; the service only coordinates.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> How do you decide whether a noun from the requirements becomes a class?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>It becomes a class if it has rules or behaviour of its own, if it's a group of values that belong together or need validation, if it's a point where behaviour varies (then it's an interface), or if it hides a detail like storage. Otherwise it's a field or a parameter. Actors like “visitor” are who calls the system, so usually they aren't classes at all, and features we've agreed to skip don't get classes either.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Walk me through your first ten minutes on “design a URL shortener”.\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I'd propose defaults in one go: custom aliases allowed, optional expiry, click counts, many request threads, in-memory storage behind an interface. Then I'd list four use cases (shorten, redirect, delete, see clicks) and cut login, dashboards and abuse detection. From the nouns I'd keep <code>ShortLink\u003C/code> as the entity, <code>Alias\u003C/code> as a validated value object, <code>CodeGenerator\u003C/code> and <code>LinkRepository\u003C/code> as interfaces, and a <code>LinkService\u003C/code> for the use cases, with a <code>Clock\u003C/code> injected. Then I'd walk the redirect flow through them to check nothing's missing, before writing code.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Ask only questions whose answers change the design, and ask them as a batch of proposed defaults.\u003C/li>\n      <li>Write use cases as actor + verb phrase; state what's out of scope out loud.\u003C/li>\n      <li>Nouns are candidate classes, verbs candidate methods, and most candidates don't survive filtering.\u003C/li>\n      <li>A class earns its place with rules or behaviour, validation, variation (interface) or hiding a detail.\u003C/li>\n      <li>Actors call the system; they are rarely classes inside it.\u003C/li>\n      <li>Walk one use case through the class list before coding; it exposes missing methods and misplaced logic.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">The interviewer confirms that short links can expire. What should that add to the design?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A background thread that deletes each link at its exact expiry time\u003C/button>\n        <button class=\"opt\">An <code>expiresAt\u003C/code> on the link, an <code>isExpired(now)\u003C/code> check, and an injected <code>Clock\u003C/code>\u003C/button>\n        <button class=\"opt\">A new <code>Expiry\u003C/code> entity class with its own repository\u003C/button>\n        <button class=\"opt\">Nothing: expiry is an HLD concern\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Expiry is a rule about one link, so it lives on the link, checked when the link is resolved. Injecting a <code>Clock\u003C/code> makes “one second after expiry” testable. Cleanup of old links can come later, as a separate concern.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">In “each car in the parking lot has a colour”, what should colour become?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A <code>Colour\u003C/code> class with getters\u003C/button>\n        <button class=\"opt\">An interface, in case colours change\u003C/button>\n        <button class=\"opt\">A field (or an enum-typed field) on the vehicle, since it has no behaviour or rules of its own\u003C/button>\n        <button class=\"opt\">An actor\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A candidate that just holds a value, with no rules, behaviour or variation, is a field. An enum type is reasonable if the set of colours is fixed and matters to the design.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Why make <code>Alias\u003C/code> a value object instead of passing <code>String alias\u003C/code> around?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">It's validated once in its constructor, so every method that takes an Alias can trust it, and it can't be mixed up with other strings\u003C/button>\n        <button class=\"opt\">Records are faster than strings\u003C/button>\n        <button class=\"opt\">So it can be changed after creation\u003C/button>\n        <button class=\"opt\">Because every noun must become a class\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A value object turns a rule (“4–32 characters from this set”) into a type. Invalid aliases can't exist, and a method signature like <code>resolve(Alias)\u003C/code> can't be called with a target URL by mistake.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">Two users request the custom alias <code>launch\u003C/code> at the same moment. Which repository design prevents both from succeeding?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\"><code>if (repo.find(alias).isEmpty()) repo.save(link);\u003C/code> in the service\u003C/button>\n        <button class=\"opt\">Retrying the save three times\u003C/button>\n        <button class=\"opt\">Checking twice before saving\u003C/button>\n        <button class=\"opt\">An atomic <code>insertIfAbsent(link)\u003C/code> in the repository contract, which returns false for the second one\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Check-then-save has a gap between the check and the save where both threads can pass. The check and the insert must be one atomic operation: <code>putIfAbsent\u003C/code> in memory, or a unique index in a database.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">Which requirement is the most reasonable to cut out loud in a 45-minute shortener round?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Redirecting visitors to the target URL\u003C/button>\n        <button class=\"opt\">An admin dashboard with per-country click charts\u003C/button>\n        <button class=\"opt\">Validating custom aliases\u003C/button>\n        <button class=\"opt\">Making alias creation safe for concurrent requests\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The dashboard is a separate feature built on top of the core. The other three are the core: the main use case, a data rule, and the concurrency problem the interviewer is most likely to probe.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $, $$ } = LLD;\n  const CATS = ['none', 'entity', 'value', 'field', 'method', 'actor', 'out'];\n  const NAME = { entity: 'entity class', value: 'value object', field: 'field', method: 'method', actor: 'actor', out: 'out of scope', none: 'untagged' };\n  // [word, correct category, why]\n  const W = {\n    user:      ['actor',  'The person creating links. Inside the design they appear only as an ownerId field on each link.'],\n    url:       ['value',  'The target URL. Use java.net.URI, which is already a validated, immutable value.'],\n    code:      ['value',  'The short code: the Alias value object, validated once in its constructor.'],\n    alias:     ['value',  'Same concept as the short code, so the same Alias type. Custom or generated, it follows one rule.'],\n    links:     ['entity', 'ShortLink: identified by its alias, with state (clicks) and rules (expiry).'],\n    expire:    ['method', 'isExpired(now) on ShortLink, using an expiresAt field and an injected Clock.'],\n    duration:  ['field',  'Turned into expiresAt when the link is created; a parameter (Duration ttl), then a field.'],\n    visitors:  ['actor',  'Whoever makes the HTTP request. They call the system; there is no Visitor object.'],\n    redirected:['method', 'resolve(alias) on the service, returning the target URI for a 302 response.'],\n    visit:     ['method', 'visit() on ShortLink increments the count. It would become a class only if each visit stored data like a timestamp or referrer.'],\n    count:     ['field',  'An AtomicLong field on ShortLink, because many redirect threads update it.'],\n    owner:     ['field',  'An ownerId on the link, checked by isOwnedBy before a delete.'],\n    delete:    ['method', 'delete(alias, userId) on the service, after checking ownership.'],\n    dashboard: ['out',    'A separate reporting feature built on the click counts. Cut it out loud.'],\n  };\n  const TEXT = 'A [user|user] submits a long [URL|url] and gets back a short [code|code]. They may choose a custom [alias|alias]. [Links|links] can [expire|expire] after a chosen [duration|duration]. [Visitors|visitors] who open a short link are [redirected|redirected] to the original URL, and each [visit|visit] increases the link\\'s click [count|count]. An [owner|owner] can [delete|delete] their link. An admin [dashboard|dashboard] shows the most-clicked links.';\n  const state = {};\n  function render() {\n    $('#tgText').innerHTML = TEXT.replace(/\\[([^|]+)\\|([^\\]]+)\\]/g, (_, w, k) => {\n      const c = state[k] || 'none';\n      return `<span class=\"tg-w ${c === 'none' ? '' : 'c-' + c}\" data-k=\"${k}\" data-c=\"${c}\" title=\"${NAME[c]}\">${w}\u003C/span>`;\n    });\n    $$('.tg-w').forEach((s) => s.onclick = () => {\n      const k = s.dataset.k, i = CATS.indexOf(state[k] || 'none');\n      state[k] = CATS[(i + 1) % CATS.length];\n      $('#tgRes').innerHTML = ''; render();\n    });\n    const tagged = Object.values(state).filter((c) => c !== 'none').length;\n    $('#tgScore').textContent = `${tagged} / ${Object.keys(W).length} tagged`;\n  }\n  function check(reveal) {\n    let right = 0;\n    if (reveal) Object.keys(W).forEach((k) => state[k] = W[k][0]);\n    render();\n    $('#tgRes').innerHTML = Object.entries(W).map(([k, [c, why]]) => {\n      const mine = state[k] || 'none', ok = mine === c; if (ok) right++;\n      if (!ok) $(`.tg-w[data-k=\"${k}\"]`).classList.add('wrongmark');\n      return `<li class=\"${ok ? 'tg-ok' : 'tg-no'}\"><b>${k}\u003C/b>: ${NAME[c]}${ok ? '' : ` <span class=\"muted\">(you: ${NAME[mine]})\u003C/span>`}. ${why}\u003C/li>`;\n    }).join('');\n    $('#tgScore').textContent = `${right} / ${Object.keys(W).length} correct`;\n    if (!reveal) LLD.toast(right === Object.keys(W).length ? 'All correct' : `${right} / ${Object.keys(W).length}: read the notes below`);\n  }\n  $('#tgCheck').onclick = () => check(false);\n  $('#tgShow').onclick = () => check(true);\n  $('#tgReset').onclick = () => { Object.keys(state).forEach((k) => delete state[k]); $('#tgRes').innerHTML = ''; render(); };\n  render();\n})();\n"]},"03-solid-srp-ocp.html":{"title":"SOLID I: Single Responsibility &amp; Open/Closed","chapter":"3","styles":"\n  .ci-pick { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; }\n  @media (max-width:760px) { .ci-pick { grid-template-columns:1fr; } }\n  .ci-pick label { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; }\n  .ci-pick select { width:100%; margin-top:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13.5px; }\n  .ci-cols { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:14px; }\n  @media (max-width:760px) { .ci-cols { grid-template-columns:1fr; } }\n  .ci-col h4 { margin:0 0 8px; font-size:14px; }\n  .ci-classes { display:flex; flex-wrap:wrap; gap:8px; }\n  .ci-c { font-family:var(--mono); font-size:12px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text-2); transition:all .25s; }\n  .ci-c.big { width:100%; }\n  .ci-c.big small { display:block; color:var(--muted); font-size:11px; margin-top:4px; line-height:1.5; }\n  .ci-c.edit { border-color:var(--amber); background:var(--amber-soft); color:var(--text); }\n  .ci-c.add { border-color:var(--green); background:var(--green-soft); color:var(--text); border-style:dashed; }\n  .ci-c.retest { box-shadow:0 0 0 3px var(--red-soft); }\n  .ci-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; }\n  .ci-stats div { padding:8px 10px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); font-size:12px; color:var(--muted); }\n  .ci-stats b { display:block; font-family:var(--mono); font-size:20px; color:var(--text); }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 3\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>SOLID I: Single Responsibility &amp; <span class=\"grad\">Open/Closed\u003C/span>\u003C/h1>\n    <p class=\"lead\">SOLID is five principles that describe classes which are cheap to change. They get recited far more often than they get understood, usually as slogans like “a class should do one thing”. This chapter covers the first two with a precise definition for each, a real class that breaks it, the refactoring that fixes it, and when applying it would be over-engineering.\u003C/p>\n    <ul class=\"objectives\">\n      <li>Define single responsibility as “one reason to change”, meaning one group of people asking for changes\u003C/li>\n      <li>Spot a god class from its fields, methods, dependencies and change history\u003C/li>\n      <li>Split a class along its reasons to change, and coordinate the pieces\u003C/li>\n      <li>Apply open/closed: add behaviour with a new class instead of editing tested code\u003C/li>\n      <li>Recognise when a plain <code>switch\u003C/code> is the better design\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>Interfaces and dynamic dispatch,\u003C/b> which are how open/closed works in Java. See <a href=\"p3-inheritance-dispatch.html\">P3\u003C/a> and <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n        <li><b>Composition:\u003C/b> a class holding interfaces it delegates to. See <a href=\"p5-composition.html\">P5: Composition over Inheritance\u003C/a>.\u003C/li>\n        <li><b>Turning requirements into a class list.\u003C/b> See <a href=\"02-requirements-to-classes.html\">Chapter 2\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>SOLID in one table\u003C/h2>\n  <p>The five principles were collected by Robert C. Martin around 2000, and the acronym came a little later. They're not laws. Each one names a specific way that code becomes expensive to change, and a specific way to avoid it.\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Letter\u003C/th><th>Principle\u003C/th><th>The problem it prevents\u003C/th><th>Covered in\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td><b>S\u003C/b>\u003C/td><td>Single responsibility\u003C/td><td>Unrelated changes colliding in one class\u003C/td><td>This chapter\u003C/td>\u003C/tr>\n        <tr><td><b>O\u003C/b>\u003C/td><td>Open/closed\u003C/td><td>Editing tested code for every new variant\u003C/td><td>This chapter\u003C/td>\u003C/tr>\n        <tr><td><b>L\u003C/b>\u003C/td><td>Liskov substitution\u003C/td><td>Subtypes that break their callers\u003C/td><td><a href=\"04-solid-lsp-isp-dip.html\">Chapter 4\u003C/a>\u003C/td>\u003C/tr>\n        <tr><td><b>I\u003C/b>\u003C/td><td>Interface segregation\u003C/td><td>Clients depending on methods they don't use\u003C/td><td><a href=\"04-solid-lsp-isp-dip.html\">Chapter 4\u003C/a>\u003C/td>\u003C/tr>\n        <tr><td><b>D\u003C/b>\u003C/td><td>Dependency inversion\u003C/td><td>Business rules depending on databases and SDKs\u003C/td><td><a href=\"04-solid-lsp-isp-dip.html\">Chapter 4\u003C/a>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n\n  <h2>Single responsibility: one reason to change\u003C/h2>\n  <p>“A class should do one thing” is too vague to use: everything does one thing at some level of zoom. The precise version is: <b>a class should have one reason to change\u003C/b>, and a reason to change is a <b>group of people who ask for changes\u003C/b>. If finance, the data team and operations can each send you a ticket that edits the same class, that class has three responsibilities, and their changes will collide.\u003C/p>\n  <p>Here's a class almost every company has somewhere. It produces the nightly sales report:\u003C/p>\n  <div class=\"codebox\">\n    <div class=\"cb-head\"><span class=\"cb-name\">ReportService.java: four teams' code in one class\u003C/span><span class=\"cb-sp\">\u003C/span>\u003C/div>\n<pre class=\"code\"><span class=\"k\">public class\u003C/span> <span class=\"t\">ReportService\u003C/span> {\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">DataSource\u003C/span> db;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">SmtpClient\u003C/span> smtp;\n\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">sendDailyReport\u003C/span>(<span class=\"t\">LocalDate\u003C/span> day, <span class=\"t\">String\u003C/span> format, <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">String\u003C/span>&gt; recipients) {\n\t\t<span class=\"c\">// 1. Data team: which rows count as a sale (joins, filters, the schema)\u003C/span>\n\t\t<span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Order\u003C/span>&gt; orders = <span class=\"f\">query\u003C/span>(<span class=\"s\">\"SELECT … FROM orders o JOIN refunds r … WHERE o.day = ?\"\u003C/span>, day);\n\t\t<span class=\"c\">// 2. Finance: totals, tax rules, currency conversion\u003C/span>\n\t\t<span class=\"t\">Money\u003C/span> gross = <span class=\"f\">sum\u003C/span>(orders), tax = gross.<span class=\"f\">times\u003C/span>(<span class=\"f\">taxRate\u003C/span>(day)), net = gross.<span class=\"f\">minus\u003C/span>(tax);\n\t\t<span class=\"c\">// 3. Operations: what the file looks like\u003C/span>\n\t\t<span class=\"t\">String\u003C/span> body = <span class=\"k\">switch\u003C/span> (format) {\n\t\t\t<span class=\"k\">case\u003C/span> <span class=\"s\">\"csv\"\u003C/span>  -&gt; <span class=\"f\">toCsv\u003C/span>(orders, gross, tax, net);\n\t\t\t<span class=\"k\">case\u003C/span> <span class=\"s\">\"json\"\u003C/span> -&gt; <span class=\"f\">toJson\u003C/span>(orders, gross, tax, net);\n\t\t\t<span class=\"k\">default\u003C/span>     -&gt; <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(format);\n\t\t};\n\t\t<span class=\"c\">// 4. Platform team: how it's delivered\u003C/span>\n\t\tsmtp.<span class=\"f\">send\u003C/span>(recipients, <span class=\"s\">\"Sales \"\u003C/span> + day, body);\n\t}\n\t<span class=\"c\">// … query, sum, taxRate, toCsv, toJson, retry logic for SMTP: 600 lines in total …\u003C/span>\n}\u003C/pre>\n    <div class=\"cb-foot\"><b>Four reasons to change:\u003C/b> the order schema, the tax rules, the output format and the delivery channel, each owned by a different team. A tax change and a new CSV column land in the same file in the same week, and each must be tested against the other three.\u003C/div>\n  \u003C/div>\n  <p>The fix is to split along those reasons, so each class answers to one group, and have one small class coordinate them:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">SalesQuery\u003C/span> { <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Order\u003C/span>&gt; <span class=\"f\">completedOrders\u003C/span>(<span class=\"t\">LocalDate\u003C/span> day); }       <span class=\"c\">// data team\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">SalesCalculator\u003C/span> { <span class=\"t\">SalesSummary\u003C/span> <span class=\"f\">summarise\u003C/span>(<span class=\"t\">List\u003C/span>&lt;<span class=\"t\">Order\u003C/span>&gt; orders, <span class=\"t\">LocalDate\u003C/span> day) { … } }  <span class=\"c\">// finance\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">ReportFormatter\u003C/span> { <span class=\"t\">String\u003C/span> <span class=\"f\">format\u003C/span>(<span class=\"t\">SalesSummary\u003C/span> s); }           <span class=\"c\">// operations\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">ReportDelivery\u003C/span> { <span class=\"k\">void\u003C/span> <span class=\"f\">deliver\u003C/span>(<span class=\"t\">String\u003C/span> title, <span class=\"t\">String\u003C/span> body); }  <span class=\"c\">// platform\u003C/span>\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">DailySalesReportJob\u003C/span> {                                       <span class=\"c\">// coordinates; owns no rules\u003C/span>\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">SalesQuery\u003C/span> query;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">SalesCalculator\u003C/span> calculator;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">ReportFormatter\u003C/span> formatter;\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">ReportDelivery\u003C/span> delivery;\n\t<span class=\"c\">// constructor assigns all four\u003C/span>\n\n\t<span class=\"k\">public void\u003C/span> <span class=\"f\">run\u003C/span>(<span class=\"t\">LocalDate\u003C/span> day) {\n\t\t<span class=\"t\">SalesSummary\u003C/span> summary = calculator.<span class=\"f\">summarise\u003C/span>(query.<span class=\"f\">completedOrders\u003C/span>(day), day);\n\t\tdelivery.<span class=\"f\">deliver\u003C/span>(<span class=\"s\">\"Sales \"\u003C/span> + day, formatter.<span class=\"f\">format\u003C/span>(summary));\n\t}\n}\u003C/pre>\n  <p>Each piece can now change, and be tested, on its own. <code>SalesCalculator\u003C/code> in particular has no database or network, so finance's tax rules get fast unit tests with plain lists of orders. That's a good sign you've split in the right place: the part with the most important rules ended up with the fewest dependencies.\u003C/p>\n  <figure class=\"seq\" data-actors=\"Scheduler|DailySalesReportJob|SalesQuery|SalesCalculator|ReportFormatter|ReportDelivery\">\n    <ol>\n      <li data-m=\"0>1\">run(2026-09-29)\u003C/li>\n      <li data-m=\"1>2\">completedOrders(day)\u003C/li>\n      <li data-m=\"2>1\" data-k=\"reply\">12,408 orders\u003C/li>\n      <li data-m=\"1>3\">summarise(orders, day)\u003C/li>\n      <li data-m=\"3>1\" data-k=\"reply\">SalesSummary(gross, tax, net)\u003C/li>\n      <li data-m=\"1>4\">format(summary)\u003C/li>\n      <li data-m=\"1>5\">deliver(\"Sales 2026-09-29\", body)\u003C/li>\n    \u003C/ol>\n    <figcaption><b>The same report after the split.\u003C/b> The job reads like the use case. Each arrow goes to something one team owns.\u003C/figcaption>\n  \u003C/figure>\n\n  <h2>Spotting a god class\u003C/h2>\n  <p>A <b>god class\u003C/b> knows too much and does too much. You rarely need to read all 600 lines to find one; the signs are visible from outside:\u003C/p>\n  <ul>\n    <li><b>Its name is a vague noun:\u003C/b> <code>Manager\u003C/code>, <code>Service\u003C/code>, <code>Helper\u003C/code>, <code>Utils\u003C/code>, <code>Processor\u003C/code>. Names that can't describe the job usually mean there's more than one job.\u003C/li>\n    <li><b>Its fields split into groups\u003C/b> that are used by different, non-overlapping groups of methods. That is low <b>cohesion\u003C/b>, and each group is a class waiting to get out.\u003C/li>\n    <li><b>Its imports span layers:\u003C/b> JDBC, an HTTP client, a PDF library and a tax table in one file.\u003C/li>\n    <li><b>Its tests need five mocks\u003C/b> to test one rule.\u003C/li>\n    <li><b>Its git history shows commits from several teams,\u003C/b> and merge conflicts between unrelated features.\u003C/li>\n  \u003C/ul>\n\n  <h2>Open/closed: extend without editing\u003C/h2>\n  <p>The second principle says a module should be <b>open for extension but closed for modification\u003C/b>. In plain terms: adding a new variant of something should mean adding new code, not editing code that already works and is already tested. In Java that means the variation sits behind an interface, and the code that uses it never names the concrete classes.\u003C/p>\n  <p>The god class's <code>switch (format)\u003C/code> is the classic violation. Adding XLSX output means editing that method, and the same switch has usually been copied into the file-naming code and the content-type code too. After the split, formats are a <code>ReportFormatter\u003C/code> interface, and choosing one is a lookup:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public final class\u003C/span> <span class=\"t\">XlsxFormatter\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">ReportFormatter\u003C/span> { … }         <span class=\"c\">// the new code: one new class\u003C/span>\n\n<span class=\"t\">Map\u003C/span>&lt;<span class=\"t\">String\u003C/span>, <span class=\"t\">ReportFormatter\u003C/span>&gt; formatters = <span class=\"t\">Map\u003C/span>.<span class=\"f\">of\u003C/span>(\n\t<span class=\"s\">\"csv\"\u003C/span>,  <span class=\"k\">new\u003C/span> <span class=\"t\">CsvFormatter\u003C/span>(),\n\t<span class=\"s\">\"json\"\u003C/span>, <span class=\"k\">new\u003C/span> <span class=\"t\">JsonFormatter\u003C/span>(),\n\t<span class=\"s\">\"xlsx\"\u003C/span>, <span class=\"k\">new\u003C/span> <span class=\"t\">XlsxFormatter\u003C/span>());                                   <span class=\"c\">// plus one line where things are wired\u003C/span>\u003C/pre>\n  <p>No existing formatter, no calculator and no job changed. The wiring line is the one place that does change, and that's by design: a system is never closed to <i>every\u003C/i> change. The skill is choosing which changes it's closed against. Here it's new formats, because the requirement was “operations keeps asking for new formats”. <a href=\"15-strategy.html\">Chapter 15\u003C/a> calls this the Strategy pattern, and <a href=\"24-extensibility.html\">Chapter 24\u003C/a> shows how to register implementations without editing even the wiring.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Change-impact simulator: what does each request touch?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"ci-pick\">\n        <label>Change request<select id=\"ciReq\">\u003C/select>\u003C/label>\n        <label>Who asked<select id=\"ciWho\" disabled>\u003C/select>\u003C/label>\n      \u003C/div>\n      <div class=\"ci-cols\">\n        <div class=\"ci-col\"><h4>God class: ReportService\u003C/h4><div class=\"ci-classes\" id=\"ciGod\">\u003C/div><div class=\"ci-stats\" id=\"ciGodS\">\u003C/div>\u003C/div>\n        <div class=\"ci-col\"><h4>Split by reason to change\u003C/h4><div class=\"ci-classes\" id=\"ciSplit\">\u003C/div><div class=\"ci-stats\" id=\"ciSplitS\">\u003C/div>\u003C/div>\n      \u003C/div>\n      <p class=\"small\" id=\"ciNote\" style=\"margin:12px 0 0\">\u003C/p>\n    \u003C/div>\n    <div class=\"panel-foot\">Amber: edited. Dashed green: new class. Red halo: behaviour that must be retested because it lives in a file that changed. The god class retests everything on every change; the split design retests only what the request is about.\u003C/div>\n  \u003C/div>\n\n  <h2>When OCP is over-engineering\u003C/h2>\n  <p>Every interface is a cost: another file, another indirection, another thing to name. Open/closed pays off where variants really are added over time by people who shouldn't have to understand the rest. It doesn't pay off where the set of cases is fixed and yours:\u003C/p>\n  <ul>\n    <li><b>A closed set.\u003C/b> HTTP methods, days of the week, the four states of a job. A <code>switch\u003C/code> over an enum or sealed interface is clearer than four classes, and the compiler checks that a switch expression covers every case (for enums since Java 14, for sealed types since Java 21).\u003C/li>\n    <li><b>Only one variant, with no second one in sight.\u003C/b> Don't add <code>ReportFormatter\u003C/code> for a report that has only ever been CSV. When the second format arrives, extracting the interface takes minutes. A common rule of thumb is to abstract on the second or third variant, not the first.\u003C/li>\n    <li><b>Throwaway code:\u003C/b> a one-off migration script needs no extension points.\u003C/li>\n  \u003C/ul>\n  <p>In an interview this judgment is itself a signal. Saying <i>“I'll put pricing behind an interface because the prompt says rates change; vehicle sizes are a fixed enum, so a switch is fine there”\u003C/i> shows you know both the principle and its price.\u003C/p>\n\n  <div class=\"callout usecase\">\n    <div class=\"ico\">🧠\u003C/div>\n    <div class=\"body\"><div class=\"title\">Logging frameworks are open/closed in practice\u003C/div><p>SLF4J and Logback ship with appenders for the console, files and rolling files. When a company needs logs shipped to its own collector, nobody edits Logback. They write a class that implements Logback's <code>Appender\u003C/code> interface, and add a few lines to <code>logback.xml\u003C/code> naming it. The logging core, used by millions of applications, is closed to that change and open to the extension. The same shape shows up in JDBC drivers, servlet filters, and <a href=\"33-case-logger.html\">Case Study 33\u003C/a>, where you build a logging framework yourself.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  <div class=\"callout danger\"><div class=\"ico\">⚠️\u003C/div><div class=\"body\"><div class=\"title\">Common mistakes\u003C/div>\n    <ul class=\"mb0\">\n      <li><b>Reading SRP as “one method per class”.\u003C/b> A class can have many methods that all answer to one group of people.\u003C/li>\n      <li><b>Splitting by technical layer only\u003C/b> (a Controller, a Service, a DAO) while one Service still mixes four teams' rules.\u003C/li>\n      <li><b>Duplicated switches.\u003C/b> The same <code>switch (format)\u003C/code> in three places means every new format needs three edits, and one gets missed.\u003C/li>\n      <li><b>An interface for everything, on day one.\u003C/b> Abstract where variation is expected or has appeared, not everywhere.\u003C/li>\n      <li><b>A coordinator that grows rules.\u003C/b> The job class should call the pieces, not compute tax “just this once”.\u003C/li>\n      <li><b>Thinking OCP means never editing anything.\u003C/b> Wiring changes; the goal is that tested behaviour doesn't.\u003C/li>\n    \u003C/ul>\u003C/div>\u003C/div>\n\n  <div class=\"callout interview\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">Interview drill\u003C/div>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Explain it simply:\u003C/b> What does the single responsibility principle actually mean?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>A class should have one reason to change, and a reason to change is a group of people who request changes. If finance's tax rules, the data team's queries and operations' file formats all live in one class, three groups edit the same file and their changes collide and need retesting together. So I split along those lines: one class per group of rules, plus a small coordinator that calls them. It's not “one method per class”.\u003C/div>\u003C/details>\n    <p class=\"small\" style=\"margin:10px 0 0\"><b>Deeper:\u003C/b> Your exporter has a <code>switch\u003C/code> over formats, and product says new formats arrive every quarter. What do you change, and where would you still keep a switch?\u003C/p>\n    <details class=\"ans\"><summary>How a strong answer sounds\u003C/summary><div>I'd put formats behind a <code>ReportFormatter\u003C/code> interface, one class per format, and choose one by looking it up in a map built where the application is wired. A new format is then a new class plus one registration line, and no tested formatter changes. That's open/closed, aimed at the change we were told to expect. I'd still use a switch for closed sets I own, like a job-state enum, where an exhaustive switch expression is clearer and the compiler checks every case is handled.\u003C/div>\u003C/details>\n  \u003C/div>\u003C/div>\n\n  <div class=\"takeaways\">\n    <h3>🧠 Key takeaways\u003C/h3>\n    <ul>\n      <li>Single responsibility: one reason to change, meaning one group of people requesting changes.\u003C/li>\n      <li>God classes show themselves: vague names, field groups used by separate method groups, imports from every layer, many mocks per test.\u003C/li>\n      <li>Split by reason to change, and keep a thin coordinator that calls the pieces and owns no rules.\u003C/li>\n      <li>Open/closed: a new variant is a new class behind an interface, not an edit to tested code.\u003C/li>\n      <li>Choose which changes to be closed against, based on what the requirements say will vary.\u003C/li>\n      <li>Closed sets you own are fine as enum or sealed switches; abstract on the second or third variant, not the first.\u003C/li>\n    \u003C/ul>\n  \u003C/div>\n\n  <div class=\"quiz-wrap\">\n    <h2>Check your understanding\u003C/h2>\n    <div class=\"quiz-score\">\u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">In “a class should have one reason to change”, what is a “reason to change”?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A single public method\u003C/button>\n        <button class=\"opt\">A bug report\u003C/button>\n        <button class=\"opt\">A group of people, such as finance or operations, whose requests would change the class\u003C/button>\n        <button class=\"opt\">A line of code that might be edited\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">SRP is about who drives change. If requests from different groups land in the same class, their changes collide. One method per class is not the goal.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"0\">\n      <p class=\"q\">Which sign most strongly suggests a class has several responsibilities?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Its fields split into groups that are used by separate, non-overlapping groups of methods\u003C/button>\n        <button class=\"opt\">It has more than ten lines\u003C/button>\n        <button class=\"opt\">It implements an interface\u003C/button>\n        <button class=\"opt\">It has a constructor with two parameters\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">Separate field-and-method groups mean low cohesion: the class is really several classes sharing a name. Size alone isn't the test.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"3\">\n      <p class=\"q\">The exporter chooses output with <code>switch (format)\u003C/code>, copied in three methods. What does adding XLSX require?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">A new class only\u003C/button>\n        <button class=\"opt\">Nothing, if the default case handles it\u003C/button>\n        <button class=\"opt\">A config change\u003C/button>\n        <button class=\"opt\">Editing three tested methods, and hoping none is missed\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A switch spread over several places means each new variant modifies existing code in each of them. That's exactly what open/closed is designed to avoid.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"1\">\n      <p class=\"q\">With formats behind <code>ReportFormatter\u003C/code> and chosen from a map, what does adding XLSX involve?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Editing every existing formatter\u003C/button>\n        <button class=\"opt\">A new <code>XlsxFormatter\u003C/code> class plus one registration line where formatters are wired\u003C/button>\n        <button class=\"opt\">Editing <code>SalesCalculator\u003C/code>\u003C/button>\n        <button class=\"opt\">Changing the <code>ReportFormatter\u003C/code> interface\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">The extension is a new class; the only edit is at the wiring point, which is designed to change. Tested formatters and the calculator are untouched.\u003C/div>\n    \u003C/div>\n\n    <div class=\"quiz\" data-answer=\"2\">\n      <p class=\"q\">When is a plain <code>switch\u003C/code> the better design?\u003C/p>\n      <div class=\"opts\">\n        <button class=\"opt\">Never: a switch always violates open/closed\u003C/button>\n        <button class=\"opt\">Whenever there are more than five cases\u003C/button>\n        <button class=\"opt\">When the cases are a closed set you own, like an enum of job states, and new cases are rare\u003C/button>\n        <button class=\"opt\">When the cases are plugins written by other teams\u003C/button>\n      \u003C/div>\n      <div class=\"explain\">A closed set gains nothing from extension points, and an exhaustive switch over an enum or sealed type is short, clear and compiler-checked. Plugins from other teams are the opposite case, where OCP pays off.\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n\u003C/main>\n\n\n","scripts":["\n(function(){\n  const { $ } = LLD;\n  // The god class's four behaviours, and the split classes.\n  const GOD_PARTS = ['order query', 'tax & totals', 'CSV/JSON formats', 'email delivery'];\n  const SPLIT = ['SalesQuery', 'SalesCalculator', 'CsvFormatter', 'JsonFormatter', 'ReportDelivery (email)', 'DailySalesReportJob', 'wiring'];\n  // request: [who, split edits, split additions, note]\n  const REQ = {\n    'Tax rate changes for October':               ['Finance',      ['SalesCalculator'], [], 'A rule change touches only the class that owns the rule, and its fast unit tests.'],\n    'Add an XLSX format':                         ['Operations',   ['wiring'], ['XlsxFormatter'], 'Open/closed: a new class plus one registration line. No existing formatter is opened.'],\n    'Refunds must be excluded from sales':        ['Data team',    ['SalesQuery'], [], 'The definition of “a sale” lives in the query, so only the query changes.'],\n    'Send the report to Slack instead of email':  ['Platform',     ['wiring'], ['SlackDelivery'], 'Delivery is an interface, so Slack is a new implementation chosen at wiring time.'],\n    'Add a “net margin” column to every format':  ['Finance + Ops', ['SalesCalculator', 'CsvFormatter', 'JsonFormatter'], [], 'A genuinely cross-cutting change touches several classes in both designs, but each edit is small and in the obvious place.'],\n  };\n  $('#ciReq').innerHTML = Object.keys(REQ).map((r) => `<option>${r}\u003C/option>`).join('');\n\n  function render() {\n    const [who, edits, adds, note] = REQ[$('#ciReq').value];\n    $('#ciWho').innerHTML = `<option>${who}\u003C/option>`;\n    $('#ciGod').innerHTML = `<div class=\"ci-c big edit retest\">ReportService.java<small>${GOD_PARTS.join(' · ')}\u003C/small>\u003C/div>`;\n    $('#ciGodS').innerHTML = `<div><b>1\u003C/b>class edited\u003C/div><div><b>0\u003C/b>classes added\u003C/div><div><b>${GOD_PARTS.length}/${GOD_PARTS.length}\u003C/b>behaviours to retest\u003C/div>`;\n    const cls = SPLIT.map((c) => {\n      const e = edits.includes(c) || (c === 'CsvFormatter' && edits.includes('CsvFormatter'));\n      return `<div class=\"ci-c${e ? ' edit' + (c === 'wiring' ? '' : ' retest') : ''}\">${c}\u003C/div>`;\n    }).concat(adds.map((a) => `<div class=\"ci-c add\">+ ${a}\u003C/div>`));\n    $('#ciSplit').innerHTML = cls.join('');\n    const retest = edits.filter((c) => c !== 'wiring').length + adds.length;\n    $('#ciSplitS').innerHTML = `<div><b>${edits.length}\u003C/b>class${edits.length === 1 ? '' : 'es'} edited\u003C/div><div><b>${adds.length}\u003C/b>class${adds.length === 1 ? '' : 'es'} added\u003C/div><div><b>${retest}\u003C/b>behaviour${retest === 1 ? '' : 's'} to retest\u003C/div>`;\n    $('#ciNote').innerHTML = `<b>${who}:\u003C/b> ${note}`;\n  }\n  $('#ciReq').addEventListener('change', render);\n  render();\n})();\n"]},"04-solid-lsp-isp-dip.html":{"title":"SOLID II: Liskov, Interface Segregation &amp; Dependency Inversion","chapter":"4","styles":"\n  .ct-wrap { overflow-x:auto; margin-top:12px; }\n  table.ct { border-collapse:separate; border-spacing:4px; width:100%; min-width:640px; font-size:13px; }\n  table.ct th { font-weight:700; text-align:left; padding:6px 8px; color:var(--muted); font-size:12px; }\n  table.ct td { padding:8px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); vertical-align:top; }\n  table.ct td.impl { font-family:var(--mono); font-weight:700; cursor:pointer; }\n  table.ct td.impl.sel { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }\n  table.ct td.pass { background:var(--green-soft); border-color:transparent; text-align:center; font-weight:800; color:var(--green); }\n  table.ct td.fail { background:var(--red-soft); border-color:transparent; text-align:center; font-weight:800; color:var(--red); cursor:help; }\n  table.ct td.pending { text-align:center; color:var(--muted); }\n  .ct-detail { margin-top:12px; padding:10px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); font-size:14px; min-height:44px; }\n  .dip { width:100%; }\n  .dip text { font-family:var(--mono); font-size:12px; fill:var(--text); }\n  .dip .pkg { fill:none; stroke:var(--border-strong); stroke-dasharray:5 4; stroke-width:1.2; }\n  .dip .pk { font-size:10.5px; fill:var(--muted); font-weight:700; letter-spacing:.06em; }\n  .dip .bx { fill:var(--surface); stroke:var(--border-strong); stroke-width:1.4; }\n  .dip .bx.i { stroke:var(--accent); }\n  .dip .ar { stroke:var(--text-2); stroke-width:1.5; fill:none; }\n  .dip .ar.bad { stroke:var(--red); }\n  .dip .ar.dash { stroke-dasharray:6 4; }\n","html":"\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 4\u003C/span><span class=\"pill\">Principles\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>SOLID II: Liskov, Interface Segregation &amp; <span class=\"grad\">Dependency Inversion\u003C/span>\u003C/h1>\n    <p class=\"lead\">The first two SOLID principles were about individual classes. The last three are about the <b>boundaries\u003C/b> between them: whether an implementation can really stand in for its interface, whether an interface asks too much of the classes that use it, and which way dependencies should point. Get these right and swapping a storage engine, a payment provider or a test fake becomes routine.\u003C/p>\n    <ul class=\"objectives\">\n      <li>State Liskov substitution as a set of contract rules, and spot subtypes that break them\u003C/li>\n      <li>Explain why <code>UnsupportedOperationException\u003C/code> in an implementation is a design smell\u003C/li>\n      <li>Check substitutability with contract tests run against every implementation\u003C/li>\n      <li>Split a fat interface into role interfaces that match what each client needs\u003C/li>\n      <li>Apply dependency inversion: business rules own the interfaces, infrastructure implements them\u003C/li>\n    \u003C/ul>\n  \u003C/section>\n\n  <div class=\"callout tip\">\n    <div class=\"ico\">📚\u003C/div>\n    <div class=\"body\"><div class=\"title\">What you need before this chapter\u003C/div>\n      <ul class=\"mb0\">\n        <li><b>The substitution test,\u003C/b> and the JDK classes that fail it. See <a href=\"p5-composition.html\">P5: Composition over Inheritance\u003C/a>.\u003C/li>\n        <li><b>Interfaces and default methods.\u003C/b> See <a href=\"p4-interfaces-generics.html\">P4\u003C/a>.\u003C/li>\n        <li><b>Single responsibility and open/closed.\u003C/b> See <a href=\"03-solid-srp-ocp.html\">Chapter 3: SOLID I\u003C/a>.\u003C/li>\n      \u003C/ul>\n    \u003C/div>\n  \u003C/div>\n\n  <h2>Liskov substitution: honour the contract\u003C/h2>\n  <p>Barbara Liskov's principle, in practical terms: <b>code written against a type must keep working when given any of its subtypes\u003C/b>. Compiling isn't enough; the compiler only checks method signatures. What matters is <b>behaviour\u003C/b>: what a method accepts, what it promises afterwards, and what it may throw. A subtype, whether a subclass or an interface implementation, must follow four rules:\u003C/p>\n  <div class=\"table-wrap\">\n    <table class=\"t cmp\">\n      <thead><tr><th>Rule\u003C/th><th>Meaning\u003C/th><th>Violation example\u003C/th>\u003C/tr>\u003C/thead>\n      <tbody>\n        <tr><td>Don't strengthen preconditions\u003C/td><td>Accept at least everything the type accepts\u003C/td><td>The interface allows blobs up to 5 GB; one store rejects anything over 1 MB\u003C/td>\u003C/tr>\n        <tr><td>Don't weaken postconditions\u003C/td><td>Promise at least what the type promises\u003C/td><td>After <code>put\u003C/code>, <code>get\u003C/code> should return the data; one store may silently evict it at once\u003C/td>\u003C/tr>\n        <tr><td>Keep the invariants\u003C/td><td>What's always true of the type stays true\u003C/td><td>A “sorted” collection subtype that allows unsorted insertion\u003C/td>\u003C/tr>\n        <tr><td>No new kinds of failure\u003C/td><td>Don't throw exceptions callers were never told to expect\u003C/td><td>A read-only store whose <code>put\u003C/code> throws <code>UnsupportedOperationException\u003C/code>\u003C/td>\u003C/tr>\n      \u003C/tbody>\n    \u003C/table>\n  \u003C/div>\n  <p>Here's an interface for object storage, the kind every service has for uploads, reports or backups, with its contract written where callers will see it:\u003C/p>\n<pre class=\"code\"><span class=\"c\">/**\n * Stores byte blobs by key.\n * put: accepts any key and any blob up to 5 GB; afterwards get(key) returns exactly those bytes. Overwrites.\n * get: returns Optional.empty() for a missing key; never throws for \"not found\".\n */\u003C/span>\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">BlobStore\u003C/span> {\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">put\u003C/span>(<span class=\"t\">String\u003C/span> key, <span class=\"k\">byte\u003C/span>[] blob);\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"k\">byte\u003C/span>[]&gt; <span class=\"f\">get\u003C/span>(<span class=\"t\">String\u003C/span> key);\n}\u003C/pre>\n  <p>Five teams wrote implementations. Each compiles. Only some are substitutable. The standard way to find out is a <b>contract test\u003C/b>: one abstract test class that states the interface's promises as tests, and a small subclass per implementation that just says how to create it. Every implementation runs the same tests. Run them below.\u003C/p>\n\n  <div class=\"panel\">\n    <div class=\"panel-head\"><div class=\"dots\"><i>\u003C/i><i>\u003C/i><i>\u003C/i>\u003C/div><span class=\"p-title\">Contract tests: is every BlobStore substitutable?\u003C/span><span class=\"p-tag\">Interactive\u003C/span>\u003C/div>\n    <div class=\"panel-body\">\n      <div class=\"controls\"><button class=\"btn sm primary\" id=\"ctRun\">▶ run contract tests\u003C/button><button class=\"btn sm\" id=\"ctReset\">↺ reset\u003C/button><span style=\"flex:1\">\u003C/span><span class=\"small muted\">Click an implementation, or a red cell, for details.\u003C/span>\u003C/div>\n      <div class=\"ct-wrap\"><table class=\"ct\" id=\"ctTable\">\u003C/table>\u003C/div>\n      <div class=\"ct-detail\" id=\"ctDetail\">Every implementation compiles against <code>BlobStore\u003C/code>. Run the tests to see which ones keep its promises.\u003C/div>\n    \u003C/div>\n    <div class=\"panel-foot\">In JUnit this is an abstract class <code>BlobStoreContractTest\u003C/code> with an abstract <code>newStore()\u003C/code> method, and one tiny subclass per implementation. A new implementation gets every test for free, and can't claim to be a <code>BlobStore\u003C/code> until they pass.\u003C/div>\n  \u003C/div>\n\n  <h2>The UnsupportedOperationException smell\u003C/h2>\n  <p>The read-only archive store failed because it implements an interface it can't fully honour, and fills the gap with <code>throw new UnsupportedOperationException()\u003C/code>. The JDK does this too: <code>List.of(...)\u003C/code> returns a list whose <code>add\u003C/code> throws. Java gets away with it because the <code>Collection\u003C/code> documentation labels mutation methods as “optional operations”, so strictly the contract permits it. It's still a known weak spot: code that takes a <code>List\u003C/code> can't know whether <code>add\u003C/code> will work without knowing where the list came from.\u003C/p>\n  <p>In your own designs, an implementation that needs to throw “unsupported” is telling you the interface is too big for it. It's the doorway to the next principle: split the interface so the archive can implement just the part it supports.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">BlobReader\u003C/span> { <span class=\"t\">Optional\u003C/span>&lt;<span class=\"k\">byte\u003C/span>[]&gt; <span class=\"f\">get\u003C/span>(<span class=\"t\">String\u003C/span> key); }\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">BlobStore\u003C/span> <span class=\"k\">extends\u003C/span> <span class=\"t\">BlobReader\u003C/span> { <span class=\"k\">void\u003C/span> <span class=\"f\">put\u003C/span>(<span class=\"t\">String\u003C/span> key, <span class=\"k\">byte\u003C/span>[] blob); }\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ArchiveStore\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">BlobReader\u003C/span> { … }   <span class=\"c\">// honest: it can only read\u003C/span>\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">ReportDownloader\u003C/span> { <span class=\"k\">private final\u003C/span> <span class=\"t\">BlobReader\u003C/span> reports; … } <span class=\"c\">// takes only what it needs\u003C/span>\u003C/pre>\n\n  <h2>Interface segregation: role interfaces\u003C/h2>\n  <p>The principle: <b>no client should be forced to depend on methods it doesn't use\u003C/b>. Fat interfaces grow naturally, because it's easiest to add one more method to the interface that already exists. A typical one:\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">UserRepository\u003C/span> {\n\t<span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">findById\u003C/span>(<span class=\"t\">UserId\u003C/span> id);          <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">findByEmail\u003C/span>(<span class=\"t\">EmailAddress\u003C/span> e);\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">save\u003C/span>(<span class=\"t\">User\u003C/span> u);                           <span class=\"k\">void\u003C/span> <span class=\"f\">delete\u003C/span>(<span class=\"t\">UserId\u003C/span> id);\n\t<span class=\"t\">Page\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">search\u003C/span>(<span class=\"t\">String\u003C/span> text, <span class=\"k\">int\u003C/span> page);    <span class=\"t\">List\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">inactiveSince\u003C/span>(<span class=\"t\">Instant\u003C/span> t);\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">ban\u003C/span>(<span class=\"t\">UserId\u003C/span> id, <span class=\"t\">String\u003C/span> reason);         <span class=\"k\">void\u003C/span> <span class=\"f\">exportCsv\u003C/span>(<span class=\"t\">OutputStream\u003C/span> out);\n\t<span class=\"t\">UserStats\u003C/span> <span class=\"f\">stats\u003C/span>();                           <span class=\"c\">// … and five more\u003C/span>\n}\u003C/pre>\n  <p>The login service needs exactly one of those methods, <code>findByEmail\u003C/code>. Yet it depends on all thirteen. Three things go wrong. Its test fake must implement thirteen methods, most throwing “not needed”. A change to <code>exportCsv\u003C/code>'s signature forces the login code to recompile and redeploy. And reading the login service's constructor tells you nothing about what it actually does with users.\u003C/p>\n  <p>The fix is <b>role interfaces\u003C/b>: small interfaces shaped by what each client needs, all implemented by the same class.\u003C/p>\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">UserLookup\u003C/span>    { <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">findById\u003C/span>(<span class=\"t\">UserId\u003C/span> id); <span class=\"t\">Optional\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">findByEmail\u003C/span>(<span class=\"t\">EmailAddress\u003C/span> e); }\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">UserWriter\u003C/span>    { <span class=\"k\">void\u003C/span> <span class=\"f\">save\u003C/span>(<span class=\"t\">User\u003C/span> u); <span class=\"k\">void\u003C/span> <span class=\"f\">delete\u003C/span>(<span class=\"t\">UserId\u003C/span> id); }\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">UserSearch\u003C/span>    { <span class=\"t\">Page\u003C/span>&lt;<span class=\"t\">User\u003C/span>&gt; <span class=\"f\">search\u003C/span>(<span class=\"t\">String\u003C/span> text, <span class=\"k\">int\u003C/span> page); }\n<span class=\"k\">public interface\u003C/span> <span class=\"t\">UserAdmin\u003C/span>     { <span class=\"k\">void\u003C/span> <span class=\"f\">ban\u003C/span>(<span class=\"t\">UserId\u003C/span> id, <span class=\"t\">String\u003C/span> reason); <span class=\"t\">UserStats\u003C/span> <span class=\"f\">stats\u003C/span>(); <span class=\"k\">void\u003C/span> <span class=\"f\">exportCsv\u003C/span>(<span class=\"t\">OutputStream\u003C/span> out); }\n\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">JdbcUserRepository\u003C/span> <span class=\"k\">implements\u003C/span> <span class=\"t\">UserLookup\u003C/span>, <span class=\"t\">UserWriter\u003C/span>, <span class=\"t\">UserSearch\u003C/span>, <span class=\"t\">UserAdmin\u003C/span> { … }\n\n<span class=\"k\">public final class\u003C/span> <
