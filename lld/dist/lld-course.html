window.LLD_CARDS = [{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"After Session a = new Session(\"u1\"); Session b = a; b.extend(30); what does a.ttlMinutes() return? (A new session starts at 30.)","o":["30, because only b was extended","60","It doesn't compile","It depends on when the garbage collector runs"],"a":1,"w":"b = a copies the reference, so a and b point at the same object. Extending it through b changes the one object both variables see, so it is now 60."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"static void swap(Session x, Session y) { Session t = x; x = y; y = t; } is called as swap(a, b) , where a is user u1's session and b is u2's. What does a.userId() print afterwards?","o":["u2, because the sessions were swapped","It throws NullPointerException","u1, because only the method's copies of the references were swapped","u1, because swap made copies of both Session objects"],"a":2,"w":"Java copies each reference into x and y . The method swaps those two local copies, then its frame is discarded. The caller's a and b never changed. No object was copied either: only references are passed."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"Inside a method, Session s = new Session(\"u1\"); runs. Where do the variable s and the Session object live?","o":["s (a reference) is in the method's stack frame; the object is on the heap","Both are on the stack, because s is a local variable","Both are on the heap","s is on the heap; the object is in the stack frame"],"a":0,"w":"Local variables, including references, live in the frame of the call that declares them. Every object created with new lives on the heap. That is why the object can outlive the method, for example if it is returned or stored in a field."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"When does a Session object become eligible for garbage collection?","o":["As soon as the method that created it returns","When its reference count drops to zero, so two objects pointing at each other are never collected","When you call System.gc()","When no chain of references from a GC root (a live frame, a static field) reaches it any more"],"a":3,"w":"Java's collectors use reachability from GC roots. An object returned or stored in a field survives its creating method. Cycles are collected once nothing outside reaches them. System.gc() is only a hint and never frees a reachable object."},{"n":0.1,"ti":"Classes, Objects & References","f":"p1-classes-objects.html","lv":"Prerequisites","q":"Why is private static int activeSessions , incremented and decremented from constructors and a close() method, a risky design?","o":["Static fields are stored on the stack, so the value is lost between calls","It is one global value shared by every test and every thread: tests leak state into each other, and concurrent updates can be lost","Static fields can't be changed after the class loads","Each Session object gets its own copy, so the count is always 1"],"a":1,"w":"A static field has exactly one copy for the whole program. That makes it global mutable state: hidden from constructors, shared across tests, and racy under concurrency unless guarded. A counter object passed to whoever needs it avoids all three problems."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A field is declared as int tokens; with no modifier. Which code can read and write it?","o":["Only the class itself: no modifier means private","Any code anywhere: no modifier means public","The class itself and every class in the same package","The class itself and its subclasses only"],"a":2,"w":"Leaving out the modifier gives package-private access: the declaring class plus every class in the same package. To restrict it to the class, you must write private ."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A TokenBucket has private fields but a public setTokens(int) with no validation, and callers write if (b.getTokens() > 0) b.setTokens(b.getTokens() - 1) . What is the core design problem?","o":["The class can't guarantee 0 ≤ tokens ≤ capacity: any caller can set any value, and the spending rule is copied into every caller","Getters are slower than reading a field directly","The fields should be public so callers don't need getters","Nothing: the fields are private, so it is encapsulated"],"a":0,"w":"Private fields with an unchecked setter give callers full control of the state, so the class can promise nothing. The fix is an operation like tryAcquire() that does the check and the change inside the class."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"An ApiKey constructor does this.scopes = scopes; . The code that created the key later runs scopes.add(\"admin:write\") on its own variable. What happens, and what is the fix?","o":["Nothing happens: the key has a private field, so the caller's change goes to a different set","It throws, because the key's field is final","The key gains the scope; fix it by making the field final","The key gains the scope; fix it by copying in the constructor, e.g. Set.copyOf(scopes)"],"a":3,"w":"The key stored a reference to the caller's set, so both share one object. final only stops the field being re-pointed; the set itself can still change. Copying in the constructor gives the key its own set that no one else can reach."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"A class returns Collections.unmodifiableList(orders) from a getter, and later adds a new order to orders internally. What does a caller holding the returned list see?","o":["The old contents: unmodifiableList made a copy","The new order too, because it is a read-only view; but the caller can't add or remove","An exception the next time it reads the list","The new order, and the caller can also add orders through it"],"a":1,"w":"unmodifiableList wraps the original list without copying. Reads go through to the live list, and writes throw UnsupportedOperationException . Use List.copyOf when you want a snapshot."},{"n":0.2,"ti":"Encapsulation & Invariants","f":"p2-encapsulation.html","lv":"Prerequisites","q":"Why is if (bucket.tryAcquire(now)) handle(req); a better design than if (bucket.available() > 0) { bucket.take(); handle(req); } ?","o":["Method calls with fewer characters run faster","It avoids needing a return value","The check and the change happen together inside the class, so the rule lives in one place and there's one method to make thread-safe","It lets callers skip the refill step when they are in a hurry"],"a":2,"w":"“Tell, don't ask.” Splitting the check ( available ) from the action ( take ) puts the rule in every caller and leaves a gap between check and act where another thread can take the last token. One method closes both problems."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"With the chapter's classes, Appender a = new JsonFileAppender(w); a.flush(); runs which method?","o":["Appender.flush , because a is declared as an Appender","FileAppender.flush , the nearest override in the object's class chain","JsonFileAppender.flush","It doesn't compile"],"a":1,"w":"The object is a JsonFileAppender , which doesn't override flush , so its method-table entry points at the nearest override up the chain: FileAppender.flush . The declared type only matters for the compile-time check that flush exists."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"Appender a = new FileAppender(w); a.rotate(); What happens?","o":["The file is rotated, because the object is a FileAppender","It throws ClassCastException at run time","It silently does nothing","A compile error: Appender has no rotate method"],"a":3,"w":"The compiler checks the call against the declared type, Appender , which has no rotate . The runtime class is never consulted for this check. You'd need a variable of type FileAppender (or a cast) to call it."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"A class has record(Object o) and record(String s) . Which runs for Object p = \"ok\"; audit.record(p); ?","o":["record(Object) : overloads are chosen at compile time from the argument's declared type","record(String) : the argument is really a String","Both run, in declaration order","It's ambiguous and doesn't compile"],"a":0,"w":"Overload resolution uses the declared type of the argument expression, Object . Dynamic dispatch applies only to the object the method is called on, not to argument types."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"InstrumentedHashSet overrides add (count++) and addAll (count += size) and calls super in both. After addAll of three new elements, what is the count?","o":["3","0, because super.addAll bypasses the overrides","6, because the inherited addAll calls add , which is dispatched to the override","9"],"a":2,"w":"addAll adds 3, then the inherited implementation calls add once per element, each dispatched to the override, adding 3 more. The subclass silently depends on how its parent is implemented: the fragile base class problem."},{"n":0.3,"ti":"Inheritance & Dynamic Dispatch","f":"p3-inheritance-dispatch.html","lv":"Prerequisites","q":"A base-class constructor calls format(\"started\") . A subclass overrides format to use its private final String prefix , assigned in its own constructor after super() . What does the override see?","o":["The prefix, because final fields are set before any constructor runs","null , because the parent constructor runs before the subclass assigns prefix","A compile error: constructors can't call instance methods","The parent's format runs instead, because dispatch is disabled in constructors"],"a":1,"w":"Dispatch works inside constructors, so the override runs, but the subclass's constructor body hasn't run yet, and prefix still holds its default, null . Constructors should only call private or final methods."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"Several request handlers share a JSON codec field and the same error-mapping code, and differ in one step. What's the best structure?","o":["One interface with default methods holding the codec","Copy the shared code into each handler class","An interface callers depend on, plus an abstract class that implements it, holds the codec, and leaves the one step abstract","One concrete handler with a big switch on the endpoint name"],"a":2,"w":"Shared state needs a class, because interfaces have no fields. Keeping the interface means callers aren't tied to the skeleton, and handlers that don't fit it can implement the interface directly."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"A method is declared double total(List<Number> xs) . What happens when you call it with a List<Integer> ?","o":["It works: an Integer is a Number","Compile error: generic types are invariant, so change the parameter to List<? extends Number>","It compiles but throws ClassCastException","Compile error: change the parameter to List<? super Number>"],"a":1,"w":"List<Integer> is not a subtype of List<Number> . Since total only reads, the list is a producer: ? extends Number accepts lists of any Number subtype."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"You want a parameter you can add(Integer) to, which accepts a List<Integer> , a List<Number> or a List<Object> . Which type?","o":["List<Integer>","List<? extends Integer>","List<Object>","List<? super Integer>"],"a":3,"w":"The list consumes Integers, so it's ? super Integer : any list whose element type is Integer or a supertype. Any such list can safely hold an Integer."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"A class implements interfaces Sink and Audited , unrelated to each other, and both have a default describe() . The class doesn't declare describe() . What happens?","o":["Compile error: the class must override describe() , and may call Sink.super.describe() inside it","The first interface in the implements list wins","Both defaults run, one after the other","A runtime error the first time describe() is called"],"a":0,"w":"With no class method and no more-specific interface, Java refuses to guess. The class must override the method, and can delegate to either default explicitly with Interface.super.method() ."},{"n":0.4,"ti":"Interfaces, Abstract Classes & Generics","f":"p4-interfaces-generics.html","lv":"Prerequisites","q":"Why doesn't if (payload instanceof List<String>) compile?","o":["instanceof doesn't work with interfaces","Lists can't hold Strings","Type arguments are erased at run time, so the JVM can't tell a List<String> from a List<Integer>","It does compile, but always returns false"],"a":2,"w":"Erasure removes type arguments after compilation. At run time there is only List , so Java only allows instanceof List<?> (or plain List ) and makes you check elements yourself."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"A payment client supports 4 gateways and 3 optional features (retries, circuit breaker, metrics) that can be combined freely. How many classes does one-subclass-per-combination need, compared with composition?","o":["12 vs 7","7 vs 7","32 vs 7","64 vs 12"],"a":2,"w":"Each feature is on or off independently: 2³ = 8 combinations per gateway, times 4 gateways = 32 subclasses. Composition needs one class per gateway and one wrapper per feature: 4 + 3 = 7."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"CountingSet extends ForwardingSet and wraps a HashSet . Why does addAll of 3 elements now count 3 instead of 6?","o":["The inner HashSet's addAll calls its own add , which never reaches CountingSet's override","ForwardingSet disables dynamic dispatch","HashSet no longer calls add from addAll when wrapped","CountingSet only overrides add"],"a":0,"w":"The inner set is a separate object that doesn't know it's wrapped, so its self-calls go to its own methods. CountingSet counts only in its own add and addAll , which callers invoke directly."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"What is wrong with java.util.Stack extends Vector ?","o":["Vector is too slow to back a stack","A stack can't be generic","Stack should extend LinkedList instead","Every Stack inherits index-based insert and remove, so callers can break last-in-first-out: a stack is not a kind of Vector"],"a":3,"w":"It fails the substitution test in reverse: Vector's operations don't all make sense for a stack, but Stack exposes them anyway. Holding a list internally, as ArrayDeque does for the Deque interface, would have kept the operations to push, pop and peek."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"Which is a good use of inheritance?","o":["Extending HashMap to log every put","A sealed interface Command permits Get, Set, Delete for a key-value store protocol you own","class RetryingAuditedSmsNotifier extends AuditedSmsNotifier","Extending a class to reuse one of its helper methods"],"a":1,"w":"A sealed hierarchy is closed, owned by you, and each variant truly is a Command. The others extend a class not designed for it, encode feature combinations as classes, or inherit a whole API to reuse one method."},{"n":0.5,"ti":"Composition over Inheritance","f":"p5-composition.html","lv":"Prerequisites","q":"What is a genuine downside of composition?","o":["Wrapped objects can't be swapped at run time","It couples you to the wrapped class's internal self-calls","Forwarding a large interface is boilerplate, and calls the inner object makes to itself skip the wrappers","A class can only hold one other object"],"a":2,"w":"Forwarding every method takes code (write a forwarding class once to contain it), and the inner object's calls to this bypass any wrapper. The other options describe inheritance's problems, or aren't true."}];
</script>

  const LLD = {

    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),

    fmt(n, d = 1) {

      if (a >= 1e9) return (n / 1e9).toFixed(d).replace(/\.0+$/, '') + 'B';
      if (a >= 1e6) return (n / 1e6).toFixed(d).replace(/\.0+$/, '') + 'M';

    bytes(b) {
      const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB'];
      let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
      return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)).replace(/\.0+$/, '') + ' ' + u[i];
    },
    svg(tag, attrs = {}, parent) {
      const e = document.createElementNS(SVGNS, tag);
      for (const k in attrs) {

      if (parent) parent.appendChild(e);

    },
    /** centre of any element in the coordinate space of its owner <svg> */
    center(svg, el) {

      const pt = svg.createSVGPoint();
      pt.x = r.left + r.width / 2; pt.y = r.top + r.height / 2;

    /** animate a glowing dot from (x1,y1) to (x2,y2). resolves when done */
    packet(svg, x1, y1, x2, y2, o = {}) {

      let t2;
      if (o.label) t2 = LLD.svg('text', { 'font-size': 10, 'text-anchor': 'middle', fill: color, 'font-weight': 700, text: o.label, style: 'font-family:var(--mono)' }, g);
      const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const e = ease(t);
          const x = x1 + (x2 - x1) * e, y = y1 + (y2 - y1) * e;
          c.setAttribute('cx', x); c.setAttribute('cy', y);
          if (t2) { t2.setAttribute('x', x); t2.setAttribute('y', y - 11); }

          else { if (!o.keep) g.remove(); res(g); }

        requestAnimationFrame(tick);

    },
    packetBetween(svg, a, b, o) {
      const p = LLD.center(svg, a), q = LLD.center(svg, b);

    },
    /** animate along an existing <path> */
    packetAlong(svg, path, o = {}) {
      const len = path.getTotalLength();
      const dur = o.dur || 900;
      const g = LLD.svg('g', { class: 'packet', style: `color:${o.color || 'var(--accent)'}` }, svg);
      const c = LLD.svg('circle', { r: o.r || 6, fill: o.color || 'var(--accent)' }, g);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);

    log(el, html, cls = '') {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.innerHTML = html;
      el.appendChild(d);

      el.scrollTop = el.scrollHeight;

    toast(msg) {

  function toggleTheme() {

  /* ---------------- components ---------------- */
  function initTabs(root = document) {

  function initSteppers(root = document) {
    LLD.$$('.stepper', root).forEach((st) => {
      if (st._init) return; st._init = true;
      const diagram = document.getElementById(st.dataset.diagram);
      const steps = LLD.$$('ol.steps > li', st);
      const intro = st.dataset.intro || 'Press <b>Next</b> or <b>Play</b> to walk through this flow step by step.';
      st.insertAdjacentHTML('beforeend', `
        <div class="step-text"><div class="st-title"></div><div class="st-desc"></div></div>
        <div class="stepper-bar">
          <div class="stepper-dots">${steps.map(() => '<i></i>').join('')}</div>
          <span class="count"></span>
          <button class="btn sm" data-a="reset" title="Reset">↺</button>
          <button class="btn sm" data-a="prev">← Prev</button>
          <button class="btn sm" data-a="play">▶ Play</button>
          <button class="btn sm primary" data-a="next">Next →</button>
        </div>`);
      const title = LLD.$('.st-title', st), desc = LLD.$('.st-desc', st), count = LLD.$('.count', st);
      const dots = LLD.$$('.stepper-dots i', st);
      const playBtn = LLD.$('[data-a=play]', st);
      let idx = -1, playing = false, token = 0;

      const clear = () => { if (diagram) LLD.$$('.on', diagram).forEach((e) => e.classList.remove('on')); };
      async function go(i) {
        idx = LLD.clamp(i, -1, steps.length - 1);
        const my = ++token;
        clear();
        dots.forEach((d, j) => { d.classList.toggle('active', j === idx); d.classList.toggle('past', j < idx); });
        count.textContent = idx < 0 ? `${steps.length} steps` : `Step ${idx + 1} / ${steps.length}`;
        LLD.$('[data-a=prev]', st).disabled = idx < 0;
        LLD.$('[data-a=next]', st).disabled = idx >= steps.length - 1;
        if (idx < 0) {
          diagram && diagram.classList.remove('stepping');
          title.innerHTML = '👋 Interactive walkthrough'; desc.innerHTML = intro;
          st.dispatchEvent(new CustomEvent('step', { detail: { index: -1 } }));
          return;
        }
        const li = steps[idx];
        diagram && diagram.classList.add('stepping');
        (li.dataset.on || '').split(/\s+/).filter(Boolean).forEach((id) => {
          const e = diagram && diagram.querySelector('#' + CSS.escape(id));
          if (e) e.classList.add('on');
        });
        title.innerHTML = `<span class="n">${idx + 1}</span>${li.dataset.title || ''}`;
        desc.innerHTML = li.innerHTML;
        desc.style.animation = 'none'; void desc.offsetWidth; desc.style.animation = '';
        st.dispatchEvent(new CustomEvent('step', { detail: { index: idx, li } }));
        if (li.dataset.packet && diagram) {
          for (const seg of li.dataset.packet.split(',')) {
            if (my !== token) return;
            const [a, b] = seg.split('>').map((s) => s.trim());
            const ea = diagram.querySelector('#' + CSS.escape(a)), eb = diagram.querySelector('#' + CSS.escape(b));
            if (ea && eb) await LLD.packetBetween(diagram, ea, eb, { color: li.dataset.color, dur: 650 });
          }
        }
      }
      async function play() {
        if (playing) { playing = false; playBtn.textContent = '▶ Play'; return; }
        playing = true; playBtn.textContent = '⏸ Pause';
        if (idx >= steps.length - 1) idx = -1;
        while (playing && idx < steps.length - 1) {
          await go(idx + 1);
          await LLD.sleep(+st.dataset.delay || 2300);
        }
        playing = false; playBtn.textContent = '▶ Play';
      }
      st.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (!a) return;
        if (a !== 'play' && playing) { playing = false; playBtn.textContent = '▶ Play'; }
        if (a === 'next') go(idx + 1);
        if (a === 'prev') go(idx - 1);
        if (a === 'reset') go(-1);
        if (a === 'play') play();
      });
      dots.forEach((d, j) => (d.onclick = () => go(j)));
      st._go = go;
      go(-1);
    });
  }

  function initQuizzes(chap) {
    const quizzes = LLD.$$('.quiz');
    if (!quizzes.length) return;
    let answered = 0, correct = 0;
    const scoreEl = LLD.$('.quiz-score');

      if (!scoreEl) return;
      scoreEl.innerHTML = `<span class="big">${correct}/${quizzes.length}</span><span>${answered < quizzes.length ? `Answered ${answered} of ${quizzes.length} — keep going!` : correct === quizzes.length ? 'Perfect score! You nailed this chapter. 🏆' : correct >= quizzes.length * .6 ? 'Solid! Review the ones you missed. 💪' : 'Worth a re-read of the sections above. 📚'}</span>`;
      if (answered === quizzes.length && chap) {
        const best = LS.get('lld-quiz', {});
        best[chap.n] = Math.max(best[chap.n] || 0, correct / quizzes.length);
        LS.set('lld-quiz', best);
      }
    };
    quizzes.forEach((q, qi) => {
      const qp = LLD.$('.q', q);
      if (qp && !qp.querySelector('.qn')) qp.insertAdjacentHTML('afterbegin', `<span class="qn">Q${qi + 1}</span>`);
      const opts = LLD.$$('.opt', q);
      const ans = +q.dataset.answer;
      opts.forEach((o, i) => {

        };
      });
    });

  }

  function initReveal() {
    const els = LLD.$$('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
    const io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    }), { threshold: 0.12 });
    els.forEach((e) => io.observe(e));
  }

  /** Run a callback only while an element is on screen (saves CPU for sims) */
  LLD.whenVisible = function (el, onShow, onHide) {
    if (!('IntersectionObserver' in window)) { onShow(); return; }
    new IntersectionObserver((ents) => ents.forEach((en) => (en.isIntersecting ? onShow() : onHide && onHide())), { threshold: 0.05 }).observe(el);
  };

/* >>> shared visuals (generated by tools/components/install.cjs) */
  /* ---------------- sequence diagrams & workflows (shared visuals) ----------------
     <figure class="seq" data-actors="Client|API|DB">
       <ol>
         <li data-m="0>1">POST /orders<small>optional detail shown under the diagram</small></li>
         <li data-m="1>2">INSERT …</li>
         <li data-m="2>1" data-k="reply">ok</li>        reply  = dashed arrow back
         <li data-m="1>1">validate</li>                 self   = loop on one lifeline
         <li data-m="0-2" data-k="note">note text</li>  note   = box spanning lifelines 0…2
         <li data-m="1>2" data-k="fail">timeout</li>    fail   = red arrow ending in ✕ (lost / refused)
         <li data-m="1>2" data-k="bad">stale write</li> bad    = red arrow that arrives (harmful but delivered)
         <li data-m="1>2" data-k="async">event</li>     async  = open arrowhead, dashed
       </ol>
       <figcaption>…</figcaption>
     </figure>
     <figure class="flow"><ol>
         <li data-k="start|step|decision|store|end|fail"><b>Title</b> short description</li>
     </ol><figcaption>…</figcaption></figure>                                           */
  function initSeq(root = document) {
    LLD.$$('figure.seq', root).forEach((fig) => {
      if (fig._init) return; fig._init = true;
      const actors = (fig.dataset.actors || '').split('|').map((s) => s.trim());
      const items = LLD.$$(':scope > ol > li', fig).map((li) => {
        const small = li.querySelector('small');
        const detail = small ? small.innerHTML : '';
        const clone = li.cloneNode(true); const s2 = clone.querySelector('small'); if (s2) s2.remove();
        const m = li.dataset.m || '0>1';
        const note = m.includes('-') && !m.includes('>');
        const [a, b] = m.split(note ? '-' : '>').map((x) => +x);
        return { a, b, note, kind: li.dataset.k || (note ? 'note' : 'msg'), label: clone.textContent.trim(), detail };
      });
      fig.querySelector(':scope > ol').hidden = true;
      const PADX = 80, TOP = 58, ROW = 46, CH = 7.3;   // CH ≈ width of one mono character
      // Each gap between neighbouring lifelines is wide enough for the labels that live in it.
      const gap = actors.slice(1).map((n, i) => Math.max(140, (n.length + actors[i].length) * 3.9 + 30));
      items.forEach((it) => {
        if (it.note) return;
        const lo = Math.min(it.a, it.b), hi = Math.max(it.a, it.b), need = it.label.length * CH + 44;
        if (lo === hi) { if (lo < gap.length) gap[lo] = Math.max(gap[lo], need + 40); return; }
        const have = gap.slice(lo, hi).reduce((s, g) => s + g, 0);
        if (need > have) for (let g = lo; g < hi; g++) gap[g] += (need - have) / (hi - lo);
      });
      const xs = [PADX]; gap.forEach((g) => xs.push(xs.at(-1) + g));
      const selfLast = items.some((it) => !it.note && it.a === it.b && it.a === actors.length - 1);
      const lastSelf = selfLast ? Math.max(...items.filter((it) => !it.note && it.a === it.b && it.a === actors.length - 1).map((it) => it.label.length * CH + 60)) : 0;
      const W = xs.at(-1) + Math.max(PADX, lastSelf);
      const rowH = (it) => (it.note ? 40 : it.a === it.b ? 54 : ROW);
      const ys = []; let y = TOP + 26;
      items.forEach((it) => { ys.push(y); y += rowH(it); });
      const H = y + 20;
      const X = (i) => xs[i];
      const wrap = document.createElement('div'); wrap.className = 'seq-scroll';
      const svg = LLD.svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, class: 'seq-svg', role: 'img', 'aria-label': 'Sequence diagram: ' + actors.join(', ') });
      svg.style.minWidth = Math.round(W * 0.82) + 'px';   // shrink to fit, but never below ~82%: scroll instead
      wrap.appendChild(svg);
      const defs = LLD.svg('defs', {}, svg);
      const uid = 'sq' + Math.random().toString(36).slice(2, 8);
      [['h', 'var(--text-2)'], ['r', 'var(--red)'], ['a', 'var(--accent)']].forEach(([k, col]) => {
        const mk = LLD.svg('marker', { id: uid + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
        LLD.svg('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, mk);
      });
      actors.forEach((name, i) => {
        LLD.svg('line', { x1: X(i), y1: TOP, x2: X(i), y2: H - 10, class: 'seq-life' }, svg);
        const g = LLD.svg('g', { class: 'seq-actor' }, svg);
        const w = Math.max(70, name.length * 7.4 + 22);
        LLD.svg('rect', { x: X(i) - w / 2, y: 12, width: w, height: 34, rx: 9 }, g);
        LLD.svg('text', { x: X(i), y: 34, 'text-anchor': 'middle', text: name }, g);
      });
      const els = items.map((it, k) => {
        const g = LLD.svg('g', { class: 'seq-msg k-' + it.kind }, svg);
        const yy = ys[k];
        if (it.note) {
          const x1 = X(Math.min(it.a, it.b)) - 56, x2 = X(Math.max(it.a, it.b)) + 56;
          LLD.svg('rect', { x: x1, y: yy - 12, width: x2 - x1, height: 28, rx: 6, class: 'seq-note' }, g);
          LLD.svg('text', { x: (x1 + x2) / 2, y: yy + 6, 'text-anchor': 'middle', text: it.label }, g);
          return { g, path: null };
        }
        let d;
        if (it.a === it.b) d = `M${X(it.a)},${yy} h44 v22 h-40`;
        else d = `M${X(it.a) + (it.b > it.a ? 4 : -4)},${yy + 8} L${X(it.b) + (it.b > it.a ? -6 : 6)},${yy + 8}`;
        const mk = it.kind === 'fail' || it.kind === 'bad' ? 'r' : 'h';
        const p = LLD.svg('path', { d, class: 'seq-arrow', 'marker-end': it.kind === 'fail' ? '' : `url(#${uid}${mk})` }, g);
        if (it.kind === 'fail') {
          const ex = X(it.b) + (it.b > it.a ? -12 : 12);
          LLD.svg('path', { d: `M${ex - 6},${yy + 2} l12,12 M${ex + 6},${yy + 2} l-12,12`, class: 'seq-x' }, g);
        }
        const tx = it.a === it.b ? X(it.a) + 52 : (X(it.a) + X(it.b)) / 2;
        LLD.svg('text', { x: tx, y: it.a === it.b ? yy + 15 : yy, 'text-anchor': it.a === it.b ? 'start' : 'middle', text: it.label, class: 'seq-label' }, g);
        const nx = X(it.a) + (it.a === it.b || it.b > it.a ? -13 : 13), ny = it.a === it.b ? yy + 11 : yy + 8;
        LLD.svg('circle', { cx: nx, cy: ny, r: 8, class: 'seq-badge' }, g);
        LLD.svg('text', { x: nx, y: ny + 3.5, 'text-anchor': 'middle', text: String(k + 1), class: 'seq-num' }, g);
        return { g, path: p };
      });
      const bar = document.createElement('div'); bar.className = 'seq-bar';
      bar.innerHTML = `<div class="seq-detail"><b class="seq-step">▶ Press Play to animate the ${items.length} steps</b><span></span></div>
        <div class="seq-btns"><button class="btn sm" data-a="prev">←</button><button class="btn sm primary" data-a="play">▶ Play</button><button class="btn sm" data-a="next">→</button><button class="btn sm" data-a="all" title="Show every step">All</button></div>`;
      const cap = fig.querySelector('figcaption');
      fig.insertBefore(wrap, cap || null); fig.insertBefore(bar, cap || null);
      const stepEl = bar.querySelector('.seq-step'), detEl = bar.querySelector('.seq-detail span'), playBtn = bar.querySelector('[data-a=play]');
      let idx = -1, playing = false, tok = 0;
      function show(i, animate) {
        idx = LLD.clamp(i, -1, items.length - 1);
        const my = ++tok;
        els.forEach((e, j) => { e.g.classList.toggle('shown', j <= idx); e.g.classList.toggle('cur', j === idx); });
        fig.classList.toggle('seq-started', idx >= 0);
        if (idx < 0) { stepEl.textContent = `▶ Press Play to animate the ${items.length} steps`; detEl.innerHTML = ''; return; }
        const it = items[idx];
        stepEl.textContent = `${idx + 1}/${items.length} · ${it.note ? '' : actors[it.a] + (it.a === it.b ? '' : ' → ' + actors[it.b]) + ': '}${it.label}`;
        detEl.innerHTML = it.detail;
        const p = els[idx].path;
        svg.querySelectorAll('.packet').forEach((x) => x.remove());
        if (animate && p && my === tok) LLD.packetAlong(svg, p, { dur: 520, r: 5, color: it.kind === 'fail' || it.kind === 'bad' ? 'var(--red)' : 'var(--accent)' });
      }
      async function play() {
        if (playing) { playing = false; playBtn.textContent = '▶ Play'; return; }
        playing = true; playBtn.textContent = '⏸ Pause';
        if (idx >= items.length - 1) show(-1);
        while (playing && idx < items.length - 1) { show(idx + 1, true); await LLD.sleep(+fig.dataset.delay || 1500); }
        playing = false; playBtn.textContent = '↻ Replay';
      }
      bar.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
        if (a !== 'play' && playing) { playing = false; playBtn.textContent = '▶ Play'; }
        if (a === 'play') play();
        if (a === 'next') show(idx + 1, true);
        if (a === 'prev') show(idx - 1);
        if (a === 'all') { show(items.length - 1); playBtn.textContent = '↻ Replay'; }
      });
      els.forEach((e, j) => e.g.addEventListener('click', () => { playing = false; playBtn.textContent = '▶ Play'; show(j, true); }));
      show(-1);
      let auto = false;
      LLD.whenVisible(fig, () => { if (!auto && !matchMedia('(prefers-reduced-motion: reduce)').matches) { auto = true; play(); } });
    });
  }

  function initFlow(root = document) {
    LLD.$$('figure.flow', root).forEach((fig) => {
      if (fig._init) return; fig._init = true;
      const lis = LLD.$$(':scope > ol > li', fig);
      lis.forEach((li, i) => {
        li.classList.add('k-' + (li.dataset.k || 'step'));
        li.insertAdjacentHTML('afterbegin', `<i class="fl-n">${i + 1}</i>`);
      });
      fig.classList.toggle('fl-row', lis.length <= 5);
      let i = -1, timer = null;
      const tick = () => {
        i = (i + 1) % (lis.length + 2);   // two beats of rest after the last step
        lis.forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); });
      };
      lis.forEach((li, j) => li.addEventListener('mouseenter', () => { clearInterval(timer); timer = null; i = j - 1; tick(); }));
      fig.addEventListener('mouseleave', () => { if (!timer && fig._vis) timer = setInterval(tick, 1100); });
      LLD.whenVisible(fig, () => {
        fig._vis = true;
        if (!timer && !matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(tick, 1100);
      }, () => { fig._vis = false; clearInterval(timer); timer = null; });
    });
  }
  /* <<< shared visuals */

  LLD.initComponents = function (root) { initTabs(root); initSeg(root); initFlips(root); initSteppers(root); initSeq(root); initFlow(root); };

  /* ---------------- command palette (Ctrl+K) ---------------- */
  function initPalette() {
    let box, input, list, results = [], sel = 0, loading = false;

    function build() {
      box = document.createElement('div');
      box.className = 'palette';
      box.innerHTML = `<div class="pal-inner" role="dialog" aria-label="Search the course">
          <div class="pal-top"><span>🔎</span><input id="pal-input" placeholder="Search 46 chapters — principles, patterns, case studies…" autocomplete="off" spellcheck="false"><kbd class="kbd">Esc</kbd></div>
          <div class="pal-list" id="pal-list"></div>
          <div class="pal-foot"><span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> navigate · <kbd class="kbd">↵</kbd> open</span><span>tip: try “Strategy”, “LRU”, “Liskov”, “thread-safe”</span></div>
        </div>`;
      document.body.appendChild(box);
      input = box.querySelector('#pal-input');
      list = box.querySelector('#pal-list');
      box.addEventListener('click', (e) => { if (e.target === box) close(); });
      input.addEventListener('input', () => { sel = 0; render(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { close(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); render(true); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); render(true); }
        else if (e.key === 'Enter') { e.preventDefault(); go(results[sel]); }
      });
    }

    function search(q) {
      const idx = window.LLD_INDEX || [];
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length) {
        return CHAPTERS.map((c) => ({ n: c.n, f: c.file, ti: c.title, lv: c.level, t: c.blurb, a: '', k: 'chapter', s: 0 })).slice(0, 12);
      }
      const out = [];
      idx.forEach((c) => {
        const push = (t, a, k, base) => {
          const hay = (t + ' ' + c.ti).toLowerCase();
          let score = 0;
          for (const term of terms) {
            const at = hay.indexOf(term);
            if (at < 0) return;                       // every term must appear
            score += at === 0 ? 12 : hay[at - 1] === ' ' ? 8 : 3;
          }
          if (t.toLowerCase().startsWith(terms[0])) score += 10;
          out.push({ n: c.n, f: c.f, ti: c.ti, lv: c.lv, t, a, k, s: score + base - t.length * 0.01 });
        };
        push(c.ti, '', 'chapter', 22);
        c.e.forEach((e) => push(e.t, e.a, e.k, e.k === 'section' ? 16 : e.k === 'demo' ? 12 : e.k === 'topic' ? 8 : 1));
      });
      const seen = new Set();
      return out.sort((a, b) => b.s - a.s).filter((r) => {
        const key = r.n + '|' + r.t;
        if (seen.has(key)) return false;
        seen.add(key); return true;
      }).slice(0, 30);
    }

    const ICON = { chapter: '📘', section: '§', demo: '🕹️', topic: '•', fact: '💡' };
    function render(keepQuery) {
      if (loading) { list.innerHTML = '<div class="pal-empty">Loading index…</div>'; return; }
      results = search(input.value.trim());
      if (!results.length) { list.innerHTML = '<div class="pal-empty">No matches. Try a broader word.</div>'; return; }
      list.innerHTML = results.map((r, i) => `<a class="pal-item ${i === sel ? 'sel' : ''}" href="${r.f}${r.a ? '#' + r.a : ''}" data-i="${i}">
          <span class="pal-ico">${ICON[r.k] || '•'}</span>
          <span class="pal-text"><b>${esc(r.t)}</b><small>${chName(r.n)} · ${esc(r.ti)}</small></span>
          <span class="pal-lv">${r.lv}</span></a>`).join('');
      LLD.$$('.pal-item', list).forEach((el) => {
        el.addEventListener('mouseenter', () => { sel = +el.dataset.i; LLD.$$('.pal-item', list).forEach((x) => x.classList.toggle('sel', x === el)); });
      });
      const cur = list.querySelector('.sel');
      if (cur && keepQuery) cur.scrollIntoView({ block: 'nearest' });
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    function go(r) { if (r) { close(); LLD.go(r.f, r.a); } }

    function open() {
      if (!box) build();
      box.classList.add('show');
      input.value = ''; sel = 0;
      if (!window.LLD_INDEX) {
        loading = true; render();
        const s = document.createElement('script');
        s.src = 'assets/study-data.js';
        s.onload = () => { loading = false; render(); };
        s.onerror = () => { loading = false; list.innerHTML = '<div class="pal-empty">Could not load the search index.</div>'; };
        document.head.appendChild(s);
      } else render();
      setTimeout(() => input.focus(), 30);
    }
    function close() { if (box) box.classList.remove('show'); }

    addEventListener('keydown', (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
      if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); box && box.classList.contains('show') ? close() : open(); }
      else if (e.key === '/' && !typing && !(box && box.classList.contains('show'))) { e.preventDefault(); open(); }
      else if (e.key === 'Escape') close();
    });
    LLD.$$('.search-btn').forEach((b) => (b.onclick = open));
    LLD.openSearch = open;
  }

  /* ---------------- boot ---------------- */
  const { chap, main } = buildShell();
  if (main) {
    buildToc(chap, main);
    buildFooter(chap, main);
    const credit = document.createElement('p');
    credit.className = 'muted small';
    credit.style.cssText = 'text-align:center;margin:44px 0 0';
    credit.innerHTML = `◆ <a href="index.html">${AUTHOR}'s Low-Level Design Playlist</a> · © 2026 ${AUTHOR}`;
    main.appendChild(credit);
  }
  LLD.chapter = chap;
  LLD.initComponents(document);
  initQuizzes(chap);
  initReveal();
  initPalette();
})();

/* Optional accounts & progress sync (../assets/account.js). Only over http(s): the offline
   single-file edition runs from file:// and simply skips it. Dormant until configured. */
(function () {
  if (!/^https?:$/.test(location.protocol) || window.__atlasAccount) return;
  var s = document.createElement("script");
  s.type = "module"; s.src = "../assets/account.js";
  s.onerror = function () {};
  document.head.appendChild(s);
})();

};</script>
<script>/* =========================================================
   Single-file router (injected by build.js — not used by the
   multi-file site). Swaps whole pages in and out of <body> and
   re-runs the shared runtime, so every page boots exactly as it
   does when served as its own .html file.

   Routes look like  #/07-databases.html  or  #/07-databases.html@s3-indexes
   ========================================================= */
(function () {
  'use strict';

  var PAGES = window.LLD_PAGES || {};
  var HOME = 'index.html';

  /* ---- raw platform APIs, captured before we patch anything ---- */
  var rawWinOn = window.addEventListener.bind(window);
  var rawDocOn = document.addEventListener.bind(document);
  var rawTimeout = window.setTimeout.bind(window);
  var _setTimeout = window.setTimeout;
  var _setInterval = window.setInterval;
  var _clearInterval = window.clearInterval;
  var _raf = window.requestAnimationFrame;

  /* ---- per-page lifetime --------------------------------------
     Pages register scroll/keydown listeners, intervals and rAF
     loops against a DOM we are about to throw away. Everything a
     page starts is tied to a generation; bumping the generation on
     navigation neutralises all of it in one go. ---------------- */
  var gen = 0;
  var ctrl = new AbortController();

  function scopeListeners(target, raw) {
    target.addEventListener = function (type, fn, opts) {
      var o;
      if (opts === true || opts === false) o = { capture: opts };
      else if (opts && typeof opts === 'object') o = Object.assign({}, opts);
      else o = {};
      if (!o.signal) o.signal = ctrl.signal;
      return raw(type, fn, o);
    };
  }
  scopeListeners(window, rawWinOn);
  scopeListeners(document, rawDocOn);

  window.setTimeout = function (cb, ms) {
    var g = gen, a = [].slice.call(arguments, 2);
    if (typeof cb !== 'function') return _setTimeout.apply(window, arguments);
    return _setTimeout(function () { if (g === gen) cb.apply(null, a); }, ms);
  };
  window.setInterval = function (cb, ms) {
    var g = gen, a = [].slice.call(arguments, 2), id;
    if (typeof cb !== 'function') return _setInterval.apply(window, arguments);
    id = _setInterval(function () {
      if (g !== gen) { _clearInterval(id); return; }   // page is gone: stop the sim
      cb.apply(null, a);
    }, ms);
    return id;
  };
  window.requestAnimationFrame = function (cb) {
    var g = gen;
    return _raf(function (t) { if (g === gen) cb(t); });
  };

  /* ---- routing ------------------------------------------------ */
  function parse(hash) {
    var m = /^#\/([^@]+)(?:@(.*))?$/.exec(hash || '');
    var file = m ? decodeURIComponent(m[1]) : HOME;
    if (!PAGES[file]) file = HOME;
    return { file: file, anchor: m && m[2] ? decodeURIComponent(m[2]) : '' };
  }

  function href(file, anchor) {
    return '#/' + encodeURIComponent(file) + (anchor ? '@' + encodeURIComponent(anchor) : '');
  }

  var suppress = null;   // a hash we wrote ourselves and must not re-render for

  function go(file, anchor) {
    var h = href(file, anchor);
    if (location.hash === h) { render(); return; }
    location.hash = h;   // pushes history, fires hashchange -> render()
  }

  function render() {
    var r = parse(location.hash);
    var page = PAGES[r.file];
    if (!page) return;

    // 1. tear the old page down
    gen++;
    ctrl.abort();
    ctrl = new AbortController();

    // 2. install the new one
    window.LLD_ROUTE = r.file;
    document.title = page.title;
    document.getElementById('lld-page-style').textContent = page.styles || '';

    var body = document.body;
    body.removeAttribute('data-chapter');
    if (page.chapter) body.setAttribute('data-chapter', page.chapter);
    body.innerHTML = page.html;

    // 3. boot the shared runtime, then the page's own script(s)
    try {
      window.__LLD_BOOT();
    } catch (e) {
      console.error('[lld] runtime failed on ' + r.file, e);
    }
    if (window.LLD) window.LLD.go = go;

    for (var i = 0; i < page.scripts.length; i++) {
      try {
        new Function(page.scripts[i])();
      } catch (e) {
        console.error('[lld] page script ' + (i + 1) + ' failed on ' + r.file, e);
      }
    }

    // 4. position: honour a deep link, otherwise start at the top
    if (r.anchor) {
      rawTimeout(function () {
        var el = document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ block: 'start' });
        else window.scrollTo(0, 0);
      }, 0);
    } else {
      window.scrollTo(0, 0);
    }
  }

  /* ---- intercept navigation ----------------------------------- */
  rawDocOn('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.target === '_blank') return;

    var h = a.getAttribute('href');
    if (!h || /^[a-z]+:/i.test(h) || h.indexOf('#/') === 0) return;   // external, mailto:, already a route

    if (h.charAt(0) === '#') {                                        // in-page anchor (table of contents)
      var id = decodeURIComponent(h.slice(1));
      var el = document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      suppress = href(parse(location.hash).file, id);
      history.replaceState(null, '', suppress);
      return;
    }

    var m = /^([^?#]+\.html)(?:#(.*))?$/.exec(h);                     // page link
    if (m && PAGES[m[1]]) {
      e.preventDefault();
      go(m[1], m[2] || '');
    }
  }, true);

  rawWinOn('hashchange', function () {
    if (location.hash === suppress) { suppress = null; return; }
    suppress = null;
    render();
  });

  /* ---- start -------------------------------------------------- */
  if (!location.hash) history.replaceState(null, '', href(HOME));
  // render() rewrites <body>, so it must not run while the parser is still
  // filling it — but it should run the moment parsing is done, not a frame later.
  if (document.readyState === 'loading') rawDocOn('DOMContentLoaded', render);
  else render();
})();
</script>
