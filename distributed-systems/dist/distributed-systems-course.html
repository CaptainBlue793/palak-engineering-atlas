 Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\n    \u003C/div>\n  \u003C/div>\n\n  <h2>What this chapter will cover\u003C/h2>\n  <ol>\n    <li>Master and chunkservers\u003C/li>\n    <li>Chunks and replicas\u003C/li>\n    <li>Record append\u003C/li>\n    <li>The single-master bottleneck\u003C/li>\n  \u003C/ol>\n\n\u003C/main>\n\n","scripts":[]},"47-case-mapreduce-spark.html":{"title":"Case Study: MapReduce to Spark","chapter":"47","styles":"","html":"\n\u003C!-- dist:placeholder -->\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 47\u003C/span><span class=\"pill\" style=\"background:var(--pink-soft);color:var(--pink);border-color:transparent\">Case Study\u003C/span><span class=\"pill\">⏱ 45 min\u003C/span>\u003C/div>\n    <h1>Case Study: <span class=\"grad\">MapReduce to Spark\u003C/span>\u003C/h1>\n    <p class=\"lead\">Batch processing at scale: map, shuffle, reduce, and Spark's in-memory lineage.\u003C/p>\n  \u003C/section>\n\n  <div class=\"callout warn\">\n    <div class=\"ico\">🚧\u003C/div>\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\n    \u003C/div>\n  \u003C/div>\n\n  <h2>What this chapter will cover\u003C/h2>\n  <ol>\n    <li>MapReduce\u003C/li>\n    <li>The shuffle\u003C/li>\n    <li>Stragglers\u003C/li>\n    <li>Spark RDDs and lineage\u003C/li>\n    <li>From batch to streaming\u003C/li>\n  \u003C/ol>\n\n\u003C/main>\n\n","scripts":[]},"48-case-jepsen-split-brain.html":{"title":"Case Study: A Jepsen Split-Brain Report","chapter":"48","styles":"","html":"\n\u003C!-- dist:placeholder -->\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 48\u003C/span><span class=\"pill\" style=\"background:var(--pink-soft);color:var(--pink);border-color:transparent\">Case Study\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Case Study: <span class=\"grad\">A Jepsen Split-Brain Report\u003C/span>\u003C/h1>\n    <p class=\"lead\">How a partition exposed lost writes in a real database, and what the fix looked like.\u003C/p>\n  \u003C/section>\n\n  <div class=\"callout warn\">\n    <div class=\"ico\">🚧\u003C/div>\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\n    \u003C/div>\n  \u003C/div>\n\n  <h2>What this chapter will cover\u003C/h2>\n  <ol>\n    <li>The test\u003C/li>\n    <li>The partition\u003C/li>\n    <li>The anomaly\u003C/li>\n    <li>Root cause\u003C/li>\n    <li>The fix\u003C/li>\n  \u003C/ol>\n\n\u003C/main>\n\n","scripts":[]},"flashcards.html":{"title":"Flashcards","chapter":"","styles":"\r\n  .card-stage { max-width: 720px; margin: 0 auto; }\r\n  .fc { border:1px solid var(--border); border-radius:20px; background:var(--surface); box-shadow:var(--shadow-lg); padding:26px; min-height:300px; display:flex; flex-direction:column; gap:16px; animation:fadeUp .25s; }\r\n  .fc .meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-family:var(--mono); }\r\n  .fc .q { font-size:20px; font-weight:700; line-height:1.45; letter-spacing:-.01em; }\r\n  .fc .opts { display:grid; gap:8px; }\r\n  .fc .opt { text-align:left; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14.5px; cursor:pointer; transition:.18s; }\r\n  .fc .opt:hover:not(:disabled) { border-color:var(--accent); }\r\n  .fc .opt.correct { border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700; }\r\n  .fc .opt.wrong { border-color:var(--red); background:var(--red-soft); color:var(--red); }\r\n  .fc .why { font-size:14px; color:var(--text-2); background:var(--surface-2); border-radius:12px; padding:12px 14px; line-height:1.6; animation:fadeUp .25s; }\r\n  .rate { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px; }\r\n  .rate button { padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:700; font-size:13px; color:var(--text); }\r\n  .rate button small { display:block; font-weight:500; font-size:11px; color:var(--muted); margin-top:2px; }\r\n  .rate button:hover { transform:translateY(-2px); }\r\n  .rate .again { border-color:var(--red); color:var(--red); }\r\n  .rate .hard { border-color:var(--amber); color:var(--amber); }\r\n  .rate .good { border-color:var(--accent-2); color:var(--accent-2); }\r\n  .rate .easy { border-color:var(--green); color:var(--green); }\r\n  .deck-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:16px; }\r\n  .empty { text-align:center; padding:60px 20px; }\r\n  .empty .big { font-size:54px; }\r\n  .heat { display:grid; grid-template-columns:repeat(auto-fill,minmax(22px,1fr)); gap:3px; margin-top:10px; }\r\n  .heat i { aspect-ratio:1; border-radius:4px; background:var(--surface-3); display:grid; place-items:center; font-size:9px; font-family:var(--mono); color:var(--muted); font-style:normal; }\r\n  .heat i.l1 { background:var(--red-soft); color:var(--red); }\r\n  .heat i.l2 { background:var(--amber-soft); color:var(--amber); }\r\n  .heat i.l3 { background:var(--accent-2-soft); color:var(--accent-2); }\r\n  .heat i.l4 { background:var(--accent-soft); color:var(--accent); }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">🃏 Spaced repetition\u003C/span>\u003C/div>\r\n    <h1>Flashcards\u003C/h1>\r\n    <p class=\"lead\">Every quiz question in the course, turned into a deck that schedules itself. Cards you get right come back later; cards you miss come back soon. Five minutes a day beats an hour once.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"stats\" id=\"fcStats\">\u003C/div>\r\n\r\n  <div class=\"deck-bar\" style=\"margin-top:20px\">\r\n    <div class=\"seg\" id=\"fcScope\"><button data-v=\"due\" class=\"active\">⏰ Due today\u003C/button><button data-v=\"new\">✨ New cards\u003C/button><button data-v=\"all\">📚 Everything\u003C/button><button data-v=\"weak\">🎯 Weakest first\u003C/button>\u003C/div>\r\n    <select class=\"inp\" id=\"fcLevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n    <button class=\"btn sm\" id=\"fcShuffle\">🔀 Shuffle\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"card-stage\" id=\"stage\">\u003C/div>\r\n\r\n  <h2 style=\"margin-top:60px\">Your deck\u003C/h2>\r\n  <p class=\"small muted\">One square per card, coloured by how well you know it. Hover to see the chapter.\u003C/p>\r\n  <div class=\"heat\" id=\"heat\">\u003C/div>\r\n  <div class=\"legend\" style=\"margin-top:10px\"><span><i style=\"background:var(--surface-3)\">\u003C/i>unseen\u003C/span><span><i style=\"background:var(--red-soft)\">\u003C/i>learning\u003C/span><span><i style=\"background:var(--amber-soft)\">\u003C/i>shaky\u003C/span><span><i style=\"background:var(--accent-2-soft)\">\u003C/i>familiar\u003C/span><span><i style=\"background:var(--accent-soft)\">\u003C/i>known\u003C/span>\u003C/div>\r\n  <div class=\"controls\" style=\"justify-content:center;margin-top:20px\">\r\n    <button class=\"btn sm ghost\" id=\"fcReset\">Reset all flashcard progress\u003C/button>\r\n  \u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🧠\u003C/div><div class=\"body\"><div class=\"title\">How the scheduling works\u003C/div><p>A simplified SM-2: each card has an <b>ease\u003C/b> and an <b>interval\u003C/b>. “Again” resets it to today, “Hard” nudges the interval up slightly, “Good” multiplies it by the ease, and “Easy” multiplies it more and raises the ease. Intervals grow 1 → 3 → 7 → 16 → 35 days, so a card you know well disappears for a month. Progress is stored in this browser only.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, LS, chNum, chName } = DIST;\r\n  const CARDS = (window.DIST_CARDS || []).map((c, i) => ({ ...c, id: i }));\r\n  const DAY = 86400000;\r\n  let state = LS.get('dist-cards', {});          // id -> {due, iv, ease, reps, lapses}\r\n  let queue = [], cur = null, answered = false, chosen = -1;\r\n\r\n  const today = () => Math.floor(Date.now() / DAY);\r\n  const st = (id) => state[id] || { due: 0, iv: 0, ease: 2.5, reps: 0, lapses: 0 };\r\n  const isNew = (id) => !state[id];\r\n  const isDue = (id) => !isNew(id) && st(id).due <= today();\r\n\r\n  // level filter\r\n  const levels = [...new Set(CARDS.map(c => c.lv))];\r\n  $('#fcLevel').innerHTML = '<option value=\"\">All levels\u003C/option>' + levels.map(l => `<option>${l}\u003C/option>`).join('');\r\n\r\n  function build() {\r\n    const scope = $('#fcScope').dataset.value, lv = $('#fcLevel').value;\r\n    let pool = CARDS.filter(c => !lv || c.lv === lv);\r\n    if (scope === 'due') pool = pool.filter(c => isDue(c.id));\r\n    else if (scope === 'new') pool = pool.filter(c => isNew(c.id));\r\n    else if (scope === 'weak') pool = pool.slice().sort((a, b) => (st(a.id).ease + st(a.id).reps * 0.2) - (st(b.id).ease + st(b.id).reps * 0.2));\r\n    if (scope === 'due' && !pool.length) pool = CARDS.filter(c => (!lv || c.lv === lv) && isNew(c.id)).slice(0, 20);\r\n    if (scope !== 'weak') pool = pool.sort(() => Math.random() - .5);\r\n    queue = pool;\r\n    next();\r\n    stats();\r\n  }\r\n  function next() {\r\n    cur = queue.shift() || null;\r\n    answered = false; chosen = -1;\r\n    render();\r\n  }\r\n  function render() {\r\n    const stage = $('#stage');\r\n    if (!CARDS.length) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🃏\u003C/div><h3>No cards yet\u003C/h3><p class=\"muted small\">The deck is built from each chapter’s quiz. Cards appear here as chapters are written.\u003C/p>\u003C/div>`;\r\n      return;\r\n    }\r\n    if (!cur) {\r\n      stage.innerHTML = `<div class=\"fc empty\"><div class=\"big\">🎉\u003C/div><h3>Nothing left in this pile\u003C/h3><p class=\"muted small\">Come back tomorrow for the next batch, or switch to “New cards” / “Everything” above.\u003C/p><div class=\"controls\" style=\"justify-content:center\"><button class=\"btn primary\" id=\"againBtn\">Study everything\u003C/button>\u003C/div>\u003C/div>`;\r\n      const b = $('#againBtn'); if (b) b.onclick = () => { $$('#fcScope button').forEach(x => x.classList.toggle('active', x.dataset.v === 'all')); $('#fcScope').dataset.value = 'all'; build(); };\r\n      return;\r\n    }\r\n    const s = st(cur.id);\r\n    const badge = isNew(cur.id) ? '✨ new' : `seen ${s.reps}× · next in ${Math.max(0, s.due - today())}d`;\r\n    stage.innerHTML = `<div class=\"fc\">\r\n      <div class=\"meta\"><span>${chName(cur.n)} · ${cur.ti}\u003C/span><span>${badge}\u003C/span>\u003C/div>\r\n      <div class=\"q\">${cur.q}\u003C/div>\r\n      <div class=\"opts\">${cur.o.map((o, i) => `<button class=\"opt\" data-i=\"${i}\">${o}\u003C/button>`).join('')}\u003C/div>\r\n      <div id=\"post\">\u003C/div>\r\n    \u003C/div>`;\r\n    $$('#stage .opt').forEach(b => b.onclick = () => answer(+b.dataset.i));\r\n  }\r\n  function answer(i) {\r\n    if (answered) return;\r\n    answered = true; chosen = i;\r\n    $$('#stage .opt').forEach((b, j) => {\r\n      b.disabled = true;\r\n      if (j === cur.a) b.classList.add('correct');\r\n      else if (j === i) b.classList.add('wrong');\r\n    });\r\n    $('#post').innerHTML = `<div class=\"why\">${i === cur.a ? '✅ ' : '❌ '}${cur.w}<br><a class=\"small\" href=\"${cur.f}\">Revisit ${chName(cur.n)} →\u003C/a>\u003C/div>\r\n      <div class=\"rate\">\r\n        <button class=\"again\" data-r=\"0\">Again<small>&lt; 10 min\u003C/small>\u003C/button>\r\n        <button class=\"hard\" data-r=\"1\">Hard<small id=\"r1\">\u003C/small>\u003C/button>\r\n        <button class=\"good\" data-r=\"2\">Good<small id=\"r2\">\u003C/small>\u003C/button>\r\n        <button class=\"easy\" data-r=\"3\">Easy<small id=\"r3\">\u003C/small>\u003C/button>\r\n      \u003C/div>`;\r\n    const s = st(cur.id);\r\n    const iv = (mult, min) => Math.max(min, Math.round((s.iv || 1) * mult));\r\n    $('#r1').textContent = iv(1.2, 1) + 'd'; $('#r2').textContent = iv(s.ease, 1) + 'd'; $('#r3').textContent = iv(s.ease * 1.4, 4) + 'd';\r\n    $$('#stage .rate button').forEach(b => b.onclick = () => grade(+b.dataset.r));\r\n    if (i !== cur.a) DIST.toast('Marked for another look soon');\r\n  }\r\n  function grade(r) {\r\n    const s = { ...st(cur.id) };\r\n    s.reps = (s.reps || 0) + 1;\r\n    if (r === 0 || chosen !== cur.a) { s.lapses = (s.lapses || 0) + 1; s.iv = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.due = today(); }\r\n    else if (r === 1) { s.iv = Math.max(1, Math.round((s.iv || 1) * 1.2)); s.ease = Math.max(1.3, s.ease - 0.05); s.due = today() + s.iv; }\r\n    else if (r === 2) { s.iv = Math.max(1, Math.round((s.iv || 1) * s.ease)); s.due = today() + s.iv; }\r\n    else { s.iv = Math.max(4, Math.round((s.iv || 1) * s.ease * 1.4)); s.ease = Math.min(3.2, s.ease + 0.1); s.due = today() + s.iv; }\r\n    state[cur.id] = s;\r\n    LS.set('dist-cards', state);\r\n    if (r === 0 || chosen !== cur.a) queue.push(cur);      // see it again this session\r\n    next();\r\n  }\r\n  function stats() {\r\n    const due = CARDS.filter(c => isDue(c.id)).length;\r\n    const fresh = CARDS.filter(c => isNew(c.id)).length;\r\n    const known = CARDS.filter(c => st(c.id).iv >= 7).length;\r\n    const reps = Object.values(state).reduce((a, s) => a + (s.reps || 0), 0);\r\n    $('#fcStats').innerHTML = `\r\n      <div class=\"stat acc\"><div class=\"k\">Due now\u003C/div><div class=\"v\">${due}\u003C/div>\u003C/div>\r\n      <div class=\"stat\"><div class=\"k\">Not started\u003C/div><div class=\"v\">${fresh}\u003C/div>\u003C/div>\r\n      <div class=\"stat good\"><div class=\"k\">Known (7d+ interval)\u003C/div><div class=\"v\">${known} <small>/ ${CARDS.length}\u003C/small>\u003C/div>\u003C/div>\r\n      <div class=\"stat warn\"><div class=\"k\">Total reviews\u003C/div><div class=\"v\">${reps}\u003C/div>\u003C/div>`;\r\n    $('#heat').innerHTML = CARDS.map(c => {\r\n      const s = st(c.id);\r\n      const lvl = isNew(c.id) ? 0 : s.iv >= 16 ? 4 : s.iv >= 7 ? 3 : s.iv >= 3 ? 2 : 1;\r\n      return `<i class=\"${lvl ? 'l' + lvl : ''}\" title=\"${chName(c.n)}: ${c.ti}${isNew(c.id) ? ' — not started' : ' — interval ' + s.iv + 'd'}\">${chNum(c.n)}\u003C/i>`;\r\n    }).join('');\r\n  }\r\n  $('#fcScope').addEventListener('segchange', build);\r\n  $('#fcLevel').addEventListener('change', build);\r\n  $('#fcShuffle').onclick = () => { queue.sort(() => Math.random() - .5); next(); };\r\n  $('#fcReset').onclick = () => { if (confirm('Reset all flashcard scheduling? Chapter progress is not affected.')) { state = {}; LS.set('dist-cards', state); build(); } };\r\n  addEventListener('keydown', e => {\r\n    if (!cur) return;\r\n    if (!answered && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < cur.o.length) answer(i); }\r\n    else if (answered && /^[1-4]$/.test(e.key)) grade(+e.key - 1);\r\n    else if (e.key === ' ' && answered) { e.preventDefault(); grade(2); }\r\n  });\r\n  build();\r\n})();\r\n"]},"glossary.html":{"title":"Glossary","chapter":"","styles":"\r\n  .alpha { display:flex; flex-wrap:wrap; gap:4px; margin:14px 0; }\r\n  .alpha button { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-2); font-weight:700; font-size:13px; cursor:pointer; }\r\n  .alpha button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }\r\n  .alpha button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\r\n  .alpha button:disabled { opacity:.25; cursor:default; }\r\n  .gl-group { margin-top:26px; }\r\n  .gl-letter { font-family:var(--mono); font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.1em; border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:10px; }\r\n  .gl { display:grid; gap:8px; }\r\n  .gt { display:grid; grid-template-columns:250px 1fr auto; gap:14px; align-items:baseline; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--border); animation:fadeUp .2s; }\r\n  @media (max-width:760px){ .gt { grid-template-columns:1fr; gap:4px; } }\r\n  .gt b { font-size:14.5px; }\r\n  .gt .def { color:var(--text-2); font-size:14px; line-height:1.55; }\r\n  .gt .ch { font-size:11.5px; font-family:var(--mono); white-space:nowrap; }\r\n  .gt mark { background:var(--amber-soft); color:var(--text); border-radius:3px; padding:0 2px; }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">📖 <span id=\"count\">\u003C/span> terms\u003C/span>\u003C/div>\r\n    <h1>Glossary\u003C/h1>\r\n    <p class=\"lead\">Every term this course uses, in one sentence each, linked to the chapter that explains it properly. Useful the night before an interview — and for the moment someone says “that breaks Liskov” and you would rather not nod along.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"controls\" style=\"margin-top:8px\">\r\n    <input class=\"inp\" id=\"gq\" placeholder=\"Filter terms… (e.g. cohesion, decorator, invariant)\" style=\"flex:1;min-width:220px\" autocomplete=\"off\">\r\n    <select class=\"inp\" id=\"glevel\" aria-label=\"Filter by level\"><option value=\"\">All levels\u003C/option>\u003C/select>\r\n  \u003C/div>\r\n  <div class=\"alpha\" id=\"alpha\">\u003C/div>\r\n  <div id=\"glist\">\u003C/div>\r\n\r\n  <div class=\"callout tip\" style=\"margin-top:40px\"><div class=\"ico\">🔎\u003C/div><div class=\"body\"><div class=\"title\">Looking for something specific?\u003C/div><p>Press <kbd class=\"kbd\">Ctrl\u003C/kbd>+<kbd class=\"kbd\">K\u003C/kbd> anywhere in the course to search every chapter, section and visualizer by name.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, CHAPTERS, chNum } = DIST;\r\n  // [term, one-line definition, chapter number]\r\n  const T = [\r\n    ['Abstract class', 'A class that cannot be instantiated and may mix implemented methods with abstract ones; use it when subclasses share state or code, an interface when they only share a role.', 0.4],\r\n    ['Abstract Factory', 'An object that creates a whole family of related objects (a driver’s Connection, Statement and ResultSet) so they always match.', 10],\r\n    ['Adapter', 'A wrapper that makes an existing class fit the interface a client expects, e.g. two payment SDKs behind one PaymentGateway.', 12],\r\n    ['Aggregate', 'A cluster of domain objects changed together through one root entity, which is the only thing outside code may hold a reference to.', 27],\r\n    ['Aggregation', 'A has-a relationship where the part can outlive the whole: a Team has Players, but deleting the team does not delete them.', 6],\r\n    ['Anemic domain model', 'Classes that hold only data with getters and setters, while all behaviour lives in “service” classes — procedural code dressed as objects.', 21],\r\n    ['Association', 'Any structural link between two classes where one holds a reference to the other.', 6],\r\n    ['Backpressure', 'Slowing or blocking producers when a bounded queue is full, so a fast producer cannot exhaust memory.', 23],\r\n    ['BlockingQueue', 'A java.util.concurrent queue whose put blocks when full and take blocks when empty — the backbone of producer-consumer designs.', 23],\r\n    ['Bridge', 'Splitting an abstraction from its implementation so the two can vary independently, avoiding a subclass for every combination.', 12],\r\n    ['Builder', 'An object that assembles a complex, often immutable object step by step and validates it once in build().', 11],\r\n    ['Chain of Responsibility', 'A pipeline of handlers where each either handles a request or passes it to the next, like servlet filters or HTTP middleware.', 19],\r\n    ['Circuit breaker', 'A state machine (closed, open, half-open) that stops calling a failing dependency until it looks healthy again.', 25],\r\n    ['Class invariant', 'A condition that must hold for every object of a class between public method calls, such as balance ≥ 0.', 0.2],\r\n    ['Cohesion', 'How closely the members of a class belong together; high cohesion means every method uses most of the fields.', 5],\r\n    ['Command', 'A request packaged as an object, so it can be queued, logged, retried or undone.', 17],\r\n    ['Command-query separation', 'A method either changes state (a command) or returns information (a query), never both.', 7],\r\n    ['Composite', 'A tree where a single item and a group share one interface, so a Directory and a File can both be asked for size().', 14],\r\n    ['Composition', 'A has-a relationship where the whole owns the part’s lifecycle: a House’s Rooms are destroyed with it.', 6],\r\n    ['Composition root', 'The single place near main() where the whole object graph is constructed and wired together.', 8],\r\n    ['Constructor injection', 'Passing a class’s collaborators into its constructor rather than creating them inside, so they can be swapped and tested.', 8],\r\n    ['Coupling', 'How much one class depends on the details of another; lower coupling means a change stays local.', 5],\r\n    ['Decorator', 'A wrapper with the same interface as the object it wraps that adds behaviour, like BufferedInputStream around a FileInputStream.', 13],\r\n    ['Defensive copy', 'Copying a mutable argument or field on the way in or out, so callers cannot change an object’s state behind its back.', 0.2],\r\n    ['Dependency inversion', 'High-level policy and low-level detail both depend on an abstraction, rather than policy depending on detail.', 4],\r\n    ['Domain event', 'An object that records something that happened in the domain (OrderPlaced), published so other parts can react.', 27],\r\n    ['Double dispatch', 'Choosing a method by the runtime types of two objects; Visitor achieves it with accept() calling back visit(this).', 20],\r\n    ['Dynamic dispatch', 'Choosing which overridden method runs from the object’s runtime class, not the reference’s declared type.', 0.3],\r\n    ['Encapsulation', 'Hiding a class’s state behind methods that keep its invariants true.', 0.2],\r\n    ['Entity', 'A domain object defined by a stable identity rather than its attribute values; two Users with the same name are still different users.', 27],\r\n    ['Facade', 'A simple interface in front of a complicated subsystem.', 12],\r\n    ['Factory Method', 'A method that subclasses or callers use to decide which concrete class to instantiate.', 10],\r\n    ['Fail fast', 'Rejecting invalid input at the boundary with an exception, instead of letting a bad value travel and fail somewhere confusing.', 7],\r\n    ['Flyweight', 'Sharing immutable, intrinsic state across many objects to save memory, e.g. one Glyph object per character code.', 14],\r\n    ['God class', 'A class that knows and does too much, with many unrelated reasons to change.', 3],\r\n    ['Idempotency', 'An operation that has the same effect whether it runs once or many times, which makes retries safe.', 25],\r\n    ['Immutability', 'An object whose state cannot change after construction; immutable objects are thread-safe without locks.', 0.6],\r\n    ['Interface segregation', 'Clients should not be forced to depend on methods they do not use, so split fat interfaces into role interfaces.', 4],\r\n    ['Iterator', 'An object that walks a collection one element at a time without exposing how it is stored.', 20],\r\n    ['Law of Demeter', 'Talk only to your immediate collaborators: a.getB().getC().doIt() is a “train wreck” that couples you to B and C.', 5],\r\n    ['Liskov substitution', 'A subclass must be usable anywhere its parent is, without surprising the caller.', 4],\r\n    ['Mediator', 'An object that coordinates many components so they talk to it instead of to each other.', 16],\r\n    ['Memento', 'A snapshot of an object’s state that can restore it later without exposing its internals.', 17],\r\n    ['Multiplicity', 'The 1, 0..1, * or 1..* on a UML association, saying how many objects can be at each end.', 0.8],\r\n    ['Observer', 'A subject keeps a list of listeners and notifies them when its state changes.', 16],\r\n    ['Open/closed principle', 'Code should be open for extension but closed for modification: add a new class instead of editing a switch.', 3],\r\n    ['Optional', 'A container that may or may not hold a value, used as a return type instead of null.', 0.7],\r\n    ['Overloading', 'Several methods with the same name and different parameter lists, chosen at compile time.', 0.3],\r\n    ['Overriding', 'A subclass redefining an inherited method with the same signature, chosen at runtime.', 0.3],\r\n    ['Prototype', 'Creating new objects by copying an existing, configured instance.', 11],\r\n    ['Proxy', 'A stand-in with the same interface as the real object that controls access to it: caching, lazy loading or permission checks.', 13],\r\n    ['Race condition', 'A bug where the result depends on how threads interleave, e.g. two threads both passing a check-then-act test.', 22],\r\n    ['Record', 'A compact Java class for immutable data that generates the constructor, accessors, equals, hashCode and toString.', 0.6],\r\n    ['Repository', 'A collection-like interface for loading and saving aggregates that hides the database from the domain.', 26],\r\n    ['Sequence diagram', 'A UML diagram of objects as vertical lifelines and the calls between them in time order.', 0.8],\r\n    ['Single responsibility', 'A class should have one reason to change — one actor or concern it answers to.', 3],\r\n    ['Singleton', 'A class with exactly one instance and a global access point; usually better replaced by injecting one shared instance.', 9],\r\n    ['SOLID', 'Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion.', 3],\r\n    ['State', 'A pattern where an object delegates behaviour to a state object and changes behaviour by swapping it.', 18],\r\n    ['Strategy', 'A family of interchangeable algorithms behind one interface, chosen at runtime.', 15],\r\n    ['Template Method', 'A base-class method that fixes an algorithm’s steps and lets subclasses fill in some of them.', 19],\r\n    ['Test double', 'Any stand-in for a real collaborator in a test: a dummy, stub, fake, spy or mock.', 28],\r\n    ['Thread pool', 'A fixed set of worker threads that execute submitted tasks, reusing threads instead of creating one per task.', 23],\r\n    ['Unit of Work', 'An object that tracks every change made during a business operation and commits them in one transaction.', 26],\r\n    ['Value object', 'An immutable object defined only by its values, like Money or an EmailAddress; two with equal values are interchangeable.', 27],\r\n    ['Visitor', 'Adding an operation to a class hierarchy by putting it in a separate visitor class with one method per element type.', 20],\r\n    ['Use case', 'One thing an actor wants to do with the system (“book a seat”), the unit you list first when turning requirements into classes.', 2],\r\n    ['Rubric', 'The fixed set of dimensions an interviewer scores (requirements, entities, abstractions, code, extensibility, communication), each from written evidence.', 1],\r\n    ['Deadlock', 'Two or more threads each holding a lock the other needs, so none can proceed; prevented by acquiring locks in one global order.', 22],\r\n    ['Compare-and-set (CAS)', 'An atomic “if the value is still X, set it to Y” operation; the loser of a race sees false and retries or moves on.', 22],\r\n    ['Volatile', 'A Java field modifier guaranteeing that writes are visible to other threads immediately; gives visibility, not atomicity.', 22],\r\n    ['Little’s law', 'Items in a system = arrival rate × time each one stays; the quickest way to size thread pools, queues and connection pools.', 23],\r\n    ['Feature flag', 'A runtime switch that turns a code path on or off, or for a percentage of users, without a deploy.', 24],\r\n    ['Extension point', 'A deliberate place where new behaviour plugs in behind a published interface (an SPI) without editing existing code.', 24],\r\n    ['Bulkhead', 'A limit on how much capacity one dependency may use (its own pool or semaphore), so one slow dependency can’t exhaust everything.', 25],\r\n    ['Exponential backoff with jitter', 'Retry delays that double each attempt, randomised so that many clients don’t retry in synchronised waves.', 25],\r\n    ['Idempotency key', 'A client-chosen id for one logical operation, sent with every retry, so the server performs it at most once.', 25],\r\n    ['Optimistic locking', 'Detecting conflicting updates with a version column: UPDATE … WHERE version = ? updating zero rows means someone else saved first.', 26],\r\n    ['Transactional outbox', 'Writing events to a table in the same transaction as the state change, then publishing them from there, so events are never lost or phantom.', 27],\r\n    ['Ubiquitous language', 'Using the domain’s own words in the code (SessionFilled, waitlist) so code, experts and conversations match.', 27],\r\n    ['Fake', 'A working, simplified implementation used in tests, such as an in-memory repository; tests check the resulting state.', 28],\r\n    ['Mock', 'A test double programmed with expected calls, which the test verifies; right when the interaction itself is the requirement.', 28],\r\n    ['Characterization test', 'A test that records what existing code does today, right or wrong, so a refactoring that changes behaviour is caught.', 29],\r\n    ['Code smell', 'A surface symptom (long method, feature envy, switch on type) that usually points to a specific design problem and refactoring.', 29],\r\n    ['Feature envy', 'A method that uses another object’s data more than its own; usually fixed by moving it to where the data lives.', 29],\r\n    ['Primitive obsession', 'Using String, int or double for domain concepts (ids, money, status) instead of small validated value types.', 29],\r\n    ['Time-boxing', 'Planning the interview’s 45 minutes by phase and checking in at boundaries, cutting depth rather than whole phases when late.', 30],\r\n    ['LRU cache', 'A cache that evicts the least recently used entry; O(1) with a hash map pointing into a doubly linked list.', 31],\r\n    ['LFU cache', 'A cache that evicts the least frequently used entry, usually with frequency buckets; resists scans but needs aging.', 31],\r\n    ['Token bucket', 'A rate limiter holding up to N tokens refilled at a steady rate; each request spends one, allowing bursts up to N.', 32],\r\n    ['Sliding window log', 'A rate limiter that stores the timestamp of each accepted request and allows a new one if fewer than N fall in the last window.', 32],\r\n    ['Appender', 'The part of a logging framework that writes events to a destination (console, file, network), with its own layout and filters.', 33],\r\n    ['Consumer group', 'A set of consumers sharing a topic’s partitions, one owner per partition, while each group independently receives every message.', 34],\r\n    ['Offset', 'A message’s permanent position in a partition’s log; consumers commit offsets to record how far they have processed.', 34],\r\n    ['At-least-once delivery', 'Processing then committing, so a crash causes redelivery rather than loss; handlers must be idempotent.', 34],\r\n    ['Fixed rate vs fixed delay', 'Recurring schedules anchored to the planned start times (catching up when late) versus to the previous run’s finish (drifting).', 35],\r\n    ['Dead-letter queue', 'Where work goes after exhausting its retries, kept visible for inspection instead of being silently dropped.', 35],\r\n    ['Path resolution', 'Turning a path string into a node by walking it component by component, handling . and .., and checking search permission on each directory.', 36],\r\n    ['Write-ahead log', 'Appending each committed change to a durable log before acknowledging it, so a restart can replay the log and recover.', 37],\r\n    ['Lazy expiry', 'Treating an expired entry as absent at the moment it’s read, so correctness never depends on a background sweep having run.', 37],\r\n    ['Gap buffer', 'A text buffer with an empty gap at the cursor, making typing O(1) and cursor moves proportional to the distance moved.', 38],\r\n    ['Undo coalescing', 'Grouping consecutive keystrokes into one undo step by explicit rules: contiguity, same kind, word boundaries and pauses.', 38],\r\n    ['Connection leak', 'A borrowed pooled connection that is never returned, permanently shrinking the pool until it is exhausted.', 39],\r\n    ['Best fit', 'An allocation strategy that prefers the smallest resource that fits (a compact spot for a car), keeping large ones for large requests.', 40],\r\n    ['LOOK scheduling', 'Serving stops in the current direction and turning around at the last pending stop, as elevators and disk arms do.', 41],\r\n    ['Seat hold', 'A time-limited, all-or-nothing reservation of seats for one customer, released automatically if not confirmed in time.', 42],\r\n    ['Largest remainder method', 'Splitting an amount into integer shares by rounding down, then giving leftover units to the largest fractional parts, so shares sum exactly.', 43],\r\n    ['Debt simplification', 'Turning net balances into settling payments by matching the largest debtor with the largest creditor: at most n − 1 transfers.', 43],\r\n    ['Pseudo-legal move', 'A move allowed by a piece’s own movement rules before checking whether it leaves the mover’s king in check.', 44],\r\n    ['Perft', 'A move-generator test that counts every position reachable in n moves and compares with published values (20, 400, 8,902, …).', 44],\r\n    ['Escrow', 'Holding inserted money separately until a purchase commits, so cancelling returns exactly what was inserted.', 45],\r\n    ['Canonical coin system', 'A set of denominations for which greedy change-making is always optimal with unlimited coins, like US coins; limited stock still needs a search.', 45],\r\n    ['Batched matching', 'Collecting requests over a short window and assigning them together to minimise total cost, instead of greedy first-come matching.', 46],\r\n    ['Surge multiplier', 'A price factor derived from demand and supply in a zone, applied to a fare quote the rider accepts before requesting.', 46],\r\n  ].sort((a, b) => a[0].localeCompare(b[0]));\r\n\r\n  const levels = [...new Set(CHAPTERS.map(c => c.level))];\r\n  $('#glevel').innerHTML = '<option value=\"\">All levels\u003C/option>' + levels.map(l => `<option>${l}\u003C/option>`).join('');\r\n  $('#count').textContent = T.length;\r\n\r\n  let letter = '';\r\n  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\r\n  function hl(text, q) {\r\n    if (!q) return esc(text);\r\n    const i = text.toLowerCase().indexOf(q);\r\n    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '\u003C/mark>' + esc(text.slice(i + q.length));\r\n  }\r\n  const firstChar = t => { const c = t[0].toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };\r\n  function render() {\r\n    const q = $('#gq').value.trim().toLowerCase(), lv = $('#glevel').value;\r\n    const rows = T.filter(([t, d, n]) => {\r\n      const ch = CHAPTERS.find(c => c.n === n);\r\n      if (lv && (!ch || ch.level !== lv)) return false;\r\n      if (letter && firstChar(t) !== letter) return false;\r\n      if (q && !(t.toLowerCase().includes(q) || d.toLowerCase().includes(q))) return false;\r\n      return true;\r\n    });\r\n    const groups = {};\r\n    rows.forEach(r => { const L = firstChar(r[0]); (groups[L] = groups[L] || []).push(r); });\r\n    $('#glist').innerHTML = Object.keys(groups).sort().map(L => `<div class=\"gl-group\"><div class=\"gl-letter\">${L}\u003C/div><div class=\"gl\">` +\r\n      groups[L].map(([t, d, n]) => {\r\n        const ch = CHAPTERS.find(c => c.n === n);\r\n        return `<div class=\"gt\"><b>${hl(t, q)}\u003C/b><span class=\"def\">${hl(d, q)}\u003C/span>${ch ? `<a class=\"ch\" href=\"${ch.file}\">${/^P/.test(chNum(n)) ? chNum(n) : 'Ch ' + n} →\u003C/a>` : ''}\u003C/div>`;\r\n      }).join('') + '\u003C/div>\u003C/div>').join('') || '<p class=\"muted\" style=\"margin-top:20px\">No terms match that filter.\u003C/p>';\r\n    const present = new Set(T.map(t => firstChar(t[0])));\r\n    $('#alpha').innerHTML = `<button class=\"${letter === '' ? 'on' : ''}\" data-l=\"\">All\u003C/button>` +\r\n      `<button class=\"${letter === '#' ? 'on' : ''}\" data-l=\"#\" ${present.has('#') ? '' : 'disabled'}>#\u003C/button>` +\r\n      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L => `<button class=\"${letter === L ? 'on' : ''}\" data-l=\"${L}\" ${present.has(L) ? '' : 'disabled'}>${L}\u003C/button>`).join('');\r\n    $$('#alpha button').forEach(b => b.onclick = () => { letter = b.dataset.l; render(); });\r\n  }\r\n  $('#gq').addEventListener('input', () => { letter = ''; render(); });\r\n  $('#glevel').addEventListener('change', render);\r\n  render();\r\n})();\r\n"]},"mock-interview.html":{"title":"Mock Interview","chapter":"","styles":"\r\n  .prompt-card { border:1px solid var(--border); border-radius:20px; background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface); box-shadow:var(--shadow-lg); padding:24px; }\r\n  .prompt-card h2 { margin:6px 0 10px !important; font-size:30px !important; letter-spacing:-.02em; }\r\n  .prompt-card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }\r\n  .prompt-card .tags span { font-size:11.5px; font-family:var(--mono); padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }\r\n  .clock { font-family:var(--mono); font-size:52px; font-weight:800; letter-spacing:-.03em; line-height:1; }\r\n  .phases { display:flex; gap:4px; height:46px; border-radius:12px; overflow:hidden; margin-top:12px; }\r\n  .phase { display:grid; place-items:center; font-size:11.5px; font-weight:800; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border); border-radius:9px; position:relative; overflow:hidden; text-align:center; line-height:1.15; padding:0 4px; }\r\n  .phase i { position:absolute; left:0; top:0; bottom:0; background:var(--accent-soft); width:0; }\r\n  .phase span { position:relative; }\r\n  .phase.cur { border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent-soft); }\r\n  .phase.done { background:var(--accent-soft); color:var(--accent); border-color:transparent; }\r\n  .rubric { display:grid; gap:8px; }\r\n  .rub { display:grid; grid-template-columns:1fr 150px; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); }\r\n  .rub b { font-size:14px; } .rub small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }\r\n  .scoreset { display:flex; gap:4px; }\r\n  .scoreset button { flex:1; border:1.5px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 0; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text-2); }\r\n  .scoreset button.on { background:var(--accent); border-color:var(--accent); color:#fff; }\r\n  .hist { display:grid; gap:8px; }\r\n  .hist div { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:9px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; }\r\n  .hist .sc { font-family:var(--mono); font-weight:800; }\r\n  textarea.notes { width:100%; min-height:170px; font-size:14px; line-height:1.6; resize:vertical; }\r\n","html":"\r\n<main class=\"content\">\r\n\r\n  <section class=\"hero\">\r\n    <div class=\"eyebrow\"><span class=\"pill accent\">Study tool\u003C/span><span class=\"pill\">🎤 45-minute drill\u003C/span>\u003C/div>\r\n    <h1>Mock Interview\u003C/h1>\r\n    <p class=\"lead\">Draw a problem, start the clock, and design out loud — sketch the class diagram on paper, then write the core classes in a plain editor with no autocomplete. The timer tells you what you should be doing; the rubric afterwards tells you what you skipped. Scoring yourself honestly is where the improvement comes from.\u003C/p>\r\n  \u003C/section>\r\n\r\n  <div class=\"prompt-card\" id=\"prompt\">\u003C/div>\r\n\r\n  <div class=\"controls\" style=\"margin-top:16px\">\r\n    <button class=\"btn primary\" id=\"draw\">🎲 Draw a problem\u003C/button>\r\n    <div class=\"seg\" id=\"diff\"><button data-v=\"\" class=\"active\">Any level\u003C/button><button data-v=\"e\">Starter\u003C/button><button data-v=\"m\">Medium\u003C/button><button data-v=\"h\">Hard\u003C/button>\u003C/div>\r\n    <select class=\"inp\" id=\"tagSel\" aria-label=\"Filter by concept\">\u003C/select>\r\n  \u003C/div>\r\n\r\n  <div class=\"split\" style=\"margin-top:24px;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)\">\r\n    <div class=\"card\" style=\"margin:0\">\r\n      <div class=\"clock\" id=\"clock\">00:00\u003C/div>\r\n      <div class=\"small muted\" id=\"phaseLeft\">Not started\u003C/div>\r\n      <div class=\"controls\" style=\"margin-top:12px\">\r\n        <button class=\"btn primary sm\" id=\"start\">▶ Start\u003C/button>\r\n        <button class=\"btn sm\" id=\"skip\">⏭ Next phase\u003C/button>\r\n        <button class=\"btn sm\" id=\"reset\">↺ Reset\u003C/button>\r\n      \u003C/div>\r\n      <div class=\"seg\" id=\"len\" style=\"margin-top:10px\"><button data-v=\"35\">35 min\u003C/button><button data-v=\"45\" class=\"active\">45 min\u003C/button><button data-v=\"60\">60 min\u003C/button>\u003C/div>\r\n    \u003C/div>\r\n    <div class=\"card\" style=\"margin:0\">\r\n      <div style=\"font-weight:800\" id=\"phaseTitle\">👋 Draw a problem and press start\u003C/div>\r\n      <ul class=\"small\" id=\"phasePrompts\" style=\"margin-top:8px\">\u003C/ul>\r\n    \u003C/div>\r\n  \u003C/div>\r\n  <div class=\"phases\" id=\"phases\">\u003C/div>\r\n\r\n  <h2>Notes\u003C/h2>\r\n  <p class=\"small muted\">Jot your use cases, classes and design decisions here — or use it as a checklist while you talk. Saved in this browser as you type.\u003C/p>\r\n  <textarea class=\"inp notes\" id=\"notes\" placeholder=\"Use cases and actors…&#10;Out of scope…&#10;Entities and relationships…&#10;Interfaces and patterns…&#10;Key method signatures…&#10;Follow-ups: extension, concurrency, tests…\">\u003C/textarea>\r\n\r\n  <h2>Score yourself\u003C/h2>\r\n  <p class=\"small muted\">0 = didn't do it · 1 = touched on it · 2 = solid · 3 = what a strong senior candidate does. Be strict; the point is to find gaps.\u003C/p>\r\n  <div class=\"rubric\" id=\"rubric\">\u003C/div>\r\n  <div class=\"stats\">\r\n    <div class=\"stat acc\"><div class=\"k\">Score\u003C/div><div class=\"v\" id=\"scoreV\">0 <small>/ 24\u003C/small>\u003C/div>\u003C/div>\r\n    <div class=\"stat\"><div class=\"k\">Reads as\u003C/div><div class=\"v\" id=\"scoreBand\" style=\"font-size:16px\">–\u003C/div>\u003C/div>\r\n    <div class=\"stat good\"><div class=\"k\">Strongest\u003C/div><div class=\"v\" id=\"scoreBest\" style=\"font-size:14px\">–\u003C/div>\u003C/div>\r\n    <div class=\"stat bad\"><div class=\"k\">Weakest\u003C/div><div class=\"v\" id=\"scoreWorst\" style=\"font-size:14px\">–\u003C/div>\u003C/div>\r\n  \u003C/div>\r\n  <div class=\"controls\">\r\n    <button class=\"btn primary\" id=\"save\">💾 Save this session\u003C/button>\r\n    <button class=\"btn\" id=\"copy\">📋 Copy write-up\u003C/button>\r\n    <button class=\"btn ghost\" id=\"clearAll\">Clear history\u003C/button>\r\n  \u003C/div>\r\n\r\n  <h2>Session history\u003C/h2>\r\n  <div class=\"hist\" id=\"hist\">\u003C/div>\r\n  <div id=\"weakSpots\">\u003C/div>\r\n\r\n  <div class=\"callout interview\" style=\"margin-top:40px\"><div class=\"ico\">🎤\u003C/div><div class=\"body\"><div class=\"title\">How to practise so it actually transfers\u003C/div><p>Speak <b>out loud\u003C/b> — silent thinking is the most common thing that separates people who know the material from people who pass interviews. Draw the diagram. When the timer moves to a new phase, move on even if you're not finished; running out of time in the deep-dive phase is the classic failure. Afterwards, look up the one thing you were least sure about and read that chapter section again.\u003C/p>\u003C/div>\u003C/div>\r\n\u003C/main>\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { $, $$, LS, CHAPTERS } = DIST;\r\n\r\n  /* ================= Problem bank ================= */\r\n  const P = [\r\n    ['LRU cache', 'e', ['data structures', 'strategy'], 31, 'O(1) get and put with a capacity; then add LFU without rewriting the cache.'],\r\n    ['Rate limiter', 'e', ['strategy', 'concurrency'], 32, 'Per-client limits; token bucket first, then swap in a sliding window.'],\r\n    ['Logging framework', 'e', ['chain', 'singleton'], 33, 'Levels, multiple appenders and formats; then make logging asynchronous.'],\r\n    ['Parking lot', 'e', ['modeling', 'strategy'], 40, 'Multiple levels and spot sizes, tickets and hourly fees.'],\r\n    ['Vending machine', 'e', ['state'], 45, 'Select, pay, dispense, refund — no flag soup.'],\r\n    ['Tic-tac-toe on an N×N board', 'e', ['modeling'], 44, 'Two players, win detection in O(1) per move.'],\r\n    ['In-memory pub-sub broker', 'm', ['observer', 'concurrency'], 34, 'Topics, many subscribers, replay from an offset.'],\r\n    ['Task scheduler', 'm', ['command', 'concurrency'], 35, 'One-off, delayed and recurring jobs on a worker pool.'],\r\n    ['In-memory file system', 'm', ['composite'], 36, 'mkdir -p, ls, write and read files by path.'],\r\n    ['Key-value store with transactions', 'm', ['memento', 'command'], 37, 'GET/SET/DELETE with nested BEGIN, ROLLBACK and COMMIT.'],\r\n    ['Text editor with undo', 'm', ['command', 'memento'], 38, 'Insert, delete, move the cursor, undo and redo.'],\r\n    ['Connection pool', 'm', ['concurrency'], 39, 'Bounded pool, acquire with timeout, validate idle connections.'],\r\n    ['Splitwise', 'm', ['strategy', 'modeling'], 43, 'Equal, exact and percentage splits; who owes whom.'],\r\n    ['ATM', 'm', ['state', 'chain'], 45, 'Card, PIN, withdraw — dispense notes of several denominations.'],\r\n    ['Elevator system', 'h', ['state', 'strategy'], 41, 'N cars, M floors, a pluggable dispatch policy.'],\r\n    ['Movie ticket booking', 'h', ['concurrency', 'state'], 42, 'Seat selection with temporary holds; never double-book.'],\r\n    ['Chess', 'h', ['modeling', 'command'], 44, 'Legal moves per piece, check, checkmate and undo.'],\r\n    ['Ride-hailing (DIST)', 'h', ['observer', 'strategy'], 46, 'Request, match, track and complete a trip; surge pricing.'],\r\n  ];\r\n  const LEVELS = { e: ['Starter', 'e'], m: ['Medium', 'm'], h: ['Hard', 'h'] };\r\n  const tags = [...new Set(P.flatMap(p => p[2]))].sort();\r\n  $('#tagSel').innerHTML = '<option value=\"\">Any concept\u003C/option>' + tags.map(t => `<option>${t}\u003C/option>`).join('');\r\n\r\n  let cur = null;\r\n  function draw() {\r\n    const d = $('#diff').dataset.value, tg = $('#tagSel').value;\r\n    const pool = P.filter(p => (!d || p[1] === d) && (!tg || p[2].includes(tg)));\r\n    if (!pool.length) { DIST.toast('No problems match those filters'); return; }\r\n    cur = pool[Math.floor(Math.random() * pool.length)];\r\n    const ch = cur[3] ? CHAPTERS.find(c => c.n === cur[3]) : null;\r\n    $('#prompt').innerHTML = `\r\n      <div class=\"eyebrow\"><span class=\"pill ${cur[1] === 'h' ? 'red' : cur[1] === 'm' ? 'amber' : 'green'}\">${LEVELS[cur[1]][0]}\u003C/span><span class=\"pill\">🎤 design it out loud\u003C/span>\u003C/div>\r\n      <h2>Design ${cur[0]}\u003C/h2>\r\n      <p class=\"small\" style=\"margin:0;color:var(--text-2)\">${cur[4]}\u003C/p>\r\n      <div class=\"tags\">${cur[2].map(t => `<span>${t}\u003C/span>`).join('')}\u003C/div>\r\n      ${ch ? `<p class=\"small\" style=\"margin:12px 0 0\">📘 Worked solution afterwards: <a href=\"${ch.file}\">Chapter ${ch.n} — ${ch.title}\u003C/a>\u003C/p>` : '<p class=\"small muted\" style=\"margin:12px 0 0\">No worked chapter for this one — compare with a friend or write your own notes.\u003C/p>'}`;\r\n    reset();\r\n  }\r\n  $('#draw').onclick = draw;\r\n  $('#diff').addEventListener('segchange', draw);\r\n  $('#tagSel').addEventListener('change', draw);\r\n\r\n  /* ================= Timer ================= */\r\n  const PLANS = {\r\n    35: [['Requirements', 4], ['Entities', 5], ['Class design', 8], ['APIs & flows', 5], ['Code', 10], ['Extend', 3]],\r\n    45: [['Requirements', 5], ['Entities', 5], ['Class design', 10], ['APIs & flows', 6], ['Code', 14], ['Extend', 5]],\r\n    60: [['Requirements', 6], ['Entities', 7], ['Class design', 12], ['APIs & flows', 8], ['Code', 20], ['Extend', 7]],\r\n  };\r\n  const PROMPTS = {\r\n    'Requirements': ['Restate the problem and list the core use cases', 'Who are the actors? What does each one do?', 'Cut scope out loud: what is explicitly not in version one?', 'Single process or concurrent access? In-memory or persisted?'],\r\n    'Entities': ['List the nouns: which become classes, which are just fields?', 'Mark which are entities (identity) and which are value objects', 'Name the relationships and their multiplicities', 'Spot what varies — that is where an interface goes'],\r\n    'Class design': ['Draw the class diagram: interfaces first, then implementations', 'Name the pattern for each variation point, and say why', 'Check each class against single responsibility', 'Who owns whom? Who creates whom?'],\r\n    'APIs & flows': ['Write the public method signatures for the main use case', 'Walk one request through as a sequence diagram', 'Decide error handling: exceptions, Optional or result objects', 'Where do state changes happen, and are they atomic?'],\r\n    'Code': ['Start with the interfaces and the core class, not the edges', 'Constructor injection, final fields, validate at the boundary', 'Narrate as you go — silence is what loses offers', 'Leave obvious TODOs for the non-core pieces instead of writing them'],\r\n    'Extend': ['Handle the follow-up: which classes change, and which do not?', 'Make it thread-safe: what is shared, and how is it guarded?', 'How would you unit-test the core class?', 'Name one trade-off you made and the alternative'],\r\n  };\r\n  let tm = { elapsed: 0, running: false };\r\n  const plan = () => PLANS[$('#len').dataset.value];\r\n  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;\r\n  function phaseAt(sec) { let acc = 0; const p = plan(); for (let i = 0; i < p.length; i++) { acc += p[i][1] * 60; if (sec < acc) return { i, left: acc - sec }; } return { i: p.length, left: 0 }; }\r\n  function tick() {\r\n    const p = plan(), total = p.reduce((s, x) => s + x[1], 0) * 60;\r\n    const { i, left } = phaseAt(tm.elapsed);\r\n    $('#phases').innerHTML = p.map(([n, m], j) => {\r\n      const start = p.slice(0, j).reduce((s, x) => s + x[1], 0) * 60, frac = DIST.clamp((tm.elapsed - start) / (m * 60), 0, 1);\r\n      return `<div class=\"phase ${j < i ? 'done' : j === i && (tm.elapsed > 0 || tm.running) ? 'cur' : ''}\" style=\"flex:${m}\"><i style=\"width:${j === i ? frac * 100 : 0}%\">\u003C/i><span>${n}<br><small>${m}m\u003C/small>\u003C/span>\u003C/div>`;\r\n    }).join('');\r\n    $('#clock').textContent = fmt(tm.elapsed);\r\n    $('#clock').style.color = tm.elapsed >= total ? 'var(--red)' : '';\r\n    if (!tm.elapsed && !tm.running) { $('#phaseLeft').textContent = 'Not started'; return; }\r\n    if (i >= p.length) { $('#phaseTitle').textContent = '⏰ Time — now score yourself below'; $('#phasePrompts').innerHTML = ''; $('#phaseLeft').textContent = 'Session complete'; return; }\r\n    $('#phaseTitle').textContent = `${i + 1}. ${p[i][0]}`;\r\n    $('#phaseLeft').textContent = `${fmt(left)} left in this phase · ${fmt(Math.max(0, total - tm.elapsed))} total`;\r\n    $('#phasePrompts').innerHTML = PROMPTS[p[i][0]].map(x => `<li>${x}\u003C/li>`).join('');\r\n  }\r\n  let last = Date.now();\r\n  setInterval(() => { const now = Date.now(), dt = (now - last) / 1000; last = now; if (tm.running) { tm.elapsed += dt; tick(); } }, 250);\r\n  function reset() { tm = { elapsed: 0, running: false }; $('#start').textContent = '▶ Start'; $('#phaseTitle').textContent = cur ? 'Ready — press start and talk through it' : '👋 Draw a problem and press start'; $('#phasePrompts').innerHTML = ''; tick(); }\r\n  $('#start').onclick = () => { if (!cur) { draw(); } tm.running = !tm.running; $('#start').textContent = tm.running ? '⏸ Pause' : '▶ Resume'; tick(); };\r\n  $('#skip').onclick = () => { const p = plan(), { i } = phaseAt(tm.elapsed); tm.elapsed = p.slice(0, Math.min(i + 1, p.length)).reduce((s, x) => s + x[1], 0) * 60; tick(); };\r\n  $('#reset').onclick = reset;\r\n  $('#len').addEventListener('segchange', reset);\r\n\r\n  /* ================= Rubric ================= */\r\n  const RUB = [\r\n    ['Requirements & scope', 'Clarified use cases and actors; stated what is out of scope'],\r\n    ['Entities & relationships', 'Right classes, sensible ownership and multiplicities'],\r\n    ['Abstractions', 'Interfaces at the real variation points, not everywhere'],\r\n    ['Principles', 'Small, cohesive classes; SOLID applied where it paid off'],\r\n    ['Patterns', 'Named and used where they fit, never forced'],\r\n    ['Code quality', 'Readable, compiling-quality Java with clear names and validation'],\r\n    ['Extensibility & concurrency', 'Follow-ups handled with small changes; shared state guarded'],\r\n    ['Communication', 'Drove the session, thought out loud, adapted when challenged'],\r\n  ];\r\n  let scores = new Array(RUB.length).fill(0);\r\n  function rubric() {\r\n    $('#rubric').innerHTML = RUB.map(([n, d], i) => `<div class=\"rub\"><span><b>${n}\u003C/b><small>${d}\u003C/small>\u003C/span>\r\n      <span class=\"scoreset\">${[0, 1, 2, 3].map(v => `<button class=\"${scores[i] === v ? 'on' : ''}\" data-i=\"${i}\" data-v=\"${v}\">${v}\u003C/button>`).join('')}\u003C/span>\u003C/div>`).join('');\r\n    $$('#rubric button').forEach(b => b.onclick = () => { scores[+b.dataset.i] = +b.dataset.v; rubric(); });\r\n    const total = scores.reduce((a, b) => a + b, 0);\r\n    $('#scoreV').innerHTML = `${total} <small>/ ${RUB.length * 3}\u003C/small>`;\r\n    const band = total >= 20 ? '🏆 strong senior+' : total >= 15 ? '✅ solid senior' : total >= 10 ? '🙂 mid-level' : total ? '📚 keep drilling' : '–';\r\n    $('#scoreBand').textContent = band;\r\n    const idx = scores.map((s, i) => [s, i]);\r\n    const best = idx.slice().sort((a, b) => b[0] - a[0])[0], worst = idx.slice().sort((a, b) => a[0] - b[0])[0];\r\n    $('#scoreBest').textContent = total ? RUB[best[1]][0] : '–';\r\n    $('#scoreWorst').textContent = total ? RUB[worst[1]][0] : '–';\r\n  }\r\n  rubric();\r\n\r\n  /* ================= Notes, history ================= */\r\n  const notes = $('#notes');\r\n  notes.value = LS.get('dist-mock-notes', '');\r\n  notes.addEventListener('input', () => LS.set('dist-mock-notes', notes.value));\r\n\r\n  function writeUp() {\r\n    const total = scores.reduce((a, b) => a + b, 0);\r\n    return `# Mock interview — ${cur ? cur[0   ];


  // Prerequisites are stored as 0.1…0.8 (so they sort before Chapter 1) and shown as P1…P8.
  const isPre = (n) => n > 0 && n < 1;
  const numOf = (c) => (c && typeof c === 'object' ? c.n : +c);
  const chNum = (c) => { const n = numOf(c); return isPre(n) ? 'P' + Math.round(n * 10) : String(n); };
  const chName = (c) => { const n = numOf(c); return isPre(n) ? 'Prerequisite ' + Math.round(n * 10) : 'Chapter ' + n; };

  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  // The old single "Chapter 0" became the Prerequisites level: finishing it counts as finishing all of them.
  (function migratePrereqs() {
    const d = LS.get('dist-done', []);
    if (!Array.isArray(d) || !d.includes(0)) return;
    const pre = CHAPTERS.filter((c) => isPre(c.n)).map((c) => c.n);
    LS.set('dist-done', [...new Set(d.filter((n) => n !== 0).concat(pre))]);
    const q = LS.get('dist-quiz', {}); delete q[0]; LS.set('dist-quiz', q);
  })();
  const doneSet = () => new Set(LS.get('dist-done', []));

  /* ---------------- helpers ---------------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DIST = {
    CHAPTERS, LEVELS, LS, chNum, chName,
    $: (s, r = document) => r.querySelector(s),
    $$: (s, r = document) => [...r.querySelectorAll(s)],
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    fmt(n, d = 1) {
      if (!isFinite(n)) return '∞';
      const a = Math.abs(n);
      if (a >= 1e12) return (n / 1e12).toFixed(d).replace(/\.0+$/, '') + 'T';
      if (a >= 1e9) return (n / 1e9).toFixed(d).replace(/\.0+$/, '') + 'B';
      if (a >= 1e6) return (n / 1e6).toFixed(d).replace(/\.0+$/, '') + 'M';
      if (a >= 1e3) return (n / 1e3).toFixed(d).replace(/\.0+$/, '') + 'K';

    },
    bytes(b) {
      const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB'];
      let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
      return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)).replace(/\.0+$/, '') + ' ' + u[i];
    },
    svg(tag, attrs = {}, parent) {
      const e = document.createElementNS(SVGNS, tag);
      for (const k in attrs) {
        if (k === 'text') e.textContent = attrs[k];

      if (parent) parent.appendChild(e);

    },
    /** centre of any element in the coordinate space of its owner <svg> */
    center(svg, el) {
      if (typeof el === 'string') el = svg.querySelector('#' + CSS.escape(el));
      const r = el.getBoundingClientRect();
      const pt = svg.createSVGPoint();
      pt.x = r.left + r.width / 2; pt.y = r.top + r.height / 2;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { x: p.x, y: p.y };
    },
    /** animate a glowing dot from (x1,y1) to (x2,y2). resolves when done */
    packet(svg, x1, y1, x2, y2, o = {}) {
      const color = o.color || 'var(--accent)';
      const dur = o.dur || 700;
      const g = DIST.svg('g', { class: 'packet', style: `color:${color}` }, svg);
      const c = DIST.svg('circle', { r: o.r || 6, fill: color }, g);
      let t2;
      if (o.label) t2 = DIST.svg('text', { 'font-size': 10, 'text-anchor': 'middle', fill: color, 'font-weight': 700, text: o.label, style: 'font-family:var(--mono)' }, g);
      const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const e = ease(t);
          const x = x1 + (x2 - x1) * e, y = y1 + (y2 - y1) * e;
          c.setAttribute('cx', x); c.setAttribute('cy', y);
          if (t2) { t2.setAttribute('x', x); t2.setAttribute('y', y - 11); }

    packetBetween(svg, a, b, o) {

    },
    /** animate along an existing <path> */
    packetAlong(svg, path, o = {}) {
      const len = path.getTotalLength();
      const dur = o.dur || 900;
      const g = DIST.svg('g', { class: 'packet', style: `color:${o.color || 'var(--accent)'}` }, svg);
      const c = DIST.svg('circle', { r: o.r || 6, fill: o.color || 'var(--accent)' }, g);
      return new Promise((res) => {
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const p = path.getPointAtLength(o.reverse ? len * (1 - t) : len * t);
          c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);

    log(el, html, cls = '') {

    },
    toast(msg) {

  window.DIST = DIST;

  /* ---------------- theme ---------------- */

  /* ---------------- shell ---------------- */
  const AUTHOR = 'Palak Deb Patra';
  const ATLAS_WORDMARK = '<svg class="atlas-wordmark" viewBox="0 0 102 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="1" y="25" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-1.3" fill="currentColor">Engg<tspan class="gold">A</tspan></text></svg>';

  function buildShell() {
    const body = document.body;

    const chapNum = body.dataset.chapter == null ? -1 : +body.dataset.chapter;   // -1 = not a chapter page (prerequisites are 0.1…0.8)
    const chap = CHAPTERS.find((c) => c.n === chapNum);

    // sidebar
    const done = doneSet();
    let html = `<a class="brand" href="index.html"><span class="brand-logo"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="3.8" r="2.2"/><circle cx="20.2" cy="12" r="2.2"/><circle cx="12" cy="20.2" r="2.2"/><circle cx="3.8" cy="12" r="2.2"/><path d="M13.6 5.4l5 5M18.6 13.6l-5 5M10.4 18.6l-5-5M5.4 10.4l5-5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span><span><span class="brand-author">Palak Deb Patra</span><span class="grad brand-course">Distributed Systems Playlist</span></span></a>

  function buildToc(chap, main) {
    const toc = document.getElementById('toc');

  function buildFooter(chap, main) {
    if (!chap) return;
    const i = CHAPTERS.indexOf(chap);
    const prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
    const box = document.createElement('div');
    const isDone = () => doneSet().has(chap.n);
    const render = () => {
      box.className = 'complete-box' + (isDone() ? ' done' : '');
      box.innerHTML = isDone()
        ? `<p style="font-size:26px;margin:0">🎉</p><p><strong>${chName(chap)} complete!</strong></p><button class="btn sm ghost" data-undo>Mark as not complete</button>`
        : `<p><strong>Finished this chapter?</strong><br><span class="muted small">Track your progress across the course.</span></p><button class="btn primary">✓ Mark chapter complete</button>`;
      box.querySelector('button').onclick = () => {
        const s = doneSet();
        if (isDone()) s.delete(chap.n); else { s.add(chap.n); DIST.toast('Nice work! Progress saved.'); }

        render();
        const side = DIST.$('.sidebar .nav-link.current .num');
        if (side) { side.textContent = isDone() ? '✓' : chNum(chap); side.parentElement.classList.toggle('done', isDone()); }
        const bar = DIST.$('.side-progress');
        if (bar) { const n = doneSet().size; bar.querySelector('i').style.width = (n / CHAPTERS.length) * 100 + '%'; bar.querySelector('small').textContent = `${n} of ${CHAPTERS.length} chapters complete`; }
      };
    };

      + (next ? `<a class="nx" href="${next.file}"><small>Next →</small>${next.title}</a>` : `<a class="nx" href="index.html"><small>🏁 Finished!</small>Back to course home</a>`);

  /* ---------------- components ---------------- */
  function initTabs(root = document) {
    DIST.$$('.tabs', root).forEach((tabs) => {
      if (tabs._init) return; tabs._init = true;
      const btns = DIST.$$(':scope > .tab-list > button', tabs);
      const panels = DIST.$$(':scope > .tab-panel', tabs);
      const go = (i) => {
        btns.forEach((b, j) => b.classList.toggle('active', i === j));
        panels.forEach((p, j) => p.classList.toggle('active', i === j));
        tabs.dispatchEvent(new CustomEvent('tabchange', { detail: { index: i, panel: panels[i] } }));
      };
      btns.forEach((b, i) => (b.onclick = () => go(i)));
      go(Math.max(0, btns.findIndex((b) => b.classList.contains('active'))));
    });
  }

  function initSeg(root = document) {
    DIST.$$('.seg', root).forEach((seg) => {
      if (seg._init) return; seg._init = true;
      const btns = DIST.$$('button', seg);
      if (!btns.some((b) => b.classList.contains('active')) && btns[0]) btns[0].classList.add('active');
      seg.dataset.value = (btns.find((b) => b.classList.contains('active')) || {}).dataset?.v || '';
      btns.forEach((b) => b.addEventListener('click', () => {
        btns.forEach((x) => x.classList.toggle('active', x === b));

        seg.dispatchEvent(new CustomEvent('segchange', { detail: b.dataset.v }));

    });
  }

  function initFlips(root = document) {
    DIST.$$('.flip', root).forEach((f) => {
      if (f._init) return; f._init = true;
      f.setAttribute('tabindex', '0');
      const t = () => f.classList.toggle('flipped');

    });

  function initSteppers(root = document) {
    DIST.$$('.stepper', root).forEach((st) => {
      if (st._init) return; st._init = true;
      const diagram = document.getElementById(st.dataset.diagram);
      const steps = DIST.$$('ol.steps > li', st);
      const intro = st.dataset.intro || 'Press <b>Next</b> or <b>Play</b> to walk through this flow step by step.';
      st.insertAdjacentHTML('beforeend', `
        <div class="step-text"><div class="st-title"></div><div class="st-desc"></div></div>
        <div class="stepper-bar">
          <div class="stepper-dots">${steps.map(() => '<i></i>').join('')}</div>
          <span class="count"></span>
          <button class="btn sm" data-a="reset" title="Reset">↺</button>
          <button class="btn sm" data-a="prev">← Prev</button>
          <button class="btn sm" data-a="play">▶ Play</button>
          <button class="btn sm primary" data-a="next">Next →</button>
        </div>`);
      const title = DIST.$('.st-title', st), desc = DIST.$('.st-desc', st), count = DIST.$('.count', st);
      const dots = DIST.$$('.stepper-dots i', st);
      const playBtn = DIST.$('[data-a=play]', st);
      let idx = -1, playing = false, token = 0;

      const clear = () => { if (diagram) DIST.$$('.on', diagram).forEach((e) => e.classList.remove('on')); };
      async function go(i) {
        idx = DIST.clamp(i, -1, steps.length - 1);
        const my = ++token;
        clear();
        dots.forEach((d, j) => { d.classList.toggle('active', j === idx); d.classList.toggle('past', j < idx); });
        count.textContent = idx < 0 ? `${steps.length} steps` : `Step ${idx + 1} / ${steps.length}`;
        DIST.$('[data-a=prev]', st).disabled = idx < 0;
        DIST.$('[data-a=next]', st).disabled = idx >= steps.length - 1;
        if (idx < 0) {
          diagram && diagram.classList.remove('stepping');
          title.innerHTML = '👋 Interactive walkthrough'; desc.innerHTML = intro;
          st.dispatchEvent(new CustomEvent('step', { detail: { index: -1 } }));
          return;
        }
        const li = steps[idx];
        diagram && diagram.classList.add('stepping');
        (li.dataset.on || '').split(/\s+/).filter(Boolean).forEach((id) => {
          const e = diagram && diagram.querySelector('#' + CSS.escape(id));
          if (e) e.classList.add('on');
        });
        title.innerHTML = `<span class="n">${idx + 1}</span>${li.dataset.title || ''}`;
        desc.innerHTML = li.innerHTML;
        desc.style.animation = 'none'; void desc.offsetWidth; desc.style.animation = '';
        st.dispatchEvent(new CustomEvent('step', { detail: { index: idx, li } }));
        if (li.dataset.packet && diagram) {
          for (const seg of li.dataset.packet.split(',')) {
            if (my !== token) return;
            const [a, b] = seg.split('>').map((s) => s.trim());
            const ea = diagram.querySelector('#' + CSS.escape(a)), eb = diagram.querySelector('#' + CSS.escape(b));
            if (ea && eb) await DIST.packetBetween(diagram, ea, eb, { color: li.dataset.color, dur: 650 });
          }
        }
      }
      async function play() {
        if (playing) { playing = false; playBtn.textContent = '▶ Play'; return; }
        playing = true; playBtn.textContent = '⏸ Pause';
        if (idx >= steps.length - 1) idx = -1;
        while (playing && idx < steps.length - 1) {
          await go(idx + 1);
          await DIST.sleep(+st.dataset.delay || 2300);
        }
        playing = false; playBtn.textContent = '▶ Play';
      }
      st.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (!a) return;
        if (a !== 'play' && playing) { playing = false; playBtn.textContent = '▶ Play'; }
        if (a === 'next') go(idx + 1);
        if (a === 'prev') go(idx - 1);
        if (a === 'reset') go(-1);
        if (a === 'play') play();
      });
      dots.forEach((d, j) => (d.onclick = () => go(j)));
      st._go = go;
      go(-1);
    });
  }

  function initQuizzes(chap) {
    const quizzes = DIST.$$('.quiz');
    if (!quizzes.length) return;
    let answered = 0, correct = 0;
    const scoreEl = DIST.$('.quiz-score');
    const update = () => {
      if (!scoreEl) return;
      scoreEl.innerHTML = `<span class="big">${correct}/${quizzes.length}</span><span>${answered < quizzes.length ? `Answered ${answered} of ${quizzes.length} — keep going!` : correct === quizzes.length ? 'Perfect score! You nailed this chapter. 🏆' : correct >= quizzes.length * .6 ? 'Solid! Review the ones you missed. 💪' : 'Worth a re-read of the sections above. 📚'}</span>`;
      if (answered === quizzes.length && chap) {
        const best = LS.get('dist-quiz', {});
        best[chap.n] = Math.max(best[chap.n] || 0, correct / quizzes.length);
        LS.set('dist-quiz', best);
      }
    };
    quizzes.forEach((q, qi) => {
      const qp = DIST.$('.q', q);
      if (qp && !qp.querySelector('.qn')) qp.insertAdjacentHTML('afterbegin', `<span class="qn">Q${qi + 1}</span>`);
      const opts = DIST.$$('.opt', q);
      const ans = +q.dataset.answer;
      opts.forEach((o, i) => {
        o.dataset.letter = 'ABCDEFG'[i];
        o.onclick = () => {
          if (q.classList.contains('answered')) return;
          q.classList.add('answered');

<script>/* =========================================================

   multi-file site). Swaps whole pages in and out of <body> and
   re-runs the shared runtime, so every page boots exactly as it

    var h = a.getAttribute('href');
    if (!h || /^[a-z]+:/i.test(h) || h.indexOf('#/') === 0) return;   // external, mailto:, already a route

    if (h.charAt(0) === '#') {                                        // in-page anchor (table of contents)
      var id = decodeURIComponent(h.slice(1));
      var el = document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      suppress = href(parse(location.hash).file, id);
      history.replaceState(null, '', suppress);
      return;
    }

    var m = /^([^?#]+\.html)(?:#(.*))?$/.exec(h);                     // page link
    if (m && PAGES[m[1]]) {
      e.preventDefault();
      go(m[1], m[2] || '');
    }
  }, true);

  rawWinOn('hashchange', function () {
    if (location.hash === suppress) { suppress = null; return; }
    suppress = null;
    render();
  });

  /* ---- start -------------------------------------------------- */
  if (!location.hash) history.replaceState(null, '', href(HOME));
  // render() rewrites <body>, so it must not run while the parser is still
  // filling it — but it should run the moment parsing is done, not a frame later.
  if (document.readyState === 'loading') rawDocOn('DOMContentLoaded', render);
  else render();
})();
</script>
</body>
</html>
