* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {

}

:not(pre) > code {

}

/* ---------- Reading progress ---------- */
.read-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 100; transition: width .1s linear;
}

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }
.sidebar {

}

  box-shadow: 0 6px 18px var(--accent-soft); flex: none;
}
.atlas-wordmark { display: block; width: 102px; height: 32px; flex: none; color: var(--text); }
.atlas-wordmark .gold { fill: var(--amber); }
.topbar .crumb .atlas-home { display: inline-flex; align-items: center; vertical-align: middle; }
.topbar .crumb .atlas-wordmark { width: 64px; height: 20px; }
.brand-author { display: block; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand-course { display: block; font-size: 16px; line-height: 1.2; }
.side-progress { margin: 0 10px 18px; }
.side-progress .bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.side-progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s; }
.side-progress small { color: var(--muted); font-size: 12px; }
.nav-level {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  font-weight: 700; padding: 14px 10px 6px;
}
.nav-link {

}
.nav-link:hover { background: var(--surface-2); text-decoration: none; }
.nav-link .num {

}

.toc { margin: 4px 0 8px 44px; border-left: 1px solid var(--border); }
.toc a { display: block; padding: 3px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-left: -1px; border-left: 2px solid transparent; }

.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

  background: var(--surface); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 17px;
  transition: .2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Chapter hero ---------- */
.hero {
  position: relative; padding: 28px 30px 26px; border-radius: 20px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 32px;
}
.hero::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.hero .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  font-family: var(--mono); letter-spacing: .02em;

}

.pill.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }

.pill.pink { background: var(--pink-soft); color: var(--pink); border-color: transparent; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 12px; font-weight: 800; }

}

/* ---------- Typography ---------- */
.content h2 {
  font-size: 26px; letter-spacing: -.025em; line-height: 1.2; margin: 48px 0 12px; font-weight: 800;
  display: flex; align-items: center; gap: 12px;
}
.content h2 .sec-num {
  font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft);

}
.content h3 { font-size: 19px; letter-spacing: -.015em; margin: 28px 0 8px; font-weight: 700; }
.content h4 { font-size: 16px; margin: 18px 0 6px; font-weight: 700; }
.content p { margin: 0 0 14px; color: var(--text-2); }
.content ul, .content ol { color: var(--text-2); padding-left: 22px; margin: 0 0 14px; }
.content li { margin-bottom: 4px; }
.content strong { color: var(--text); }
.muted { color: var(--muted) !important; }
.small { font-size: 14px; }
.center { text-align: center; }
hr.sep { border: 0; border-top: 1px dashed var(--border); margin: 32px 0; }

/* ---------- Callouts ---------- */
.callout {
  display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); margin: 18px 0;
  background: var(--accent-soft); border: 1px solid transparent;
}
.callout .ico { font-size: 20px; line-height: 1.4; flex: none; }
.callout .body { flex: 1; min-width: 0; }
.callout .body > :last-child { margin-bottom: 0; }
.callout .title { font-weight: 700; color: var(--text); margin-bottom: 3px; font-size: 15px; }

.callout.tip { background: var(--green-soft); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; margin: 20px 0; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.feature { position: relative; }
.feature .f-ico {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px;
  background: var(--accent-soft); margin-bottom: 12px;
}
.feature h4 { margin: 0 0 6px !important; font-size: 16px; }
.feature p { font-size: 14.5px; margin: 0 !important; line-height: 1.55; }

/* ---------- Flip cards ---------- */
.flip { perspective: 1000px; cursor: pointer; min-height: 170px; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 170px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 18px;
  display: flex; flex-direction: column; justify-content: center; box-shadow: var(--shadow);
}
.flip .front { align-items: center; text-align: center; gap: 8px; }
.flip .front .big { font-size: 34px; }
.flip .front h4 { margin: 0 !important; }
.flip .front small { color: var(--muted); font-size: 12px; }
.flip .back { transform: rotateY(180deg); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)), var(--surface); font-size: 14.5px; color: var(--text-2); line-height: 1.55; }

/* ---------- Diagram / interactive panels ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); margin: 20px 0; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); flex-wrap: wrap;
}
.panel-head .dots { display: flex; gap: 6px; }
.panel-head .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.panel-head .dots i:nth-child(1) { background: #ff5f57; } .panel-head .dots i:nth-child(2) { background: #febc2e; } .panel-head .dots i:nth-child(3) { background: #28c840; }
.panel-head .p-title { font-weight: 700; font-size: 14px; }
.panel-head .p-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.panel-body { padding: 18px; }
.panel-foot { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 14px; color: var(--muted); }

.diagram { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--font); }
.diagram text { fill: var(--text); font-size: 14px; }
.diagram .lbl { fill: var(--muted); font-size: 12px; }
.diagram .mono { font-family: var(--mono); }
.diagram .node rect, .diagram .node circle, .diagram .node ellipse, .diagram .node path.shape {
  fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; transition: all .35s;
}
.diagram .node text { font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
.diagram .node .ico { font-size: 20px; }
.diagram .node.on rect, .diagram .node.on circle, .diagram .node.on ellipse, .diagram .node.on path.shape {
  stroke: var(--accent); fill: var(--accent-soft); stroke-width: 2.2; filter: drop-shadow(0 0 10px var(--accent-soft));
}
.diagram .node.ok rect, .diagram .node.ok circle { stroke: var(--green); fill: var(--green-soft); }
.diagram .node.bad rect, .diagram .node.bad circle { stroke: var(--red); fill: var(--red-soft); }
.diagram .node.warn rect, .diagram .node.warn circle { stroke: var(--amber); fill: var(--amber-soft); }
.diagram .edge { stroke: var(--border-strong); stroke-width: 1.8; fill: none; transition: all .35s; }
.diagram .edge.on { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 6; animation: flow .7s linear infinite; }
.diagram .edge.dash { stroke-dasharray: 5 5; }
.diagram .edge.bad { stroke: var(--red); }
.diagram .edge.ok { stroke: var(--green); }
.diagram .dimmable { transition: opacity .35s; }
.diagram.stepping .dimmable:not(.on) { opacity: .35; }
.diagram .arrow-head { fill: var(--border-strong); }
@keyframes flow { to { stroke-dashoffset: -13; } }
.packet { filter: drop-shadow(0 0 6px currentColor); }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 0; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: all .18s; line-height: 1.3; white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--text-2); font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input[type=number], .field input[type=text], .field select, input.inp, select.inp {
  font-family: var(--mono); font-size: 14px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); outline: none; min-width: 0;
}
.field input:focus, .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.range-row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-2); flex-wrap: wrap; }
.range-row label { min-width: 150px; font-weight: 600; }
.range-row output { font-family: var(--mono); color: var(--accent); font-weight: 600; min-width: 70px; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 140px; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 0; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -.02em; margin-top: 2px; line-height: 1.2; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat.good .v { color: var(--green); } .stat.bad .v { color: var(--red); } .stat.acc .v { color: var(--accent); } .stat.warn .v { color: var(--amber); }

/* ---------- Tabs ---------- */
.tabs { margin: 24px 0; }
.tab-list { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab-list button {
  background: none; border: 0; padding: 10px 16px; font-weight: 600; font-size: 14px; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab-list button:hover { color: var(--text); }
.tab-list button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; padding: 20px 0 0; animation: fadeUp .35s ease; }
.tab-panel.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Stepper ---------- */
.stepper { margin-top: 0; }
.stepper-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
.stepper-bar .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-right: auto; }
.stepper-dots { display: flex; gap: 5px; margin-right: 8px; }
.stepper-dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--border-strong); cursor: pointer; transition: .3s; }
.stepper-dots i.active { width: 22px; background: var(--accent); }
.stepper-dots i.past { background: var(--accent); opacity: .45; }
.step-text { padding: 16px 20px; min-height: 92px; border-top: 1px solid var(--border); }
.step-text .st-title { font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.step-text .st-title .n { font-family: var(--mono); font-size: 12px; background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 7px; }
.step-text .st-desc { color: var(--text-2); font-size: 15px; line-height: 1.6; animation: fadeUp .35s ease; }
.stepper ol.steps { display: none; }

/* ---------- Quiz ---------- */
.quiz-wrap { margin: 44px 0 16px; }
.quiz {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 12px 0; box-shadow: var(--shadow);
}
.quiz .q { font-weight: 700; color: var(--text); margin: 0 0 12px; font-size: 16px; display: flex; gap: 10px; }
.quiz .q .qn { flex: none; font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; height: fit-content; margin-top: 2px; }
.quiz .opts { display: grid; gap: 8px; }
.quiz .opt {
  text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); font-size: 15px; cursor: pointer; transition: all .18s; display: flex; gap: 10px; align-items: center;
}
.quiz .opt::before { content: attr(data-letter); font-family: var(--mono); font-weight: 700; font-size: 12px; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); flex: none; }
.quiz .opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.quiz .opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--text); }
.quiz .opt.correct::before { content: "✓"; background: var(--green); color: #fff; border-color: transparent; }
.quiz .opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--text); animation: shake .4s; }
.quiz .opt.wrong::before { content: "✕"; background: var(--red); color: #fff; border-color: transparent; }
.quiz .opt:disabled { cursor: default; }
.quiz .explain { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; color: var(--text-2); border-left: 3px solid var(--accent); }
.quiz.answered .explain { display: block; animation: fadeUp .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.quiz-score { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft)); font-weight: 600; }
.quiz-score .big { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--accent); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; padding: 11px 14px; background: var(--surface-2); color: var(--text); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr:hover td { background: var(--surface-2); }
.yes { color: var(--green); font-weight: 700; } .no { color: var(--red); font-weight: 700; } .meh { color: var(--amber); font-weight: 700; }

/* ---------- Code ---------- */
pre.code {
  background: #0d1117; color: #e6edf3; border-radius: 12px; padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.6;
  border: 1px solid var(--border); margin: 16px 0;
}
pre.code .c { color: #8b949e; } pre.code .k { color: #ff7b72; } pre.code .s { color: #a5d6ff; } pre.code .f { color: #d2a8ff; } pre.code .n { color: #79c0ff; } pre.code .g { color: #7ee787; }

/* ---------- Key takeaways ---------- */
.takeaways { border-radius: 18px; padding: 22px 24px; margin: 40px 0 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.takeaways::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(var(--accent), var(--accent-2)); }
.takeaways h3 { margin: 0 0 12px !important; }
.takeaways ul { list-style: none; padding: 0; margin: 0; }
.takeaways li { padding-left: 28px; position: relative; margin-bottom: 9px; }
.takeaways li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }

/* ---------- Chapter footer nav ---------- */
.chapter-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.chapter-nav a { display: block; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: .2s; }
.chapter-nav a:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow); }
.chapter-nav small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chapter-nav .nx { text-align: right; grid-column: 2; }
.complete-box { margin-top: 32px; text-align: center; padding: 24px; border-radius: 18px; border: 1px dashed var(--border-strong); }
.complete-box.done { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.complete-box p { margin: 0 0 12px !important; }

/* ---------- Misc visual bits ---------- */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
.kbd { font-family: var(--mono); font-size: 12px; padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.log {
  font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; height: 150px; overflow-y: auto; color: var(--text-2); line-height: 1.6;
}
.log div { animation: fadeUp .25s; }
.log .ok { color: var(--green); } .log .bad { color: var(--red); } .log .acc { color: var(--accent); } .log .warn { color: var(--amber); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-family: var(--mono); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; } }
.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
@media (max-width: 600px) { .pros-cons { grid-template-columns: 1fr; } }
.pros-cons > div { border-radius: 12px; padding: 14px 16px; font-size: 14.5px; }
.pros-cons ul { margin: 6px 0 0; padding-left: 18px; }
.pros-cons .pros { background: var(--green-soft); } .pros-cons .cons { background: var(--red-soft); }
.pros-cons h5 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.pros-cons .pros h5 { color: var(--green); } .pros-cons .cons h5 { color: var(--red); }
.timeline { position: relative; margin: 24px 0; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--accent-2)); border-radius: 2px; }
.timeline .ti { position: relative; margin-bottom: 20px; }
.timeline .ti::before { content: attr(data-n); position: absolute; left: -34px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; font-family: var(--mono); }
.timeline .ti h4 { margin: 0 0 4px !important; }
.timeline .ti p { margin: 0 !important; font-size: 15px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; transition: .2s; font-family: var(--mono); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }
.mt0 { margin-top: 0 !important; } .mb0 { margin-bottom: 0 !important; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.svg-scroll { overflow-x: auto; }
.svg-scroll svg { min-width: 560px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ---------- Search palette & study tools ---------- */
.search-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .2s;
}
.search-btn:hover { border-color: var(--accent); color: var(--text); }
.search-btn .kbd { margin-left: 4px; }
@media (max-width: 700px) { .search-btn span { display: none; } .search-btn .kbd { display: none; } }
.nav-link.study .num { background: transparent; font-size: 14px; }
.palette { position: fixed; inset: 0; background: rgba(6,8,14,.55); backdrop-filter: blur(3px); z-index: 300; display: none; padding: 10vh 16px 16px; }
.palette.show { display: block; animation: fadeUp .18s; }
.pal-inner { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; }
.pal-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 17px; }
.pal-top input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 16px; color: var(--text); }
.pal-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.pal-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--text); }
.pal-item:hover, .pal-item.sel { background: var(--accent-soft); text-decoration: none; }
.pal-item.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pal-ico { text-align: center; color: var(--muted); font-size: 14px; }
.pal-text { min-width: 0; }
.pal-text b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-text small { color: var(--muted); font-size: 12px; }
.pal-lv { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.pal-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 14px; }
.pal-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }

/* ---------- Interview drill ---------- */
details.ans { margin: 6px 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
details.ans > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--accent); list-style: none; }
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸ "; }
details.ans[open] > summary::before { content: "▾ "; }
details.ans > div { padding: 0 12px 12px; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
details.ans > div b { color: var(--text); }
.callout .body ul.mb0 { margin: 6px 0 0; padding-left: 18px; }
.callout .body ul.mb0 li { margin: 3px 0; font-size: 14px; }

/* =========================================================
   DIST-specific components
   ========================================================= */

/* ---------- Code blocks: Java in the house style ---------- */
pre.code { tab-size: 4; -moz-tab-size: 4; }
pre.code .t  { color: #ffa657; }   /* type / class name  */
pre.code .o  { color: #ff7b72; }   /* keyword / operator */
pre.code .m  { color: #79c0ff; }   /* number             */
pre.code .hl { display: block; margin: 0 -18px; padding: 0 18px; background: rgba(129,140,248,.16); box-shadow: inset 3px 0 0 var(--accent); }

/* a code block with a header strip: file/function name + complexity chips */
.codebox { margin: 18px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0d1117; }
.codebox > .cb-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.codebox > .cb-head .cb-name { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text); }
.codebox > .cb-head .cb-sp { flex: 1; }
.codebox > pre.code { margin: 0; border: 0; border-radius: 0; }
.codebox > .cb-foot { padding: 10px 14px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.codebox > .cb-foot b { color: var(--text); }

/* complexity chips */
.cx { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.cx.time  { background: var(--accent-soft); color: var(--accent); }
.cx.space { background: var(--accent-2-soft); color: var(--accent-2); }
.cx.good  { background: var(--green-soft); color: var(--green); }
.cx.bad   { background: var(--red-soft); color: var(--red); }
.cx.mid   { background: var(--amber-soft); color: var(--amber); }

/* ---------- Array / cell visualizer ---------- */
.cells { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
.cell {
  min-width: 40px; height: 40px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text);
  background: var(--surface-2); border: 1.6px solid var(--border); position: relative; transition: .25s;
}
.cell small { position: absolute; bottom: -17px; left: 0; right: 0; text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cell.on    { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); transform: translateY(-3px); }
.cell.ok    { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.cell.bad   { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.cell.warn  { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.cell.dim   { opacity: .32; }
.cell.win   { border-color: var(--accent-2); background: var(--accent-2-soft); }
.cell.ptr::after { content: attr(data-ptr); position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 11px; font-family: var(--mono); font-weight: 800; color: var(--accent); white-space: nowrap; }
.cells.idx { margin-bottom: 26px; }
.cells.ptr-row { margin-top: 24px; }

/* bars, for sorting + histogram visualizers */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 170px; margin: 16px 0; padding: 0 2px; }
.bars i { flex: 1; min-width: 3px; background: var(--accent); border-radius: 3px 3px 0 0; transition: height .12s, background .12s; display: block; }
.bars i.cmp  { background: var(--amber); }
.bars i.swap { background: var(--red); }
.bars i.done { background: var(--green); }
.bars i.piv  { background: var(--pink); }

/* ---------- Dry-run trace table ---------- */
.trace { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 12px; }
table.tr { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
table.tr th { background: var(--surface-2); padding: 8px 11px; text-align: left; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tr td { padding: 6px 11px; border-bottom: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
table.tr tr:last-child td { border-bottom: 0; }
table.tr tr.hi td { background: var(--accent-soft); color: var(--text); }
table.tr td.k { color: var(--accent); font-weight: 700; }

/* ---------- Pattern cards (the playbook) ---------- */
.pat { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 14px 16px; margin: 12px 0; }
.pat h5 { margin: 0 0 4px; font-size: 14.5px; color: var(--text); }
.pat p { margin: 0; font-size: 14px; color: var(--text-2); }
.pat .sig { font-family: var(--mono); font-size: 12.5px; color: var(--accent); margin-top: 6px; display: block; }

/* ---------- "My convention" callouts ---------- */
.callout.house { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.callout.house .title { color: var(--accent); }
.callout.proof { background: var(--accent-2-soft); border-left: 3px solid var(--accent-2); }
.callout.proof .title { color: var(--accent-2); }

/* ---------- Complexity ladder ---------- */
.ladder { display: grid; gap: 6px; margin: 18px 0; }
.ladder .rung { display: grid; grid-template-columns: 100px 1fr 96px; gap: 12px; align-items: center; font-size: 13.5px; }
.ladder .rung b { font-family: var(--mono); font-size: 13px; }
.ladder .rung .bar { height: 20px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.ladder .rung .bar i { display: block; height: 100%; border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.ladder .rung span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; }

/* ---------- Practice problem lists ---------- */
.plist { display: grid; gap: 6px; margin: 14px 0; }
.pitem { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.pitem .d { font-size: 10.5px; font-family: var(--mono); font-weight: 800; padding: 2px 7px; border-radius: 5px; }
.pitem .d.e { background: var(--green-soft); color: var(--green); }
.pitem .d.m { background: var(--amber-soft); color: var(--amber); }
.pitem .d.h { background: var(--red-soft); color: var(--red); }
.pitem .tag { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

/* ---------- Practice-item resource links (generated by tools/lc-links.js) ---------- */
.pitem .lcs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pitem .lc { font-family: var(--mono); font-size: 10.5px; font-weight: 800; line-height: 1; white-space: nowrap;
  padding: 4px 7px; border-radius: 6px; text-decoration: none; transition: all .15s;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
.pitem .lc:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.pitem .lc.paid { background: var(--amber-soft); color: var(--amber); }
.pitem .lc.paid:hover { background: var(--amber); color: #fff; border-color: var(--amber); }
.pitem .lc.paid::after { content: "★"; margin-left: 3px; font-size: 9px; }
.pitem .lc.ref { background: var(--surface-3); color: var(--muted); }
.pitem .lc.ref:hover { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
@media (max-width: 640px) {
  .pitem { grid-template-columns: auto 1fr; }
  .pitem .tag { grid-column: 1; }
  .pitem .lcs { grid-column: 2; }
}

/* ---------- Tree / graph nodes for inline SVG ---------- */
.diagram .tn circle, .diagram .tn rect { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.8; transition: all .3s; }
.diagram .tn text { font-family: var(--mono); font-weight: 700; font-size: 13px; text-anchor: middle; dominant-baseline: middle; fill: var(--text); }
.diagram .tn.on circle, .diagram .tn.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.6; }
.diagram .tn.visit circle, .diagram .tn.visit rect { fill: var(--accent-2-soft); stroke: var(--accent-2); }
.diagram .tn.done circle, .diagram .tn.done rect { fill: var(--green-soft); stroke: var(--green); }
.diagram .tn.stack circle, .diagram .tn.stack rect { fill: var(--amber-soft); stroke: var(--amber); }
.diagram .tn.bad circle, .diagram .tn.bad rect { fill: var(--red-soft); stroke: var(--red); }
.diagram .tn.nil circle { fill: none; stroke-dasharray: 3 3; opacity: .5; }

\"translate(770,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">📝 Editor\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 38 · undo\u003C/text>\u003C/g>\r\n        <g class=\"node\" data-ch=\"41\" data-t=\"Elevator system\" data-d=\"Car state machines and dispatch strategies.\" transform=\"translate(955,505)\"><rect width=\"130\" height=\"50\" rx=\"12\"/><text x=\"65\" y=\"20\">🛗 Elevator\u003C/text><text x=\"65\" y=\"38\" class=\"chap\">CH 41 · dispatch\u003C/text>\u003C/g>\r\n\r\n        <path id=\"e-solid-str\" class=\"edge dash\" d=\"M465,105 L465,205\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-obs-dom\"   class=\"edge dash\" d=\"M650,255 L650,355\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-ts-lru\"    class=\"edge dash\" d=\"M95,405 L95,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-pc-pub\"    class=\"edge dash\" d=\"M280,405 L280,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-dom-tix\"   class=\"edge dash\" d=\"M650,405 L650,505\" marker-end=\"url(#ah)\"/>\r\n        <path id=\"e-st-elev\"   class=\"edge dash\" d=\"M1085,230 L1105,230 L1105,489 L1020,489 L1020,505\" marker-end=\"url(#ah)\"/>\r\n      \u003C/svg>\r\n      \u003C/div>\r\n      <div class=\"map-info\" id=\"mapInfo\"><span class=\"mi-ico\">👆\u003C/span><div><b>Hover or click a box\u003C/b><span>Dependencies are flowing upward through the layers live.\u003C/span>\u003C/div>\u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\">One code style, all the way through\u003C/h2>\r\n    <p class=\"section-sub reveal\">Every listing in this course is Java written the same way, so the shape of the code becomes a memory aid instead of noise. This is the style, stated once in Chapter 1 and never broken.\u003C/p>\r\n    <div class=\"style-strip reveal\">\r\n      <div>\r\n        <ul>\r\n          <li><b>Interface first.\u003C/b> Name the role — <code>EvictionPolicy\u003C/code>, <code>SpotAllocator\u003C/code> — before writing any class that plays it.\u003C/li>\r\n          <li><b>Constructor injection, final fields.\u003C/b> Every collaborator arrives through the constructor and never changes. No <code>new\u003C/code> buried in a method, no statics.\u003C/li>\r\n          <li><b>Fail fast at the boundary.\u003C/b> Validate arguments in the constructor or public method, then trust them everywhere inside.\u003C/li>\r\n          <li><b>Small classes, no reflex getters.\u003C/b> Behaviour lives next to the data it changes: tell, don’t ask.\u003C/li>\r\n          <li><b>Every design names its pattern and its extension point\u003C/b> — the change it survives without editing old code.\u003C/li>\r\n        \u003C/ul>\r\n      \u003C/div>\r\n      <div>\r\n<pre class=\"code\"><span class=\"k\">public interface\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; {\r\n\t<span class=\"k\">void\u003C/span> <span class=\"f\">keyAccessed\u003C/span>(<span class=\"t\">K\u003C/span> key);\r\n\t<span class=\"t\">K\u003C/span> <span class=\"f\">evict\u003C/span>();\r\n}\r\n\r\n<span class=\"k\">public final class\u003C/span> <span class=\"t\">Cache\u003C/span>&lt;<span class=\"t\">K\u003C/span>, <span class=\"t\">V\u003C/span>&gt; {\r\n\t<span class=\"k\">private final\u003C/span> <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy;\r\n\t<span class=\"k\">private final int\u003C/span> capacity;\r\n\r\n\t<span class=\"k\">public\u003C/span> <span class=\"f\">Cache\u003C/span>(<span class=\"k\">int\u003C/span> capacity, <span class=\"t\">EvictionPolicy\u003C/span>&lt;<span class=\"t\">K\u003C/span>&gt; policy) {\r\n\t\t<span class=\"k\">if\u003C/span> (capacity &lt;= <span class=\"m\">0\u003C/span>) <span class=\"k\">throw new\u003C/span> <span class=\"t\">IllegalArgumentException\u003C/span>(<span class=\"s\">\"capacity must be positive\"\u003C/span>);\r\n\t\t<span class=\"k\">this\u003C/span>.capacity = capacity;\r\n\t\t<span class=\"k\">this\u003C/span>.policy = <span class=\"t\">Objects\u003C/span>.<span class=\"f\">requireNonNull\u003C/span>(policy);\r\n\t}\r\n}\u003C/pre>\r\n        <p class=\"small muted\" style=\"margin:10px 0 0\">LRU, LFU and FIFO are three small classes behind one interface. Adding a fourth never touches <code>Cache\u003C/code>. That is the whole idea.\u003C/p>\r\n      \u003C/div>\r\n    \u003C/div>\r\n\r\n    <h2 class=\"section-title reveal\" id=\"roadmap\">Course roadmap\u003C/h2>\r\n    <p class=\"section-sub reveal\">Go in order — later chapters build on earlier ones. Your progress is saved in this browser.\u003C/p>\r\n    <div id=\"levels\">\u003C/div>\r\n\r\n    <footer class=\"home-foot\">\r\n      <b>Palak Deb Patra's Distributed Systems Playlist\u003C/b> ◆ built for learning, one class at a time.<br>\r\n      <span class=\"small\">© 2026 Palak Deb Patra\u003C/span><br>\r\n      <button class=\"reset-link\" id=\"resetBtn\">Reset my progress\u003C/button>\r\n    \u003C/footer>\r\n  \u003C/div>\r\n\r\n\r\n\r\n","scripts":["\r\n(function(){\r\n  const { CHAPTERS, LEVELS, LS, $, $$, chNum, chName } = DIST;\r\n  // theme button\r\n  const tb = $('#themeBtn');\r\n  const cur = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\r\n  tb.textContent = cur() === 'dark' ? '☀️' : '🌙';\r\n  tb.onclick = () => { const n = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); LS.set('dist-theme', n); tb.textContent = n === 'dark' ? '☀️' : '🌙'; };\r\n\r\n  const done = new Set(LS.get('dist-done', []));\r\n  const quiz = LS.get('dist-quiz', {});\r\n\r\n  // progress ring\r\n  const pct = done.size / CHAPTERS.length;\r\n  setTimeout(() => { $('#ringFg').style.strokeDashoffset = 314.16 * (1 - pct); }, 200);\r\n  $('#ringTxt').textContent = Math.round(pct * 100) + '%';\r\n  $('#progTxt').textContent = `${done.size} of ${CHAPTERS.length} chapters complete`;\r\n  const next = CHAPTERS.find(c => !done.has(c.n));\r\n  if (next) {\r\n    $('#nextUp').innerHTML = `Up next: <a href=\"${next.file}\"><b>${next.icon} ${next.title}\u003C/b>\u003C/a>`;\r\n    if (done.size) { $('#ctaStart').href = next.file; $('#ctaStart').textContent = `Continue: ${chName(next)} →`; }\r\n  } else { $('#nextUp').innerHTML = '🏆 <b>Course complete!\u003C/b> Outstanding work.'; }\r\n\r\n  const levels = LEVELS;\r\n  const nextN = (CHAPTERS.find(x => !done.has(x.n)) || {}).n;\r\n  // the longest level defines the tick size, so that row ends flush right\r\n  const maxLvl = Math.max(...levels.map(([l]) => CHAPTERS.filter(x => x.level === l).length));\r\n  $('#lvlBars').style.setProperty('--n', maxLvl);\r\n  $('#lvlBars').innerHTML = levels.map(([l,c]) => {\r\n    const all = CHAPTERS.filter(x => x.level === l); const d = all.filter(x => done.has(x.n)).length;\r\n    const ticks = all.map(x => `<a class=\"tick${done.has(x.n) ? ' done' : (x.n === nextN ? ' next' : '')}\" href=\"${x.file}\" title=\"${chNum(x)} · ${x.title.replace(/\"/g, '')}${done.has(x.n) ? ' ✓' : ''}\">\u003C/a>`).join('');\r\n    return `<div class=\"row\"><span>${l}\u003C/span><div class=\"ticks\" style=\"--c:${c}\">${ticks}\u003C/div><span>${d}/${all.length}\u003C/span>\u003C/div>`;\r\n  }).join('');\r\n\r\n  // roadmap cards\r\n  const desc = Object.fromEntries(LEVELS.map(([l, , d]) => [l, d]));\r\n  $('#levels').innerHTML = levels.map(([l,c]) => `\r\n    <div class=\"level-block reveal\">\r\n      <div class=\"level-head\"><span class=\"pill\" style=\"background:color-mix(in srgb, ${c} 14%, transparent);color:${c};border-color:transparent\">${l}\u003C/span><h3>${desc[l]}\u003C/h3><div class=\"line\">\u003C/div>\u003C/div>\r\n      <div class=\"chap-grid\">${CHAPTERS.filter(x=>x.level===l).map(ch => `\r\n        <a class=\"chap-card ${done.has(ch.n)?'done':''}\" href=\"${ch.file}\">\r\n          <div class=\"top\"><span class=\"emo\">${ch.icon}\u003C/span><span class=\"no\">${ch.n < 1 ? chName(ch).toUpperCase() : 'CHAPTER ' + String(ch.n).padStart(2,'0')}\u003C/span>\u003C/div>\r\n          <h4>${ch.title}\u003C/h4>\r\n          <p>${ch.blurb}\u003C/p>\r\n          <div class=\"meta\"><span>⏱ ${ch.mins} min\u003C/span>${done.has(ch.n)?'<span class=\"pill done\">✓ Done\u003C/span>':''}${quiz[ch.n]!=null?`<span class=\"pill cyan\">Quiz ${Math.round(quiz[ch.n]*100)}%\u003C/span>`:''}\u003C/div>\r\n        \u003C/a>`).join('')}\u003C/div>\r\n    \u003C/div>`).join('');\r\n  $$('#levels .reveal').forEach(e => setTimeout(() => e.classList.add('in'), 100));\r\n\r\n  // big map interactions\r\n  const map = $('#bigmap'), info = $('#mapInfo');\r\n  $$('.node', map).forEach(n => {\r\n    const ch = CHAPTERS.find(c => c.n === +n.dataset.ch);\r\n    n.addEventListener('mouseenter', () => {\r\n      info.innerHTML = `<span class=\"mi-ico\">${ch.icon}\u003C/span><div><b>${n.dataset.t} → Chapter ${ch.n}: ${ch.title}\u003C/b><span>${n.dataset.d}\u003C/span>\u003C/div>`;\r\n    });\r\n    n.addEventListener('click', () => DIST.go(ch.file));\r\n  });\r\n  const routes = [\r\n    ['e-uml-req','e-req-solid','e-solid-str','e-str-obs','e-obs-dom','e-dom-tix'],\r\n    ['e-solid-cpl','e-cpl-rel','e-rel-di'],\r\n    ['e-fac-dec','e-dec-str','e-str-obs','e-obs-cmd','e-cmd-st','e-st-elev'],\r\n    ['e-ts-pc','e-pc-pub'],\r\n    ['e-ts-lru'],\r\n    ['e-pc-per','e-per-dom','e-dom-ref','e-ref-pb'],\r\n    ['e-per-dom','e-dom-tix'],\r\n  ];\r\n  const colors = ['var(--accent)','color-mix(in srgb, var(--accent-2) 25%, var(--accent))','color-mix(in srgb, var(--accent-2) 50%, var(--accent))','color-mix(in srgb, var(--accent-2) 75%, var(--accent))','var(--accent-2)'];\r\n  let running = false;\r\n  async function fire() {\r\n    const r = routes[Math.floor(Math.random()*routes.length)], col = colors[Math.floor(Math.random()*colors.length)];\r\n    for (const id of r) await DIST.packetAlong(map, $('#'+id, map), { dur: 420, color: col, r: 5 });\r\n  }\r\n  let timer;\r\n  DIST.whenVisible(map, () => { if (!running) { running = true; timer = setInterval(fire, 650); } }, () => { running = false; clearInterval(timer); });\r\n\r\n  $('#resetBtn').onclick = () => { if (confirm('Reset all course progress and quiz scores?')) { LS.set('dist-done', []); LS.set('dist-quiz', {}); location.reload(); } };\r\n})();\r\n"]},"01-why-distributed-is-hard.html":{"title":"Why Distributed Is Hard: The Eight Fallacies","chapter":"1","styles":"","html":"\n\u003C!-- dist:placeholder -->\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 1\u003C/span><span class=\"pill\">Beginner\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>Why Distributed Is Hard: <span class=\"grad\">The Eight Fallacies\u003C/span>\u003C/h1>\n    <p class=\"lead\">The network is not reliable, latency is not zero, and six more assumptions that break systems.\u003C/p>\n  \u003C/section>\n\n  <div class=\"callout warn\">\n    <div class=\"ico\">🚧\u003C/div>\n    <div class=\"body\"><b>This chapter is being written.\u003C/b>\n      The outline below is the plan. Diagrams, a simulator, Java listings, an interview drill and a five-question quiz are on the way.\n    \u003C/div>\n  \u003C/div>\n\n  <h2>What this chapter will cover\u003C/h2>\n  <ol>\n    <li>The eight fallacies\u003C/li>\n    <li>Partial failure\u003C/li>\n    <li>No global clock\u003C/li>\n    <li>What a distributed-systems interview asks\u003C/li>\n  \u003C/ol>\n\n\u003C/main>\n\n","scripts":[]},"02-system-models.html":{"title":"System Models","chapter":"2","styles":"","html":"\n\u003C!-- dist:placeholder -->\n<main class=\"content\">\n\n  <section class=\"hero\">\n    <div class=\"eyebrow\"><span class=\"pill accent\">Chapter 2\u003C/span><span class=\"pill\">Beginner\u003C/span><span class=\"pill\">⏱ 40 min\u003C/span>\u003C/div>\n    <h1>System <span class=\"grad\">Models\u003C/span>\u003C/h1>\n    <p class=\"lead\">Synchronous,
